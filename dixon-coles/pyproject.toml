[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dcscore-independent"
version = "1.5.0"
description = "Independent Dixon-Coles exact-score prediction engine"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3", "scipy>=1.11,<2", "fastapi>=0.110,<1",
  "uvicorn>=0.27,<1", "requests>=2.31,<3", "python-multipart>=0.0.9,<1"
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
video = ["Pillow>=10,<13", "CairoSVG>=2.7,<3"]

[project.scripts]
dcscore = "dcscore.cli:main"

[tool.setuptools.packages.find]
include = ["dcscore*"]

[tool.setuptools.package-data]
dcscore = ["static/*", "calibrations/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
