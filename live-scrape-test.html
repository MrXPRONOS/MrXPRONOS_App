<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
  <title>MrXPRONOS LIVE - Scrape Test</title>

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

    * {
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      margin: 0;
      color: #f3f4f6;
      background:
        radial-gradient(circle at top, rgba(212,175,55,.09), transparent 30%),
        linear-gradient(180deg, #090909 0%, #050505 100%);
    }

    .gold-gradient {
      background: linear-gradient(135deg, #D4AF37 0%, #f5e7a3 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .glass {
      background: rgba(18,18,18,.92);
      backdrop-filter: blur(14px);
    }

    .soft-border {
      border: 1px solid rgba(255,255,255,.07);
    }

    .card-hover {
      transition: all .22s ease;
    }

    .card-hover:hover {
      transform: translateY(-2px);
      border-color: rgba(212,175,55,.45);
      box-shadow: 0 14px 40px rgba(212,175,55,.08);
    }

    .live-pulse {
      animation: pulse-live 1.6s infinite;
    }

    @keyframes pulse-live {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: .35; transform: scale(.86); }
    }

    .safe-wrap {
      word-break: break-word;
      overflow-wrap: anywhere;
    }

    .pronostic-pop {
      position: relative;
      background:
        radial-gradient(circle at 30% 20%, rgba(212,175,55,.12), transparent 45%),
        linear-gradient(180deg, #0c0c0c 0%, #080808 100%);
      border: 1px solid rgba(212,175,55,.28);
      border-radius: 18px;
      padding: 12px 14px;
      box-shadow:
        0 26px 70px rgba(0,0,0,.75),
        0 10px 26px rgba(212,175,55,.12),
        inset 0 1px 0 rgba(255,255,255,.06);
      overflow: hidden;
    }

    .bottom-tabs-safe {
      padding-bottom: env(safe-area-inset-bottom);
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const SUPABASE_URL = "https://nhwafcpndlufzzxexikh.supabase.co";

    /*
      Ce fichier est un clone de test.
      Il appelle uniquement la fonction :
      /functions/v1/live-scrape-test

      Il ne touche pas :
      - /functions/v1/live
      - historique
      - notifications
      - système de partage
    */
    const EDGE_FUNCTION_URL = `${SUPABASE_URL}/functions/v1/live-scrape-test`;

    const { useState, useEffect, useCallback, useMemo } = React;

    let cachedAnonKey = null;

    async function getSupabaseAnonKey() {
      if (cachedAnonKey) return cachedAnonKey;

      try {
        const config = await import("./assets/js/config.js");
        cachedAnonKey = config.supabaseAnonKey;
        return cachedAnonKey;
      } catch (error) {
        console.error("Impossible de charger assets/js/config.js", error);
        throw new Error("Clé Supabase introuvable. Vérifie assets/js/config.js");
      }
    }

    function safeNumber(value, fallback = 0) {
      const n = Number(value);
      return Number.isFinite(n) ? n : fallback;
    }

    function formatPercent(value) {
      const n = safeNumber(value, 0);
      if (n <= 1) return `${Math.round(n * 100)}%`;
      return `${Math.round(n)}%`;
    }

    function formatTime(dateString) {
      if (!dateString) return "Heure inconnue";

      try {
        return new Date(dateString).toLocaleTimeString("fr-FR", {
          hour: "2-digit",
          minute: "2-digit"
        });
      } catch (_) {
        return "Heure inconnue";
      }
    }

    function formatDateTime(dateString) {
      if (!dateString) return "Date inconnue";

      try {
        return new Date(dateString).toLocaleString("fr-FR", {
          day: "2-digit",
          month: "short",
          hour: "2-digit",
          minute: "2-digit"
        });
      } catch (_) {
        return "Date inconnue";
      }
    }

    function leagueName(match) {
      return match?.league?.name || match?.league || "Ligue";
    }

    function totalStat(match, key) {
      return (
        safeNumber(match?.live_stats?.home?.[key], 0) +
        safeNumber(match?.live_stats?.away?.[key], 0)
      );
    }

    function bestPrediction(match) {
      return match?.predictions?.[0] || match?.prediction || null;
    }

    const Icon = ({ name, size = 16, className = "" }) => {
      const map = {
        bolt: "fa-bolt",
        radio: "fa-satellite-dish",
        target: "fa-bullseye",
        calendar: "fa-calendar-days",
        refresh: "fa-rotate-right",
        arrowLeft: "fa-arrow-left",
        clock: "fa-clock",
        chart: "fa-chart-line",
        star: "fa-star",
        fire: "fa-fire",
        futbol: "fa-futbol",
        info: "fa-circle-info",
        x: "fa-xmark"
      };

      return (
        <i
          className={`fa-solid ${map[name] || "fa-circle"} ${className}`}
          style={{ fontSize: size }}
          aria-hidden="true"
        ></i>
      );
    };

    const Badge = ({ children, color = "gold" }) => {
      const styles = {
        gold: "bg-[#D4AF37] text-black",
        green: "bg-green-500/15 text-green-400 border border-green-500/25",
        red: "bg-red-500/15 text-red-400 border border-red-500/25",
        blue: "bg-blue-500/15 text-blue-400 border border-blue-500/25",
        gray: "bg-[#171717] text-gray-300 border border-[#2a2a2a]",
        yellow: "bg-yellow-500/15 text-yellow-300 border border-yellow-500/25"
      };

      return (
        <span className={`inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-[11px] font-bold ${styles[color] || styles.gold}`}>
          {children}
        </span>
      );
    };

    const Card = ({ children, className = "", onClick }) => (
      <div
        onClick={onClick}
        className={`glass soft-border rounded-2xl p-4 card-hover ${onClick ? "cursor-pointer" : ""} ${className}`}
      >
        {children}
      </div>
    );

    const EmptyState = ({ title, subtitle }) => (
      <Card className="text-center py-12 bg-[#101010]">
        <div className="w-14 h-14 mx-auto mb-4 rounded-2xl bg-[#161616] border border-[#232323] flex items-center justify-center">
          <Icon name="chart" className="text-[#D4AF37]" size={22} />
        </div>
        <div className="text-lg font-semibold text-gray-300 mb-2">{title}</div>
        <div className="text-sm text-gray-500 safe-wrap">{subtitle}</div>
      </Card>
    );

    const Header = ({ stats, refreshing, onRefresh }) => (
      <header className="sticky top-0 z-30 glass border-b border-[#202020]">
        <div className="max-w-7xl mx-auto px-4 py-4">
          <div className="flex items-center justify-between gap-3">
            <button
              onClick={() => window.location.href = "index.html"}
              className="w-10 h-10 rounded-xl bg-[#151515] border border-[#292929] flex items-center justify-center text-gray-300"
              type="button"
            >
              <Icon name="arrowLeft" />
            </button>

            <div className="flex-1 min-w-0">
              <div className="text-xs text-gray-500 font-bold uppercase tracking-wider">
                Test scraping isolé
              </div>
              <h1 className="text-xl md:text-2xl font-black gold-gradient truncate">
                MrXPRONOS LIVE
              </h1>
            </div>

            <button
              onClick={onRefresh}
              className="h-10 px-4 rounded-xl bg-[#D4AF37] text-black font-black flex items-center gap-2"
              type="button"
            >
              <Icon name="refresh" className={refreshing ? "animate-spin" : ""} />
              <span className="hidden sm:inline">Actualiser</span>
            </button>
          </div>

          <div className="grid grid-cols-3 gap-2 mt-4">
            <div className="rounded-xl bg-[#101010] border border-[#222] p-3 text-center">
              <div className="text-lg font-black text-red-400">{stats.matches_live}</div>
              <div className="text-[11px] text-gray-500 font-bold">LIVE</div>
            </div>

            <div className="rounded-xl bg-[#101010] border border-[#222] p-3 text-center">
              <div className="text-lg font-black text-[#D4AF37]">{stats.predictions}</div>
              <div className="text-[11px] text-gray-500 font-bold">SIGNAUX</div>
            </div>

            <div className="rounded-xl bg-[#101010] border border-[#222] p-3 text-center">
              <div className="text-lg font-black text-blue-400">{stats.upcoming}</div>
              <div className="text-[11px] text-gray-500 font-bold">À VENIR</div>
            </div>
          </div>
        </div>
      </header>
    );

    const CompactHero = ({ source }) => (
      <div className="mb-6 rounded-3xl p-5 md:p-6 bg-[#101010] border border-[#242424] relative overflow-hidden">
        <div className="absolute top-0 right-0 w-40 h-40 bg-[#D4AF37]/10 blur-3xl rounded-full"></div>

        <div className="relative z-10">
          <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-red-500/10 border border-red-500/20 text-red-400 text-xs font-black mb-3">
            <span className="w-2 h-2 bg-red-500 rounded-full live-pulse"></span>
            SCRAPING TEST
          </div>

          <h2 className="text-2xl md:text-4xl font-black mb-2">
            Live sans toucher au système original
          </h2>

          <p className="text-gray-400 text-sm md:text-base max-w-2xl safe-wrap">
            Cette page lit uniquement la fonction <strong>live-scrape-test</strong>.
            Pas de partage obligatoire, pas d’historique, pas de notifications.
          </p>

          <div className="mt-4 text-xs text-gray-500">
            Source active :
            <span className="text-[#D4AF37] font-bold"> {source || "live-scrape-test"}</span>
          </div>
        </div>
      </div>
    );

    const Tabs = ({ selectedTab, setSelectedTab, stats }) => {
      const tabs = [
        { key: "live", label: "Live", icon: "radio", count: stats.matches_live },
        { key: "upcoming", label: "À venir", icon: "calendar", count: stats.upcoming }
      ];

      return (
        <>
          <div className="hidden md:flex gap-3 mb-6 flex-wrap">
            {tabs.map((tab) => (
              <button
                key={tab.key}
                onClick={() => setSelectedTab(tab.key)}
                className={`px-4 py-2 rounded-xl font-bold transition-colors flex items-center gap-2 ${
                  selectedTab === tab.key
                    ? "bg-[#D4AF37] text-black"
                    : "bg-[#151515] text-gray-300 border border-[#252525]"
                }`}
                type="button"
              >
                <Icon name={tab.icon} />
                {tab.label}

                {safeNumber(tab.count, 0) > 0 && (
                  <span className="min-w-[20px] h-[20px] px-1 rounded-full bg-black/20 flex items-center justify-center text-[11px] font-black">
                    {tab.count}
                  </span>
                )}
              </button>
            ))}
          </div>

          <nav className="md:hidden fixed bottom-0 left-0 right-0 z-40 glass border-t border-[#242424] bottom-tabs-safe">
            <div className="grid grid-cols-2">
              {tabs.map((tab) => (
                <button
                  key={tab.key}
                  onClick={() => setSelectedTab(tab.key)}
                  className={`relative py-3 flex flex-col items-center gap-1 ${
                    selectedTab === tab.key ? "text-[#D4AF37]" : "text-gray-500"
                  }`}
                  type="button"
                >
                  <Icon name={tab.icon} size={18} />
                  <span className="text-[11px] font-black">{tab.label}</span>

                  {safeNumber(tab.count, 0) > 0 && (
                    <span className="absolute top-1 right-[30%] min-w-[18px] h-[18px] px-1 rounded-full bg-[#D4AF37] text-black text-[10px] font-black">
                      {tab.count}
                    </span>
                  )}
                </button>
              ))}
            </div>
          </nav>
        </>
      );
    };

    const StatChip = ({ label, value }) => (
      <div className="rounded-xl bg-[#0b0b0b] border border-[#222] px-3 py-2 text-center">
        <div className="text-sm font-black text-white">{value}</div>
        <div className="text-[10px] text-gray-500 font-bold uppercase">{label}</div>
      </div>
    );

    const TeamName = ({ name, align = "left" }) => (
      <div className={`min-w-0 ${align === "right" ? "text-right" : "text-left"}`}>
        <div className="text-sm md:text-base font-black truncate">{name || "Équipe"}</div>
      </div>
    );

    const PronosticBox = ({ pred }) => {
      if (!pred) return null;

      return (
        <div className="pronostic-pop mt-3">
          <div className="flex items-center justify-between gap-3 mb-2">
            <div className="text-xs font-black text-[#D4AF37] uppercase">
              Pronostic live
            </div>
            <Badge color="green">{formatPercent(pred.probability || pred.reliability || 0)}</Badge>
          </div>

          <div className="text-lg font-black text-white safe-wrap">
            {pred.title || pred.coupon || "Signal détecté"}
          </div>

          <div className="text-sm text-gray-400 mt-2 safe-wrap">
            {pred.message || pred.reason || "Signal généré par le clone scraping."}
          </div>

          {Array.isArray(pred.reasons) && pred.reasons.length > 0 && (
            <div className="mt-3 space-y-1">
              {pred.reasons.slice(0, 4).map((r, i) => (
                <div key={i} className="text-xs text-gray-400 flex gap-2">
                  <span className="text-[#D4AF37]">•</span>
                  <span className="safe-wrap">{r}</span>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    };

    const MatchCard = ({ match, onOpen }) => {
      const pred = bestPrediction(match);

      const minute = match.current_minute || match.minute || 0;
      const corners = totalStat(match, "corner_kicks");
      const shots = totalStat(match, "total_shots");
      const sot = totalStat(match, "shots_on_target");
      const fouls = totalStat(match, "fouls");

      return (
        <Card onClick={() => onOpen(match)}>
          <div className="flex items-center justify-between gap-3 mb-4 flex-wrap">
            <div className="flex items-center gap-2 min-w-0">
              <span className="w-2 h-2 bg-red-500 rounded-full live-pulse"></span>
              <span className="text-red-400 text-xs font-black whitespace-nowrap">
                LIVE {minute}'
              </span>
              <span className="text-gray-600">•</span>
              <span className="text-xs text-gray-400 truncate">{leagueName(match)}</span>
            </div>

            <div className="flex gap-2 flex-wrap">
              {pred ? <Badge color="gold">Signal</Badge> : <Badge color="gray">Observation</Badge>}
              {match.heat_level && (
                <Badge color={match.heat_level === "hot" ? "red" : "gray"}>
                  {match.heat_level}
                </Badge>
              )}
            </div>
          </div>

          <div className="grid grid-cols-[1fr_auto_1fr] items-center gap-2 mb-4">
            <TeamName name={match.home_team} align="right" />

            <div className="px-3 py-2 rounded-xl bg-[#080808] border border-[#252525] font-black text-center min-w-[78px]">
              {safeNumber(match.home_score, 0)}-{safeNumber(match.away_score, 0)}
            </div>

            <TeamName name={match.away_team} align="left" />
          </div>

          <div className="grid grid-cols-4 gap-2">
            <StatChip label="Corners" value={corners} />
            <StatChip label="Tirs" value={shots} />
            <StatChip label="Cadrés" value={sot} />
            <StatChip label="Fautes" value={fouls} />
          </div>

          {pred ? (
            <PronosticBox pred={pred} />
          ) : (
            <div className="mt-4 pt-4 border-t border-[#222] text-xs text-gray-500">
              Aucun signal fiable actuellement — clique pour voir les stats.
            </div>
          )}
        </Card>
      );
    };

    const OpportunityCard = ({ item, onOpen }) => {
      const pred = bestPrediction(item);
      const minute = item.current_minute || item.minute || 0;

      return (
        <Card onClick={() => onOpen(item)} className="border-[#D4AF37]/35">
          <div className="flex items-center gap-2 mb-3">
            <Icon name="star" className="text-[#D4AF37]" />
            <span className="text-sm font-black text-[#D4AF37] uppercase">Top signal</span>
          </div>

          <div className="grid grid-cols-[1fr_auto_1fr] items-center gap-2 mb-3">
            <TeamName name={item.home_team} align="right" />

            <div className="px-3 py-2 rounded-xl bg-[#080808] border border-[#D4AF37]/30 font-black text-center min-w-[78px]">
              {safeNumber(item.home_score, 0)}-{safeNumber(item.away_score, 0)}
            </div>

            <TeamName name={item.away_team} align="left" />
          </div>

          <div className="text-xs text-gray-500 mb-3 text-center">
            {leagueName(item)} • {minute}'
          </div>

          <PronosticBox pred={pred} />
        </Card>
      );
    };

    const UpcomingMatchCard = ({ match }) => (
      <Card className="bg-[#101010]">
        <div className="flex items-center justify-between gap-2 mb-4">
          <div className="text-xs text-gray-400 truncate">{leagueName(match)}</div>

          <Badge color="blue">
            <Icon name="clock" size={11} />
            {formatTime(match.event_date || match.date)}
          </Badge>
        </div>

        <div className="space-y-3">
          <div className="font-black text-sm truncate">{match.home_team || "Équipe A"}</div>
          <div className="text-xs text-gray-600 text-center">vs</div>
          <div className="font-black text-sm truncate">{match.away_team || "Équipe B"}</div>
        </div>

        <div className="mt-4 pt-3 border-t border-[#222] text-xs text-gray-500">
          {formatDateTime(match.event_date || match.date)}
        </div>
      </Card>
    );

    const DetailView = ({ match, onBack }) => {
      const pred = bestPrediction(match);

      const homeStats = match?.live_stats?.home || {};
      const awayStats = match?.live_stats?.away || {};

      const rows = [
        ["Corners", "corner_kicks"],
        ["Tirs", "total_shots"],
        ["Tirs cadrés", "shots_on_target"],
        ["Possession", "possession"],
        ["Fautes", "fouls"],
        ["Jaunes", "yellow_cards"],
        ["Rouges", "red_cards"]
      ];

      return (
        <div>
          <button
            onClick={onBack}
            className="mb-4 px-4 py-2 rounded-xl bg-[#151515] border border-[#252525] text-gray-300 font-bold"
            type="button"
          >
            <Icon name="arrowLeft" /> Retour
          </button>

          <Card>
            <div className="text-xs text-gray-500 mb-2">{leagueName(match)}</div>

            <div className="grid grid-cols-[1fr_auto_1fr] items-center gap-2 mb-4">
              <TeamName name={match.home_team} align="right" />

              <div className="px-4 py-3 rounded-xl bg-[#080808] border border-[#252525] font-black text-center min-w-[90px]">
                {safeNumber(match.home_score, 0)}-{safeNumber(match.away_score, 0)}
              </div>

              <TeamName name={match.away_team} align="left" />
            </div>

            <div className="flex justify-center gap-2 mb-5 flex-wrap">
              <Badge color="red">LIVE {match.current_minute || match.minute || 0}'</Badge>
              <Badge color="gray">{match.status_detail || match.status || "En direct"}</Badge>
            </div>

            {pred && <PronosticBox pred={pred} />}

            <div className="mt-6">
              <div className="font-black mb-3">Stats live</div>

              <div className="overflow-hidden rounded-2xl border border-[#222]">
                {rows.map(([label, key]) => (
                  <div key={key} className="grid grid-cols-[1fr_auto_1fr] items-center border-b border-[#1d1d1d] last:border-b-0">
                    <div className="p-3 text-right font-bold">{safeNumber(homeStats[key], 0)}</div>
                    <div className="p-3 text-xs text-gray-500 min-w-[110px] text-center">{label}</div>
                    <div className="p-3 text-left font-bold">{safeNumber(awayStats[key], 0)}</div>
                  </div>
                ))}
              </div>
            </div>
          </Card>
        </div>
      );
    };

    const App = () => {
      const [liveMatches, setLiveMatches] = useState([]);
      const [opportunities, setOpportunities] = useState([]);
      const [scheduledMatches, setScheduledMatches] = useState([]);

      const [stats, setStats] = useState({
        matches_live: 0,
        predictions: 0,
        upcoming: 0
      });

      const [selectedTab, setSelectedTab] = useState("live");
      const [selectedMatch, setSelectedMatch] = useState(null);

      const [loading, setLoading] = useState(true);
      const [refreshing, setRefreshing] = useState(false);
      const [error, setError] = useState(null);
      const [source, setSource] = useState("live-scrape-test");

      const apiFetch = useCallback(async (endpoint) => {
        const supabaseAnonKey = await getSupabaseAnonKey();

        const separator = endpoint.includes("?") ? "&" : "?";
        const url = `${EDGE_FUNCTION_URL}${endpoint}${separator}t=${Date.now()}`;

        const res = await fetch(url, {
          method: "GET",
          headers: {
            "Authorization": `Bearer ${supabaseAnonKey}`,
            "apikey": supabaseAnonKey,
            "Content-Type": "application/json"
          }
        });

        if (!res.ok) {
          let message = `Erreur API ${res.status}`;

          try {
            const err = await res.json();
            if (err?.error) message = err.error;
          } catch (_) {}

          throw new Error(message);
        }

        return await res.json();
      }, []);

      const fetchAll = useCallback(async (silent = false) => {
        if (!silent) setLoading(true);
        setRefreshing(true);

        try {
          const [matchesData, oppData, todayData] = await Promise.all([
            apiFetch("/matches"),
            apiFetch("/opportunities"),
            apiFetch("/today")
          ]);

          const matches = matchesData.matches || [];
          const opps = oppData.opportunities || [];
          const scheduled = todayData?.data?.scheduled?.matches || [];

          const predictionCount = matches.reduce((acc, m) => {
            return acc + ((m.predictions || []).length > 0 ? 1 : 0);
          }, 0);

          setLiveMatches(matches);
          setOpportunities(opps);
          setScheduledMatches(scheduled);

          setStats({
            matches_live: matches.length,
            predictions: predictionCount || opps.length,
            upcoming: scheduled.length
          });

          setSource(matchesData.source || oppData.source || todayData.source || "live-scrape-test");
          setError(null);
        } catch (e) {
          console.error(e);
          setError(e?.message || "Impossible de charger le live scraping.");
        } finally {
          setLoading(false);
          setRefreshing(false);
        }
      }, [apiFetch]);

      useEffect(() => {
        fetchAll(false);
      }, [fetchAll]);

      useEffect(() => {
        const interval = setInterval(() => {
          fetchAll(true).catch(console.error);
        }, 20000);

        return () => clearInterval(interval);
      }, [fetchAll]);

      useEffect(() => {
        setSelectedMatch(null);
      }, [selectedTab]);

      const bestOpportunity = useMemo(() => {
        return opportunities?.[0] || null;
      }, [opportunities]);

      const otherOpportunities = useMemo(() => {
        if (!bestOpportunity) return opportunities || [];

        const bestId = String(bestOpportunity.id);

        return (opportunities || []).filter((o) => String(o.id) !== bestId);
      }, [opportunities, bestOpportunity]);

      const liveMatchesWithoutOpportunities = useMemo(() => {
        const oppIds = new Set((opportunities || []).map((o) => String(o.id)));

        return (liveMatches || []).filter((m) => !oppIds.has(String(m.id)));
      }, [liveMatches, opportunities]);

      if (error && !loading) {
        return (
          <div className="min-h-screen flex items-center justify-center px-4">
            <div className="max-w-md text-center">
              <div className="text-red-400 text-xl font-black mb-3">Erreur</div>
              <div className="text-gray-400 mb-5 safe-wrap">{error}</div>

              <button
                onClick={() => fetchAll(false)}
                className="px-5 py-3 bg-[#D4AF37] text-black rounded-xl font-black"
                type="button"
              >
                Réessayer
              </button>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen">
          <Header
            stats={stats}
            refreshing={refreshing}
            onRefresh={() => fetchAll(true)}
          />

          <main className="max-w-7xl mx-auto px-4 py-6 pb-28 md:pb-6">
            {selectedMatch ? (
              <DetailView
                match={selectedMatch}
                onBack={() => setSelectedMatch(null)}
              />
            ) : (
              <>
                <CompactHero source={source} />

                <Tabs
                  selectedTab={selectedTab}
                  setSelectedTab={setSelectedTab}
                  stats={stats}
                />

                {loading ? (
                  <div className="py-20 text-center">
                    <div className="w-12 h-12 border-4 border-[#D4AF37] border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
                    <div className="text-gray-400">Chargement du test scraping...</div>
                  </div>
                ) : (
                  <>
                    {selectedTab === "live" && (
                      <>
                        {bestOpportunity && (
                          <section className="mb-8">
                            <div className="text-lg font-black mb-4 flex items-center gap-2">
                              <Icon name="star" className="text-[#D4AF37]" />
                              Meilleure opportunité
                            </div>

                            <OpportunityCard
                              item={bestOpportunity}
                              onOpen={setSelectedMatch}
                            />
                          </section>
                        )}

                        <section className="mb-8">
                          <div className="text-lg font-black mb-4 flex items-center gap-2">
                            <Icon name="target" className="text-[#D4AF37]" />
                            Signaux live
                          </div>

                          {otherOpportunities.length === 0 ? (
                            <EmptyState
                              title={bestOpportunity ? "Aucune autre opportunité" : "Aucun signal live"}
                              subtitle={
                                bestOpportunity
                                  ? "Le signal principal est affiché en haut."
                                  : "Le clone scraping attend un contexte exploitable."
                              }
                            />
                          ) : (
                            <div className="grid gap-4 md:grid-cols-2">
                              {otherOpportunities.map((item) => (
                                <OpportunityCard
                                  key={item.id || `${item.home_team}-${item.away_team}`}
                                  item={item}
                                  onOpen={setSelectedMatch}
                                />
                              ))}
                            </div>
                          )}
                        </section>

                        <section className="mb-8">
                          <div className="text-lg font-black mb-4 flex items-center gap-2">
                            <Icon name="radio" className="text-red-500" />
                            Tous les matchs live
                          </div>

                          {liveMatchesWithoutOpportunities.length === 0 ? (
                            <EmptyState
                              title="Aucun autre match live"
                              subtitle={
                                liveMatches.length === 0
                                  ? "Aucun match live détecté par le scraping actuellement."
                                  : "Tous les matchs live sont déjà affichés dans les signaux."
                              }
                            />
                          ) : (
                            <div className="grid gap-4 md:grid-cols-2">
                              {liveMatchesWithoutOpportunities.map((match) => (
                                <MatchCard
                                  key={match.id}
                                  match={match}
                                  onOpen={setSelectedMatch}
                                />
                              ))}
                            </div>
                          )}
                        </section>
                      </>
                    )}

                    {selectedTab === "upcoming" && (
                      <section className="mb-8">
                        <div className="text-lg font-black mb-4 flex items-center gap-2">
                          <Icon name="calendar" className="text-blue-400" />
                          Matchs à venir
                        </div>

                        {scheduledMatches.length === 0 ? (
                          <EmptyState
                            title="Aucun match à venir"
                            subtitle="Le clone scraping n’a trouvé aucun match programmé sur la période actuelle."
                          />
                        ) : (
                          <div className="grid gap-4 md:grid-cols-2 lg:grid-cols-3">
                            {scheduledMatches.slice(0, 36).map((match) => (
                              <UpcomingMatchCard
                                key={match.id || `${match.home_team}-${match.away_team}-${match.event_date}`}
                                match={match}
                              />
                            ))}
                          </div>
                        )}
                      </section>
                    )}
                  </>
                )}
              </>
            )}
          </main>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
