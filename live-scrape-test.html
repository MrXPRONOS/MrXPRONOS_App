<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
  <title>MrXPRONOS LIVE - Scrape Test</title>

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    * { box-sizing: border-box; font-family: 'Inter', sans-serif; }
    body {
      margin: 0;
      color: #f3f4f6;
      background:
        radial-gradient(circle at top, rgba(212,175,55,.08), transparent 30%),
        linear-gradient(180deg, #090909 0%, #050505 100%);
    }
    .gold-gradient {
      background: linear-gradient(135deg, #D4AF37 0%, #f5e7a3 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .glass { background: rgba(18,18,18,.9); backdrop-filter: blur(12px); }
    .card-hover { transition: all .25s ease; }
    .card-hover:hover {
      transform: translateY(-2px);
      border-color: rgba(212,175,55,.45);
      box-shadow: 0 10px 30px rgba(212,175,55,.08);
    }
    .live-pulse { animation: pulse-live 1.8s infinite; }
    @keyframes pulse-live {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: .4; transform: scale(.9); }
    }
    .custom-scrollbar::-webkit-scrollbar { width: 8px; height: 8px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #0f0f0f; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #2e2e2e; border-radius: 999px; }
    .logo-ring {
      border: 1px solid rgba(255,255,255,.08);
      background: #0b0b0b;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.02);
    }
    .soft-border { border: 1px solid rgba(255,255,255,.06); }
    .mini-dot { width: 7px; height: 7px; border-radius: 999px; display: inline-block; }
    .hero-card {
      background:
        radial-gradient(circle at top right, rgba(212,175,55,.08), transparent 30%),
        #101010;
    }
    .safe-wrap { word-break: break-word; overflow-wrap: anywhere; }

    /* pronostic pop (repris du live original, version courte) */
    .pronostic-pop{
      position: relative;
      background: radial-gradient(circle at 30% 20%, rgba(212,175,55,.10), transparent 45%),
                  linear-gradient(180deg, #0c0c0c 0%, #080808 100%);
      border: 1px solid rgba(212,175,55,.26);
      border-radius: 18px;
      padding: 12px 14px;
      box-shadow:
        0 26px 70px rgba(0,0,0,.80),
        0 14px 30px rgba(0,0,0,.55),
        0 10px 26px rgba(212,175,55,.12),
        inset 0 1px 0 rgba(255,255,255,.06);
      overflow: hidden;
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel">
    // =======================================================
    // CONFIG
    // =======================================================
    const SUPABASE_URL = "https://nhwafcpndlufzzxexikh.supabase.co";
    const EDGE_FUNCTION_URL = `${SUPABASE_URL}/functions/v1/live-scrape-test`; // ✅ clone

    const { useState, useEffect, useCallback, useMemo } = React;

    // =======================================================
    // UTILS
    // =======================================================
    function safeNumber(value, fallback = 0) {
      const n = Number(value);
      return Number.isFinite(n) ? n : fallback;
    }
    function formatPercent(value) {
      // accepte 0-1 ou 0-100
      const n = safeNumber(value, 0);
      if (n <= 1) return `${Math.round(n * 100)}%`;
      return `${Math.round(n)}%`;
    }
    function formatDateTime(ts) {
      try { return new Date(ts).toLocaleString("fr-FR"); } catch { return "-"; }
    }
    function formatTime(ts) {
      try { return new Date(ts).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }); } catch { return "-"; }
    }

    function leagueName(match) {
      return match?.league?.name || match?.league || "Ligue";
    }

    // logos DIRECTS depuis ESPN (fournis par la fonction clone)
    function getTeamLogo(match, side) {
      return side === "home" ? (match?.home_logo || null) : (match?.away_logo || null);
    }
    function getLeagueLogo(match) {
      return match?.league_logo || null;
    }

    // =======================================================
    // UI COMPONENTS (repris du live original, sans historique/notifs/partage)
    // =======================================================
    const Icon = ({ name, size = 18, className = "" }) => {
      const map = {
        target: "fa-bullseye",
        radio: "fa-broadcast-tower",
        star: "fa-star",
        arrowLeft: "fa-arrow-left",
        refresh: "fa-rotate-right",
        calendar: "fa-calendar-alt",
        clock: "fa-clock",
      };
      return <i className={`fas ${map[name] || "fa-circle"} ${className}`} style={{ fontSize: size }} />;
    };

    const Card = ({ children, className = "", onClick, hover = true }) => (
      <div
        onClick={onClick}
        className={`bg-[#121212] border border-[#232323] rounded-2xl p-4 md:p-5 ${hover ? "card-hover" : ""} ${onClick ? "cursor-pointer" : ""} ${className}`}
      >
        {children}
      </div>
    );

    const Badge = ({ children, color = "gray" }) => {
      const colors = {
        green: "bg-green-500/15 text-green-400 border-green-500/30",
        blue: "bg-blue-500/15 text-blue-400 border-blue-500/30",
        red: "bg-red-500/15 text-red-400 border-red-500/30",
        orange: "bg-orange-500/15 text-orange-400 border-orange-500/30",
        yellow: "bg-orange-500/15 text-yellow-300 border-yellow-500/30",
        gold: "bg-[#D4AF37]/15 text-[#D4AF37] border-[#D4AF37]/30",
        gray: "bg-gray-500/10 text-gray-300 border-gray-500/20"
      };
      return (
        <span className={`px-2 py-1 text-[10px] md:text-[11px] rounded-full border inline-flex items-center gap-1 font-medium ${colors[color] || colors.gray}`}>
          {children}
        </span>
      );
    };

    const LogoImg = ({ src, alt, size = 34, className = "" }) => {
      const [failed, setFailed] = useState(false);
      if (!src || failed) {
        return (
          <div className={`logo-ring rounded-full flex items-center justify-center text-gray-500 ${className}`} style={{ width: size, height: size }}>
            <i className="fas fa-shield-alt text-xs"></i>
          </div>
        );
      }
      return (
        <img
          src={src}
          alt={alt}
          onError={() => setFailed(true)}
          className={`logo-ring rounded-full object-contain p-1 ${className}`}
          style={{ width: size, height: size }}
        />
      );
    };

    const TeamRow = ({ name, logo, align = "left" }) => (
      <div className={`flex items-center gap-2 ${align === "right" ? "justify-end" : ""} min-w-0`}>
        {align !== "right" && <LogoImg src={logo} alt={name} size={28} />}
        <span className="font-semibold text-white text-sm md:text-base truncate">{name}</span>
        {align === "right" && <LogoImg src={logo} alt={name} size={28} />}
      </div>
    );

    const StatChip = ({ label, value, valueColor = "text-white", compact = false }) => (
      <div className={`bg-[#0b0b0b] border border-[#202020] rounded-xl text-center ${compact ? "px-2 py-2" : "px-3 py-3"}`}>
        <div className={`${compact ? "text-[10px]" : "text-[11px]"} text-gray-500`}>{label}</div>
        <div className={`${compact ? "text-lg" : "text-2xl"} font-extrabold mt-1 ${valueColor}`}>{value}</div>
      </div>
    );

    const EmptyState = ({ title, subtitle }) => (
      <Card className="text-center py-12 bg-[#101010]" hover={false}>
        <div className="w-14 h-14 mx-auto mb-4 rounded-2xl bg-[#161616] border border-[#232323] flex items-center justify-center">
          <i className="fas fa-chart-bar text-[#D4AF37]"></i>
        </div>
        <div className="text-lg font-semibold text-gray-300 mb-2">{title}</div>
        <div className="text-sm text-gray-500 safe-wrap">{subtitle}</div>
      </Card>
    );

    const PronosticBox = ({ pred }) => {
      if (!pred) return null;
      return (
        <div className="pronostic-pop mt-3">
          <div className="flex items-center justify-between gap-3 mb-2">
            <div className="text-xs font-extrabold text-[#D4AF37] uppercase">Pronostic</div>
            <Badge color="green">{formatPercent(pred.probability || pred.reliability || 0)}</Badge>
          </div>
          <div className="text-lg font-extrabold text-white safe-wrap">{pred.title || "Signal"}</div>
          <div className="text-xs text-gray-300 mt-2 safe-wrap">{pred.message || ""}</div>
        </div>
      );
    };

    const Header = ({ stats, onBack, onRefresh, refreshing }) => {
      return (
        <header className="sticky top-0 z-40 glass border-b border-[#1e1e1e]">
          <div className="max-w-7xl mx-auto px-3 py-3">
            <div className="grid grid-cols-[44px_minmax(0,1fr)_44px] gap-2 items-start">
              <div className="flex items-start">
                <button
                  onClick={onBack}
                  className="w-11 h-11 rounded-2xl hover:bg-[#1a1a1a] soft-border flex items-center justify-center shrink-0"
                  type="button"
                >
                  <Icon name="arrowLeft" size={17} />
                </button>
              </div>

              <div className="min-w-0 flex items-start justify-center gap-2">
                <div className="w-11 h-11 rounded-2xl bg-[#D4AF37]/12 border border-[#D4AF37]/25 flex items-center justify-center shrink-0 mt-0.5">
                  <i className="fas fa-bolt text-[#D4AF37]"></i>
                </div>
                <div className="min-w-0 flex-1">
                  <div className="text-[20px] sm:text-[22px] md:text-[26px] leading-none font-extrabold gold-gradient truncate">
                    MrXPRONOS LIVE (Scrape Test)
                  </div>
                  <div className="text-[10px] sm:text-[11px] text-gray-400 mt-1 leading-tight truncate">
                    {stats.matches_live || 0} live • {stats.predictions || 0} pronos • {stats.upcoming || 0} à venir
                  </div>
                </div>
              </div>

              <div className="flex items-start justify-end">
                <button
                  onClick={onRefresh}
                  className="w-11 h-11 rounded-2xl hover:bg-[#1a1a1a] soft-border flex items-center justify-center shrink-0"
                  type="button"
                >
                  <Icon name="refresh" size={16} className={refreshing ? "animate-spin text-[#D4AF37]" : "text-[#D4AF37]"} />
                </button>
              </div>
            </div>
          </div>
        </header>
      );
    };

    const CompactHero = ({ stats, topCount, upcomingCount }) => (
      <div className="mb-8">
        <Card className="hero-card" hover={false}>
          <div className="flex items-center gap-2 mb-4 flex-wrap">
            <Badge color="gold"><i className="fas fa-satellite-dish"></i> SCRAPE TEST</Badge>
            <Badge color="red"><span className="mini-dot bg-red-500 live-pulse"></span> En direct</Badge>
          </div>

          <div className="text-sm md:text-base text-gray-300 mb-5">
            Clone isolé basé sur ESPN. Aucun historique, aucune notification, aucun partage.
          </div>

          <div className="grid grid-cols-4 gap-2">
            <StatChip compact label="Live" value={stats.matches_live || 0} valueColor="text-red-500" />
            <StatChip compact label="Top" value={topCount || 0} valueColor="text-[#D4AF37]" />
            <StatChip compact label="Pronos" value={stats.predictions || 0} valueColor="text-blue-400" />
            <StatChip compact label="À venir" value={upcomingCount || 0} valueColor="text-green-400" />
          </div>
        </Card>
      </div>
    );

    const OpportunityCard = ({ item, onOpen }) => {
      const best = item?.predictions?.[0];
      if (!best) return null;

      const homeLogo = getTeamLogo(item, "home");
      const awayLogo = getTeamLogo(item, "away");
      const leagueLogo = getLeagueLogo(item);

      return (
        <Card onClick={() => onOpen(item)} className="border-[#D4AF37]/20">
          <div className="flex items-center justify-between gap-3 mb-4 flex-wrap">
            <div className="flex items-center gap-2 flex-wrap">
              <Badge color="gold"><Icon name="star" size={12} /> TOP</Badge>
              <Badge color="green">{formatPercent(best.probability)}</Badge>
              <Badge color="blue">Fiabilité {best.reliability || 0}</Badge>
            </div>

            <div className="flex items-center gap-2 text-xs text-gray-400">
              <LogoImg src={leagueLogo} alt={leagueName(item)} size={20} />
              <span className="truncate max-w-[160px]">{leagueName(item)}</span>
            </div>
          </div>

          <div className="grid grid-cols-[1fr_auto_1fr] items-center gap-2 mb-4">
            <TeamRow name={item.home_team} logo={homeLogo} align="right" />
            <div className="px-2 py-2 rounded-xl bg-[#0a0a0a] border border-[#D4AF37]/30 text-center min-w-[82px]">
              <div className="text-base font-extrabold text-[#D4AF37]">{item.home_score}-{item.away_score}</div>
              <div className="text-[11px] text-gray-400">{item.current_minute}'</div>
            </div>
            <TeamRow name={item.away_team} logo={awayLogo} align="left" />
          </div>

          <PronosticBox pred={best} />
          <div className="text-[11px] text-gray-500 mt-3">Clique pour détails</div>
        </Card>
      );
    };

    const MatchCard = ({ match, onOpen }) => {
      const best = match?.predictions?.[0] || null;

      const totalCorners =
        safeNumber(match?.live_stats?.home?.corner_kicks, 0) +
        safeNumber(match?.live_stats?.away?.corner_kicks, 0);

      const totalFouls =
        safeNumber(match?.live_stats?.home?.fouls, 0) +
        safeNumber(match?.live_stats?.away?.fouls, 0);

      const totalShots =
        safeNumber(match?.live_stats?.home?.total_shots, 0) +
        safeNumber(match?.live_stats?.away?.total_shots, 0);

      const homeLogo = getTeamLogo(match, "home");
      const awayLogo = getTeamLogo(match, "away");
      const leagueLogo = getLeagueLogo(match);

      return (
        <Card onClick={() => onOpen(match)}>
          <div className="flex items-center justify-between mb-4 gap-3 flex-wrap">
            <div className="flex items-center gap-2 min-w-0">
              <span className="w-2 h-2 bg-red-500 rounded-full live-pulse"></span>
              <span className="text-red-500 text-xs font-bold whitespace-nowrap">
                LIVE {match.current_minute || 0}'
              </span>
              <span className="text-gray-600">•</span>
              <div className="flex items-center gap-2 text-xs text-gray-400 min-w-0">
                <LogoImg src={leagueLogo} alt={leagueName(match)} size={18} />
                <span className="truncate">{leagueName(match)}</span>
              </div>
            </div>

            <div className="flex items-center gap-2 flex-wrap justify-end">
              {match.heat_level && <Badge color="gray">{match.heat_level}</Badge>}
            </div>
          </div>

          <div className="grid grid-cols-[1fr_auto_1fr] items-center gap-2 mb-4">
            <TeamRow name={match.home_team} logo={homeLogo} align="right" />
            <div className="px-2 py-2 rounded-xl bg-[#0a0a0a] border border-[#252525] font-bold text-center min-w-[78px]">
              <div className="text-base">{match.home_score}-{match.away_score}</div>
            </div>
            <TeamRow name={match.away_team} logo={awayLogo} align="left" />
          </div>

          <div className="grid grid-cols-3 gap-2 mb-4">
            <StatChip compact label="Corners" value={totalCorners} />
            <StatChip compact label="Fautes" value={totalFouls} />
            <StatChip compact label="Tirs" value={totalShots} />
          </div>

          {best ? (
            <div className="pt-4 border-t border-[#222]">
              <div className="flex items-center gap-2 flex-wrap mb-2">
                <Badge color="gold">{best.badge || "Signal"}</Badge>
                <Badge color="green">{formatPercent(best.probability)}</Badge>
                <Badge color="blue">Fiabilité {best.reliability || 0}</Badge>
              </div>
              <PronosticBox pred={best} />
            </div>
          ) : (
            <div className="pt-4 border-t border-[#222] text-xs text-gray-500">
              Aucun pronostic fiable actuellement — clique pour détails
            </div>
          )}
        </Card>
      );
    };

    const UpcomingMatchCard = ({ match }) => {
      const leagueLogo = getLeagueLogo(match);
      const homeLogo = getTeamLogo(match, "home");
      const awayLogo = getTeamLogo(match, "away");

      return (
        <Card className="bg-[#101010]">
          <div className="flex items-center justify-between mb-3 gap-2">
            <div className="flex items-center gap-2 text-xs text-gray-400 min-w-0">
              <LogoImg src={leagueLogo} alt={leagueName(match)} size={18} />
              <span className="truncate">{leagueName(match)}</span>
            </div>
            <Badge color="gray">
              <Icon name="clock" size={11} /> {match.event_date ? formatTime(match.event_date) : "Heure inconnue"}
            </Badge>
          </div>

          <div className="space-y-3">
            <div className="flex items-center gap-2 min-w-0">
              <LogoImg src={homeLogo} alt={match.home_team} size={28} />
              <span className="font-semibold text-sm truncate">{match.home_team}</span>
            </div>
            <div className="text-xs text-gray-500 text-center">vs</div>
            <div className="flex items-center gap-2 min-w-0">
              <LogoImg src={awayLogo} alt={match.away_team} size={28} />
              <span className="font-semibold text-sm truncate">{match.away_team}</span>
            </div>
          </div>
        </Card>
      );
    };

    const MatchDetail = ({ match, onClose }) => {
      const [tab, setTab] = useState("signals");
      if (!match) return null;

      const homeLogo = getTeamLogo(match, "home");
      const awayLogo = getTeamLogo(match, "away");
      const leagueLogo = getLeagueLogo(match);

      const totalCorners =
        safeNumber(match?.live_stats?.home?.corner_kicks, 0) +
        safeNumber(match?.live_stats?.away?.corner_kicks, 0);

      const totalFouls =
        safeNumber(match?.live_stats?.home?.fouls, 0) +
        safeNumber(match?.live_stats?.away?.fouls, 0);

      const totalShots =
        safeNumber(match?.live_stats?.home?.total_shots, 0) +
        safeNumber(match?.live_stats?.away?.total_shots, 0);

      return (
        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-3">
          <div className="bg-[#121212] border border-[#262626] rounded-3xl w-full max-w-5xl max-h-[92vh] overflow-hidden shadow-2xl">
            <div className="p-4 border-b border-[#2a2a2a]">
              <div className="flex justify-between items-start gap-3">
                <div className="min-w-0">
                  <div className="flex items-center gap-2 mb-2 flex-wrap">
                    <span className="w-2 h-2 bg-red-500 rounded-full live-pulse"></span>
                    <span className="text-red-500 text-sm font-bold">LIVE {match.current_minute || 0}'</span>
                    <span className="text-gray-500">|</span>
                    <div className="flex items-center gap-2 text-gray-400 text-sm min-w-0">
                      <LogoImg src={leagueLogo} alt={leagueName(match)} size={20} />
                      <span className="truncate">{leagueName(match)}</span>
                    </div>
                  </div>

                  <div className="grid grid-cols-[1fr_auto_1fr] items-center gap-2">
                    <TeamRow name={match.home_team} logo={homeLogo} align="right" />
                    <div className="text-2xl md:text-4xl font-extrabold gold-gradient whitespace-nowrap">
                      {match.home_score}-{match.away_score}
                    </div>
                    <TeamRow name={match.away_team} logo={awayLogo} align="left" />
                  </div>
                </div>

                <button onClick={onClose} className="p-2 rounded-lg hover:bg-[#1a1a1a] shrink-0" type="button">
                  <i className="fas fa-times"></i>
                </button>
              </div>
            </div>

            <div className="flex border-b border-[#2a2a2a]">
              {["signals", "stats"].map((t) => (
                <button
                  key={t}
                  onClick={() => setTab(t)}
                  className={`flex-1 py-3 text-sm capitalize ${tab === t ? "text-[#D4AF37] border-b-2 border-[#D4AF37]" : "text-gray-400"}`}
                  type="button"
                >
                  {t === "signals" ? "Pronostics" : "Statistiques"}
                </button>
              ))}
            </div>

            <div className="p-4 overflow-y-auto max-h-[60vh] custom-scrollbar">
              {tab === "signals" && (
                <div className="space-y-4">
                  {(match.predictions || []).length === 0 ? (
                    <div className="text-center text-gray-500 py-8">Aucun pronostic actuellement</div>
                  ) : (
                    (match.predictions || []).map((p, i) => (
                      <div key={p.id || i} className="bg-[#0a0a0a] rounded-2xl p-4 border border-[#222]">
                        <div className="flex items-center justify-between gap-3 mb-3 flex-wrap">
                          <div className="flex gap-2 items-center flex-wrap">
                            <Badge color="gold">{p.badge || "Signal"}</Badge>
                          </div>
                          <div className="flex items-center gap-2">
                            <Badge color="green">{formatPercent(p.probability)}</Badge>
                            <Badge color="blue">Fiabilité {p.reliability || 0}</Badge>
                          </div>
                        </div>
                        <PronosticBox pred={p} />
                        <div className="text-sm text-[#D4AF37] mt-3 mb-2 safe-wrap">{p.message}</div>
                        {(p.reasons || []).length > 0 && (
                          <div className="space-y-1">
                            {(p.reasons || []).slice(0, 5).map((r, idx) => (
                              <div key={idx} className="text-sm text-gray-300 safe-wrap">• {r}</div>
                            ))}
                          </div>
                        )}
                      </div>
                    ))
                  )}
                </div>
              )}

              {tab === "stats" && (
                <div className="space-y-4">
                  <Card hover={false} className="bg-[#0d0d0d]">
                    <div className="text-xs text-gray-400 mb-2">Stats clés</div>
                    <div className="text-sm">Corners: {totalCorners}</div>
                    <div className="text-sm">Fautes: {totalFouls}</div>
                    <div className="text-sm">Tirs: {totalShots}</div>
                  </Card>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    };

    const DesktopTabs = ({ selectedTab, setSelectedTab, liveCount, upcomingCount }) => {
      const tabs = [
        { key: "live", label: "Live", count: liveCount },
        { key: "upcoming", label: "À venir", count: upcomingCount },
      ];

      return (
        <div className="hidden md:flex gap-3 mb-6 flex-wrap">
          {tabs.map(t => (
            <button
              key={t.key}
              onClick={() => setSelectedTab(t.key)}
              className={`relative px-4 py-2 rounded-xl font-semibold transition-colors ${
                selectedTab === t.key
                  ? "bg-[#D4AF37] text-black"
                  : "bg-[#151515] text-gray-300 border border-[#252525]"
              }`}
              type="button"
            >
              {t.label}
              {safeNumber(t.count, 0) > 0 && (
                <span className="ml-2 inline-flex items-center justify-center min-w-[18px] h-[18px] px-1 rounded-full text-white text-[10px] font-bold align-middle bg-[#D4AF37]">
                  {t.count}
                </span>
              )}
            </button>
          ))}
        </div>
      );
    };

    const MobileBottomTabs = ({ selectedTab, setSelectedTab, upcomingCount, liveCount }) => {
      const items = [
        { key: "live", label: "Live", icon: "fa-bolt", count: liveCount },
        { key: "upcoming", label: "À venir", icon: "fa-calendar-alt", count: upcomingCount },
      ];

      return (
        <nav className="fixed bottom-0 left-0 right-0 z-50 md:hidden glass border-t border-[#1e1e1e]">
          <div className="max-w-7xl mx-auto px-2 py-2" style={{ paddingBottom: "calc(0.5rem + env(safe-area-inset-bottom))" }}>
            <div className="grid grid-cols-2 gap-2">
              {items.map((it) => {
                const active = selectedTab === it.key;
                return (
                  <button
                    key={it.key}
                    onClick={() => setSelectedTab(it.key)}
                    className={`relative flex flex-col items-center justify-center gap-1 py-2 rounded-2xl transition-colors ${
                      active ? "bg-[#D4AF37] text-black" : "text-gray-300 hover:bg-white/5"
                    }`}
                    type="button"
                  >
                    <i className={`fas ${it.icon} ${active ? "" : "text-[#D4AF37]"}`} />
                    <span className="text-[10px] font-extrabold">{it.label}</span>

                    {safeNumber(it.count, 0) > 0 && (
                      <span className="absolute top-1 right-2 min-w-[18px] h-[18px] px-1 rounded-full text-[10px] font-extrabold text-white bg-[#D4AF37]">
                        {it.count}
                      </span>
                    )}
                  </button>
                );
              })}
            </div>
          </div>
        </nav>
      );
    };

    // =======================================================
    // APP
    // =======================================================
    const App = () => {
      const [liveMatches, setLiveMatches] = useState([]);
      const [opportunities, setOpportunities] = useState([]);
      const [scheduledMatches, setScheduledMatches] = useState([]);

      const [stats, setStats] = useState({ matches_live: 0, predictions: 0, upcoming: 0 });

      const [loading, setLoading] = useState(true);
      const [refreshing, setRefreshing] = useState(false);
      const [error, setError] = useState(null);

      const [selectedTab, setSelectedTab] = useState("live"); // live | upcoming
      const [selectedMatch, setSelectedMatch] = useState(null);

      useEffect(() => {
        setSelectedMatch(null);
      }, [selectedTab]);

      // ✅ fetch simple (comme live.html original)
      const apiFetch = useCallback(async (endpoint) => {
        const url = `${EDGE_FUNCTION_URL}${endpoint}${endpoint.includes("?") ? "&" : "?"}t=${Date.now()}`;
        const res = await fetch(url);
        if (!res.ok) {
          let message = `Erreur API ${res.status}`;
          try {
            const err = await res.json();
            if (err?.error) message = err.error;
          } catch (_) {}
          throw new Error(message);
        }
        return res.json();
      }, []);

      const fetchAll = useCallback(async (silent = false) => {
        if (!silent) setLoading(true);
        setRefreshing(true);

        try {
          const [matchesData, oppData, todayData] = await Promise.all([
            apiFetch("/matches"),
            apiFetch("/opportunities"),
            apiFetch("/today"),
          ]);

          const matches = matchesData.matches || [];
          const opps = oppData.opportunities || [];
          const scheduled = todayData?.data?.scheduled?.matches || [];

          setLiveMatches(matches);
          setOpportunities(opps);
          setScheduledMatches(scheduled);

          const predictionsCount = matches.reduce(
            (acc, m) => acc + ((m.predictions || []).length > 0 ? 1 : 0),
            0
          );

          setStats({
            matches_live: matches.length,
            predictions: predictionsCount,
            upcoming: scheduled.length,
          });

          setError(null);
        } catch (e) {
          console.error(e);
          setError(e?.message || "Impossible de charger les données live.");
        } finally {
          setLoading(false);
          setRefreshing(false);
        }
      }, [apiFetch]);

      useEffect(() => { fetchAll(false); }, [fetchAll]);

      useEffect(() => {
        const interval = setInterval(() => {
          fetchAll(true).catch(console.error);
        }, 20000);
        return () => clearInterval(interval);
      }, [fetchAll]);

      const bestOpportunity = useMemo(() => opportunities?.[0] || null, [opportunities]);

      const otherOpportunities = useMemo(() => {
        if (!bestOpportunity) return opportunities || [];
        const bestId = String(bestOpportunity.id);
        return (opportunities || []).filter((o) => String(o.id) !== bestId);
      }, [opportunities, bestOpportunity]);

      const liveMatchesWithoutOpportunities = useMemo(() => {
        const oppIds = new Set((opportunities || []).map((o) => String(o.id)));
        return (liveMatches || []).filter((m) => !oppIds.has(String(m.id)));
      }, [liveMatches, opportunities]);

      if (error && !loading) {
        return (
          <div className="min-h-screen flex items-center justify-center px-4">
            <div className="text-center">
              <div className="text-red-500 text-xl mb-3">Erreur</div>
              <div className="text-gray-400 mb-4 safe-wrap">{error}</div>
              <button onClick={() => fetchAll(false)} className="px-4 py-2 bg-[#D4AF37] text-black rounded-lg font-bold" type="button">
                Réessayer
              </button>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-[#0a0a0a]">
          <Header
            stats={stats}
            onBack={() => window.location.href = "index.html"}
            onRefresh={() => fetchAll(true)}
            refreshing={refreshing}
          />

          <main className="max-w-7xl mx-auto px-4 py-6 pb-28 md:pb-6">
            {!selectedMatch && (
              <>
                <CompactHero stats={stats} topCount={opportunities.length || 0} upcomingCount={scheduledMatches.length || 0} />
                <DesktopTabs selectedTab={selectedTab} setSelectedTab={setSelectedTab} liveCount={stats.matches_live || liveMatches.length} upcomingCount={scheduledMatches.length} />

                {loading ? (
                  <div className="py-20 text-center">
                    <div className="w-12 h-12 border-4 border-[#D4AF37] border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
                    <div className="text-gray-400">Chargement...</div>
                  </div>
                ) : (
                  <>
                    {selectedTab === "live" && (
                      <>
                        {bestOpportunity && (
                          <div className="mb-8">
                            <div className="text-lg font-bold mb-4 flex items-center gap-2">
                              <Icon name="star" className="text-[#D4AF37]" />
                              Top opportunity
                            </div>
                            <OpportunityCard item={bestOpportunity} onOpen={setSelectedMatch} />
                          </div>
                        )}

                        <div className="mb-8">
                          <div className="text-lg font-bold mb-4 flex items-center gap-2">
                            <Icon name="target" className="text-[#D4AF37]" />
                            Pronostics live
                          </div>

                          {(otherOpportunities || []).length === 0 ? (
                            <EmptyState
                              title={bestOpportunity ? "Aucune autre opportunité" : "Aucun pronostic"}
                              subtitle={bestOpportunity
                                ? "L'opportunité principale est affichée en haut."
                                : "Le clone scraping attend un contexte suffisamment fiable."
                              }
                            />
                          ) : (
                            <div className="grid gap-4 md:grid-cols-2">
                              {otherOpportunities.map((item) => (
                                <OpportunityCard
                                  key={item.id || `${item.home_team}-${item.away_team}-${item.current_minute}`}
                                  item={item}
                                  onOpen={setSelectedMatch}
                                />
                              ))}
                            </div>
                          )}
                        </div>

                        <div className="mb-8">
                          <div className="text-lg font-bold mb-4 flex items-center gap-2">
                            <Icon name="radio" className="text-red-500" />
                            Tous les matchs live
                          </div>

                          {(liveMatchesWithoutOpportunities || []).length === 0 ? (
                            <EmptyState
                              title="Aucun autre match live"
                              subtitle={liveMatches.length === 0
                                ? "Aucun match live détecté par ESPN actuellement."
                                : "Tous les matchs live ont déjà une opportunité affichée plus haut."
                              }
                            />
                          ) : (
                            <div className="grid gap-4 md:grid-cols-2">
                              {liveMatchesWithoutOpportunities.map((m) => (
                                <MatchCard key={m.id} match={m} onOpen={setSelectedMatch} />
                              ))}
                            </div>
                          )}
                        </div>
                      </>
                    )}

                    {selectedTab === "upcoming" && (
                      <div className="mb-8">
                        <div className="text-lg font-bold mb-4 flex items-center gap-2">
                          <Icon name="calendar" className="text-blue-400" />
                          Matchs à venir
                        </div>

                        {scheduledMatches.length === 0 ? (
                          <EmptyState
                            title="Aucun match à venir"
                            subtitle="Aucun match programmé sur la période actuelle."
                          />
                        ) : (
                          <div className="grid gap-4 md:grid-cols-2 lg:grid-cols-3">
                            {scheduledMatches.slice(0, 24).map((m) => (
                              <UpcomingMatchCard key={m.id || `${m.home_team}-${m.away_team}-${m.event_date}`} match={m} />
                            ))}
                          </div>
                        )}
                      </div>
                    )}
                  </>
                )}
              </>
            )}

            {selectedMatch && (
              <MatchDetail match={selectedMatch} onClose={() => setSelectedMatch(null)} />
            )}
          </main>

          <MobileBottomTabs
            selectedTab={selectedTab}
            setSelectedTab={setSelectedTab}
            upcomingCount={scheduledMatches.length}
            liveCount={stats.matches_live || liveMatches.length}
          />
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
