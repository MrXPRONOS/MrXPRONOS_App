name: BSD V2 - Comparaison cotes indicatives vs fournisseurs

on:
  workflow_dispatch:
    inputs:
      horizon_hours:
        description: "Nombre d'heures futures (max 120)"
        required: false
        default: "48"
        type: string
      max_fixtures:
        description: "Nombre maximal de matchs à venir à auditer; 600 couvre généralement 48h"
        required: false
        default: "600"
        type: string
  push:
    branches:
      - test/bsd-v2-model-vs-external-odds-20261102
    paths:
      - 'bsd/bsd_v2_odds_comparison.py'
      - 'bsd/bsd_v2_odds_comparison_report.py'
      - 'bsd/bsd_v2_market_expansion.py'
      - 'bsd/bsd_v2_all_market_price_audit.py'
      - 'bsd/bsd_v2_odds_comparison_all_markets.py'
      - 'bsd/bsd_v2_odds_all_markets_report.py'
      - 'bsd/test_bsd_v2_all_market_price_audit.py'
      - 'bsd/bsd_v2_market_no_vig.py'
      - 'bsd/test_bsd_v2_market_no_vig.py'
      - 'bsd/bsd_v2_odds_research_adapters.py'
      - 'bsd/test_bsd_v2_odds_research_adapters.py'
      - 'bsd/test_bsd_v2_odds_comparison.py'
      - '.github/workflows/bsd-v2-odds-comparison.yml'
  schedule:
    - cron: '25 8 * * *'

permissions:
  contents: read

concurrency:
  group: bsd-v2-odds-model-vs-provider-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare-odds:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Installer les dependances
        run: python -m pip install requests cryptography
      - name: Verifier syntaxe et tests du comparateur
        run: |
          python -m compileall -q bsd/bsd_v2_odds_comparison.py bsd/bsd_v2_odds_comparison_report.py bsd/bsd_v2_market_expansion.py bsd/bsd_v2_all_market_price_audit.py bsd/bsd_v2_odds_comparison_all_markets.py bsd/bsd_v2_odds_all_markets_report.py bsd/bsd_v2_market_no_vig.py bsd/bsd_v2_odds_research_adapters.py
          python -m unittest discover -s bsd -p 'test_bsd_v2_odds_comparison.py' -v
          python -m unittest discover -s bsd -p 'test_bsd_v2_all_market_price_audit.py' -v
          python -m unittest discover -s bsd -p 'test_bsd_v2_market_no_vig.py' -v
          python -m unittest discover -s bsd -p 'test_bsd_v2_odds_research_adapters.py' -v
      - name: Restaurer historique BSD chiffre
        env:
          BSD_HISTORY_KEY: ${{ secrets.BSD_HISTORY_KEY }}
        run: python bsd/bsd_archive.py restore
      - name: Observer les cotes externes sans modifier la production
        env:
          BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
          PINNWIRE_API_KEY: ${{ secrets.PINNWIRE_API_KEY }}
          ODDSLINK_API_KEY: ${{ secrets.ODDSLINK_API_KEY }}
          MOVIODDS_ENABLE: '1'
          PINNWIRE_USE_DEMO: '0'
          FOOTBALL_MULTI_SOURCE: '0'
          HORIZON_HOURS: ${{ inputs.horizon_hours || '48' }}
          MAX_FIXTURES: ${{ inputs.max_fixtures || '600' }}
        run: |
          python bsd/bsd_v2_odds_comparison_all_markets.py \
            --horizon-hours "${HORIZON_HOURS}" \
            --max-fixtures "${MAX_FIXTURES}"
          python bsd/bsd_v2_odds_all_markets_report.py
          python - <<'PY'
          import json
          r=json.load(open('bsd/odds_all_markets_external_report.json',encoding='utf-8'))
          assert r['schema']=='bsd-v2-all-markets-model-vs-independent-odds-v2'
          assert len(r['catalog'])==25
          assert r['coverage']['provider_pairs']==len(r['pairs'])
          assert r['coverage']['market_rows']==len(r['market_observations'])
          assert all(x['key'] in r['catalog'] for x in r['market_observations'])
          assert all(p['market_code'] and p['source']!='mrxpronos_model' for p in r['pairs'])
          assert len(r['by_market'])==25
          assert all(x['markets_examined']==25 for x in r['fixtures'])
          print('BSD_ODDS_INDEPENDENT_COMPARISON_VALIDATED',{
              'pairs':len(r['pairs']),
              'fixtures':r['coverage']['fixtures_scanned'],
              'market_slots':r['coverage']['market_rows'],
          })
          PY
      - name: Supprimer les donnees historiques dechiffrees
        if: always()
        run: rm -f bsd/all_matches_bsd.json bsd/backfill_state.json
      - name: Publier le rapport de comparaison
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bsd-v2-model-vs-external-odds-${{ github.run_id }}
          path: |
            bsd/odds_all_markets_external_report.json
            bsd/odds_all_markets_external_resume.md
            bsd/odds_all_markets_external_pairs.csv
            bsd/odds_all_markets_external_observations.csv
          retention-days: 60
