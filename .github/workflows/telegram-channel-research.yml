name: Telegram - Veille canal public

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/telegram-channel-research.yml'
  workflow_dispatch:
    inputs:
      days:
        description: "Historique en jours"
        required: false
        type: choice
        default: "3"
        options: ["1", "2", "3", "7"]
  schedule:
    - cron: "20 6 * * *"

permissions:
  contents: read

concurrency:
  group: telegram-channel-research
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install requirements
        run: python -m pip install -r scripts/telegram_research/requirements.txt
      - name: Validate Python
        run: python -m py_compile scripts/telegram_research/extract_history.py scripts/telegram_research/create_session.py
      - name: Collect public Telegram posts
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION_STRING }}
          DAYS: ${{ inputs.days || '3' }}
        run: |
          python scripts/telegram_research/extract_history.py --channel ActuFootZoneFr --days "$DAYS" --out telegram_exports
      - name: Save extracted data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actufootzonefr-${{ github.run_id }}
          path: telegram_exports/
          if-no-files-found: warn
          retention-days: 7
