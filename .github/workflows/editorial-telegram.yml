name: Editorial - Telegram diffusion contrôlée

on:
  workflow_dispatch:
    inputs:
      trigger_source:
        description: "Origine du déclenchement"
        required: false
        default: "manual"
        type: string
      publish:
        description: "Envoyer réellement sur la destination choisie"
        required: true
        type: boolean
        default: true
      destination:
        description: "Destination d'un lancement manuel"
        required: true
        type: choice
        default: "test"
        options:
          - "test"
          - "dry-run"
          - "production"

permissions:
  contents: write

concurrency:
  group: editorial-social-delivery
  cancel-in-progress: false

jobs:
  telegram:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free sender
        run: python -m pip install Pillow requests
      - name: Refresh queue without losing delivery state
        run: python scripts/editorial_queue.py --limit 100

      - name: Router publication Telegram
        id: route
        env:
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER_SOURCE: ${{ inputs.trigger_source || '' }}
          MANUAL_DESTINATION: ${{ inputs.destination || 'test' }}
          PROD_CHAT_ID: ${{ secrets.EDITORIAL_TELEGRAM_CHAT_ID }}
          TEST_CHAT_ID: ${{ secrets.TELEGRAM_TEST_CHAT_ID || '@predict_mrxp' }}
          EDITORIAL_BOT_TOKEN: ${{ secrets.EDITORIAL_TELEGRAM_BOT_TOKEN }}
          TEST_FALLBACK_BOT_TOKEN: ${{ secrets.FOOTBALL_NEWS_BOT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          DEST="$MANUAL_DESTINATION"
          if [ "$TRIGGER_SOURCE" = "cron-job.org" ]; then
            DEST="production"
          fi

          case "$DEST" in
            production)
              test -n "$PROD_CHAT_ID"
              test -n "$EDITORIAL_BOT_TOKEN"
              echo "EDITORIAL_TELEGRAM_CHAT_ID=$PROD_CHAT_ID" >> "$GITHUB_ENV"
              echo "EDITORIAL_TELEGRAM_BOT_TOKEN=$EDITORIAL_BOT_TOKEN" >> "$GITHUB_ENV"
              QUEUE_PATH="assets/data/editorial_share_queue.json"
              ;;
            test)
              if [ -z "$TEST_CHAT_ID" ]; then
                echo "::error::TELEGRAM_TEST_CHAT_ID manquant. Aucun fallback vers la production."
                exit 1
              fi
              TEST_BOT="$EDITORIAL_BOT_TOKEN"
              if [ -z "$TEST_BOT" ]; then TEST_BOT="$TEST_FALLBACK_BOT_TOKEN"; fi
              if [ -z "$TEST_BOT" ]; then
                echo "::error::Aucun bot Telegram disponible pour le canal de test."
                exit 1
              fi
              echo "EDITORIAL_TELEGRAM_CHAT_ID=$TEST_CHAT_ID" >> "$GITHUB_ENV"
              echo "EDITORIAL_TELEGRAM_BOT_TOKEN=$TEST_BOT" >> "$GITHUB_ENV"
              QUEUE_PATH="$RUNNER_TEMP/editorial-test-queue.json"
              cp assets/data/editorial_share_queue.json "$QUEUE_PATH"
              python - "$QUEUE_PATH" <<'PY'
          import json,sys
          from pathlib import Path
          path=Path(sys.argv[1])
          rows=json.loads(path.read_text(encoding="utf-8"))
          for row in rows:
              if not isinstance(row,dict): continue
              row.setdefault("platform_status",{})["telegram"]="not_requested"
              delivered=row.get("delivered")
              if isinstance(delivered,dict):
                  delivered.pop("telegram",None)
          path.write_text(json.dumps(rows,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
              ;;
            dry-run)
              QUEUE_PATH="assets/data/editorial_share_queue.json"
              ;;
            *)
              echo "::error::Destination Telegram inconnue: $DEST"
              exit 1
              ;;
          esac
          echo "destination=$DEST" >> "$GITHUB_OUTPUT"
          echo "queue_path=$QUEUE_PATH" >> "$GITHUB_OUTPUT"
          echo "EDITORIAL_TEST_ROUTE destination=$DEST"

      - name: Vérifier le canal avant diffusion éditoriale de test
        if: ${{ steps.route.outputs.destination == 'test' }}
        env:
          TELEGRAM_TEST_CHAT_ID: ${{ secrets.TELEGRAM_TEST_CHAT_ID || '@predict_mrxp' }}
          TELEGRAM_TEST_GUARD_BOT_TOKEN: ${{ secrets.EDITORIAL_TELEGRAM_BOT_TOKEN || secrets.FOOTBALL_NEWS_BOT_TOKEN }}
        run: python scripts/telegram_test_guard.py
      - name: Send at most one fresh article/advice
        env:
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER_SOURCE: ${{ inputs.trigger_source || '' }}
          REQUESTED_PUBLISH: ${{ inputs.publish || 'true' }}
          AUTO_ENABLED: ${{ vars.EDITORIAL_TELEGRAM_ENABLED || 'false' }}
          ROUTED_DESTINATION: ${{ steps.route.outputs.destination }}
          QUEUE_PATH: ${{ steps.route.outputs.queue_path }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$ROUTED_DESTINATION" = "dry-run" ] || [ "$REQUESTED_PUBLISH" != "true" ]; then
            python scripts/editorial_telegram.py --queue "$QUEUE_PATH"
          elif [ "$TRIGGER_SOURCE" = "cron-job.org" ]; then
            if [ "$AUTO_ENABLED" = "true" ]; then
              python scripts/editorial_telegram.py --publish --max-items 1 --queue "$QUEUE_PATH"
            else
              echo "Production éditoriale automatique désactivée."
              python scripts/editorial_telegram.py --queue "$QUEUE_PATH"
            fi
          else
            test -n "$EDITORIAL_TELEGRAM_BOT_TOKEN"
            test -n "$EDITORIAL_TELEGRAM_CHAT_ID"
            python scripts/editorial_telegram.py --publish --max-items 1 --queue "$QUEUE_PATH"
          fi
      - name: Merge successful Telegram delivery receipts on latest main
        if: ${{ steps.route.outputs.destination == 'production' && inputs.publish == true }}
        shell: bash
        run: |
          set -euo pipefail
          cp assets/data/editorial_share_queue.json "$RUNNER_TEMP/editorial-receipts.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/editorial_merge_receipts.py --receipt "$RUNNER_TEMP/editorial-receipts.json"
            git add assets/data/editorial_share_queue.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "data(editorial): confirm Telegram delivery"
            if git push origin HEAD:main; then exit 0; fi
            echo "Concurrent ledger update, retry $attempt/3"
          done
          echo "::error::Telegram receipt could not be saved. Review last send before retrying."
          exit 1
