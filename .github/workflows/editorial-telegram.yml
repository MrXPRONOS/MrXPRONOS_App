name: Editorial - Telegram diffusion contrôlée

on:
  workflow_dispatch:
    inputs:
      trigger_source:
        description: "Origine du déclenchement"
        required: false
        default: "manual"
        type: string
      publish:
        description: "Publier pour de vrai si les deux secrets dédiés sont disponibles"
        required: true
        type: boolean
        default: false
  schedule:
    - cron: '12 8 * * *'

permissions:
  contents: write

concurrency:
  group: editorial-social-delivery
  cancel-in-progress: false

jobs:
  telegram:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free sender
        run: python -m pip install Pillow requests
      - name: Refresh queue without losing delivery state
        run: python scripts/editorial_queue.py --limit 100
      - name: Send at most one fresh article/advice
        env:
          EDITORIAL_TELEGRAM_BOT_TOKEN: ${{ secrets.EDITORIAL_TELEGRAM_BOT_TOKEN }}
          EDITORIAL_TELEGRAM_CHAT_ID: ${{ secrets.EDITORIAL_TELEGRAM_CHAT_ID }}
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER_SOURCE: ${{ inputs.trigger_source || '' }}
          REQUESTED_PUBLISH: ${{ inputs.publish || 'false' }}
          AUTO_ENABLED: ${{ vars.EDITORIAL_TELEGRAM_ENABLED || 'false' }}
        shell: bash
        run: |
          if [ "$REQUESTED_PUBLISH" = 'true' ] || { [ "$AUTO_ENABLED" = 'true' ] && { [ "$EVENT_NAME" = 'schedule' ] || [ "$TRIGGER_SOURCE" = 'cron-job.org' ]; }; }; then
            python scripts/editorial_telegram.py --publish --max-items 1
          else
            python scripts/editorial_telegram.py
          fi
      - name: Merge successful Telegram delivery receipts on latest main
        shell: bash
        run: |
          set -euo pipefail
          cp assets/data/editorial_share_queue.json "$RUNNER_TEMP/editorial-receipts.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/editorial_merge_receipts.py --receipt "$RUNNER_TEMP/editorial-receipts.json"
            git add assets/data/editorial_share_queue.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "data(editorial): confirm Telegram delivery"
            if git push origin HEAD:main; then exit 0; fi
            echo "Concurrent ledger update, retry $attempt/3"
          done
          echo "::error::Telegram receipt could not be saved. Review last send before retrying."
          exit 1
