name: Public bookmaker browser diagnostic
on:
  push:
    branches: [diagnostic/bookmaker-odds]
    paths:
      - "tools/odds_diagnostic/browser_capture.py"
      - ".github/workflows/bookmaker-browser-diagnostic.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install browser runtime
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Inspect public pages once
        run: python tools/odds_diagnostic/browser_capture.py
      - name: Upload sanitized report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bookmaker-browser-capture
          path: odds_diagnostic_results/browser_capture.json
          if-no-files-found: warn
