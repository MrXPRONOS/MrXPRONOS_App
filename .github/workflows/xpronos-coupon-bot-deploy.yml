name: XPRONOS 4+ - Déploiement bot Telegram (webhook)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/xpronos-coupons-bot/**'
      - 'telegram-coupons-bot/sql/001_coupons_bot.sql'
      - '.github/workflows/xpronos-coupon-bot-deploy.yml'

permissions:
  contents: read

concurrency:
  group: xpronos-coupons-production
  cancel-in-progress: false

jobs:
  production:
    if: github.event_name == 'workflow_dispatch' || vars.XPRONOS_COUPON_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROJECT_REF: nhwafcpndlufzzxexikh
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      XPRONOS_COUPON_BOT_TOKEN: ${{ secrets.XPRONOS_COUPON_BOT_TOKEN }}
      XPRONOS_COUPON_ADMIN_IDS: ${{ vars.XPRONOS_COUPON_ADMIN_IDS }}
      XPRONOS_COUPON_CHANNELS_JSON: ${{ vars.XPRONOS_COUPON_CHANNELS_JSON || '[]' }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Vérifier les prérequis (sans exposer les secrets)
        shell: bash
        run: |
          set -euo pipefail
          for name in SUPABASE_ACCESS_TOKEN XPRONOS_COUPON_BOT_TOKEN XPRONOS_COUPON_ADMIN_IDS; do
            if [ -z "${!name:-}" ]; then echo "::error::Variable GitHub manquante : $name"; exit 1; fi
          done
          if ! [[ "$XPRONOS_COUPON_ADMIN_IDS" =~ ^[0-9]+(,[0-9]+)*$ ]]; then
            echo '::error::XPRONOS_COUPON_ADMIN_IDS doit contenir des identifiants Telegram numériques.'; exit 1
          fi
          python - <<'PY'
          import os,json
          channels=json.loads(os.environ['XPRONOS_COUPON_CHANNELS_JSON'])
          assert isinstance(channels,list), 'XPRONOS_COUPON_CHANNELS_JSON doit être un tableau JSON'
          for x in channels:
              assert isinstance(x.get('id'),str) and isinstance(x.get('url'),str) and x['url'].startswith('https://t.me/'), 'Canal invalide'
          PY
      - name: Installer Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Tester le calcul des cotes avant déploiement
        run: |
          deno test supabase/functions/xpronos-coupons-bot/coupon_logic_test.ts
          deno check --config supabase/functions/xpronos-coupons-bot/deno.json supabase/functions/xpronos-coupons-bot/index.ts
      - name: Installer la CLI Supabase
        uses: supabase/setup-cli@v3
        with:
          version: '2.84.2'
      - name: Vérifier la CLI Supabase avant de l'utiliser
        shell: bash
        run: |
          set -euo pipefail
          command -v supabase
          supabase --version
          supabase functions deploy --help >/dev/null
          supabase secrets set --help >/dev/null
      - name: Préparer les tables isolées avec le token Supabase déjà utilisé
        shell: bash
        run: |
          set -euo pipefail
          # Management API : évite de demander un nouveau secret SUPABASE_DB_URL.
          # Le token existant doit autoriser les requêtes database:write.
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path

          sql = Path('telegram-coupons-bot/sql/001_coupons_bot.sql').read_text(encoding='utf-8')
          project_ref = os.environ['PROJECT_REF']
          endpoint = f'https://api.supabase.com/v1/projects/{project_ref}/database/query'
          payload = json.dumps({'query': sql}).encode('utf-8')
          request = urllib.request.Request(
              endpoint,
              data=payload,
              headers={
                  'Authorization': 'Bearer ' + os.environ['SUPABASE_ACCESS_TOKEN'],
                  'Content-Type': 'application/json',
                  'Accept': 'application/json',
              },
              method='POST',
          )
          try:
              with urllib.request.urlopen(request, timeout=120) as response:
                  if response.status not in (200, 201):
                      raise SystemExit(f'Erreur HTTP {response.status} pendant la préparation des tables')
          except urllib.error.HTTPError as exc:
              raise SystemExit(
                  f'Supabase Management API HTTP {exc.code} : vérifie la validité de '
                  'SUPABASE_ACCESS_TOKEN et son autorisation database:write. '
                  'Aucun jeton ni contenu sensible ne sera affiché.'
              ) from None
          except urllib.error.URLError as exc:
              raise SystemExit('Connexion à Supabase Management API impossible : ' + str(exc.reason)) from None

          print('Tables XPRONOS 4+ configurées via Supabase Management API.')
          PY
      - name: Déployer la fonction Telegram sans toucher aux autres fonctions
        run: supabase functions deploy xpronos-coupons-bot --project-ref "$PROJECT_REF" --no-verify-jwt
      - name: Configurer les secrets Edge et le webhook Telegram
        shell: bash
        run: |
          set -euo pipefail
          webhook_secret="$(openssl rand -hex 32)"
          # Le webhookSecret est automatiquement renouvelé lors de chaque déploiement.
          supabase secrets set \
            "XPRONOS_COUPON_BOT_TOKEN=$XPRONOS_COUPON_BOT_TOKEN" \
            "XPRONOS_COUPON_WEBHOOK_SECRET=$webhook_secret" \
            "XPRONOS_COUPON_ADMIN_IDS=$XPRONOS_COUPON_ADMIN_IDS" \
            "XPRONOS_COUPON_CHANNELS_JSON=$XPRONOS_COUPON_CHANNELS_JSON" \
            --project-ref "$PROJECT_REF" >/dev/null
          response="$(curl --fail --silent --show-error --max-time 20 \
            --request POST "https://api.telegram.org/bot${XPRONOS_COUPON_BOT_TOKEN}/setWebhook" \
            --data-urlencode "url=https://${PROJECT_REF}.supabase.co/functions/v1/xpronos-coupons-bot" \
            --data-urlencode "secret_token=$webhook_secret" \
            --data-urlencode 'max_connections=8' \
            --data-urlencode 'allowed_updates=["message","callback_query"]')"
          BOT_RESPONSE="$response" python - <<'PY'
          import json,os
          r=json.loads(os.environ['BOT_RESPONSE'])
          if not r.get('ok'):
              raise SystemExit('Échec enregistrement webhook Telegram : '+str(r.get('description','erreur')))
          print('Webhook Telegram enregistré avec succès.')
          PY
      - name: Vérifier la configuration Telegram (sans afficher le token)
        shell: bash
        run: |
          set -euo pipefail
          result="$(curl --fail --silent --show-error --max-time 20 \
            "https://api.telegram.org/bot${XPRONOS_COUPON_BOT_TOKEN}/getWebhookInfo")"
          BOT_RESPONSE="$result" PROJECT_REF="$PROJECT_REF" python - <<'PY'
          import json,os
          d=json.loads(os.environ['BOT_RESPONSE']); x=d.get('result',{})
          expected='https://'+os.environ['PROJECT_REF']+'.supabase.co/functions/v1/xpronos-coupons-bot'
          if not d.get('ok') or x.get('url')!=expected:
              raise SystemExit('Le webhook Telegram ne pointe pas vers notre fonction.')
          print('Webhook vérifié; erreurs récentes :', x.get('last_error_message') or 'aucune signalée')
          PY
