name: BSD V2 - Settlement watchdog
run-name: "BSD V2 - Settlement watchdog (${{ inputs.trigger_source || github.event_name }})"

on:
  workflow_dispatch:
    inputs:
      trigger_source:
        description: "Origine cron-job.org ou manuel"
        required: false
        default: "manual"
        type: string

permissions:
  contents: write

concurrency:
  group: bsd-v2-settlement-watchdog
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: python -m pip install requests cryptography pillow
      - name: Compile and run BSD regression tests
        run: |
          python -m compileall -q bsd
          python -m unittest discover -s bsd -p 'test_*.py' -v
      - name: Retry unresolved BSD settlements
        env:
          BSD_API_KEY: '${{ secrets.BSD_API_KEY }}'
        run: python bsd/bsd_v2_settlement_watchdog.py --data data.json --max-requests 120
      - name: Validate and commit settlement-only changes
        id: settlement_commit
        run: |
          python - <<'PY'
          import json
          data=json.load(open("data.json",encoding="utf-8"))
          assert data["source"]=="bsd"
          assert data["model_version"]=="bsd-v2-isolated"
          for row in data.get("matches",[]):
              if row.get("settlement_pending"):
                  assert not row.get("is_finished")
                  assert row.get("status")=="settlement_pending"
          print("BSD_SETTLEMENT_WATCHDOG_OK",data.get("settlement_watchdog",{}))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json bsd/publication_ledger.json bsd/quality_report.json
          if ! git diff --cached --quiet; then
            git commit -m "data(bsd): refresh pending settlements"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # A GITHUB_TOKEN-generated commit to main does NOT automatically trigger
      # the ordinary on:push Pages workflow. Stage only the three BSD public
      # files here; never overwrite website assets, config or Telegram state.
      - name: Prepare settlement-only GitHub Pages update
        if: steps.settlement_commit.outputs.published == 'true'
        run: |
          set -euo pipefail
          mkdir -p .bsd-settlement-site-refresh/bsd
          cp data.json .bsd-settlement-site-refresh/data.json
          cp bsd/publication_ledger.json .bsd-settlement-site-refresh/bsd/publication_ledger.json
          cp bsd/quality_report.json .bsd-settlement-site-refresh/bsd/quality_report.json
          python - <<'PY'
          import json
          from pathlib import Path
          base=Path(".bsd-settlement-site-refresh")
          public=json.loads((base/"data.json").read_text(encoding="utf-8"))
          ledger=json.loads((base/"bsd/publication_ledger.json").read_text(encoding="utf-8"))
          quality=json.loads((base/"bsd/quality_report.json").read_text(encoding="utf-8"))
          assert public["source"]=="bsd" and public["model_version"]=="bsd-v2-isolated"
          assert ledger["schema"]=="bsd-v2-publication-ledger-1"
          assert len(ledger["entries"])>=len(public["matches"])
          assert quality["unexplained_absences"]==0
          expected={
              "data.json",
              "bsd/publication_ledger.json",
              "bsd/quality_report.json",
          }
          files={x.relative_to(base).as_posix() for x in base.rglob("*") if x.is_file()}
          assert files==expected, "Settlement Pages staging must contain only three BSD files"
          print("BSD_SETTLEMENT_SITE_REFRESH_OK",{"files":len(files),"matches":len(public["matches"])})
          PY

      - name: Synchronize settlement-only data on GitHub Pages
        if: steps.settlement_commit.outputs.published == 'true'
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: '${{ secrets.GITHUB_TOKEN }}'
          publish_dir: ./.bsd-settlement-site-refresh
          destination_dir: ./
          keep_files: true
