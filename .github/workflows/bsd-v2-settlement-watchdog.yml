name: BSD V2 - Settlement watchdog
run-name: "BSD V2 - Settlement watchdog (${{ inputs.trigger_source || github.event_name }})"

on:
  workflow_dispatch:
    inputs:
      trigger_source:
        description: "Origine cron-job.org ou manuel"
        required: false
        default: "manual"
        type: string

permissions:
  contents: write

concurrency:
  group: bsd-v2-settlement-watchdog
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: python -m pip install requests cryptography pillow
      - name: Compile and run BSD regression tests
        run: |
          python -m compileall -q bsd
          python -m unittest discover -s bsd -p 'test_*.py' -v
      - name: Retry unresolved BSD settlements
        env:
          BSD_API_KEY: '${{ secrets.BSD_API_KEY }}'
        run: python bsd/bsd_v2_settlement_watchdog.py --data data.json --max-requests 120
      - name: Validate and commit settlement-only changes
        id: settlement_commit
        run: |
          python - <<'PY'
          import json
          data=json.load(open("data.json",encoding="utf-8"))
          assert data["source"]=="bsd"
          assert data["model_version"]=="bsd-v2-isolated"
          for row in data.get("matches",[]):
              if row.get("settlement_pending"):
                  assert not row.get("is_finished")
                  assert row.get("status")=="settlement_pending"
          print("BSD_SETTLEMENT_WATCHDOG_OK",data.get("settlement_watchdog",{}))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json bsd/publication_ledger.json bsd/quality_report.json
          if ! git diff --cached --quiet; then
            git commit -m "data(bsd): refresh pending settlements"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # GITHUB_TOKEN main commits do not trigger the normal Pages workflow.
      # Refresh only the redacted public feed; keep the audit ledger and
      # quality report in the repository, never in GitHub Pages.
      - name: Prepare safe settlement-only public feed
        if: steps.settlement_commit.outputs.published == 'true'
        run: |
          set -euo pipefail
          mkdir -p .bsd-settlement-site-refresh
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.build_public_site import public_copy
          source=json.loads(Path("data.json").read_text(encoding="utf-8"))
          assert source["source"]=="bsd" and source["model_version"]=="bsd-v2-isolated"
          assert isinstance(source["matches"], list)
          public=public_copy(source)
          assert "diagnostics" not in public
          assert "model_odds_observations" not in public
          assert "source" not in public and "model_version" not in public
          target=Path(".bsd-settlement-site-refresh/data.json")
          target.write_text(json.dumps(public,ensure_ascii=False,separators=(",",":")),encoding="utf-8")
          expected={"data.json"}
          actual={p.relative_to(target.parent).as_posix() for p in target.parent.rglob("*") if p.is_file()}
          assert actual==expected, "Settlement staging must contain only redacted public data"
          print("SAFE_SETTLEMENT_SITE_REFRESH_OK", len(public["matches"]))
          PY

      - name: Synchronize settlement-only data on GitHub Pages
        if: steps.settlement_commit.outputs.published == 'true'
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: '${{ secrets.GITHUB_TOKEN }}'
          publish_dir: ./.bsd-settlement-site-refresh
          destination_dir: ./
          keep_files: true
