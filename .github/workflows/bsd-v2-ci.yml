name: BSD V2 - Tests rapides après modifications

on:
  push:
    branches: [main]
    paths:
      - 'bsd/**'
      - 'assets/js/main.js'
      - '.github/workflows/bsd-v2-ci.yml'
      - '.github/workflows/bsd-v2-settlement-watchdog.yml'
      - 'tests/test_bsd_v2_settlement_site_sync.py'
  pull_request:
    branches: [main]
    paths:
      - 'bsd/**'
      - 'assets/js/main.js'
      - '.github/workflows/bsd-v2-ci.yml'
      - '.github/workflows/bsd-v2-settlement-watchdog.yml'
      - 'tests/test_bsd_v2_settlement_site_sync.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bsd-v2-quick-ci
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Python dependencies
        run: python -m pip install requests cryptography pillow
      - name: Python syntax
        run: python -m compileall -q bsd
      - name: All BSD unit tests
        run: python -m unittest discover -s bsd -p 'test_*.py' -v
      - name: Strict multisource qualification and coverage regression tests
        run: python -m unittest tests.test_football_multisource_apply_qualified tests.test_football_multisource_volume_diagnostics tests.test_football_native_bsd_identity_probe -v
      - name: Settlement-only Pages deployment guard tests
        run: python -m unittest tests.test_bsd_v2_settlement_site_sync -v
      - name: Website JavaScript syntax
        run: node --check assets/js/main.js
      - name: Pronostic category selection regression tests
        run: node --test tests/pronos-category-selection.test.cjs
