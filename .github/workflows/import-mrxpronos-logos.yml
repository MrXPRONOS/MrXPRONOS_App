name: Import regenerated Mr XPRONOS logos

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-mrxpronos-logos.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install image tools
        run: sudo apt-get update -y && sudo apt-get install -y imagemagick webp

      - name: Download regenerated source logos
        run: |
          set -euxo pipefail
          mkdir -p /tmp/mxlogo assets/images
          curl -L --fail --retry 3 "https://at.adobe.com/gK4UI1GeXC5mowCp" -o /tmp/mxlogo/horizontal.png
          curl -L --fail --retry 3 "https://at.adobe.com/t82zMANWymkMcvFO" -o /tmp/mxlogo/horizontal-compact.png
          curl -L --fail --retry 3 "https://at.adobe.com/pOcKhTj2EQVNnChs" -o /tmp/mxlogo/emblem.png
          curl -L --fail --retry 3 "https://at.adobe.com/iqOoGdjfULnJpBzU" -o /tmp/mxlogo/stacked.png

      - name: Build web-ready logo variants
        run: |
          set -euxo pipefail

          # Horizontal principal: 1200x400, transparent, Retina-ready.
          convert /tmp/mxlogo/horizontal.png -trim +repage -resize '1120x350>' -background none -gravity center -extent 1200x400 /tmp/mxlogo/horizontal-stage.png
          cwebp -quiet -lossless -m 6 /tmp/mxlogo/horizontal-stage.png -o assets/images/mrxpronos-horizontal.webp

          # Horizontal compact: drawer / tight mobile contexts.
          convert /tmp/mxlogo/horizontal-compact.png -trim +repage -resize '840x255>' -background none -gravity center -extent 900x300 /tmp/mxlogo/horizontal-compact-stage.png
          cwebp -quiet -lossless -m 6 /tmp/mxlogo/horizontal-compact-stage.png -o assets/images/mrxpronos-horizontal-compact.webp

          # Emblem master: generous safe area for PWA/maskable use.
          convert /tmp/mxlogo/emblem.png -trim +repage -resize '860x860>' -background none -gravity center -extent 1024x1024 assets/images/mrxpronos-mark.png
          convert assets/images/mrxpronos-mark.png -resize 512x512 /tmp/mxlogo/mark-512.png
          cwebp -quiet -lossless -m 6 /tmp/mxlogo/mark-512.png -o assets/images/mrxpronos-mark.webp

          # Stacked / vertical brand block.
          convert /tmp/mxlogo/stacked.png -trim +repage -resize '700x700>' -background none -gravity center -extent 768x768 /tmp/mxlogo/stacked-stage.png
          cwebp -quiet -lossless -m 6 /tmp/mxlogo/stacked-stage.png -o assets/images/mrxpronos-stacked.webp
          cp assets/images/mrxpronos-stacked.webp assets/images/mrxpronos-vertical.webp

          # Legacy fallback/logo paths now use the regenerated identity too.
          cp assets/images/mrxpronos-mark.png assets/images/default-logo.png
          cwebp -quiet -lossless -m 6 /tmp/mxlogo/mark-512.png -o assets/images/default-logo.webp
          convert /tmp/mxlogo/horizontal-stage.png assets/images/mrxpronos-logo-maquette.png

          # Favicon + PWA sizes generated from the new emblem master.
          convert assets/images/mrxpronos-mark.png -resize 64x64 assets/images/favicon.png
          cwebp -quiet -lossless -m 6 assets/images/favicon.png -o assets/images/favicon.webp
          convert assets/images/mrxpronos-mark.png -define icon:auto-resize=64,48,32,16 assets/images/favicon.ico

          convert assets/images/mrxpronos-mark.png -resize 180x180 assets/images/apple-touch-icon.png
          convert assets/images/mrxpronos-mark.png -resize 72x72 assets/images/icon-72x72.png
          convert assets/images/mrxpronos-mark.png -resize 96x96 assets/images/icon-96x96.png
          convert assets/images/mrxpronos-mark.png -resize 128x128 assets/images/icon-128x128.png
          convert assets/images/mrxpronos-mark.png -resize 144x144 assets/images/icon-144x144.png
          convert assets/images/mrxpronos-mark.png -resize 152x152 assets/images/icon-152x152.png
          convert assets/images/mrxpronos-mark.png -resize 192x192 assets/images/icon-192x192.png
          convert assets/images/mrxpronos-mark.png -resize 384x384 assets/images/icon-384x384.png
          convert assets/images/mrxpronos-mark.png -resize 512x512 assets/images/icon-512x512.png
          cp assets/images/icon-192x192.png assets/images/icon-192.png
          cp assets/images/icon-512x512.png assets/images/icon-512.png

          # Preserve existing SVG URLs through lightweight wrappers around the new assets.
          H64="$(base64 -w0 /tmp/mxlogo/horizontal-stage.png)"
          M64="$(base64 -w0 assets/images/mrxpronos-mark.png)"
          cat > assets/images/mrxpronos-logo.svg <<EOF
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
            <image href="data:image/png;base64,$H64" width="1200" height="400"/>
          </svg>
          EOF
          cat > assets/images/mrxpronos-mark.svg <<EOF
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
            <image href="data:image/png;base64,$M64" width="1024" height="1024"/>
          </svg>
          EOF

          identify assets/images/mrxpronos-horizontal.webp assets/images/mrxpronos-horizontal-compact.webp assets/images/mrxpronos-mark.png assets/images/mrxpronos-mark.webp assets/images/mrxpronos-stacked.webp assets/images/mrxpronos-vertical.webp assets/images/apple-touch-icon.png assets/images/icon-192x192.png assets/images/icon-512x512.png

      - name: Commit regenerated identity assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/mrxpronos-horizontal.webp                   assets/images/mrxpronos-horizontal-compact.webp                   assets/images/mrxpronos-mark.png                   assets/images/mrxpronos-mark.webp                   assets/images/mrxpronos-mark.svg                   assets/images/mrxpronos-logo.svg                   assets/images/mrxpronos-stacked.webp                   assets/images/mrxpronos-vertical.webp                   assets/images/mrxpronos-logo-maquette.png                   assets/images/default-logo.png                   assets/images/default-logo.webp                   assets/images/favicon.png                   assets/images/favicon.webp                   assets/images/favicon.ico                   assets/images/apple-touch-icon.png                   assets/images/icon-72x72.png                   assets/images/icon-96x96.png                   assets/images/icon-128x128.png                   assets/images/icon-144x144.png                   assets/images/icon-152x152.png                   assets/images/icon-192x192.png                   assets/images/icon-192.png                   assets/images/icon-384x384.png                   assets/images/icon-512x512.png                   assets/images/icon-512.png

          if git diff --cached --quiet; then exit 0; fi
          git commit -m "assets(brand): replace legacy Mr XPRONOS logos with regenerated web variants"
          git fetch origin main
          git rebase origin/main
          git push
