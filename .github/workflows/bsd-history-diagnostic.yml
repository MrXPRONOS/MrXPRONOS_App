name: BSD - Diagnostic historique H2H

on:
  workflow_dispatch:
    inputs:
      league_id:
        description: "Identifiant championnat BSD (85 par défaut)"
        required: false
        default: "85"
      season_id:
        description: "Identifiant saison BSD (0 = saison actuelle)"
        required: false
        default: "0"
      pages:
        description: "Pages à explorer (1-3 ; 200 matchs/page)"
        required: false
        default: "3"

permissions:
  contents: read

jobs:
  bsd-season-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install requests
        run: python -m pip install requests
      - name: Offline BSD unit tests
        run: python -m unittest discover -s bsd -p 'test_*.py' -v
      - name: Fetch current season (5 calls maximum, no publication)
        env:
          BSD_API_KEY: "${{ secrets.BSD_API_KEY }}"
          LEAGUE_ID: "${{ inputs.league_id }}"
          SEASON_ID: "${{ inputs.season_id }}"
          PAGES: "${{ inputs.pages }}"
        run: |
          if [ -z "$BSD_API_KEY" ]; then
            echo "::error::BSD_API_KEY secret manquant"
            exit 1
          fi
          python bsd/bsd_season_diagnostic.py --league-id "$LEAGUE_ID" --season-id "$SEASON_ID" --pages "$PAGES"
