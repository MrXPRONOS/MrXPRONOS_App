name: Configure instant LIVE Telegram Worker secrets
on:
  push:
    branches: [main]
    paths: ['.github/workflows/neon-live-telegram-secrets.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_CHAT_ID_SECONDARY: ${{ secrets.TELEGRAM_CHAT_ID_SECONDARY }}
    steps:
      - name: Configure Worker production Telegram secrets without logging their values
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error,sys
          expected=("CLOUDFLARE_API_TOKEN","TELEGRAM_BOT_TOKEN","TELEGRAM_CHAT_ID","TELEGRAM_CHAT_ID_SECONDARY")
          if any(not os.environ.get(k) for k in expected):
              print("Missing required GitHub Actions secret(s):",",".join(k for k in expected if not os.environ.get(k)))
              sys.exit(1)
          base="https://api.cloudflare.com/client/v4/accounts/9c86118191b804d91b5f5b2c89114999/workers/scripts/mrxpronos-live-telegram-instant/secrets"
          for name in expected[1:]:
              req=urllib.request.Request(base,method="PUT",
                data=json.dumps({"name":name,"type":"secret_text","text":os.environ[name]}).encode(),
                headers={"Authorization":"Bearer "+os.environ["CLOUDFLARE_API_TOKEN"],"Content-Type":"application/json"})
              try:
                  with urllib.request.urlopen(req,timeout=25) as response:
                      obj=json.load(response)
                      if not obj.get("success"): raise ValueError("API rejected secret update")
              except (urllib.error.HTTPError,urllib.error.URLError,ValueError) as e:
                  print("Could not configure "+name+" (error class "+type(e).__name__+")")
                  sys.exit(1)
              print(name+": configured; value hidden")
          print("INSTANT_TELEGRAM_SECRET_SETUP_OK")
          PY
