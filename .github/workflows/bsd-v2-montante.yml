name: BSD V2 - Montante quotidienne

on:
  # Relecture strictement après génération BSD V2 achevée avec succès.
  workflow_run:
    workflows: ['BSD V2 - Generation quotidienne']
    types: [completed]
    branches: [main]
  schedule:
    - cron: '35 6,12,18 * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'bsd/bsd_v2_montante.py'
      - 'bsd/bsd_v2_montante_nim.py'
      - 'bsd/test_bsd_v2_montante.py'
      - 'bsd/test_bsd_v2_montante_nim.py'
      - '.github/workflows/bsd-v2-montante.yml'
      - 'montante/README.md'

permissions:
  contents: write

concurrency:
  group: bsd-v2-montante-daily
  cancel-in-progress: false

jobs:
  select:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            bsd/bsd_v2_montante.py
            bsd/bsd_v2_montante_nim.py
            bsd/test_bsd_v2_montante.py
            bsd/test_bsd_v2_montante_nim.py
            bsd/bsd_v2_guardrails.py
            bsd/bsd_v2_publication_policy.py
            bsd/bsd_archive.py
            bsd/all_matches_bsd.enc.json
            data.json
            montante
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Tester le sélecteur déterministe et la relecture IA (sans appels payants)
        run: |
          python -m compileall -q bsd/bsd_v2_montante.py bsd/bsd_v2_montante_nim.py bsd/test_bsd_v2_montante.py bsd/test_bsd_v2_montante_nim.py
          python -m unittest bsd.test_bsd_v2_montante bsd.test_bsd_v2_montante_nim -v
      - name: Restaurer temporairement l'historique chiffré BSD
        if: github.event_name != 'pull_request'
        env:
          BSD_HISTORY_KEY: ${{ secrets.BSD_HISTORY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$BSD_HISTORY_KEY" ]; then
            echo '::warning::BSD_HISTORY_KEY absent : aucune analyse avec historique ; abstention attendue.'
          else
            python -m pip install 'cryptography>=43,<48'
            umask 077
            python bsd/bsd_archive.py restore
          fi
      - name: Examiner les candidats via NVIDIA NIM, ou s'abstenir
        if: github.event_name != 'pull_request'
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          set -euo pipefail
          python -m bsd.bsd_v2_montante_nim --feed data.json
      - name: Supprimer l'historique en clair du runner
        if: always()
        run: rm -f bsd/all_matches_bsd.json bsd/backfill_state.json
      - name: Archiver UNIQUEMENT la décision et les diagnostics publics
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: montante-daily-${{ github.run_id }}
          path: |
            montante/daily.json
            montante/du-jour.md
          retention-days: 30
      - name: Sauvegarder une sélection immuable et ses rapports
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add montante/ledger.json montante/daily.json montante/du-jour.md
          if git diff --cached --quiet; then
            echo 'Aucune nouvelle décision à enregistrer'
            exit 0
          fi
          git commit -m 'chore(montante): archiver la décision BSD V2 + NVIDIA NIM'
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            sleep "$((attempt * 2))"
          done
          echo 'Impossible de sauvegarder la décision sans conflit' >&2
          exit 1