name: BSD V2 - Montante quotidienne

on:
  # Premier contrôle complet au moment de l'intégration sur main.
  # Les commits de données montante/ledger.json ne relancent pas ce workflow.
  push:
    branches: [main]
    paths:
      - '.github/workflows/bsd-v2-montante.yml'
  # Relecture strictement après génération BSD V2 achevée avec succès.
  workflow_run:
    workflows: ['BSD V2 - Generation quotidienne']
    types: [completed]
    branches: [main]
  schedule:
    - cron: '35 6,12,18 * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'bsd/bsd_v2_montante.py'
      - 'bsd/bsd_v2_montante_nim.py'
      - 'bsd/test_bsd_v2_montante.py'
      - 'bsd/test_bsd_v2_montante_nim.py'
      - '.github/workflows/bsd-v2-montante.yml'
      - 'montante/README.md'

permissions:
  contents: write

concurrency:
  group: bsd-v2-montante-daily
  cancel-in-progress: false

jobs:
  select:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            bsd/bsd_v2_montante.py
            bsd/bsd_v2_montante_nim.py
            bsd/test_bsd_v2_montante.py
            bsd/test_bsd_v2_montante_nim.py
            bsd/bsd_v2_guardrails.py
            bsd/bsd_v2_publication_policy.py
            bsd/bsd_archive.py
            bsd/all_matches_bsd.enc.json
            data.json
            montante
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Tester le sélecteur déterministe et la relecture IA (sans appels payants)
        run: |
          python -m compileall -q bsd/bsd_v2_montante.py bsd/bsd_v2_montante_nim.py bsd/test_bsd_v2_montante.py bsd/test_bsd_v2_montante_nim.py
          python -m unittest bsd.test_bsd_v2_montante bsd.test_bsd_v2_montante_nim -v
      - name: Vérifier le contrat JSON réel de Nemotron après intégration
        if: github.event_name == 'push'
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          python - <<'PY'
          import os
          from bsd.bsd_v2_montante_nim import nvidia_review, _validate_reviews
          key=os.environ.get('NVIDIA_API_KEY','').strip()
          if not key:
              raise SystemExit('NIM_STRUCTURED_PROBE: secret manquant')
          test_id='bsd:synthetic-test|OVER_15'
          example=[{
              'candidate_id':test_id,
              'match':{'home':'Equipe Alpha (fictive)','away':'Equipe Beta (fictive)','competition':'Test synthétique','kickoff_utc':'2027-01-10T18:00:00+00:00'},
              'market':{'selection_key':'OVER_15','label':'Plus de 1,5 but','observed_odds':1.31,'conservative_model_probability_percent':0.86*100,'implied_market_probability_percent':100/1.31},
              'verified_historical_aggregates':{
                  'home_last_8':{'matches':8,'wins':5,'draws':2,'losses':1,'avg_scored':1.8,'avg_conceded':0.9,'over_1_5':7,'over_2_5':5,'btts':5},
                  'away_last_8':{'matches':8,'wins':4,'draws':1,'losses':3,'avg_scored':1.4,'avg_conceded':1.2,'over_1_5':6,'over_2_5':4,'btts':5},
                  'head_to_head_last_5':{'matches':0,'scores_from_current_home_view':[]},
                  'bsd_v2_model_audit':{'expected_goals_total':2.5},
                  'missing_inputs':['verified_starting_lineups','verified_injuries','verified_suspensions','live_team_news']}}]
          answer=nvidia_review(example, api_key=key, timeout=110)
          result=_validate_reviews(answer, {test_id})[test_id]
          print('NIM_STRUCTURED_PROBE: OK format valide, verdict=' + result['verdict'] + ', risk=' + result['risk_level'])
          PY
      - name: Restaurer temporairement l'historique chiffré BSD
        if: github.event_name != 'pull_request'
        env:
          BSD_HISTORY_KEY: ${{ secrets.BSD_HISTORY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$BSD_HISTORY_KEY" ]; then
            echo '::warning::BSD_HISTORY_KEY absent : aucune analyse avec historique ; abstention attendue.'
          else
            python -m pip install 'cryptography>=43,<48'
            umask 077
            python bsd/bsd_archive.py restore
          fi
      - name: Examiner les candidats via NVIDIA NIM, ou s'abstenir
        if: github.event_name != 'pull_request'
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          set -euo pipefail
          python -m bsd.bsd_v2_montante_nim --feed data.json
      - name: Supprimer l'historique en clair du runner
        if: always()
        run: rm -f bsd/all_matches_bsd.json bsd/backfill_state.json
      - name: Archiver UNIQUEMENT la décision et les diagnostics publics
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: montante-daily-${{ github.run_id }}
          path: |
            montante/daily.json
            montante/du-jour.md
          retention-days: 30
      - name: Sauvegarder une sélection immuable et ses rapports
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add montante/ledger.json montante/daily.json montante/du-jour.md
          if git diff --cached --quiet; then
            echo 'Aucune nouvelle décision à enregistrer'
            exit 0
          fi
          git commit -m 'chore(montante): archiver la décision BSD V2 + NVIDIA NIM'
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            sleep "$((attempt * 2))"
          done
          echo 'Impossible de sauvegarder la décision sans conflit' >&2
          exit 1