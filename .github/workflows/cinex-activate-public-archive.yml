name: CineX - Activer archivage reel (validation des droits)

on:
  push:
    branches: [main]
    paths:
      - 'telegram-film-relay/.cinex-archive-activate-once'

permissions:
  contents: read

concurrency:
  group: cinex-archive-activation
  cancel-in-progress: false

jobs:
  activate:
    if: ${{ github.repository == 'MrXPRONOS/MrXPRONOS_App' && github.actor == 'MrXPRONOS' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verifier les droits, activer les garde-fous et lancer un archivage canari
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_SECRETS }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::Secret GH_PAT_SECRETS absent. Activation impossible sans permission GitHub Variables."
            exit 1
          fi

          repo="$GITHUB_REPOSITORY"
          # CINEX_RIGHTS_VERIFIED must have been explicitly attested by the
          # account owner. NEVER create or overwrite the rights attestation.
          rights="$(gh api "repos/$repo/actions/variables/CINEX_RIGHTS_VERIFIED" --jq .value 2>/dev/null || true)"
          if [[ "$rights" != "true" ]]; then
            echo "::error::CINEX_RIGHTS_VERIFIED n'est pas true : aucun archivage reel autorise."
            exit 1
          fi

          for name in CINEX_ARCHIVE_ENABLED CINEX_ARCHIVE_DELETE_APPROVED; do
            if gh api "repos/$repo/actions/variables/$name" --jq .name >/dev/null 2>&1; then
              gh api --method PATCH "repos/$repo/actions/variables/$name" \
                -f name="$name" -f value=true >/dev/null
            else
              gh api --method POST "repos/$repo/actions/variables" \
                -f name="$name" -f value=true >/dev/null
            fi
            actual="$(gh api "repos/$repo/actions/variables/$name" --jq .value)"
            if [[ "$actual" != "true" ]]; then
              echo "::error::$name n'a pas pu etre confirme. Archivage non declenche."
              exit 1
            fi
            echo "$name active"
          done

          # The archive workflow itself rechecks ALL THREE independent
          # variables, bot+owner permissions, 10 most recent verified films,
          # exact private media and every required public poster button.
          # Manual dispatch is limited to two archival deletions per run.
          gh workflow run cinex-public-video-rotation.yml --repo "$repo" --ref main -f apply=true
          echo "Archivage canari demande : au plus deux anciennes videos."
