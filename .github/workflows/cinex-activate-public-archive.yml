name: CineX - Activer archivage reel (validation des droits)

on:
  push:
    branches: [main]
    paths:
      - 'telegram-film-relay/.cinex-archive-activate-once'

permissions:
  contents: read
  actions: write

concurrency:
  group: cinex-archive-activation
  cancel-in-progress: false

jobs:
  activate:
    if: ${{ github.repository == 'MrXPRONOS/MrXPRONOS_App' && github.actor == 'MrXPRONOS' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verifier les trois variables et demander un archivage limite a deux films
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CINEX_RIGHTS_VERIFIED: ${{ vars.CINEX_RIGHTS_VERIFIED }}
          CINEX_ARCHIVE_ENABLED: ${{ vars.CINEX_ARCHIVE_ENABLED }}
          CINEX_ARCHIVE_DELETE_APPROVED: ${{ vars.CINEX_ARCHIVE_DELETE_APPROVED }}
        run: |
          set -euo pipefail
          # Read the actual repository variables injected into the GitHub Actions
          # environment. Do not rely on PAT access to the Variables API.
          for name in CINEX_RIGHTS_VERIFIED CINEX_ARCHIVE_ENABLED CINEX_ARCHIVE_DELETE_APPROVED; do
            if [[ "${!name:-}" != "true" ]]; then
              echo "::error::$name doit etre defini a true dans les variables du depot (Settings / Secrets and variables / Actions / Variables)."
              exit 1
            fi
            echo "$name confirme"
          done

          # The archive workflow rechecks those variables independently, and
          # verifies video/poster/link identity and Telegram permissions again.
          # Manual dispatch cannot delete more than two verified older films.
          gh workflow run cinex-public-video-rotation.yml --repo "$GITHUB_REPOSITORY" --ref main -f apply=true
          echo "Archivage reel limite a deux films demande."
