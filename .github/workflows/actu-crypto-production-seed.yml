name: Actu Crypto - ONE TIME REAL PRODUCTION HISTORY 01-10

on:
  push:
    branches: [feature/actu-crypto-lot-06-10]
    paths:
      - 'crypto/production_seed_v1.py'
      - '.github/workflows/actu-crypto-production-seed.yml'
  workflow_dispatch:
    inputs:
      confirm_real_production:
        description: "Publish real-only #01..#09 sequentially on ACTU_CRYPTO_CHAT_ID?"
        type: boolean
        required: true
        default: false

permissions:
  contents: write

concurrency:
  group: actu-crypto-one-time-production-history
  cancel-in-progress: false

jobs:
  seed:
    if: (github.event_name == 'workflow_dispatch' && inputs.confirm_real_production == true) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[crypto-prod-seed]'))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ACTU_CRYPTO_CHAT_ID: ${{ secrets.ACTU_CRYPTO_CHAT_ID || vars.ACTU_CRYPTO_CHAT_ID }}
      FOOTBALL_NEWS_BOT_TOKEN: ${{ secrets.FOOTBALL_NEWS_BOT_TOKEN }}
      TELEGRAM_ACTU_FOOT_BOT_TOKEN: ${{ secrets.TELEGRAM_ACTU_FOOT_BOT_TOKEN }}
      ACTU_FOOT_BOT_TOKEN: ${{ secrets.ACTU_FOOT_BOT_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      COINGECKO_DEMO_API_KEY: ${{ secrets.COINGECKO_DEMO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install zero-cost API and rendering libraries
        run: |
          python -m pip install 'requests>=2.31,<3' 'Pillow>=10,<12' 'feedparser>=6.0,<7'
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Check offline correctness and demo rejection
        run: |
          python -m unittest crypto.test_publish_crypto_1_5 crypto.test_losers_v2 crypto.test_alerts_v2 crypto.test_fear_v2 crypto.test_dominance_v2 crypto.test_weekly_v2 crypto.test_breaking_v2 crypto.test_exchanges_v2 crypto.test_regulation_v2 -v
      - name: Verify production channel, bot identity and permission
        run: python -m crypto.production_seed_v1 --number 1 --preflight
      - name: "01 — Real market prices and 48h graphics"
        continue-on-error: true
        run: python -m crypto.production_seed_v1 --number 1
      - name: "02 — Real top 5 gainers"
        continue-on-error: true
        run: python -m crypto.production_seed_v1 --number 2
      - name: "03 — Real top 5 losers"
        continue-on-error: true
        run: python -m crypto.production_seed_v1 --number 3
      - name: "04 — REAL alert only if observed threshold"
        continue-on-error: true
        run: python -m crypto.production_seed_v1 --number 4
      - name: "05 — Real fear and greed index"
        continue-on-error: true
        run: python -m crypto.production_seed_v1 --number 5
      - name: "06 — Real bitcoin dominance"
        continue-on-error: true
        run: python -m crypto.production_seed_v1 --number 6
      - name: "07 — Real seven-day recap"
        continue-on-error: true
        run: python -m crypto.production_seed_v1 --number 7
      - name: "08 — Real BTC/ETH breaking only if corroborated"
        continue-on-error: true
        run: python -m crypto.production_seed_v1 --number 8
      - name: "09 — Real exchange news only if attributable and fresh"
        continue-on-error: true
        run: python -m crypto.production_seed_v1 --number 9
      - name: "10 — Hold any legal claims for human approval"
        run: python -m crypto.production_seed_v1 --number 10
      - name: Persist sent Telegram IDs on feature branch (never write main)
        if: always()
        run: |
          if git diff --quiet -- crypto/production_state.json; then
            echo "No production publication to record"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crypto/production_state.json
          git commit -m "chore(crypto): record production seed messages [skip ci]"
          git pull --rebase origin feature/actu-crypto-lot-06-10
          git push origin HEAD:feature/actu-crypto-lot-06-10
      - name: Archive posting register for investigation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actu-crypto-production-history-posting-register
          path: crypto/production_state.json
          retention-days: 90
          if-no-files-found: warn
