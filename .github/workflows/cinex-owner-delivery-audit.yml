name: CineX - audit prive des livraisons et sauvegardes (lecture seule)
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/cinex-owner-delivery-audit.yml'
      - 'telegram-film-relay/scripts/audit_cinex_delivery_d1.py'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit strictly read-only aggregate SQL and never print private user IDs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
        run: python telegram-film-relay/scripts/audit_cinex_delivery_d1.py
