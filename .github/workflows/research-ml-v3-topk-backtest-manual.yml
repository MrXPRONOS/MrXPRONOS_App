name: ML V3 - manual historical V2 vs V3 Top5/10/20 comparison (DISABLED until request)
# This file is intentionally NOT push-triggered, NOT scheduled.
# Run ONLY on explicit instruction when ready to start a NEW historical backtest.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: research-ml-v3-topk-preregistered-manual
  cancel-in-progress: false
jobs:
  one-preregistered-month:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {label: may2025, start: '2025-05-01', end: '2025-05-31'}
          - {label: aug2025, start: '2025-08-01', end: '2025-08-31'}
          - {label: may2026, start: '2026-05-01', end: '2026-05-31'}
          - {label: aug2026, start: '2026-08-01', end: '2026-08-31'}
    env:
      ML_V2_HISTORY_KEY_B64: ${{ secrets.ML_V2_HISTORY_KEY_B64 }}
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/single-ml-v2-20261024
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen ML comparators
        run: python -m pip install numpy scipy scikit-learn requests cryptography lightgbm==4.6.0 catboost==1.2.8
      - name: Check prospective comparator unit tests (synthetic)
        run: PYTHONPATH=.:research python -m unittest research.test_ml_v3_topk_compare research.test_single_ml_v3 -v
      - name: Chronological research replay — only when MANUALLY requested
        run: |
          set -euo pipefail
          PYTHONPATH=.:research python research/single_ml_v2_multisource.py \
            --start "${{ matrix.start }}" --end "${{ matrix.end }}" \
            --max-eval 0 --experimental-v3 \
            --out "/tmp/mlv3-${{ matrix.label }}" \
            > "/tmp/mlv3-${{ matrix.label }}-training.log" 2>&1 || {
              tail -50 "/tmp/mlv3-${{ matrix.label }}-training.log"
              exit 1
            }
          grep 'RETRAIN_V3\|PROGRESS' "/tmp/mlv3-${{ matrix.label }}-training.log" | tail -8
      - name: Select daily 5/10/20 separately on exact common V2/V3 matches
        run: |
          PYTHONPATH=.:research python research/ml_v3_topk_compare.py month \
            --predictions "/tmp/mlv3-${{ matrix.label }}/all_predictions.csv" \
            --start "${{ matrix.start }}" --end "${{ matrix.end }}" \
            --out "/tmp/mlv3-${{ matrix.label }}/daily_8model_aggregate.json"
      - uses: actions/upload-artifact@v4
        with:
          name: mlv3-topk-${{ matrix.label }}
          path: /tmp/mlv3-${{ matrix.label }}/daily_8model_aggregate.json
          if-no-files-found: error
          retention-days: 30
  pooled-preregistered-comparison:
    needs: [one-preregistered-month]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/single-ml-v2-20261024
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy scipy scikit-learn
      - run: PYTHONPATH=.:research python -m unittest research.test_ml_v3_topk_compare -v
      - uses: actions/download-artifact@v4
        with:
          pattern: mlv3-topk-*
          path: /tmp/v3-periods
      - name: Aggregate exact 4-month pairs and paired day + week bootstrap
        run: |
          PYTHONPATH=.:research python research/ml_v3_topk_compare.py pool \
            --inputs /tmp/v3-periods/mlv3-topk-*/daily_8model_aggregate.json \
            --out /tmp/mlv3-topk-final.json --resamples 4000
      - uses: actions/upload-artifact@v4
        with:
          name: mlv3-topk-four-month-results
          path: /tmp/mlv3-topk-final.json
          if-no-files-found: error
          retention-days: 30
