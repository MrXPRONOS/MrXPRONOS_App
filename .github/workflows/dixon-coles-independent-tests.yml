name: Dixon-Coles independant - tests

on:
  push:
    paths:
      - 'dixon-coles/**'
      - '.github/workflows/dixon-coles-independent-tests.yml'
  pull_request:
    paths:
      - 'dixon-coles/**'
      - '.github/workflows/dixon-coles-independent-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dixon-coles
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les dependances
        run: python -m pip install -e '.[test]'
      - name: Executer les tests Dixon-Coles
        run: python -m pytest -q
