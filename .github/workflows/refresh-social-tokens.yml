name: Refresh Social Tokens

on:
  workflow_dispatch:
  schedule:
    # Tous les jours à 04:20 UTC.
    # Utile surtout pour TikTok, dont l'access token ne dure que 24h.
    - cron: "20 4 * * *"

permissions:
  contents: read

jobs:
  refresh-social-tokens:
    name: Refresh Meta Threads TikTok tokens
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Refresh tokens
        run: |
          python scripts/refresh_social_tokens.py --out refreshed_tokens.json
        env:
          GRAPH_API_VERSION: v25.0

          # Meta Facebook + Instagram
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          META_LONG_LIVED_USER_TOKEN: ${{ secrets.META_LONG_LIVED_USER_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_NAME: ${{ secrets.META_PAGE_NAME }}

          # Threads
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_APP_SECRET: ${{ secrets.THREADS_APP_SECRET }}

          # TikTok
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}

      - name: Persist refreshed tokens into GitHub Secrets
        if: ${{ env.GH_PAT_SECRETS != '' }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          path = Path("refreshed_tokens.json")
          if not path.exists():
              print("Aucun fichier refreshed_tokens.json")
              raise SystemExit(0)

          tokens = json.loads(path.read_text(encoding="utf-8"))
          if not tokens:
              print("Aucun token à mettre à jour.")
              raise SystemExit(0)

          repo = os.environ["GITHUB_REPOSITORY"]
          for name, value in tokens.items():
              if not value:
                  continue
              print(f"Mise à jour du secret: {name}")
              subprocess.run(
                  ["gh", "secret", "set", name, "--repo", repo, "--body", value],
                  check=True,
              )
          PY
        env:
          GH_PAT_SECRETS: ${{ secrets.GH_PAT_SECRETS }}
          GH_TOKEN: ${{ secrets.GH_PAT_SECRETS }}
