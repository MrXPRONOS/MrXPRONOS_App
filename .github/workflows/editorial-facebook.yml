name: Editorial - Facebook Page liens du site

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Autoriser un vrai post sur la Page Facebook"
        required: true
        type: boolean
        default: false
  schedule:
    - cron: '12 9 * * *'

permissions:
  contents: write

concurrency:
  group: editorial-social-delivery
  cancel-in-progress: false

jobs:
  facebook:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free HTTP client
        run: python -m pip install requests Pillow
      - name: Refresh editorial queue
        run: python scripts/editorial_queue.py --limit 100
      - name: Post one new site article to Page (opt-in)
        env:
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_PUBLISH: ${{ inputs.publish || 'false' }}
          AUTO_ENABLED: ${{ vars.EDITORIAL_FACEBOOK_ENABLED || 'false' }}
        shell: bash
        run: |
          if [ "$REQUESTED_PUBLISH" = 'true' ] || { [ "$EVENT_NAME" = 'schedule' ] && [ "$AUTO_ENABLED" = 'true' ]; }; then
            python scripts/editorial_facebook.py --publish
          else
            python scripts/editorial_facebook.py
          fi
      - name: Merge successful Facebook delivery receipts on latest main
        shell: bash
        run: |
          set -euo pipefail
          cp assets/data/editorial_share_queue.json "$RUNNER_TEMP/editorial-receipts.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/editorial_merge_receipts.py --receipt "$RUNNER_TEMP/editorial-receipts.json"
            git add assets/data/editorial_share_queue.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "data(editorial): confirm Facebook delivery"
            if git push origin HEAD:main; then exit 0; fi
            echo "Concurrent ledger update, retry $attempt/3"
          done
          echo "::error::Facebook receipt could not be saved. Review last send before retrying."
          exit 1
