name: CinéX Anime - Qualité sans publication

on:
  pull_request:
    paths:
      - 'telegram-film-relay/film_relay/anime_*.py'
      - 'telegram-film-relay/film_relay/episode_identity.py'
      - 'telegram-film-relay/film_relay/short_series.py'
      - 'telegram-film-relay/tests/test_anime*.py'
      - 'telegram-film-relay/scripts/merge_anime_catalog.py'
      - 'telegram-film-relay/scripts/generate_anime_dashboard.py'
      - 'telegram-film-relay/scripts/verify_repair_anime_legacy.py'
      - '.github/workflows/cinex-anime-legacy-repair.yml'
      - 'anime-dashboard.html'
      - 'anime-dashboard-data.json'
      - '.github/workflows/telegram-film-relay.yml'
      - '.github/workflows/cinex-rescue-channels.yml'
      - '.github/workflows/cinex-anime-legacy-repair.yml'
      - 'telegram-film-relay/scripts/check_personal_cooldown.py'
      - 'telegram-film-relay/tests/test_personal_session_pacing.py'
      - 'telegram-film-relay/film_relay/catalog_scan.py'
      - 'telegram-film-relay/film_relay/runner.py'
      - 'telegram-film-relay/film_relay/discovery.py'
      - '.github/workflows/cinex-anime-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  anime-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les dépendances sans secrets
        run: python -m pip install -r telegram-film-relay/requirements.txt
      - name: Vérifier la syntaxe du relais, des scripts et des tests
        working-directory: telegram-film-relay
        run: python -m compileall -q film_relay scripts tests
      - name: Exporter le vrai catalogue sans identifiants Telegram
        run: python telegram-film-relay/scripts/generate_anime_dashboard.py --catalogue telegram-film-relay/state/anime_catalog.json --output "$RUNNER_TEMP/anime-test.json"
      - name: Vérifier confidentialité et comptages de l'export
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          data = json.loads((Path(os.environ['RUNNER_TEMP']) / 'anime-test.json').read_text())
          assert data['schema_version'] == 1
          assert data['stats']['titles'] >= 1
          assert data['stats']['private_episodes'] >= 1
          text = json.dumps(data)
          for secret in ('t.me/', 'message_id', 'source_items', 'private_poster_id', '-1001787980027'):
              assert secret not in text, secret
          print('Export Anime sans données Telegram privées : OK')
          PY
      - name: Vérifier le rapport santé en mode sans accès Telegram
        run: python telegram-film-relay/scripts/anime_health_report.py --catalogue telegram-film-relay/state/anime_catalog.json
      - name: Vérifier les délais et blocages de la session Telegram sans réseau
        working-directory: telegram-film-relay
        run: python -m unittest discover -s tests -p 'test_personal_session_pacing.py' -v
      - name: Exécuter les tests de la politique Anime
        working-directory: telegram-film-relay
        run: python -m unittest discover -s tests -p 'test_anime*.py' -v
