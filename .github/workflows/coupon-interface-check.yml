name: Coupon interface check
on:
  push:
    branches: [experiment/coupon-share-1win]
    paths: [.github/workflows/coupon-interface-check.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Install browser library
        run: python -m pip install playwright
      - name: Inspect public 1win page without login, wagers or bypass
        shell: python
        run: |
          import json, re, shutil
          from urllib.parse import urlsplit
          from playwright.sync_api import sync_playwright
          pattern = re.compile(r"sport|football|share|bet code|betslip|coupon|partager|code de pari", re.I)
          with sync_playwright() as p:
              browser = p.chromium.launch(executable_path=shutil.which("google-chrome") or shutil.which("chromium"))
              page = browser.new_page(locale="en-US")
              try:
                  response = page.goto("https://1win.com/", wait_until="domcontentloaded", timeout=25000)
                  page.wait_for_timeout(3500)
                  print("PAGE", response.status if response else None, page.url, page.title(), flush=True)
                  body = page.locator("body").inner_text(timeout=10000)
                  print("BODY_START", body[:900].replace("\n"," | "), flush=True)
                  if not response or response.status >= 400 or urlsplit(page.url).hostname not in ("1win.com","www.1win.com"):
                      print("STOP: inaccessible or unexpected domain")
                  elif re.search(r"access denied|not available in your|captcha|verify you are human|restricted country|forbidden", body, re.I):
                      print("STOP: access restriction; no further requests")
                  else:
                      controls = page.locator("a, button, [role=button], input").evaluate_all("""els => els.filter(e => e.getClientRects().length).map(e => ({text:(e.innerText||e.getAttribute('aria-label')||e.getAttribute('placeholder')||'').trim().slice(0,100), href:e.getAttribute('href')}))""")
                      print("PUBLIC_CONTROLS",json.dumps([e for e in controls if pattern.search(e["text"])][:40],ensure_ascii=False))
                      print("SHARE_UI_VISIBLE", bool(re.search(r"share bet|bet code|betslip code|code du coupon",body,re.I)))
              except Exception as e:
                  print("INSPECTION_ERROR",type(e).__name__,str(e)[:800])
              finally:
                  browser.close()
