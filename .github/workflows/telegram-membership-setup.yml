name: Mr XPRONOS - Setup adhésion Telegram

on:
  # Déclenchement one-shot pour l'installation initiale.
  push:
    branches: [main]
    paths:
      - '.github/workflows/telegram-membership-setup.yml'
  workflow_dispatch:
    inputs:
      check_only:
        description: "Vérifier seulement les droits/canaux"
        required: true
        type: boolean
        default: false
      replace_webhook:
        description: "Remplacer un webhook Telegram existant différent"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mrxpronos-telegram-membership-setup
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.FOOTBALL_NEWS_BOT_TOKEN }}
      FOOTBALL_NEWS_BOT_TOKEN: ${{ secrets.FOOTBALL_NEWS_BOT_TOKEN }}
      TELEGRAM_LIVE_CHAT_ID: ${{ secrets.TELEGRAM_LIVE_CHAT_ID || secrets.TELEGRAM_CHAT_ID_SECONDARY }}
      TELEGRAM_COUPONS_CHAT_ID: ${{ secrets.TELEGRAM_COUPONS_CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
      FOOTBALL_NEWS_CHAT_ID: ${{ secrets.FOOTBALL_NEWS_CHAT_ID }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      TELEGRAM_MEMBERSHIP_WEBHOOK_URL: https://nhwafcpndlufzzxexikh.supabase.co/functions/v1/telegram-membership
      PYTHONUNBUFFERED: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer requests
        run: python -m pip install --disable-pip-version-check requests

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Déployer le webhook d'adhésion
        run: |
          supabase functions deploy telegram-membership \
            --project-ref nhwafcpndlufzzxexikh \
            --no-verify-jwt

      - name: Vérifier la fonction déployée
        run: |
          curl --fail-with-body --silent --show-error --retry 3 --max-time 20 \
            "$TELEGRAM_MEMBERSHIP_WEBHOOK_URL"

      - name: Configurer les trois canaux
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHECK_ONLY: ${{ inputs.check_only || 'false' }}
          REPLACE_WEBHOOK: ${{ inputs.replace_webhook || 'false' }}
        run: |
          set -euo pipefail
          ARGS=()

          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$CHECK_ONLY" = "true" ]; then
            ARGS+=(--check-only)
          fi

          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$REPLACE_WEBHOOK" = "true" ]; then
            ARGS+=(--replace-webhook)
          fi

          python scripts/telegram_membership_setup.py "${ARGS[@]}"
