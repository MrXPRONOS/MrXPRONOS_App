name: Mr XPRONOS - Setup adhésion Telegram

on:
  workflow_dispatch:
    inputs:
      check_only:
        description: "Vérifier seulement les droits/canaux"
        required: true
        type: boolean
        default: true
      replace_webhook:
        description: "Remplacer un webhook Telegram existant différent"
        required: true
        type: boolean
        default: false
      refresh_pinned_messages:
        description: "Mettre à jour les messages épinglés existants"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mrxpronos-telegram-membership-setup
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.FOOTBALL_NEWS_BOT_TOKEN }}
      FOOTBALL_NEWS_BOT_TOKEN: ${{ secrets.FOOTBALL_NEWS_BOT_TOKEN }}
      TELEGRAM_LIVE_CHAT_ID: ${{ secrets.TELEGRAM_LIVE_CHAT_ID || secrets.TELEGRAM_CHAT_ID_SECONDARY }}
      TELEGRAM_COUPONS_CHAT_ID: ${{ secrets.TELEGRAM_COUPONS_CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
      FOOTBALL_NEWS_CHAT_ID: ${{ secrets.FOOTBALL_NEWS_CHAT_ID }}
      TELEGRAM_MEMBERSHIP_WEBHOOK_URL: https://br-winter-truth-b9of9tss-telegrammembership.compute.c-7.eu-central-1.aws.neon.tech/
      PYTHONUNBUFFERED: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer requests
        run: python -m pip install --disable-pip-version-check requests

      - name: Tester la fonction Neon avant toute modification Telegram
        shell: bash
        run: |
          set -euo pipefail
          HEALTH="$(curl --fail --silent --show-error --max-time 20 "$TELEGRAM_MEMBERSHIP_WEBHOOK_URL")"
          export HEALTH
          python3 - <<'PY'
          import json, os, sys
          response = json.loads(os.environ.get("HEALTH", "{}"))
          if response.get("ok") is not True or response.get("service") != "telegram-membership":
              sys.exit("Neon function health failed")
          if response.get("configured") is not True:
              sys.exit("Neon Telegram token missing: webhook will NOT be changed")
          print("Neon Telegram membership configuration verified")
          PY

      - name: Configurer les trois canaux
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHECK_ONLY: ${{ inputs.check_only || 'false' }}
          REPLACE_WEBHOOK: ${{ inputs.replace_webhook || 'false' }}
        run: |
          set -euo pipefail
          ARGS=()

          if [ "$EVENT_NAME" = "push" ]; then
            ARGS+=(--refresh-pinned-messages)
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$CHECK_ONLY" = "true" ]; then
            ARGS+=(--check-only)
          fi

          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$REPLACE_WEBHOOK" = "true" ]; then
            ARGS+=(--replace-webhook)
          fi

          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "${{ inputs.refresh_pinned_messages || 'false' }}" = "true" ]; then
            ARGS+=(--refresh-pinned-messages)
          fi

          python scripts/telegram_membership_setup.py "${ARGS[@]}"
