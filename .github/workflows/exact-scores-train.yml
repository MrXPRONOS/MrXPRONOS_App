name: Exact scores - train and evaluate (shadow)

on:
  workflow_dispatch:
  push:
    branches: ['feature/exact-score-v1-20261019']
    paths:
      - 'bsd/exact_scores.py'
      - 'bsd/exact_scores_h2h.py'
      - 'bsd/exact_scores_h2h_v2.py'
      - 'bsd/exact_scores_phase1_backtest.py'
      - 'bsd/exact_scores_under25.py'
      - 'bsd/exact_scores_under25_v2.py'
      - 'bsd/exact_scores_phase2_backtest.py'
      - 'bsd/exact_scores_phase3.py'
      - 'bsd/exact_scores_phase3_backtest.py'
      - 'bsd/exact_scores_under25_backtest.py'
      - 'bsd/exact_scores_full_2026.py'
      - 'bsd/test_exact_scores.py'
      - '.github/workflows/exact-scores-train.yml'
  pull_request:
    paths:
      - 'bsd/exact_scores.py'
      - 'bsd/exact_scores_h2h.py'
      - 'bsd/exact_scores_h2h_v2.py'
      - 'bsd/exact_scores_phase1_backtest.py'
      - 'bsd/exact_scores_under25.py'
      - 'bsd/exact_scores_under25_v2.py'
      - 'bsd/exact_scores_phase2_backtest.py'
      - 'bsd/exact_scores_under25_backtest.py'
      - 'bsd/exact_scores_full_2026.py'
      - 'bsd/test_exact_scores.py'
      - '.github/workflows/exact-scores-train.yml'

permissions:
  contents: read

concurrency:
  group: exact-score-training-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install BSD import dependencies
        run: python -m pip install requests
      - name: Run isolated engine tests
        run: python -m unittest bsd/test_exact_scores.py -v

  train:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install private archive dependency
        run: python -m pip install cryptography requests
      - name: Restore BSD history (private runner only)
        env:
          BSD_HISTORY_KEY: '${{ secrets.BSD_HISTORY_KEY }}'
        run: python bsd/bsd_archive.py restore
      - name: Train and measure held-out 2026 exact scores
        if: github.event_name == 'workflow_dispatch'
        run: python bsd/exact_scores.py --out-dir tmp/exact-scores
      - name: Evaluate all finished 2026 matches and H2H priority
        if: github.event_name == 'workflow_dispatch'
        run: python bsd/exact_scores_full_2026.py --out-dir tmp/exact-scores
      - name: Evaluate Under 2.5 x H2H x exact score on all 2026 matches
        if: github.event_name == 'workflow_dispatch'
        run: python bsd/exact_scores_under25_backtest.py
      - name: Evaluate Phase 1 H2H V2 independently on all 2026 results
        if: github.event_name == 'workflow_dispatch'
        run: python bsd/exact_scores_phase1_backtest.py
      - name: Evaluate Phase 2 Under 2.5 on full 2026 history
        if: github.event_name == 'workflow_dispatch'
        run: python bsd/exact_scores_phase2_backtest.py
      - name: Evaluate Phase 3 coherent fusion and abstention
        run: python bsd/exact_scores_phase3_backtest.py
      - name: Verify phase 3 coverage and training fallback
        run: |
          python - <<'PY'
          import json
          r=json.load(open('tmp/exact-scores/phase3-report.json'))
          assert r["finished"] > 0 and r["eligible"] > 0
          assert r["eligible"] == r["comparison"]["all"]["baseline"]["n"] == r["comparison"]["all"]["fused"]["n"]
          print('PHASE3_EVALUATED',json.dumps({"finished":r["finished"],"eligible":r["eligible"],"training":r["training"],"comparison":r["comparison"],"counts":r["counts"]}))
          PY
      - name: Save model and evaluation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: exact-score-research-${{ github.run_id }}
          path: |
            tmp/exact-scores/report.json
            tmp/exact-scores/model.json
            tmp/exact-scores/preview.json
            tmp/exact-scores/full-2026-report.json
            tmp/exact-scores/under25-full-2026-report.json
            tmp/exact-scores/phase1-h2h-report.json
            tmp/exact-scores/phase2-under25-report.json
            tmp/exact-scores/phase3-report.json
          retention-days: 90
          if-no-files-found: error
      - name: Remove decrypted archive from runner
        if: always()
        run: rm -f bsd/all_matches_bsd.json bsd/backfill_state.json
