name: Exact scores - train and evaluate (shadow)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'bsd/exact_scores.py'
      - 'bsd/test_exact_scores.py'
      - '.github/workflows/exact-scores-train.yml'

permissions:
  contents: read

concurrency:
  group: exact-score-training-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Run isolated engine tests
        run: python -m unittest bsd/test_exact_scores.py -v

  train:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install private archive dependency
        run: python -m pip install cryptography
      - name: Restore BSD history (private runner only)
        env:
          BSD_HISTORY_KEY: '${{ secrets.BSD_HISTORY_KEY }}'
        run: python bsd/bsd_archive.py restore
      - name: Train and measure held-out 2026 exact scores
        run: python bsd/exact_scores.py --out-dir tmp/exact-scores
      - name: Reject missing backtest results
        run: |
          python - <<'PY'
          import json
          r=json.load(open('tmp/exact-scores/report.json'))
          assert r['test_2026']['trained_model']['evaluated'] > 0, 'No held-out match was evaluated'
          print('TRAINED_EVALUATION',r['test_2026'])
          PY
      - name: Save model and evaluation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: exact-score-research-${{ github.run_id }}
          path: tmp/exact-scores/*.json
          retention-days: 90
          if-no-files-found: error
      - name: Remove decrypted archive from runner
        if: always()
        run: rm -f bsd/all_matches_bsd.json bsd/backfill_state.json
