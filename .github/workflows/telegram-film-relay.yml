name: Mr XPRONOS - Film Relay

on:
  workflow_dispatch:
    inputs:
      rescan_history:
        description: 'Reexaminer les anciens films, sans republier les doublons'
        required: false
        type: boolean
        default: true
  schedule:
    - cron: '17 */2 * * *'

permissions:
  contents: write

concurrency:
  group: mrx-telegram-film-state
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: telegram-film-relay/requirements.txt
      - name: Check Telegram secrets without revealing values
        id: credentials
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_STRING_SESSION: ${{ secrets.TG_SESSION_STRING || secrets.TG_STRING_SESSION || secrets.TG_STREAM_SESSION }}
        run: |
          if [[ -n "$TG_API_ID" && -n "$TG_API_HASH" && -n "$TG_STRING_SESSION" ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::error::Telegram credentials missing: TG_API_ID, TG_API_HASH or TG_SESSION_STRING.'
            exit 1
          fi
      - name: Install dependencies
        if: steps.credentials.outputs.ready == 'true'
        run: pip install -r telegram-film-relay/requirements.txt
      - name: Run local validation tests
        if: steps.credentials.outputs.ready == 'true'
        working-directory: telegram-film-relay
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -q
      - name: Run Telegram film relay
        if: steps.credentials.outputs.ready == 'true'
        working-directory: telegram-film-relay
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_STRING_SESSION: ${{ secrets.TG_SESSION_STRING || secrets.TG_STRING_SESSION || secrets.TG_STREAM_SESSION }}
          TG_APPROVED_SOURCES_JSON: ${{ secrets.TG_APPROVED_SOURCES_JSON }}
          CINEX_BOT_TOKEN: ${{ secrets.FOOTBALL_NEWS_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          TG_PRIVATE_CHANNEL: ${{ vars.TG_PRIVATE_CHANNEL }}
          TG_PUBLIC_CHANNEL: ${{ vars.TG_PUBLIC_CHANNEL }}
          TG_MIRROR_CHANNEL: ${{ vars.TG_MIRROR_CHANNEL || '@Torrent9SeriesFilms' }}
          TG_PRIVATE_INVITE_LINK: ${{ secrets.CINEX_PRIVATE_INVITE_LINK }}
          FILM_PUBLISH_ENABLED: ${{ vars.FILM_PUBLISH_ENABLED || 'true' }}
          TG_RIGHTS_ATTESTED: ${{ vars.TG_RIGHTS_ATTESTED || 'true' }}
          FILM_MAX_POSTS_PER_RUN: '2'
          FILM_REQUIRE_PUBLICATION: ${{ github.event_name == 'schedule' && 'false' || 'true' }}
          FILM_RESCAN_HISTORY: ${{ github.event_name == 'push' && 'true' || (github.event_name == 'workflow_dispatch' && inputs.rescan_history && 'true' || 'false') }}
          PYTHONPATH: .
        run: python -m film_relay.runner
      - name: Persist relay checkpoint even after partial send failure
        if: always() && steps.credentials.outputs.ready == 'true'
        run: |
          set -e
          STATE_FILE="telegram-film-relay/state/state.json"
          if git diff --quiet -- "$STATE_FILE"; then
            echo "No new Telegram receipts to persist."
            exit 0
          fi
          cp "$STATE_FILE" "$RUNNER_TEMP/cinex-checkpoint.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin main
            git reset --hard origin/main
            python telegram-film-relay/scripts/merge_state.py \
              "$RUNNER_TEMP/cinex-checkpoint.json" "$STATE_FILE"
            if git diff --quiet -- "$STATE_FILE"; then
              echo "Receipts already present on remote."
              exit 0
            fi
            git add "$STATE_FILE"
            git commit -m "state: film relay checkpoint [skip ci]"
            if git push origin HEAD:main; then
              echo "Telegram publication receipts persisted on GitHub."
              exit 0
            fi
            echo "Concurrent update: merging again ($attempt/8)"
            sleep 2
          done
          echo "::error::Film checkpoint could not be saved after eight merged retries"
          exit 1
