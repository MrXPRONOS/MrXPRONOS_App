name: CineX - Films, Desir, Comedie, Anime et Decouverte (2h)

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publier les films et pubs (sinon diagnostic uniquement)'
        required: false
        type: boolean
        default: true
  schedule:
    - cron: '17 */2 * * *'

permissions:
  contents: write

# Exclusivité pour tous les workflows utilisant la session personnelle Telegram.
concurrency:
  group: mrx-telegram-personal-account
  cancel-in-progress: false

jobs:
  relay:
    name: Decouverte et 4 catégories, 2 films chacune + publicités
    runs-on: ubuntu-latest
    timeout-minutes: 105
    env:
      CINEX_DEFER_MIRROR: 'true'
      CINEX_SAFE_MODE: 'true'
      CINEX_PAUSE_SECONDS: '20'
      CINEX_FORWARD_PAUSE_SECONDS: '18'
    steps:
      - name: Charger le code
        uses: actions/checkout@v4
      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: telegram-film-relay/requirements.txt
      - name: Verifier les secrets Telegram sans afficher leurs valeurs
        id: credentials
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_STRING_SESSION: ${{ secrets.TG_SESSION_STRING || secrets.TG_STRING_SESSION || secrets.TG_STREAM_SESSION }}
          DESIR_PRIVATE_CHANNEL: ${{ vars.DESIR_PRIVATE_CHANNEL }}
          DESIR_BOT_TOKEN: ${{ secrets.DESIR_BOT_TOKEN || secrets.FOOTBALL_NEWS_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
        shell: bash
        run: |
          set -e
          [[ -n "$TG_API_ID" && -n "$TG_API_HASH" && -n "$TG_STRING_SESSION" ]] || {
            echo '::error::Secrets TG_API_ID, TG_API_HASH ou session manquants.'
            exit 1
          }
          [[ "$DESIR_PRIVATE_CHANNEL" =~ ^-100[0-9]+$ ]] || {
            echo '::error::DESIR_PRIVATE_CHANNEL doit être un identifiant -100 valide.'
            exit 1
          }
          [[ -n "$DESIR_BOT_TOKEN" ]] || {
            echo '::error::Un bot de publication Telegram est requis.'
            exit 1
          }
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - name: Installer les dependances
        run: python -m pip install -r telegram-film-relay/requirements.txt
      - name: Valider le code (sans publication)
        working-directory: telegram-film-relay
        env:
          PYTHONPATH: .
        run: |
          python -m compileall -q film_relay scripts tests
          python -m unittest discover -s tests -p 'test_bot_http.py' -v
          python -m unittest discover -s tests -p 'test_desir.py' -q
          python -m unittest discover -s tests -p 'test_category_relays.py' -q
          python -m unittest discover -s tests -p 'test_anime_catalog.py' -v
          python -m unittest discover -s tests -p 'test_promotions.py' -q
          python -m unittest discover -s tests -p 'test_mkv.py' -q
          python -m unittest discover -s tests -p 'test_discovery_digest.py' -q
          python - <<'PY'
          from film_relay.promotions import render_poster
          for i in range(3):
              original=render_poster(i)
              print(f"Publicité PNG vérifiée : {original.name}, {len(original.getvalue())} octets")
          PY

      # Discover channel suggestions; they are sent ONLY to personal Saved Messages.
      # Nothing found by discovery is ever auto-added to film relay sources.
      - name: 1 - Decouverte de canaux et Messages enregistres
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish }}
        working-directory: telegram-film-relay
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_STRING_SESSION: ${{ secrets.TG_SESSION_STRING || secrets.TG_STRING_SESSION || secrets.TG_STREAM_SESSION }}
          PYTHONPATH: .
        run: python -m film_relay.discovery

      # Classic relay sends its public/private/mirror promotion AFTER two movies,
      # using its own durable counter in state/state.json.
      - name: Pause de securite avant publication
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        run: sleep 20

      - name: "Partenariat AVANT films"
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        working-directory: telegram-film-relay
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_STRING_SESSION: ${{ secrets.TG_SESSION_STRING || secrets.TG_STRING_SESSION || secrets.TG_STREAM_SESSION }}
          CINEX_BOT_TOKEN: ${{ secrets.FOOTBALL_NEWS_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          TG_PUBLIC_CHANNEL: ${{ vars.TG_PUBLIC_CHANNEL }}
          DESIR_PUBLIC_CHANNEL: ${{ vars.DESIR_PUBLIC_CHANNEL || '@CineXDesirfr' }}
          COMEDIE_PUBLIC_CHANNEL: ${{ vars.COMEDIE_PUBLIC_CHANNEL }}
          ANIME_PUBLIC_CHANNEL: ${{ vars.ANIME_PUBLIC_CHANNEL }}
          TG_MIRROR_CHANNEL: ${{ vars.TG_MIRROR_CHANNEL || '@Torrent9SeriesFilms' }}
          PYTHONPATH: .
        run: python scripts/partnership_cycle.py --category films --phase before

      - name: 2 - Deux films CineX classiques puis une pub
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        working-directory: telegram-film-relay
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_STRING_SESSION: ${{ secrets.TG_SESSION_STRING || secrets.TG_STRING_SESSION || secrets.TG_STREAM_SESSION }}
          CINEX_BOT_TOKEN: ${{ secrets.FOOTBALL_NEWS_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          TG_PRIVATE_CHANNEL: ${{ vars.TG_PRIVATE_CHANNEL }}
          TG_PUBLIC_CHANNEL: ${{ vars.TG_PUBLIC_CHANNEL }}
          TG_MIRROR_CHANNEL: ${{ vars.TG_MIRROR_CHANNEL || '@Torrent9SeriesFilms' }}
          CINEX_FILM_FOLDER_URL: ${{ vars.CINEX_FILM_FOLDER_URL || 'https://t.me/addlist/ZmW4vfwcrMAwNzJk' }}
          FILM_PUBLISH_ENABLED: 'true'
          TG_RIGHTS_ATTESTED: 'true'
          CINEX_PROMOS_ENABLED: 'true'
          CINEX_SOURCE_CHANNELS: ${{ vars.CINEX_SOURCE_CHANNELS }}
          FILM_SOURCE_CHANNELS: ${{ vars.FILM_SOURCE_CHANNELS }}
          SERIES_SOURCE_CHANNELS: ${{ vars.SERIES_SOURCE_CHANNELS }}
          FILM_MAX_POSTS_PER_RUN: '2'
          FILM_REQUIRE_PUBLICATION: 'false'
          FILM_RESCAN_HISTORY: 'false'
          PYTHONPATH: .
        run: python -m film_relay.runner

      - name: Pause de securite avant transfert films
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        run: sleep 25

      - name: "Transfert ordonné APRÈS films vers Torrent9"
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        working-directory: telegram-film-relay
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_STRING_SESSION: ${{ secrets.TG_SESSION_STRING || secrets.TG_STRING_SESSION || secrets.TG_STREAM_SESSION }}
          CINEX_BOT_TOKEN: ${{ secrets.FOOTBALL_NEWS_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          TG_PUBLIC_CHANNEL: ${{ vars.TG_PUBLIC_CHANNEL }}
          DESIR_PUBLIC_CHANNEL: ${{ vars.DESIR_PUBLIC_CHANNEL || '@CineXDesirfr' }}
          COMEDIE_PUBLIC_CHANNEL: ${{ vars.COMEDIE_PUBLIC_CHANNEL }}
          ANIME_PUBLIC_CHANNEL: ${{ vars.ANIME_PUBLIC_CHANNEL }}
          TG_MIRROR_CHANNEL: ${{ vars.TG_MIRROR_CHANNEL || '@Torrent9SeriesFilms' }}
          PYTHONPATH: .
        run: python scripts/partnership_cycle.py --category films --phase after

      # Separate source/destination and counter. Native forwards from CineX Desir
      # retain attribution to that channel in @Torrent9SeriesFilms.
      - name: Intervalle de securite avant desir
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        run: sleep 45

      - name: "Partenariat AVANT desir"
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        working-directory: telegram-film-relay
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_STRING_SESSION: ${{ secrets.TG_SESSION_STRING || secrets.TG_STRING_SESSION || secrets.TG_STREAM_SESSION }}
          CINEX_BOT_TOKEN: ${{ secrets.DESIR_BOT_TOKEN || secrets.FOOTBALL_NEWS_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          TG_PUBLIC_CHANNEL: ${{ vars.TG_PUBLIC_CHANNEL }}
          DESIR_PUBLIC_CHANNEL: ${{ vars.DESIR_PUBLIC_CHANNEL || '@CineXDesirfr' }}
          COMEDIE_PUBLIC_CHANNEL: ${{ vars.COMEDIE_PUBLIC_CHANNEL }}
          ANIME_PUBLIC_CHANNEL: ${{ vars.ANIME_PUBLIC_CHANNEL }}
          TG_MIRROR_CHANNEL: ${{ vars.TG_MIRROR_CHANNEL || '@Torrent9SeriesFilms' }}
          PYTHONPATH: .
        run: python scripts/partnership_cycle.py --category desir --phase before

      - name: 3 - Deux films CineX Desir puis une pub
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        working-directory: telegram-film-relay
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_STRING_SESSION: ${{ secrets.TG_SESSION_STRING || secrets.TG_STRING_SESSION || secrets.TG_STREAM_SESSION }}
          DESIR_BOT_TOKEN: ${{ secrets.DESIR_BOT_TOKEN || secrets.FOOTBALL_NEWS_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          DESIR_SOURCE_CHANNEL: ${{ vars.DESIR_SOURCE_CHANNEL || '@Filmromatique' }}
          DESIR_EXTRA_SOURCE_CHANNEL: ${{ vars.DESIR_EXTRA_SOURCE_CHANNEL || '@g_romanticfilm' }}
          DESIR_SOURCE_CHANNELS: ${{ vars.DESIR_SOURCE_CHANNELS }}
          DESIR_PUBLIC_CHANNEL: ${{ vars.DESIR_PUBLIC_CHANNEL || '@CineXDesirfr' }}
          DESIR_MIRROR_CHANNEL: ${{ vars.DESIR_MIRROR_CHANNEL || '@Torrent9SeriesFilms' }}
          DESIR_PRIVATE_CHANNEL: ${{ vars.DESIR_PRIVATE_CHANNEL }}
          CINEX_FILM_FOLDER_URL: ${{ vars.CINEX_FILM_FOLDER_URL || 'https://t.me/addlist/ZmW4vfwcrMAwNzJk' }}
          DESIR_STATE_PATH: state/desir_state.json
          PYTHONPATH: .
        run: python -m film_relay.desir_runner --publish --limit 2 --newest

      - name: Pause de securite avant transfert desir
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        run: sleep 25

      - name: "Transfert ordonné APRÈS desir vers Torrent9"
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        working-directory: telegram-film-relay
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_STRING_SESSION: ${{ secrets.TG_SESSION_STRING || secrets.TG_STRING_SESSION || secrets.TG_STREAM_SESSION }}
          CINEX_BOT_TOKEN: ${{ secrets.DESIR_BOT_TOKEN || secrets.FOOTBALL_NEWS_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          TG_PUBLIC_CHANNEL: ${{ vars.TG_PUBLIC_CHANNEL }}
          DESIR_PUBLIC_CHANNEL: ${{ vars.DESIR_PUBLIC_CHANNEL || '@CineXDesirfr' }}
          COMEDIE_PUBLIC_CHANNEL: ${{ vars.COMEDIE_PUBLIC_CHANNEL }}
          ANIME_PUBLIC_CHANNEL: ${{ vars.ANIME_PUBLIC_CHANNEL }}
          TG_MIRROR_CHANNEL: ${{ vars.TG_MIRROR_CHANNEL || '@Torrent9SeriesFilms' }}
          PYTHONPATH: .
        run: python scripts/partnership_cycle.py --category desir --phase after

      # Independent categories share one session lock and two-film caps.
      # Source channels are owner-configured (singular and bulk variables).
      - name: Intervalle de securite avant comedie
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        run: sleep 45

      - name: "Partenariat AVANT comedie"
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        working-directory: telegram-film-relay
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_STRING_SESSION: ${{ secrets.TG_SESSION_STRING || secrets.TG_STRING_SESSION || secrets.TG_STREAM_SESSION }}
          CINEX_BOT_TOKEN: ${{ secrets.DESIR_BOT_TOKEN || secrets.FOOTBALL_NEWS_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          TG_PUBLIC_CHANNEL: ${{ vars.TG_PUBLIC_CHANNEL }}
          DESIR_PUBLIC_CHANNEL: ${{ vars.DESIR_PUBLIC_CHANNEL || '@CineXDesirfr' }}
          COMEDIE_PUBLIC_CHANNEL: ${{ vars.COMEDIE_PUBLIC_CHANNEL }}
          ANIME_PUBLIC_CHANNEL: ${{ vars.ANIME_PUBLIC_CHANNEL }}
          TG_MIRROR_CHANNEL: ${{ vars.TG_MIRROR_CHANNEL || '@Torrent9SeriesFilms' }}
          PYTHONPATH: .
        run: python scripts/partnership_cycle.py --category comedie --phase before

      - name: 4 - Deux comedies et publicite CineX Comedie
        id: comedy
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        continue-on-error: true
        working-directory: telegram-film-relay
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_STRING_SESSION: ${{ secrets.TG_SESSION_STRING || secrets.TG_STRING_SESSION || secrets.TG_STREAM_SESSION }}
          CINEX_CATEGORY_BOT_TOKEN: ${{ secrets.DESIR_BOT_TOKEN || secrets.FOOTBALL_NEWS_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          COMEDIE_SOURCE_CHANNEL: ${{ vars.COMEDIE_SOURCE_CHANNEL }}
          COMEDIE_SOURCE_CHANNELS: ${{ vars.COMEDIE_SOURCE_CHANNELS || '@comexflex,@filmcomplets' }}
          COMEDIE_PUBLIC_CHANNEL: ${{ vars.COMEDIE_PUBLIC_CHANNEL }}
          COMEDIE_PRIVATE_CHANNEL: ${{ vars.COMEDIE_PRIVATE_CHANNEL }}
          COMEDIE_MIRROR_CHANNEL: '@Torrent9SeriesFilms'
          COMEDIE_STATE_PATH: state/comedie_state.json
          CINEX_FILM_FOLDER_URL: ${{ vars.CINEX_FILM_FOLDER_URL || 'https://t.me/addlist/ZmW4vfwcrMAwNzJk' }}
          PYTHONPATH: .
        run: python -m film_relay.category_runner --category comedie --publish --limit 2

      - name: Pause de securite avant transfert comedie
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        run: sleep 25

      - name: "Transfert ordonné APRÈS comedie vers Torrent9"
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        working-directory: telegram-film-relay
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_STRING_SESSION: ${{ secrets.TG_SESSION_STRING || secrets.TG_STRING_SESSION || secrets.TG_STREAM_SESSION }}
          CINEX_BOT_TOKEN: ${{ secrets.DESIR_BOT_TOKEN || secrets.FOOTBALL_NEWS_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          TG_PUBLIC_CHANNEL: ${{ vars.TG_PUBLIC_CHANNEL }}
          DESIR_PUBLIC_CHANNEL: ${{ vars.DESIR_PUBLIC_CHANNEL || '@CineXDesirfr' }}
          COMEDIE_PUBLIC_CHANNEL: ${{ vars.COMEDIE_PUBLIC_CHANNEL }}
          ANIME_PUBLIC_CHANNEL: ${{ vars.ANIME_PUBLIC_CHANNEL }}
          TG_MIRROR_CHANNEL: ${{ vars.TG_MIRROR_CHANNEL || '@Torrent9SeriesFilms' }}
          PYTHONPATH: .
        run: python scripts/partnership_cycle.py --category comedie --phase after

      - name: Intervalle de securite avant anime
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        run: sleep 45

      - name: "Partenariat AVANT anime"
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        working-directory: telegram-film-relay
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_STRING_SESSION: ${{ secrets.TG_SESSION_STRING || secrets.TG_STRING_SESSION || secrets.TG_STREAM_SESSION }}
          CINEX_BOT_TOKEN: ${{ secrets.DESIR_BOT_TOKEN || secrets.FOOTBALL_NEWS_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          TG_PUBLIC_CHANNEL: ${{ vars.TG_PUBLIC_CHANNEL }}
          DESIR_PUBLIC_CHANNEL: ${{ vars.DESIR_PUBLIC_CHANNEL || '@CineXDesirfr' }}
          COMEDIE_PUBLIC_CHANNEL: ${{ vars.COMEDIE_PUBLIC_CHANNEL }}
          ANIME_PUBLIC_CHANNEL: ${{ vars.ANIME_PUBLIC_CHANNEL }}
          TG_MIRROR_CHANNEL: ${{ vars.TG_MIRROR_CHANNEL || '@Torrent9SeriesFilms' }}
          PYTHONPATH: .
        run: python scripts/partnership_cycle.py --category anime --phase before

      - name: 5 - Deux catalogues d'animes et publicite CineX Anime
        id: anime
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        continue-on-error: true
        working-directory: telegram-film-relay
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_STRING_SESSION: ${{ secrets.TG_SESSION_STRING || secrets.TG_STRING_SESSION || secrets.TG_STREAM_SESSION }}
          CINEX_CATEGORY_BOT_TOKEN: ${{ secrets.DESIR_BOT_TOKEN || secrets.FOOTBALL_NEWS_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          ANIME_SOURCE_CHANNEL: ${{ vars.ANIME_SOURCE_CHANNEL }}
          ANIME_SOURCE_CHANNELS: ${{ vars.ANIME_SOURCE_CHANNELS || '@orak_dessinanime' }}
          ANIME_PUBLIC_CHANNEL: ${{ vars.ANIME_PUBLIC_CHANNEL }}
          ANIME_PRIVATE_CHANNEL: ${{ vars.ANIME_PRIVATE_CHANNEL }}
          ANIME_MIRROR_CHANNEL: '@Torrent9SeriesFilms'
          ANIME_STATE_PATH: state/anime_state.json
          CINEX_ANIME_CATALOG_ENABLED: 'true'
          CINEX_FILM_FOLDER_URL: ${{ vars.CINEX_FILM_FOLDER_URL || 'https://t.me/addlist/ZmW4vfwcrMAwNzJk' }}
          PYTHONPATH: .
        run: python -m film_relay.anime_catalog --publish --limit 2 --episode-cap 6

      - name: Pause de securite avant transfert anime
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        run: sleep 25

      - name: "Transfert ordonné APRÈS anime vers Torrent9"
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        working-directory: telegram-film-relay
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_STRING_SESSION: ${{ secrets.TG_SESSION_STRING || secrets.TG_STRING_SESSION || secrets.TG_STREAM_SESSION }}
          CINEX_BOT_TOKEN: ${{ secrets.DESIR_BOT_TOKEN || secrets.FOOTBALL_NEWS_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          TG_PUBLIC_CHANNEL: ${{ vars.TG_PUBLIC_CHANNEL }}
          DESIR_PUBLIC_CHANNEL: ${{ vars.DESIR_PUBLIC_CHANNEL || '@CineXDesirfr' }}
          COMEDIE_PUBLIC_CHANNEL: ${{ vars.COMEDIE_PUBLIC_CHANNEL }}
          ANIME_PUBLIC_CHANNEL: ${{ vars.ANIME_PUBLIC_CHANNEL }}
          TG_MIRROR_CHANNEL: ${{ vars.TG_MIRROR_CHANNEL || '@Torrent9SeriesFilms' }}
          PYTHONPATH: .
        run: python scripts/partnership_cycle.py --category anime --phase after

      # Save ALL checkpoints even if one new category fails. Telegram uploads
      # must not be repeated on the next scheduled run after a partial error.

      - name: 6 - Sauvegarder les cinq historiques Telegram
        if: always() && steps.credentials.outputs.ready == 'true'
        shell: bash
        run: |
          set -e
          STATE=telegram-film-relay/state
          if git diff --quiet -- "$STATE/state.json" "$STATE/desir_state.json" "$STATE/discovered_channels.json" "$STATE/comedie_state.json" "$STATE/anime_state.json" "$STATE/anime_catalog.json"; then
            echo 'Aucun historique a sauvegarder.'
            exit 0
          fi
          cp "$STATE/state.json" "$RUNNER_TEMP/cinex-state.json"
          cp "$STATE/desir_state.json" "$RUNNER_TEMP/desir-state.json"
          cp "$STATE/discovered_channels.json" "$RUNNER_TEMP/discovery-state.json"
          cp "$STATE/comedie_state.json" "$RUNNER_TEMP/comedie-state.json"
          cp "$STATE/anime_state.json" "$STATE/anime_catalog.json" "$RUNNER_TEMP/anime-state.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin main
            git reset --hard origin/main
            python telegram-film-relay/scripts/merge_state.py "$RUNNER_TEMP/cinex-state.json" "$STATE/state.json"
            python telegram-film-relay/scripts/merge_desir_state.py "$RUNNER_TEMP/desir-state.json" "$STATE/desir_state.json"
            python telegram-film-relay/scripts/merge_discovery_state.py "$RUNNER_TEMP/discovery-state.json" "$STATE/discovered_channels.json"
            python telegram-film-relay/scripts/merge_desir_state.py "$RUNNER_TEMP/comedie-state.json" "$STATE/comedie_state.json"
            python telegram-film-relay/scripts/merge_desir_state.py "$RUNNER_TEMP/anime-state.json" "$STATE/anime_state.json"
            python telegram-film-relay/scripts/merge_anime_catalog.py "$RUNNER_TEMP/anime-catalog.json" "$STATE/anime_catalog.json" "$STATE/anime_catalog.json"
            git add "$STATE/state.json" "$STATE/desir_state.json" "$STATE/discovered_channels.json" "$STATE/comedie_state.json" "$STATE/anime_state.json" "$STATE/anime_catalog.json"
            if git diff --cached --quiet; then
              echo 'Historiques deja synchronises.'
              exit 0
            fi
            git commit -m 'state: CineX unified cycle receipts [skip ci]'
            if git push origin HEAD:main; then
              echo 'Cinq historiques synchronisés.'
              exit 0
            fi
            echo "Conflit GitHub ($attempt/8) : nouvelle fusion."
            sleep 4
          done
          echo '::error::Impossible de sauvegarder les historiques Telegram.'
          exit 1

      - name: 7 - Contrôler le résultat des deux nouvelles catégories
        if: ${{ always() && (steps.comedy.outcome == 'failure' || steps.anime.outcome == 'failure') }}
        shell: bash
        run: |
          echo '::error::Comédie ou Anime a échoué. Les autres catégories et historiques ont été conservés. Vérifier les étapes précédentes.'
          exit 1
