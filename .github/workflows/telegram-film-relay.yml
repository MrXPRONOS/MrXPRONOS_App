name: Mr XPRONOS - Film Relay

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *'

permissions:
  contents: write

concurrency:
  group: mrx-telegram-film-state
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: telegram-film-relay/requirements.txt
      - name: Check Telegram secrets without revealing values
        id: credentials
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_STRING_SESSION: ${{ secrets.TG_STRING_SESSION }}
        run: |
          if [[ -n "$TG_API_ID" && -n "$TG_API_HASH" && -n "$TG_STRING_SESSION" ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Telegram secrets are not configured. Nothing sent.'
          fi
      - name: Install dependencies
        if: steps.credentials.outputs.ready == 'true'
        run: pip install -r telegram-film-relay/requirements.txt
      - name: Run Telegram film relay
        if: steps.credentials.outputs.ready == 'true'
        working-directory: telegram-film-relay
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_STRING_SESSION: ${{ secrets.TG_STRING_SESSION }}
          TG_APPROVED_SOURCES_JSON: ${{ secrets.TG_APPROVED_SOURCES_JSON }}
          TG_PRIVATE_CHANNEL: ${{ vars.TG_PRIVATE_CHANNEL }}
          TG_PUBLIC_CHANNEL: ${{ vars.TG_PUBLIC_CHANNEL }}
          TG_PRIVATE_INVITE_LINK: ${{ vars.TG_PRIVATE_INVITE_LINK }}
          FILM_PUBLISH_ENABLED: ${{ vars.FILM_PUBLISH_ENABLED }}
          TG_RIGHTS_ATTESTED: ${{ vars.TG_RIGHTS_ATTESTED }}
          PYTHONPATH: .
        run: python -m film_relay.runner
      - name: Persist relay checkpoint even after partial send failure
        if: always() && steps.credentials.outputs.ready == 'true'
        run: |
          if ! git diff --quiet -- telegram-film-relay/state/state.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add telegram-film-relay/state/state.json
            git commit -m 'state: film relay checkpoint [skip ci]'
            git pull --rebase
            git push
          fi
