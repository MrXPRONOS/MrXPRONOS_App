name: CineX - Validation ordre des publications

on:
  push:
    branches: [main]
    paths:
      - 'telegram-film-relay/scripts/partnership_cycle.py'
      - 'telegram-film-relay/film_relay/bot_http.py'
      - 'telegram-film-relay/tests/test_bot_http.py'
      - 'telegram-film-relay/film_relay/runner.py'
      - 'telegram-film-relay/config/torrent9_policy.json'
      - 'telegram-film-relay/film_relay/mirror_policy.py'
      - 'telegram-film-relay/film_relay/promotions.py'
      - 'telegram-film-relay/tests/test_torrent9_suspension.py'
      - 'telegram-film-relay/scripts/forward_mirror_pending.py'
      - '.github/workflows/telegram-film-forward-pending.yml'
      - 'telegram-film-relay/film_relay/desir_runner.py'
      - 'telegram-film-relay/film_relay/category_runner.py'
      - 'telegram-film-relay/film_relay/anime_catalog.py'
      - 'telegram-film-relay/film_relay/series_catalog.py'
      - 'telegram-film-relay/film_relay/series_matching.py'
      - 'telegram-film-relay/tests/test_series_catalog.py'
      - 'telegram-film-relay/tests/test_anime_catalog.py'
      - 'telegram-film-relay/tests/test_desir.py'
      - 'telegram-film-relay/tests/test_category_relays.py'
      - 'telegram-film-relay/scripts/merge_anime_catalog.py'
      - '.github/workflows/telegram-film-relay.yml'
      - '.github/workflows/cinex-cycle-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyyaml requests -r telegram-film-relay/requirements.txt
      - name: Confirmer la suspension générale Torrent9
        working-directory: telegram-film-relay
        run: python -m unittest discover -s tests -p 'test_torrent9_suspension.py' -v
      - name: Tester les nouvelles séries TV hors réseau
        working-directory: telegram-film-relay
        run: python -m unittest discover -s tests -p 'test_series_catalog.py' -v
      - name: Tester le nouveau catalogue animé hors réseau
        working-directory: telegram-film-relay
        run: python -m unittest discover -s tests -p 'test_anime_catalog.py' -v
      - name: Vérifier tous les tests préalables utilisés en production
        working-directory: telegram-film-relay
        run: |
          python -m unittest discover -s tests -p 'test_desir.py' -q
          python -m unittest discover -s tests -p 'test_category_relays.py' -q
          python -m unittest discover -s tests -p 'test_promotions.py' -q
          python -m unittest discover -s tests -p 'test_mkv.py' -q
          python -m unittest discover -s tests -p 'test_discovery_digest.py' -q
      - name: Tester les boutons et limites Telegram sans réseau
        run: python -m unittest discover -s telegram-film-relay/tests -p 'test_bot_http.py' -v
      - name: Valider scripts et ordre des étapes sans publier
        run: |
          python -m py_compile telegram-film-relay/scripts/partnership_cycle.py telegram-film-relay/film_relay/runner.py telegram-film-relay/film_relay/desir_runner.py telegram-film-relay/film_relay/category_runner.py
          python - <<'PY'
          import yaml
          from pathlib import Path
          w=yaml.safe_load(Path('.github/workflows/telegram-film-relay.yml').read_text())
          job=w['jobs']['relay']
          assert job['env']['CINEX_DEFER_MIRROR']=='true'
          assert job['env']['CINEX_TORRENT9_PAUSED']=='true'
          steps=[s.get('name','') for s in job['steps']]
          first=next(i for i,x in enumerate(steps) if x.startswith('Partenariat AVANT films'))
          film=next(i for i,x in enumerate(steps) if x.startswith('Un seul film CinéX transféré'))
          assert first < film
          scoped=next(s for s in job['steps'] if s.get('name','').startswith('Un seul film CinéX transféré'))
          assert "CINEX_TORRENT9_PAUSED" not in str(scoped.get('if'))
          policy=yaml.safe_load(Path('telegram-film-relay/config/torrent9_policy.json').read_text())
          assert policy.get('film_single_forward_enabled') is True
          assert policy.get('transfers_enabled') is False
          for category in ('desir','comedie','anime'):
              first=next(i for i,x in enumerate(steps) if x.startswith('Partenariat AVANT '+category))
              end=next(i for i,x in enumerate(steps) if x=='Transfert ordonné APRÈS '+category+' vers Torrent9')
              assert first<end and end-first>=2, (category,first,end)
              disabled=next(s for s in job['steps'] if s.get('name')=='Transfert ordonné APRÈS '+category+' vers Torrent9')
              assert "CINEX_TORRENT9_PAUSED != 'true'" in str(disabled.get('if'))
          positions=[next(i for i,x in enumerate(steps) if x.startswith('Partenariat AVANT '+c)) for c in ('films','desir','comedie','anime')]
          assert positions==sorted(positions)
          assert Path('telegram-film-relay/assets/partenariat-canal-original.jpg').read_bytes()[:3]==bytes.fromhex('ffd8ff')
          print('VALIDATION_OK - Affiche, 4 catégories, pubs et transfert après les films')
          PY
