name: Dixon-Coles - top 10 quotidien - préparation vidéo

on:
  push:
    paths:
      - 'dixon-coles/dcscore/daily*.py'
      - 'dixon-coles/tests/test_daily_pipeline.py'
      - 'dixon-coles/dcscore/video_render.py'
      - 'dixon-coles/dcscore/video_grid.py'
      - 'dixon-coles/tests/test_video_grid.py'
      - 'dixon-coles/dcscore/logo_policy.py'
      - 'dixon-coles/tests/test_video_renderer.py'
      - 'dixon-coles/DAILY_TOP10.md'
      - '.github/workflows/dixon-coles-daily-top10.yml'
  schedule:
    # 21:00 UTC = 21:00 à Lomé (Togo). Sélection du lendemain.
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      day:
        description: "tomorrow, today ou YYYY-MM-DD"
        default: tomorrow
        required: false
        type: string
      source:
        description: "auto, football-data, openfootball ou openligadb"
        default: auto
        required: false
        type: choice
        options: [auto, football-data, openfootball, openligadb, espn]

permissions:
  contents: read

concurrency:
  group: dixon-coles-daily-${{ github.event.inputs.day || 'tomorrow' }}
  cancel-in-progress: false

jobs:
  top10:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: dixon-coles
    env:
      FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
      DCSCORE_DAILY_DAY: ${{ inputs.day || 'tomorrow' }}
      DCSCORE_DAILY_SOURCE: ${{ inputs.source || 'auto' }}
    steps:
      - name: Récupérer seulement le moteur indépendant
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            dixon-coles/
            scripts/telegram_test_guard.py
          sparse-checkout-cone-mode: false
      - name: Préparer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: dixon-coles/pyproject.toml
      - name: Installer les dépendances
        run: python -m pip install -e '.[test]'
      - name: Installer les outils de génération vidéo
        run: |
          python -m pip install -e '.[video]'
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y ffmpeg)
      - name: Vérifier sélection, date et montage vidéo
        run: python -m pytest -q tests/test_daily_pipeline.py tests/test_video_renderer.py tests/test_video_grid.py
      - name: Sélectionner et prédire les matchs admissibles
        run: python -m dcscore.daily --day "$DCSCORE_DAILY_DAY" --source "$DCSCORE_DAILY_SOURCE" --count 10 --min-team 4 --min-importance 70 --max-staleness-days 35
      - name: Monter les 10 affiches sur un seul écran (aucune intro/outro)
        run: |
          python - <<'PYCODE'
          import json
          import subprocess
          import sys
          from pathlib import Path
          paths=sorted(Path('results/daily').glob('*/video_payload.json'))
          if not paths:
              print('Aucun storyboard pour le jour considéré : aucun MP4 créé.')
          for path in paths:
              payload=json.loads(path.read_text(encoding='utf-8'))
              if payload.get('ready_for_video') is not True:
                  print(f'Vidéo refusée pour {path.parent.name}: {payload.get("status")} (non READY)')
                  continue
              destination=path.parent/'top10.mp4'
              subprocess.run([sys.executable,'-m','dcscore.video_grid',
                              '--payload',str(path),'--output',str(destination),'--fullhd'],check=True)
              print('Vidéo de validation générée :',destination)
          PYCODE
      - name: Poster sur Telegram TEST si 10 matchs réels et MP4 prêts
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        env:
          FOOTBALL_NEWS_BOT_TOKEN: ${{ secrets.FOOTBALL_NEWS_BOT_TOKEN }}
          TELEGRAM_TEST_CHAT_ID: ${{ secrets.TELEGRAM_TEST_CHAT_ID || '@predict_mrxp' }}
        run: |
          python - <<'PYCODE'
          import json,subprocess,sys
          from pathlib import Path
          for p in sorted(Path('results/daily').glob('*/video_payload.json')):
              data=json.loads(p.read_text(encoding='utf-8'))
              if not data.get('ready_for_video'):
                  print('Télégram TEST non envoyé: moins de 10 matchs admissibles',p.parent.name)
                  continue
              # Le 10/11 a déjà été publié manuellement (message Telegram #1650).
              if p.parent.name == '2026-11-10':
                  print('Vidéo du 10/11 déjà envoyée : pas de doublon automatique')
                  continue
              movie=p.parent/'top10.mp4'
              if not movie.is_file():
                  raise SystemExit('10 scores READY mais vidéo manquante, Telegram bloqué')
              subprocess.run([sys.executable,'scripts/send_video_to_telegram_test.py',
                   '--payload',str(p),'--video',str(movie)],check=True)
          PYCODE
      - name: Déposer les prévisions, le storyboard et le MP4 si disponible
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dixon-coles-daily-top10-${{ github.run_id }}
          path: dixon-coles/results/daily/
          if-no-files-found: warn
          retention-days: 90
