name: Football Odds - Verification manuelle des secrets
run-name: Verification cotes - ${{ inputs.provider || 'all' }}

on:
  push:
    paths:
      - '.github/workflows/football-odds-secret-audit.yml'
  workflow_dispatch:
    inputs:
      provider:
        description: 'API a verifier'
        required: true
        type: choice
        default: all
        options:
          - all
          - goaldir
          - pinnwire
          - oddslink
          - moviodds
          - oddsharvester

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PROVIDER: ${{ inputs.provider || 'all' }}
      BSD_API_PRESENT: ${{ secrets.BSD_API_KEY != '' }}
      PINNWIRE_PRESENT: ${{ secrets.PINNWIRE_API_KEY != '' }}
      ODDSLINK_PRESENT: ${{ secrets.ODDSLINK_API_KEY != '' }}
      MOVI_URL_PRESENT: ${{ secrets.LIVE_ODDS_MOVIODDS_URL != '' }}
      PINN_URL_PRESENT: ${{ secrets.LIVE_ODDS_PINNWIRE_URL != '' }}
      ODDS_URL_PRESENT: ${{ secrets.LIVE_ODDS_ODDSLINK_URL != '' }}
      GOAL_URL_PRESENT: ${{ secrets.LIVE_ODDS_GOALDIR_URL != '' }}
      HARV_URL_PRESENT: ${{ secrets.LIVE_ODDS_ODDSHARVESTER_URL != '' }}
    steps:
      - name: Resultat sans exposer les valeurs
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## Etat de configuration des API de cotes'
            echo ''
            echo '| Fournisseur | Variable attendue | Presente dans GitHub |'
            echo '|---|---|---|'
            if [[ "$PROVIDER" == all || "$PROVIDER" == goaldir ]]; then
              echo "| GoalDir / BSD (journalier) | BSD_API_KEY | $BSD_API_PRESENT |"
              echo "| GoalDir / BSD (LIVE, proxy) | LIVE_ODDS_GOALDIR_URL | $GOAL_URL_PRESENT |"
            fi
            if [[ "$PROVIDER" == all || "$PROVIDER" == pinnwire ]]; then
              echo "| PinnWire (journalier) | PINNWIRE_API_KEY | $PINNWIRE_PRESENT |"
              echo "| PinnWire (LIVE, proxy) | LIVE_ODDS_PINNWIRE_URL | $PINN_URL_PRESENT |"
            fi
            if [[ "$PROVIDER" == all || "$PROVIDER" == oddslink ]]; then
              echo "| OddsLink (journalier) | ODDSLINK_API_KEY | $ODDSLINK_PRESENT |"
              echo "| OddsLink (LIVE, proxy) | LIVE_ODDS_ODDSLINK_URL | $ODDS_URL_PRESENT |"
            fi
            if [[ "$PROVIDER" == all || "$PROVIDER" == moviodds ]]; then
              echo "| MoviOdds (LIVE, proxy) | LIVE_ODDS_MOVIODDS_URL | $MOVI_URL_PRESENT |"
            fi
            if [[ "$PROVIDER" == all || "$PROVIDER" == oddsharvester ]]; then
              echo "| OddsHarvester (LIVE, proxy) | LIVE_ODDS_ODDSHARVESTER_URL | $HARV_URL_PRESENT |"
            fi
            echo ''
            echo 'Attention : present ne signifie pas valide. Aucune valeur ne sera affichee.'
          } >> "$GITHUB_STEP_SUMMARY"
          echo 'Controle des noms termine. Consulter le resume du job.'
