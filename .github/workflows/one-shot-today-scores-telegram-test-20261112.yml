name: ONE SHOT 12 Nov 2026 - 1-10 vrais scores vers Telegram TEST uniquement

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-today-scores-telegram-test-20261112.yml'

permissions:
  contents: read

concurrency:
  group: mrx-2026-11-12-telegram-test-only-real-scores
  cancel-in-progress: false

jobs:
  build_and_send_only_test:
    if: github.event_name == 'push' && github.event.head_commit.message == 'SEND_TODAY_2026_11_12_TO_TEST_CHANNEL_ONCE'
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      FOOTBALL_NEWS_BOT_TOKEN: ${{ secrets.FOOTBALL_NEWS_BOT_TOKEN }}
      TELEGRAM_TEST_CHAT_ID: ${{ secrets.TELEGRAM_TEST_CHAT_ID || '@predict_mrxp' }}
      TZ: Africa/Lome
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les dépendances locales Dixon-Coles et vidéo
        run: |
          python -m pip install -e 'dixon-coles[test,video]'
          if ! command -v ffprobe >/dev/null || ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          fi
      - name: Tester les garde-fous Telegram hors réseau
        run: |
          python -m pytest -q tests/test_telegram_today_test_video.py \
            dixon-coles/tests/test_daily_two_pass.py \
            dixon-coles/tests/test_video_grid_neon.py
      - name: Vérifier les secrets requis mais jamais les afficher
        run: |
          test -n "$FOOTBALL_NEWS_BOT_TOKEN"
          test -n "$TELEGRAM_TEST_CHAT_ID"
      - name: Générer les vrais matchs du 12 novembre en V5 flexible
        id: create
        shell: bash
        run: |
          set +e
          python scripts/telegram_today_test_video.py build \
            --day 2026-11-12 --output-dir telegram_today_test
          code=$?
          set -e
          if [ "$code" -eq 3 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Aucun match authentique et publiable : zéro envoi."
            exit 0
          fi
          if [ "$code" -ne 0 ]; then exit "$code"; fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Envoyer la vidéo uniquement dans @predict_mrxp
        if: steps.create.outputs.ready == 'true'
        run: |
          python scripts/telegram_today_test_video.py send \
            --day 2026-11-12 --output-dir telegram_today_test
      - name: Vérifier le reçu unique de Telegram TEST
        if: steps.create.outputs.ready == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          folder=Path('telegram_today_test/2026-11-12')
          r=json.loads((folder/'sent_receipt.json').read_text())
          m=json.loads((folder/'test_manifest.json').read_text())
          assert r['destination']=='@predict_mrxp'
          assert r['date']=='2026-11-12'
          assert type(r['message_id']) is int and r['message_id']>0
          assert 1<=r['count']<=10
          assert r['count']==m['count']
          assert r['video_sha256']==m['video_sha256']
          assert r['url']==f"https://t.me/predict_mrxp/{r['message_id']}"
          print('CONFIRMED_TEST_TELEGRAM_POST',json.dumps(r,ensure_ascii=False))
          PY
      - name: Archiver les véritables sélections, le MP4 et le reçu (même en cas d'échec)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MRX-12Nov2026-real-test-Telegram-${{ github.run_id }}
          path: |
            telegram_today_test/**/predictions.json
            telegram_today_test/**/video_payload.json
            telegram_today_test/**/skipped.json
            telegram_today_test/**/test_manifest.json
            telegram_today_test/**/mrxpronos_scores_*.mp4
            telegram_today_test/**/sent_receipt.json
          if-no-files-found: warn
          retention-days: 21
