name: Research ML V2 - encrypted V2 sample collection
on:
  push:
    branches:
      - research/single-ml-v2-20261024
    paths:
      - '.github/workflows/research-ml-v2-v2-sample.yml'
permissions:
  contents: write
concurrency:
  group: ml-v2-encrypted-history
  cancel-in-progress: false
jobs:
  one-day:
    name: One historical V2 day verified and encrypted
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ML_V2_HISTORY_KEY_B64: ${{ secrets.ML_V2_HISTORY_KEY_B64 }}
      SPORTDATA_API_KEY_2: ${{ secrets.SPORTDATA_API_KEY_2 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/single-ml-v2-20261024
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install crypto and test packages
        run: python -m pip install cryptography requests
      - name: Offline V2 integrity test
        run: PYTHONPATH=.:research python -m unittest discover -s research -p test_single_ml_v2_v2_history.py -v
      - name: Fetch and certify one V2 calendar day
        run: PYTHONPATH=.:research python research/single_ml_v2_v2_history.py --start 2025-12-20 --end 2025-12-20 --limit 1
      - name: Confirm ciphertext can be authenticated and decrypted
        run: |
          PYTHONPATH=.:research python - <<'PY'
          from datetime import date
          from single_ml_v2_git import key_from_environment,path_for,day_data
          day=date(2025,12,20)
          p=path_for(day)
          if not p.exists():raise SystemExit("ERROR No encrypted V2 snapshot")
          content=day_data(p,key_from_environment(),day)
          if content.get("source_schema")!="v2_football_schedule_ft_v1":
              raise SystemExit("ERROR Unexpected V2 source schema")
          print("ENCRYPTED_V2_VERIFIED_FOOTBALL_GAMES",len(content["matches"]))
          PY
      - name: Commit authenticated encrypted snapshots only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/encrypted_football/manifest.enc
          git add research/encrypted_football/days/2025/12/2025-12-20.enc
          unexpected="$(git diff --cached --name-only | grep -Ev '^research/encrypted_football/(manifest\.enc|days/2025/12/2025-12-20\.enc)$' || true)"
          if [[ -n "$unexpected" ]]; then echo "ERROR unexpected files"; exit 1; fi
          if ! git diff --cached --quiet; then
            git commit -m 'data(research): certified encrypted SportsAPI Pro V2 sample day'
            git push origin HEAD:research/single-ml-v2-20261024
          fi
      - name: Result
        run: echo 'SUCCESS - stored one certified V2 football calendar day as encrypted Git archive.'
