name: Actu Foot V2 - Independent recovery rehearsal
on:
  workflow_dispatch:
    inputs:
      backup_run_id:
        description: 'Verified Cloudflare backup GitHub run ID'
        type: string
        required: true
      backup_attempt:
        type: string
        required: true
        default: '1'
  push:
    branches: [main]
    paths:
      - '.github/workflows/actu-foot-v2-recovery.yml'
permissions:
  contents: read
  id-token: write
concurrency:
  group: actu-foot-v2-recovery
  cancel-in-progress: false
jobs:
  rehearse:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: actu-foot-v2-maintenance
    env:
      ACTU_FOOT_V2_KEY_B64_V1: ${{ secrets.ACTU_FOOT_V2_KEY_B64_V1 }}
      ACTU_FOOT_V2_KEY_B64_V2: ${{ secrets.ACTU_FOOT_V2_KEY_B64_V2 }}
      ML_V2_HISTORY_KEY_B64: ${{ secrets.ML_V2_HISTORY_KEY_B64 }}
      ACTU_FOOT_V2_ALLOW_LEGACY_KEY: '1'
      BACKUP_RUN_ID: ${{ inputs.backup_run_id || '40322869492' }}
      BACKUP_ATTEMPT: ${{ inputs.backup_attempt || '1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'cryptography>=43,<47' 'requests>=2.31,<3'
      - name: Restore encrypted snapshot in isolated runner only
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.actu_foot_v2_cloudflare_recovery --run-id "$BACKUP_RUN_ID" --attempt "$BACKUP_ATTEMPT" --destination /tmp/actufoot-v2-rehearsal
          python -m scripts.actu_foot_v2_operations --operation verify --directory /tmp/actufoot-v2-rehearsal
      - name: Archive verified ciphertext only
        uses: actions/upload-artifact@v4
        with:
          name: actufoot-v2-rehearsal-${{ github.run_id }}
          path: /tmp/actufoot-v2-rehearsal/
          retention-days: 7
          if-no-files-found: error
