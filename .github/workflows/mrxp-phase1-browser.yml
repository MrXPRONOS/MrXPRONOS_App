name: MRXP Mobile visual regression (phases 1-5)
on:
  push:
    branches:
      - fix/mrxp-phase1-mobile-layout-share
    paths:
      - .github/workflows/mrxp-phase1-browser.yml
      - mrxpronos-play/tests/phase1-mobile-layout.py
  pull_request:
    paths:
      - mrxpronos-play/worker.js
      - mrxpronos-play/tests/phase1-mobile-layout.py
      - mrxpronos-play/tests/phase45-visual.py
      - mrxpronos-play/tests/audit_real_browser.py
      - .github/workflows/mrxp-phase1-browser.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-layout:
    name: Chromium 320-430px - seven Mini App screens
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser and runner dependencies
        run: |
          python -m pip install --quiet playwright
          if ! command -v google-chrome >/dev/null 2>&1 && ! command -v chromium >/dev/null 2>&1; then
            python -m playwright install chromium
          fi
      - name: Test real Mini App JavaScript against mocked authenticated API
        run: python mrxpronos-play/tests/audit_real_browser.py
      - name: Test phase-1 Mini App mobile layout
        run: python mrxpronos-play/tests/phase1-mobile-layout.py
      - name: Test official square/story PNG and phase 5 mobile pages
        run: python mrxpronos-play/tests/phase45-visual.py
      - name: Keep PNG visual samples for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mrxp-phase45-visual-samples
          path: mrxpronos-play/tests/visual-previews-phase45/*.png
          if-no-files-found: ignore
          retention-days: 14
