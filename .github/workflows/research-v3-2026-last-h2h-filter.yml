name: Research 2026 V3 last-H2H exact-score filter
on:
  push:
    branches: [research/v3-2026-last-h2h-score-filter]
    paths:
      - '.github/workflows/research-v3-2026-last-h2h-filter.yml'
      - 'research/backtest_v3_ytd_last_h2h_filter.py'
      - 'research/test_v3_ytd_last_h2h_filter.py'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
concurrency:
  group: research-v3-2026-last-h2h-match-result
  cancel-in-progress: false
jobs:
  compare-h2h:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: model/research:model:site/scripts
      PYTHONUNBUFFERED: '1'
      ML_V2_HISTORY_KEY_B64: ${{ secrets.ML_V2_HISTORY_KEY_B64 }}
      SPORTDATA_API_KEY_1: ${{ secrets.SPORTDATA_API_KEY_1 }}
      SPORTDATA_API_KEY_2: ${{ secrets.SPORTDATA_API_KEY_2 }}
      SPORTDATA_API_KEY_3: ${{ secrets.SPORTDATA_API_KEY_3 }}
      SPORTDATA_API_KEY_4: ${{ secrets.SPORTDATA_API_KEY_4 }}
      SPORTDATA_API_KEY_5: ${{ secrets.SPORTDATA_API_KEY_5 }}
    steps:
      - name: Checkout private certified match archive without write permission
        uses: actions/checkout@v4
        with:
          path: site
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout isolated H2H research model
        uses: actions/checkout@v4
        with:
          path: model
          ref: research/v3-2026-last-h2h-score-filter
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only certified-source loader requirements
        run: python -m pip install --disable-pip-version-check numpy scipy scikit-learn cryptography requests
      - name: Compile and test prior-day-only H2H matching
        run: |
          python -m py_compile model/research/backtest_v3_ytd_last_h2h_filter.py model/research/test_v3_ytd_last_h2h_filter.py
          python -m unittest discover -s model/research -p 'test_v3_ytd_last_h2h_filter.py' -v
          test -n "$ML_V2_HISTORY_KEY_B64"
      - name: Download authenticated original annual V3 score-leaders artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/mrx-v3-h2h/baseline
          gh run download 41862691713 -R "$GITHUB_REPOSITORY" \
            -n hybrid-v3-2026-ytd-daily-modal-leaders-41862691713 \
            -D /tmp/mrx-v3-h2h/baseline
          echo "79bf973dbf9607c36895096bab62c4af916f5aea04ac501a84270c9242be8558  /tmp/mrx-v3-h2h/baseline/2026-ytd-score-leaders-daily.csv" | sha256sum --check
      - name: Reconcile full 2024-2026 sealed history and filter strictly last H2H
        run: |
          python model/research/backtest_v3_ytd_last_h2h_filter.py \
            --site-root site --model-root model \
            --baseline-csv /tmp/mrx-v3-h2h/baseline/2026-ytd-score-leaders-daily.csv \
            --output-dir /tmp/mrx-v3-h2h/report
      - name: Assert real H2H coverage, yearly sums and unchanged model picks
        run: |
          python - <<'PY'
          import csv,json
          from pathlib import Path
          p=Path("/tmp/mrx-v3-h2h/report")
          r=json.loads((p/"2026-h2h-filter-summary.json").read_text(encoding="utf8"))
          picks=list(csv.DictReader((p/"2026-h2h-filter-all-picks.csv").open(encoding="utf8")))
          kept=list(csv.DictReader((p/"2026-h2h-filter-retained-only.csv").open(encoding="utf8")))
          assert r["baseline_selections"]==3534
          assert r["baseline_hits"]==396
          assert r["baseline_winning_days"]==226
          assert r["days_evaluated"]==307
          assert len(picks)==3534 and len(kept)==r["h2h_retained"]
          assert sum(int(row["hit"]) for row in kept)==r["h2h_retained_hits"]
          assert r["h2h_retained"]<=r["baseline_selections"]
          assert r["h2h_retained_hits"]<=r["baseline_hits"]
          assert sum(r["h2h_status_counts"].values())==3534
          assert r["by_month"]["2026-10"]["original_selections"]==279
          assert r["by_month"]["2026-10"]["original_hits"]==42
          assert len(r["by_month"])==11
          assert len(r["by_day"])==307
          assert all(x["h2h_status"]=="kept_last_h2h_exact_win" for x in kept)
          assert all(x["last_h2h_normalized_score"]==x["score"] for x in kept)
          assert all(x["last_h2h_day"]<x["day"] for x in kept)
          assert all(int(x["last_h2h_age_days"])>=1 for x in kept)
          assert len({(x["day"],x["match_id"]) for x in kept})==len(kept)
          assert sum(x["retained_selections"] for x in r["by_month"].values())==len(kept)
          assert sum(x["retained_hits"] for x in r["by_month"].values())==r["h2h_retained_hits"]
          print("V3_2026_H2H_STRICT_VERIFICATION_PASSED",json.dumps({
             "retained":len(kept),"hits":r["h2h_retained_hits"],
             "rate_pct":r["h2h_retained_hit_rate_pct"],
             "winning_days":r["h2h_winning_days"]
          }))
          PY
      - name: Upload research-only score/H2H audit report, never deploy site
        uses: actions/upload-artifact@v4
        with:
          name: hybrid-v3-2026-last-h2h-exact-score-filter-${{ github.run_id }}
          path: |
            /tmp/mrx-v3-h2h/report/2026-h2h-filter-summary.json
            /tmp/mrx-v3-h2h/report/2026-h2h-filter-all-picks.csv
            /tmp/mrx-v3-h2h/report/2026-h2h-filter-retained-only.csv
          retention-days: 30
          if-no-files-found: error
