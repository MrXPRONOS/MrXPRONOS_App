name: Telegram Bot Buttons - Offline CI
on:
  pull_request:
    paths:
      - 'scripts/telegram_bot_buttons_daily.py'
      - 'tests/test_telegram_bot_buttons_daily.py'
      - 'docs/telegram-button-first-daily.md'
      - '.github/workflows/telegram-bot-buttons-daily.yml'
      - '.github/workflows/telegram-bot-buttons-ci.yml'
      - '.github/workflows/telegram-daily-xpvip-promo.yml'
      - '.github/workflows/telegram-day-based-bookmaker-promos.yml'
      - '.github/workflows/telegram-daily-bookmaker-bonus-ads.yml'
      - '.github/workflows/telegram-daily-bookmaker-guide.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline test dependencies
        run: python -m pip install --disable-pip-version-check 'requests==2.32.5' 'Pillow==11.3.0'
      - run: python -m compileall -q scripts/telegram_bot_buttons_daily.py tests/test_telegram_bot_buttons_daily.py
      - name: Verify button templates and legacy routing without Telegram access
        run: python -m unittest discover -s tests -p test_telegram_bot_buttons_daily.py -v
