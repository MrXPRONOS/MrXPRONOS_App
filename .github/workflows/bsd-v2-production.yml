name: BSD V2 - Generation quotidienne
run-name: "BSD V2 - Generation quotidienne (${{ inputs.trigger_source || github.event_name }})"

on:
  # Extra intraday re-evaluations of only unpublished future fixtures.
  # Existing selections remain frozen by the append-only ledger.
  schedule:
    - cron: '17 11,16 * * *'
  push:
    branches: [main]
    paths:
      - 'bsd/**'
      - 'scripts/football_native_bsd_identity_probe.py'
      - 'scripts/football_cc0_calendar_verification.py'
      - 'scripts/football_daily_multisource_shadow.py'
      - 'scripts/football_multisource_market_gate.py'
      - 'scripts/football_multisource_apply_qualified.py'
      - 'assets/js/main.js'
      - '.github/workflows/bsd-v2-production.yml'
  workflow_dispatch:
    inputs:
      trigger_source:
        description: "Origine cron-job.org ou manuel"
        required: false
        default: "manual"
        type: string

permissions:
  contents: write

concurrency:
  group: bsd-v2-daily-generation
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Journaliser la source
        env:
          TRIGGER_SOURCE: ${{ inputs.trigger_source || github.event_name }}
        run: |
          echo "Déclenchement : ${TRIGGER_SOURCE}"
          echo "Début UTC : $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Install dependencies
        run: python -m pip install requests cryptography pillow
      - name: Compile Python sources
        run: python -m compileall -q bsd
      - name: Run regression tests
        run: python -m unittest discover -s bsd -p 'test_*.py' -v
      - name: Check website JavaScript syntax
        run: node --check assets/js/main.js
      - name: Check pronostic category defaults
        run: node --test tests/pronos-category-selection.test.cjs
      - name: Restore private BSD historical matches
        env:
          BSD_HISTORY_KEY: '${{ secrets.BSD_HISTORY_KEY }}'
        run: python bsd/bsd_archive.py restore
      - name: Build BSD V2 site feed and settle completed matches
        env:
          BSD_API_KEY: '${{ secrets.BSD_API_KEY }}'
          PINNWIRE_API_KEY: ${{ secrets.PINNWIRE_API_KEY }}
          ODDSLINK_API_KEY: ${{ secrets.ODDSLINK_API_KEY }}
          MOVIODDS_ENABLE: '1'
          BSD_MULTISOURCE_CC0: '1'
        run: python bsd/bsd_v2_publish.py --max-requests 1400 --max-odds-events 1000
      - name: Build and apply fully-qualified multisource candidates
        env:
          BSD_API_KEY: '${{ secrets.BSD_API_KEY }}'
          FOOTBALL_MULTI_SOURCE: '0'
        run: |
          set -euo pipefail
          umask 077
          mkdir -p tmp
          php scripts/football_history_import.php             --source=openfootball             --seasons=2023-24,2024-25,2025-26,2026-27             --league-codes=en.1,en.2,de.1,es.1,fr.1,it.1,nl.1,pt.1             --max-files=32             --out=tmp/multisource-qualified-history.jsonl
          test -s tmp/multisource-qualified-history.jsonl
          python scripts/football_prematch_multiday_probe.py             --start-day="$(date -u +%F)"             --count-days=3 --max-http=24             --out=tmp/multisource-public-fixtures.json             --report=tmp/multisource-public-fixtures-aggregate.json
          python scripts/football_native_bsd_identity_probe.py             --public-fixtures=tmp/multisource-public-fixtures.json             --licensed-history=tmp/multisource-qualified-history.jsonl             --existing-feed=data.json --ledger=bsd/publication_ledger.json             --days=3 --start-offset=0             --accepted-output=tmp/multisource-qualified-accepted.json             --report=tmp/multisource-qualified-aggregate.json
          test -f tmp/multisource-qualified-accepted.json
          python scripts/football_multisource_apply_qualified.py             --feed=data.json             --accepted=tmp/multisource-qualified-accepted.json --ledger=bsd/publication_ledger.json --aggregate=tmp/multisource-qualified-aggregate.json
          python - <<'PY'
          import json
          aggregate=json.load(open("tmp/multisource-qualified-aggregate.json",encoding="utf-8"))
          accepted=json.load(open("tmp/multisource-qualified-accepted.json",encoding="utf-8"))
          assert aggregate["calendar_files_verified"] == 8
          assert aggregate["qualified_candidate_rows_staged"] == len(accepted)
          assert len(accepted) <= 8
          print("BSD_MULTISOURCE_FULL_GATE",{
              "cc0_confirmed":aggregate["independent_cc0_calendar_confirmed"],
              "native_links":aggregate["one_to_one_native_event_links"],
              "qualified_rows":len(accepted),
          })
          PY
          rm -f tmp/multisource-qualified-history.jsonl                 tmp/multisource-public-fixtures.json                 tmp/multisource-qualified-accepted.json
      - name: Archive first-seen published selections and audit quality
        run: python bsd/bsd_v2_audit.py --data data.json
      - name: Validate feed and commit website data
        run: |
          python - <<'PY'
          import json
          from bsd.bsd_v2_estimated_odds import valid_standalone_prediction
          data=json.load(open("data.json",encoding="utf-8"))
          assert data["source"]=="bsd" and data["model_version"]=="bsd-v2-isolated"
          assert isinstance(data["matches"],list)
          ms=data.get("diagnostics",{}).get("multisource")
          assert isinstance(ms,dict) and ms.get("enabled") is True, "CC0 production corroboration not executed"
          assert ms.get("mode")=="corroborate_existing_bsd_picks"
          assert ms.get("files_attempted")==8 and ms.get("files_ok",0)<=8
          assert ms.get("never_adds_external_picks") is True
          assert ms.get("changes_prediction_or_quoted_prices") is False
          assert ms.get("changes_pub_policy_or_event_identity") is False
          assert ms.get("no_telegram_messages_sent") is True
          assert 0<=ms.get("calendar_confirmed",0)<=ms.get("future_bsd_rows",0)
          mg=data.get("diagnostics",{}).get("multisource_generation")
          assert isinstance(mg,dict) and mg.get("enabled") is True, "Full multisource candidate gate not executed"
          assert mg.get("mode")=="qualified_external_candidates_through_native_bsd_v2"
          assert mg.get("requires_official_bsd_event_id") is True
          assert mg.get("requires_real_bsd_consensus_selected_market_price") is True
          assert mg.get("requires_v21_and_value_guard") is True
          assert mg.get("uses_native_bsd_v2_assembler") is True
          coverage=mg.get("coverage")
          assert isinstance(coverage,dict), "Multisource summary counts missing in published feed"
          assert coverage["qualified_candidates"]==mg["staged_rows"]
          assert coverage["quote_probe_attempts"]<=8
          assert coverage["quote_attempts_within_48h"]<=coverage["quote_probe_attempts"]
          assert coverage["independent_calendar_confirmed"]<=coverage["public_fixtures_found"]
          assert coverage["cc0_confirmed"]+coverage["two_provider_confirmed"]<=coverage["independent_calendar_confirmed"]
          observations=data.get("model_odds_observations",[])
          assert isinstance(observations,list)
          match_ids={m["id"] for m in data["matches"]}
          assert all(o.get("id") not in match_ids and
                     o.get("publication_status")=="not_published" and
                     o.get("do_not_send_to_telegram") is True and
                     o.get("prediction_eligible") is False and
                     (o.get("market") or {}).get("odds_source")=="mrxpronos_model" and
                     (o.get("market") or {}).get("estimated_odds") is True and
                     (o.get("market") or {}).get("recommendation_eligible") is False
                     for o in observations), "Model observations may not publish or send Telegram"
          assert mg.get("thresholds_lowered") is False
          assert mg.get("telegram_sent_by_this_step") is False
          assert 0<=mg.get("added_rows",0)<=mg.get("staged_rows",0)<=8
          verified=[m for m in data["matches"] if m.get("multisource_verification")]
          assert len(verified)>=mg.get("added_rows",0)
          for match in verified:
              proof=match["multisource_verification"]
              if proof.get("mode")!="qualified_external_candidate":
                  continue
              assert all(proof.get(k) is True for k in (
                  "schedule_corroborated","native_bsd_event_verified",
                  "selected_market_real_consensus_price","v21_and_value_guard_passed",
                  "production_assembler_created_row"))
              for pick in (match.get("predictions") or [match["prediction"]]):
                  assert pick.get("odds_source")=="bsd_consensus"
                  assert pick.get("estimated_odds") is False
          print("BSD_MULTISOURCE_PRODUCTION_HEALTH",{
              "files_ok":ms.get("files_ok"),"confirmed_existing":ms.get("calendar_confirmed"),
              "staged_new":mg.get("staged_rows"),"added_new":mg.get("added_rows")})
          assert all(m["source"]=="bsd" and m["prediction"]["selection_key"] for m in data["matches"])
          assert all(
              valid_standalone_prediction(m["prediction"], m.get("combo_only",False))
              for m in data["matches"]
          ), "Invalid BSD or estimated priced selection in published feed"
          print("BSD_V2_PRICED_FEED_OK",len(data["matches"]))
          for match in data["matches"]:
              selections=match.get("predictions") or [match["prediction"]]
              assert 1<=len(selections)<=2, "Max 2 predictions per fixture"
              assert selections[0]["selection_key"]==match["prediction"]["selection_key"]
              assert len({p["selection_key"] for p in selections})==len(selections)
              assert len({p["market"] for p in selections})==len(selections), "Market families must differ"
              for pick in selections:
                  assert valid_standalone_prediction(pick,match.get("combo_only",False)), (
                      f"Invalid pick: match={match.get('id')} selection={pick.get('selection_key')} "
                      f"source={pick.get('odds_source')} odds={pick.get('odds')} "
                      f"estimated={pick.get('estimated_odds')}")
          for match in data["matches"]:
              combo=match.get("combo_prediction")
              if combo:
                  assert type(combo["odds"]) in (int,float) and 1.01<=combo["odds"]<1.50
                  assert combo["odds_source"] in ("bsd_consensus","bsd_bookmaker","pinnwire","oddslink","moviodds","oddsharvester")
                  assert combo["selection_key"]!="UNDER_45"
          print("BSD_V2_FEED_OK",len(data["matches"]))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json bsd/publication_ledger.json bsd/quality_report.json
          if ! git diff --cached --quiet; then
            git commit -m "data(bsd): publish V2 football picks and verified results"
            pushed=0
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push origin HEAD:main; then
                pushed=1
                break
              fi
              echo "Push concurrent rejeté (tentative ${attempt}/5), nouveau rebase avant retry"
              sleep $((attempt * 2))
            done
            if [ "$pushed" -ne 1 ]; then
              echo "Impossible de publier les données BSD V2 après 5 tentatives" >&2
              exit 1
            fi
          fi
      - name: Upload per-match price and rejection diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: bsd-v2-market-rejections
          path: bsd/rejections_report.json
          retention-days: 14
          if-no-files-found: error
      - name: Prepare public browser config
        env:
          PUBLIC_SUPABASE_URL: '${{ secrets.SUPABASE_URL }}'
          PUBLIC_SUPABASE_ANON_KEY: '${{ secrets.SUPABASE_ANON_KEY }}'
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          source=Path("config.template.js")
          if source.exists():
              value=source.read_text(encoding="utf-8")
              value=value.replace("SUPABASE_URL",os.environ.get("PUBLIC_SUPABASE_URL",""))
              value=value.replace("SUPABASE_ANON_KEY",os.environ.get("PUBLIC_SUPABASE_ANON_KEY",""))
              target=Path("assets/js/config.js")
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_text(value,encoding="utf-8")
          PY
      - name: Remove private runtime files before website deployment
        run: |
          rm -f bsd/all_matches_bsd.json bsd/backfill_state.json bsd/v2_calibration.json bsd/rejections_report.json
          rm -rf bsd/cache bsd/private_history
      - name: Deploy updated BSD V2 website on GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: '${{ secrets.GITHUB_TOKEN }}'
          publish_dir: ./
          destination_dir: ./
          keep_files: true

