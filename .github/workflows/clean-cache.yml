name: Nettoyage cache (Neon PostgreSQL)
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mrx-neon-clean-cache
  cancel-in-progress: false

jobs:
  clean-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer le pilote PostgreSQL
        run: python -m pip install --disable-pip-version-check "psycopg[binary]>=3.2,<4"
      - name: Supprimer anciennes FAQ et conversations (Neon)
        env:
          NEON_DB_URL: ${{ secrets.NEON_DB_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${NEON_DB_URL:-}" ]; then
            echo "::error::NEON_DB_URL manquant dans GitHub Actions Secrets"
            exit 1
          fi
          python3 - <<'PY'
          import os, psycopg
          with psycopg.connect(os.environ["NEON_DB_URL"], connect_timeout=15) as conn:
              with conn.cursor() as cur:
                  cur.execute("DELETE FROM public.faq WHERE created_at < now() - INTERVAL '30 days'")
                  faq_deleted=cur.rowcount
                  cur.execute("DELETE FROM public.conversations WHERE created_at < now() - INTERVAL '7 days'")
                  conversations_deleted=cur.rowcount
              conn.commit()
          print(f"Neon cleanup successful: faq={faq_deleted}, conversations={conversations_deleted}")
          PY
