name: Neon private cache cleanup

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Écrire exactement PURGER_CACHE pour autoriser la suppression des caches expirés"
        required: true
        type: string

permissions:
  contents: read

jobs:
  cleanup:
    if: ${{ inputs.confirm == 'PURGER_CACHE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Purge expired non-public caches only after explicit confirmation
        run: |
          python - <<'PY'
          import json,os,psycopg
          dsn=os.getenv("NEON_DATABASE_URL","").strip()
          if not dsn:raise SystemExit("Missing NEON_DATABASE_URL GitHub secret")
          with psycopg.connect(dsn,connect_timeout=12) as db:
              with db.cursor() as cur:
                  cur.execute("SELECT current_database()")
                  if cur.fetchone()[0]!="mrxpronos":raise SystemExit("Wrong Neon database")
                  cur.execute("SELECT mrx_internal.clean_cache()")
                  result=cur.fetchone()[0]
                  print("NEON_CACHE_CLEANUP",json.dumps(result,ensure_ascii=False))
          PY
