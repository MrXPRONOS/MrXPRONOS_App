name: Diagnostic V5 - October 8 real fixture coverage (no publishing)
on:
  pull_request:
    paths:
      - '.github/workflows/diagnose-oct8-fixtures-v5.yml'
      - 'dixon-coles/dcscore/daily_espn.py'
      - 'dixon-coles/dcscore/daily_popularity.py'
      - 'dixon-coles/dcscore/daily_pipeline.py'
      - 'dixon-coles/dcscore/backtest_two_pass_v5.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent model
        run: python -m pip install -e 'dixon-coles[test]'
      - name: Unit tests including anti-duplicate and source validation
        run: cd dixon-coles && python -m pytest -q tests/test_daily_two_pass.py tests/test_daily_espn.py tests/test_backtest_two_pass_v5.py
      - name: Retrospective October 8 real fixtures only
        working-directory: dixon-coles
        run: |
          python -m dcscore.backtest_two_pass_v5 --start 2026-10-08 --end 2026-10-08 --out results/diagnostics/oct8_v5
          python - <<'PY'
          import json
          from pathlib import Path
          file=Path('results/diagnostics/oct8_v5/backtest_oct2026_v5.json')
          data=json.loads(file.read_text())
          day=data['days'][0]
          print('OCT8_V5_AUDIT',json.dumps({
            'date':day['date'],
            'selected':day['selected'],
            'second_pass':day['second_pass_count'],
            'extra_match_candidates':day['second_pass_fixtures_discovered'],
            'ten_real_games':day['has_at_least_10_real_fixtures'],
            'per_competition_discovery':day['per_competition_discovery'],
            'source_warnings':day['source_warnings'],
            'selected_matches':[{
                'competition':x['competition'],'home':x['home'],'away':x['away'],
                'selection_pass':x['selection_pass'],
                'prediction_basis':x['prediction_basis']}
                for x in data['matches']]
          },ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: V5-oct08-real-fixture-source-audit
          path: dixon-coles/results/diagnostics/oct8_v5/*
          if-no-files-found: warn
          retention-days: 21
