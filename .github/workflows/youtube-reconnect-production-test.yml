name: YouTube Reconnect - Production Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config/youtube_reconnect_test.txt"

permissions:
  contents: read
  actions: read

jobs:
  youtube-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_PRIVACY_STATUS: public

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Download the exact production video artifact
        uses: actions/download-artifact@v4
        with:
          name: shorts-coupons-production-evening
          run-id: 39066707530
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: retry_artifact

      - name: Verify artifact
        shell: bash
        run: |
          set -euo pipefail
          VIDEO="$(find retry_artifact -type f -name '*.mp4' | head -n 1)"
          test -n "$VIDEO"
          test -s "$VIDEO"
          echo "VIDEO_FILE=$VIDEO" >> "$GITHUB_ENV"
          ls -lh "$VIDEO"

      - name: Publish YouTube only
        run: |
          python scripts/post_shorts_video.py             --video "$VIDEO_FILE"             --platforms youtube             --title "Pronostics 2026-10-18 - Mr XPRONOS"             --description "Pronostics Mr XPRONOS du 18 octobre 2026. 18+ et joue responsablement."             --caption "Pronostics Mr XPRONOS ⚽\n18+ • Joue responsablement.\n\n#football #pronostic #pronosdujour #mrxpronos"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-reconnect-test-report
          path: social_post_results.json
          if-no-files-found: ignore
          retention-days: 7
