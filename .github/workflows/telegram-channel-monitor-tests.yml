name: Telegram monitor V2 - tests sans connexion Telegram
on:
  push:
    branches: [main]
    paths:
      - 'scripts/telegram_channel_monitor_v2.py'
      - 'scripts/telegram_research/discover_foot_channels.py'
      - 'tests/test_telegram_channel_monitor_v2.py'
      - '.github/workflows/telegram-channel-monitor-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Telethon and requests (no account authorization)
        run: python -m pip install 'telethon>=1.36,<2' 'requests>=2.31,<3'
      - name: Syntax validation
        run: python -m py_compile scripts/telegram_channel_monitor_v2.py scripts/telegram_research/discover_foot_channels.py
      - name: Offline unit tests
        run: python -m unittest discover -s tests -p 'test_telegram_channel_monitor_v2.py' -v
