name: XPRONOS 4+ - Cloudflare Worker & D1 (sans Supabase)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloudflare/xpronos-coupons-bot/**'
      - '.github/workflows/xpronos-cloudflare-bot-deploy.yml'

permissions:
  contents: read

concurrency:
  group: xpronos-coupons-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || vars.XPRONOS_CF_AUTO_DEPLOY == 'true' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-free-pronos]'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 9c86118191b804d91b5f5b2c89114999
      XPRONOS_CF_BOT_TOKEN: ${{ secrets.XPRONOS_CF_BOT_TOKEN }}
      CF_BOT_ADMIN_IDS: ${{ vars.XPRONOS_COUPON_ADMIN_IDS }}
      CF_BOT_CHANNELS_JSON: ${{ vars.XPRONOS_COUPON_CHANNELS_JSON || '[]' }}
      WORKER_URL: https://xpronos-coupons-bot.cinecanaux-xpronos.workers.dev
      CI: '1'

    defaults:
      run:
        working-directory: cloudflare/xpronos-coupons-bot
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Contrôler la configuration sans afficher les tokens
        run: |
          set -euo pipefail
          for item in CLOUDFLARE_API_TOKEN XPRONOS_CF_BOT_TOKEN CF_BOT_ADMIN_IDS; do
            if [[ -z "${!item:-}" ]]; then
              echo "::error::Identifiant ou variable manquant : $item"
              exit 1
            fi
          done
          if ! [[ "$CF_BOT_ADMIN_IDS" =~ ^[0-9]+(,[0-9]+)*$ ]]; then
            echo '::error::XPRONOS_COUPON_ADMIN_IDS doit contenir des identifiants numériques (séparés par virgule).'
            exit 1
          fi
          python3 - <<'PY'
          import os,json,re
          cs=json.loads(os.environ['CF_BOT_CHANNELS_JSON'])
          assert isinstance(cs,list), 'La variable des canaux doit être un tableau JSON'
          for c in cs:
              assert isinstance(c,dict) and re.fullmatch(r'(@\w{5,}|-100\d{5,})',str(c.get('id',''))) and str(c.get('url','')).startswith('https://t.me/'), 'Canal non valide'
          print('Configuration des canaux validée.')
          PY

      - name: Exécuter les tests du bot et de la base D1
        run: |
          set -euo pipefail
          node --test tests/*.test.js
          python3 tests/test_schema.py
          python3 tests/test_v2.py
          python3 tests/test_v3.py
          python3 tests/test_v4.py

      - name: Installer Wrangler version déterministe
        run: npm install --no-save --package-lock=false --no-audit --no-fund wrangler@4.50.0

      - name: Vérifier la CLI Wrangler
        run: |
          npx --no-install wrangler --version
          npx --no-install wrangler d1 migrations apply --help >/dev/null
          npx --no-install wrangler deploy --help >/dev/null
          npx --no-install wrangler secret put --help >/dev/null

      - name: Appliquer uniquement les migrations D1 du bot
        run: npx --no-install wrangler d1 migrations apply xpronos-coupons-bot --remote

      - name: Déployer XPRONOS 4+ sur Cloudflare
        run: npx --no-install wrangler deploy

      - name: Configurer les secrets Worker et remplacer le webhook Telegram
        run: |
          set -euo pipefail
          # Les valeurs sont envoyées sur stdin. Ne jamais les afficher.
          printf '%s' "$XPRONOS_CF_BOT_TOKEN" | npx --no-install wrangler secret put CF_BOT_TOKEN --name xpronos-coupons-bot
          printf '%s' "$CF_BOT_ADMIN_IDS" | npx --no-install wrangler secret put CF_BOT_ADMIN_IDS --name xpronos-coupons-bot
          printf '%s' "$CF_BOT_CHANNELS_JSON" | npx --no-install wrangler secret put CF_BOT_CHANNELS_JSON --name xpronos-coupons-bot
          new_secret="$(openssl rand -hex 32)"
          printf '%s' "$new_secret" | npx --no-install wrangler secret put CF_BOT_WEBHOOK_SECRET --name xpronos-coupons-bot

          python3 - <<'PY'
          import json, os, urllib.error, urllib.request
          base = os.environ['WORKER_URL'].rstrip('/')

          def request(path):
              req = urllib.request.Request(base + path, headers={
                  'Accept': 'application/json',
                  'User-Agent': 'MrXPRONOS-Cloudflare-Healthcheck/1.0',
              })
              try:
                  with urllib.request.urlopen(req, timeout=20) as res:
                      return res.status, dict(res.headers), res.read(4096)
              except urllib.error.HTTPError as err:
                  return err.code, dict(err.headers), err.read(4096)

          code, headers, body = request('/health')
          print('Cloudflare Worker /health: HTTP', code, '(Ray ID:', headers.get('cf-ray', 'non fourni'), ')')
          if code == 200:
              try:
                  status = json.loads(body).get('status')
              except (json.JSONDecodeError, ValueError):
                  raise SystemExit('Healthcheck HTTP 200, mais JSON de santé invalide.')
              if status != 'ready':
                  raise SystemExit('Le Worker répond, mais sa configuration est incomplète.')
              print('Worker Cloudflare prêt : /health a confirmé ready.')
          elif code == 403:
              other, other_headers, _ = request('/')
              print('Cloudflare Worker / : HTTP', other, '(Ray ID:', other_headers.get('cf-ray', 'non fourni'), ')')
              if other != 403:
                  raise SystemExit('La racine est joignable, mais /health est interdite : diagnostiquer la protection du chemin.')
              print('::warning::La passerelle workers.dev renvoie 403 depuis GitHub sur tous les chemins. Le code du Worker /health ne retourne pas 403. Le déploiement et les secrets sont déjà confirmés par Wrangler ; on enregistre le webhook pour tester ensuite le trajet Telegram -> Cloudflare.')
              print('::warning::Si /start reste sans réponse, tester l’URL workers.dev depuis un navigateur et consulter Cloudflare Worker Observability / règles de sécurité.')
          else:
              raise SystemExit('Worker Cloudflare inaccessible : /health retourne HTTP ' + str(code))
          PY

          export NEW_WEBHOOK_SECRET="$new_secret"
          python3 - <<'PY'
          import json,os,urllib.parse,urllib.request
          bot=os.environ['XPRONOS_CF_BOT_TOKEN']
          api='https://api.telegram.org/bot'+bot+'/'
          endpoint=os.environ['WORKER_URL']+'/telegram'
          data=urllib.parse.urlencode({
              'url':endpoint,
              'secret_token':os.environ['NEW_WEBHOOK_SECRET'],
              'max_connections':8,
              'allowed_updates':json.dumps(['message','callback_query'])
          }).encode('utf-8')
          with urllib.request.urlopen(urllib.request.Request(api+'setWebhook',data=data,method='POST'),timeout=20) as r:
              result=json.load(r)
          if not result.get('ok'):
              raise SystemExit('Telegram a refusé le nouveau webhook.')
          with urllib.request.urlopen(api+'getWebhookInfo',timeout=20) as r:
              info=json.load(r)
          if not info.get('ok') or info.get('result',{}).get('url')!=endpoint:
              raise SystemExit('Webhook Telegram mal configuré.')
          print('Webhook Telegram enregistré vers Cloudflare Workers (Supabase abandonné pour ce bot).')
          PY

      - name: Configurer la fiche Telegram et le bouton Mini App Free Pronos
        # L'affichage de la fiche est accessoire : ne jamais bloquer le bot si
        # Telegram refuse une métadonnée. Aucun token n'est journalisé.
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error
          api='https://api.telegram.org/bot'+os.environ['XPRONOS_CF_BOT_TOKEN']+'/'
          app=os.environ['WORKER_URL'].rstrip('/')+'/app'
          cmds=[
            ('start','Démarrer Free Pronos'),
            ('dashboard','Mon tableau de bord'),
            ('coupons','Découvrir les coupons cote 4+'),
            ('xp','Mes XP et mon niveau'),
            ('history','Historique de mes XP'),
            ('daily','Mission quotidienne +3 XP'),
            ('weekly','Mission hebdomadaire +10 XP'),
            ('tasks','Missions des canaux'),
            ('alerts','Gérer mes notifications'),
            ('results','Résultats des coupons vérifiés'),
            ('referrals','Mes parrainages'),
            ('share','Partager Free Pronos'),
            ('help','Aide et fonctionnement'),
            ('support','Contacter l’assistance'),
            ('mytickets','Mes demandes d’assistance')
          ]
          actions={
            'setMyName':{'name':'Free Pronos'},
            'setMyShortDescription':{'short_description':'⚽ Free Pronos : coupons football 4+, missions, XP et communauté. 18+. Aucun gain garanti.'},
            'setMyDescription':{'description':'⚽ Free Pronos : découvre des coupons football de cote 4+, réalise des missions, gagne des XP virtuels et consulte ton suivi personnel. Les XP ne sont pas convertibles en argent. Aucun pronostic ne garantit un résultat. Service 18+ uniquement.'},
            'setMyCommands':{'commands':[{'command':a,'description':b} for a,b in cmds]},
            'setChatMenuButton':{'menu_button':{'type':'web_app','text':'Free Pronos','web_app':{'url':app}}}
          }
          for method,payload in actions.items():
              request=urllib.request.Request(api+method,
                data=json.dumps(payload,ensure_ascii=False).encode('utf-8'),
                headers={'Content-Type':'application/json'},method='POST')
              try:
                  with urllib.request.urlopen(request,timeout=20) as result:
                      response=json.load(result)
                  if response.get('ok'):
                      print('Fiche Telegram mise à jour :',method)
                  else:
                      print('::warning::Telegram refuse une métadonnée :',method)
              except (urllib.error.URLError,ValueError) as error:
                  print('::warning::Mise à jour facultative de la fiche impossible :',method)
          PY

      - name: Contrôle réel de la Mini App et de la protection des comptes
        run: |
          python3 - <<'PY'
          import os,urllib.request,urllib.error
          base=os.environ['WORKER_URL'].rstrip('/')

          def check(path):
              request=urllib.request.Request(base+path,headers={
                  'Accept':'text/html,application/json',
                  'User-Agent':'FreePronos-Production-SmokeTest/1.0'
              })
              try:
                  with urllib.request.urlopen(request,timeout=20) as response:
                      return response.status,response.read(32768),response.headers.get('content-type','')
              except urllib.error.HTTPError as err:
                  return err.code,err.read(512),err.headers.get('content-type','')

          health,body,_=check('/health')
          if health!=200 or b'ready' not in body:
              raise SystemExit('Erreur de santé sur Cloudflare : HTTP '+str(health))
          page,body,ctype=check('/app')
          if page!=200 or 'text/html' not in ctype or b'<title>Free Pronos' not in body or b'telegram-web-app.js' not in body:
              raise SystemExit('Mini App inaccessible ou contenu attendu manquant : HTTP '+str(page))
          protected,_,_=check('/api/me')
          if protected!=401:
              raise SystemExit('SECURITE : /api/me sans signature doit répondre 401, obtenu '+str(protected))
          print('Free Pronos : Worker HTTP 200, Mini App HTTP 200 et API privée HTTP 401 sans signature.')
          PY

      - name: Installer la photo officielle Free Pronos
        if: contains(github.event.head_commit.message, '[set-free-pronos-avatar]') || (github.event_name == 'workflow_dispatch' && vars.FREE_PRONOS_AVATAR_UPDATE == 'true')
        run: |
          python3 -m pip install --disable-pip-version-check --quiet 'CairoSVG>=2.7,<3' 'Pillow>=10,<13'
          python3 scripts/set_profile.py

      - name: Tester réellement l'envoi des notifications Telegram
        if: contains(github.event.head_commit.message, '[verify-free-pronos-alerts]') || (github.event_name == 'workflow_dispatch' && vars.FREE_PRONOS_ALERT_TEST == 'true')
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          bot=os.environ['XPRONOS_CF_BOT_TOKEN']
          admin=os.environ['CF_BOT_ADMIN_IDS'].split(',')[0].strip()
          payload=json.dumps({
            'chat_id':int(admin),'parse_mode':'HTML',
            'text':'🔔 <b>FREE PRONOS — TEST LIVRAISON</b>\n\n✅ Le service de notifications Telegram répond correctement.\n<i>Ceci est un test technique de l’administrateur, sans modification des XP ni des coupons.</i>'
          },ensure_ascii=False).encode('utf-8')
          request=urllib.request.Request('https://api.telegram.org/bot'+bot+'/sendMessage',
            data=payload,headers={'Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(request,timeout=20) as response:
            result=json.load(response)
          if not result.get('ok') or not result.get('result',{}).get('message_id'):
            raise SystemExit('Le message de test Telegram n’a pas été accepté.')
          print('Free Pronos : message test de notification accepté par Telegram, message ID '+str(result['result']['message_id']))
          PY
