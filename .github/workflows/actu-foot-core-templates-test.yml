name: Actu Foot - 4 templates premium TEST
# Validation 4 templates dédiée - branch test only

on:
  push:
    branches:
      - test/actu-foot-premium-templates
    paths:
      - 'scripts/template_cards.py'
      - 'scripts/football_channel.py'
      - 'scripts/actu_foot_core_templates_test_send.py'
      - 'assets/images/template_compositions_officielles_v2.b64/**'
      - '.github/workflows/actu-foot-core-templates-test.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: actu-foot-core-templates-test
  cancel-in-progress: false

jobs:
  render-and-send-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      FOOTBALL_NEWS_BOT_TOKEN: ${{ secrets.FOOTBALL_NEWS_BOT_TOKEN }}
      TELEGRAM_TEST_CHAT_ID: ${{ secrets.TELEGRAM_TEST_CHAT_ID || '@predict_mrxp' }}
      TELEGRAM_TEST_GUARD_BOT_TOKEN: ${{ secrets.FOOTBALL_NEWS_BOT_TOKEN }}
      PYTHONUNBUFFERED: '1'

    steps:
      - name: Checkout branche TEST
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer dépendances
        run: python -m pip install --disable-pip-version-check Pillow requests

      - name: Compiler les renderers
        run: |
          python -m py_compile             scripts/template_cards.py             scripts/football_channel.py             scripts/actu_foot_core_templates_test_send.py             scripts/telegram_test_guard.py             scripts/telegram_rich.py

      - name: Vérifier le nouveau template Composition
        run: |
          python - <<'PY'
          import base64
          import io
          from pathlib import Path
          from PIL import Image

          folder = Path("assets/images/template_compositions_officielles_v2.b64")
          parts = sorted(folder.glob("*.txt"))
          assert [p.name for p in parts] == ["01.txt", "02.txt", "03.txt", "04.txt"], [p.name for p in parts]
          encoded = "".join(p.read_text(encoding="utf-8").strip() for p in parts)
          raw = base64.b64decode(encoded, validate=True)
          with Image.open(io.BytesIO(raw)) as im:
              assert im.size == (1374, 1145), im.size
              assert im.format == "WEBP", im.format
          print("COMPOSITION_V2_OK", len(raw), "bytes", (1374, 1145))
          PY

      - name: Vérifier strictement le canal TEST
        run: python scripts/telegram_test_guard.py

      - name: Envoyer les 4 previews dans Telegram TEST
        run: python scripts/actu_foot_core_templates_test_send.py
