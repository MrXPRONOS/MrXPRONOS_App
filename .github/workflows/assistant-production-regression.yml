name: Assistant public LIVE - production regression
on:
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: npm ci --ignore-scripts
      - name: Install Chromium
        run: npx playwright install chromium --with-deps
      - name: Check published LIVE on mobile and desktop
        run: node tests/assistant_production_live_smoke.mjs
