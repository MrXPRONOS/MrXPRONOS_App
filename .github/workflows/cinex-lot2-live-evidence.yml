name: CineX Lot 2 - Verification de vraies publications sans modification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cinex-lot2-live-evidence.yml'
      - 'telegram-film-relay/scripts/cinex_lot2_live_evidence.py'
      - 'telegram-film-relay/tests/test_cinex_lot2_live_evidence.py'
  schedule:
    - cron: '17 6 * * *'
  pull_request:
    paths:
      - '.github/workflows/cinex-lot2-live-evidence.yml'
      - 'telegram-film-relay/scripts/cinex_lot2_live_evidence.py'
      - 'telegram-film-relay/tests/test_cinex_lot2_live_evidence.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mrx-telegram-personal-account
  cancel-in-progress: false
  queue: max

jobs:
  test-only:
    if: github.event_name == 'pull_request'
    name: Tester la validation sans secrets Telegram
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: telegram-film-relay
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les dependances
        run: python -m pip install -r requirements.txt
      - name: Cas limites de l'audit (aucune connexion)
        run: |
          python -m py_compile scripts/cinex_lot2_live_evidence.py
          python -m unittest discover -s tests -p 'test_cinex_lot2_live_evidence.py' -v
  inspect:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    name: Comparer 4 boutons publics, 3 prives et recu D1
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: telegram-film-relay
    env:
      PYTHONPATH: .
      TG_API_ID: ${{ secrets.TG_API_ID }}
      TG_API_HASH: ${{ secrets.TG_API_HASH }}
      TG_STRING_SESSION: ${{ secrets.TG_SESSION_STRING || secrets.TG_STRING_SESSION || secrets.TG_STREAM_SESSION }}
      TG_PRIVATE_CHANNEL: ${{ vars.TG_PRIVATE_CHANNEL }}
      SERIES_PUBLIC_CHANNEL: ${{ vars.SERIES_PUBLIC_CHANNEL || '@seriesvf_cinex' }}
      SERIES_PRIVATE_CHANNEL: ${{ vars.SERIES_PRIVATE_CHANNEL }}
      DESIR_PUBLIC_CHANNEL: ${{ vars.DESIR_PUBLIC_CHANNEL || '@CineXDesirfr' }}
      DESIR_PRIVATE_CHANNEL: ${{ vars.DESIR_PRIVATE_CHANNEL }}
      COMEDIE_PUBLIC_CHANNEL: ${{ vars.COMEDIE_PUBLIC_CHANNEL || '@CineXComediefr' }}
      COMEDIE_PRIVATE_CHANNEL: ${{ vars.COMEDIE_PRIVATE_CHANNEL }}
      ANIME_PUBLIC_CHANNEL: ${{ vars.ANIME_PUBLIC_CHANNEL || '@CineXAnimeFR' }}
      ANIME_PRIVATE_CHANNEL: ${{ vars.ANIME_PRIVATE_CHANNEL }}
      ACTION_PUBLIC_CHANNEL: ${{ vars.ACTION_PUBLIC_CHANNEL || '@filmsaction2026vf' }}
      ACTION_PRIVATE_CHANNEL: ${{ vars.ACTION_PRIVATE_CHANNEL }}
      CINEX_FILM_FOLDER_URL: ${{ vars.CINEX_FILM_FOLDER_URL || 'https://t.me/addlist/ZmW4vfwcrMAwNzJk' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CINEX_RESCUE_RUNTIME_FILE: /tmp/cinex-lot2-invites-${{ github.run_id }}.json
    steps:
      - uses: actions/checkout@v4
      - name: Respecter les cooldowns du compte Telegram
        env:
          TG_PERSONAL_COOLDOWN_UNTIL_UTC: ${{ vars.TG_PERSONAL_COOLDOWN_UNTIL_UTC }}
        run: python scripts/check_personal_cooldown.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: telegram-film-relay/requirements.txt
      - name: Installer les dependances
        run: python -m pip install -r requirements.txt
      - name: Tester en local sans Telegram ni D1
        run: |
          python -m py_compile scripts/cinex_lot2_live_evidence.py
          python -m unittest discover -s tests -p 'test_cinex_lot2_live_evidence.py' -v
      - name: Obtenir les invitations déjà existantes sans les exposer
        run: python -m film_relay.rescue_links_runtime --output "$CINEX_RESCUE_RUNTIME_FILE"
      - name: Vérifier les nouvelles fiches réellement présentes (aucune publication)
        run: python scripts/cinex_lot2_live_evidence.py --limit 600
      - name: Supprimer le cache d'invitations du runner
        if: always()
        run: rm -f "$CINEX_RESCUE_RUNTIME_FILE"
