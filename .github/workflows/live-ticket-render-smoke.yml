name: Mr XPRONOS true LIVE ticket visual smoke
on:
  push:
    branches: [fix/neon-live-original-vector-coupons-20261022]
    paths: [.github/workflows/live-ticket-render-smoke.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Fetch isolated Cloudflare SVG ticket render (never send Telegram)
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,struct
          url='https://mrxpronos-live-coupon-visual-test.cinecanaux-xpronos.workers.dev/render-demo'
          req=urllib.request.Request(url,headers={'User-Agent':'MrXPRONOS-LIVE-Ticket-VisualCheck/1.0'})
          try:
            with urllib.request.urlopen(req,timeout=90) as r:
              data=r.read()
              print('STATUS',r.status,'CONTENT_TYPE',r.headers.get('content-type'),'SIZE',len(data))
          except urllib.error.HTTPError as e:
            print('ERROR_STATUS',e.code,'BODY',e.read(1500).decode(errors='replace'))
            raise
          assert data[:8]==b'\x89PNG\r\n\x1a\n', 'Not a PNG'
          w,h=struct.unpack('>II',data[16:24])
          print('PREVIEW_PNG_DIMENSIONS',w,h)
          assert w==429 and 455<h<600,(w,h)
          open('mrxpronos_svg_live_preview.png','wb').write(data)
          print('VISUAL_RENDER_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mrxpronos-live-svg-preview
          path: mrxpronos_svg_live_preview.png
          if-no-files-found: ignore
