name: CineX - Abonnement facultatif (configuration)

on:
  workflow_dispatch:
    inputs:
      activate:
        description: "Activer (sinon diagnostic uniquement)"
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: mrxpronos-telegram-membership-setup
  cancel-in-progress: false

jobs:
  optional-membership:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.FOOTBALL_NEWS_BOT_TOKEN }}
      FOOTBALL_NEWS_BOT_TOKEN: ${{ secrets.FOOTBALL_NEWS_BOT_TOKEN }}
      CINEX_MEMBERSHIP_CHANNEL: ${{ vars.CINEX_MEMBERSHIP_CHANNEL || vars.TG_PUBLIC_CHANNEL }}
      TELEGRAM_MEMBERSHIP_WEBHOOK_URL: https://nhwafcpndlufzzxexikh.supabase.co/functions/v1/telegram-membership
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer requests
        run: python -m pip install requests
      - name: Vérifier canal public, bot et webhook sans modifier
        run: python scripts/cinex_optional_membership_setup.py --check-only
      - name: Installer Supabase CLI si activation explicite
        if: ${{ inputs.activate }}
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Déployer le webhook partagé avec support CinéX
        if: ${{ inputs.activate }}
        run: |
          supabase functions deploy telegram-membership \
            --project-ref nhwafcpndlufzzxexikh \
            --no-verify-jwt
      - name: Activer le bouton facultatif et épingler le message
        if: ${{ inputs.activate }}
        run: python scripts/cinex_optional_membership_setup.py
