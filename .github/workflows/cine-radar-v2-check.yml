name: Cine Radar V2 — Validate (no deployment)
on:
  push:
    branches:
      - feature/cine-radar-v2-2026-11-16
    paths:
      - 'cinecanaux/**'
      - '.github/workflows/cine-radar-v2-check.yml'
  pull_request:
    paths:
      - 'cinecanaux/**'
      - '.github/workflows/cine-radar-v2-check.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in cinecanaux/src/*.mjs; do
            node --check "$file"
          done
      - name: Tests
        run: node --test cinecanaux/tests/*.test.mjs
      - name: No accidental production deployment
        run: |
          echo "CI validation only: no Cloudflare deployment, no D1 writes."
