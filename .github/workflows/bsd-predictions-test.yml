name: BSD - Predictions experimentales

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: Date UTC (YYYY-MM-DD), vide pour aujourd hui
        required: false
        default: ''
      days:
        description: Nombre de jours a examiner (1 a 3)
        required: false
        default: '1'

permissions:
  contents: read

concurrency:
  group: bsd-experimental-predictions
  cancel-in-progress: false

jobs:
  bsd-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install requirements
        run: python -m pip install requests cryptography
      - name: Offline tests
        run: python -m unittest discover -s bsd -p 'test_*.py' -v
      - name: Restore encrypted historical JSON locally
        env:
          BSD_HISTORY_KEY: '${{ secrets.BSD_HISTORY_KEY }}'
        run: python bsd/bsd_archive.py restore
      - name: Fit probability calibration on 2025 only
        run: python bsd/bsd_calibrate.py --year 2025 --max-fixtures 3000
      - name: Historical backtest (exploratory, no API)
        run: python bsd/bsd_backtest.py --year 2026 --max-fixtures 500
      - name: Generate test BSD predictions only
        env:
          BSD_API_KEY: '${{ secrets.BSD_API_KEY }}'
          TARGET_DATE: '${{ inputs.target_date }}'
          DAYS: '${{ inputs.days }}'
        run: |
          DATE="${TARGET_DATE:-$(date -u +%F)}"
          python bsd/bsd_generate.py --date "$DATE" --days "${DAYS:-1}" --max-pages 5 --max-requests 10
      - name: Validate output shape
        run: |
          python -c 'import json; d=json.load(open("bsd/data_bsd.json")); assert d["source"] == "bsd" and d["experimental"] and not d["published"]; assert isinstance(d["matches"], list); print("BSD_TEST_OUTPUT_OK", len(d["matches"]))'
      - name: Upload derived predictions artifact (not site)
        uses: actions/upload-artifact@v4
        with:
          name: bsd-experimental-predictions
          path: bsd/data_bsd.json
          retention-days: 3
          if-no-files-found: error
