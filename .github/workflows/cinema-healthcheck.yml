name: Cinema Telegram - diagnostic sécurisé (15 formats)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/cinema_healthcheck.py'
      - 'tests/test_cinema_healthcheck.py'
      - '.github/workflows/cinema-healthcheck.yml'

permissions:
  contents: read

concurrency:
  group: cinema-healthcheck-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install free dependencies
        run: python -m pip install requests

      - name: All 15 formats - unit tests (no Telegram posts)
        run: |
          python -m unittest discover -s tests -p 'test_cinema_telegram.py' -v
          python -m unittest discover -s tests -p 'test_cinema_batch2.py' -v
          python -m unittest discover -s tests -p 'test_cinema_batch3.py' -v
          python -m unittest discover -s tests -p 'test_cinema_healthcheck.py' -v

      - name: Preview all 15 formats offline
        run: |
          python scripts/cinema_telegram.py --mode test --format all --demo --dry-run
          python scripts/cinema_batch2.py --mode test --format all --demo --dry-run
          python scripts/cinema_batch3.py --mode test --format all --demo --dry-run

      - name: Telegram admin and TMDB key diagnostic (read-only)
        if: always()
        env:
          CINEMA_TELEGRAM_BOT_TOKEN: ${{ secrets.CINEMA_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python scripts/cinema_healthcheck.py