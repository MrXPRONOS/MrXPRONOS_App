name: Mise à jour horaire (statuts et vérifications)

on:
  schedule:
    - cron: '0 * * * *'   # toutes les heures
  push:
    paths:
      - 'generate_data.py'
      - 'update_scores.py'
      - '*.py'
      - '.github/workflows/*.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-live:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Update scores (data.json)
        env:
          SPORTDATA_API_KEY_1: ${{ secrets.SPORTDATA_API_KEY_1 }}
          SPORTDATA_API_KEY_2: ${{ secrets.SPORTDATA_API_KEY_2 }}
          SPORTDATA_API_KEY_3: ${{ secrets.SPORTDATA_API_KEY_3 }}
          SPORTDATA_API_KEY_4: ${{ secrets.SPORTDATA_API_KEY_4 }}
          SPORTDATA_API_KEY_5: ${{ secrets.SPORTDATA_API_KEY_5 }}
        run: python update_scores.py

      - name: Update pronostics in Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python update_pronostics_supabase.py

      - name: Convert images to WebP
        run: python convert_images.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --staged --quiet; then
            echo "ℹ️ Aucun changement à commiter"
            exit 0
          fi
          git commit -m "Mise à jour horaire $(date +'%Y-%m-%d %H:%M') [skip ci]"
          git pull origin main --rebase -X theirs || git pull origin main --no-rebase || true
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}