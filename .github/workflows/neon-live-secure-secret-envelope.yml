name: Neon LIVE encrypted secret handoff
on:
  push:
    branches: [migration/supabase-to-free-stack-20261022]
    paths: ['.github/workflows/neon-live-secure-secret-envelope.yml']
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: mrx-live-secret-handoff, cancel-in-progress: false}
jobs:
  seal:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Encrypt existing Github secrets with Neon-only RSA public key
        env:
          BSD_API_TOKEN: ${{ secrets.BSD_API_TOKEN }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DEBUG_KEY: ${{ secrets.DEBUG_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_SECONDARY: ${{ secrets.TELEGRAM_CHAT_ID_SECONDARY }}
          MOVIODDS_API_KEY: ${{ secrets.MOVIODDS_API_KEY }}
          LIVE_PROP_ODDS_URL: ${{ secrets.LIVE_PROP_ODDS_URL }}
          LIVE_PROP_ODDS_TOKEN: ${{ secrets.LIVE_PROP_ODDS_TOKEN }}
          LIVE_ODDS_ENABLE_DIRECT: ${{ secrets.LIVE_ODDS_ENABLE_DIRECT }}
          LIVE_ODDS_PINNWIRE_KEY: ${{ secrets.LIVE_ODDS_PINNWIRE_KEY }}
          LIVE_ODDS_PINNWIRE_DIRECT_URL: ${{ secrets.LIVE_ODDS_PINNWIRE_DIRECT_URL }}
          LIVE_ODDS_MOVIODDS_URL: ${{ secrets.LIVE_ODDS_MOVIODDS_URL }}
          LIVE_ODDS_MOVIODDS_TOKEN: ${{ secrets.LIVE_ODDS_MOVIODDS_TOKEN }}
          LIVE_ODDS_PINNWIRE_URL: ${{ secrets.LIVE_ODDS_PINNWIRE_URL }}
          LIVE_ODDS_PINNWIRE_TOKEN: ${{ secrets.LIVE_ODDS_PINNWIRE_TOKEN }}
          LIVE_ODDS_ODDSLINK_URL: ${{ secrets.LIVE_ODDS_ODDSLINK_URL }}
          LIVE_ODDS_ODDSLINK_TOKEN: ${{ secrets.LIVE_ODDS_ODDSLINK_TOKEN }}
          LIVE_ODDS_GOALDIR_URL: ${{ secrets.LIVE_ODDS_GOALDIR_URL }}
          LIVE_ODDS_GOALDIR_TOKEN: ${{ secrets.LIVE_ODDS_GOALDIR_TOKEN }}
          LIVE_ODDS_ODDSHARVESTER_URL: ${{ secrets.LIVE_ODDS_ODDSHARVESTER_URL }}
          LIVE_ODDS_ODDSHARVESTER_TOKEN: ${{ secrets.LIVE_ODDS_ODDSHARVESTER_TOKEN }}
          LIVE_REQUIRE_BOOKMAKER_LINE: ${{ secrets.LIVE_REQUIRE_BOOKMAKER_LINE }}
          SITE_URL: ${{ secrets.SITE_URL }}
          MRX_NEON_PUBLIC_PEM_BASE64: 
        run: |
          node <<'NODE'
          const crypto=require("node:crypto"),fs=require("node:fs");
          const keys=["BSD_API_TOKEN","CRON_SECRET","DEBUG_KEY","TELEGRAM_BOT_TOKEN","TELEGRAM_CHAT_ID","TELEGRAM_CHAT_ID_SECONDARY","MOVIODDS_API_KEY","LIVE_PROP_ODDS_URL","LIVE_PROP_ODDS_TOKEN","LIVE_ODDS_ENABLE_DIRECT","LIVE_ODDS_PINNWIRE_KEY","LIVE_ODDS_PINNWIRE_DIRECT_URL","LIVE_ODDS_MOVIODDS_URL","LIVE_ODDS_MOVIODDS_TOKEN","LIVE_ODDS_PINNWIRE_URL","LIVE_ODDS_PINNWIRE_TOKEN","LIVE_ODDS_ODDSLINK_URL","LIVE_ODDS_ODDSLINK_TOKEN","LIVE_ODDS_GOALDIR_URL","LIVE_ODDS_GOALDIR_TOKEN","LIVE_ODDS_ODDSHARVESTER_URL","LIVE_ODDS_ODDSHARVESTER_TOKEN","LIVE_REQUIRE_BOOKMAKER_LINE","SITE_URL"];
          const values=Object.fromEntries(keys.filter(k=>process.env[k]).map(k=>[k,process.env[k]]));
          for(const k of ["BSD_API_TOKEN","CRON_SECRET","TELEGRAM_BOT_TOKEN","TELEGRAM_CHAT_ID"])if(!values[k])throw Error("REQUIRED_SECRET_MISSING: "+k);
          const symmetric=crypto.randomBytes(32),iv=crypto.randomBytes(12);
          const cipher=crypto.createCipheriv("aes-256-gcm",symmetric,iv);
          const ciphertext=Buffer.concat([cipher.update(JSON.stringify(values),"utf8"),cipher.final()]);
          const pub=Buffer.from(process.env.MRX_NEON_PUBLIC_PEM_BASE64,"base64").toString();
          const wrappedKey=crypto.publicEncrypt({key:pub,padding:crypto.constants.RSA_PKCS1_OAEP_PADDING,oaepHash:"sha256"},symmetric);
          const envelope={version:1,algorithm:"RSA-OAEP-SHA256+AES-256-GCM",wrappedKey:wrappedKey.toString("base64"),iv:iv.toString("base64"),tag:cipher.getAuthTag().toString("base64"),ciphertext:ciphertext.toString("base64")};
          fs.writeFileSync("migration/free-stack/live/legacy-runtime-envelope.json",JSON.stringify(envelope));
          console.log("SECRET_ENVELOPE_CREATED",Object.keys(values).length,"keys; no values or private key disclosed");
          NODE
      - name: Publish only encrypted envelope on migration branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add migration/free-stack/live/legacy-runtime-envelope.json
          git commit -m "security(live): encrypted Github secrets for Neon deployment"
          git pull --rebase origin migration/supabase-to-free-stack-20261022
          git push origin HEAD:refs/heads/migration/supabase-to-free-stack-20261022
