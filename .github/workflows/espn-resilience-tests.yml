name: Football provider resilience tests
on:
  pull_request:
    paths:
      - 'supabase/functions/_shared/espn.ts'
      - 'supabase/functions/_shared/free-football.ts'
      - 'supabase/functions/live/index.ts'
      - 'supabase/functions/live-scrape-test/index.ts'
      - 'supabase/tests/espn_test.ts'
      - 'supabase/tests/free_football_providers_test.ts'
      - '.github/workflows/espn-resilience-tests.yml'
  workflow_dispatch:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run provider tests
        run: deno test supabase/tests/espn_test.ts supabase/tests/free_football_providers_test.ts
      - name: Type check shared clients
        run: deno check supabase/functions/_shared/espn.ts supabase/functions/_shared/free-football.ts
