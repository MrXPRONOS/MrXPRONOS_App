name: ESPN resilience tests
on:
  pull_request:
    paths:
      - 'supabase/functions/_shared/espn.ts'
      - 'supabase/functions/live/index.ts'
      - 'supabase/functions/live-scrape-test/index.ts'
      - 'supabase/tests/espn_test.ts'
      - '.github/workflows/espn-resilience-tests.yml'
  workflow_dispatch:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run ESPN tests
        run: deno test --allow-none supabase/tests/espn_test.ts
      - name: Type check ESPN shared client
        run: deno check supabase/functions/_shared/espn.ts
