name: CineX - Rotation biquotidienne des 10 videos par canal

on:
  workflow_dispatch:
    inputs:
      repair:
        description: 'Réparer les anciennes archives privées/affiches (sans supprimer de vidéos)'
        required: false
        type: boolean
        default: false
      purge_unmatched:
        description: 'Supprimer les ANCIENNES vidéos non identifiables (sans sauvegarde ; action irréversible) ; manuel seulement'
        required: false
        type: boolean
        default: false
      purge_max:
        description: 'Maximum de suppressions par canal lors d une purge manuelle'
        required: false
        type: choice
        options: ['2', '5', '10']
        default: '2'
      apply:
        description: 'Retirer les anciennes vidéos après vérification (false = simulation)'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 0,12 * * *'

permissions:
  contents: read

concurrency:
  group: mrx-telegram-personal-account
  cancel-in-progress: false
  queue: max

jobs:
  archive:
    name: Conserver les dix dernières videos dans chaque canal
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CINEX_RESCUE_RUNTIME_FILE: /tmp/cinex-rescue-links-${{ github.run_id }}.json
      TG_API_ID: ${{ secrets.TG_API_ID }}
      TG_API_HASH: ${{ secrets.TG_API_HASH }}
      TG_STRING_SESSION: ${{ secrets.TG_SESSION_STRING || secrets.TG_STRING_SESSION || secrets.TG_STREAM_SESSION }}
      CINEX_BOT_TOKEN: ${{ secrets.FOOTBALL_NEWS_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
      TG_PRIVATE_CHANNEL: ${{ vars.TG_PRIVATE_CHANNEL }}
      TG_PUBLIC_CHANNEL: '@CineXFilms_vf'
      SERIES_PUBLIC_CHANNEL: ${{ vars.SERIES_PUBLIC_CHANNEL || '@seriesvf_cinex' }}
      SERIES_PRIVATE_CHANNEL: ${{ vars.SERIES_PRIVATE_CHANNEL }}
      DESIR_PUBLIC_CHANNEL: ${{ vars.DESIR_PUBLIC_CHANNEL || '@CineXDesirfr' }}
      DESIR_PRIVATE_CHANNEL: ${{ vars.DESIR_PRIVATE_CHANNEL }}
      COMEDIE_PUBLIC_CHANNEL: ${{ vars.COMEDIE_PUBLIC_CHANNEL }}
      COMEDIE_PRIVATE_CHANNEL: ${{ vars.COMEDIE_PRIVATE_CHANNEL }}
      ANIME_PUBLIC_CHANNEL: ${{ vars.ANIME_PUBLIC_CHANNEL || '@CineXAnimeFR' }}
      ANIME_PRIVATE_CHANNEL: ${{ vars.ANIME_PRIVATE_CHANNEL }}
      ACTION_PUBLIC_CHANNEL: ${{ vars.ACTION_PUBLIC_CHANNEL || '@filmsaction2026vf' }}
      ACTION_PRIVATE_CHANNEL: ${{ vars.ACTION_PRIVATE_CHANNEL }}
      CINEX_ARCHIVE_ENABLED: ${{ vars.CINEX_ARCHIVE_ENABLED }}
      CINEX_ARCHIVE_DELETE_APPROVED: ${{ vars.CINEX_ARCHIVE_DELETE_APPROVED }}
      CINEX_RIGHTS_VERIFIED: ${{ vars.CINEX_RIGHTS_VERIFIED }}
      CINEX_FILM_FOLDER_URL: ${{ vars.CINEX_FILM_FOLDER_URL || 'https://t.me/addlist/ZmW4vfwcrMAwNzJk' }}
      TG_RIGHTS_ATTESTED: ${{ vars.CINEX_RIGHTS_VERIFIED || 'false' }}
      PYTHONPATH: .
    defaults:
      run:
        working-directory: telegram-film-relay
    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4
      - name: Respecter le delai FloodWait du compte Telegram personnel
        env:
          TG_PERSONAL_COOLDOWN_UNTIL_UTC: ${{ vars.TG_PERSONAL_COOLDOWN_UNTIL_UTC }}
        run: python3 "$GITHUB_WORKSPACE/telegram-film-relay/scripts/check_personal_cooldown.py"
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: telegram-film-relay/requirements.txt
      - name: Installer les dependances
        run: python -m pip install -r requirements.txt
      - name: Tester la rotation hors ligne
        run: python -m unittest discover -s tests -p 'test_ten_video_rotation.py' -v
      - name: Verifier les identifiants
        shell: bash
        run: |
          set -eu
          [[ -n "$TG_API_ID" && -n "$TG_API_HASH" && -n "$TG_STRING_SESSION" ]] || {
            echo "::error::Secrets de la session Telegram indisponibles"; exit 1;
          }
          [[ "$TG_PRIVATE_CHANNEL" =~ ^-100[0-9]+$ ]] || {
            echo "::error::TG_PRIVATE_CHANNEL doit etre l'ID -100 de Cine X Videotheque"; exit 1;
          }
      - name: Retrouver les invitations Secours sans les journaliser
        id: rescue_links
        continue-on-error: true
        run: python -m film_relay.rescue_links_runtime --output "$CINEX_RESCUE_RUNTIME_FILE"
      - name: Rattraper les archives anciennes (aucune suppression)
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.repair == true) || (github.event_name == 'schedule' && vars.CINEX_LEGACY_REPAIR_ENABLED == 'true') }}
        env:
          RUN_REPAIR_APPLY: ${{ vars.CINEX_ARCHIVE_ENABLED == 'true' && vars.CINEX_ARCHIVE_DELETE_APPROVED == 'true' && vars.CINEX_RIGHTS_VERIFIED == 'true' }}
        shell: bash
        run: |
          if [[ "$RUN_REPAIR_APPLY" != "true" ]]; then
            echo "::error::Réparation réelle refusée : vérifier les trois autorisations CinéX."
            exit 1
          fi
          python -m film_relay.legacy_archive_repair --apply --max-repaired 2
      - name: Analyser puis archiver
        env:
          CINEX_MANUAL_PURGE_REQUEST: ${{ github.event_name == 'workflow_dispatch' && inputs.apply == true && inputs.purge_unmatched == true }}
          RUN_APPLY: ${{ vars.CINEX_ARCHIVE_ENABLED == 'true' && vars.CINEX_ARCHIVE_DELETE_APPROVED == 'true' && vars.CINEX_RIGHTS_VERIFIED == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' && inputs.apply) }}
        shell: bash
        run: |
          if [[ "$RUN_APPLY" == "true" ]]; then
            if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
              if [[ "${{ inputs.purge_unmatched }}" == "true" ]]; then
                python -m film_relay.ten_video_rotation --apply --purge-unmatched --max-deleted "${{ inputs.purge_max }}"
              else
                python -m film_relay.ten_video_rotation --apply --max-deleted 10
              fi
            else
              python -m film_relay.ten_video_rotation --apply --max-deleted 10
            fi
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.apply }}" == "true" ]]; then
            echo "::error::Suppression refusée : activer explicitement CINEX_ARCHIVE_ENABLED, CINEX_ARCHIVE_DELETE_APPROVED et CINEX_RIGHTS_VERIFIED."
            exit 1
          else
            echo "Simulation : archivage destructif non autorisé par les trois contrôles indépendants."
            if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.purge_unmatched }}" == "true" ]]; then
              python -m film_relay.ten_video_rotation --purge-unmatched
            else
              python -m film_relay.ten_video_rotation
            fi
          fi
      - name: Vérifier le chargement des invitations
        if: ${{ always() && steps.rescue_links.outcome == 'failure' }}
        run: |
          echo "::error::Échec de récupération des liens Secours. Voir l'étape de lecture sécurisée."
          exit 1
