name: CineX - Lancer un rattrapage legacy prudent

on:
  push:
    branches: [main]
    paths:
      - 'telegram-film-relay/.cinex-legacy-repair-activate-once'

permissions:
  contents: read
  actions: write

concurrency:
  group: cinex-legacy-repair-activation
  cancel-in-progress: false

jobs:
  activate:
    if: ${{ github.repository == 'MrXPRONOS/MrXPRONOS_App' && github.actor == 'MrXPRONOS' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verifier les trois autorisations et demander un rattrapage SANS suppression
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CINEX_RIGHTS_VERIFIED: ${{ vars.CINEX_RIGHTS_VERIFIED }}
          CINEX_ARCHIVE_ENABLED: ${{ vars.CINEX_ARCHIVE_ENABLED }}
          CINEX_ARCHIVE_DELETE_APPROVED: ${{ vars.CINEX_ARCHIVE_DELETE_APPROVED }}
        run: |
          set -euo pipefail
          for name in CINEX_RIGHTS_VERIFIED CINEX_ARCHIVE_ENABLED CINEX_ARCHIVE_DELETE_APPROVED; do
            if [[ "${!name:-}" != "true" ]]; then
              echo "::error::$name doit etre defini a true ; aucune mutation Telegram."
              exit 1
            fi
          done
          gh workflow run cinex-public-video-rotation.yml \
            --repo "$GITHUB_REPOSITORY" --ref main -f repair=true -f apply=false
          echo "Rattrapage prudent demande (2 par canal, aucune suppression publique)."
