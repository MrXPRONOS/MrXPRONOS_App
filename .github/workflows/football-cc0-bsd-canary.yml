name: BSD/CC0 event identity production canary (read only)

on:
  workflow_dispatch:
  schedule:
    - cron: '37 5 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/football-cc0-bsd-canary.yml'
      - 'scripts/football_cc0_bsd_canary.py'
      - 'tests/test_football_cc0_bsd_canary.py'
  pull_request:
    paths:
      - '.github/workflows/football-cc0-bsd-canary.yml'
      - 'scripts/football_cc0_bsd_canary.py'
      - 'tests/test_football_cc0_bsd_canary.py'

permissions:
  contents: read

concurrency:
  group: bsd-cc0-readonly-canary
  cancel-in-progress: false

jobs:
  offline_qa:
    name: Offline native event identity and dedup QA
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and run fail-closed offline tests
        run: |
          set -euo pipefail
          python -m py_compile scripts/football_cc0_bsd_canary.py tests/test_football_cc0_bsd_canary.py
          python -m unittest discover -s tests -p 'test_football_cc0_bsd_canary.py' -v

  native_readonly_canary:
    name: Official native BSD + CC0 calendars (aggregate only)
    if: github.event_name != 'pull_request'
    needs: offline_qa
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only the BSD client dependency
        run: python -m pip install requests
      - name: Reconcile native BSD fixtures and CC0 calendar identities, no odds or publication
        env:
          BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
          FOOTBALL_MULTI_SOURCE: '0'
        run: |
          set -euo pipefail
          before="$(sha256sum data.json | cut -d' ' -f1)"
          python scripts/football_cc0_bsd_canary.py
          after="$(sha256sum data.json | cut -d' ' -f1)"
          test "$before" = "$after"
          test -z "$(git status --porcelain -- data.json bsd/publication_ledger.json bsd/quality_report.json)"
          echo "BSD_CC0_CANARY_PRODUCTION_FEEDS_UNCHANGED"
