name: Actu Foot V1.3 - supervision et alertes par canal

run-name: ${{ inputs.external_schedule && 'V1.3 external schedule' || github.event_name == 'schedule' && 'V1.3 native fallback' || 'V1.3 validation' }}

on:
  schedule:
    - cron: '22,52 * * * *' # fallback after the external H:07/H:37 schedule
  workflow_dispatch:
    inputs:
      external_schedule:
        description: "Déclenchement automatique cron-job.org (ne pas cocher pour un test manuel)"
        type: boolean
        default: false
        required: true
      dry_run:
        description: "Lecture seule ; aucune alerte Telegram privée"
        type: boolean
        default: true
        required: true
      send_alerts:
        description: "Autoriser uniquement les alertes vers le chat privé configuré"
        type: boolean
        default: false
        required: true
      test_private_alert:
        description: "Test privé explicite (une fois par jour ; requiert send_alerts et dry_run désactivé)"
        type: boolean
        default: false
        required: true
  pull_request:
    branches: [main]
    paths:
      - 'scripts/actufoot_v13_supervision.py'
      - 'tests_football_channel/test_actufoot_v13_supervision.py'
      - '.github/workflows/actufoot-v13-supervision.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/actufoot_v13_supervision.py'
      - 'tests_football_channel/test_actufoot_v13_supervision.py'
      - '.github/workflows/actufoot-v13-supervision.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: actufoot-v13-supervision
  cancel-in-progress: false

jobs:
  schedule-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      audit: ${{ steps.gate.outputs.audit }}
    steps:
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT" != schedule ]; then
            echo "audit=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Backup is read-only until it establishes whether a recent successful
          # external audit exists. API errors must never suppress monitoring.
          if gh api "repos/$REPO/actions/workflows/actufoot-v13-supervision.yml/runs?event=workflow_dispatch&per_page=20" > /tmp/v13-runs.json; then
            python - <<'PY'
          import json, os
          from datetime import datetime, timezone, timedelta
          now = datetime.now(timezone.utc)
          try:
              runs = json.load(open("/tmp/v13-runs.json"))["workflow_runs"]
              healthy = any(
                  r.get("display_title") == "V1.3 external schedule"
                  and r.get("conclusion") == "success"
                  and now - timedelta(minutes=27) <= datetime.fromisoformat(r["created_at"].replace("Z", "+00:00")) <= now
                  for r in runs)
          except (ValueError, TypeError, KeyError):
              healthy = False
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("audit=" + ("false" if healthy else "true") + "\n")
          print("V13_FALLBACK", "recent_external_success" if healthy else "audit_required")
          PY
          else
            echo "audit=true" >> "$GITHUB_OUTPUT"
          fi

  offline-tests:
    name: V1.3 - tests hors ligne
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer les dépendances minimales
        run: python -m pip install --disable-pip-version-check requests Pillow 'cryptography>=43,<47' 'langdetect>=1.0.9,<2'
      - name: Valider le code et les tests V1.3
        run: |
          python -m py_compile scripts/actufoot_v13_supervision.py tests_football_channel/test_actufoot_v13_supervision.py
          python -m unittest tests_football_channel.test_actufoot_v13_supervision -v

  production-health:
    name: V1.3 - surveillance réelle D1 / Telegram
    needs: [offline-tests, schedule-gate]
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && needs.schedule-gate.outputs.audit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FOOTBALL_NEWS_BOT_TOKEN: ${{ secrets.FOOTBALL_NEWS_BOT_TOKEN }}
      FOOTBALL_NEWS_CHAT_ID: ${{ secrets.FOOTBALL_NEWS_CHAT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ACTUFOOT_V13_ALERT_CHAT_ID: ${{ secrets.ACTUFOOT_V13_ALERT_CHAT_ID }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer les dépendances
        run: python -m pip install --disable-pip-version-check requests Pillow 'cryptography>=43,<47' 'langdetect>=1.0.9,<2'
      - name: Audit réel des onze destinations, volumes et incidents
        id: audit
        continue-on-error: true
        env:
          EVENT: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run || false }}
          SEND_ALERTS: ${{ inputs.send_alerts || false }}
          TEST_PRIVATE_ALERT: ${{ inputs.test_private_alert || false }}
          EXTERNAL_SCHEDULE: ${{ inputs.external_schedule || false }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--output actufoot-v13-report.json)
          if [ "$EVENT" != "schedule" ] && [ "$DRY_RUN" != "false" ]; then
            args+=(--dry-run)
          fi
          # A scheduled job sends a private alert only when the independent
          # private destination secret is explicitly present.
          if { { [ "$EVENT" = "schedule" ] || [ "$EXTERNAL_SCHEDULE" = "true" ]; } && [ -n "${ACTUFOOT_V13_ALERT_CHAT_ID:-}" ]; } || [ "$SEND_ALERTS" = "true" ]; then
            args+=(--send-alerts)
          fi
          if [ "$TEST_PRIVATE_ALERT" = "true" ]; then
            args+=(--test-private-alert)
          fi
          python scripts/actufoot_v13_supervision.py "${args[@]}"
      - name: Conserver le rapport même en cas de panne
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actufoot-v13-health-${{ github.run_id }}
          path: actufoot-v13-report.json
          if-no-files-found: warn
          retention-days: 14
      - name: Rendre la santé visible dans GitHub Actions
        if: steps.audit.outcome == 'failure'
        run: |
          echo '::error title=Actu Foot V1.3::Audit incomplet, alerte critique ou échec de notification privée. Voir le résumé et le rapport V1.3.'
          exit 1
