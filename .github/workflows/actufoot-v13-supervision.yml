name: Actu Foot V1.3 - supervision et alertes par canal

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Lecture seule ; aucune alerte Telegram privée"
        type: boolean
        default: true
        required: true
      send_alerts:
        description: "Autoriser uniquement les alertes vers le chat privé configuré"
        type: boolean
        default: false
        required: true
  pull_request:
    branches: [main]
    paths:
      - 'scripts/actufoot_v13_supervision.py'
      - 'tests_football_channel/test_actufoot_v13_supervision.py'
      - '.github/workflows/actufoot-v13-supervision.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/actufoot_v13_supervision.py'
      - 'tests_football_channel/test_actufoot_v13_supervision.py'
      - '.github/workflows/actufoot-v13-supervision.yml'

permissions:
  contents: read

concurrency:
  group: actufoot-v13-supervision
  cancel-in-progress: false

jobs:
  offline-tests:
    name: V1.3 - tests hors ligne
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer les dépendances minimales
        run: python -m pip install --disable-pip-version-check requests Pillow 'cryptography>=43,<47' 'langdetect>=1.0.9,<2'
      - name: Valider le code et les tests V1.3
        run: |
          python -m py_compile scripts/actufoot_v13_supervision.py tests_football_channel/test_actufoot_v13_supervision.py
          python -m unittest tests_football_channel.test_actufoot_v13_supervision -v

  production-health:
    name: V1.3 - surveillance réelle D1 / Telegram
    needs: offline-tests
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FOOTBALL_NEWS_BOT_TOKEN: ${{ secrets.FOOTBALL_NEWS_BOT_TOKEN }}
      FOOTBALL_NEWS_CHAT_ID: ${{ secrets.FOOTBALL_NEWS_CHAT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ACTUFOOT_V13_ALERT_CHAT_ID: ${{ secrets.ACTUFOOT_V13_ALERT_CHAT_ID }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer les dépendances
        run: python -m pip install --disable-pip-version-check requests Pillow 'cryptography>=43,<47' 'langdetect>=1.0.9,<2'
      - name: Audit réel des onze destinations, volumes et incidents
        id: audit
        continue-on-error: true
        env:
          EVENT: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run || false }}
          SEND_ALERTS: ${{ inputs.send_alerts || false }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--output actufoot-v13-report.json)
          if [ "$EVENT" != "schedule" ] && [ "$DRY_RUN" != "false" ]; then
            args+=(--dry-run)
          fi
          # A scheduled job sends a private alert only when the independent
          # private destination secret is explicitly present.
          if [ -n "${ACTUFOOT_V13_ALERT_CHAT_ID:-}" ] && {
            [ "$EVENT" = "schedule" ] || [ "$SEND_ALERTS" = "true" ];
          }; then
            args+=(--send-alerts)
          fi
          python scripts/actufoot_v13_supervision.py "${args[@]}"
      - name: Conserver le rapport même en cas de panne
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actufoot-v13-health-${{ github.run_id }}
          path: actufoot-v13-report.json
          if-no-files-found: warn
          retention-days: 14
      - name: Rendre la santé visible dans GitHub Actions
        if: steps.audit.outcome == 'failure'
        run: |
          echo '::error title=Actu Foot V1.3::Audit incomplet ou alerte critique. Voir le résumé et le rapport V1.3.'
          exit 1
