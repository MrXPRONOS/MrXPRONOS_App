name: Publish daily Hybrid V3 Top5
on:
  schedule:
    - cron: '17 5,12 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mrx-v3-daily-prospective-publication
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      PYTHONPATH: site
      ML_V2_HISTORY_KEY_B64: ${{ secrets.ML_V2_HISTORY_KEY_B64 }}
      SPORTDATA_API_KEY_1: ${{ secrets.SPORTDATA_API_KEY_1 }}
      SPORTDATA_API_KEY_2: ${{ secrets.SPORTDATA_API_KEY_2 }}
      SPORTDATA_API_KEY_3: ${{ secrets.SPORTDATA_API_KEY_3 }}
      SPORTDATA_API_KEY_4: ${{ secrets.SPORTDATA_API_KEY_4 }}
      SPORTDATA_API_KEY_5: ${{ secrets.SPORTDATA_API_KEY_5 }}
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          path: site
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: research/single-ml-v2-20261024
          path: model
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy scipy scikit-learn requests cryptography lightgbm==4.6.0 catboost==1.2.8
      - name: Validate prediction feed and historical provenance
        run: |
          python -m unittest discover -s site/tests -p 'test_exact_scores_tab.py' -q
          python -m unittest discover -s site/tests -p 'test_exact_scores_daily_v3.py' -q
      - name: Calculate real pre-match V3 Top5 selections
        run: |
          python site/scripts/run_exact_scores_v3_daily.py --site-root site --model-root model --out site/scores-exacts.json
      - name: Publish valid score feed and encrypted daily archive
        if: github.ref == 'refs/heads/main'
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scores-exacts.json
          if test -d research/score_v3_encrypted_daily; then
            git add research/score_v3_encrypted_daily/*.enc
          fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: validated Hybrid V3 pre-match Top5 [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
