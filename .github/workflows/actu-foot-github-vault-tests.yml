name: Actu Foot - GitHub encrypted vault tests
on:
  push:
    paths:
      - 'scripts/actu_foot_github_vault.py'
      - 'tests_football_channel/test_github_vault.py'
      - '.github/workflows/actu-foot-github-vault-tests.yml'
  pull_request:
    paths:
      - 'scripts/actu_foot_github_vault.py'
      - 'tests_football_channel/test_github_vault.py'
      - '.github/workflows/actu-foot-github-vault-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-vault:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'cryptography>=43,<47' requests
      - run: python -m unittest tests_football_channel.test_github_vault -v
