name: Formation - Premier essai autorisé sur Telegram (une seule formation)
on:
  pull_request:
    paths:
      - 'cinecanaux/formation-production-pilot.mjs'
      - 'cinecanaux/tests/formation-production-pilot.test.mjs'
      - '.github/workflows/formation-production-pilot-once.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/formation-production-pilot-once.yml'
permissions:
  contents: read
concurrency:
  group: mrx-telegram-personal-account
  cancel-in-progress: false
  queue: max
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test strict selection and unchanged rights gates
        run: |
          node --check cinecanaux/formation-production-pilot.mjs
          node --test cinecanaux/tests/formation-production-pilot.test.mjs
          node --test cinecanaux/tests/formation-content-flow.test.mjs cinecanaux/tests/manual-fallback-live.test.mjs
  publish-one:
    needs: [validate]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor == 'MrXPRONOS' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      FORMATION_PILOT_EXPLICIT: 'true'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: '9c86118191b804d91b5f5b2c89114999'
      CINERADAR_D1_DATABASE_ID: 'fa8b5009-bc1a-4a6e-b143-7a487c7297a5'
      FORMATION_STAGE_CHAT: ${{ secrets.FORMATION_STAGE_CHAT }}
      FORMATION_BOT_TOKEN: ${{ secrets.FORMATION_BOT_TOKEN || secrets.FOOTBALL_NEWS_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
      CINE_RADAR_BOT_TOKEN: ${{ secrets.CINE_RADAR_BOT_TOKEN || secrets.CINEX_RADAR_BOT_TOKEN }}
      FORMATION_DESTINATIONS_JSON: ${{ secrets.FORMATION_DESTINATIONS_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Copy only one verified licensed course with journaled Telegram receipts
        run: node cinecanaux/formation-production-pilot.mjs
