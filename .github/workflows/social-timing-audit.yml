name: Social Timing Audit - Read Only
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/social_timing_audit.py'
      - '.github/workflows/social-timing-audit.yml'

permissions:
  contents: read

concurrency:
  group: social-timing-audit-readonly
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      AUDIT_WINDOW_DAYS: '180'
      META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
      META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
      TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
    steps:
      - name: Checkout (read only)
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HTTP client
        run: python -m pip install 'requests>=2.32,<3'
      - name: Validate audit script syntax
        run: python -m py_compile scripts/social_timing_audit.py
      - name: Fetch metrics (NO publishing)
        run: python scripts/social_timing_audit.py
      - name: Upload aggregated statistics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: social-timing-audit-readonly
          path: social_timing_audit.json
          if-no-files-found: warn
          retention-days: 14
