name: Research ML V2 - Top5 Top10 Top20 per UTC day, 4 full months
on:
  push:
    branches: [research/single-ml-v2-20261024]
    paths: ['.github/workflows/research-ml-v2-topk-months.yml']
permissions:
  contents: read
concurrency:
  group: research-ml-v2-topk-frozen-months
  cancel-in-progress: false
jobs:
  one-month:
    name: Pre-registered daily topK ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {label: oct2025, start: '2025-10-01', end: '2025-10-31'}
          - {label: jan2026, start: '2026-01-01', end: '2026-01-31'}
          - {label: apr2026, start: '2026-04-01', end: '2026-04-30'}
          - {label: sep2026, start: '2026-09-01', end: '2026-09-30'}
    env:
      ML_V2_HISTORY_KEY_B64: ${{ secrets.ML_V2_HISTORY_KEY_B64 }}
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONWARNINGS: ignore
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fixed model and archive dependencies
        run: python -m pip install numpy scipy scikit-learn requests cryptography lightgbm==4.6.0 catboost==1.2.8
      - name: Confirm frozen selection policy and synthetic regression tests
        run: |
          set -euo pipefail
          python -m py_compile research/ml_v2_topk.py research/single_ml_v2_multisource.py
          PYTHONPATH=.:research python -m unittest research.test_ml_v2_topk research.test_single_ml_v2_multisource_identities research.test_single_ml_v2_subset_summary -v
      - name: Actual chronological retrospective replay of ALL football matches that month
        run: |
          set -euo pipefail
          PYTHONPATH=.:research python research/single_ml_v2_multisource.py \
            --start "${{ matrix.start }}" --end "${{ matrix.end }}" \
            --max-eval 0 --out "/tmp/mrx-topk-${{ matrix.label }}" \
            > "/tmp/mrx-topk-${{ matrix.label }}-model.log" 2>&1 || {
              tail -90 "/tmp/mrx-topk-${{ matrix.label }}-model.log"
              exit 1
            }
          grep 'SOURCE_AUDIT\|MULTISOURCE_ML_V2_COMPATIBILITY\|RETRAIN\|PROGRESS' "/tmp/mrx-topk-${{ matrix.label }}-model.log" | tail -15
      - name: For each model independently select top 5/10/20 EVERY day
        run: |
          set -euo pipefail
          PYTHONPATH=.:research python research/ml_v2_topk.py month \
            --predictions "/tmp/mrx-topk-${{ matrix.label }}/all_predictions.csv" \
            --start "${{ matrix.start }}" --end "${{ matrix.end }}" \
            --out "/tmp/mrx-topk-${{ matrix.label }}/selected_daily_aggregate.json"
      - name: Archive ONLY daily aggregates (no plaintext match IDs, teams, individual predictions)
        uses: actions/upload-artifact@v4
        with:
          name: ml-v2-topk-${{ matrix.label }}
          path: /tmp/mrx-topk-${{ matrix.label }}/selected_daily_aggregate.json
          if-no-files-found: error
          retention-days: 30

  four-month-comparison:
    needs: [one-month]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only the scientific comparison library
        run: python -m pip install numpy scipy scikit-learn
      - name: Unit tests including paired 4-month pooling
        run: PYTHONPATH=.:research python -m unittest research.test_ml_v2_topk -v
      - uses: actions/download-artifact@v4
        with:
          pattern: ml-v2-topk-*
          path: /tmp/mrx-topk-incoming
          merge-multiple: false
      - name: Audit all four full months and bootstrap 4,000 paired UTC days
        run: |
          set -euo pipefail
          PYTHONPATH=.:research python research/ml_v2_topk.py pool \
            --inputs /tmp/mrx-topk-incoming/ml-v2-topk-*/selected_daily_aggregate.json \
            --out /tmp/ml-v2-top5-top10-top20-pool.json --resamples 4000
      - name: Publish anonymized final Top5 / Top10 / Top20 report
        uses: actions/upload-artifact@v4
        with:
          name: ml-v2-top5-top10-top20-four-month-comparison
          path: /tmp/ml-v2-top5-top10-top20-pool.json
          if-no-files-found: error
          retention-days: 30
