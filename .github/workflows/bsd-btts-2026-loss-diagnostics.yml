name: BSD V2 BTTS 2026 error diagnosis
on:
  push:
    branches:
      - audit/btts-oct-2026
    paths:
      - .github/workflows/bsd-btts-2026-loss-diagnostics.yml
permissions:
  contents: read
concurrency:
  group: bsd-btts-2026-loss-diagnostics
  cancel-in-progress: false
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: bsd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install model dependencies
        run: python -m pip install requests cryptography pillow
      - name: Restore private BSD archive only in ephemeral runner
        env:
          BSD_HISTORY_KEY: ${{ secrets.BSD_HISTORY_KEY }}
        run: python bsd/bsd_archive.py restore
      - name: Diagnose high-confidence BTTS losses read-only
        run: python bsd/btts_2026_loss_diagnostics.py
      - name: Upload aggregated statistics only
        uses: actions/upload-artifact@v4
        with:
          name: bsd-btts-2026-loss-diagnostics
          path: bsd/btts_2026_loss_diagnostics.json
          retention-days: 14
          if-no-files-found: error
