name: CineX - Tests videos 24h et boutons (hors ligne)

on:
  push:
    branches: [main, 'feat/cinex-v4-lot3-season-batches-20261123']
    paths:
      - 'telegram-film-relay/film_relay/public_video_retention.py'
      - 'telegram-film-relay/film_relay/cinex_v4_policy.py'
      - 'telegram-film-relay/film_relay/ten_video_rotation.py'
      - 'telegram-film-relay/film_relay/anime_bot_publisher.py'
      - 'telegram-film-relay/film_relay/season_batches_v4.py'
      - 'telegram-film-relay/film_relay/anime_bot_matching.py'
      - 'telegram-film-relay/tests/test_season_batches_v4.py'
      - 'telegram-film-relay/tests/test_series_catalog.py'
      - 'telegram-film-relay/scripts/anime_bot_v2.py'
      - 'telegram-film-relay/tests/test_anime_bot_pipeline.py'
      - 'telegram-film-relay/tests/test_anime_bot_transport.py'
      - 'telegram-film-relay/film_relay/bot_http.py'
      - 'telegram-film-relay/film_relay/publication.py'
      - 'telegram-film-relay/film_relay/runner.py'
      - 'telegram-film-relay/film_relay/category_runner.py'
      - 'telegram-film-relay/film_relay/desir_runner.py'
      - 'telegram-film-relay/film_relay/series_catalog.py'
      - 'telegram-film-relay/film_relay/anime_catalog.py'
      - 'telegram-film-relay/film_relay/anime_bot_publisher.py'
      - 'telegram-film-relay/film_relay/unified_download.py'
      - 'telegram-film-relay/film_relay/rescue_channels.py'
      - 'telegram-film-relay/tests/test_public_video_retention.py'
      - 'telegram-film-relay/tests/test_cinex_v4_policy.py'
      - 'telegram-film-relay/tests/test_ten_video_rotation.py'
      - 'telegram-film-relay/tests/test_anime_bot_pipeline.py'
      - 'telegram-film-relay/tests/test_bot_http.py'
      - 'telegram-film-relay/tests/test_publication.py'
      - 'telegram-film-relay/tests/test_rescue_channels.py'
      - '.github/workflows/cinex-video-retention-offline-ci.yml'
  pull_request:
    paths:
      - 'telegram-film-relay/film_relay/**'
      - 'telegram-film-relay/tests/test_public_video_retention.py'
      - 'telegram-film-relay/tests/test_bot_http.py'
      - 'telegram-film-relay/tests/test_publication.py'
      - 'telegram-film-relay/tests/test_rescue_channels.py'
      - '.github/workflows/cinex-video-retention-offline-ci.yml'

permissions:
  contents: read

concurrency:
  group: cinex-video-retention-offline-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    defaults:
      run:
        working-directory: telegram-film-relay
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            telegram-film-relay/
            .github/workflows/
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Tests complets de rétention et publications, zéro accès Telegram
        run: |
          python -m compileall -q film_relay scripts
          python -m unittest discover -s tests -p 'test_cinex_v4_policy.py' -v
          python -m unittest discover -s tests -p 'test_season_batches_v4.py' -v
          python -m unittest discover -s tests -p 'test_public_video_retention.py' -v
          python -m unittest discover -s tests -p 'test_ten_video_rotation.py' -v
          python -m unittest discover -s tests -p 'test_anime_bot_pipeline.py' -v
          python -m unittest discover -s tests -p 'test_anime_bot_transport.py' -v
          python -m unittest discover -s tests -p 'test_anime_bot_readiness.py' -v
          python -m unittest discover -s tests -p 'test_publication.py' -v
          python -m unittest discover -s tests -p 'test_bot_http.py' -v
          python -m unittest discover -s tests -p 'test_rescue_channels.py' -v
          python -m unittest discover -s tests -p 'test_category_relays.py' -v
          python -m unittest discover -s tests -p 'test_desir.py' -v
          python -m unittest discover -s tests -p 'test_series_catalog.py' -v
          python -m unittest discover -s tests -p 'test_anime_catalog.py' -v
          python -m unittest discover -s tests -p 'test_unified_download.py' -v
