name: Liga 25 matches - diagnose and validate goal calibration (no publishing)

on:
  pull_request:
    paths:
      - '.github/workflows/laliga-goals-calibration-audit.yml'
      - 'dixon-coles/dcscore/goal_calibration.py'
      - 'dixon-coles/dcscore/diagnose_laliga_oct2026.py'
      - 'dixon-coles/dcscore/model.py'
      - 'dixon-coles/tests/test_goal_calibration.py'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Dixon-Coles and pytest
        run: python -m pip install -e 'dixon-coles[test]'
      - name: Test no-leakage, calibration validation, and unchanged default score
        run: python -m pytest -q dixon-coles/tests/test_goal_calibration.py
      - name: Reproduce all 25 Liga exact-score predictions with fair Oct holdout
        working-directory: dixon-coles
        run: python -m dcscore.diagnose_laliga_oct2026 --out results/diagnostics/laliga_oct2026
      - name: Test additional previously-uninspected November 2026 fixtures
        working-directory: dixon-coles
        run: python -m dcscore.diagnose_laliga_nov2026
      - name: Archive goal-intensity and probability diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MRXPRONOS-Liga-Oct-25-goal-calibration
          path: dixon-coles/results/diagnostics/**/*
          if-no-files-found: warn
          retention-days: 90
