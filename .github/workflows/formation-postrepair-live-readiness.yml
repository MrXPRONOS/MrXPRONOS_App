name: Formation - Revérification après réparation du bot (lecture seule)
on:
  workflow_run:
    workflows:
      - 'Formation - Réparer l'accès du bot au canal privé unique'
    types: [completed]
permissions:
  contents: read
jobs:
  verify:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == 'MrXPRONOS/MrXPRONOS_App' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: '9c86118191b804d91b5f5b2c89114999'
      CINERADAR_D1_DATABASE_ID: 'fa8b5009-bc1a-4a6e-b143-7a487c7297a5'
      CINE_RADAR_BOT_TOKEN: ${{ secrets.CINE_RADAR_BOT_TOKEN || secrets.CINEX_RADAR_BOT_TOKEN }}
      FORMATION_BOT_TOKEN: ${{ secrets.FORMATION_BOT_TOKEN || secrets.FOOTBALL_NEWS_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
      FORMATION_STAGE_CHAT: ${{ secrets.FORMATION_STAGE_CHAT }}
      FORMATION_DESTINATIONS_JSON: ${{ secrets.FORMATION_DESTINATIONS_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pré-vol hors publication
        run: |
          node --check cinecanaux/formation-shared-readiness.mjs
          node --test cinecanaux/tests/formation-shared-readiness.test.mjs cinecanaux/tests/formation-shared-inbox.test.mjs
      - name: Contrôler tous les vrais accès Telegram après réparation
        run: node cinecanaux/formation-shared-readiness.mjs
