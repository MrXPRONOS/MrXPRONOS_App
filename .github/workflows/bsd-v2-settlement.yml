name: BSD V2 - Settle shadow predictions
run-name: "BSD V2 - Settle shadow predictions (${{ inputs.trigger_source || github.event_name }})"

on:
  # Planification GitHub provisoire jusqu'à validation des tâches cron-job.org.
  schedule:
    - cron: '50 7 * * *'
  workflow_dispatch:
    inputs:
      trigger_source:
        description: "Origine cron-job.org ou manuel"
        required: false
        default: "manual"
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: bsd-v2-shadow-settlement
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Journaliser la source
        env:
          TRIGGER_SOURCE: ${{ inputs.trigger_source || github.event_name }}
        run: |
          echo "Déclenchement : ${TRIGGER_SOURCE}"
          echo "Début UTC : $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: python -m pip install requests cryptography pillow
      - name: Regression tests
        run: python -m unittest discover -s bsd -p 'test_*.py' -v
      - name: Settle older immutable shadow snapshots against BSD scores
        env:
          BSD_API_KEY: '${{ secrets.BSD_API_KEY }}'
          GH_TOKEN: '${{ github.token }}'
        run: python bsd/bsd_v2_settle.py --repo "${{ github.repository }}"
      - name: Upload prospective settlement report
        uses: actions/upload-artifact@v4
        with:
          name: bsd-v2-prospective-settlement-${{ github.run_id }}
          path: bsd/v2_prospective_settlement.json
          retention-days: 90
          if-no-files-found: ignore
