name: Refresh bonus banners

on:
  push:
    branches: [ main ]
    paths:
      - "scripts/fetch_bonus_banners.py"
      - ".github/workflows/refresh-bonus-banners.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install banner tools
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pillow playwright
          python -m playwright install --with-deps chromium

      - name: Fetch official promotion visuals
        run: python scripts/fetch_bonus_banners.py

      - name: Commit refreshed banners
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prono-live/assets/bonus-banners
          if git diff --cached --quiet; then
            echo "No banner changes."
          else
            git commit -m "chore(prono-live): refresh official bonus banners"
            git push
          fi
