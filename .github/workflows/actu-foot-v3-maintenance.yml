name: Actu Foot V3 - Safe archive maintenance
on:
  workflow_dispatch:
    inputs:
      collection:
        type: choice
        options: [all, matches, live_events, news, statistics]
        default: all
      execute:
        type: boolean
        default: false
      confirmation:
        type: string
        default: ''
      recover_archives:
        type: boolean
        default: false
      recovery_after:
        type: string
        default: ''
  push:
    branches: [main]
    paths:
      - '.github/workflows/actu-foot-v3-maintenance.yml'
  schedule:
    - cron: '21 2 * * 1'
permissions:
  contents: read
concurrency:
  group: actufoot-v3-atomic-maintenance
  cancel-in-progress: false
env:
  GITHUB_TOKEN: ${{ github.token }}
  ACTU_FOOT_V2_KEY_B64_V1: ${{ secrets.ACTU_FOOT_V2_KEY_B64_V1 }}
  ACTU_FOOT_V2_KEY_B64_V2: ${{ secrets.ACTU_FOOT_V2_KEY_B64_V2 }}
  ML_V2_HISTORY_KEY_B64: ${{ secrets.ML_V2_HISTORY_KEY_B64 }}
  ACTU_FOOT_V2_ALLOW_LEGACY_KEY: '1'
jobs:
  preview:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    outputs:
      eligible: ${{ steps.plan.outputs.eligible }}
      active: ${{ steps.plan.outputs.active }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'cryptography>=43,<47' 'requests>=2.31,<3'
      - name: Preview every allowed collection and validate integrated queries
        id: plan
        env:
          COLLECTION: ${{ inputs.collection || 'all' }}
        run: python -m scripts.actu_foot_v3_maintenance --collection "$COLLECTION"
      - name: Verify full independent archive lifecycle without touching production
        run: python -m scripts.actu_foot_v3_e2e_rehearsal
  automatic:
    needs: preview
    if: github.ref == 'refs/heads/main' && needs.preview.outputs.active == 'true' && (github.event_name == 'schedule' || github.event_name == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      actions: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'cryptography>=43,<47' 'requests>=2.31,<3'
      - name: Execute only previously approved encrypted retention policy
        id: compact
        run: python -m scripts.actu_foot_v3_maintenance --automatic
      - name: Verify independent archive recovery in isolated runner
        run: python -m scripts.actu_foot_v3_maintenance --recover-archives
      - name: Request anchored live backup even if a later step fails
        if: always() && steps.compact.outcome != 'skipped' && steps.compact.outcome != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run actu-foot-v2-backup.yml --repo "$GITHUB_REPOSITORY" --ref main
  maintenance:
    needs: preview
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && (inputs.recover_archives || inputs.execute && inputs.confirmation == 'APPROVE_V3_ENCRYPTED_COMPACTION')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      actions: write
      id-token: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      COLLECTION: ${{ inputs.collection || 'all' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'cryptography>=43,<47' 'requests>=2.31,<3'
      - name: Activate encrypted policy and compact only independently verified shards
        if: inputs.recover_archives != true
        run: python -m scripts.actu_foot_v3_maintenance --collection "$COLLECTION" --activate --execute --confirmation APPROVE_V3_ENCRYPTED_COMPACTION
      - name: Recover and verify isolated encrypted archive batch
        env:
          RECOVERY_AFTER: ${{ inputs.recovery_after || '' }}
        run: python -m scripts.actu_foot_v3_maintenance --recover-archives --after "$RECOVERY_AFTER"
      - uses: actions/upload-artifact@v4
        with:
          name: actufoot-v3-archive-recovery-${{ github.run_id }}
          path: /tmp/v3-archive-recovery/
          retention-days: 7
          if-no-files-found: ignore
      - name: Request V2 anchored live backup after maintenance
        if: inputs.recover_archives != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run actu-foot-v2-backup.yml --repo "$GITHUB_REPOSITORY" --ref main
