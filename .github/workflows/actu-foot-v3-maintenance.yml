name: Actu Foot V3 - Safe archive maintenance
on:
  workflow_dispatch:
    inputs:
      collection:
        type: choice
        options: [all, matches, live_events, news, statistics]
        default: all
      execute:
        type: boolean
        default: false
      confirmation:
        type: string
        default: ''
  push:
    branches: [main]
    paths:
      - '.github/workflows/actu-foot-v3-maintenance.yml'
  schedule:
    - cron: '21 2 * * 1'
permissions:
  contents: read
concurrency:
  group: actufoot-v3-atomic-maintenance
  cancel-in-progress: false
env:
  GITHUB_TOKEN: ${{ github.token }}
  ACTU_FOOT_V2_KEY_B64_V1: ${{ secrets.ACTU_FOOT_V2_KEY_B64_V1 }}
  ACTU_FOOT_V2_KEY_B64_V2: ${{ secrets.ACTU_FOOT_V2_KEY_B64_V2 }}
  ML_V2_HISTORY_KEY_B64: ${{ secrets.ML_V2_HISTORY_KEY_B64 }}
  ACTU_FOOT_V2_ALLOW_LEGACY_KEY: '1'
jobs:
  preview:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    outputs:
      eligible: ${{ steps.plan.outputs.eligible }}
      active: ${{ steps.plan.outputs.active }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'cryptography>=43,<47' 'requests>=2.31,<3'
      - name: Preview every allowed collection and validate integrated queries
        id: plan
        env:
          COLLECTION: ${{ inputs.collection || 'all' }}
        run: python -m scripts.actu_foot_v3_maintenance --collection "$COLLECTION"
      - name: Independent encrypted archive rehearsal (isolated namespace, expires after one day)
        if: github.event_name != 'schedule'
        run: |
          python - <<'PY'
          import os,base64,secrets
          os.environ["ACTU_FOOT_V2_KEY_B64_V2"]=base64.b64encode(secrets.token_bytes(32)).decode()
          from scripts.actu_foot_v3_archive import archive_path,make_archive
          from scripts.actu_foot_v3_cloud_archive import CloudArchive
          path=archive_path("news","2026-01")
          blob=make_archive("news","2026-01",{"rehearsal":{"title":"Isolated synthetic rehearsal","published_at":"2026-01-01T00:00:00Z"}},key_version=2)
          c=CloudArchive(rehearsal=True)
          digest=c.persist(path,blob)
          assert c.recover(path,digest)==blob
          print("V3_INDEPENDENT_ARCHIVE_REHEARSAL_OK")
          PY
  maintenance:
    needs: preview
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' && needs.preview.outputs.active == 'false' || github.event_name == 'schedule' && needs.preview.outputs.active == 'true' && needs.preview.outputs.eligible != '0' || github.event_name == 'workflow_dispatch' && inputs.execute && inputs.confirmation == 'APPROVE_V3_ENCRYPTED_COMPACTION')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: actu-foot-v2-maintenance
    permissions:
      contents: write
      actions: write
      id-token: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      COLLECTION: ${{ inputs.collection || 'all' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'cryptography>=43,<47' 'requests>=2.31,<3'
      - name: Verify actual environment policy
        run: python -m scripts.actu_foot_v2_release_guard
      - name: Activate encrypted policy and compact only independently verified shards
        run: python -m scripts.actu_foot_v3_maintenance --collection "$COLLECTION" --activate --execute --confirmation APPROVE_V3_ENCRYPTED_COMPACTION
      - name: Request V2 anchored live backup after maintenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run actu-foot-v2-backup.yml --repo "$GITHUB_REPOSITORY" --ref main
