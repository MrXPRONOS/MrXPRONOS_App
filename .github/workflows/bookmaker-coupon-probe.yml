name: Six bookmaker coupon probe (no wager)
on:
  push:
    branches: [diagnostic/bookmaker-odds]
    paths:
      - "tools/odds_diagnostic/bookmaker_coupon_probe.py"
      - ".github/workflows/bookmaker-coupon-probe.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Playwright Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Test six bookmaker public coupons
        run: python tools/odds_diagnostic/bookmaker_coupon_probe.py
      - name: Upload results even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: six-bookmaker-coupon-report
          path: |
            odds_diagnostic_results/bookmaker_coupon_report.json
            odds_diagnostic_results/*_coupon_probe.png
          if-no-files-found: warn
