name: Actu Foot V2 - Bootstrap encrypted collections
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/actu-foot-v2-bootstrap.yml'
permissions:
  contents: write
concurrency:
  group: actufoot-v3-atomic-maintenance
  cancel-in-progress: false
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      ACTU_FOOT_V2_KEY_B64_V1: ${{ secrets.ACTU_FOOT_V2_KEY_B64_V1 }}
      ML_V2_HISTORY_KEY_B64: ${{ secrets.ML_V2_HISTORY_KEY_B64 }}
      ACTU_FOOT_V2_ALLOW_LEGACY_KEY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'cryptography>=43,<47' 'requests>=2.31,<3'
      - name: Atomic initialization with encrypted-only commit
        run: python -m scripts.actu_foot_v2_bootstrap
