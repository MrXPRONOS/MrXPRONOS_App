name: ML V2 - strict HistGB Hybrid exact-score consensus Top5 Top10 Top20
on:
  push:
    branches: [research/single-ml-v2-20261024]
    paths: ['.github/workflows/research-ml-v2-consensus-topk.yml']
permissions:
  contents: read
concurrency:
  group: research-ml-v2-consensus-frozen-nov25-feb26-jun26
  cancel-in-progress: false
jobs:
  monthly-consensus:
    name: 6-system confidence and agreement TopK ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - {label: nov2025, start: '2025-11-01', end: '2025-11-30'}
          - {label: feb2026, start: '2026-02-01', end: '2026-02-28'}
          - {label: jun2026, start: '2026-06-01', end: '2026-06-30'}
    env:
      ML_V2_HISTORY_KEY_B64: ${{ secrets.ML_V2_HISTORY_KEY_B64 }}
      PYTHONUNBUFFERED: '1'
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install same fixed historical ML dependencies as prior successful TopK
        run: python -m pip install numpy scipy scikit-learn requests cryptography lightgbm==4.6.0 catboost==1.2.8
      - name: Unit tests for score-exact agreement, insufficient agreements, and leakage
        run: |
          set -euo pipefail
          python -m py_compile research/ml_v2_consensus_topk.py
          PYTHONPATH=.:research python -m unittest research.test_ml_v2_consensus_topk research.test_ml_v2_topk -v
      - name: Reconstruct all certified football outcomes chronologically
        run: |
          set -euo pipefail
          PYTHONPATH=.:research python research/single_ml_v2_multisource.py \
            --start "${{ matrix.start }}" --end "${{ matrix.end }}" \
            --max-eval 0 --out "/tmp/mrx-consensus-${{ matrix.label }}" \
            > "/tmp/mrx-consensus-${{ matrix.label }}-replay.log" 2>&1 || {
              tail -70 "/tmp/mrx-consensus-${{ matrix.label }}-replay.log"
              exit 1
            }
          grep 'MULTISOURCE_ML_V2_COMPATIBILITY\|RETRAIN\|PROGRESS' "/tmp/mrx-consensus-${{ matrix.label }}-replay.log" | tail -8
      - name: Settle six independent Top-K methods with no hindsight selection
        run: |
          set -euo pipefail
          PYTHONPATH=.:research python research/ml_v2_consensus_topk.py month \
            --predictions "/tmp/mrx-consensus-${{ matrix.label }}/all_predictions.csv" \
            --start "${{ matrix.start }}" --end "${{ matrix.end }}" \
            --out "/tmp/mrx-consensus-${{ matrix.label }}/daily_aggregate.json"
      - name: Upload daily anonymous score-hit counts only
        uses: actions/upload-artifact@v4
        with:
          name: mlv2-consensus-${{ matrix.label }}
          path: "/tmp/mrx-consensus-${{ matrix.label }}/daily_aggregate.json"
          if-no-files-found: error
          retention-days: 30

  consensus-three-month-summary:
    needs: monthly-consensus
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only numeric statistical dependencies
        run: python -m pip install numpy scipy scikit-learn
      - name: Re-check pooled bootstrap synthetic tests
        run: PYTHONPATH=.:research python -m unittest research.test_ml_v2_consensus_topk -v
      - uses: actions/download-artifact@v4
        with:
          pattern: mlv2-consensus-*
          path: /tmp/mlv2-consensus-reports
          merge-multiple: false
      - name: Combine all three preregistered months with paired day/block 95% intervals
        run: |
          set -euo pipefail
          PYTHONPATH=.:research python research/ml_v2_consensus_topk.py pool \
            --inputs /tmp/mlv2-consensus-reports/mlv2-consensus-*/daily_aggregate.json \
            --out /tmp/ml-v2-consensus-topk-3months.json --resamples 3000
      - name: Upload ONLY pooled anonymized final conclusions
        uses: actions/upload-artifact@v4
        with:
          name: mlv2-consensus-3months-final
          path: /tmp/ml-v2-consensus-topk-3months.json
          if-no-files-found: error
          retention-days: 30
