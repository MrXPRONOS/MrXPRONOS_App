name: Actu Foot V2 - Read-only release preflight
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/actu-foot-v2-release-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: actufoot-v2-release-preflight
  cancel-in-progress: false
jobs:
  environment-policy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'requests>=2.31,<3' 'cryptography>=43,<47'
      - name: Read actual environment policy without changing it
        run: python -m scripts.actu_foot_v2_release_guard
  rotation-preview:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GITHUB_TOKEN: ${{ github.token }}
      ACTU_FOOT_V2_KEY_B64_V1: ${{ secrets.ACTU_FOOT_V2_KEY_B64_V1 }}
      ACTU_FOOT_V2_KEY_B64_V2: ${{ secrets.ACTU_FOOT_V2_KEY_B64_V2 }}
      ML_V2_HISTORY_KEY_B64: ${{ secrets.ML_V2_HISTORY_KEY_B64 }}
      ACTU_FOOT_V2_ALLOW_LEGACY_KEY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'requests>=2.31,<3' 'cryptography>=43,<47'
      - name: Verify seven encrypted collections and new key locally (no writes)
        run: python -m scripts.actu_foot_v2_atomic_rotation --target 2
