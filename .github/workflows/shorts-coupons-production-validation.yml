name: Shorts Coupons - Production Validation

on:
  schedule:
    - cron: "30 12 * * *"
    - cron: "30 15 * * *"
    - cron: "30 18 * * *"
    - cron: "30 23 * * *"
    - cron: "30 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config/shorts_validation_production_trigger.txt"

permissions:
  contents: read
  id-token: write

concurrency:
  group: shorts-coupons-production-validation
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  POST_PLATFORMS: "facebook,youtube,instagram,threads,bluesky" # TikTok awaits creator consent, app audit, and platform-policy review

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      META_APP_ID: ${{ secrets.META_APP_ID }}
      META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
      META_LONG_LIVED_USER_TOKEN: ${{ secrets.META_LONG_LIVED_USER_TOKEN }}
      META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
      META_PAGE_NAME: ${{ secrets.META_PAGE_NAME }}
      META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      THREADS_APP_SECRET: ${{ secrets.THREADS_APP_SECRET }}
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
      BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
      BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
      TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_PRIVACY_STATUS: public
      SUPABASE_BUCKET: videos

    steps:
      - name: Checkout production with history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 120

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation
          python -m pip install --upgrade pip setuptools wheel
          pip install "numpy<2" pillow requests moviepy==1.0.3
          if [ -f requirements_social.txt ]; then
            pip install -r requirements_social.txt
          fi

      - name: Static syntax check
        run: |
          python -m py_compile scripts/shorts_video_fx.py
          python -m py_compile scripts/create_validation_shorts_from_telegram.py
          python -m py_compile scripts/settle_short_production_batches.py
          python -m py_compile scripts/post_shorts_video.py
          python -m py_compile scripts/verify_social_publications.py

      - name: Authenticate publication ledger through GitHub OIDC
        run: python scripts/ledger_cloudflare_oidc.py
      - name: Settle exact published batches and send Telegram validations
        run: |
          python scripts/settle_short_production_batches.py             --feed data.json             --work-dir telegram_out/production_validation

      - name: Refresh social tokens
        continue-on-error: true
        run: |
          python scripts/refresh_social_tokens.py             --out refreshed_tokens.json             --github-env "$GITHUB_ENV"

      - name: Refresh publication ledger authentication for social publication through GitHub OIDC
        run: python scripts/ledger_cloudflare_oidc.py
      - name: Publish ready validation videos to social platforms
        shell: bash
        run: |
          python - <<'PY' > /tmp/validation-videos.tsv
          import json
          p="telegram_out/production_validation/manifest.json"
          data=json.load(open(p,encoding="utf-8"))
          for item in data.get("published",[]):
              print("\t".join([
                  str(item["video"]),
                  str(item["target"]),
                  str(item["summary"]),
              ]))
          PY

          FAILED=0
          INDEX=0
          while IFS=$'\t' read -r VIDEO TARGET SUMMARY; do
            [ -n "$VIDEO" ] || continue
            python scripts/post_shorts_video.py               --require-all --video "$VIDEO"               --platforms "$POST_PLATFORMS"               --title "Résultats $TARGET - Mr XPRONOS"               --description "$SUMMARY. Résultats vérifiés. 18+ et joue responsablement."               --caption "Résultats Mr XPRONOS ✅\n$SUMMARY\n18+ • Joue responsablement.\n\n#football #pronostic #resultats #mrxpronos" || FAILED=1
            INDEX=$((INDEX+1))
            if [ -s social_post_results.json ]; then
              cp social_post_results.json "telegram_out/production_validation/social_post_results_$INDEX.json"
            fi
          done < /tmp/validation-videos.tsv
          test "$FAILED" -eq 0

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shorts-production-validations
          path: |
            telegram_out/production_validation/
            social_post_results.json
          if-no-files-found: ignore
          retention-days: 7
