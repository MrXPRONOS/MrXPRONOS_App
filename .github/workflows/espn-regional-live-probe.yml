name: ESPN regional football LIVE coverage check

on:
  push:
    branches: [main]
    paths: ['.github/workflows/espn-regional-live-probe.yml']
  workflow_dispatch:

permissions: {contents: read}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect league-specific real football scoreboard availability
        shell: bash
        run: |
          python - <<'PY'
          from datetime import datetime,timezone
          import urllib.request,urllib.parse,json
          from datetime import timedelta
          now=datetime.now(timezone.utc)
          days=[(now-timedelta(days=1)).strftime("%Y%m%d"),now.strftime("%Y%m%d")]
          slugs=("all","crc.1","conmebol.sudamericana","fifa.friendly.w")
          for slug in slugs:
           for day in days:
              u="https://site.api.espn.com/apis/site/v2/sports/soccer/"+slug+"/scoreboard?"+urllib.parse.urlencode({"dates":day})
              try:
                  req=urllib.request.Request(u,headers={"Accept":"application/json","User-Agent":"MrXPRONOS-audit/1.0"})
                  with urllib.request.urlopen(req,timeout=11) as response:
                      j=json.load(response)
                      matches=[]
                      for ev in (j.get("events") or [])[:15]:
                          comp=(ev.get("competitions") or [{}])[0]
                          cc=comp.get("competitors") or []
                          teams=[{"id":x.get("team",{}).get("id"),"name":x.get("team",{}).get("displayName"),
                                  "stats_keys":[t.get("name") for t in x.get("statistics") or [] if t.get("name") in ("wonCorners","totalShots","foulsCommitted")]} for x in cc]
                          matches.append({"id":ev.get("id"),"status":ev.get("status",{}).get("type",{}).get("state"),"teams":teams})
                      print("REGIONAL_ESPN_PROBE",json.dumps({"league":slug,"day":day,"http":response.status,"count":len(j.get("events") or []),"matches":matches}))
              except Exception as e:
                  print("REGIONAL_ESPN_PROBE",json.dumps({"league":slug,"day":day,"error":type(e).__name__}))
          PY
