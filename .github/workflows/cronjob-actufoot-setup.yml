name: Setup cron-job.org Actu Foot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/cronjob-actufoot-setup-trigger.txt"
      - "scripts/ensure_actufoot_cronjob.py"
      - ".github/workflows/cronjob-actufoot-setup.yml"

permissions:
  contents: read

concurrency:
  group: cronjob-actufoot-setup
  cancel-in-progress: true

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            scripts/ensure_actufoot_cronjob.py
          sparse-checkout-cone-mode: false
      - name: Ensure Actu Foot cron-job.org scheduler
        env:
          CRONJOB_API_KEY: ${{ secrets.CRONJOB_API_KEY }}
          ACTUFOOT_TEST_DISPATCH: '1'
        run: python scripts/ensure_actufoot_cronjob.py
