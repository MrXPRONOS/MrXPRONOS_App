name: LIVE - refresh failover

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  # One-time smoke-test whenever the failover workflow itself is changed.
  push:
    paths:
      - '.github/workflows/live-refresh-failover.yml'

permissions:
  contents: read

concurrency:
  group: mrxpronos-live-refresh-failover
  cancel-in-progress: false

jobs:
  recover-live-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: https://nhwafcpndlufzzxexikh.supabase.co
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_KEY_FALLBACK: ${{ secrets.SUPABASE_KEY }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - name: Check refresh heartbeat and recover if stale
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${CRON_SECRET}" ]]; then
            echo "::error::Missing CRON_SECRET GitHub Actions secret."
            exit 1
          fi

          SERVICE_KEY="${SUPABASE_SERVICE_ROLE_KEY:-${SUPABASE_KEY_FALLBACK:-}}"
          SHOULD_REFRESH=1

          if [[ -n "${SERVICE_KEY}" ]]; then
            HEARTBEAT="$(curl --silent --show-error --fail --max-time 15 \
              -H "apikey: ${SERVICE_KEY}" \
              -H "Authorization: Bearer ${SERVICE_KEY}" \
              "${SUPABASE_URL}/rest/v1/cron_runs?select=last_run_at,last_ok&name=eq.live_refresh" || true)"

            if [[ -n "${HEARTBEAT}" ]]; then
              export HEARTBEAT
              if python3 - <<'PY'
          import datetime
          import json
          import os
          import sys

          try:
              rows = json.loads(os.environ.get("HEARTBEAT", ""))
              timestamp = rows[0]["last_run_at"]
              success = rows[0]["last_ok"] is True
              last = datetime.datetime.fromisoformat(timestamp.replace("Z", "+00:00"))
              age = (datetime.datetime.now(datetime.timezone.utc) - last).total_seconds()
              print(f"Refresh heartbeat age: {age:.0f} seconds")
              print(f"Last refresh successful: {success}")
              sys.exit(0 if age >= 360 or age < -30 or not success else 2)
          except Exception as exc:
              print(f"Heartbeat unavailable: {type(exc).__name__}")
              sys.exit(0)
          PY
              then
                echo "Refresh stale/failed/unknown: failover will invoke refresh."
              else
                SHOULD_REFRESH=0
                echo "Primary refresh last completed successfully: skipping failover."
              fi
            else
              echo "::warning::Heartbeat read failed. Attempting refresh recovery."
            fi
          else
            echo "::warning::No service-role secret available for the heartbeat; invoking refresh as failover."
          fi

          if [[ "${SHOULD_REFRESH}" != "1" ]]; then
            exit 0
          fi

          # The Edge Function uses claim_live_refresh to prevent concurrent heavy refreshes.
          # Do not backfill old LIVE predictions: only the current match data is eligible.
          # Include the optional publishable/anon key for gateways that enforce it.
          GATEWAY_HEADERS=()
          if [[ -n "${SUPABASE_ANON_KEY}" ]]; then
            GATEWAY_HEADERS+=(-H "apikey: ${SUPABASE_ANON_KEY}")
            GATEWAY_HEADERS+=(-H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          fi

          RECOVERY_START_EPOCH="$(date -u +%s)"

          curl --fail-with-body --show-error --silent --max-time 210 \
            --retry 1 --retry-delay 5 \
            -X POST "${SUPABASE_URL}/functions/v1/live/refresh" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${CRON_SECRET}" \
            "${GATEWAY_HEADERS[@]}" \
            -o /tmp/live-refresh-response.json

          python3 - <<'PY'
          import json
          import sys
          with open("/tmp/live-refresh-response.json", encoding="utf-8") as f:
              response = json.load(f)
          print("Refresh endpoint response:", json.dumps(response, ensure_ascii=False)[:1000])
          if response.get("already_running") is True:
              print("Another refresh coordinator already holds the lock.")
          elif response.get("accepted") is not True and response.get("success") is not True:
              print("ERROR: Refresh endpoint did not accept the recovery job.")
              sys.exit(1)
          if response.get("background") is True:
              print("Background refresh accepted; actual predictions must still be verified.")
          PY

          # A 202 response means only "accepted", not "completed". Confirm
          # the persisted backend outcome before considering failover successful.
          if [[ -z "${SERVICE_KEY}" ]]; then
            echo "::error::A Supabase service-role DB-readable key is required for reliable recovery verification."
            exit 1
          fi

          RECOVERY_VERIFIED=0
          for attempt in 1 2 3 4 5 6; do
            sleep 10
            RECOVERY_HEALTH="$(curl --silent --show-error --fail --max-time 15 \
              -H "apikey: ${SERVICE_KEY}" \
              -H "Authorization: Bearer ${SERVICE_KEY}" \
              "${SUPABASE_URL}/rest/v1/cron_runs?select=last_run_at,last_ok,meta&name=eq.live_refresh" || true)"
            export RECOVERY_HEALTH RECOVERY_START_EPOCH
            if python3 - <<'PY'
          import datetime
          import json
          import os
          import sys

          try:
              rows = json.loads(os.environ["RECOVERY_HEALTH"])
              if not rows:
                  raise ValueError("No live_refresh health record")
              row = rows[0]
              last_at = datetime.datetime.fromisoformat(str(row["last_run_at"]).replace("Z", "+00:00"))
              fresh = last_at.timestamp() >= int(os.environ["RECOVERY_START_EPOCH"]) - 5
              healthy = row["last_ok"] is True
              print("Recovery verification:", {"attempt_fresh": fresh, "last_ok": healthy, "updated_at": row["last_run_at"]})
              sys.exit(0 if fresh and healthy else 1)
          except Exception as exc:
              print("Health verification incomplete:", type(exc).__name__)
              sys.exit(1)
          PY
            then
              RECOVERY_VERIFIED=1
              break
            fi
          done

          if [[ "${RECOVERY_VERIFIED}" != "1" ]]; then
            echo "::error::The refresh request was accepted, but no successful recent refresh was confirmed in Supabase."
            exit 1
          fi
          echo "Refresh recovery verified in the database."
