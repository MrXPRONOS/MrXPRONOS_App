name: Telegram - Preflight production boutons (lecture seule)
on:
  pull_request:
    paths:
      - 'scripts/telegram_bot_promotions_preflight.py'
      - 'tests/test_telegram_bot_promotions_preflight.py'
      - '.github/workflows/telegram-bot-promotions-preflight.yml'
  push:
    branches: [main]
    paths: ['.telegram-promo-preflight-20261125']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'requests==2.32.5' 'Pillow==11.3.0'
      - run: python -m unittest discover -s tests -p test_telegram_bot_promotions_preflight.py -v
  preflight:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'requests==2.32.5' 'Pillow==11.3.0'
      - name: Verify bot identity, exact two approved destinations and anti-duplicate ledger — NO SEND
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_SECONDARY: ${{ secrets.TELEGRAM_CHAT_ID_SECONDARY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_APPROVED_DAY_PROMOS: ${{ vars.TELEGRAM_APPROVED_DAY_PROMOS }}
          TELEGRAM_APPROVED_BONUS_BOOKMAKERS: ${{ vars.TELEGRAM_APPROVED_BONUS_BOOKMAKERS }}
          TELEGRAM_APPROVED_GUIDE_BOOKMAKERS: ${{ vars.TELEGRAM_APPROVED_GUIDE_BOOKMAKERS }}
        run: python scripts/telegram_bot_promotions_preflight.py
