name: CinéX - Publicités Mr XPRONOS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/telegram-film-promos.yml'
  workflow_dispatch:
  schedule:
    - cron: '47 */2 * * *'

permissions:
  contents: write

concurrency:
  group: mrx-telegram-film-state
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: telegram-film-relay/requirements.txt
      - name: Installer les dépendances
        run: python -m pip install -r telegram-film-relay/requirements.txt
      - name: Valider les images et la rotation (sans envoi)
        working-directory: telegram-film-relay
        env:
          PYTHONPATH: .
        run: |
          python -m compileall -q film_relay scripts
          python -m unittest discover -s tests -q
      - name: Partager une affiche avec vrai bouton par canal éligible
        working-directory: telegram-film-relay
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_STRING_SESSION: ${{ secrets.TG_SESSION_STRING || secrets.TG_STRING_SESSION || secrets.TG_STREAM_SESSION }}
          CINEX_BOT_TOKEN: ${{ secrets.FOOTBALL_NEWS_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          TG_PRIVATE_CHANNEL: ${{ vars.TG_PRIVATE_CHANNEL }}
          TG_PUBLIC_CHANNEL: ${{ vars.TG_PUBLIC_CHANNEL }}
          TG_MIRROR_CHANNEL: ${{ vars.TG_MIRROR_CHANNEL || '@Torrent9SeriesFilms' }}
          PROMO_FORCE_ONCE: 'false'
          PYTHONPATH: .
        run: python scripts/run_promotions.py
      - name: Sauvegarder les reçus sans doublons
        if: always()
        run: |
          set -e
          STATE_FILE="telegram-film-relay/state/state.json"
          if git diff --quiet -- "$STATE_FILE"; then
            echo "Aucune nouvelle publicité à enregistrer."
            exit 0
          fi
          cp "$STATE_FILE" "$RUNNER_TEMP/cinex-checkpoint.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin main
            git reset --hard origin/main
            python telegram-film-relay/scripts/merge_state.py \
              "$RUNNER_TEMP/cinex-checkpoint.json" "$STATE_FILE"
            if git diff --quiet -- "$STATE_FILE"; then
              echo "Reçus publicitaires déjà enregistrés."
              exit 0
            fi
            git add "$STATE_FILE"
            git commit -m "state: CineX promo rotation [skip ci]"
            if git push origin HEAD:main; then
              echo "Reçus publicitaires sauvegardés."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Sauvegarde de la rotation échouée après huit essais"
          exit 1
