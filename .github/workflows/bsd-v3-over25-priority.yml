name: BSD V3 - Over 2.5 priority experiment

on:
  pull_request:
    branches: [main]
    paths:
      - 'bsd_v3/over25_experiment.py'
      - '.github/workflows/bsd-v3-over25-priority.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bsd-v3-over25-priority
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: bsd
      BSD_HISTORY_KEY: ${{ secrets.BSD_HISTORY_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install free dependencies
        run: python -m pip install requests cryptography pillow
      - name: Compile
        run: python -m compileall -q bsd bsd_v3
      - name: Restore private BSD history
        run: python bsd/bsd_archive.py restore
      - name: Run chronological Over 2.5 threshold experiment
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from bsd_archive import _read_json
          from bsd_v3.over25_experiment import experiment
          history=_read_json(Path("bsd/all_matches_bsd.json"),None)
          report=experiment(history)
          Path("bsd_v3/artifacts").mkdir(parents=True,exist_ok=True)
          Path("bsd_v3/artifacts/over25_experiment.json").write_text(
              json.dumps(report,indent=2),encoding="utf-8")
          print("BSD_V3_OVER25_EXPERIMENT",json.dumps({
              "chosen":report["chosen_on_recent_selection"],
              "accepted":report["accepted"],
              "active":report["active_threshold"],
              "active_conservative":report["active_conservative_threshold"],
              "october":report["october"],
              "validation":report["tables"]["validation"][report["active_threshold"]],
              "stability":report["tables"]["train"][report["active_threshold"]],
          }))
          PY
      - name: Remove decrypted history
        if: always()
        run: rm -f bsd/all_matches_bsd.json bsd/backfill_state.json
      - name: Upload aggregate report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bsd-v3-over25-${{ github.run_id }}
          path: bsd_v3/artifacts/over25_experiment.json
          retention-days: 30
          if-no-files-found: error
