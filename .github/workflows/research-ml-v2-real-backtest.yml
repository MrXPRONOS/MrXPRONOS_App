name: ML V2 - real multisource retrospective 5-model comparison
on:
  push:
    branches: [research/single-ml-v2-20261024]
    paths: ['.github/workflows/research-ml-v2-real-backtest.yml']
permissions:
  contents: read
jobs:
  five-model-walkforward:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ML_V2_HISTORY_KEY_B64: ${{ secrets.ML_V2_HISTORY_KEY_B64 }}
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/single-ml-v2-20261024
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned research candidate model dependencies
        run: python -m pip install numpy scipy scikit-learn requests cryptography lightgbm==4.6.0 catboost==1.2.8
      - name: Verify all repository code is syntactically valid
        run: python -m py_compile research/single_ml_v2_multisource.py research/single_ml_v2_multisource_compare.py research/single_ml_v2.py
      - name: Regression test for provider team-ID collision and five-way comparator
        run: |
          PYTHONPATH=.:research python -m unittest research.test_single_ml_v2_multisource_identities research.test_single_ml_v2_multisource_compare -v
      - name: Historical walk-forward 2026-10-20 through 2026-10-22
        run: |
          set -euo pipefail
          PYTHONPATH=.:research python research/single_ml_v2_multisource.py \
            --start 2026-10-20 --end 2026-10-22 \
            --max-eval 0 --out /tmp/ml-v2-five-backtest
      - name: Independent paired five-model audit
        run: |
          set -euo pipefail
          PYTHONPATH=.:research python research/single_ml_v2_multisource_compare.py \
            --predictions /tmp/ml-v2-five-backtest/all_predictions.csv \
            --start 2026-10-20 --end 2026-10-22 \
            --minimum 75 --out /tmp/ml-v2-five-backtest/five_model_aggregate.json
      - name: Publish ONLY aggregate research evidence, not match-level files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml-v2-five-models-aggregate
          path: |
            /tmp/ml-v2-five-backtest/summary.json
            /tmp/ml-v2-five-backtest/five_model_aggregate.json
          if-no-files-found: warn
          retention-days: 14
