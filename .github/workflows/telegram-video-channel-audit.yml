name: Telegram Shorts channels - Permissions audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config/telegram_video_channel_audit_trigger.txt"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Telegram diagnostic dependencies
        run: python -m pip install requests "telethon>=1.36,<2"
      - name: Audit bot access without sending Telegram content
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          FOOTBALL_NEWS_BOT_TOKEN: ${{ secrets.FOOTBALL_NEWS_BOT_TOKEN }}
          DESIR_BOT_TOKEN: ${{ secrets.DESIR_BOT_TOKEN }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION_STRING || secrets.TG_STRING_SESSION || secrets.TG_STREAM_SESSION }}
        run: |
          python scripts/distribute_short_telegram.py --audit-permissions
