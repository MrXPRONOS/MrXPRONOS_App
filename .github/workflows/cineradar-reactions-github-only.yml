name: CineRadar - GitHub-only encrypted Telegram reactions

on:
  schedule:
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/cineradar_reactions_github_only.py'
      - 'scripts/cineradar_reaction_store.py'
      - 'scripts/cineradar_reaction_core.py'
      - 'scripts/cineradar_reaction_multichannel.py'
      - 'scripts/cineradar_owner_channels.py'
      - 'scripts/cineradar_reaction_coverage_github.py'
      - '.github/workflows/cineradar-reactions-github-only.yml'
  pull_request:
    paths:
      - 'scripts/cineradar_reactions_github_only.py'
      - 'scripts/cineradar_reaction_store.py'
      - 'scripts/cineradar_reaction_core.py'
      - 'scripts/cineradar_reaction_multichannel.py'
      - 'scripts/cineradar_owner_channels.py'
      - 'scripts/cineradar_import_reaction_history.py'
      - 'tests/test_cineradar_reaction_store.py'
      - 'tests/test_cineradar_multichannel_reactions.py'
      - 'tests/test_cineradar_owner_channels.py'
      - '.github/workflows/cineradar-reactions-github-only.yml'

permissions:
  contents: write

concurrency:
  group: cineradar-github-encrypted-reactions
  cancel-in-progress: false

jobs:
  offline_tests:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'cryptography>=43,<47' requests
      - run: |
          python -m py_compile scripts/cineradar_reaction_store.py scripts/cineradar_reaction_core.py scripts/cineradar_owner_channels.py scripts/cineradar_reaction_multichannel.py scripts/cineradar_reactions_github_only.py scripts/cineradar_reaction_coverage_github.py scripts/cineradar_import_reaction_history.py
          python -m unittest discover -s tests -p 'test_cineradar_reaction_store.py' -v
          python -m unittest discover -s tests -p 'test_cineradar_multichannel_reactions.py' -v
          python -m unittest discover -s tests -p 'test_cineradar_owner_channels.py' -v

  react:
    needs: offline_tests
    if: ${{ always() && (needs.offline_tests.result == 'success' || needs.offline_tests.result == 'skipped') && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push') }}
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      GITHUB_TOKEN: ${{ github.token }}
      ML_V2_HISTORY_KEY_B64: ${{ secrets.ML_V2_HISTORY_KEY_B64 }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_REF_NAME: main
      CINERADAR_REACTION_OBSERVER_TOKEN: ${{ secrets.CINERADAR_REACTION_OBSERVER_TOKEN }}
      CINERADAR_REACTION_CHANNEL_IDS: ${{ vars.CINERADAR_REACTION_CHANNEL_IDS }}
      REACTIONS_GITHUB_PRIMARY: 'true'
      CINE_RADAR_BOT_TOKEN: ${{ secrets.CINE_RADAR_BOT_TOKEN }}
      CINEX_BOT_TOKEN: ${{ secrets.CINEX_BOT_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      EDITORIAL_TELEGRAM_BOT_TOKEN: ${{ secrets.EDITORIAL_TELEGRAM_BOT_TOKEN }}
      PARTNERSHIP_BOT_TOKEN: ${{ secrets.PARTNERSHIP_BOT_TOKEN }}
      MRXPRONOS_CANAL_BOT_TOKEN: ${{ secrets.MRXPRONOS_CANAL_BOT_TOKEN }}
      CANAL_BOT_TOKEN: ${{ secrets.CANAL_BOT_TOKEN }}
      TELEGRAM_REACTION_BOT_03_TOKEN: ${{ secrets.TELEGRAM_REACTION_BOT_03_TOKEN }}
      TELEGRAM_REACTION_BOT_04_TOKEN: ${{ secrets.TELEGRAM_REACTION_BOT_04_TOKEN }}
