name: CMS 2B duplicate and media disclosure QA
on:
  pull_request:
    paths:
      - 'assets/js/admin-real.js'
      - 'assets/js/cms-duplicate.mjs'
      - 'assets/js/cms-block-editor.mjs'
      - 'tests/cms-part2b-duplicate.test.mjs'
      - '.github/workflows/cms-part2b-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cms-duplicate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test safe duplication and original multimedia editor
        run: node --test tests/cms-part2b-duplicate.test.mjs tests/cms-multimedia-2a.test.mjs
      - name: Check syntax
        run: |
          node --check assets/js/admin-real.js
          node --check assets/js/cms-block-editor.mjs
          node --check assets/js/cms-duplicate.mjs
