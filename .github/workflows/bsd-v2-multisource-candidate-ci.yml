name: BSD V2 - Multisource candidate gate CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/football_**'
      - 'tests/test_football_**'
      - '.github/workflows/bsd-v2-multisource-candidate-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bsd-v2-multisource-candidate-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualified-candidate-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Install dependencies
        run: python -m pip install requests cryptography pillow
      - name: Compile selective multisource gate
        run: |
          python -m py_compile             scripts/football_history_shadow.py             scripts/football_history_features.py             scripts/football_match_source_router.py             scripts/football_multi_api_history_inputs.py             scripts/football_verified_identity_crosswalk.py             scripts/football_public_domain_prematch.py             scripts/football_bsd_private_history.py             scripts/football_daily_multisource_shadow.py             scripts/football_prematch_multiday_probe.py             scripts/football_external_bsd_v2_adapter.py             scripts/football_cc0_calendar_verification.py             scripts/football_native_bsd_identity_probe.py             scripts/football_multisource_market_gate.py             scripts/football_openfootball_world_import.py             scripts/football_publication_transaction_canary.py
          php -l scripts/football_history_import.php
      - name: Run selective offline tests
        run: |
          python -m unittest -v             tests.test_football_history_shadow             tests.test_football_history_features             tests.test_football_match_source_router             tests.test_football_multi_api_history_inputs             tests.test_football_verified_identity_crosswalk             tests.test_football_public_domain_prematch             tests.test_football_daily_multisource_shadow             tests.test_football_external_bsd_v2_adapter             tests.test_football_native_bsd_identity_probe             tests.test_football_multisource_market_gate             tests.test_football_openfootball_world_import             tests.test_football_publication_transaction_canary
