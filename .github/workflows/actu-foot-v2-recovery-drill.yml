name: Actu Foot V2 - Cloudflare recovery drill
on:
  workflow_dispatch:
    inputs:
      backup_run:
        type: string
        required: true
        description: GitHub run number of verified encrypted backup
      backup_attempt:
        type: string
        required: true
        default: '1'
permissions:
  contents: read
  id-token: write
jobs:
  drill:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ACTU_FOOT_V2_KEY_B64_V1: ${{ secrets.ACTU_FOOT_V2_KEY_B64_V1 }}
      ACTU_FOOT_V2_KEY_B64_V2: ${{ secrets.ACTU_FOOT_V2_KEY_B64_V2 }}
      ML_V2_HISTORY_KEY_B64: ${{ secrets.ML_V2_HISTORY_KEY_B64 }}
      ACTU_FOOT_V2_ALLOW_LEGACY_KEY: '1'
      SOURCE_RUN: ${{ inputs.backup_run }}
      SOURCE_ATTEMPT: ${{ inputs.backup_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'cryptography>=43,<47' 'requests>=2.31,<3'
      - run: python -m scripts.actu_foot_v2_cloudflare_recovery --run "$SOURCE_RUN" --attempt "$SOURCE_ATTEMPT"
