name: Actu Foot V3 - Data engine tests
on:
  pull_request:
    paths:
      - 'scripts/actu_foot_v3_*.py'
      - 'tests_football_channel/test_actu_foot_v3_engine.py'
      - 'tests_football_channel/test_actu_foot_v3_complete.py'
      - '.github/workflows/actu-foot-v3-tests.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/actu_foot_v3_*.py'
      - 'tests_football_channel/test_actu_foot_v3_engine.py'
      - '.github/workflows/actu-foot-v3-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'cryptography>=43,<47' 'requests>=2.31,<3'
      - run: |
          python -m py_compile scripts/actu_foot_v3_query.py scripts/actu_foot_v3_engine.py scripts/actu_foot_v3_atomic.py scripts/actu_foot_v3_archive.py scripts/actu_foot_v3_migrate.py scripts/actu_foot_v3_maintenance.py
          python -m unittest tests_football_channel.test_actu_foot_v3_engine tests_football_channel.test_actu_foot_v3_complete tests_football_channel.test_actu_foot_v2_store -v
