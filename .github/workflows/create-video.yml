name: Create Shorts Video

on:
  # Déclenchement manuel depuis l'interface GitHub
  workflow_dispatch:

  # Optionnel : déclenchement automatique après le succès du daily-update
  workflow_run:
    workflows: ["Daily Update"]
    types:
      - completed

jobs:
  build-video:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install moviepy numpy

      - name: Run video creation script
        env:
          MORE_URL: ${{ vars.SITE_URL || 'https://mrxpronos.github.io/MrXPRONOS_App/pronos.html' }}
        run: |
          python scripts/create_shorts_video.py

      - name: Upload video as artifact (optionnel)
        uses: actions/upload-artifact@v4
        with:
          name: daily-shorts-video
          path: daily_pronos_shorts.mp4
          retention-days: 7