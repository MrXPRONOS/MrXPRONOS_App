name: Create Shorts Video

on:
  workflow_dispatch:  # déclenchement manuel
  workflow_run:
    workflows: ["Daily Update"]
    types:
      - completed

jobs:
  build-video:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install moviepy numpy

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm install -D playwright
          npx playwright install --with-deps chromium

      - name: Start local HTTP server
        run: |
          python -m http.server 8000 &
          sleep 3

      - name: Export cards (up to 5 matches, simple/pro/vip)
        run: node scripts/export_simple_coupons.mjs
        env:
          LIMIT: "5"
          EXPORT_URL: http://127.0.0.1:8000/pronos.html
          OUT_DIR: telegram_out

      - name: Create Shorts video
        run: python scripts/create_shorts_video.py
        env:
          MORE_URL: ${{ vars.SITE_URL || 'https://mrxpronos.github.io/MrXPRONOS_App/pronos.html' }}

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-shorts-video
          path: daily_pronos_shorts.mp4
          retention-days: 7