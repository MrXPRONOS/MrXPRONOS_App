name: Create Shorts Video

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Daily Update"]
    types:
      - completed

jobs:
  build-video:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts moviepy pillow numpy requests

      - name: Create Shorts video from data.json
        run: python scripts/create_shorts_video.py --data data.json --max 5 --out daily_pronos_shorts.mp4
        env:
          VOICE_ENGINE: edge
          TTS_VOICE: fr-FR-RemyMultilingualNeural
          TTS_RATE: "-7%"
          TTS_PITCH: "-1Hz"

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-shorts-video
          path: daily_pronos_shorts.mp4
          retention-days: 7
