name: Create and Publish Shorts Video

on:
  workflow_dispatch:

  workflow_run:
    workflows:
      - Daily Update
    types:
      - completed

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  VIDEO_FILE: daily_pronos_shorts.mp4
  POST_PLATFORMS: facebook,youtube,instagram,threads,tiktok
  GRAPH_API_VERSION: v25.0

jobs:
  create-and-publish:
    name: Generate and publish shorts
    runs-on: ubuntu-latest

    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'

    env:
      # GitHub token pour mettre à jour les secrets automatiquement
      GH_PAT_SECRETS: ${{ secrets.GH_PAT_SECRETS }}

      # Meta Facebook + Instagram
      META_APP_ID: ${{ secrets.META_APP_ID }}
      META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
      META_LONG_LIVED_USER_TOKEN: ${{ secrets.META_LONG_LIVED_USER_TOKEN }}
      META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
      META_PAGE_NAME: ${{ secrets.META_PAGE_NAME }}
      META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}

      # Threads
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      THREADS_APP_SECRET: ${{ secrets.THREADS_APP_SECRET }}
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}

      # TikTok
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
      TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
      TIKTOK_PRIVACY_LEVEL: PUBLIC_TO_EVERYONE

      # YouTube Shorts
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_PRIVACY_STATUS: public

      # Supabase Storage pour Instagram / Threads
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_BUCKET: videos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel

          # Dépendances génération vidéo
          pip install edge-tts moviepy pillow numpy requests

          # Dépendances publication / refresh tokens
          if [ -f requirements_social.txt ]; then
            pip install -r requirements_social.txt
          else
            pip install requests google-auth google-auth-oauthlib google-api-python-client supabase
          fi

      - name: Check required files
        run: |
          echo "📂 Contenu racine :"
          ls -la

          echo "📂 Contenu scripts :"
          ls -la scripts || true

          if [ ! -f "data.json" ]; then
            echo "❌ data.json introuvable"
            exit 1
          fi

          if [ ! -f "scripts/create_shorts_video.py" ]; then
            echo "❌ scripts/create_shorts_video.py introuvable"
            exit 1
          fi

          if [ ! -f "scripts/post_shorts_video.py" ]; then
            echo "❌ scripts/post_shorts_video.py introuvable"
            exit 1
          fi

          if [ ! -f "scripts/refresh_social_tokens.py" ]; then
            echo "❌ scripts/refresh_social_tokens.py introuvable"
            echo "Ajoute le fichier du pack durable tokens dans scripts/"
            exit 1
          fi

      - name: Create Shorts video from data.json
        run: |
          python scripts/create_shorts_video.py \
            --data data.json \
            --max 5 \
            --out "${VIDEO_FILE}"
        env:
          VOICE_ENGINE: edge
          TTS_VOICE: fr-FR-RemyMultilingualNeural
          TTS_RATE: "-7%"
          TTS_PITCH: "-1Hz"

      - name: Verify generated video
        run: |
          if [ ! -f "${VIDEO_FILE}" ]; then
            echo "❌ Vidéo non générée : ${VIDEO_FILE}"
            exit 1
          fi

          echo "✅ Vidéo générée : ${VIDEO_FILE}"
          ls -lh "${VIDEO_FILE}"

      - name: Upload generated video artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily_pronos_shorts
          path: ${{ env.VIDEO_FILE }}

      - name: Check Supabase config for Instagram and Threads
        run: |
          python - <<'PY'
          import os

          checks = [
              "SUPABASE_URL",
              "SUPABASE_SERVICE_ROLE_KEY",
              "SUPABASE_BUCKET",
          ]

          print("🔎 Vérification Supabase Storage")

          missing = []

          for name in checks:
              value = os.getenv(name)
              if value:
                  print(f"✅ {name} configuré")
              else:
                  print(f"❌ {name} manquant")
                  missing.append(name)

          if missing:
              print("")
              print("⚠️ Instagram et Threads risquent d'échouer car ils ont besoin d'une URL publique.")
              print("Variables manquantes:", ", ".join(missing))
          else:
              print("")
              print("✅ Supabase est prêt pour générer une URL publique de la vidéo.")
          PY

      - name: Refresh social tokens before publishing
        continue-on-error: true
        run: |
          echo "🔐 Refresh des tokens sociaux avant publication"
          python scripts/refresh_social_tokens.py \
            --out refreshed_tokens.json \
            --github-env "$GITHUB_ENV"

      - name: Persist refreshed tokens into GitHub Secrets
        continue-on-error: true
        run: |
          if [ -z "${GH_PAT_SECRETS:-}" ]; then
            echo "⚠️ GH_PAT_SECRETS manquant. Les tokens seront utilisés seulement pendant ce run."
            echo "Pour rendre le refresh durable, ajoute GH_PAT_SECRETS dans GitHub Secrets."
            exit 0
          fi

          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          path = Path("refreshed_tokens.json")
          if not path.exists():
              print("Aucun fichier refreshed_tokens.json")
              raise SystemExit(0)

          tokens = json.loads(path.read_text(encoding="utf-8"))
          if not tokens:
              print("Aucun token à mettre à jour.")
              raise SystemExit(0)

          repo = os.environ["GITHUB_REPOSITORY"]

          for name, value in tokens.items():
              if not value:
                  continue

              print(f"Mise à jour du secret: {name}")
              subprocess.run(
                  ["gh", "secret", "set", name, "--repo", repo, "--body", value],
                  check=True,
              )

          print("✅ Secrets GitHub mis à jour.")
          PY
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_SECRETS }}

      - name: Delete refreshed tokens file
        if: always()
        run: |
          rm -f refreshed_tokens.json
          echo "🧹 Fichier refreshed_tokens.json supprimé"

      - name: Publish Shorts video to social platforms
        continue-on-error: true
        run: |
          python scripts/post_shorts_video.py \
            --video "${VIDEO_FILE}" \
            --platforms "${POST_PLATFORMS}" \
            --title "Pronos du jour - Mr XPRONOS" \
            --description "Voici les pronos du jour Mr XPRONOS. Analyse rapide, 18+ et joue responsablement."
        env:
          POST_CAPTION: |
            Voici les pronos du jour ⚽
            Analyse rapide • 18+ • Joue responsablement.

            #football #pronostic #pronosdujour #mrxpronos

      - name: Upload social publish report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: social_post_results
          path: social_post_results.json
          if-no-files-found: ignore