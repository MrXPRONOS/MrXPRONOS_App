name: XPRONOS Coupons 4+ - tests

on:
  push:
    paths:
      - 'telegram-coupons-bot/**'
      - '.github/workflows/xpronos-coupon-bot-tests.yml'
  pull_request:
    paths:
      - 'telegram-coupons-bot/**'
      - '.github/workflows/xpronos-coupon-bot-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Tests bot de coupons
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: telegram-coupons-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les dépendances
        run: python -m pip install -r requirements.txt
      - name: Exécuter les tests (cote 4+, XP, coupons)
        run: python -m unittest discover -s tests -v
      - name: Vérifier la syntaxe Python
        run: python -m compileall -q bot.py db.py odds.py
