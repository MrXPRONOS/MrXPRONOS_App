name: Cine Radar Delivery 44 - Tests
on:
  push:
    branches:
      - cine-radar-delivery-account44-v1
    paths:
      - 'cinecanaux/delivery44/**'
      - 'cinecanaux/delivery44-client.mjs'
      - 'cinecanaux/cinex-classic.mjs'
      - '.github/workflows/cine-radar-delivery44-ci.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check cinecanaux/delivery44/worker.mjs
          node --check cinecanaux/delivery44-client.mjs
          node --check cinecanaux/cinex-classic.mjs
      - name: Unit tests
        run: node --test cinecanaux/delivery44/worker.test.mjs
