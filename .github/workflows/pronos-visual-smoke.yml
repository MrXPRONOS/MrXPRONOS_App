name: Pronostics responsive browser smoke
on:
  push:
    branches: [main]
    paths:
      - 'pronos.html'
      - 'assets/css/pronos-premium.css'
      - 'assets/css/style.css'
      - 'assets/js/main.js'
      - 'scripts/pronos_visual_smoke.py'
      - '.github/workflows/pronos-visual-smoke.yml'
  pull_request:
    paths:
      - 'pronos.html'
      - 'assets/css/style.css'
      - 'assets/js/main.js'
      - 'scripts/pronos_visual_smoke.py'
      - '.github/workflows/pronos-visual-smoke.yml'
  workflow_dispatch:
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium automation
        run: |
          pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Start local website
        run: |
          python -m http.server 8000 --bind 127.0.0.1 > /tmp/pronos-http.log 2>&1 &
          sleep 2
      - name: Verify layouts and filter controls
        run: python scripts/pronos_visual_smoke.py
      - name: Save responsive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pronostics-5-viewports
          path: artifacts/pronos-responsive/
          if-no-files-found: warn
