name: Actu Crypto - 07 Bilan Hebdomadaire PREMIUM TEST ONLY

on:
  push:
    branches: [feature/actu-crypto-lot-06-10]
    paths:
      - 'crypto/export_weekly_v2.py'
      - 'crypto/test_weekly_v2.py'
      - 'scripts/render_crypto_weekly_v2.mjs'
      - 'crypto/send_crypto_weekly_v2_test.py'
      - '.github/workflows/actu-crypto-weekly-v2-test.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: actu-crypto-weekly-07-test
  cancel-in-progress: false

jobs:
  weekly-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FOOTBALL_NEWS_BOT_TOKEN: ${{ secrets.FOOTBALL_NEWS_BOT_TOKEN }}
      TELEGRAM_TEST_CHAT_ID: '@predict_mrxp'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install free dependencies
        run: |
          python -m pip install 'requests>=2.31,<3' 'Pillow>=10,<12'
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Offline correctness checks
        run: python -m unittest crypto.test_weekly_v2 -v
      - name: Render demonstration — not publishable
        run: |
          python -m crypto.export_weekly_v2 --demo
          node scripts/render_crypto_weekly_v2.mjs --demo
      - name: Archive demonstration
        uses: actions/upload-artifact@v4
        with:
          name: crypto-publication-07-weekly-DEMO
          path: crypto/generated/test/weekly_v2_demo.png
          if-no-files-found: error
      - name: Collect real weekly data
        run: python -m crypto.export_weekly_v2
      - name: Render real premium poster
        run: node scripts/render_crypto_weekly_v2.mjs
      - name: Archive real premium poster
        uses: actions/upload-artifact@v4
        with:
          name: crypto-publication-07-weekly-REAL
          path: crypto/generated/test/weekly_v2.png
          if-no-files-found: error
      - name: Manually publish to Telegram test channel only
        if: github.event_name == 'workflow_dispatch'
        run: python -m crypto.send_crypto_weekly_v2_test
