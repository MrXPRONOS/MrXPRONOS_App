name: Cine Radar - Backfill official publication metadata
# Re-run after 3/3 official Telegram channels verified by Bot API on 2026-11-18.
on:
  workflow_dispatch:
  schedule:
    - cron: '45 5 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/cine-radar-official-posts.yml'
      - 'cinecanaux/backfill_official_posts.py'
permissions:
  contents: read
concurrency:
  group: mrx-telegram-personal-account
  cancel-in-progress: false
  queue: max
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check syntax
        run: python -m py_compile cinecanaux/backfill_official_posts.py
      - name: Install Telegram read-only client
        run: python -m pip install 'telethon>=1.38,<2'
      - name: Index message metadata from verified official channels
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION_STRING || secrets.TG_STRING_SESSION || secrets.TG_STREAM_SESSION }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          PYTHONUNBUFFERED: '1'
        run: python cinecanaux/backfill_official_posts.py
