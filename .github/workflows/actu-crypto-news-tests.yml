name: Test - Actu Crypto RSS news desk

on:
  pull_request:
    paths:
      - 'crypto/news_digest_v1.py'
      - 'crypto/news_multichannel_v1.py'
      - 'crypto/news_media_v1.py'
      - 'crypto/news_translation_v1.py'
      - 'crypto/news_sources_v2.py'
      - 'crypto/production_live_v1.py'
      - 'crypto/test_news_digest_v1.py'
      - 'crypto/test_news_media_v1.py'
      - 'crypto/test_news_translation_v1.py'
      - 'crypto/test_news_multichannel_v1.py'
      - '.github/workflows/actu-crypto-world-news-30min.yml'
      - '.github/workflows/actu-crypto-news-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-news:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install 'requests>=2.31,<3' 'Pillow>=10,<12' 'feedparser>=6.0,<7' 'langdetect>=1.0.9,<2'
      - name: Run offline regression tests (NO TELEGRAM SEND)
        run: |
          python -m compileall -q crypto
          python -m unittest crypto.test_news_digest_v1 crypto.test_news_translation_v1 crypto.test_news_media_v1 crypto.test_news_multichannel_v1 crypto.test_production_live_v1 -v
