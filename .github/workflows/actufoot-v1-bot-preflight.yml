name: Actu Foot V1 - verify 11 Telegram channel destinations (bot only)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/actufoot-v1-bot-preflight.yml'
      - 'config/actufoot_v1_channels.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: actufoot-v1-bot-preflight
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      FOOTBALL_NEWS_BOT_TOKEN: ${{ secrets.FOOTBALL_NEWS_BOT_TOKEN }}
      FOOTBALL_NEWS_CHAT_ID: ${{ secrets.FOOTBALL_NEWS_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install requests Pillow 'langdetect>=1.0.9,<2'
      - name: Verify public username, exact channel and posting bot rights
        run: |
          python - <<'PY'
          import os,sys,json
          import requests
          sys.path.insert(0,"scripts")
          from actufoot_v1_router import load_config, verify_channels,ROLES
          config=load_config()
          token=os.getenv("FOOTBALL_NEWS_BOT_TOKEN","")
          main=os.getenv("FOOTBALL_NEWS_CHAT_ID","")
          if not token or not main:
              raise SystemExit("ACTUFOOT_V1_BOT_PREFLIGHT_MISSING_SECRETS")
          try:
              success,failed=verify_channels(requests.Session(),token,main,config)
          except RuntimeError as exc:
              raise SystemExit("ACTUFOOT_V1_BOT_PREFLIGHT_BLOCKED "+str(exc))
          print("ACTUFOOT_V1_BOT_PREFLIGHT",
                json.dumps({"verified":sorted(success),"failed":sorted(failed),
                            "expected":len(ROLES),"actual":len(success)}))
          if failed or len(success)!=len(ROLES):
              raise SystemExit("ACTUFOOT_V1_BOT_PREFLIGHT_INCOMPLETE")
          PY
