name: Editorial Free Studio

on:
  workflow_dispatch:
  schedule:
    - cron: '41 5 * * *'

permissions:
  contents: write

concurrency:
  group: editorial-free-studio
  cancel-in-progress: false

jobs:
  editorial:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free local renderer
        run: python -m pip install Pillow
      - name: Build branded media (3 aspect ratios)
        run: python scripts/content_studio.py --limit 12 --news-limit 20
      - name: Build shareable OG pages
        run: python scripts/editorial_pages.py
      - name: Build review-only social queue and metrics
        run: |
          python scripts/editorial_queue.py
          python scripts/editorial_metrics.py
      - name: Check quality
        run: python scripts/editorial_quality.py --strict
      - name: Validate JSON formats
        run: |
          python -m json.tool articles.json > /dev/null
          python -m json.tool conseils.json > /dev/null
          python -m json.tool footnews.json > /dev/null
      - name: Commit generated editorial content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles.json conseils.json footnews.json articles/ conseils/ assets/images/editorial/ assets/data/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "content: refresh free editorial visuals and social previews"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
