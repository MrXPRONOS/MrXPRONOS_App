name: Editorial Free Studio

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/editorial-free.yml'
      - 'scripts/content_studio.py'
      - 'scripts/editorial_*.py'
      - 'fetch_foot_news.py'
  schedule:
    - cron: '41 5 * * *'

permissions:
  contents: write

concurrency:
  group: editorial-free-studio
  cancel-in-progress: true

jobs:
  editorial:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install free local renderer
        run: python -m pip install Pillow
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -p 'test_editorial_free.py'
      - name: Build branded media (3 aspect ratios)
        run: python scripts/content_studio.py --limit 12 --news-limit 20
      - name: Build shareable OG pages
        run: python scripts/editorial_pages.py
      - name: Refresh sitemap for shareable pages
        run: python generate_sitemap.py
      - name: Build review-only social queue and metrics
        run: |
          python scripts/editorial_queue.py
          python scripts/editorial_metrics.py
      - name: Check quality
        run: python scripts/editorial_quality.py --strict
      - name: Validate JSON formats
        run: |
          python -m json.tool articles.json > /dev/null
          python -m json.tool conseils.json > /dev/null
          python -m json.tool footnews.json > /dev/null
      - name: Publish regenerated content without Git rebase conflicts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            # Fresh checkout of the latest production state; never force-push.
            git fetch origin main
            git reset --hard origin/main
            python scripts/content_studio.py --limit 12 --news-limit 20
            python scripts/editorial_pages.py
            python generate_sitemap.py
            python scripts/editorial_queue.py
            python scripts/editorial_metrics.py
            python scripts/editorial_quality.py --strict
            git add articles.json conseils.json footnews.json sitemap.xml sitemap.txt articles/ conseils/ assets/images/editorial/ assets/data/
            if git diff --cached --quiet; then
              echo "Contenu déjà à jour."
              exit 0
            fi
            git commit -m "content: refresh free editorial visuals and social previews"
            if git push origin HEAD:main; then
              echo "Publication terminée."
              exit 0
            fi
            echo "Mise à jour concurrente détectée, nouvelle tentative $attempt/3"
          done
          echo "Échec de publication après trois tentatives (aucun push forcé)."
          exit 1
