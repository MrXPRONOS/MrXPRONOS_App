name: Diagnostic ponctuel NVIDIA NIM (secret GitHub)

on:
  push:
    paths:
      - '.github/workflows/nim-connectivity-one-shot-20261114.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Tester réellement la clé et le modèle Nemotron (sans publier de secrets)
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, json, sys, urllib.request, urllib.error
          key = os.getenv("NVIDIA_API_KEY", "").strip()
          if not key:
              print("NVIDIA_NIM_PROBE: MISSING_NVIDIA_API_KEY")
              sys.exit(2)
          payload = {
              "model": "nvidia/nemotron-3-ultra-550b-a55b",
              "messages": [{"role":"user", "content":"Reply with exactly one short French word: BONJOUR."}],
              "temperature": 1,
              "top_p": 0.95,
              "max_tokens": 128,
              "stream": False,
              "chat_template_kwargs": {"enable_thinking": False}
          }
          req=urllib.request.Request(
              "https://integrate.api.nvidia.com/v1/chat/completions",
              data=json.dumps(payload).encode("utf-8"),
              method="POST",
              headers={
                  "Authorization": "Bearer " + key,
                  "Content-Type": "application/json",
                  "Accept": "application/json"
              }
          )
          try:
              with urllib.request.urlopen(req, timeout=75) as response:
                  obj=json.loads(response.read(262144).decode("utf-8"))
                  message=obj["choices"][0]["message"]["content"]
                  if not isinstance(message, str) or not message.strip():
                      raise ValueError("Empty generated message")
                  print("NVIDIA_NIM_PROBE: HTTP_SUCCESS NONEMPTY_TEXT, model=" + str(obj.get("model") or "unknown")[:100])
          except urllib.error.HTTPError as e:
              print("NVIDIA_NIM_PROBE: HTTP_" + str(e.code) + " (response body hidden)")
              sys.exit(1)
          except Exception as e:
              print("NVIDIA_NIM_PROBE: ERROR_" + type(e).__name__)
              sys.exit(1)
          PY
