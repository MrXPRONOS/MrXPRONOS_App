name: Formation - Réparer l'accès du bot au canal privé unique
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/formation-repair-shared-source.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mrx-telegram-personal-account
  cancel-in-progress: false
  queue: max
jobs:
  repair-source:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TG_API_ID: ${{ secrets.TG_API_ID }}
      TG_API_HASH: ${{ secrets.TG_API_HASH }}
      TG_STRING_SESSION: ${{ secrets.TG_SESSION_STRING || secrets.TG_STRING_SESSION || secrets.TG_STREAM_SESSION }}
      TG_PERSONAL_COOLDOWN_UNTIL_UTC: ${{ vars.TG_PERSONAL_COOLDOWN_UNTIL_UTC }}
      FORMATION_STAGE_CHAT: ${{ secrets.FORMATION_STAGE_CHAT }}
      FORMATION_BOT_TOKEN: ${{ secrets.FORMATION_BOT_TOKEN || secrets.FOOTBALL_NEWS_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
      CINE_RADAR_BOT_TOKEN: ${{ secrets.CINE_RADAR_BOT_TOKEN || secrets.CINEX_RADAR_BOT_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: '9c86118191b804d91b5f5b2c89114999'
      CINERADAR_D1_DATABASE_ID: 'fa8b5009-bc1a-4a6e-b143-7a487c7297a5'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Vérifier la syntaxe et respecter la limitation Telegram
        run: |
          python -m py_compile telegram-film-relay/scripts/repair_shared_formation_bot_access.py
          python telegram-film-relay/scripts/check_personal_cooldown.py
      - name: Installer les clients épinglés Telegram
        run: python -m pip install --disable-pip-version-check 'telethon==1.45.0' 'requests==2.32.5'
      - name: Tester les droits sans accéder au compte Telegram
        run: |
          cd telegram-film-relay
          python -m unittest discover -s tests -p 'test_repair_shared_formation_bot_access.py' -v
      - name: Vérifier l'identité de la réserve et réparer UNIQUEMENT les droits bots manquants
        run: |
          cd telegram-film-relay
          python -m scripts.repair_shared_formation_bot_access
