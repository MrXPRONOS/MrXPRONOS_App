name: LIVE history headroom - Neon audit (old backfill retired)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-headroom-backfill.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Inspect historical LIVE calibration gaps without changing pronostics
        run: |
          python - <<'PY'
          import os,psycopg
          dsn=os.getenv("NEON_DATABASE_URL","").strip()
          if not dsn:raise SystemExit("NEON_DATABASE_URL GitHub secret missing")
          with psycopg.connect(dsn,connect_timeout=12) as db:
              with db.cursor() as cur:
                  cur.execute("SELECT current_database()")
                  if cur.fetchone()[0]!="mrxpronos":raise SystemExit("Wrong Neon database")
                  cur.execute("""SELECT count(*),
                    count(*) FILTER(WHERE final_value IS NULL OR headroom IS NULL)
                    FROM public.live_predictions
                    WHERE validated=true AND created_at>now()-interval '90 days'""")
                  total,missing=cur.fetchone()
                  print("NEON_HISTORICAL_VALIDATED",total,"NEEDING_CALIBRATION_REVIEW",missing)
                  if missing:print("::warning::Historical LIVE headroom needs engine-faithful Neon backfill; no values were fabricated or overwritten.")
          PY
