name: Live Headroom Backfill

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-headroom-backfill.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Backfill historical final values
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            echo "=== Historical backfill batch $i/30 ==="
            body=$(curl --fail-with-body --silent --show-error --max-time 45 \
              -X POST "$SUPABASE_URL/functions/v1/live/validate" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
              -H "x-cron-secret: $CRON_SECRET" \
              -H "Content-Type: application/json")
            echo "$body"
            sleep 3
          done

# retry_after_backlog_fix

# retry_after_espn_fallback
