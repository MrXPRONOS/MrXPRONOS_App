name: Actu Foot - Apercu textes Telegram
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/actu-foot-copy-samples-once.yml'

permissions:
  contents: read

concurrency:
  group: actu-foot-copy-samples-once
  cancel-in-progress: true

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BOT_TOKEN: ${{ secrets.FOOTBALL_NEWS_BOT_TOKEN }}
      CHAT_ID: ${{ secrets.FOOTBALL_NEWS_CHAT_ID }}
    steps:
      - name: Envoyer les apercus de texte au canal Actu Foot
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BOT_TOKEN"
          test -n "$CHAT_ID"
          python - <<'PY'
          import os, time, requests
          token=os.environ["BOT_TOKEN"]
          chat=os.environ["CHAT_ID"]
          url=f"https://api.telegram.org/bot{token}/sendMessage"
          samples=[
            "🧪 <b>TEST FORMAT — BUT</b>\n\n🌟 <b>BUUUT - BARCOLA 24’</b>\n\n<b>LASK 0-2 LIVERPOOL</b>",
            "🧪 <b>TEST FORMAT — CARTON</b>\n\n🟥 <b>CARTON ROUGE - VINICIUS 72’</b>\n\n<b>REAL MADRID 2-1 ROMA</b>",
            "🧪 <b>TEST FORMAT — REMPLACEMENT</b>\n\n🔄 <b>REMPLACEMENT 68’</b>\n\n<b>🟢 BARCOLA • 🔴 SALAH</b>\n\n<b>LIVERPOOL 2-0 ROMA</b>",
            "🧪 <b>TEST FORMAT — MI-TEMPS</b>\n\n⏸️ <b>MI-TEMPS</b>\n\n<b>REAL MADRID 1-0 ROMA</b>",
            "🧪 <b>TEST FORMAT — TIRS AU BUT</b>\n\n❌ <b>TIR AU BUT MANQUÉ - JOUEUR EXEMPLE</b>\n\n<b>TAB 4-3</b>\n\n<b>ARSENAL 1-1 CHELSEA</b>",
            "🧪 <b>TEST FORMAT — INFO FOOT</b>\n\n<b>🚨 UN CLUB ANNONCE UNE DÉCISION IMPORTANTE !</b>\n\nLe message va droit à l’essentiel, sans footer technique, sans bouton ESPN et sans texte inutile.\n\n<i>(Foot Mercato)</i>",
          ]
          for text in samples:
            r=requests.post(url,data={
              "chat_id":chat,
              "text":text,
              "parse_mode":"HTML",
              "disable_web_page_preview":"true",
            },timeout=30)
            r.raise_for_status()
            payload=r.json()
            if not payload.get("ok"):
              raise SystemExit(payload)
            time.sleep(0.6)
          print("ACTU_FOOT_COPY_SAMPLES_SENT",len(samples))
          PY
