name: CineX Séries — synchroniser affiches et publier avec les bots
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publier uniquement les séries intégralement vérifiées (nécessite aussi CINEX_SERIES_PUBLISH_ENABLED=true)'
        required: false
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: cinex-series-bot-only-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CINEX_SERIES_CHANNEL_IDS: ${{ vars.CINEX_SERIES_CHANNEL_IDS }}
      CINEX_SERIES_SEASON_COUNTS: ${{ vars.CINEX_SERIES_SEASON_COUNTS }}
      CINEX_SERIES_FOLDER_URL: ${{ vars.CINEX_SERIES_FOLDER_URL }}
      CINEX_SERIES_RESCUE_INVITE_URL: ${{ secrets.CINEX_SERIES_RESCUE_INVITE_URL }}
      CINEX_SERIES_RIGHTS_ATTESTED: ${{ vars.CINEX_SERIES_RIGHTS_ATTESTED || 'false' }}
      CINEX_SERIES_PUBLISH_ENABLED: ${{ inputs.publish && vars.CINEX_SERIES_PUBLISH_ENABLED == 'true' && 'true' || 'false' }}
      CINEX_PUBLISH_BOT_TOKEN: ${{ secrets.FOOTBALL_NEWS_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
      CINEX_RADAR_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: '9c86118191b804d91b5f5b2c89114999'
      CINERADAR_D1_DATABASE_ID: 'fa8b5009-bc1a-4a6e-b143-7a487c7297a5'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer le client HTTP (aucune bibliothèque de session utilisateur)
        run: python -m pip install requests==2.32.5
      - name: Tester les mécanismes bot-only hors connexion
        run: |
          python -m py_compile cinecanaux/scripts/audit_series_bots.py cinecanaux/scripts/publish_individual_series_bot.py
          python -m unittest discover -s cinecanaux/tests -p 'test_series_bot_inventory.py' -v
          python -m unittest discover -s cinecanaux/tests -p 'test_individual_series_publish.py' -v
      - name: Synchroniser les canaux et la dernière affiche épinglée accessible
        run: python cinecanaux/scripts/publish_individual_series_bot.py
      - name: Rapport de synchronisation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cinex-series-sync-report
          path: cinex-series-sync-report.json
          if-no-files-found: warn
          retention-days: 7
