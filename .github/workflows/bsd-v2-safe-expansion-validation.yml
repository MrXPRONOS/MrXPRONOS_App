name: BSD V2 - Safe Market Expansion Tests
on:
  push:
    branches:
      - feature/bsd-v2-safe-fallback-new-markets-20261103
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install requests cryptography pillow
      - run: python -m compileall -q bsd
      - run: python -m unittest discover -s bsd -p 'test_*.py' -v
      - run: node --check assets/js/main.js
      - run: node --test tests/pronos-category-selection.test.cjs
      - name: Restore private historical training data
        env:
          BSD_HISTORY_KEY: ${{ secrets.BSD_HISTORY_KEY }}
        run: python bsd/bsd_archive.py restore
      - name: Check market approval from pre-2026 data
        run: python bsd/bsd_v2_safe_expansion_check.py
      - name: Clean history
        if: always()
        run: rm -f bsd/all_matches_bsd.json bsd/backfill_state.json
