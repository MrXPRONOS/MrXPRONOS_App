name: Supabase LIVE — compatibilité neon-live-legacy-production-smoke.yml (Neon retiré)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/neon-live-legacy-production-smoke.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify read-only Supabase LIVE endpoints
        run: python -m scripts.supabase_live_cycle --mode probe
