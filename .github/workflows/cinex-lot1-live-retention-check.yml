name: CineX Lot 1 - verification finale de retention 24h

on:
  workflow_dispatch:
    inputs:
      apply:
        type: boolean
        default: false
        required: false
        description: 'Executer une passe de suppression bornée, sinon simulation'
  push:
    branches: [main]
    paths:
      - '.github/workflows/cinex-lot1-live-retention-check.yml'

permissions:
  contents: read

concurrency:
  group: mrx-telegram-personal-account
  cancel-in-progress: false
  queue: max

jobs:
  verify:
    name: Contrôler droits et nettoyage des vidéos V4 expirées
    runs-on: ubuntu-latest
    timeout-minutes: 55
    defaults:
      run:
        working-directory: telegram-film-relay
    env:
      PYTHONPATH: .
      TG_API_ID: ${{ secrets.TG_API_ID }}
      TG_API_HASH: ${{ secrets.TG_API_HASH }}
      TG_STRING_SESSION: ${{ secrets.TG_SESSION_STRING || secrets.TG_STRING_SESSION || secrets.TG_STREAM_SESSION }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TG_PRIVATE_CHANNEL: ${{ vars.TG_PRIVATE_CHANNEL }}
      SERIES_PUBLIC_CHANNEL: ${{ vars.SERIES_PUBLIC_CHANNEL || '@seriesvf_cinex' }}
      SERIES_PRIVATE_CHANNEL: ${{ vars.SERIES_PRIVATE_CHANNEL }}
      DESIR_PUBLIC_CHANNEL: ${{ vars.DESIR_PUBLIC_CHANNEL || '@CineXDesirfr' }}
      DESIR_PRIVATE_CHANNEL: ${{ vars.DESIR_PRIVATE_CHANNEL }}
      COMEDIE_PUBLIC_CHANNEL: ${{ vars.COMEDIE_PUBLIC_CHANNEL || '@CineXComediefr' }}
      COMEDIE_PRIVATE_CHANNEL: ${{ vars.COMEDIE_PRIVATE_CHANNEL }}
      ANIME_PUBLIC_CHANNEL: ${{ vars.ANIME_PUBLIC_CHANNEL || '@CineXAnimeFR' }}
      ANIME_PRIVATE_CHANNEL: ${{ vars.ANIME_PRIVATE_CHANNEL }}
      ACTION_PUBLIC_CHANNEL: ${{ vars.ACTION_PUBLIC_CHANNEL || '@filmsaction2026vf' }}
      ACTION_PRIVATE_CHANNEL: ${{ vars.ACTION_PRIVATE_CHANNEL }}
      CINEX_ARCHIVE_ENABLED: ${{ vars.CINEX_ARCHIVE_ENABLED }}
      CINEX_ARCHIVE_DELETE_APPROVED: ${{ vars.CINEX_ARCHIVE_DELETE_APPROVED }}
      CINEX_RIGHTS_VERIFIED: ${{ vars.CINEX_RIGHTS_VERIFIED }}
      CINEX_PUBLIC_RETENTION_24H_ENABLED: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.apply) && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - name: Respecter le cooldown du compte Telegram
        env:
          TG_PERSONAL_COOLDOWN_UNTIL_UTC: ${{ vars.TG_PERSONAL_COOLDOWN_UNTIL_UTC }}
        run: python3 "$GITHUB_WORKSPACE/telegram-film-relay/scripts/check_personal_cooldown.py"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: telegram-film-relay/requirements.txt
      - name: Installer les dépendances
        run: python -m pip install -r requirements.txt
      - name: Valider syntaxe et tests sans Telegram
        run: |
          python -m compileall -q film_relay
          python -m unittest discover -s tests -p 'test_public_video_retention.py' -v
          python -m unittest discover -s tests -p 'test_ten_video_rotation.py' -v
      - name: Scanner sans suppression
        run: python -m film_relay.public_video_retention --max-deleted 1 --history 4000
      - name: Confirmer les droits puis appliquer le TTL sur au plus une vidéo expirée par canal
        if: ${{ env.CINEX_PUBLIC_RETENTION_24H_ENABLED == 'true' }}
        run: |
          test "$CINEX_ARCHIVE_ENABLED" = 'true'
          test "$CINEX_ARCHIVE_DELETE_APPROVED" = 'true'
          test "$CINEX_RIGHTS_VERIFIED" = 'true'
          python -m film_relay.public_video_retention --apply --max-deleted 1 --history 4000
