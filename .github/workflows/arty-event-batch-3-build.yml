name: Arty Football - Build event template batch 3

on:
  push:
    branches:
      - arty-templates-batch-3-20261013
    paths:
      - '.github/workflows/arty-event-batch-3-build.yml'
      - 'scripts/build_event_batch_3_assets.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet Pillow
      - name: Build five native 1122x1402 templates
        run: python scripts/build_event_batch_3_assets.py
      - name: Validate assets
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          root=Path("assets/images/arty_football/events")
          names=[
            "intervention_medicale.png",
            "blessure_confirmee.png",
            "retour_au_jeu.png",
            "match_suspendu.png",
            "match_interrompu_full.png",
          ]
          for name in names:
              path=root/name
              assert path.is_file(), path
              with Image.open(path) as im:
                  im.verify()
              with Image.open(path) as im:
                  assert im.size==(1122,1402),(name,im.size)
                  assert im.mode in {"RGB","RGBA"},(name,im.mode)
              print("BATCH3_ASSET_OK",name,path.stat().st_size)
          PY
      - name: Commit generated assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/images/arty_football/events/intervention_medicale.png
          git add assets/images/arty_football/events/blessure_confirmee.png
          git add assets/images/arty_football/events/retour_au_jeu.png
          git add assets/images/arty_football/events/match_suspendu.png
          git add assets/images/arty_football/events/match_interrompu_full.png
          if git diff --cached --quiet; then
            echo 'BATCH3_ASSETS_UNCHANGED'
            exit 0
          fi
          git commit -m 'assets(arty): add audited event template batch 3'
          git push origin HEAD:${GITHUB_REF_NAME}
