name: Actu Foot - audit bots et installation admin controlee
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/actufoot_admin_bot_setup.py'
      - 'tests/test_actufoot_admin_bot_setup.py'
      - '.github/workflows/actufoot-bots-admin-setup.yml'
  workflow_dispatch:
    inputs:
      apply:
        description: "Installer les bots validés (false = audit lecture seule)"
        type: boolean
        required: true
        default: false
  push:
    branches: [main]
    paths:
      - 'scripts/actufoot_admin_bot_setup.py'
      - '.github/workflows/actufoot-bots-admin-setup.yml'
      - '.github/actufoot-admin-apply-once-20261122.txt'
permissions:
  contents: read
concurrency:
  group: mrx-telegram-personal-account
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tester le script hors connexion
        run: |
          python -m py_compile scripts/actufoot_admin_bot_setup.py
          python -m pip install -r telegram-film-relay/requirements.txt
          python -m unittest discover -s tests -p 'test_actufoot_admin_bot_setup.py' -v
      - name: Prévenir les sessions Telegram simultanées et les FloodWait
        if: github.event_name != 'pull_request'
        env:
          TG_PERSONAL_COOLDOWN_UNTIL_UTC: ${{ vars.TG_PERSONAL_COOLDOWN_UNTIL_UTC }}
        run: python telegram-film-relay/scripts/check_personal_cooldown.py
      - name: Vérifier les dix canaux du dossier et tous les bots, sans afficher les secrets
        if: github.event_name != 'pull_request'
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION_STRING || secrets.TG_STRING_SESSION || secrets.TG_STREAM_SESSION }}
          TELEGRAM_REACTION_BOTS_JSON: ${{ secrets.TELEGRAM_REACTION_BOTS_JSON }}
          ACTION_BOT_TOKEN: ${{ secrets.ACTION_BOT_TOKEN }}
          ANIME_BOT_TOKEN: ${{ secrets.ANIME_BOT_TOKEN }}
          CANAL_BOT_TOKEN: ${{ secrets.CANAL_BOT_TOKEN }}
          CINEX_BOT_TOKEN: ${{ secrets.CINEX_BOT_TOKEN }}
          CINEX_PUBLISH_BOT_TOKEN: ${{ secrets.CINEX_PUBLISH_BOT_TOKEN }}
          CINEX_RADAR_BOT_TOKEN: ${{ secrets.CINEX_RADAR_BOT_TOKEN }}
          CINE_RADAR_BOT_TOKEN: ${{ secrets.CINE_RADAR_BOT_TOKEN }}
          COMEDIE_BOT_TOKEN: ${{ secrets.COMEDIE_BOT_TOKEN }}
          DESIR_BOT_TOKEN: ${{ secrets.DESIR_BOT_TOKEN }}
          EDITORIAL_TELEGRAM_BOT_TOKEN: ${{ secrets.EDITORIAL_TELEGRAM_BOT_TOKEN }}
          FOOTBALL_NEWS_BOT_TOKEN: ${{ secrets.FOOTBALL_NEWS_BOT_TOKEN }}
          MRXPRONOS_CANAL_BOT_TOKEN: ${{ secrets.MRXPRONOS_CANAL_BOT_TOKEN }}
