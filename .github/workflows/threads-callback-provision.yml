name: Threads callback secret provision
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/threads-callback-provision.yml']
permissions:
  contents: read
jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - uses: supabase/setup-cli@v3
        with:
          version: '2.84.2'
      - name: Verify required GitHub secrets
        shell: bash
        env:
          THREADS_APP_SECRET: ${{ secrets.THREADS_APP_SECRET }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$THREADS_APP_SECRET" ]; then
            echo "::error::THREADS_APP_SECRET missing in GitHub Actions Secrets. Add the Threads App Secret (not Facebook App Secret)."
            exit 1
          fi
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN missing; cannot configure deployed edge functions."
            exit 1
          fi
      - name: Configure and verify callback signature secret in Supabase
        shell: bash
        env:
          THREADS_APP_SECRET: ${{ secrets.THREADS_APP_SECRET }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          printf '::add-mask::%s\n' "$THREADS_APP_SECRET"
          supabase secrets set --project-ref nhwafcpndlufzzxexikh "THREADS_APP_SECRET=$THREADS_APP_SECRET" >/dev/null
          echo "✅ THREADS_APP_SECRET synced to Supabase (value hidden)"
