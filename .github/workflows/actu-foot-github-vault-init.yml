name: Actu Foot - Initialize encrypted GitHub vault
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/actu-foot-github-vault-init.yml'
permissions:
  contents: write
concurrency:
  group: actu-foot-github-vault-maintenance
  cancel-in-progress: false
jobs:
  initialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ML_V2_HISTORY_KEY_B64: ${{ secrets.ML_V2_HISTORY_KEY_B64 }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install AES encryption library
        run: python -m pip install 'cryptography>=43,<47' requests
      - name: Verify key and initialize vault only if absent
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from scripts.actu_foot_github_vault import GitHubVault
          store = GitHubVault()
          snapshot = store.read(allow_new=True)
          if snapshot.sha is None:
              result = store.change(lambda data: {**data, "created_by": "github-actions"}, message="ops(actu-foot): create encrypted GitHub vault", allow_new=True)
              print("GITHUB_VAULT_CREATED", bool(result.sha))
          else:
              print("GITHUB_VAULT_EXISTS", bool(snapshot.sha), "content not shown")
          PY
