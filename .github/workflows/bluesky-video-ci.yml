name: Bluesky Video Processing Regression

on:
  pull_request:
    paths:
      - "scripts/bluesky_video_processed.py"
      - "scripts/post_shorts_video.py"
      - "scripts/share_latest_video_bluesky.py"
      - "tests/test_bluesky_video_processed.py"
      - ".github/workflows/bluesky-video-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Bluesky SDK and request dependencies
        run: python -m pip install "atproto>=0.0.60,<1" "requests>=2.31.0"
      - name: Check syntax
        run: |
          python -m py_compile scripts/bluesky_video_processed.py scripts/post_shorts_video.py scripts/share_latest_video_bluesky.py tests/test_bluesky_video_processed.py
      - name: Validate processing flow without uploads or posts
        run: python -m unittest discover -s tests -p 'test_bluesky_video_processed.py' -v
