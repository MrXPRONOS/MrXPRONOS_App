name: ML V3 - STRICT 2024-2025 fitted 2026 Jan-Oct24 eight-model annual TopK study
# Explicitly requested 2026 holdout, coefficients frozen before first Jan 2026 fixture.
# One-shot path-specific push trigger, no schedule or production changes.
on:
  push:
    branches: [research/single-ml-v2-20261024]
    paths: ['.github/workflows/research-ml-v3-2026-frozen-2024-25-launch.yml']
permissions:
  contents: read
concurrency:
  group: research-v3-full-2026-until-certified-2026-10-24
  cancel-in-progress: false
jobs:
  frozen-2026-month:
    name: train ONLY pre-2026; evaluate ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {label: jan2026, start: '2026-01-01', end: '2026-01-31'}
          - {label: feb2026, start: '2026-02-01', end: '2026-02-28'}
          - {label: mar2026, start: '2026-03-01', end: '2026-03-31'}
          - {label: apr2026, start: '2026-04-01', end: '2026-04-30'}
          - {label: may2026, start: '2026-05-01', end: '2026-05-31'}
          - {label: jun2026, start: '2026-06-01', end: '2026-06-30'}
          - {label: jul2026, start: '2026-07-01', end: '2026-07-31'}
          - {label: aug2026, start: '2026-08-01', end: '2026-08-31'}
          - {label: sep2026, start: '2026-09-01', end: '2026-09-30'}
          - {label: oct2026partial, start: '2026-10-01', end: '2026-10-24'}
    env:
      ML_V2_HISTORY_KEY_B64: ${{ secrets.ML_V2_HISTORY_KEY_B64 }}
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install identical V2/V3 model environment
        run: python -m pip install numpy scipy scikit-learn requests cryptography lightgbm==4.6.0 catboost==1.2.8
      - name: Guard annual strict training freeze and pre-set ten windows
        run: |
          set -euo pipefail
          PYTHONPATH=.:research python -m unittest research.test_ml_v3_topk_2026_frozen -v
      - name: Authenticated history 2024-2026; fit ONLY on 2024 and 2025; predict 2026
        run: |
          set -euo pipefail
          PYTHONPATH=.:research python research/single_ml_v2_multisource.py \
            --start "${{ matrix.start }}" --end "${{ matrix.end }}" \
            --max-eval 0 --experimental-v3 --frozen-fit-through-2025 \
            --out "/tmp/mrx-frozen-2026-${{ matrix.label }}" \
            > "/tmp/mrx-frozen-2026-${{ matrix.label }}-train.log" 2>&1 || {
              tail -90 "/tmp/mrx-frozen-2026-${{ matrix.label }}-train.log"
              exit 1
            }
          grep 'MULTISOURCE_ML_V2_COMPATIBILITY\|RETRAIN_V3\|RETRAIN \|PROGRESS' "/tmp/mrx-frozen-2026-${{ matrix.label }}-train.log" | tail -10
          PYTHONPATH=.:research python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/mrx-frozen-2026-${{ matrix.label }}/summary.json')
          summary=json.loads(p.read_text(encoding='utf8'))
          assert summary['frozen_pre2026_fit'] is True
          assert summary['frozen_fit_cutoff']=='2025-12-31'
          assert summary['no_2026_labels_for_coefficients'] is True
          assert summary['frozen_fit_latest_utc_date']<='2025-12-31'
          assert summary['frozen_fit_sample_count']>=170000
          assert summary['v3_calibration_audit']==[]
          assert len(summary['hybrid_calibration_history'])==1
          assert summary['selection_refits']==[]
          assert summary['n_evaluation_matches']>=20
          print('FROZEN_FIT_2024_2025_SECURITY_CHECK_OK',summary['frozen_fit_sample_count'],summary['n_evaluation_matches'])
          PY
          test "$(grep -c '^RETRAIN_V3 ' "/tmp/mrx-frozen-2026-${{ matrix.label }}-train.log")" -eq 1
      - name: Grade all eight systems on same daily Top5, Top10, Top20
        run: |
          set -euo pipefail
          PYTHONPATH=.:research python research/ml_v3_topk_2026_frozen.py month \
            --predictions "/tmp/mrx-frozen-2026-${{ matrix.label }}/all_predictions.csv" \
            --start "${{ matrix.start }}" --end "${{ matrix.end }}" \
            --out "/tmp/mrx-frozen-2026-${{ matrix.label }}/daily_aggregate.json"
      - name: Upload aggregated daily test results ONLY (no match IDs or decrypted source)
        uses: actions/upload-artifact@v4
        with:
          name: frozen-2026-${{ matrix.label }}
          path: /tmp/mrx-frozen-2026-${{ matrix.label }}/daily_aggregate.json
          if-no-files-found: error
          retention-days: 30

  annual-jan-oct24-results:
    name: full eligible 2026 comparative rankings and uncertainty
    needs: [frozen-2026-month]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy scipy scikit-learn
      - name: Recheck preregistered 297-day 2026 aggregation logic
        run: PYTHONPATH=.:research python -m unittest research.test_ml_v3_topk_2026_frozen -v
      - uses: actions/download-artifact@v4
        with:
          pattern: frozen-2026-*
          path: /tmp/frozen-2026-reports
      - name: Aggregate all TEN months (Jan-Oct 24) and bootstrap 4000 paired UTC days
        run: |
          set -euo pipefail
          PYTHONPATH=.:research python research/ml_v3_topk_2026_frozen.py pool \
            --inputs /tmp/frozen-2026-reports/frozen-2026-*/daily_aggregate.json \
            --out /tmp/mrx-frozen-2024-25-full-2026-jan-oct24.json --resamples 4000
      - uses: actions/upload-artifact@v4
        with:
          name: frozen-2024-25-full-2026-jan-oct24-final-results
          path: /tmp/mrx-frozen-2024-25-full-2026-jan-oct24.json
          if-no-files-found: error
          retention-days: 30
