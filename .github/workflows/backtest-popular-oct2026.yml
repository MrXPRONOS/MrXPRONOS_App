name: Backtest October 2026 - top popular exact scores (no publishing)

on:
  pull_request:
    paths:
      - '.github/workflows/backtest-popular-oct2026.yml'
      - 'dixon-coles/dcscore/backtest_popular.py'
      - 'dixon-coles/tests/test_backtest_popular.py'

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout backtest changes
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent exact-score model
        run: python -m pip install -e 'dixon-coles[test]'
      - name: Verify historical isolation, importance ranking, and metrics
        run: python -m pytest -q dixon-coles/tests/test_backtest_popular.py
      - name: Backtest October 1-31 with production social ESPN provider
        shell: bash
        run: |
          python -m dcscore.backtest_popular \
            --start 2026-10-01 --end 2026-10-31 \
            --out results/backtests/oct2026
      - name: Preserve actual match-by-match results and audit notes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-scores-popularity-backtest-oct-2026
          path: |
            results/backtests/oct2026/backtest_oct2026.json
            results/backtests/oct2026/backtest_oct2026_matches.csv
          if-no-files-found: warn
          retention-days: 90
