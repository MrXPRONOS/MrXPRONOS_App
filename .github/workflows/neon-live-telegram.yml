name: Supabase LIVE — ancien expéditeur Telegram désactivé
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        required: false
        default: probe
        options: [probe, test, live]
  push:
    branches: [main]
    paths: ['.github/workflows/neon-live-telegram.yml']
permissions:
  contents: read
jobs:
  read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - run: echo 'NEON_TELEGRAM_SENDER_RETIRED; only Supabase handles new real signals'
      - run: python -m scripts.supabase_live_cycle --mode probe
