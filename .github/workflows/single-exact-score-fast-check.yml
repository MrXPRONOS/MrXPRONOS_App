name: Single exact score - fast isolated checks

on:
  push:
    branches: [feature/single-exact-score-v1-20261020]
    paths:
      - 'bsd/single_exact_score_*.py'
      - 'bsd/test_single_exact_score.py'
      - '.github/workflows/single-exact-score-fast-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mrx-single-score-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install minimal test dependencies
        run: python -m pip install requests cryptography
      - name: Compile advanced research modules
        run: python -m py_compile bsd/single_exact_score_advanced.py bsd/single_exact_score_context.py bsd/single_exact_score_research.py bsd/single_exact_score_engine.py bsd/single_exact_score_backtest.py bsd/single_exact_score_prospective.py
      - name: Run single-score unit tests
        run: python -m unittest bsd/test_single_exact_score.py -v
