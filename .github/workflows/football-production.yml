name: Mr XPRONOS - Production Telegram football
run-name: "Actu Foot (${{ inputs.trigger_source || github.event_name }})"

on:
  # Toute modification critique valide le workflow en dry-run.
  push:
    branches: [main]
    paths:
      - 'scripts/football_channel.py'
      - 'scripts/football_news_engine.py'
      - 'scripts/football_match_lifecycle.py'
      - 'scripts/football_stats_engine.py'
      - 'scripts/football_community_engine.py'
      - 'fetch_foot_news.py'
      - 'scripts/template_cards.py'
      - '.github/workflows/football-production.yml'
  workflow_dispatch:
    inputs:
      trigger_source:
        description: "Origine du déclenchement"
        required: false
        default: "manual"
        type: string
      dry_run:
        description: "Simulation seulement (aucun envoi Telegram)"
        required: true
        type: boolean
        default: false
      destination:
        description: "Destination d'un lancement manuel"
        required: true
        type: choice
        default: "test"
        options:
          - "test"
          - "dry-run"
          - "production"
      force:
        description: "Ignorer exceptionnellement les fenêtres/quotas/historique"
        required: true
        type: boolean
        default: false
      mode:
        description: "Mode de diffusion"
        required: true
        type: choice
        default: "full"
        options:
          - "full"
          - "lifecycle"

permissions:
  contents: write
  actions: write

concurrency:
  group: mrxpronos-football-production
  cancel-in-progress: false

jobs:
  publish:
    name: Diffusion editoriale
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
      FOOTBALL_NEWS_BOT_TOKEN: ${{ secrets.FOOTBALL_NEWS_BOT_TOKEN }}
      PROD_FOOTBALL_NEWS_CHAT_ID: ${{ secrets.FOOTBALL_NEWS_CHAT_ID }}
      TELEGRAM_TEST_CHAT_ID: ${{ secrets.TELEGRAM_TEST_CHAT_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      FOOTBALL_RSS_FEED: https://www.footmercato.net/flux-rss
      FOOTBALL_BSD_REQUEST_BUDGET: '18'
      FOOTBALL_REQUIRE_COMMENTS: '1'
      PYTHONUNBUFFERED: '1'
      RUN_MODE: ${{ inputs.mode || 'full' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dependances
        shell: bash
        run: |
          if [ "$RUN_MODE" = "lifecycle" ]; then
            python -m pip install --disable-pip-version-check requests
          else
            python -m pip install --disable-pip-version-check requests Pillow feedparser
          fi

      - name: Router canal Telegram production ou test
        id: telegram_route
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER_SOURCE: ${{ inputs.trigger_source || '' }}
          ROUTED_DESTINATION: ${{ steps.telegram_route.outputs.destination }}
          MANUAL_DESTINATION: ${{ inputs.destination || 'test' }}
        run: |
          set -euo pipefail
          DESTINATION="$MANUAL_DESTINATION"

          # Les vrais schedulers conservent toujours le canal de production.
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && { [ "$TRIGGER_SOURCE" = "cron-job.org" ] || [ "$TRIGGER_SOURCE" = "cron-job.org-lifecycle" ]; }; then
            DESTINATION="production"
          elif [ "$EVENT_NAME" = "push" ]; then
            DESTINATION="dry-run"
          fi

          case "$DESTINATION" in
            production)
              test -n "$PROD_FOOTBALL_NEWS_CHAT_ID"
              echo "FOOTBALL_NEWS_CHAT_ID=$PROD_FOOTBALL_NEWS_CHAT_ID" >> "$GITHUB_ENV"
              STATE_PATH=".state/mrxpronos-football.json"
              ;;
            test)
              if [ -z "$TELEGRAM_TEST_CHAT_ID" ]; then
                echo "::error::TELEGRAM_TEST_CHAT_ID manquant. Le test n'est jamais redirigé vers le canal de production."
                exit 1
              fi
              echo "FOOTBALL_NEWS_CHAT_ID=$TELEGRAM_TEST_CHAT_ID" >> "$GITHUB_ENV"
              STATE_PATH=".state/mrxpronos-football-test.json"
              ;;
            dry-run)
              # Aucun envoi : utiliser un état isolé pour éviter de toucher à la production.
              STATE_PATH=".state/mrxpronos-football-dry-run.json"
              ;;
            *)
              echo "::error::Destination Telegram inconnue: $DESTINATION"
              exit 1
              ;;
          esac

          echo "destination=$DESTINATION" >> "$GITHUB_OUTPUT"
          echo "state_path=$STATE_PATH" >> "$GITHUB_OUTPUT"
          echo "FOOTBALL_NEWS_STATE=$STATE_PATH" >> "$GITHUB_ENV"
          echo "TELEGRAM_ROUTE destination=$DESTINATION state=$STATE_PATH"

      - name: Verifier les secrets de production
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.telegram_route.outputs.destination }}" != "dry-run" ]; then
            test -n "$FOOTBALL_NEWS_BOT_TOKEN"
            test -n "$FOOTBALL_NEWS_CHAT_ID"
          fi
          if [ "$RUN_MODE" != "lifecycle" ]; then
            test -n "$BSD_API_KEY"
          fi
          echo "PRODUCTION_SECRETS_OK mode=$RUN_MODE"

      - name: Verifier les six templates
        if: ${{ (inputs.mode || 'full') != 'lifecycle' }}
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          required = [
              "template_programme_matchs_du_jour.png",
              "template_avant_match.png",
              "template_resultat_final.png",
              "template_stat_du_jour.png",
              "template_flash_foot.png",
              "template_sondage.png",
          ]
          for name in required:
              path = Path("assets/images") / name
              assert path.is_file(), path
              with Image.open(path) as image:
                  w, h = image.size
                  assert w == h and w >= 900, (path, image.size)
          print("PRODUCTION_TEMPLATES_OK")
          PY

      - name: Actualiser le moteur News Football commun au site et à Telegram
        if: ${{ (inputs.mode || 'full') != 'lifecycle' }}
        env:
          MAX_ARTICLES: '60'
          MAX_ARTICLES_PER_FEED: '16'
          MAX_NEWS_AGE_HOURS: '120'
        run: python fetch_foot_news.py

      - name: Restaurer historique anti-doublon
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.telegram_route.outputs.state_path }}
          key: football-${{ steps.telegram_route.outputs.destination }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            football-${{ steps.telegram_route.outputs.destination }}-

      - name: Publier sur Telegram
        id: telegram_dispatch
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_DRY_RUN: ${{ inputs.dry_run || 'false' }}
          MANUAL_FORCE: ${{ inputs.force || 'false' }}
          TRIGGER_SOURCE: ${{ inputs.trigger_source || '' }}
        run: |
          set -euo pipefail
          ARGS=()

          # Les pushs restent toujours en simulation.
          # Les deux tâches cron-job.org connues sont, elles, des exécutions de production.
          # Le déclencheur *-test reste explicitement hors de cette liste.
          CRON_PRODUCTION="false"
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && { [ "$TRIGGER_SOURCE" = "cron-job.org" ] || [ "$TRIGGER_SOURCE" = "cron-job.org-lifecycle" ]; }; then
            CRON_PRODUCTION="true"
          fi

          if [ "$EVENT_NAME" = "push" ] || [ "$ROUTED_DESTINATION" = "dry-run" ]; then
            ARGS+=(--dry-run)
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$MANUAL_DRY_RUN" = "true" ] && [ "$CRON_PRODUCTION" != "true" ]; then
            ARGS+=(--dry-run)
          fi

          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$MANUAL_FORCE" = "true" ]; then
            ARGS+=(--force)
          fi

          if [ "$RUN_MODE" = "lifecycle" ]; then
            ARGS+=(--lifecycle-only)
          fi

          EFFECTIVE_DRY_RUN="false"
          for arg in "${ARGS[@]}"; do
            if [ "$arg" = "--dry-run" ]; then EFFECTIVE_DRY_RUN="true"; fi
          done
          echo "effective_dry_run=$EFFECTIVE_DRY_RUN" >> "$GITHUB_OUTPUT"
          echo "ACTUFOOT_MODE event=$EVENT_NAME source=$TRIGGER_SOURCE mode=$RUN_MODE effective_dry_run=$EFFECTIVE_DRY_RUN"

          python scripts/football_channel.py "${ARGS[@]}"

      - name: Sauvegarder historique anti-doublon
        if: ${{ always() && github.event_name == 'workflow_dispatch' && steps.telegram_dispatch.outputs.effective_dry_run == 'false' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.telegram_route.outputs.state_path }}
          key: football-${{ steps.telegram_route.outputs.destination }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Publier les nouvelles Infos Foot sur le site
        if: ${{ github.event_name == 'workflow_dispatch' && steps.telegram_dispatch.outputs.effective_dry_run == 'false' && steps.telegram_route.outputs.destination == 'production' && inputs.mode != 'lifecycle' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python fetch_foot_news.py
            git add footnews.json
            if [ -d assets/images/footnews ]; then git add -A assets/images/footnews; fi
            if git diff --cached --quiet; then
              echo "NEWS_SITE_UNCHANGED"
              exit 0
            fi
            git commit -m "data(infos): refresh Actu Foot news and real images"
            if git push origin HEAD:main; then
              echo "NEWS_SITE_COMMITTED=true" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "Mise à jour concurrente, tentative $attempt/3"
          done
          echo "::error::Impossible de publier les news sans écraser une mise à jour concurrente."
          exit 1

      - name: Déployer les nouvelles Infos Foot
        if: ${{ env.NEWS_SITE_COMMITTED == 'true' && inputs.mode != 'lifecycle' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
