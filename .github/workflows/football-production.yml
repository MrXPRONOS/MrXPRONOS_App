name: Mr XPRONOS - Production Telegram football
run-name: "Actu Foot (${{ inputs.trigger_source || github.event_name }})"
on:
  push:
    branches: [main]
    paths: ['scripts/actu_foot_independent.py', '.github/workflows/football-production.yml']
  workflow_dispatch:
    inputs:
      trigger_source: {required: false, default: manual, type: string}
      dry_run: {required: true, default: false, type: boolean}
      destination:
        required: true
        default: test
        type: choice
        options: [test, dry-run, production]
      force: {required: true, default: false, type: boolean}
      mode:
        required: true
        default: full
        type: choice
        options: [full, lifecycle]
permissions:
  contents: read
concurrency:
  group: mrxpronos-football-production-${{ inputs.mode || 'full' }}
  cancel-in-progress: false
jobs:
  publish:
    name: ActuFoot autonome sans Supabase ni Neon
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FOOTBALL_NEWS_BOT_TOKEN: ${{ secrets.FOOTBALL_NEWS_BOT_TOKEN }}
      PROD_FOOTBALL_NEWS_CHAT_ID: ${{ secrets.FOOTBALL_NEWS_CHAT_ID }}
      TELEGRAM_TEST_CHAT_ID: ${{ secrets.TELEGRAM_TEST_CHAT_ID || '@predict_mrxp' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      FOOTBALL_REQUIRE_COMMENTS: '1'
      FOOTBALL_ENABLE_SCORE_UPDATES: '0'
      FOOTBALL_REMOTE_LEDGER: '0'
      FOOTBALL_CANONICAL_EVENTS: '0'
      FOOTBALL_RUN_METRICS: '0'
      FOOTBALL_ESPN_REQUEST_BUDGET: '12'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer les dépendances nécessaires
        run: python -m pip install --disable-pip-version-check requests Pillow 'cryptography>=43,<47'
      - name: Vérifier les scripts avant publication
        run: |
          python -m py_compile scripts/actu_foot_independent.py scripts/football_channel.py scripts/d1_publication_ledger.py
          python -m unittest tests_football_channel.test_github_vault -q
      - name: Configurer canal et sécurité
        id: route
        shell: bash
        env:
          SOURCE: ${{ inputs.trigger_source || '' }}
          DEST: ${{ inputs.destination || 'test' }}
          DRY: ${{ inputs.dry_run || false }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            DEST=dry-run
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && { [ "$SOURCE" = "cron-job.org" ] || [ "$SOURCE" = "cron-job.org-lifecycle" ]; }; then
            DEST=production
          fi
          case "$DEST" in
            production) echo "FOOTBALL_NEWS_CHAT_ID=$PROD_FOOTBALL_NEWS_CHAT_ID" >> "$GITHUB_ENV";;
            test) echo "FOOTBALL_NEWS_CHAT_ID=$TELEGRAM_TEST_CHAT_ID" >> "$GITHUB_ENV";;
            dry-run) DRY=true; echo "FOOTBALL_NEWS_CHAT_ID=$TELEGRAM_TEST_CHAT_ID" >> "$GITHUB_ENV";;
            *) exit 1;;
          esac
          if [ "$DRY" = "true" ] && [ "$SOURCE" != "cron-job.org" ] && [ "$SOURCE" != "cron-job.org-lifecycle" ]; then
            echo "dryrun=true" >> "$GITHUB_OUTPUT"
          else
            echo "dryrun=false" >> "$GITHUB_OUTPUT"
          fi
          echo "ACTUFOOT_DEST=$DEST"
      - name: Publier ou suivre les matchs retenus
        env:
          MODE: ${{ inputs.mode || 'full' }}
          DRYRUN: ${{ steps.route.outputs.dryrun }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$DRYRUN" != "true" ]; then
            test -n "$FOOTBALL_NEWS_BOT_TOKEN"
            test -n "$FOOTBALL_NEWS_CHAT_ID"
            test -n "$CLOUDFLARE_API_TOKEN"
          fi
          ARGS=(--mode "$MODE")
          if [ "$DRYRUN" = "true" ]; then ARGS+=(--dry-run); fi
          python scripts/actu_foot_independent.py "${ARGS[@]}"
