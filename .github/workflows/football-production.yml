name: Mr XPRONOS - Production Telegram football

on:
  schedule:
    # Togo = UTC/GMT. Contrôle toutes les 30 min de 07h00 à 23h30.
    - cron: '0,30 7-23 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simulation seulement (aucun envoi Telegram)"
        required: true
        type: boolean
        default: true
      force:
        description: "Ignorer exceptionnellement les fenêtres/quotas/historique"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mrxpronos-football-production
  cancel-in-progress: false

jobs:
  publish:
    name: Diffusion editoriale
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
      FOOTBALL_NEWS_BOT_TOKEN: ${{ secrets.FOOTBALL_NEWS_BOT_TOKEN }}
      FOOTBALL_NEWS_CHAT_ID: ${{ secrets.FOOTBALL_NEWS_CHAT_ID }}
      FOOTBALL_RSS_FEED: https://www.footmercato.net/flux-rss
      FOOTBALL_BSD_REQUEST_BUDGET: '18'
      FOOTBALL_REQUIRE_COMMENTS: '1'
      PYTHONUNBUFFERED: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dependances
        run: python -m pip install --disable-pip-version-check requests Pillow

      - name: Verifier les secrets de production
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BSD_API_KEY"
          test -n "$FOOTBALL_NEWS_BOT_TOKEN"
          test -n "$FOOTBALL_NEWS_CHAT_ID"
          echo "PRODUCTION_SECRETS_OK"

      - name: Verifier les six templates
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          required = [
              "template_programme_matchs_du_jour.png",
              "template_avant_match.png",
              "template_resultat_final.png",
              "template_stat_du_jour.png",
              "template_flash_foot.png",
              "template_sondage.png",
          ]
          for name in required:
              path = Path("assets/images") / name
              assert path.is_file(), path
              with Image.open(path) as image:
                  w, h = image.size
                  assert w == h and w >= 900, (path, image.size)
          print("PRODUCTION_TEMPLATES_OK")
          PY

      - name: Restaurer historique anti-doublon
        uses: actions/cache/restore@v4
        with:
          path: .state/mrxpronos-football.json
          key: football-production-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            football-production-

      - name: Publier sur Telegram
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_DRY_RUN: ${{ inputs.dry_run || 'false' }}
          MANUAL_FORCE: ${{ inputs.force || 'false' }}
        run: |
          set -euo pipefail
          ARGS=()

          # Les runs planifiés publient réellement.
          # Un lancement manuel reste en simulation par défaut.
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$MANUAL_DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi

          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$MANUAL_FORCE" = "true" ]; then
            ARGS+=(--force)
          fi

          python scripts/football_channel.py "${ARGS[@]}"

      - name: Sauvegarder historique anti-doublon
        if: ${{ always() && (github.event_name == 'schedule' || inputs.dry_run == false) }}
        uses: actions/cache/save@v4
        with:
          path: .state/mrxpronos-football.json
          key: football-production-${{ github.run_id }}-${{ github.run_attempt }}
