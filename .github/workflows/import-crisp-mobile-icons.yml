name: Import crisp mobile icons
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-crisp-mobile-icons.yml'
permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install image tools
        run: sudo apt-get update -y && sudo apt-get install -y imagemagick webp
      - name: Download, crop and encode Retina-ready WebP icons
        run: |
          set -euxo pipefail
          mkdir -p /tmp/mobile-crisp assets/images/mobile-premium

          curl -L --fail --retry 3 "https://at.adobe.com/oMpAcQuY860WCcNE" -o /tmp/mobile-crisp/home.png
          curl -L --fail --retry 3 "https://at.adobe.com/4NnZuqain4IzzOqU" -o /tmp/mobile-crisp/pronostics.png
          curl -L --fail --retry 3 "https://at.adobe.com/EMc7cPL81lBLxeUI" -o /tmp/mobile-crisp/live.png
          curl -L --fail --retry 3 "https://at.adobe.com/oL4tXKQU1mjV1rpQ" -o /tmp/mobile-crisp/history.png
          curl -L --fail --retry 3 "https://at.adobe.com/vxLU4sJ95KitWh2t" -o /tmp/mobile-crisp/blog.png
          curl -L --fail --retry 3 "https://at.adobe.com/dCJUQyF3LcmgqXpR" -o /tmp/mobile-crisp/conseils.png
          curl -L --fail --retry 3 "https://at.adobe.com/DhD2pAlWDi4i9381" -o /tmp/mobile-crisp/infos.png
          curl -L --fail --retry 3 "https://at.adobe.com/xNKVsXJ7duFu2brl" -o /tmp/mobile-crisp/bonus.png
          curl -L --fail --retry 3 "https://at.adobe.com/BSNnXXI8OB2bkIAE" -o /tmp/mobile-crisp/contact.png
          curl -L --fail --retry 3 "https://at.adobe.com/pYbpSJDGJmH723DW" -o /tmp/mobile-crisp/menu.png

          process_icon () {
            src="$1"
            out="$2"
            convert "$src" -trim +repage -resize '140x140>' -background none -gravity center -extent 160x160 /tmp/mobile-crisp/stage.png
            cwebp -quiet -lossless -m 6 /tmp/mobile-crisp/stage.png -o "$out"
          }

          process_icon /tmp/mobile-crisp/home.png assets/images/mobile-premium/icon-home.webp
          process_icon /tmp/mobile-crisp/pronostics.png assets/images/mobile-premium/icon-pronostics.webp
          process_icon /tmp/mobile-crisp/live.png assets/images/mobile-premium/icon-live.webp
          process_icon /tmp/mobile-crisp/history.png assets/images/mobile-premium/icon-history.webp
          process_icon /tmp/mobile-crisp/blog.png assets/images/mobile-premium/icon-blog.webp
          process_icon /tmp/mobile-crisp/conseils.png assets/images/mobile-premium/icon-conseils.webp
          process_icon /tmp/mobile-crisp/infos.png assets/images/mobile-premium/icon-infos.webp
          process_icon /tmp/mobile-crisp/bonus.png assets/images/mobile-premium/icon-bonus.webp
          process_icon /tmp/mobile-crisp/contact.png assets/images/mobile-premium/icon-contact.webp
          process_icon /tmp/mobile-crisp/menu.png assets/images/mobile-premium/icon-menu.webp

          identify assets/images/mobile-premium/*.webp
          test "$(find assets/images/mobile-premium -maxdepth 1 -name '*.webp' | wc -l)" -eq 10

      - name: Commit regenerated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/mobile-premium
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "assets(mobile): replace nav icons with crisp Retina WebP set"
          git fetch origin main
          git rebase origin/main
          git push
