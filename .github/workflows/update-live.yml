name: Mise à jour horaire (statuts et vérifications)

on:
  schedule:
    - cron: '0 * * * *'   # toutes les heures
  push:
    paths:
      - 'generate_data.py'
      - 'update_scores.py'
      - '*.py'
  workflow_dispatch:

jobs:
  update-live:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Update scores (data.json)
        env:
          SPORTDATA_API_KEY: ${{ secrets.SPORTDATA_API_KEY }}
        run: python update_scores.py

      - name: Convert images to WebP
        run: python convert_images.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'actions@github.com'
          
          git add -A
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          git commit -m "Mise à jour horaire $(date +'%Y-%m-%d %H:%M') [skip ci]"
          
          git fetch origin main
          git rebase -X theirs origin/main
          
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}