name: Mise à jour horaire (statuts et vérifications)

on:
  schedule:
    - cron: '0 * * * *'   # Toutes les heures à la minute 0
  workflow_dispatch:

jobs:
  update-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install requests

      - name: Mise à jour des pronostics (statuts)
        env:
          BSD_API_TOKEN: ${{ secrets.BSD_API_TOKEN }}
        run: python generate_data.py

      - name: Commit et push
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'actions@github.com'
          git add data.json
          git diff --staged --quiet || (git commit -m "Mise à jour horaire $(date +'%Y-%m-%d %H:%M')" && git push)