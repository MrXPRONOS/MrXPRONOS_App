# .github/workflows/update-live.yml
name: Mise à jour horaire (statuts et vérifications)

on:
  schedule:
    - cron: '0 * * * *'   # toutes les heures
  push:
    paths:
      - 'generate_data.py'
      - 'update_matches.py'
      - '*.py'
  workflow_dispatch:

jobs:
  update-live:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install requests mistralai Pillow

      - name: Mise à jour des scores (data.json)
        env:
          SPORTDATA_API_KEY: ${{ secrets.SPORTDATA_API_KEY }}
        run: python update_scores.py

      - name: Conversion des images en WebP
        run: python convert_images.py

      - name: Commit et push
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'actions@github.com'
          git add data.json assets/images/
          git commit -m "Mise à jour horaire $(date +'%Y-%m-%d %H:%M') [skip ci]" || echo "No changes"
          git pull --rebase -X theirs origin main
          git push origin main