name: Actu Foot V1.1 - scores & evenements LIVE
on:
  schedule:
    - cron: '3,18,33,48 * * * *' # secours 15 min, cron-job.org primaire 5 min
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Simulation sans publication Telegram/D1'
        type: boolean
        required: true
        default: true
  push:
    branches: [main]
    paths:
      - '.github/workflows/actufoot-v11-live.yml'
permissions:
  contents: read
concurrency:
  group: actufoot-v11-live-publisher
  cancel-in-progress: false
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      FOOTBALL_NEWS_BOT_TOKEN: ${{ secrets.FOOTBALL_NEWS_BOT_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PYTHONUNBUFFERED: '1'
      FOOTBALL_ESPN_REQUEST_BUDGET: '12'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests Pillow 'cryptography>=43,<47' 'langdetect>=1.0.9,<2'
      - name: Validate before all external calls
        run: |
          python -m py_compile scripts/actufoot_v11_live.py
          python -m unittest tests_football_channel.test_actufoot_v11_live -q
      - name: Verify all ten public channel destinations and bot rights
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)
        env:
          FOOTBALL_NEWS_CHAT_ID: ${{ secrets.FOOTBALL_NEWS_CHAT_ID }}
        run: |
          python - <<'PY'
          import os, requests
          from scripts.actufoot_v1_router import verify_channels, load_config, ROLES
          bot=os.getenv("FOOTBALL_NEWS_BOT_TOKEN", "")
          main=os.getenv("FOOTBALL_NEWS_CHAT_ID", "")
          if not bot or not main: raise SystemExit("MISSING_TELEGRAM_SECRETS")
          accepted,failed=verify_channels(requests.Session(),bot,main,load_config())
          print("ACTUFOOT_V11_PREFLIGHT", sorted(accepted), "failed", sorted(failed))
          if failed or len(accepted)!=len(ROLES): raise SystemExit("V11_PREFLIGHT_FAILED")
          PY
      - name: Live verified scores (push always dry-run)
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          DRY: ${{ inputs.dry_run || false }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = push ] || [ "$DRY" = true ]; then
            python scripts/actufoot_v11_live.py --dry-run
          else
            test -n "$FOOTBALL_NEWS_BOT_TOKEN"
            test -n "$CLOUDFLARE_API_TOKEN"
            python scripts/actufoot_v11_live.py
          fi
