name: Pronostics du jour

on:
  workflow_dispatch:

concurrency:
  group: daily-pronos
  cancel-in-progress: false

jobs:
  generate:
    if: false # BSD V2 replaces old Supabase daily generation
    runs-on: ubuntu-latest
    steps:
      - name: Générer le snapshot quotidien
        run: |
          curl --fail-with-body -X POST "${{ secrets.SUPABASE_URL }}/functions/v1/live/daily/generate"             -H "Content-Type: application/json"             -H "x-cron-secret: ${{ secrets.CRON_SECRET }}"             -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"

  validate:
    if: false # superseded by BSD V2 score settlement
    runs-on: ubuntu-latest
    steps:
      - name: Valider les pronostics terminés
        run: |
          curl --fail-with-body -X POST "${{ secrets.SUPABASE_URL }}/functions/v1/live/daily/validate"             -H "Content-Type: application/json"             -H "x-cron-secret: ${{ secrets.CRON_SECRET }}"             -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
