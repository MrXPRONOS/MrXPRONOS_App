name: Multisource football history - isolated research
on:
  schedule:
    - cron: '15 4 * * *'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/football_history_import.php'
      - 'scripts/football_history_shadow.py'
      - 'tests/test_football_history_shadow.py'
      - 'scripts/football_daily_multisource_shadow.py'
      - 'tests/test_football_daily_multisource_shadow.py'
      - 'scripts/football_history_features.py'
      - 'tests/test_football_history_features.py'
      - 'scripts/football_alias_candidates.py'
      - 'tests/test_football_alias_candidates.py'
      - 'scripts/football_match_source_router.py'
      - 'tests/test_football_match_source_router.py'
      - 'scripts/football_prematch_probability_shadow.py'
      - 'tests/test_football_prematch_probability_shadow.py'
      - 'scripts/football_public_domain_prematch.py'
      - 'tests/test_football_public_domain_prematch.py'
      - 'scripts/football_public_domain_backtest.py'
      - 'tests/test_football_public_domain_backtest.py'
      - 'scripts/football_bsd_private_history.py'
      - 'tests/test_football_bsd_private_history.py'
      - 'scripts/football_bsd_validate_real.py'
      - 'tests/test_football_bsd_validate_real.py'
      - 'scripts/football_bsd_private_paired_backtest.py'
      - 'tests/test_football_bsd_private_paired_backtest.py'
      - '.github/workflows/football-history-shadow.yml'
  workflow_dispatch:
    inputs:
      source:
        description: Historical source
        required: true
        type: choice
        default: openfootball
        options: [openfootball]
      seasons:
        description: Comma-separated seasons
        required: true
        default: '2024-25,2025-26'
      max_files:
        description: Maximum number of files
        required: true
        default: '24'
permissions:
  contents: read
concurrency:
  group: football-history-shadow-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Install test dependencies
        run: python -m pip install requests
      - name: Offline PHP parser and Python tests
        run: |
          php -l scripts/football_history_import.php
          php scripts/football_history_import.php --self-test
          python -m py_compile scripts/football_history_shadow.py scripts/football_daily_multisource_shadow.py scripts/football_history_features.py scripts/football_alias_candidates.py scripts/football_match_source_router.py scripts/football_prematch_probability_shadow.py scripts/football_public_domain_prematch.py scripts/football_public_domain_backtest.py scripts/football_bsd_private_history.py scripts/football_bsd_validate_real.py scripts/football_bsd_private_paired_backtest.py tests/test_football_history_shadow.py tests/test_football_daily_multisource_shadow.py tests/test_football_history_features.py tests/test_football_alias_candidates.py tests/test_football_match_source_router.py tests/test_football_prematch_probability_shadow.py tests/test_football_public_domain_prematch.py tests/test_football_public_domain_backtest.py tests/test_football_bsd_private_history.py tests/test_football_bsd_validate_real.py tests/test_football_bsd_private_paired_backtest.py
          python -m unittest discover -s tests -p 'test_football_history_shadow.py' -v
          python -m unittest discover -s tests -p 'test_football_daily_multisource_shadow.py' -v
          python -m unittest discover -s tests -p 'test_football_history_features.py' -v
          python -m unittest discover -s tests -p 'test_football_alias_candidates.py' -v
          python -m unittest discover -s tests -p 'test_football_match_source_router.py' -v
          python -m unittest discover -s tests -p 'test_football_prematch_probability_shadow.py' -v
          python -m unittest discover -s tests -p 'test_football_public_domain_prematch.py' -v
          python -m unittest discover -s tests -p 'test_football_public_domain_backtest.py' -v
          python -m unittest discover -s tests -p 'test_football_bsd_private_history.py' -v
          python -m unittest discover -s tests -p 'test_football_bsd_validate_real.py' -v
          python -m unittest discover -s tests -p 'test_football_bsd_private_paired_backtest.py' -v
  historical_probe:
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Validate bounded inputs
        env:
          SOURCE: ${{ inputs.source }}
          SEASONS: ${{ inputs.seasons }}
          MAX_FILES: ${{ inputs.max_files }}
        run: |
          python - <<'PY'
          import os,re
          assert os.environ['SOURCE'] == 'openfootball'
          assert re.fullmatch(r'20\d\d-\d\d(?:,20\d\d-\d\d){0,5}',os.environ['SEASONS'])
          assert os.environ['MAX_FILES'].isdigit() and 1<=int(os.environ['MAX_FILES'])<=48
          PY
      - name: Collect historical results with bounded requests
        env:
          SOURCE: ${{ inputs.source }}
          SEASONS: ${{ inputs.seasons }}
          MAX_FILES: ${{ inputs.max_files }}
        run: |
          php scripts/football_history_import.php --source="$SOURCE" --seasons="$SEASONS" --max-files="$MAX_FILES" --out=tmp/history-raw.jsonl
      - name: Merge, isolate conflicts and evaluate coverage
        run: |
          python scripts/football_history_shadow.py --input=tmp/history-raw.jsonl --output=tmp/history-shadow.json --report=tmp/history-quality.json
      - name: Upload only summary report, not datasets
        uses: actions/upload-artifact@v4
        with:
          name: openfootball-history-quality-report
          path: tmp/history-quality.json
          retention-days: 7
          if-no-files-found: error

  provider_probe:
    if: github.event_name == 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Install research adapter dependencies
        run: python -m pip install requests
      - name: Probe public-domain OpenFootball historical fixtures only
        run: |
          php scripts/football_history_import.php --source=openfootball --seasons=2024-25 --max-files=1 --out=tmp/openfootball.jsonl
          cp tmp/openfootball.jsonl tmp/combined.jsonl
          python scripts/football_public_domain_backtest.py --history-jsonl=tmp/openfootball.jsonl --report=tmp/openfootball-holdout-quality.json
          # Chronological four-season EPL probe, fixed 4 public-domain file downloads
          for season in 2023-24 2025-26 2026-27; do
            php scripts/football_history_import.php --source=openfootball --seasons="$season" --max-files=1 --out="tmp/season-$season.jsonl"
          done
          cat tmp/season-2023-24.jsonl tmp/openfootball.jsonl tmp/season-2025-26.jsonl tmp/season-2026-27.jsonl > tmp/four-season-history.jsonl
          python scripts/football_public_domain_backtest.py --history-jsonl=tmp/four-season-history.jsonl --report=tmp/four-season-holdout-quality.json
          python - <<'PY'
          import json
          result=json.load(open('tmp/four-season-holdout-quality.json'))
          assert result['history_unique_matches'] >= 900
          assert result['evaluable_games'] >= 200
          assert result['source_confirmation'] == 'single_unverified_source'
          assert result['production_activation_allowed'] is False
          assert result['compared_to_bsd_v2'] is False
          print('FOUR_SEASON_OUT_OF_SAMPLE_RESEARCH', {'n':result['evaluable_games'], 'measures':result['scoring_metrics']})
          PY
          python scripts/football_history_shadow.py --input=tmp/combined.jsonl --output=tmp/merged.json --report=tmp/quality.json
          python scripts/football_alias_candidates.py --input=tmp/combined.jsonl --out=tmp/aliases-to-review.json
          python - <<'PY'
          import json
          fixture={'home_team':'Arsenal','away_team':'Chelsea','kickoff_utc':'2026-10-14T18:00:00+00:00','league_labels':['Premier League']}
          with open('tmp/fixtures-sample.json','w') as f: json.dump([fixture], f)
          PY
          python scripts/football_history_features.py --history=tmp/merged.json --fixtures=tmp/fixtures-sample.json --out=tmp/form-features.json --report=tmp/form-report.json
          python - <<'PY'
          import json
          snapshot={'espn': {'rows': [{'id':'synthetic-0','provider_event_id':'synthetic-0','home_team':'Arsenal','away_team':'Chelsea','event_date':'2026-10-14T18:00:00Z','league':'Premier League','state':'pre'}]}}
          with open('tmp/synthetic-sources.json','w') as handle:
              json.dump(snapshot,handle)
          PY
          python scripts/football_daily_multisource_shadow.py --snapshots=tmp/synthetic-sources.json --day=2026-10-14 --verified-history=tmp/merged.json --historical-feature-out=tmp/daily-historical-features.json --out=tmp/daily-union.json --report=tmp/daily-merged-report.json --route-out=tmp/daily-source-decisions.json
          python scripts/football_prematch_probability_shadow.py --routed=tmp/daily-source-decisions.json --history=tmp/merged.json --out=tmp/uncalibrated-research-only.json --report=tmp/probability-quality.json

          # End-to-end: lawful 2024-25 score history -> research fixture ->
          # pre-kickoff provider selection -> uncalibrated probability.
          python - <<'PY'
          import json
          snapshot={'espn': {'rows': [{'id':'research-2025','provider_event_id':'research-2025','home_team':'Arsenal','away_team':'Chelsea','event_date':'2025-02-25T18:00:00Z','league':'Premier League','state':'pre'}]}}
          with open('tmp/prematch-sample-2025.json','w') as handle:
              json.dump(snapshot,handle)
          PY
          python scripts/football_daily_multisource_shadow.py \
            --snapshots=tmp/prematch-sample-2025.json --analysis-at=2025-02-24T10:00:00Z \
            --public-domain-history-jsonl=tmp/openfootball.jsonl --day=2025-02-25 \
            --out=tmp/licensed-day-union.json --route-out=tmp/licensed-source-selection.json \
            --report=tmp/licensed-coverage.json
          python scripts/football_prematch_probability_shadow.py \
            --routed=tmp/licensed-source-selection.json --out=tmp/licensed-research-probabilities.json \
            --report=tmp/licensed-probability-report.json
          python - <<'PY'
          import json
          report=json.load(open('tmp/licensed-coverage.json'))
          chosen=json.load(open('tmp/licensed-source-selection.json'))
          probability=json.load(open('tmp/licensed-research-probabilities.json'))
          assert report['public_domain_history']['with_public_domain_goal_features'] == 1
          assert report['prematch_readiness']['with_goal_family'] == 1
          assert chosen[0]['families']['goals']['provider'] == 'openfootball'
          assert chosen[0]['families']['goals']['fallback_used']
          assert len(probability) == 1
          assert probability[0]['not_validated_for_publication']
          assert json.load(open('tmp/licensed-probability-report.json'))['ready_for_betting'] is False
          print('PUBLIC_DOMAIN_HISTORY_TO_PREMATCH_RESEARCH_PASS', report['public_domain_history']['with_public_domain_goal_features'])
          PY
          python - <<'PY'
          import json
          report=json.load(open('tmp/daily-merged-report.json'))
          assert report['prematch_readiness']['model_enabled'] is False
          assert report['historical_feature_coverage']['production_model_modified'] is False
          assert len(json.load(open('tmp/daily-union.json'))) == 1
          assert len(json.load(open('tmp/daily-source-decisions.json'))) == 1
          assert json.load(open('tmp/probability-quality.json'))['ready_for_betting'] is False
          print('FULL_PREMATCH_SHADOW_PIPELINE_OK')
          PY
          python - <<'PY'
          import json
          report=json.load(open('tmp/quality.json'))
          test=json.load(open('tmp/openfootball-holdout-quality.json'))
          assert test['history_unique_matches'] >= 200
          assert test['evaluable_games'] > 0
          assert test['production_activation_allowed'] is False
          assert test['compared_to_bsd_v2'] is False
          print('OPENFOOTBALL_BACKTEST', {'n':test['evaluable_games'], 'metrics':test['scoring_metrics']})
          assert report['provider_rows']['openfootball'] >= 200
          assert report['unique_fixtures'] >= 200
          assert report['multi_source_agreement'] == 0
          assert not json.load(open('tmp/form-report.json'))['production_model_modified']
          print('OPENFOOTBALL_PROBE_PASS', {k:report[k] for k in ('input_rows','unique_fixtures','multi_source_agreement','conflicted_fixtures')})
          PY
      - name: Upload research summary, never raw datasets
        uses: actions/upload-artifact@v4
        with:
          name: openfootball-public-domain-probe
          path: |
            tmp/quality.json
            tmp/openfootball-holdout-quality.json
            tmp/four-season-holdout-quality.json
          retention-days: 7

  daily_source_probe:
    if: github.event_name == 'pull_request' || github.event_name == 'schedule'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Install adapter dependencies
        run: python -m pip install requests
      - name: Collect capped public-domain recent-season historical results
        run: |
          php scripts/football_history_import.php --source=openfootball --seasons=2025-26,2026-27 --max-files=12 --out=tmp/authorized-prematch-history.jsonl
      - name: Audit today's public sources with lawful historical form (no publishing)
        run: |
          python scripts/football_daily_multisource_shadow.py --day="$(date -u +%F)" --max-http=12 --public-domain-history-jsonl=tmp/authorized-prematch-history.jsonl --out=tmp/fixture-research.json --route-out=tmp/source-route.json --report=tmp/daily-source-quality.json
          python scripts/football_prematch_probability_shadow.py --routed=tmp/source-route.json --out=tmp/research-only-uncalibrated-probabilities.json --report=tmp/daily-probability-quality.json
          python - <<'PY'
          import json
          report=json.load(open('tmp/daily-source-quality.json'))
          print('SOURCE_HEALTH', {k:{'valid':v['valid'],'error':v['error']} for k,v in report['providers'].items()})
          assert report['total_http_requests'] <= 12
          assert report['model_input_enabled'] is False
          assert report['telegram_posts'] == 0
          assert report['prematch_readiness']['model_enabled'] is False
          assert report['prematch_readiness']['telegram_posts'] == 0
          assert report['public_domain_history']['production_publishing_allowed'] is False
          assert report['public_domain_history']['no_corners_or_cards_fabricated']
          quality=json.load(open('tmp/daily-probability-quality.json'))
          assert quality['ready_for_betting'] is False
          assert quality['production_outputs_written'] is False
          print('DAILY_LAWFUL_HISTORICAL_MARKETS', {'goals':report['prematch_readiness']['with_goal_family'],'profiles':quality['probability_profiles_generated'],'history_fixtures':report['public_domain_history']['with_public_domain_goal_features']})
          PY
      - name: Upload source health summary only
        uses: actions/upload-artifact@v4
        with:
          name: football-daily-source-health
          path: |
            tmp/daily-source-quality.json
            tmp/daily-probability-quality.json
          retention-days: 7

  bsd_actual_archive_validation:
    # Only the dedicated same-repository PR can access the restore secret.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 96 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/multisource-history-shadow-20261014'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 16
    permissions:
      contents: read
    steps:
      - name: Checkout trusted same-repository branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact archive/runtime libraries
        run: python -m pip install requests cryptography
      - name: Verify encrypted archive and baseline tests
        run: |
          test -s bsd/all_matches_bsd.enc.json
          test -s bsd/bsd_archive.py
          test -s scripts/football_bsd_validate_real.py
          python -m unittest discover -s tests -p 'test_football_bsd_validate_real.py' -v
      - name: Collect PUBLIC fixtures with capped HTTP BEFORE private archive restoration
        run: |
          umask 077
          mkdir -p tmp
          python scripts/football_daily_multisource_shadow.py --day="$(date -u +%F)" --max-http=12 --out=tmp/public-union.json --report=tmp/public-source-health.json
      - name: Restore PRIVATE BSD history without exposing decryption key
        env:
          BSD_HISTORY_KEY: ${{ secrets.BSD_HISTORY_KEY }}
        run: |
          umask 077
          if [ -z "${BSD_HISTORY_KEY}" ]; then
            echo 'BSD_PRIVATE_VALIDATION_BLOCKED: repository restore secret unavailable'
            exit 1
          fi
          python bsd/bsd_archive.py restore
          test -s bsd/all_matches_bsd.json
          chmod 600 bsd/all_matches_bsd.json
      - name: Validate real BSD against public fixtures; only aggregate output
        run: |
          umask 077
          python scripts/football_bsd_validate_real.py --history=bsd/all_matches_bsd.json --union=tmp/public-union.json --bsd-site-data=data.json --out=tmp/bsd-private-validation-AGGREGATES-ONLY.json
          python scripts/football_bsd_private_paired_backtest.py --history=bsd/all_matches_bsd.json --max-fixtures=300 --report=tmp/bsd-private-paired-BENCHMARK-AGGREGATES-ONLY.json
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path('tmp/bsd-private-validation-AGGREGATES-ONLY.json').read_text())
          assert result['private_archive']['records_restored'] >= 1000
          assert result['public_data_json_modified'] is False
          assert result['private_archive_uploaded'] is False
          assert result['production_model_modified'] is False
          assert result['predictions_published'] == 0
          assert result['telegram_posts'] == 0
          bench=json.loads(Path('tmp/bsd-private-paired-BENCHMARK-AGGREGATES-ONLY.json').read_text())
          assert bench['private_match_rows_exposed'] is False
          assert bench['compared_to_production_calibrated_bsd_v2'] is False
          assert bench['publication_enabled'] is False
          PY
      - name: Destroy decrypted BSD archive and private runtime files
        if: always()
        shell: bash
        run: |
          rm -f bsd/all_matches_bsd.json bsd/backfill_state.json tmp/public-union.json
          test ! -e bsd/all_matches_bsd.json
          test ! -e bsd/backfill_state.json
      - name: Upload only approved aggregate statistics
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bsd-private-validation-aggregate-only
          path: |
            tmp/bsd-private-validation-AGGREGATES-ONLY.json
            tmp/bsd-private-paired-BENCHMARK-AGGREGATES-ONLY.json
          if-no-files-found: error
          retention-days: 3
