          test -s scripts/football_bsd_validate_real.py
          python -m unittest discover -s tests -p 'test_football_bsd_validate_real.py' -v
      - name: Collect PUBLIC fixtures with capped HTTP BEFORE private archive restoration
        run: |
          umask 077
          mkdir -p tmp
          python scripts/football_daily_multisource_shadow.py --day="$(date -u +%F)" --max-http=12 --out=tmp/public-union.json --report=tmp/public-source-health.json
      - name: Collect TOMORROW public fixtures before private archive restoration
        run: |
          umask 077
          tomorrow="$(date -u -d 'tomorrow' +%F)"
          python scripts/football_daily_multisource_shadow.py --day="$tomorrow" --max-http=12 --out=tmp/next-day-public-union.json --report=tmp/next-day-public-source-health.json
          python scripts/football_openfootball_world_import.py --max-files=40 --out=tmp/private-run-world-history.jsonl --report=tmp/private-run-world-history-AGGREGATE.json
      - name: Collect +2/+3-day public fixtures for native BSD identity proof
        run: |
          set -euo pipefail
          umask 077
          python scripts/football_prematch_multiday_probe.py \
            --start-day="$(date -u -d '+2 days' +%F)" \
            --count-days=2 --max-http=18 \
            --out=tmp/native-id-public-fixtures.json \
            --report=tmp/native-id-public-health-AGGREGATE.json
      - name: Audit exact real BSD event IDs against CC0 fixtures before private archive restoration
        env:
          BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
          FOOTBALL_MULTI_SOURCE: '0'
        run: |
          set -euo pipefail
          umask 077
          test -n "${BSD_API_KEY}"
          python scripts/football_native_bsd_identity_probe.py \
            --public-fixtures=tmp/native-id-public-fixtures.json \
            --days=2 --start-offset=2 \
            --report=tmp/bsd-native-identity-AGGREGATE.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('tmp/bsd-native-identity-AGGREGATE.json').read_text())
          assert r['research_only'] is True
          assert r['native_event_ids_exported'] is False
          assert r['actual_bookmaker_quote_or_market_verified'] is False
          assert r['original_production_publication_enabled'] is False
          assert r['native_bookmaker_prices_fetched'] is False
          assert r['no_data_json_modified'] is True
          assert r['bsd_http_calls'] <= 12
          assert r['calendar_files_verified'] == 8
          assert r['official_league_metadata_requested'] <= 8
          assert r['official_league_metadata_verified'] <= r['official_league_metadata_requested']
          quoted=r['read_only_native_consensus_price_audit']
          assert quoted['event_ids_selected_only_from_confirmed_native_links'] is True
          assert quoted['official_native_events_quoted_attempts'] <= 2
          assert quoted['max_linked_events_for_quote_probe'] == 2
          assert quoted['consensus_is_not_executable_bookmaker_offer'] is True
          assert quoted['independent_bookmaker_selection_codes_verified'] == 0
          assert quoted['production_market_policy_approved'] is False
          assert quoted['raw_market_prices_or_event_ids_exported'] is False
          assert r['bsd_http_calls'] <= 12
          assert r['one_to_one_native_event_links'] <= r['external_cc0_verified']
          print('NATIVE_BSD_IDENTITY_COUNTS',{
              'cc0_verified':r['external_cc0_verified'],
              'native_unique':r['native_unique_eligible'],
              'one_to_one_linked':r['one_to_one_native_event_links']})
          PY
      - name: Restore PRIVATE BSD history without exposing decryption key
        env:
          BSD_HISTORY_KEY: ${{ secrets.BSD_HISTORY_KEY }}
        run: |
          umask 077
          if [ -z "${BSD_HISTORY_KEY}" ]; then
            echo 'BSD_PRIVATE_VALIDATION_BLOCKED: repository restore secret unavailable'
            exit 1
          fi
          python bsd/bsd_archive.py restore
          test -s bsd/all_matches_bsd.json
          chmod 600 bsd/all_matches_bsd.json
      - name: Validate real BSD against public fixtures; only aggregate output
        run: |
          umask 077
          python scripts/football_bsd_validate_real.py --history=bsd/all_matches_bsd.json --union=tmp/public-union.json --bsd-site-data=data.json --out=tmp/bsd-private-validation-AGGREGATES-ONLY.json
          python scripts/football_bsd_private_paired_backtest.py --history=bsd/all_matches_bsd.json --max-fixtures=700 --report=tmp/bsd-private-paired-BENCHMARK-AGGREGATES-ONLY.json
          python scripts/football_external_bsd_v2_adapter.py \
            --historical-jsonl=tmp/private-run-world-history.jsonl \
            --private-bsd-history-json=bsd/all_matches_bsd.json \
            --authorize-bsd-private-internal-use \
            --bsd-public-identity-feed=data.json \
            --daily-union=tmp/next-day-public-union.json \
            --analysis-at="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --report=tmp/bsd-next-day-multisource-aggregate.json
          python scripts/football_external_bsd_v2_adapter.py \
            --private-bsd-history-json=bsd/all_matches_bsd.json \
            --authorize-bsd-private-internal-use \
            --bsd-public-identity-feed=data.json \
            --daily-union=tmp/public-union.json \
            --analysis-at="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --report=tmp/bsd-private-original-v2-aggregate.json
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path('tmp/bsd-private-validation-AGGREGATES-ONLY.json').read_text())
          assert result['private_archive']['records_restored'] >= 1000
          assert result['public_data_json_modified'] is False
          assert result['private_archive_uploaded'] is False
          assert result['production_model_modified'] is False
          assert result['predictions_published'] == 0
          assert result['telegram_posts'] == 0
          bench=json.loads(Path('tmp/bsd-private-paired-BENCHMARK-AGGREGATES-ONLY.json').read_text())
          assert bench['private_match_rows_exposed'] is False
          assert bench['compared_to_production_calibrated_bsd_v2'] is False
          assert bench['publication_enabled'] is False
          upcoming=json.loads(Path('tmp/bsd-next-day-multisource-aggregate.json').read_text())
          assert upcoming['bsd_v2_core']['calculation_module_modified'] is False
          assert upcoming['bsd_v2_core']['production_published'] is False
          assert upcoming['multi_api_historical_inputs']['private_bsd']['private_ids_exposed_in_report'] is False
          print('PRIVATE_BSD_TOMORROW_EXTERNAL_SOURCE_COVERAGE', {
              'history':upcoming['historical']['usable_historic_matches'],
              'external_matches':upcoming['fixtures']['input_discovered_fixtures'],
              'ready_for_original_v2':upcoming['fixtures']['ready_for_unchanged_core'],
              'abstention_breakdown':upcoming['fixtures']['ignored']
          })
          extended=json.loads(Path('tmp/bsd-private-original-v2-aggregate.json').read_text())
          assert extended['multi_api_historical_inputs']['private_bsd']['private_ids_exposed_in_report'] is False
          assert extended['bsd_v2_core']['calculation_module_modified'] is False
          assert extended['bsd_v2_core']['production_published'] is False
          assert extended['bsd_v2_core']['core_predict_v2_function_used'] is True
          print('ORIGINAL_V2_REAL_BSD_HISTORY_ENRICHMENT', {
              'converted': extended['multi_api_historical_inputs']['private_bsd']['converted'],
              'new_fixtures_ready': extended['fixtures']['ready_for_unchanged_core'],
              'h2h_fixtures': extended['bsd_v2_core']['h2h_nonzero_fixtures']
          })
          PY
      - name: Destroy decrypted BSD archive and private runtime files
        if: always()
        shell: bash
        run: |
          rm -f bsd/all_matches_bsd.json bsd/backfill_state.json tmp/public-union.json tmp/next-day-public-union.json tmp/native-id-public-fixtures.json tmp/private-run-world-history.jsonl
          test ! -e bsd/all_matches_bsd.json
          test ! -e bsd/backfill_state.json
      - name: Upload only approved aggregate statistics
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bsd-private-validation-aggregate-only
          path: |
            tmp/bsd-private-validation-AGGREGATES-ONLY.json
            tmp/bsd-private-paired-BENCHMARK-AGGREGATES-ONLY.json
            tmp/bsd-private-original-v2-aggregate.json
            tmp/bsd-next-day-multisource-aggregate.json
            tmp/bsd-native-identity-AGGREGATE.json
            tmp/private-run-world-history-AGGREGATE.json
          if-no-files-found: error
          retention-days: 3

  multiday_readonly_preflight:
    # No Telegram secrets: repeatedly verify the same multi-day pipeline that
    # succeeded in the isolated one-shot test. Never publish or restore BSD.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 96 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/multisource-history-shadow-20261014'
    needs: [verify, bsd_actual_archive_validation]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Load aggregate-only signed-in-run BSD identity report
        uses: actions/download-artifact@v4
        with:
          name: bsd-private-validation-aggregate-only
          path: tmp/pr96-native-aggregates
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Install public-source HTTP dependencies
        run: python -m pip install requests cryptography
      - name: Collect legal CC0 historical matches and future fixtures
        run: |
          set -euo pipefail
          umask 077
          mkdir -p tmp
          php scripts/football_history_import.php \
            --source=openfootball \
            --seasons=2023-24,2024-25,2025-26,2026-27 \
            --league-codes=en.1,en.2,de.1,es.1,fr.1,it.1,nl.1,pt.1 \
            --max-files=32 --out=tmp/readonly-licensed-history.jsonl
          test -s tmp/readonly-licensed-history.jsonl
          python scripts/football_prematch_multiday_probe.py \
            --start-day="$(date -u -d '+2 days' +%F)" \
            --count-days=3 --max-http=24 \
            --out=tmp/readonly-multiday-fixtures.json \
            --report=tmp/readonly-multiday-health.json
      - name: Audit SportScore documented upcoming filter separately
        run: |
          set -euo pipefail
          sha256sum tmp/readonly-multiday-fixtures.json > tmp/readonly-source-baseline.sha256
          python scripts/football_sportscore_filtered_audit.py \
            --fixtures=tmp/readonly-multiday-fixtures.json \
            --baseline-health=tmp/readonly-multiday-health.json \
            --max-http=4 --report=tmp/sportscore-upcoming-audit.json
          sha256sum -c tmp/readonly-source-baseline.sha256
      - name: Corroborate calendars and run ORIGINAL BSD V2 without Telegram
        run: |
          set -euo pipefail
          python scripts/football_cc0_calendar_verification.py \
            --fixtures=tmp/readonly-multiday-fixtures.json \
            --analysis-at="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --output=tmp/readonly-confirmed-fixtures.json \
            --report=tmp/readonly-calendar-health.json
          python scripts/football_multisource_channel_test.py \
            --fixtures=tmp/readonly-confirmed-fixtures.json \
            --licensed-history=tmp/readonly-licensed-history.jsonl \
            --analysis-at="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --report=tmp/readonly-v2-report.json
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('tmp/readonly-v2-report.json').read_text())
          calendar=json.loads(Path('tmp/readonly-calendar-health.json').read_text())
          fixtures=json.loads(Path('tmp/readonly-multiday-health.json').read_text())
          filtered=json.loads(Path('tmp/sportscore-upcoming-audit.json').read_text())
          assert filtered['documented_filter_only'] is True
          assert filtered['undocumented_pagination_used'] is False
          assert filtered['new_events_added_to_prediction_pipeline'] == 0
          assert filtered['calendar_matching_or_odds_approved'] is False
          assert filtered['no_production_writes'] is True
          assert filtered['probe_max_requests'] <= 4
          assert filtered['attempts'] <= filtered['probe_max_requests']
          assert filtered['general_page_cap'] == fixtures['sportscore_page_size_limit']
          assert set(filtered['per_day']) == set(fixtures['days'])
          assert report['test_only'] is True
          assert report['production_modified'] is False
          assert report['calibrated_production_coupons'] == 0
          assert report['no_odds_invented'] is True
          gate=report['no_bookmaker_quote_gate']
          assert gate['used_original_predict_v2'] is True
          assert gate['fixtures_checked'] == report['qualified_external_fixtures']
          assert gate['accepted_with_no_bookmaker_quotes'] == 0
          assert gate['actual_bookmaker_quotes_supplied'] is False
          assert gate['full_publication_policy_checked'] is False
          assert gate['publication_enabled'] is False
          if gate['fixtures_checked']:
              assert gate['missing_or_low_odds_market_rejections'] > 0
          assert 'telegram' not in report
          assert report['input_api_fixtures'] == fixtures['total_fixtures']
          assert report['calendar_corroborated_fixtures'] <= calendar['coverage']['schedule_matches_confirmed']
          by_source=calendar['coverage']['by_discovery_source']
          assert sum(row['input'] for row in by_source.values()) == fixtures['total_fixtures']
          assert sum(row.get('confirmed',0) for row in by_source.values()) == calendar['coverage']['schedule_matches_confirmed']
          assert report['qualified_external_fixtures'] <= report['calendar_corroborated_fixtures']
          assert report['raw_v2_candidates'] <= report['qualified_external_fixtures']
          assert 0 <= report['messages_ready'] <= 3
          assert report['historic_matches'] > 0
          assert fixtures['requests_total'] <= 24
          assert fixtures['sportscore_page_size_limit'] == 200
          assert fixtures['sportscore_coverage_possibly_incomplete'] == (
            fixtures['sportscore_days_at_page_limit'] > 0)
          bridge=report['external_pricing_bridge']
          assert bridge['inspected_fixtures'] == report['qualified_external_fixtures']
          assert bridge['native_bsd_odds_event_ids_verified'] == 0
          assert bridge['external_to_bookmaker_event_matches_verified'] == 0
          assert bridge['bsd_native_odds_endpoint_called'] is False
          assert bridge['model_estimated_prices_possible_in_existing_publisher'] is True
          assert bridge['model_estimated_prices_generated_by_this_audit'] is False
          assert bridge['full_calibration_and_v21_publication_approved'] is False
          assert bridge['publication_enabled'] is False
          # A missing calendar match cannot silently become an approved
          # fixture merely because a side or a UTC date looks similar.
          missing_reasons=sum(
            count for counts in by_source.values()
            for reason,count in counts.items() if reason.startswith('unmatched_'))
          assert missing_reasons == calendar['coverage']['refused'].get('no_cc0_schedule_match',0)
          summary={k:report[k] for k in (
            'input_api_fixtures','calendar_corroborated_fixtures',
            'qualified_external_fixtures','raw_v2_candidates',
            'historic_matches','calibrated_production_coupons')}
          print('MULTIDAY_READONLY_BSD_V2_PREFLIGHT',json.dumps(summary))
          PY
      - name: Train ORIGINAL full BSD V2 models and replay 2026 held-out results (read-only)
        run: |
          set -euo pipefail
          python scripts/football_multisource_calibrated_replay.py \
            --licensed-history=tmp/readonly-licensed-history.jsonl \
            --fixtures=tmp/readonly-confirmed-fixtures.json \
            --at="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --fit-cutoff=2026-01-01T00:00:00+00:00 \
            --existing-feed=data.json \
            --max-holdout=120 \
            --report=tmp/readonly-calibrated-replay.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('tmp/readonly-calibrated-replay.json').read_text())
          assert r['research_only'] is True
          assert r['production_publication_authorized'] is False
          assert r['all_native_bsd_v2_fit_functions_used'] is True
          assert r['full_calibration_and_specialists_executed'] is True
          assert r['holdout_evaluation']['strict_pre_day_data_availability_enforced'] is True
          assert r['holdout_evaluation']['not_a_verified_kickoff_or_odds_backtest'] is True
          assert r['upcoming_research']['official_bookmaker_quotes_loaded'] is False
          assembled=r['native_assembler_dry_run']
          assert assembled['original_bsd_v2_publish_assemble_executed'] is True
          assert assembled['input_synthetic_fixture_count'] == r['upcoming_research']['history_eligible']
          assert assembled['no_actual_bookmaker_quotes_used'] is True
          assert assembled['no_api_or_telegram_network_access'] is True
          assert assembled['max_odds_requests'] == 0
          assert assembled['existing_publication_tracker_supplied'] is True
          assert assembled['existing_production_snapshot_left_untouched'] is True
          assert assembled['synthetic_fixture_ids_not_authorized_for_publishing'] is True
          assert assembled['production_ledger_or_files_updated'] is False
          assert assembled['production_release_authorized'] is False
          assert r['upcoming_research']['production_tracker_loaded'] is True
          assert r['raw_or_private_events_exported'] is False
          assert r['telegram_posts'] == 0
          assert r['training_results_before_cutoff'] <= r['historical_results_available']
          assert r['holdout_evaluation']['matches_examined'] <= 120
          print('BSD_V2_CALIBRATION_RESEARCH_CHECK',json.dumps({
              'training_sufficient':r['training_sufficiency_requirements_met'],
              'holdout_examined':r['holdout_evaluation']['matches_examined'],
              'selected':r['holdout_evaluation']['selected_without_market_quotes'],
              'full_publication':False}))
          PY
      - name: Produce fail-closed explicit release decision (NO-GO until external proof)
        run: |
          set -euo pipefail
          python scripts/football_multisource_release_gate.py \
            --v2=tmp/readonly-v2-report.json \
            --calendar=tmp/readonly-calendar-health.json \
            --fixtures=tmp/readonly-multiday-health.json \
            --sportscore=tmp/sportscore-upcoming-audit.json \
            --calibrated=tmp/readonly-calibrated-replay.json \
            --native-identity=tmp/pr96-native-aggregates/bsd-native-identity-AGGREGATE.json \
            --report=tmp/multisource-release-gate.json
          python - <<'PY'
          import json
          from pathlib import Path
          decision=json.loads(Path('tmp/multisource-release-gate.json').read_text())
          assert decision['decision'] == 'NO_GO'
          assert decision['production_publication_authorized'] is False
          assert decision['research_branch_fusion_authorized_by_this_report'] is False
          assert decision['independent_review_before_merging_required'] is True
          assert decision['checks']['native_research_model_calibration_reproduced'] is True
          assert decision['calibrated_replay_2026']['real_kickoff_or_bookmaker_backtest'] is False
          metrics=decision['source_metrics']
          assert decision['checks']['independently_corroborated_native_event_links_observed'] == (metrics['authentic_bsd_event_links_from_private_validation'] > 0)
          assert decision['checks']['fresh_bsd_consensus_market_prices_observed'] == (metrics['fresh_bsd_consensus_market_prices_from_private_validation'] > 0)
          assert decision['checks']['real_production_tracker_immutability_probed'] is True
          assert decision['checks']['external_fixture_to_bookmaker_event_identity_verified'] is False
          assert len(decision['blocking_requirements']) >= 6
          print('PRODUCTION_RELEASE_VERDICT',decision['decision'],
                'blocking_requirements',len(decision['blocking_requirements']))
          PY
      - name: Destroy all temporary raw fixtures and historical rows
        if: always()
        run: |
          rm -f tmp/readonly-licensed-history.jsonl tmp/readonly-multiday-fixtures.json tmp/readonly-confirmed-fixtures.json tmp/readonly-source-baseline.sha256
      - name: Upload aggregate diagnostics only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mrxp-multiday-readonly-aggregate
          path: |
            tmp/readonly-multiday-health.json
            tmp/readonly-calendar-health.json
            tmp/readonly-v2-report.json
            tmp/sportscore-upcoming-audit.json
            tmp/multisource-release-gate.json
