name: Mr XPRONOS - automatic prospective exact-score monitoring

on:
  schedule:
    # Default branch schedules in UTC; keep research isolated from the site.
    - cron: '11 6,14,22 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mrx-exact-prospective-one-writer
  cancel-in-progress: false

jobs:
  monitor:
    if: github.repository == 'MrXPRONOS/MrXPRONOS_App'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout ONLY experimental research branch
        uses: actions/checkout@v4
        with:
          ref: feature/exact-score-v1-20261019
          fetch-depth: 0
          persist-credentials: true
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install shadow dependencies
        run: python -m pip install requests cryptography
      - name: Check prospective recording and dashboard
        run: |
          python -m unittest bsd/test_exact_scores_prospective.py -v
          python -m unittest bsd/test_exact_scores.py -v
          python -m unittest bsd/test_grouped_correct_score.py -v
          node --check assets/js/grouped-score.js
      - name: Restore latest encrypted BSD history from production branch
        env:
          BSD_HISTORY_KEY: '${{ secrets.BSD_HISTORY_KEY }}'
        run: |
          test -n "$BSD_HISTORY_KEY" || { echo "::error::BSD_HISTORY_KEY missing"; exit 1; }
          git fetch --no-tags origin main
          git show origin/main:bsd/all_matches_bsd.enc.json > bsd/all_matches_bsd.enc.json
          python bsd/bsd_archive.py restore
      - name: Record new pre-match forecasts and settle previous forecasts
        env:
          BSD_API_KEY: '${{ secrets.BSD_API_KEY }}'
          BSD_HISTORY_KEY: '${{ secrets.BSD_HISTORY_KEY }}'
          FOOTBALL_MULTI_SOURCE: '0'
        run: |
          test -n "$BSD_API_KEY" || { echo "::error::BSD_API_KEY missing"; exit 1; }
          python bsd/exact_scores_prospective.py --max-requests 90
      - name: Record 1xBet grouped research previews without bookmaker price assumptions
        env:
          BSD_API_KEY: '${{ secrets.BSD_API_KEY }}'
          BSD_HISTORY_KEY: '${{ secrets.BSD_HISTORY_KEY }}'
          FOOTBALL_MULTI_SOURCE: '0'
        run: python bsd/grouped_correct_score_prospective.py --max-requests 90
      - name: Stage grouped website review data privately
        env:
          BSD_HISTORY_KEY: '${{ secrets.BSD_HISTORY_KEY }}'
        run: python bsd/grouped_correct_score_feed.py
      - name: Produce private aggregate dashboard
        env:
          BSD_HISTORY_KEY: '${{ secrets.BSD_HISTORY_KEY }}'
        run: python bsd/exact_scores_dashboard.py
      - name: Verify no forecasts published and ledger report consistency
        run: |
          python - <<'PY'
          import json
          data=json.load(open('tmp/exact-scores/prospective-report.json'))
          dash=json.load(open('tmp/exact-scores/prospective-dashboard.json'))
          assert data["experimental"] and data["published"] is False
          assert dash["published"] is False and dash["prospective_only"] is True
          assert data["total_captured"] == dash["total_captured"]
          assert data["all"]["n"] == dash["all"]["n"]
          assert dash["priority"]["n"] <= dash["all"]["n"]
          grouped=json.load(open('tmp/grouped-correct-score/prospective-report.json'))
          review=json.load(open('tmp/grouped-correct-score/scores-groupes-review.json'))
          assert grouped["published"] is False and review["published"] is False
          assert grouped["total_captured"] >= grouped["settled"] + grouped["pending"]
          print('GROUPED_PROSPECTIVE_DAILY',grouped["total_captured"],grouped["settled"],len(review["matches"]))
          print('EXACT_PROSPECTIVE_DAILY',dash['total_captured'],dash['all']['n'],dash['priority']['n'])
          PY
      - name: Commit ONLY encrypted forecasts to research branch
        run: |
          if [ ! -f bsd/exact_score_shadow_ledger.enc.json ]; then
            echo "No private forecasts captured"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- bsd/exact_score_shadow_ledger.enc.json bsd/grouped_1xbet_shadow_ledger.enc.json
          if git diff --cached --quiet; then
            echo "No change to archived forecasts"; exit 0
          fi
          git commit -m "data(shadow): sealed prospective archive [skip ci]"
          git restore -- bsd/all_matches_bsd.enc.json
          git pull --rebase origin feature/exact-score-v1-20261019
          git push origin HEAD:feature/exact-score-v1-20261019
      - name: Upload standalone dashboard and metrics, never individual forecasts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mrx-exact-prospective-dashboard-${{ github.run_id }}
          path: |
            tmp/exact-scores/prospective-report.json
            tmp/exact-scores/prospective-dashboard.json
            tmp/exact-scores/prospective-dashboard.html
            tmp/grouped-correct-score/prospective-report.json
            tmp/grouped-correct-score/scores-groupes-review.json
          retention-days: 90
          if-no-files-found: ignore
      - name: Remove sensitive local history
        if: always()
        run: rm -f bsd/all_matches_bsd.json bsd/backfill_state.json
