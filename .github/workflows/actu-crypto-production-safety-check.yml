name: Actu Crypto - Production preflight safety checks

on:
  push:
    branches: [main, fix/crypto-prod-preflight-tests-20261019]
    paths:
      - '.github/workflows/actu-crypto-production-live.yml'
      - '.github/workflows/actu-crypto-production-safety-check.yml'
      - 'crypto/**'
      - 'scripts/crypto_poster_format.mjs'
      - 'scripts/test_crypto_poster_format.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install free offline test packages
        run: python -m pip install 'requests>=2.31,<3' 'Pillow>=10,<12' 'feedparser>=6.0,<7'
      - name: Run full production preflight without Telegram
        run: |
          python -m compileall -q crypto
          python -m unittest \
            crypto.test_final_live_v2 \
            crypto.test_quality_audit_10 \
            crypto.test_publish_crypto_1_5 \
            crypto.test_losers_v2 \
            crypto.test_alerts_v2 \
            crypto.test_fear_v2 \
            crypto.test_dominance_v2 \
            crypto.test_weekly_v2 \
            crypto.test_breaking_v2 \
            crypto.test_exchanges_v2 \
            crypto.test_regulation_v2 \
            crypto.test_production_live_v1 -v
          node scripts/test_crypto_poster_format.mjs
