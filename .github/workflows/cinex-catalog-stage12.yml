name: CineX - Inventaire et téléchargements contrôlés par GitHub
# Revalidate the newly-authorized CineRadar bot membership after PR #503.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cinex-catalog-stage12.yml'
      - 'telegram-film-relay/scripts/catalog_stage12.py'
      - 'telegram-film-relay/scripts/cinex_github_control.py'
      - 'cinecanaux/migrations/014_cinex_delivery_catalog.sql'
      - 'cinecanaux/migrations/017_cinex_season_evidence.sql'
  schedule:
    - cron: '23 2 * * *'
permissions:
  contents: read
concurrency:
  group: mrx-telegram-personal-account
  cancel-in-progress: false
  queue: max
jobs:
  catalog:
    name: Synchroniser les téléchargements depuis GitHub puis inventorier
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: telegram-film-relay
    env:
      PYTHONPATH: .
      CINEX_DOWNLOADS_ENABLED: ${{ vars.CINEX_DOWNLOADS_ENABLED || 'false' }}
      TG_API_ID: ${{ secrets.TG_API_ID }}
      TG_API_HASH: ${{ secrets.TG_API_HASH }}
      TG_STRING_SESSION: ${{ secrets.TG_SESSION_STRING || secrets.TG_STRING_SESSION || secrets.TG_STREAM_SESSION }}
      SERIES_PRIVATE_CHANNEL: ${{ vars.SERIES_PRIVATE_CHANNEL }}
      SERIES_PUBLIC_CHANNEL: ${{ vars.SERIES_PUBLIC_CHANNEL || '@seriesvf_cinex' }}
      ACTION_PRIVATE_CHANNEL: ${{ vars.ACTION_PRIVATE_CHANNEL }}
      ACTION_PUBLIC_CHANNEL: ${{ vars.ACTION_PUBLIC_CHANNEL || '@filmsaction2026vf' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: '9c86118191b804d91b5f5b2c89114999'
      CINERADAR_D1_DATABASE_ID: 'fa8b5009-bc1a-4a6e-b143-7a487c7297a5'
    steps:
      - uses: actions/checkout@v4
      - name: Respecter le delai FloodWait du compte Telegram personnel
        env:
          TG_PERSONAL_COOLDOWN_UNTIL_UTC: ${{ vars.TG_PERSONAL_COOLDOWN_UNTIL_UTC }}
        run: python3 "$GITHUB_WORKSPACE/telegram-film-relay/scripts/check_personal_cooldown.py"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer Telethon et Requests
        run: python -m pip install -r requirements.txt
      - name: Tests locaux sans connexion Telegram
        run: |
          python -m unittest discover -s tests -p 'test_catalog_stage12.py' -v
          python -m unittest discover -s tests -p 'test_cinex_github_control.py' -v
      - name: Vérifier l'accès Cloudflare D1
        shell: bash
        run: test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Token Cloudflare D1 indisponible"; exit 1; }
      - name: Appliquer GitHub true/false immédiatement dans D1 (verrou)
        run: python scripts/cinex_github_control.py --toggle-only
      - name: Vérifier Telegram et le contrôle global GitHub si true
        if: ${{ env.CINEX_DOWNLOADS_ENABLED == 'true' }}
        shell: bash
        run: |
          test -n "$TG_API_ID" && test -n "$TG_API_HASH" && test -n "$TG_STRING_SESSION" || { echo "::error::Identifiants Telegram absents"; exit 1; }
          test "$CINEX_DOWNLOADS_ENABLED" = true || { echo "::error::Interrupteur CineX non activé"; exit 1; }
      - name: Auditer les vidéothèques puis synchroniser le catalogue D1 si true
        if: ${{ env.CINEX_DOWNLOADS_ENABLED == 'true' }}
        run: python scripts/catalog_stage12.py --scan-limit 250 --sync --output "$RUNNER_TEMP/cinex-stage12-report.json"
      - name: Créer automatiquement les liens complets si true
        if: ${{ env.CINEX_DOWNLOADS_ENABLED == 'true' }}
        run: python scripts/cinex_github_control.py --report "$RUNNER_TEMP/cinex-stage12-report.json"
      - name: Retirer le rapport temporaire des espaces partages
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/cinex-stage12-report.json"
