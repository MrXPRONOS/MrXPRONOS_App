name: CineX - Inventaire lecture seule et catalogue D1 (etapes 1-2)
# Revalidate the newly-authorized CineRadar bot membership after PR #503.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cinex-catalog-stage12.yml'
      - 'telegram-film-relay/scripts/catalog_stage12.py'
      - 'cinecanaux/migrations/014_cinex_delivery_catalog.sql'
  schedule:
    - cron: '23 2 * * *'
permissions:
  contents: read
concurrency:
  group: mrx-telegram-personal-account
  cancel-in-progress: false
jobs:
  catalog:
    name: Valider les nouvelles videotheques et synchroniser D1 sans media
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: telegram-film-relay
    env:
      PYTHONPATH: .
      TG_API_ID: ${{ secrets.TG_API_ID }}
      TG_API_HASH: ${{ secrets.TG_API_HASH }}
      TG_STRING_SESSION: ${{ secrets.TG_SESSION_STRING || secrets.TG_STRING_SESSION || secrets.TG_STREAM_SESSION }}
      SERIES_PRIVATE_CHANNEL: ${{ vars.SERIES_PRIVATE_CHANNEL }}
      SERIES_PUBLIC_CHANNEL: ${{ vars.SERIES_PUBLIC_CHANNEL || '@seriesvf_cinex' }}
      SERIES_RIGHTS_ATTESTED: ${{ vars.SERIES_RIGHTS_ATTESTED }}
      ACTION_PRIVATE_CHANNEL: ${{ vars.ACTION_PRIVATE_CHANNEL }}
      ACTION_PUBLIC_CHANNEL: ${{ vars.ACTION_PUBLIC_CHANNEL || '@filmsaction2026vf' }}
      ACTION_RIGHTS_ATTESTED: ${{ vars.ACTION_RIGHTS_ATTESTED }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: '9c86118191b804d91b5f5b2c89114999'
      CINERADAR_D1_DATABASE_ID: 'fa8b5009-bc1a-4a6e-b143-7a487c7297a5'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer Telethon et Requests
        run: python -m pip install -r requirements.txt
      - name: Tests locaux sans connexion Telegram
        run: python -m unittest discover -s tests -p 'test_catalog_stage12.py' -v
      - name: Interdire une execution sans secrets de lecture et D1
        shell: bash
        run: |
          test -n "$TG_API_ID" && test -n "$TG_API_HASH" && test -n "$TG_STRING_SESSION" || { echo "::error::Identifiants Telegram absents"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Token Cloudflare D1 indisponible"; exit 1; }
          test "$SERIES_RIGHTS_ATTESTED" = true && test "$ACTION_RIGHTS_ATTESTED" = true || { echo "::error::Autorisations propriétaires non confirmées"; exit 1; }
      - name: Auditer uniquement les nouveaux canaux puis importer des metadonnees non actives
        run: python scripts/catalog_stage12.py --scan-limit 250 --sync --output "$RUNNER_TEMP/cinex-stage12-report.json"
      - name: Retirer le rapport temporaire des espaces partages
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/cinex-stage12-report.json"
