name: Football API payload probe (read-only)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/football-source-live-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect non-secret provider payload schemas
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.error
          from datetime import datetime, timezone
          today=datetime.now(timezone.utc).strftime('%Y-%m-%d')
          tests={
            "sportscore_live_fixtures":f"https://sportscore.com/api/v1/fixtures/?sport=football&date={today}&status=live&limit=20",
            "sportscore_match_detail":"https://sportscore.com/api/v1/match/?sport=football&slug=cs-cartagines-vs-puntarenas-fc",
            "thesportsdb_example_stats":"https://www.thesportsdb.com/api/v1/json/123/lookupeventstats.php?id=1032723",
            "openliga_matches":"https://api.openligadb.de/getmatchdata/bl1/2026",
            "bsd_coverage":"https://sports.bzzoiro.com/api/v2/coverage/?sport=football",
          }
          def summary(v,depth=0):
            if depth>3: return str(type(v).__name__)
            if isinstance(v,list):
              return {"array_length":len(v),"first":summary(v[0],depth+1) if v else None}
            if isinstance(v,dict):
              result={"keys":list(v.keys())[:45]}
              for k in ("matches","fixtures","match","data","events","eventstats","statistics","stats","state","status","status_text","minute","elapsed","clock","timeline"):
                if k in v:result[k]=summary(v[k],depth+1)
              return result
            if isinstance(v,(str,int,float,bool)) or v is None:
              return str(v)[:90]
            return str(type(v).__name__)
          for name,url in tests.items():
            try:
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'MrXPRONOS-Diagnostic/1.0','Accept':'application/json'}),timeout=13) as r:
                payload=json.loads(r.read(2000000))
                print("SOURCE_PROBE",json.dumps({"source":name,"http_status":r.status,"summary":summary(payload)},ensure_ascii=False))
                if name=="bsd_coverage":
                  print("BSD_COVERAGE",json.dumps({
                    "live_now":payload.get("live_now") if isinstance(payload,dict) else None,
                    "football":next(({"sport":x.get("sport"),"live_now":x.get("live_now"),"events_live":x.get("events_live"),"keys":list(x.keys())[:24]} for x in (payload.get("sports") or []) if isinstance(x,dict) and str(x.get("sport","")).lower()=="football"),None) if isinstance(payload,dict) else None,
                    "schema_keys":list(payload.keys())[:20] if isinstance(payload,dict) else [],
                  },ensure_ascii=False))
                if name=="sportscore_match_detail":
                  detail=payload.get("match",{}) if isinstance(payload,dict) else {}
                  rows=detail.get("stats",[])
                  print("SOURCE_DETAIL_DATA",json.dumps({
                    "live_minute":detail.get("live_minute"),
                    "stats":[{"label":x.get("label"),"home":x.get("home"),"away":x.get("away"),"suffix":x.get("suffix")} for x in rows[:15] if isinstance(x,dict)]
                  },ensure_ascii=False))
            except urllib.error.HTTPError as e:
              print("SOURCE_PROBE",json.dumps({"source":name,"http_status":e.code,"error":"provider HTTP error"}))
            except Exception as e:
              print("SOURCE_PROBE",json.dumps({"source":name,"error":type(e).__name__}))
          PY
