name: BSD V2 settlement — read-only production proof
on:
  pull_request:
    paths:
      - 'scripts/bsd_settlement_readonly_health.py'
      - 'tests/test_bsd_settlement_readonly_health.py'
      - '.github/workflows/bsd-v2-settlement-readonly-health.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/bsd_settlement_readonly_health.py'
      - 'tests/test_bsd_settlement_readonly_health.py'
      - '.github/workflows/bsd-v2-settlement-readonly-health.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bsd-v2-readonly-settlement-health
  cancel-in-progress: false
jobs:
  offline:
    name: Verify settlement audit never invents results
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/bsd
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install BSD test dependencies
        run: python -m pip install requests cryptography Pillow 'lightgbm>=4.4,<5' scikit-learn
      - name: Compile and run focused offline safety tests
        run: |
          python -m py_compile scripts/bsd_settlement_readonly_health.py
          python -m unittest tests.test_bsd_settlement_readonly_health -v
  inspect_live:
    name: Inspect actual pending BSD scores, without publishing
    if: github.event_name != 'pull_request'
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/bsd
      BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install BSD production client dependencies
        run: python -m pip install requests cryptography Pillow 'lightgbm>=4.4,<5' scikit-learn
      - name: Inspect recent live settlement state and verify no file writes
        run: |
          set -euo pipefail
          test -n "$BSD_API_KEY"
          before="$(sha256sum data.json bsd/publication_ledger.json bsd/quality_report.json)"
          python -m scripts.bsd_settlement_readonly_health
          after="$(sha256sum data.json bsd/publication_ledger.json bsd/quality_report.json)"
          test "$before" = "$after"
          test -z "$(git status --porcelain -- data.json bsd/publication_ledger.json bsd/quality_report.json)"
          echo "BSD_SETTLEMENT_READONLY_PRODUCTION_UNCHANGED"
