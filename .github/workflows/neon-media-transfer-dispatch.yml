name: Mr XPRONOS - Transfer 113 videos to Neon

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/neon-media-transfer-dispatch.yml'
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type COPY113 to transfer and verify videos"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mrx-neon-media-one-time
  cancel-in-progress: false

jobs:
  transfer:
    if: ${{ github.event_name == 'push' || inputs.confirm == 'COPY113' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout reviewed migration script (does not deploy site)
        uses: actions/checkout@v4
        with:
          ref: migration/supabase-to-free-stack-20261022
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tools
        run: python -m pip install --disable-pip-version-check 'boto3>=1.35,<2' 'requests>=2.32,<3'
      - name: Verify inventory and secret presence without disclosure
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEON_S3_ACCESS_KEY_ID: ${{ secrets.NEON_S3_ACCESS_KEY_ID }}
          NEON_S3_SECRET_ACCESS_KEY: ${{ secrets.NEON_S3_SECRET_ACCESS_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          files=json.load(open('migration/free-stack/media-inventory.json',encoding='utf8'))
          assert len(files)==113 and sum(int(x['size']) for x in files)==215013480, "Inventory mismatch"
          for k in ('SUPABASE_SERVICE_ROLE_KEY','NEON_S3_ACCESS_KEY_ID','NEON_S3_SECRET_ACCESS_KEY'):
              if not os.getenv(k): raise SystemExit('Missing GitHub secret: '+k)
          print('Validated: 113 objects, 215013480 bytes, credentials available.')
          PY
      - name: Copy and verify every MP4
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEON_S3_ENDPOINT: "https://br-winter-truth-b9of9tss.storage.c-7.eu-central-1.aws.neon.tech"
          NEON_S3_ACCESS_KEY_ID: ${{ secrets.NEON_S3_ACCESS_KEY_ID }}
          NEON_S3_SECRET_ACCESS_KEY: ${{ secrets.NEON_S3_SECRET_ACCESS_KEY }}
        run: python migration/free-stack/migrate_media.py
      - name: Final verification of object inventory
        env:
          NEON_S3_ENDPOINT: "https://br-winter-truth-b9of9tss.storage.c-7.eu-central-1.aws.neon.tech"
          NEON_S3_ACCESS_KEY_ID: ${{ secrets.NEON_S3_ACCESS_KEY_ID }}
          NEON_S3_SECRET_ACCESS_KEY: ${{ secrets.NEON_S3_SECRET_ACCESS_KEY }}
        run: |
          python - <<'PY'
          import os,boto3,json
          from botocore.config import Config
          inventory=json.load(open("migration/free-stack/media-inventory.json"))
          s3=boto3.client('s3',endpoint_url=os.environ['NEON_S3_ENDPOINT'],region_name='eu-central-1',aws_access_key_id=os.environ['NEON_S3_ACCESS_KEY_ID'],aws_secret_access_key=os.environ['NEON_S3_SECRET_ACCESS_KEY'],config=Config(s3={'addressing_style':'path'}))
          size=0
          for item in inventory:
              head=s3.head_object(Bucket='videos',Key=item['name'])
              assert int(head['ContentLength'])==int(item['size']),"size mismatch"
              size+=int(head['ContentLength'])
          assert size==215013480
          print("Neon objects verified:",len(inventory),"bytes:",size)
          PY
