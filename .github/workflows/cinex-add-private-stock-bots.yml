name: CineX - ajouter les bots verifies au stock Telegram prive
on:
  push:
    branches: [main]
    paths: ['telegram-film-relay/.cinex-stock-add-bots-once']
  workflow_dispatch:
    inputs:
      apply:
        type: boolean
        required: false
        default: false
        description: 'Ajouter les bots verifies (simulation sinon)'
permissions:
  contents: read
concurrency:
  group: mrx-telegram-personal-account
  cancel-in-progress: false
  queue: max
jobs:
  add-bots:
    if: github.repository == 'MrXPRONOS/MrXPRONOS_App' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: telegram-film-relay
    env:
      TG_API_ID: ${{ secrets.TG_API_ID }}
      TG_API_HASH: ${{ secrets.TG_API_HASH }}
      TG_STRING_SESSION: ${{ secrets.TG_SESSION_STRING || secrets.TG_STRING_SESSION || secrets.TG_STREAM_SESSION }}
      CINEX_RADAR_BOT_TOKEN: ${{ secrets.CINEX_RADAR_BOT_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      CINEX_PUBLISH_BOT_TOKEN: ${{ secrets.CINEX_PUBLISH_BOT_TOKEN }}
      CINEX_PUBLISH_BOT_USERNAME: ${{ vars.CINEX_PUBLISH_BOT_USERNAME }}
      CINEX_BOT_TOKEN: ${{ secrets.CINEX_BOT_TOKEN }}
      FOOTBALL_NEWS_BOT_TOKEN: ${{ secrets.FOOTBALL_NEWS_BOT_TOKEN }}
      SERIES_BOT_TOKEN: ${{ secrets.SERIES_BOT_TOKEN }}
      ANIME_BOT_TOKEN: ${{ secrets.ANIME_BOT_TOKEN }}
      ACTION_BOT_TOKEN: ${{ secrets.ACTION_BOT_TOKEN }}
      DESIR_BOT_TOKEN: ${{ secrets.DESIR_BOT_TOKEN }}
      COMEDIE_BOT_TOKEN: ${{ secrets.COMEDIE_BOT_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Bloquer l'execution en cas de FloodWait du compte personnel
        env:
          TG_PERSONAL_COOLDOWN_UNTIL_UTC: ${{ vars.TG_PERSONAL_COOLDOWN_UNTIL_UTC }}
        run: python scripts/check_personal_cooldown.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: telegram-film-relay/requirements.txt
      - name: Installer les dependances verrouillees
        run: python -m pip install -r requirements.txt
      - name: Tests hors connexion - identites, anti-doublons et droits minimaux
        run: python -m unittest discover -s tests -p 'test_add_private_stock_bots.py' -v
      - name: Verifier la presence des identifiants sans les afficher
        run: |
          test -n "${TG_API_ID:-}" && test -n "${TG_API_HASH:-}" &&
          test -n "${TG_STRING_SESSION:-}" && test -n "${CLOUDFLARE_API_TOKEN:-}"
      - name: Ajouter les bots au stock prive existant, sans creer de canal ni partager de films
        if: ${{ github.event_name == 'push' || inputs.apply }}
        run: python scripts/add_private_stock_bots.py --apply
      - name: Audit uniquement, sans ouvrir la session personnelle
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.apply }}
        run: python scripts/add_private_stock_bots.py
