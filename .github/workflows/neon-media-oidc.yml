name: Neon OIDC media validation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/neon-media-oidc.yml']
  workflow_dispatch:
    inputs:
      confirm:
        description: Type COPY113
        required: true
        type: string
permissions:
  contents: read
  id-token: write
jobs:
  transfer:
    if: ${{ github.event_name == 'push' || inputs.confirm == 'COPY113' }}
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/supabase-to-free-stack-20261022
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - name: Verify media on Neon with GitHub OIDC
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python migration/free-stack/migrate_media_oidc.py
