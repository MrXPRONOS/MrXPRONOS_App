name: RETIRED - neon media oidc
on:
  push:
    branches: [main]
    paths: ['.github/workflows/neon-media-oidc.yml']
  workflow_dispatch:
    inputs:
      confirm:
        description: Type COPY113
        required: true
        type: string
permissions:
  contents: read
  id-token: write
jobs:
  transfer:
    if: ${{ false }} # Old Supabase-dependent recovery cannot run against offline Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/supabase-to-free-stack-20261022
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile migration/free-stack/migrate_media_oidc.py
      - run: python -m pip install requests
      - name: Verify media on Neon with GitHub OIDC
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEON_MEDIA_SMOKE: '0'
        run: python migration/free-stack/migrate_media_oidc.py
