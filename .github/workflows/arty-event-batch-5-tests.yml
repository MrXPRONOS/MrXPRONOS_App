name: Arty Football - Test event template batch 5

on:
  push:
    branches:
      - arty-templates-batch-5-20261013
    paths:
      - '.github/workflows/arty-event-batch-5-tests.yml'
      - 'scripts/actu_foot_event_templates.py'
      - 'scripts/template_cards.py'
      - 'scripts/build_event_batch_5_assets.py'
      - 'tests_football_channel/test_event_template_batch_1.py'
      - 'tests_football_channel/test_event_template_batch_2.py'
      - 'tests_football_channel/test_event_template_batch_3.py'
      - 'tests_football_channel/test_event_template_batch_4.py'
      - 'tests_football_channel/test_event_template_batch_5.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-event-templates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet Pillow requests
      - name: Compile template modules
        run: python -m py_compile scripts/actu_foot_event_templates.py scripts/template_cards.py scripts/build_event_batch_5_assets.py
      - name: Run batch 1 regression tests
        run: PYTHONPATH=scripts python tests_football_channel/test_event_template_batch_1.py
      - name: Run batch 2 regression tests
        run: PYTHONPATH=scripts python tests_football_channel/test_event_template_batch_2.py
      - name: Run batch 3 regression tests
        run: PYTHONPATH=scripts python tests_football_channel/test_event_template_batch_3.py
      - name: Run batch 4 regression tests
        run: PYTHONPATH=scripts python tests_football_channel/test_event_template_batch_4.py
      - name: Run batch 5 tests
        run: PYTHONPATH=scripts python tests_football_channel/test_event_template_batch_5.py
