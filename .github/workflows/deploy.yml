name: Deploy to GitHub Pages

permissions:
  contents: write

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: github-pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate config.js from template
        run: |
          sed "s|SUPABASE_URL|${{ secrets.SUPABASE_URL }}|g; s|SUPABASE_ANON_KEY|${{ secrets.SUPABASE_ANON_KEY }}|g" config.template.js > assets/js/config.js

      - name: Generate admin config (optional)
        run: |
          if [ -n "${{ secrets.ADMIN_USER }}" ] && [ -n "${{ secrets.ADMIN_PASSWORD }}" ]; then
            PASSWORD_HASH=$(echo -n "${{ secrets.ADMIN_PASSWORD }}" | openssl dgst -sha256 | awk '{print $2}')
            sed "s|ADMIN_USER|${{ secrets.ADMIN_USER }}|g; s|ADMIN_PASSWORD_HASH|$PASSWORD_HASH|g" admin-config.template.js > assets/js/admin-config.js
            echo "Admin config generated."
          else
            echo "Secrets ADMIN_USER and ADMIN_PASSWORD not set, skipping admin config generation."
          fi

      - name: Generate MX PWA icons
        run: |
          python -m pip install --disable-pip-version-check "Pillow>=10,<12"
          python scripts/build_brand_icons.py

      - name: Store refreshed icon PNGs in main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/icon-*.png assets/images/apple-touch-icon.png assets/images/favicon.png assets/images/favicon.webp
          if ! git diff --cached --quiet; then
            git commit -m "assets: synchronize PWA icons with crowned MX [skip ci]"
            git push origin HEAD:main || echo "::warning::PWA icons deployed but main synchronization failed"
          fi

      # Re-publish after repairing a stale file/directory collision on gh-pages.
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          destination_dir: ./
          keep_files: true