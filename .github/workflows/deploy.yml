name: Deploy to GitHub Pages

permissions:
  contents: write

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: github-pages-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate config.js from template
        run: |
          sed "s|SUPABASE_URL|${{ secrets.SUPABASE_URL }}|g; s|SUPABASE_ANON_KEY|${{ secrets.SUPABASE_ANON_KEY }}|g" config.template.js > assets/js/config.js

      - name: Checkout previously published public media
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: _previous_pages
          sparse-checkout: |
            assets/images/footnews
            assets/images/arty_football
            proofs
          sparse-checkout-cone-mode: true

      - name: Generate MX PWA icons
        run: |
          python -m pip install --disable-pip-version-check "Pillow>=10,<12"
          python scripts/build_brand_icons.py

      - name: Store refreshed icon PNGs in main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/icon-*.png assets/images/apple-touch-icon.png assets/images/favicon.png assets/images/favicon.webp
          if ! git diff --cached --quiet; then
            git commit -m "assets: synchronize PWA icons with crowned MX [skip ci]"
            git push origin HEAD:main || echo "::warning::PWA icons deployed but main synchronization failed"
          fi

      - name: Build and verify strictly public artifact
        run: |
          python -m unittest discover -s tests -p 'test_public_proof_receipts.py' -v
          python -m unittest discover -s tests -p 'test_public_admin_shell.py' -v
          python scripts/build_public_site.py --out _public_site --previous _previous_pages
          python - <<'PY'
          from pathlib import Path
          root=Path("_public_site")
          assert (root/"index.html").exists()
          assert (root/"pronos.html").exists()
          assert (root/"data.json").exists()
          for path in ("bsd", "supabase", "scripts", "tests", "node_modules", "model_meta.json", "assets/data/private"):
              assert not (root/path).exists(), f"Unexpected internal file: {path}"
          print("PUBLIC_ONLY_ARTIFACT_VALIDATED")
          PY

      # Replace stale root publishing: keep_files:true left internal code, docs and
      # encrypted archive files publicly accessible on gh-pages.

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_public_site
          destination_dir: ./
          keep_files: false
      - name: Verify Infos Foot JSON reached gh-pages
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -s _public_site/footnews.json
          for attempt in 1 2 3 4 5; do
            # pages deploy action may remove/reset local .git; use GitHub API,
            # which works independently of the checkout state.
            if gh api -H "Accept: application/vnd.github.raw+json" \
                "/repos/${GITHUB_REPOSITORY}/contents/footnews.json?ref=gh-pages" \
                > /tmp/footnews-deployed.json 2>/dev/null; then
              if cmp -s _public_site/footnews.json /tmp/footnews-deployed.json; then
                echo "ACTUFOOT_GITHUB_PAGES_DEPLOY_CONFIRMED"
                python - <<'PY'
          import json
          from pathlib import Path
          p=Path("_public_site/footnews.json")
          items=json.loads(p.read_text(encoding="utf-8"))
          assert isinstance(items,list) and len(items)>0
          print("ACTUFOOT_PUBLIC_ARTICLES",len(items))
          PY
                exit 0
              fi
            fi
            sleep 5
          done
          echo "::error::Gh-pages football news JSON out of sync"
          exit 1

      - name: Verify the actual published admin dashboard assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for path in admin.html service-worker.js assets/js/admin-home.mjs assets/js/admin-real.js assets/css/admin-home.css assets/images/admin-home-ball-reference.webp assets/images/admin-home-lights-reference.webp; do
            local_file="_public_site/$path"
            test -s "$local_file"
            deployed_file="$(mktemp)"
            gh api -H "Accept: application/vnd.github.raw+json" \
              "/repos/${GITHUB_REPOSITORY}/contents/${path}?ref=gh-pages" > "$deployed_file"
            cmp "$local_file" "$deployed_file" || { echo "::error::Stale deployed file: $path"; exit 1; }
            rm -f "$deployed_file"
            echo "ADMIN_PAGES_ASSET_IN_SYNC: $path"
          done
          grep -q 'future-dashboard-v2-20261110' _public_site/admin.html
          echo "ADMIN_PAGES_FUTURISTIC_DASHBOARD_CONFIRMED"

      - name: Check public GitHub Pages edge is serving the refreshed admin shell
        continue-on-error: true
        shell: bash
        env:
          GITHUB_SHA_VALUE: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os,time,urllib.request
          url="https://mrxpronos.github.io/MrXPRONOS_App/admin.html?mx-release="+os.environ["GITHUB_SHA_VALUE"][:12]
          for attempt in range(1,13):
              try:
                  req=urllib.request.Request(url,headers={"Cache-Control":"no-cache","User-Agent":"MrXPRONOS-Deploy-Verification"})
                  with urllib.request.urlopen(req,timeout=14) as response:
                      html=response.read().decode("utf-8")
                  if "future-dashboard-v2-20261110" in html and "admin-home.css" in html:
                      print("LIVE_ADMIN_HOME_V2_CONFIRMED",url)
                      break
                  print("Admin CDN still showing a previous HTML release",attempt)
              except Exception as exc:
                  print("Admin edge check retry:",attempt,type(exc).__name__,str(exc)[:150])
              time.sleep(6)
          else:
              raise SystemExit("Admin CDN did not yet expose the latest dashboard; gh-pages branch was verified separately")
          PY
