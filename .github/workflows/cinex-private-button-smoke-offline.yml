name: CineX - Private button smoke offline tests
on:
  pull_request:
    paths:
      - 'scripts/cinex_private_button_smoke.py'
      - 'tests/test_cinex_private_button_smoke.py'
      - '.github/workflows/cinex-private-button-smoke*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'requests==2.32.5'
      - run: python -m unittest discover -s tests -p test_cinex_private_button_smoke.py -v
