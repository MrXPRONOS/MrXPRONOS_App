name: Top10 selection - popular first, complete with eligible clubs

on:
  pull_request:
    paths:
      - 'dixon-coles/dcscore/daily_rank.py'
      - 'dixon-coles/dcscore/daily_pipeline.py'
      - 'dixon-coles/tests/test_daily_top10_v3.py'
      - '.github/workflows/top10-selection-popular-fill.yml'

permissions:
  contents: read

jobs:
  selection_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original Dixon-Coles and test dependencies
        run: python -m pip install -e 'dixon-coles[test,video]'
      - name: Check priority tiers, fallback clubs, historical gates and identical clip schema
        run: |
          python -m pytest -q \
            dixon-coles/tests/test_daily_top10_v3.py \
            dixon-coles/tests/test_daily_popularity_v2.py
      - name: Run all independent predictor regression tests
        run: python -m pytest -q dixon-coles/tests
      - name: Ensure video and social files have NOT been changed
        run: |
          python - <<'PY'
          import subprocess
          changed=subprocess.check_output(
              ['git','diff','--name-only','origin/main...HEAD'],text=True).splitlines()
          allowed={
              'dixon-coles/dcscore/daily_rank.py',
              'dixon-coles/dcscore/daily_pipeline.py',
              'dixon-coles/tests/test_daily_top10_v3.py',
              '.github/workflows/top10-selection-popular-fill.yml',
          }
          unexpected=set(changed)-allowed
          print('SELECTION_ONLY_CHANGED_FILES',changed)
          if unexpected:
              raise SystemExit('Changes outside ranking/tests: '+', '.join(sorted(unexpected)))
          PY
