name: Actu Crypto - 04 ALERTES PREMIUM V2 TEST ONLY

on:
  push:
    branches: [feature/actu-crypto-lot-01-05]
    paths:
      - 'crypto/export_alerts_v2.py'
      - 'crypto/test_alerts_v2.py'
      - 'crypto/send_crypto_alerts_v2_test.py'
      - 'crypto/send_crypto_alerts_v2_demo_test.py'
      - 'scripts/render_crypto_alerts_v2.mjs'
      - '.github/workflows/actu-crypto-alerts-v2-test.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: actu-crypto-alerts-v2-test
  cancel-in-progress: false

jobs:
  alert-v2-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FOOTBALL_NEWS_BOT_TOKEN: ${{ secrets.FOOTBALL_NEWS_BOT_TOKEN }}
      TELEGRAM_TEST_CHAT_ID: '@predict_mrxp'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install free libraries
        run: |
          python -m pip install 'requests>=2.31,<3' 'Pillow>=10,<12'
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Unit tests for real thresholds and fail-closed conditions
        run: python -m unittest crypto.test_alerts_v2 -v
      - name: Create explicitly fictional DESIGN preview offline
        run: |
          python -m crypto.export_alerts_v2 --demo
          node scripts/render_crypto_alerts_v2.mjs --demo
      - name: Archive SIMULATION preview for test only
        uses: actions/upload-artifact@v4
        with:
          name: crypto-publication-04-alerts-premium-DEMO
          path: crypto/generated/test/alerts_v2_demo.png
          if-no-files-found: error
          retention-days: 14
      - name: Check LIVE variations of five major cryptos
        run: python -m crypto.export_alerts_v2
      - name: Detect if a real 5% threshold is observed
        id: ready
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=json.loads(Path('crypto/generated/test/alerts_v2_data.json').read_text())
          active=p.get('status')=='real_alert' and p.get('is_demo') is False
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('active='+('true' if active else 'false')+'\n')
          print('REAL_ALERT_ACTIVE',active)
          PY
      - name: Render real alert ONLY when a genuine threshold exists
        if: steps.ready.outputs.active == 'true'
        run: node scripts/render_crypto_alerts_v2.mjs
      - name: Archive REAL market alert
        if: steps.ready.outputs.active == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: crypto-publication-04-alerts-premium-REAL
          path: crypto/generated/test/alerts_v2.png
          if-no-files-found: error
          retention-days: 14
      - name: Send ONLY a REAL alert to verified @predict_mrxp
        if: steps.ready.outputs.active == 'true'
        run: python -m crypto.send_crypto_alerts_v2_test
      - name: No real threshold - send clearly labeled DEMO to test channel
        if: steps.ready.outputs.active != 'true'
        run: |
          echo "No eligible ±5% 24h market change. A labeled, fictional design TEST is sent to @predict_mrxp, never a real market alert."
          python -m crypto.send_crypto_alerts_v2_demo_test