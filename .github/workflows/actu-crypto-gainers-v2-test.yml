name: Actu Crypto - 02 TOP HAUSSES V2 TEST ONLY

on:
  push:
    branches: [feature/actu-crypto-lot-01-05]
    paths:
      - 'crypto/export_gainers_v2.py'
      - 'crypto/send_crypto_gainers_v2_test.py'
      - 'scripts/render_crypto_gainers_v2.mjs'
      - '.github/workflows/actu-crypto-gainers-v2-test.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: actu-crypto-gainers-v2-test
  cancel-in-progress: false

jobs:
  gainers-v2-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FOOTBALL_NEWS_BOT_TOKEN: ${{ secrets.FOOTBALL_NEWS_BOT_TOKEN }}
      TELEGRAM_TEST_CHAT_ID: '@predict_mrxp'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install free libraries
        run: |
          python -m pip install 'requests>=2.31,<3' 'Pillow>=10,<12'
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Retrieve real top-five gainers
        run: python -m crypto.export_gainers_v2
      - name: Render V2 gainers (legacy unchanged)
        run: node scripts/render_crypto_gainers_v2.mjs
      - name: Archive test poster
        uses: actions/upload-artifact@v4
        with:
          name: crypto-publication-02-gainers-v2
          path: crypto/generated/test/gainers_v2.png
          if-no-files-found: error
          retention-days: 14
      - name: Send ONLY to verified @predict_mrxp
        run: python -m crypto.send_crypto_gainers_v2_test
