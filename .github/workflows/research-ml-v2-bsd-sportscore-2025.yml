name: Research ML V2 - BSD SportScore whole year 2025
# Rerun after date-scoped SportScore identity regression fix
on:
  push:
    branches: [research/single-ml-v2-20261024]
    paths: ['.github/workflows/research-ml-v2-bsd-sportscore-2025.yml']
permissions:
  contents: write
concurrency:
  group: ml-v2-encrypted-history
  cancel-in-progress: false
jobs:
  archive-2025:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ML_V2_HISTORY_KEY_B64: ${{ secrets.ML_V2_HISTORY_KEY_B64 }}
      BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/single-ml-v2-20261024
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated research packages
        run: python -m pip install cryptography requests
      - name: Validate secret availability and 2025 collector
        run: |
          set -euo pipefail
          PYTHONPATH=.:research python - <<'PY'
          import os
          from single_ml_v2_git import key_from_environment
          assert len(key_from_environment())==32
          assert os.environ.get("BSD_API_KEY")
          print("Historical 2025 archive can be encrypted; BSD API credential exists")
          PY
      - name: Test date-scoped 2025 pagination and source IDs
        run: PYTHONPATH=.:research python -m unittest discover -s research -p 'test_single_ml_v2_bsd_sportscore_2025.py' -v
      - name: Collect full 2025 - 12 independently encrypted monthly shards
        id: collecting
        shell: bash
        run: |
          set -euo pipefail
          set +e
          PYTHONPATH=.:research python research/single_ml_v2_bsd_sportscore_2024.py --year 2025
          code=$?
          set -e
          echo "status=$code" >> "$GITHUB_OUTPUT"
          if [[ "$code" != 0 && "$code" != 2 ]]; then
            echo "::error::2025 collector failed unexpectedly; do not discard valid partial shards"
          fi
      - name: Verify all stored 2025 encrypted sources and counts
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=.:research python - <<'PY'
          from pathlib import Path
          from single_ml_v2_git import key_from_environment,open_sealed
          key=key_from_environment()
          checked=0;total=0;failed=0;atcap=0
          for m in range(1,13):
              p=Path(f"research/encrypted_football/bsd_sportscore/2025/{m:02d}.enc")
              if not p.exists():continue
              doc=open_sealed(p.read_bytes(),key,
                        "bsd-sportscore-2025-month:"+str(m))
              assert doc["schema"]=="bsd_sportscore_2025_private_verified_v1"
              assert doc["year"]==2025 and doc["month"]==m
              assert all(x["date"].startswith(f"2025-{m:02d}-") for x in doc["matches"])
              audit=doc["audit"];assert audit["bsd"]["reported"]>=audit["bsd"]["parsed"]
              total+=len(doc["matches"])
              atcap+=audit["sportscore"]["days_at_200_cap_incomplete"]
              failed+=audit["sportscore"]["days_failed"]
              checked+=1
          print("2025_MONTHS_ENCRYPTED",checked)
          print("2025_PROVIDER_SOURCE_MATCHES",total)
          print("2025_SPORTSCORE_FAILED_DAYS",failed)
          print("2025_SPORTSCORE_DAYS_AT_CAP",atcap)
          if not checked:raise SystemExit("ERROR no certified 2025 encrypted source")
          PY
      - name: Commit only 2025 encrypted monthly checkpoints
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/encrypted_football/bsd_sportscore/2025/
          unexpected="$(git diff --cached --name-only | grep -Ev '^research/encrypted_football/bsd_sportscore/2025/(0[1-9]|1[0-2])\.enc$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "::error::Unexpected staged plaintext"; exit 1
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'data(research): full-year 2025 BSD and SportScore encrypted results'
            git fetch origin research/single-ml-v2-20261024
            git rebase origin/research/single-ml-v2-20261024
            git push origin HEAD:research/single-ml-v2-20261024
          fi
      - name: Require whole-year success, not partial green
        shell: bash
        env:
          EXIT_CODE: ${{ steps.collecting.outputs.status }}
        run: |
          if [[ "$EXIT_CODE" != 0 ]]; then
            echo "::error::2025 archive only partially recovered; encrypted months committed safely"
            exit 1
          fi
          echo '2025 calendar year completed through BSD and SportScore with transparent daily limits'
