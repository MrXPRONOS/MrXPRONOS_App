name: Live match corners (one shot)
on:
  push:
    branches: [diagnostic/bookmaker-odds]
    paths:
      - "tools/odds_diagnostic/targeted_match_probe.py"
      - ".github/workflows/targeted-live-corners.yml"
  pull_request:
    branches: [main]
    paths:
      - "tools/odds_diagnostic/targeted_match_probe.py"
      - ".github/workflows/targeted-live-corners.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quote:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Test live match corner quote
        run: python tools/odds_diagnostic/targeted_match_probe.py
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: targeted-live-corners
          path: odds_diagnostic_results/targeted_match_probe.json
          if-no-files-found: warn
