name: Mr XPRONOS - CI media football

on:
  pull_request:
    paths:
      - 'scripts/football_channel.py'
      - 'scripts/football_news_engine.py'
      - 'fetch_foot_news.py'
      - 'assets/js/main.js'
      - 'assets/css/infos-premium.css'
      - 'infos.html'
      - 'tests_football_channel/**'
      - '.github/workflows/football-channel.yml'
  # Verification CI sans envoi Telegram lors des modifications du diffuseur.
  push:
    branches: [main]
    paths:
      - 'scripts/football_channel.py'
      - 'scripts/football_news_engine.py'
      - 'fetch_foot_news.py'
      - 'assets/js/main.js'
      - 'assets/css/infos-premium.css'
      - 'infos.html'
      - 'scripts/football_cards.py'
      - 'scripts/programme_styles.py'
      - 'scripts/template_cards.py'
      - 'assets/images/template_programme_matchs_du_jour.png'
      - 'assets/images/template_avant_match.png'
      - 'assets/images/template_resultat_final.png'
      - 'assets/images/template_stat_du_jour.png'
      - 'assets/images/template_flash_foot.png'
      - 'assets/images/template_sondage.png'
      - 'tests_football_channel/**'
      - '.github/workflows/football-channel.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mrxpronos-media-football
  cancel-in-progress: false

jobs:
  editorial:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
      FOOTBALL_NEWS_BOT_TOKEN: ${{ secrets.FOOTBALL_NEWS_BOT_TOKEN }}
      FOOTBALL_NEWS_CHAT_ID: ${{ secrets.FOOTBALL_NEWS_CHAT_ID }}
      FOOTBALL_RSS_FEED: https://www.footmercato.net/flux-rss
      FOOTBALL_BSD_REQUEST_BUDGET: '18'
      FOOTBALL_REQUIRE_COMMENTS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer les dépendances du canal et des flux gratuits
        run: python -m pip install requests Pillow feedparser
      - name: Compiler le moteur News Football
        run: python -m py_compile fetch_foot_news.py scripts/football_news_engine.py scripts/football_channel.py
      - name: Vérifier le JavaScript Infos Foot
        run: node --check assets/js/main.js
      - name: Tester réellement les flux News Football sans publication
        env:
          MAX_ARTICLES: '12'
          MAX_ARTICLES_PER_FEED: '6'
          MAX_NEWS_AGE_HOURS: '168'
        run: |
          python fetch_foot_news.py
          python - <<'PY'
          import json
          from pathlib import Path
          rows=json.loads(Path("footnews.json").read_text(encoding="utf-8"))
          assert len(rows)>=3, f"Couverture RSS insuffisante: {len(rows)}"
          assert all(x.get("image_origin")=="source" for x in rows)
          assert all(Path(x["image"]).is_file() for x in rows)
          assert all(x.get("content") and x.get("telegram_summary") and x.get("site_url") for x in rows)
          print("NEWS_FREE_SOURCES_OK",len(rows),sorted({x.get("source") for x in rows}))
          PY
      - name: Verifier la presence des 6 templates premium
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          names = [
            'template_programme_matchs_du_jour.png',
            'template_avant_match.png',
            'template_resultat_final.png',
            'template_stat_du_jour.png',
            'template_flash_foot.png',
            'template_sondage.png',
          ]
          for name in names:
              path = Path('assets/images') / name
              assert path.is_file(), path
              with Image.open(path) as image:
                  w, h = image.size
                  assert w == h, (path, image.size)
                  assert w >= 900, (path, image.size)
                  print('TEMPLATE_OK', name, image.size, '-> renderer 1080x1080')
          PY
      - name: Previsualiser les 6 templates premium
        run: python scripts/render_template_previews.py /tmp/mrxpronos-template-previews
      - name: Verifier les 6 rendus
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          pictures=sorted(Path('/tmp/mrxpronos-template-previews').glob('*.png'))
          assert len(pictures)==6, len(pictures)
          for path in pictures:
              with Image.open(path) as image:
                  assert image.size == (1080,1080), (path,image.size)
                  assert image.format == 'PNG'
                  assert path.stat().st_size < 9_000_000
                  print('CARD_OK',path.name,image.size,path.stat().st_size)
          PY
      - name: Conserver les 6 apercus comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: mrxpronos-six-template-previews
          path: /tmp/mrxpronos-template-previews/*.png
          retention-days: 7
      - name: Tests du canal
        run: python -m unittest discover -s tests_football_channel -p 'test_*.py' -v
      - name: Simulation editoriale sans publication
        run: python scripts/football_channel.py --dry-run
