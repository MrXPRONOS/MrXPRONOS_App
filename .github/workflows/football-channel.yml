name: Mr XPRONOS - CI media football
# Synchronise les tests de rendu avec les 12 fonds Arty Football.

on:
  pull_request:
    paths:
      - 'scripts/football_channel.py'
      - 'scripts/football_news_engine.py'
      - 'scripts/football_match_lifecycle.py'
      - 'bsd/free_football_providers.py'
      - 'scripts/football_stats_engine.py'
      - 'scripts/football_community_engine.py'
      - 'scripts/football_viral_engine.py'
      - 'fetch_foot_news.py'
      - 'scripts/template_cards.py'
      - 'scripts/render_template_previews.py'
      - 'assets/images/template_compositions_officielles.webp'
      - 'assets/js/main.js'
      - 'assets/css/infos-premium.css'
      - 'infos.html'
      - 'tests_football_channel/**'
      - '.github/workflows/football-channel.yml'
  # Verification CI sans envoi Telegram lors des modifications du diffuseur.
  push:
    branches: [main]
    paths:
      - 'scripts/football_channel.py'
      - 'scripts/football_news_engine.py'
      - 'scripts/football_match_lifecycle.py'
      - 'scripts/football_stats_engine.py'
      - 'scripts/football_community_engine.py'
      - 'scripts/football_viral_engine.py'
      - 'fetch_foot_news.py'
      - 'assets/js/main.js'
      - 'assets/css/infos-premium.css'
      - 'infos.html'
      - 'scripts/football_cards.py'
      - 'scripts/programme_styles.py'
      - 'scripts/template_cards.py'
      - 'assets/images/template_programme_matchs_du_jour.png'
      - 'assets/images/template_avant_match.png'
      - 'assets/images/template_resultat_final.png'
      - 'assets/images/template_stat_du_jour.png'
      - 'assets/images/template_flash_foot.png'
      - 'assets/images/template_sondage.png'
      - 'assets/images/template_compositions_officielles.webp'
      - 'scripts/render_template_previews.py'
      - 'tests_football_channel/**'
      - '.github/workflows/football-channel.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mrxpronos-media-football
  cancel-in-progress: false

jobs:
  editorial:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
      FOOTBALL_NEWS_BOT_TOKEN: ${{ secrets.FOOTBALL_NEWS_BOT_TOKEN }}
      FOOTBALL_NEWS_CHAT_ID: ${{ secrets.FOOTBALL_NEWS_CHAT_ID }}
      FOOTBALL_RSS_FEED: https://www.footmercato.net/flux-rss
      FOOTBALL_BSD_REQUEST_BUDGET: '18'
      FOOTBALL_ESPN_REQUEST_BUDGET: '36'
      FOOTBALL_REQUIRE_COMMENTS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer les dépendances du canal et des flux gratuits
        run: python -m pip install requests Pillow feedparser imageio-ffmpeg
      - name: Compiler le moteur News Football
        run: python -m py_compile fetch_foot_news.py scripts/football_news_engine.py scripts/football_match_lifecycle.py scripts/football_stats_engine.py scripts/football_community_engine.py scripts/football_viral_engine.py scripts/football_channel.py scripts/telegram_research/extract_history.py scripts/telegram_research/create_session.py scripts/ensure_actufoot_cronjob.py
      - name: Vérifier le JavaScript Infos Foot
        run: node --check assets/js/main.js
      - name: Tester réellement les flux News Football sans publication
        env:
          MAX_ARTICLES: '12'
          MAX_ARTICLES_PER_FEED: '6'
          MAX_NEWS_AGE_HOURS: '168'
        run: |
          python fetch_foot_news.py
          python - <<'PY'
          import json
          from pathlib import Path
          rows=json.loads(Path("footnews.json").read_text(encoding="utf-8"))
          assert len(rows)>=3, f"Couverture RSS insuffisante: {len(rows)}"
          assert all(x.get("image_origin")=="source" for x in rows)
          assert all(Path(x["image"]).is_file() for x in rows)
          assert all(x.get("content") and x.get("telegram_summary") and x.get("site_url") for x in rows)
          print("NEWS_FREE_SOURCES_OK",len(rows),sorted({x.get("source") for x in rows}))
          PY
      - name: Vérifier les sources gratuites du cycle de match
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          import requests
          import sys
          sys.path.insert(0, "scripts")
          sys.path.insert(0, "bsd")
          import football_match_lifecycle as lifecycle
          from free_football_providers import FreeFootballProviders, provider_policy

          session = requests.Session()
          today = datetime.now(timezone.utc).date()

          espn = lifecycle.fetch_espn_day(session, today)
          assert isinstance(espn, list)
          print("ESPN_FREE_OK", len(espn), "matchs", today.isoformat())

          hub = FreeFootballProviders(session=session)
          sportscore = hub.sportscore_day(today)
          assert not sportscore.error, sportscore.error
          assert isinstance(sportscore.events, list)
          print("SPORTSCORE_FREE_OK", len(sportscore.events), "matchs", dict(hub.calls))

          sport_live = hub.sportscore_live_recent(limit=50)
          assert isinstance(sport_live.events, list)
          print("SPORTSCORE_LIVE_RECENT_OK", len(sport_live.events), sport_live.error or "ok")
          live_sample = next((x for x in sport_live.events if x.get("slug")), None)
          print("SPORTSCORE_LIVE_SAMPLE", {
              "slug": live_sample.get("slug") if live_sample else "",
              "home": live_sample.get("home_team") if live_sample else "",
              "away": live_sample.get("away_team") if live_sample else "",
              "status": live_sample.get("status") if live_sample else "",
              "league": live_sample.get("league") if live_sample else "",
          })
          if live_sample:
              detail = hub.sportscore_detail(live_sample["slug"])
              print("SPORTSCORE_DETAIL_KEYS", sorted(detail.keys()) if isinstance(detail, dict) else type(detail).__name__)
              if isinstance(detail, dict):
                  for key in sorted(detail.keys())[:30]:
                      value = detail.get(key)
                      print("SPORTSCORE_DETAIL_SHAPE", key, type(value).__name__,
                            (list(value.keys())[:20] if isinstance(value, dict)
                             else len(value) if isinstance(value, list)
                             else str(value)[:120]))

          import football_stats_engine as stats_probe
          ss_slug = stats_probe._sportscore_competition_slug(session, stats_probe.LEAGUES[0])
          print("SPORTSCORE_RESOLVED_COMPETITION_SLUG", ss_slug)
          ss_table = stats_probe.fetch_sportscore_standings(session, stats_probe.LEAGUES[0])
          ss_scorers = stats_probe.fetch_sportscore_top_scorers(session, stats_probe.LEAGUES[0])
          print("SPORTSCORE_STATS_SCHEMA", {
              "standings_rows": len(ss_table),
              "scorers_rows": len(ss_scorers),
              "standings_sample": ss_table[:1],
              "scorers_sample": ss_scorers[:1],
          })

          tsdb_day = hub.tsdb_day(today)
          assert isinstance(tsdb_day.events, list)
          print("THESPORTSDB_FREE_OK", len(tsdb_day.events), "matchs", tsdb_day.error or "ok")

          policy = provider_policy()
          assert policy["fetch_priority"][-1] == "bsd", policy
          assert policy["odds_priority"] == ["bsd"], policy
          assert policy["sportscore_odds_api_supported"] is False, policy
          print("PROVIDER_POLICY_OK", policy)

          response = session.get(
              lifecycle.OPENLIGA_BASE + "/getavailableleagues",
              headers={"User-Agent": "MrXPRONOS-CI/1.0"},
              timeout=(7, 22),
          )
          response.raise_for_status()
          leagues = response.json()
          assert isinstance(leagues, list) and leagues
          print("OPENLIGADB_FREE_OK", len(leagues), "ligues disponibles")

          import football_stats_engine as stats
          health = stats.source_health(session, today)
          assert health["espn_rows"] >= 10, health
          assert health["openliga_rows"] >= 10, health
          print("STATS_FREE_SOURCES_OK", health)

          import football_community_engine as community
          tsdb = community.fetch_tsdb_team_metadata(session, "Arsenal")
          assert tsdb.get("team") == "Arsenal", tsdb
          assert tsdb.get("source") == "TheSportsDB", tsdb
          print("COMMUNITY_FREE_SOURCE_OK", {
              "source": tsdb.get("source"),
              "team": tsdb.get("team"),
              "stadium": tsdb.get("stadium"),
              "country": tsdb.get("country"),
          })

          import football_viral_engine as viral
          commons = viral.fetch_commons_image(session, "association football stadium pitch grass")
          assert commons.get("provider") == "Wikimedia Commons", commons
          assert commons.get("url", "").startswith("https://"), commons
          assert commons.get("license"), commons
          print("VIRAL_FREE_SOURCE_OK", {
              "provider": commons.get("provider"),
              "license": commons.get("license"),
              "credit": commons.get("credit"),
          })


          PY
      - name: Verifier la presence des 7 templates premium
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          names = [
            'template_programme_matchs_du_jour.png',
            'template_avant_match.png',
            'template_resultat_final.png',
            'template_stat_du_jour.png',
            'template_flash_foot.png',
            'template_sondage.png',
            'template_compositions_officielles.webp',
          ]
          for name in names:
              path = Path('assets/images') / name
              assert path.is_file(), path
              with Image.open(path) as image:
                  w, h = image.size
                  if name == 'template_compositions_officielles.webp':
                      assert image.size == (1374, 1145), (path, image.size)
                      print('TEMPLATE_OK', name, image.size, '-> renderer natif')
                  else:
                      assert w == h, (path, image.size)
                      assert w >= 900, (path, image.size)
                      print('TEMPLATE_OK', name, image.size, '-> renderer 1080x1080')
          PY
      - name: Previsualiser les 7 templates premium
        run: python scripts/render_template_previews.py /tmp/mrxpronos-template-previews
      - name: Verifier les 7 rendus
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          pictures=sorted(Path('/tmp/mrxpronos-template-previews').glob('*.png'))
          assert len(pictures)==7, len(pictures)
          for path in pictures:
              with Image.open(path) as image:
                  expected=(1080,1350) if path.stem == 'composition' else (1080,1080)
                  assert image.size == expected, (path,image.size,expected)
                  assert image.format == 'PNG'
                  assert path.stat().st_size < 9_000_000
                  print('CARD_OK',path.name,image.size,path.stat().st_size)
          PY
      - name: Conserver les 7 apercus comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: mrxpronos-seven-template-previews
          path: /tmp/mrxpronos-template-previews/*.png
          retention-days: 7
      - name: Tests du canal
        run: python -m unittest discover -s tests_football_channel -p 'test_*.py' -v
      - name: Simulation editoriale sans publication
        run: python scripts/football_channel.py --dry-run
      - name: Simulation cycle du match sans BSD ni publication
        env:
          BSD_API_KEY: ''
          SUPABASE_URL: ''
          SUPABASE_SERVICE_ROLE_KEY: ''
        run: python scripts/football_channel.py --dry-run --lifecycle-only
