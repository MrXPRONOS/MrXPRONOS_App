name: Mr XPRONOS - Media football Telegram

on:
  # Verification CI sans envoi Telegram lors des modifications du diffuseur.
  push:
    branches: [main]
    paths:
      - 'scripts/football_channel.py'
      - 'scripts/football_cards.py'
      - 'scripts/programme_styles.py'
      - 'scripts/template_cards.py'
      - 'assets/images/template_programme_matchs_du_jour.png'
      - 'assets/images/template_avant_match.png'
      - 'assets/images/template_resultat_final.png'
      - 'assets/images/template_stat_du_jour.png'
      - 'assets/images/template_flash_foot.png'
      - 'assets/images/template_sondage.png'
      - 'tests_football_channel/**'
      - '.github/workflows/football-channel.yml'
  schedule:
    - cron: '7,37 7-23 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simuler les contenus sans publier"
        type: boolean
        default: true
      force:
        description: "Forcer une publication hors limites"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mrxpronos-media-football
  cancel-in-progress: false

jobs:
  editorial:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
      FOOTBALL_NEWS_BOT_TOKEN: ${{ secrets.FOOTBALL_NEWS_BOT_TOKEN }}
      FOOTBALL_NEWS_CHAT_ID: ${{ secrets.FOOTBALL_NEWS_CHAT_ID }}
      FOOTBALL_RSS_FEED: https://www.footmercato.net/flux-rss
      FOOTBALL_BSD_REQUEST_BUDGET: '18'
      FOOTBALL_REQUIRE_COMMENTS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer requests et Pillow
        run: python -m pip install requests Pillow
      - name: Verifier la presence des 6 templates premium
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          names = [
            'template_programme_matchs_du_jour.png',
            'template_avant_match.png',
            'template_resultat_final.png',
            'template_stat_du_jour.png',
            'template_flash_foot.png',
            'template_sondage.png',
          ]
          for name in names:
              path = Path('assets/images') / name
              assert path.is_file(), path
              with Image.open(path) as image:
                  w, h = image.size
                  assert w == h, (path, image.size)
                  assert w >= 900, (path, image.size)
                  print('TEMPLATE_OK', name, image.size, '-> renderer 1080x1080')
          PY
      - name: Previsualiser les cartes principales
        run: python scripts/football_cards.py --demo --out-dir /tmp/mrxpronos-cards
      - name: Verifier les rendus
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          pictures=list(Path('/tmp/mrxpronos-cards').glob('*.png'))
          assert len(pictures)==3, len(pictures)
          for path in pictures:
              with Image.open(path) as image:
                  assert image.size == (1080,1080), (path,image.size)
                  assert image.format == 'PNG'
                  assert path.stat().st_size < 9_000_000
                  print('CARD_OK',path.name,image.size,path.stat().st_size)
          PY
      - name: Tests du canal
        run: python -m unittest discover -s tests_football_channel -p 'test_*.py' -v
      - name: Restaurer historique Telegram
        uses: actions/cache/restore@v4
        with:
          path: .state/mrxpronos-football.json
          key: football-news-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            football-news-
      - name: Publier ou simuler
        env:
          DRY_RUN: ${{ github.event_name == 'push' && 'true' || inputs.dry_run || 'false' }}
          FORCE: ${{ inputs.force || 'false' }}
        run: |
          ARGS=()
          if [ "$DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          if [ "$FORCE" = "true" ]; then ARGS+=(--force); fi
          python scripts/football_channel.py "${ARGS[@]}"
      - name: Sauvegarder historique Telegram
        if: ${{ always() && (github.event_name == 'schedule' || inputs.dry_run == false) }}
        uses: actions/cache/save@v4
        with:
          path: .state/mrxpronos-football.json
          key: football-news-${{ github.run_id }}-${{ github.run_attempt }}
