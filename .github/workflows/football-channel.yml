name: Mr XPRONOS - CI media football
# Valide les 4 templates premium et les 3 bannières génériques de production.

on:
  pull_request:
    paths:
      - 'scripts/football_channel.py'
      - 'scripts/football_news_engine.py'
      - 'scripts/football_match_lifecycle.py'
      - 'scripts/football_stats_engine.py'
      - 'scripts/football_community_engine.py'
      - 'scripts/football_viral_engine.py'
      - 'fetch_foot_news.py'
      - 'scripts/template_cards.py'
      - 'scripts/generic_football_banners.py'
      - 'scripts/generic_football_content.py'
      - 'scripts/render_template_previews.py'
      - 'assets/images/template_programme_matchs_du_jour.png'
      - 'assets/images/template_avant_match.png'
      - 'assets/images/template_resultat_final.png'
      - 'assets/images/template_compositions_officielles.webp'
      - 'assets/images/generic_football_banners/**'
      - 'assets/js/main.js'
      - 'assets/css/infos-premium.css'
      - 'infos.html'
      - 'tests_football_channel/**'
      - '.github/workflows/football-channel.yml'
  # Verification CI sans envoi Telegram lors des modifications du diffuseur.
  push:
    branches: [main]
    paths:
      - 'scripts/football_channel.py'
      - 'scripts/football_news_engine.py'
      - 'scripts/football_match_lifecycle.py'
      - 'scripts/football_stats_engine.py'
      - 'scripts/football_community_engine.py'
      - 'scripts/football_viral_engine.py'
      - 'fetch_foot_news.py'
      - 'assets/js/main.js'
      - 'assets/css/infos-premium.css'
      - 'infos.html'
      - 'scripts/football_cards.py'
      - 'scripts/programme_styles.py'
      - 'scripts/template_cards.py'
      - 'scripts/generic_football_banners.py'
      - 'scripts/generic_football_content.py'
      - 'assets/images/template_programme_matchs_du_jour.png'
      - 'assets/images/template_avant_match.png'
      - 'assets/images/template_resultat_final.png'
      - 'assets/images/template_compositions_officielles.webp'
      - 'assets/images/generic_football_banners/**'
      - 'scripts/render_template_previews.py'
      - 'tests_football_channel/**'
      - '.github/workflows/football-channel.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mrxpronos-media-football
  cancel-in-progress: false

jobs:
  editorial:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
      FOOTBALL_NEWS_BOT_TOKEN: ${{ secrets.FOOTBALL_NEWS_BOT_TOKEN }}
      FOOTBALL_NEWS_CHAT_ID: ${{ secrets.FOOTBALL_NEWS_CHAT_ID }}
      FOOTBALL_RSS_FEED: https://www.footmercato.net/flux-rss
      FOOTBALL_BSD_REQUEST_BUDGET: '18'
      FOOTBALL_ESPN_REQUEST_BUDGET: '36'
      FOOTBALL_MULTI_SOURCE: '1'
      FOOTBALL_FREE_MIN_MATCHES: '5'
      BSD_PREFER_FREE_RECENT: '1'
      FOOTBALL_REQUIRE_COMMENTS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer les dépendances du canal et des flux gratuits
        run: python -m pip install requests Pillow feedparser imageio-ffmpeg
      - name: Compiler le moteur News Football
        run: python -m py_compile fetch_foot_news.py scripts/football_news_engine.py scripts/football_match_lifecycle.py scripts/football_stats_engine.py scripts/football_community_engine.py scripts/football_viral_engine.py scripts/generic_football_banners.py scripts/generic_football_content.py scripts/template_cards.py scripts/football_channel.py scripts/telegram_research/extract_history.py scripts/telegram_research/create_session.py scripts/ensure_actufoot_cronjob.py
      - name: Vérifier le JavaScript Infos Foot
        run: node --check assets/js/main.js
      - name: Tester réellement les flux News Football sans publication
        env:
          MAX_ARTICLES: '12'
          MAX_ARTICLES_PER_FEED: '6'
          MAX_NEWS_AGE_HOURS: '168'
        run: |
          python fetch_foot_news.py
          python - <<'PY'
          import json
          from pathlib import Path
          rows=json.loads(Path("footnews.json").read_text(encoding="utf-8"))
          assert len(rows)>=3, f"Couverture RSS insuffisante: {len(rows)}"
          assert all(
              x.get("image_origin")=="source"
              or (
                  x.get("image_origin")=="generated_fallback"
                  and int(x.get("editorial_score") or 0)>=4
              )
              for x in rows
          )
          assert sum(x.get("image_origin")=="source" for x in rows) >= max(1, len(rows)//2)
          assert all(Path(x["image"]).is_file() for x in rows)
          assert all(x.get("content") and x.get("telegram_summary") and x.get("site_url") for x in rows)
          print("NEWS_FREE_SOURCES_OK",len(rows),sorted({x.get("source") for x in rows}))
          PY
      - name: Vérifier les sources gratuites du cycle de match
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          import requests
          import sys
          sys.path.insert(0, "scripts")
          import football_match_lifecycle as lifecycle

          session = requests.Session()
          today = datetime.now(timezone.utc).date()

          espn = lifecycle.fetch_espn_day(session, today)
          assert isinstance(espn, list)
          print("ESPN_FREE_OK", len(espn), "matchs", today.isoformat())

          response = session.get(
              lifecycle.OPENLIGA_BASE + "/getavailableleagues",
              headers={"User-Agent": "MrXPRONOS-CI/1.0"},
              timeout=(7, 22),
          )
          response.raise_for_status()
          leagues = response.json()
          assert isinstance(leagues, list) and leagues
          print("OPENLIGADB_FREE_OK", len(leagues), "ligues disponibles")

          import football_stats_engine as stats
          health = stats.source_health(session, today)
          assert health["espn_rows"] >= 10, health
          assert health["openliga_rows"] >= 10, health
          print("STATS_FREE_SOURCES_OK", health)

          import football_community_engine as community
          tsdb = community.fetch_tsdb_team_metadata(session, "Arsenal")
          assert tsdb.get("team") == "Arsenal", tsdb
          assert tsdb.get("source") == "TheSportsDB", tsdb
          print("COMMUNITY_FREE_SOURCE_OK", {
              "source": tsdb.get("source"),
              "team": tsdb.get("team"),
              "stadium": tsdb.get("stadium"),
              "country": tsdb.get("country"),
          })

          import football_viral_engine as viral
          commons = viral.fetch_commons_image(session, "association football stadium pitch grass")
          assert commons.get("provider") == "Wikimedia Commons", commons
          assert commons.get("url", "").startswith("https://"), commons
          assert commons.get("license"), commons
          print("VIRAL_FREE_SOURCE_OK", {
              "provider": commons.get("provider"),
              "license": commons.get("license"),
              "credit": commons.get("credit"),
          })


          PY
      - name: Verifier les 4 templates premium et 3 bannieres generiques
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          from PIL import Image
          sys.path.insert(0, 'scripts')
          import generic_football_banners as banners

          dedicated = [
              'template_programme_matchs_du_jour.png',
              'template_avant_match.png',
              'template_resultat_final.png',
              'template_compositions_officielles.webp',
          ]
          for name in dedicated:
              path = Path('assets/images') / name
              assert path.is_file(), path
              with Image.open(path) as image:
                  if name == 'template_compositions_officielles.webp':
                      assert image.size == (1374, 1145), (path, image.size)
                  else:
                      w, h = image.size
                      assert w == h and w >= 900, (path, image.size)
                  print('PREMIUM_TEMPLATE_OK', name, image.size)

          for family in ('match', 'club', 'general'):
              image = banners.template(family)
              assert image.size == (1280, 500), (family, image.size)
              print('GENERIC_TEMPLATE_OK', family, image.size)
          PY
      - name: Previsualiser les 7 templates premium
        run: python scripts/render_template_previews.py /tmp/mrxpronos-template-previews
      - name: Verifier les 7 rendus
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          pictures=sorted(Path('/tmp/mrxpronos-template-previews').glob('*.png'))
          assert len(pictures)==7, len(pictures)
          expected = {
              'programme': (1080, 1080),
              'avant_match': (1080, 1080),
              'resultat': (1080, 1080),
              'composition': (1374, 1145),
              'goal': (1280, 500),
              'absence_confirmee': (1280, 500),
              'quiz': (1280, 500),
          }
          for path in pictures:
              with Image.open(path) as image:
                  wanted=expected[path.stem]
                  assert image.size == wanted, (path,image.size,wanted)
                  assert image.format == 'PNG'
                  assert path.stat().st_size < 9_000_000
                  print('CARD_OK',path.name,image.size,path.stat().st_size)
          PY
      - name: Conserver les 7 apercus comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: mrxpronos-production-template-previews
          path: /tmp/mrxpronos-template-previews/*.png
          retention-days: 7
      - name: Tests du canal
        run: python -m unittest discover -s tests_football_channel -p 'test_*.py' -v
      - name: Simulation editoriale sans publication
        run: python scripts/football_channel.py --dry-run
      - name: Simulation cycle du match sans BSD ni publication
        env:
          BSD_API_KEY: ''
          SUPABASE_URL: ''
          SUPABASE_SERVICE_ROLE_KEY: ''
        run: python scripts/football_channel.py --dry-run --lifecycle-only
