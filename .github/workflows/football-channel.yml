name: Mr XPRONOS - CI media football
# CI déterministe Actu Foot : code, tests et 7 templates. Aucun fournisseur externe n'est requis.

on:
  pull_request:
    paths:
      - 'scripts/football_channel.py'
      - 'scripts/football_followup.py'
      - 'scripts/actu_foot_observability.py'
      - 'scripts/actu_foot_source_cache.py'
      - 'scripts/actu_foot_provider_health.py'
      - 'scripts/football_news_engine.py'
      - 'scripts/football_match_lifecycle.py'
      - 'scripts/football_stats_engine.py'
      - 'scripts/football_community_engine.py'
      - 'scripts/football_viral_engine.py'
      - 'fetch_foot_news.py'
      - 'scripts/template_cards.py'
      - 'scripts/generic_football_banners.py'
      - 'scripts/generic_football_content.py'
      - 'scripts/render_template_previews.py'
      - 'assets/images/template_programme_matchs_du_jour.png'
      - 'assets/images/template_avant_match.png'
      - 'assets/images/template_resultat_final.png'
      - 'assets/images/template_compositions_officielles.webp'
      - 'assets/images/generic_football_banners/**'
      - 'assets/js/main.js'
      - 'assets/css/infos-premium.css'
      - 'infos.html'
      - 'tests_football_channel/**'
      - '.github/workflows/football-channel.yml'
  # Verification CI sans envoi Telegram lors des modifications du diffuseur.
  push:
    branches: [main]
    paths:
      - 'scripts/football_channel.py'
      - 'scripts/football_followup.py'
      - 'scripts/actu_foot_observability.py'
      - 'scripts/actu_foot_source_cache.py'
      - 'scripts/football_news_engine.py'
      - 'scripts/football_match_lifecycle.py'
      - 'scripts/football_stats_engine.py'
      - 'scripts/football_community_engine.py'
      - 'scripts/football_viral_engine.py'
      - 'fetch_foot_news.py'
      - 'assets/js/main.js'
      - 'assets/css/infos-premium.css'
      - 'infos.html'
      - 'scripts/football_cards.py'
      - 'scripts/programme_styles.py'
      - 'scripts/template_cards.py'
      - 'scripts/generic_football_banners.py'
      - 'scripts/generic_football_content.py'
      - 'assets/images/template_programme_matchs_du_jour.png'
      - 'assets/images/template_avant_match.png'
      - 'assets/images/template_resultat_final.png'
      - 'assets/images/template_compositions_officielles.webp'
      - 'assets/images/generic_football_banners/**'
      - 'scripts/render_template_previews.py'
      - 'tests_football_channel/**'
      - '.github/workflows/football-channel.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mrxpronos-media-football
  cancel-in-progress: false

jobs:
  editorial:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
      FOOTBALL_NEWS_BOT_TOKEN: ${{ secrets.FOOTBALL_NEWS_BOT_TOKEN }}
      FOOTBALL_NEWS_CHAT_ID: ${{ secrets.FOOTBALL_NEWS_CHAT_ID }}
      FOOTBALL_RSS_FEED: https://www.footmercato.net/flux-rss
      FOOTBALL_BSD_REQUEST_BUDGET: '18'
      FOOTBALL_ESPN_REQUEST_BUDGET: '36'
      FOOTBALL_MULTI_SOURCE: '1'
      FOOTBALL_FREE_MIN_MATCHES: '5'
      BSD_PREFER_FREE_RECENT: '1'
      FOOTBALL_REQUIRE_COMMENTS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer les dépendances du canal et des flux gratuits
        run: python -m pip install requests Pillow feedparser imageio-ffmpeg
      - name: Compiler le moteur News Football
        run: python -m py_compile fetch_foot_news.py scripts/football_news_engine.py scripts/football_match_lifecycle.py scripts/football_stats_engine.py scripts/football_community_engine.py scripts/football_viral_engine.py scripts/generic_football_banners.py scripts/generic_football_content.py scripts/template_cards.py scripts/football_channel.py scripts/football_followup.py scripts/actu_foot_observability.py scripts/actu_foot_source_cache.py scripts/actu_foot_provider_health.py scripts/telegram_research/extract_history.py scripts/telegram_research/create_session.py scripts/ensure_actufoot_cronjob.py
      - name: Vérifier le JavaScript Infos Foot
        run: node --check assets/js/main.js
      # Les appels réseau réels sont volontairement exclus de la CI bloquante.
      # Ils restent couverts par les workflows de santé fournisseurs dédiés.
      - name: Verifier les 4 templates premium et 3 bannieres generiques
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          from PIL import Image
          sys.path.insert(0, 'scripts')
          import generic_football_banners as banners

          dedicated = [
              'template_programme_matchs_du_jour.png',
              'template_avant_match.png',
              'template_resultat_final.png',
              'template_compositions_officielles.webp',
          ]
          for name in dedicated:
              path = Path('assets/images') / name
              assert path.is_file(), path
              with Image.open(path) as image:
                  if name == 'template_compositions_officielles.webp':
                      assert image.size == (1374, 1145), (path, image.size)
                  else:
                      w, h = image.size
                      assert w == h and w >= 900, (path, image.size)
                  print('PREMIUM_TEMPLATE_OK', name, image.size)

          for family in ('match', 'club', 'general'):
              image = banners.template(family)
              assert image.size == (1280, 500), (family, image.size)
              print('GENERIC_TEMPLATE_OK', family, image.size)
          PY
      - name: Previsualiser les 7 templates premium
        run: python scripts/render_template_previews.py /tmp/mrxpronos-template-previews
      - name: Verifier les 7 rendus
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          pictures=sorted(Path('/tmp/mrxpronos-template-previews').glob('*.png'))
          assert len(pictures)==7, len(pictures)
          expected = {
              'programme': (1080, 1080),
              'avant_match': (1080, 1080),
              'resultat': (1080, 1080),
              'composition': (1374, 1145),
              'goal': (1280, 500),
              'absence_confirmee': (1280, 500),
              'quiz': (1280, 500),
          }
          for path in pictures:
              with Image.open(path) as image:
                  wanted=expected[path.stem]
                  assert image.size == wanted, (path,image.size,wanted)
                  assert image.format == 'PNG'
                  assert path.stat().st_size < 9_000_000
                  print('CARD_OK',path.name,image.size,path.stat().st_size)
          PY
      - name: Conserver les 7 apercus comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: mrxpronos-production-template-previews
          path: /tmp/mrxpronos-template-previews/*.png
          retention-days: 7
      - name: Tests du canal
        run: python -m unittest discover -s tests_football_channel -p 'test_*.py' -v
