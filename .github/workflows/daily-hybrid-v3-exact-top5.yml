name: MrXPRONOS - Hybrid V3 daily Top5 exact + grouped publication

# The scheduled job runs ONLY from the default branch after PR merge.
# Feature-branch push is a private dry-run: it NEVER publishes daily picks.
on:
  schedule:
    - cron: '22 0 * * *'
    - cron: '42 11 * * *'
  workflow_dispatch:
  push:
    branches: [feature/onglet-scores-exacts-20261103]
    paths:
      - '.github/workflows/daily-hybrid-v3-exact-top5.yml'
      - 'scripts/forecast_hybrid_v3_daily.py'
      - 'scripts/publish_exact_scores.py'
      - 'tests/test_exact_v3_daily.py'

permissions:
  contents: write

concurrency:
  group: mrx-daily-hybrid-v3-exact-publisher-one-writer
  cancel-in-progress: false

jobs:
  generate-authentic-top5:
    if: github.repository == 'MrXPRONOS/MrXPRONOS_App'
    runs-on: ubuntu-latest
    timeout-minutes: 115
    env:
      ML_V2_HISTORY_KEY_B64: ${{ secrets.ML_V2_HISTORY_KEY_B64 }}
      BSD_HISTORY_KEY: ${{ secrets.BSD_HISTORY_KEY }}
      BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      FOOTBALL_MULTI_SOURCE: '0'
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: ml_core/research:bsd:.
    steps:
      - name: Checkout the website branch without modifying main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout PINNED audited Hybrid V3 research implementation
        uses: actions/checkout@v4
        with:
          repository: MrXPRONOS/MrXPRONOS_App
          ref: f0c700b2448923fadd6fc6f260da34d0576f3e1f
          path: ml_core
          persist-credentials: false
      - name: Python for authenticated research history and V3
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install V3 model and authenticated archive dependencies
        run: python -m pip install numpy scipy scikit-learn requests cryptography lightgbm==4.6.0 catboost==1.2.8
      - name: Verify daily Top5 source and publish tests
        run: |
          python -m py_compile scripts/forecast_hybrid_v3_daily.py scripts/publish_exact_scores.py
          python -m unittest discover -s tests -p 'test_exact_v3_daily.py' -v
          python -m unittest discover -s tests -p 'test_exact_scores_tab.py' -v
          node --check assets/js/scores-exacts.js
      - name: Require all secrets before accessing any forecast input
        run: |
          test -n "$ML_V2_HISTORY_KEY_B64" || { echo "::error::Missing ML_V2_HISTORY_KEY_B64"; exit 1; }
          test -n "$BSD_HISTORY_KEY" || { echo "::error::Missing BSD_HISTORY_KEY"; exit 1; }
          test -n "$BSD_API_KEY" || { echo "::error::Missing BSD_API_KEY"; exit 1; }
          test -f ml_core/research/single_ml_v3.py
          test -f ml_core/research/encrypted_football/bsd_sportscore/2026/10.enc
      - name: Restore CURRENT encrypted BSD history from main, no plaintext tracked
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git show origin/main:bsd/all_matches_bsd.enc.json > bsd/all_matches_bsd.enc.json
          python bsd/bsd_archive.py restore
          # Do not keep a modified encrypted archive in the website Git worktree.
          git restore -- bsd/all_matches_bsd.enc.json
      - name: Make authentic LIVE prospective Hybrid V3 11x11 forecast grids
        run: |
          set -euo pipefail
          umask 077
          mkdir -p /tmp/mrx-daily-v3
          python scripts/forecast_hybrid_v3_daily.py \
            --out /tmp/mrx-daily-v3/native-v3-grids.json \
            --recent-bsd-archive bsd/all_matches_bsd.json \
            --history-root ml_core/research/encrypted_football \
            --audit-root ml_core/research \
            --max-requests 130
      - name: Rank Top5 A scores and Top5 B three-score groups
        run: |
          set -euo pipefail
          python scripts/publish_exact_scores.py \
            --input /tmp/mrx-daily-v3/native-v3-grids.json \
            --out /tmp/mrx-daily-v3/scores-exacts.json
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          result=json.loads(Path("/tmp/mrx-daily-v3/scores-exacts.json").read_text())
          now=datetime.now(timezone.utc).date().isoformat()
          assert result["date"]==now
          assert result["origin"]=="prospective_prematch"
          assert len(result["simple"])<=5 and len(result["grouped"])<=5
          assert result["status"]=="published" or (not result["simple"] and not result["grouped"])
          print("EXACT_TOP5_DAILY_AUDIT",json.dumps({
              "date":now,"simple":len(result["simple"]),"grouped":len(result["grouped"]),
              "real_predictions_only":True,"group_proxy_not_verified_bookmaker":True
          }),flush=True)
          PY
      - name: Publish immutable daily JSON ONLY on main; feature branch remains dry-run
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != 'refs/heads/main' ]; then
            echo 'EXACT_TOP5_DRY_RUN_OK: feature branch never publishes'
            exit 0
          fi
          git fetch --no-tags origin main
          git pull --rebase origin main
          python - <<'PY'
          import json,os,pathlib,shutil
          from datetime import datetime, timezone
          out=pathlib.Path("scores-exacts.json")
          incoming=pathlib.Path("/tmp/mrx-daily-v3/scores-exacts.json")
          result=json.loads(incoming.read_text(encoding="utf8"))
          date=datetime.now(timezone.utc).date().isoformat()
          if result["date"]!=date:
              raise RuntimeError("The daily job crossed midnight: fail closed")
          if out.exists():
              existing=json.loads(out.read_text(encoding="utf8"))
              if existing.get("date")==date and existing.get("status")=="published":
                  print("EXACT_TOP5_ALREADY_PUBLISHED_IMMUTABLE",date,flush=True)
                  raise SystemExit(0)
          os.replace(str(incoming),str(out))
          print("EXACT_TOP5_READY_TO_COMMIT",date,flush=True)
          PY
          if git diff --quiet -- scores-exacts.json; then
            echo 'EXACT_TOP5_NO_CHANGE'; exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- scores-exacts.json
          git commit -m "data(exact-scores): publish pre-match Hybrid V3 Top5 [skip ci]"
          git push origin HEAD:main
      - name: Always purge private forecasts and decrypted history
        if: always()
        run: |
          rm -f bsd/all_matches_bsd.json bsd/backfill_state.json
          rm -rf /tmp/mrx-daily-v3
