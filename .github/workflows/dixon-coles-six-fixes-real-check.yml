name: Dixon-Coles V1.2 - données réelles et backtest indépendant

on:
  workflow_dispatch:
  push:
    paths:
      - 'dixon-coles/dcscore/model.py'
      - 'dixon-coles/dcscore/domain.py'
      - 'dixon-coles/dcscore/sources.py'
      - 'dixon-coles/dcscore/openfootball.py'
      - 'dixon-coles/dcscore/service.py'
      - 'dixon-coles/dcscore/store.py'
      - 'dixon-coles/dcscore/cli.py'
      - '.github/workflows/dixon-coles-six-fixes-real-check.yml'

permissions:
  contents: read

jobs:
  real_backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: dixon-coles
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            dixon-coles
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - name: Importer les résultats réels CC0 dans une base isolée
        env:
          DCSCORE_DB: ${{ runner.temp }}/real_backtest_v12.sqlite
        run: |
          python -m dcscore.cli sync-openfootball --seasons 2021-22 2022-23 2023-24 2024-25 2025-26 2026-27 > source_report.json
          python - <<'PY'
          import json
          d=json.load(open('source_report.json'))
          assert d['all_successful'],d
          finished=sum(s['finished'] for s in d['seasons'])
          assert finished>=1600,f'Trop peu de vrais scores : {finished}'
          assert all(s['source']=='openfootball/football.json' for s in d['seasons'])
          print('Résultats réels importés :',finished)
          PY
      - name: Tester 160 rencontres réelles et la base Poisson réentraînée
        env:
          DCSCORE_DB: ${{ runner.temp }}/real_backtest_v12.sqlite
        run: |
          python -m dcscore.cli backtest --competition of:ENG-PL --samples 160 --min-games 500 > real_backtest.json
          python - <<'PY'
          import json,math
          d=json.load(open('real_backtest.json'))
          assert d['n_evaluated']>=120,d
          assert d['n_folds']>=3,d
          assert 'réentraîné indépendamment' in d['baseline_note']
          assert all(f['last_training_match']<f['start'] for f in d['folds'])
          assert sum(b['n'] for b in d['top1_confidence_buckets'])==d['n_evaluated']
          assert all(math.isfinite(d[x]) for x in ('mean_dc_log_loss','mean_poisson_independent_log_loss','mean_one_x_two_brier'))
          assert all(v['result_provenance']=='community_reported' for v in d['detailed'])
          print('Backtest réel validé :',d['n_evaluated'],'matchs',d['n_folds'],'blocs')
          print('Dixon-Coles log loss:',d['mean_dc_log_loss'])
          print('Poisson indépendant log loss:',d['mean_poisson_independent_log_loss'])
          print('Top 1:',d['top1_hit_rate'],'Top 3:',d['top3_hit_rate'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dixon-coles-v12-real-backtest
          path: |
            dixon-coles/source_report.json
            dixon-coles/real_backtest.json
          if-no-files-found: warn
          retention-days: 30
