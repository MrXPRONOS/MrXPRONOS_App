name: ML V2 - authenticated multisource training compatibility
on:
  push:
    branches: [research/single-ml-v2-20261024]
    paths: ['.github/workflows/research-ml-v2-multisource-smoke.yml']
permissions:
  contents: read
jobs:
  certified-loader-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ML_V2_HISTORY_KEY_B64: ${{ secrets.ML_V2_HISTORY_KEY_B64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/single-ml-v2-20261024
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline ML loader dependencies
        run: python -m pip install numpy scipy scikit-learn requests cryptography lightgbm==4.6.0 catboost==1.2.8
      - name: Verify research bridge syntax
        run: python -m py_compile research/single_ml_v2_multisource.py
      - name: Reconcile encrypted annual source archives with ML loader
        run: PYTHONPATH=.:research python research/single_ml_v2_multisource.py --validate-only
      - name: Ensure only research files changed in this trigger commit
        run: |
          python - <<'PY'
          import subprocess
          changed = subprocess.check_output(['git','diff-tree','--no-commit-id','--name-only','-r','HEAD'],text=True).splitlines()
          assert all(x.startswith('research/') or x=='.github/workflows/research-ml-v2-multisource-smoke.yml' for x in changed), changed
          print('NO_PRODUCTION_CHANGES')
          PY
