name: Mr XPRONOS - Film Healthcheck

on:
  workflow_dispatch:
    inputs:
      send_test_messages:
        description: 'Envoyer un message de test dans chaque canal (optionnel)'
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/telegram-film-healthcheck.yml'

permissions:
  contents: write

concurrency:
  group: mrx-telegram-personal-account
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: telegram-film-relay/requirements.txt
      - name: Install Telethon
        run: pip install -r telegram-film-relay/requirements.txt
      - name: Test health script
        working-directory: telegram-film-relay
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -q
      - name: Check Telegram setup without publishing
        continue-on-error: true
        working-directory: telegram-film-relay
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_STRING_SESSION: ${{ secrets.TG_SESSION_STRING || secrets.TG_STRING_SESSION || secrets.TG_STREAM_SESSION }}
          TG_PRIVATE_CHANNEL: ${{ vars.TG_PRIVATE_CHANNEL }}
          TG_PUBLIC_CHANNEL: ${{ vars.TG_PUBLIC_CHANNEL }}
          FILM_PUBLISH_ENABLED: ${{ vars.FILM_PUBLISH_ENABLED }}
          TG_RIGHTS_ATTESTED: ${{ vars.TG_RIGHTS_ATTESTED }}
          FILM_HEALTH_SEND_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.send_test_messages && 'true' || 'false' }}
          PYTHONPATH: .
        run: python scripts/healthcheck.py
      - name: Save non-sensitive diagnostics
        if: always()
        run: |
          if ! git diff --quiet -- telegram-film-relay/state/health.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add telegram-film-relay/state/health.json
            git commit -m 'state: film healthcheck [skip ci]'
            git pull --rebase
            git push
          fi
