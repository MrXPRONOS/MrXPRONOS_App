name: Cine Radar - Promo quotidienne tous canaux eligibles
# Affiche validee : message officiel @CineXFilms_vf/373.
# Les publications ne se lancent PAS sur un push de code.
on:
# Calendrier transféré à telegram-discovery-daily.yml : un seul déclencheur quotidien.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Vérifier sans publier (désactiver pour un envoi réel)"
        required: true
        default: true
        type: boolean
  push:
    branches: [main]
    paths:
      - '.github/workflows/cineradar-daily-promo.yml'
      - 'scripts/cineradar_daily_promo.py'
      - 'tests/test_cineradar_daily_promo.py'

permissions:
  contents: read

concurrency:
  group: cineradar-promo-daily-production
  cancel-in-progress: false

jobs:
  tests:
    name: Tests offline - aucun Telegram
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'requests>=2.31,<3'
      - run: python -m py_compile scripts/cineradar_daily_promo.py tests/test_cineradar_daily_promo.py
      - run: python -m unittest discover -s tests -p 'test_cineradar_daily_promo.py' -v

  audit:
    name: Vérification des droits sans publication
    needs: tests
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MRXPRONOS_CANAL_BOT_TOKEN: ${{ secrets.MRXPRONOS_CANAL_BOT_TOKEN }}
      CINE_RADAR_BOT_TOKEN: ${{ secrets.CINE_RADAR_BOT_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      FOOTBALL_NEWS_BOT_TOKEN: ${{ secrets.FOOTBALL_NEWS_BOT_TOKEN }}
      EDITORIAL_TELEGRAM_BOT_TOKEN: ${{ secrets.EDITORIAL_TELEGRAM_BOT_TOKEN }}
      PARTNERSHIP_BOT_TOKEN: ${{ secrets.PARTNERSHIP_BOT_TOKEN }}
      CINEX_BOT_TOKEN: ${{ secrets.CINEX_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'requests>=2.31,<3'
      - name: Vérifier les 13 canaux via Telegram (aucun envoi)
        run: python scripts/cineradar_daily_promo.py --dry-run

  publish:
    name: Envoi quotidien avec anti-doublons Supabase
    needs: tests
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MRXPRONOS_CANAL_BOT_TOKEN: ${{ secrets.MRXPRONOS_CANAL_BOT_TOKEN }}
      CINE_RADAR_BOT_TOKEN: ${{ secrets.CINE_RADAR_BOT_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      FOOTBALL_NEWS_BOT_TOKEN: ${{ secrets.FOOTBALL_NEWS_BOT_TOKEN }}
      EDITORIAL_TELEGRAM_BOT_TOKEN: ${{ secrets.EDITORIAL_TELEGRAM_BOT_TOKEN }}
      PARTNERSHIP_BOT_TOKEN: ${{ secrets.PARTNERSHIP_BOT_TOKEN }}
      CINEX_BOT_TOKEN: ${{ secrets.CINEX_BOT_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'requests>=2.31,<3'
      - name: Copier l'affiche et le bouton bleu une fois par jour/canal
        run: python scripts/cineradar_daily_promo.py
