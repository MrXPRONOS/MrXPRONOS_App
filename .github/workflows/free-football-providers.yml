name: Free football providers CI

on:
  pull_request:
    paths:
      - 'scripts/free_football_sources.py'
      - 'scripts/football_channel.py'
      - 'scripts/football_match_lifecycle.py'
      - 'scripts/football_five_systems_test.py'
      - 'supabase/functions/_shared/free_football.ts'
      - 'supabase/functions/live/index.ts'
      - 'supabase/functions/daily-pronos/index.ts'
      - 'supabase/tests/free_football_test.ts'
      - 'tests_football_channel/test_free_football_sources.py'
      - 'live.html'
      - '.github/workflows/free-football-providers.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/free_football_sources.py'
      - 'scripts/football_channel.py'
      - 'scripts/football_match_lifecycle.py'
      - 'supabase/functions/_shared/free_football.ts'
      - 'supabase/functions/live/index.ts'
      - 'supabase/functions/daily-pronos/index.ts'
      - 'supabase/tests/free_football_test.ts'
      - 'tests_football_channel/test_free_football_sources.py'
      - '.github/workflows/free-football-providers.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check requests Pillow feedparser imageio-ffmpeg
      - name: Compile provider and football modules
        run: |
          python -m py_compile             scripts/free_football_sources.py             scripts/football_channel.py             scripts/football_match_lifecycle.py             scripts/football_five_systems_test.py
      - name: Provider unit tests
        run: python -m unittest tests_football_channel.test_free_football_sources -v
      - name: Lifecycle regression tests
        run: python -m unittest tests_football_channel.test_match_lifecycle -v

  deno:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check shared provider client
        run: deno check supabase/functions/_shared/free_football.ts
      - name: Provider unit tests
        run: deno test supabase/tests/free_football_test.ts
      - name: Check Edge entrypoints
        run: |
          deno check --node-modules-dir=auto supabase/functions/daily-pronos/index.ts
          deno check --node-modules-dir=auto supabase/functions/live/index.ts

  provider-smoke:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Public provider smoke tests
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          import sys
          import requests
          sys.path.insert(0, "scripts")
          import free_football_sources as f

          session = requests.Session()
          today = datetime.now(timezone.utc).date()

          sport = f.fetch_sportscore_day(session, today)
          print("SPORTSCORE_OK", len(sport))
          if sport:
              raw0 = sport[0].get("raw") if isinstance(sport[0].get("raw"), dict) else {}
              print("SPORTSCORE_SAMPLE_KEYS", sorted(raw0.keys()))
              print("SPORTSCORE_SAMPLE_SLUGISH", {
                  key: raw0.get(key)
                  for key in raw0
                  if "slug" in key.lower() or "url" in key.lower() or "link" in key.lower()
              })
              print("SPORTSCORE_SAMPLE_ODDSISH", {
                  key: raw0.get(key)
                  for key in raw0
                  if "odd" in key.lower() or "market" in key.lower()
              })

          sport_widget = f.fetch_sportscore_live_recent(session)
          print("SPORTSCORE_WIDGET_OK", len(sport_widget))
          sport_detail_match = next(
              (x for x in sport_widget if x.get("provider_slug") and x.get("state") in {"in", "post"}),
              next((x for x in sport_widget if x.get("provider_slug")), None),
          )

          def oddsish_paths(value, path="", depth=0, found=None):
              found = found if found is not None else []
              if depth > 6 or len(found) >= 40:
                  return found
              if isinstance(value, dict):
                  for key, child in value.items():
                      child_path = path + "." + str(key) if path else str(key)
                      if "odd" in str(key).lower() or "market" in str(key).lower():
                          found.append((child_path, child))
                          if len(found) >= 40:
                              return found
                      oddsish_paths(child, child_path, depth + 1, found)
              elif isinstance(value, list):
                  for i, child in enumerate(value[:10]):
                      oddsish_paths(child, f"{path}[{i}]", depth + 1, found)
              return found

          if sport_detail_match:
              detail = f.fetch_sportscore_detail(session, sport_detail_match["provider_slug"])
              enrichment = f.extract_sportscore_enrichment(detail)
              print("SPORTSCORE_DETAIL_OK", sport_detail_match["provider_slug"], {
                  "keys": sorted(detail.keys())[:40] if isinstance(detail, dict) else [],
                  "home_lineup": len((enrichment.get("lineups") or {}).get("home") or []),
                  "goals": len(enrichment.get("goals") or []),
                  "timeline": len(enrichment.get("timeline") or []),
                  "home_stats": len((enrichment.get("stats") or {}).get("home") or {}),
              })
              print("SPORTSCORE_DETAIL_ODDS_PATHS", oddsish_paths(detail))

          tsdb = f.fetch_thesportsdb_day(session, today)
          print("THESPORTSDB_OK", len(tsdb))
          tsdb_match = next((x for x in tsdb if x.get("source_match_id")), None)
          if tsdb_match:
              detail = f.fetch_thesportsdb_details(session, tsdb_match["source_match_id"])
              enrichment = f.extract_thesportsdb_enrichment(detail)
              print("THESPORTSDB_DETAIL_OK", tsdb_match["source_match_id"], {
                  "sections": sorted(detail.keys()),
                  "home_lineup": len((enrichment.get("lineups") or {}).get("home") or []),
                  "timeline": len(enrichment.get("timeline") or []),
                  "home_stats": len((enrichment.get("stats") or {}).get("home") or {}),
              })

          openliga = f.fetch_openligadb_day(session, today)
          print("OPENLIGADB_OK", len(openliga))

          assert isinstance(sport, list)
          assert isinstance(tsdb, list)
          assert isinstance(openliga, list)
          PY
