name: BSD V2 BTTS 2026 YTD confidence-threshold backtest
on:
  push:
    branches:
      - audit/btts-oct-2026
    paths:
      - .github/workflows/bsd-btts-2026-ytd-audit.yml
permissions:
  contents: read
concurrency:
  group: bsd-btts-2026-ytd-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: bsd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install historical model requirements
        run: python -m pip install requests cryptography pillow
      - name: Restore encrypted BSD archive with repository secret (read-only)
        env:
          BSD_HISTORY_KEY: ${{ secrets.BSD_HISTORY_KEY }}
        run: python bsd/bsd_archive.py restore
      - name: 2026 YTD BTTS pre-match scoring audit and threshold analysis
        run: python bsd/btts_backtest_2026_ytd.py
      - name: Upload year-to-date threshold audit
        uses: actions/upload-artifact@v4
        with:
          name: bsd-btts-2026-ytd-threshold-report
          path: bsd/btts_backtest_2026_ytd.json
          retention-days: 14
          if-no-files-found: error
