name: Scores exacts Top5 - safe page and prematch feed tests
on:
  push:
    branches: [feature/onglet-scores-exacts-20261103]
    paths:
      - '.github/workflows/scores-exacts-page-tests.yml'
      - 'scores-exacts.html'
      - 'scores-exacts.json'
      - 'assets/js/scores-exacts.js'
      - 'scripts/export_dixon_scores_site.py'
      - 'assets/css/scores-exacts.css'
      - 'assets/js/menu.js'
      - 'scripts/publish_exact_scores.py'
      - 'tests/test_exact_scores_tab.py'
      - 'manifest.json'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/run_exact_scores_v3_daily.py'
      - 'tests/test_exact_scores_daily_v3.py'
      - 'tests/test_public_scores_exact_days.py'
      - 'scripts/build_public_site.py'
      - 'scores-exacts.html'
      - 'scores-exacts.json'
      - 'assets/js/scores-exacts.js'
      - 'assets/css/scores-exacts.css'
      - 'assets/js/menu.js'
      - 'scripts/publish_exact_scores.py'
      - 'tests/test_exact_scores_tab.py'
      - 'service-worker.js'
      - 'manifest.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-page-and-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile and validate genuine prospective score feed publisher
        run: |
          python -m py_compile scripts/publish_exact_scores.py scripts/export_dixon_scores_site.py tests/test_exact_scores_tab.py
          python -m unittest discover -s tests -p 'test_exact_scores_tab.py' -v
          python -m unittest discover -s tests -p 'test_exact_scores_daily_v3.py' -v
          python -m unittest discover -s tests -p 'test_public_scores_exact_days.py' -v
      - name: JavaScript syntax and HTML navigation checks
        run: |
          node --check assets/js/scores-exacts.js
          node --check assets/js/menu.js
          node --check service-worker.js
          python - <<'PY'
          import json
          from html.parser import HTMLParser
          from pathlib import Path
          class Checker(HTMLParser):
              def __init__(self):
                  super().__init__();self.ids=set();self.links=set()
              def handle_starttag(self,tag,attrs):
                  d=dict(attrs)
                  if "id" in d:
                      assert d["id"] not in self.ids, f"duplicate id: {d['id']}"
                      self.ids.add(d["id"])
                  if tag=="a" and "href" in d:self.links.add(d["href"])
          h=Checker();h.feed(Path("scores-exacts.html").read_text())
          for key in ("scores-simple-list","scores-status","scores-date"):
              assert key in h.ids, key
          for page in ("index.html","pronos.html","scores-exacts.html"):
              assert "scores-exacts.html" in Path(page).read_text()
          assert "scores-exacts.html" in h.links
          assert "scores-grouped-list" not in h.ids
          assert "Top 10" in h_source
          h_source=Path("scores-exacts.html").read_text()
          for offset in (-1,0,1):
              assert 'data-scores-day="' + str(offset) + '"' in h_source
          builder=Path("scripts/build_public_site.py").read_text()
          for public_path in ("scores-exacts.html","scores-exacts.json","scores-exacts.js","scores-exacts.css","scores-exacts-daily","dixon-scores-daily"):
              assert public_path in builder, public_path
          sw=Path("service-worker.js").read_text()
          assert "'./scores-exacts.json'" in sw and "'./scores-exacts.html'" in sw
          p=json.loads(Path("scores-exacts.json").read_text())
          assert p["status"] in ("unavailable","published")
          assert len(p["simple"])<=5 and len(p["grouped"])<=5
          if p["status"]=="unavailable":
              assert p["simple"]==[] and p["grouped"]==[]
          else:
              assert p["origin"]=="prospective_prematch" and p["model"]=="machine_learning_v3_hybrid"
              assert p["simple"]
          assert len(h.ids)==len(set(h.ids))
          print("EXACT_SCORE_TAB_HTML_NAV_AND_NO_FAKE_FEED_OK")
          PY
