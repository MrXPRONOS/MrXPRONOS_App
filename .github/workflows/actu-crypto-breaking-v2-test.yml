name: Actu Crypto - 08 Breaking BTC ETH PREMIUM TEST ONLY

on:
  push:
    branches: [feature/actu-crypto-lot-06-10]
    paths:
      - 'crypto/export_breaking_v2.py'
      - 'crypto/test_breaking_v2.py'
      - 'crypto/send_crypto_breaking_v2_test.py'
      - 'scripts/render_crypto_breaking_v2.mjs'
      - '.github/workflows/actu-crypto-breaking-v2-test.yml'
  workflow_dispatch:
    inputs:
      send_telegram:
        description: "Envoyer une actualité REELLE corroborée au canal @predict_mrxp ?"
        type: boolean
        required: true
        default: false

permissions:
  contents: write

concurrency:
  group: actu-crypto-breaking-08-test
  cancel-in-progress: false

jobs:
  breaking-test:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      FOOTBALL_NEWS_BOT_TOKEN: ${{ secrets.FOOTBALL_NEWS_BOT_TOKEN }}
      TELEGRAM_TEST_CHAT_ID: '@predict_mrxp'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install open source dependencies
        run: |
          python -m pip install 'requests>=2.31,<3' 'feedparser>=6.0,<7'
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Offline security and correctness checks
        run: python -m unittest crypto.test_breaking_v2 -v
      - name: Export and render clearly labeled DEMO
        run: |
          python -m crypto.export_breaking_v2 --demo
          node scripts/render_crypto_breaking_v2.mjs --demo
      - name: Archive never-publishable DEMO
        uses: actions/upload-artifact@v4
        with:
          name: crypto-publication-08-breaking-DEMO
          path: crypto/generated/test/breaking_v2_demo.png
          if-no-files-found: error
          retention-days: 14
      - name: Collect verified REAL news only
        id: collect
        shell: bash
        run: |
          python -m crypto.export_breaking_v2
          if test -s crypto/generated/test/breaking_v2_data.json; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No recent independently corroborated event: skip REAL publication."
          fi
      - name: Render REAL poster
        if: steps.collect.outputs.found == 'true'
        run: node scripts/render_crypto_breaking_v2.mjs
      - name: Archive REAL poster and evidence
        if: steps.collect.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: crypto-publication-08-breaking-REAL
          path: |
            crypto/generated/test/breaking_v2.png
            crypto/generated/test/breaking_v2_data.json
          if-no-files-found: error
          retention-days: 14
      - name: Send REAL news to TEST channel only (explicit manual opt-in)
        if: (github.event_name == 'workflow_dispatch' && inputs.send_telegram == true || github.event_name == 'push' && contains(github.event.head_commit.message, '[breaking-test-send]')) && steps.collect.outputs.found == 'true'
        run: python -m crypto.send_crypto_breaking_v2_test
      - name: Persist anti-duplicate state on development branch only
        if: (github.event_name == 'workflow_dispatch' && inputs.send_telegram == true || github.event_name == 'push' && contains(github.event.head_commit.message, '[breaking-test-send]')) && steps.collect.outputs.found == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crypto/breaking_08_state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(crypto): record test publication #08"
            git push origin HEAD:feature/actu-crypto-lot-06-10
          fi
