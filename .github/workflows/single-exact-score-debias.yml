name: Single exact score - measure 1-1 bias correction
on:
  push:
    branches: [feature/single-exact-score-v1-20261020]
    paths:
      - 'bsd/single_exact_score_debias_study.py'
      - 'bsd/test_single_exact_score_debias.py'
      - '.github/workflows/single-exact-score-debias.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: single-score-1-1-study-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frozen-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Prepare read-only isolated dependencies
        run: python -m pip install requests cryptography
      - name: Test 1-1 logic
        run: |
          python -m py_compile bsd/single_exact_score_debias_study.py
          python -m unittest bsd/test_single_exact_score_debias.py -v
      - name: Restore encrypted match history READ ONLY
        env:
          BSD_HISTORY_KEY: ${{ secrets.BSD_HISTORY_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$BSD_HISTORY_KEY"
          git fetch --no-tags origin main
          git show origin/main:bsd/all_matches_bsd.enc.json > bsd/all_matches_bsd.enc.json
          python bsd/bsd_archive.py restore
          test -s bsd/all_matches_bsd.json
      - name: Compare corrected score model on historical 2024 2025 2026
        run: |
          set -euo pipefail
          python bsd/single_exact_score_debias_study.py --output tmp/single-exact-score/one-one-debias-study.json
          python - <<'PY'
          import json
          x=json.load(open("tmp/single-exact-score/one-one-debias-study.json"))
          model=x["training_2024"]
          assert model["2024_train_n"]>=120 and model["2024_validation_n"]>=80
          for y in ("2025","2026"):
              report=x["years"][y]
              assert report["baseline"]["n"]>=1000
              assert report["candidate"]["n"]==report["baseline"]["n"]
              assert 0<=report["candidate"]["one_one_share"]<=1
          assert x["research_only"] and not x["published"]
          print("ONE_ONE_FULL_HISTORICAL_AUDIT_OK",model["activated"])
          PY
      - name: Upload aggregate-only historical report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-one-debias-validation-${{ github.run_id }}
          path: tmp/single-exact-score/one-one-debias-study.json
          retention-days: 90
          if-no-files-found: ignore
      - name: Remove decrypted private history
        if: always()
        run: rm -f bsd/all_matches_bsd.json bsd/backfill_state.json
