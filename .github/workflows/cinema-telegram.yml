name: Cinéma Telegram - lot 1 (5 formats)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'test (canal test uniquement) ou production (protégée)'
        required: true
        default: test
        type: choice
        options: [test, production]
      format:
        description: 'Format à publier'
        required: true
        default: all
        type: choice
        options: [all, film, top5, sorties, soir, quiz]
      demo:
        description: 'Fiches fictives de démonstration (test uniquement)'
        type: boolean
        default: false
      dry_run:
        description: 'Aperçu sans envoi Telegram'
        type: boolean
        default: true
  push:
    branches: [feat/cinema-telegram-batch1]
    paths:
      - 'scripts/cinema_telegram.py'
      - 'tests/test_cinema_telegram.py'
      - '.github/workflows/cinema-telegram.yml'
  schedule:
    - cron: '17 9 * * *'  # 09:17 UTC / Lomé, chaque jour

permissions:
  contents: write
concurrency:
  group: cinema-telegram-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install requests
      - name: Unit tests (always)
        run: python -m unittest discover -s tests -p 'test_cinema_telegram.py' -v
      - name: Dry preview on feature push (no secrets, no sending)
        if: github.event_name == 'push'
        run: python scripts/cinema_telegram.py --mode test --format all --demo --dry-run
      - name: One-time real TMDB photo test in @predict_mrxp
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[cinema-live-test]') && github.ref == 'refs/heads/feat/cinema-telegram-batch1'
        env:
          CINEMA_TELEGRAM_BOT_TOKEN: ${{ secrets.CINEMA_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_SECONDARY: ${{ secrets.TELEGRAM_CHAT_ID_SECONDARY }}
        run: python scripts/cinema_telegram.py --mode test --format all
      - name: Manual or scheduled publication
        if: github.event_name != 'push'
        env:
          CINEMA_TELEGRAM_BOT_TOKEN: ${{ secrets.CINEMA_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CINEMA_PRODUCTION_CHAT_ID: ${{ secrets.CINEMA_PRODUCTION_CHAT_ID }}
          CINEMA_PRODUCTION_ENABLED: ${{ vars.CINEMA_PRODUCTION_ENABLED }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_SECONDARY: ${{ secrets.TELEGRAM_CHAT_ID_SECONDARY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_FORMAT: ${{ inputs.format }}
          INPUT_DEMO: ${{ inputs.demo }}
          INPUT_DRY: ${{ inputs.dry_run }}
        shell: bash
        run: |
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            if [[ "$CINEMA_PRODUCTION_ENABLED" != "true" ]]; then
              echo 'Production not enabled: schedule safely skipped'
              exit 0
            fi
            case "$(date -u +%u)" in
              1) SELECTED=film ;;
              2) SELECTED=top5 ;;
              3) SELECTED=sorties ;;
              4) SELECTED=soir ;;
              5) SELECTED=quiz ;;
              6) SELECTED=film ;;
              7) SELECTED=top5 ;;
              *) echo 'No matching slot'; exit 0 ;;
            esac
            python scripts/cinema_telegram.py --mode production --format "$SELECTED"
          else
            ARGS=(--mode "$INPUT_MODE" --format "$INPUT_FORMAT")
            [[ "$INPUT_DEMO" == "true" ]] && ARGS+=(--demo)
            [[ "$INPUT_DRY" == "true" ]] && ARGS+=(--dry-run)
            python scripts/cinema_telegram.py "${ARGS[@]}"
          fi
      - name: Persist publication history, including partial failures
        if: ${{ always() && !cancelled() && (github.event_name != 'push' || contains(github.event.head_commit.message, '[cinema-live-test]')) }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for file in cinema/sent_test.json cinema/sent_production.json; do
            if [[ -f "$file" ]]; then
              git add -- "$file"
            fi
          done
          if git diff --staged --quiet; then
            echo 'No new Telegram history to persist'
            exit 0
          fi
          git commit -m 'cinema: persist partial and completed Telegram deliveries [skip ci]'
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
