name: Mr XPRONOS - Combiné Photo Production

on:
  workflow_run:
    workflows: ["Shorts Coupons - Production"]
    types: [completed]
  push:
    branches: [main]
    paths: ['.github/workflows/accumulator-photo-production.yml']
  workflow_dispatch:
    inputs:
      mode:
        required: true
        default: dry-run
        type: choice
        options: [dry-run, production]

permissions:
  contents: write
  id-token: write

concurrency:
  group: mrxpronos-accumulator-photo-production
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event.workflow_run.head_branch == 'main' && (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ACCUMULATOR_MODE: production
      ACCUMULATOR_OUTPUT: telegram_out/accumulator_reference.png
      ACCUMULATOR_INPUT: telegram_out/accumulator_today.json
      ACCUMULATOR_DATA_REPORT: telegram_out/accumulator_data_report.json
      ACCUMULATOR_PREVIEW: telegram_out/accumulator_preview.png
      ACCUMULATOR_CROP_META: telegram_out/accumulator_crop.json
      ACCUMULATOR_SOCIAL_IMAGE: telegram_out/accumulator_preview.jpg
      ACCUMULATOR_MAX_MATCHES: '12'
      ACCUMULATOR_VIDEO_MANIFEST: telegram_out/video_used_matches.json
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_BUCKET: videos
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
      META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check latest BSD feed is valid when daily video has completed
        if: github.event_name == 'workflow_run'
        env:
          VIDEO_RUN_STARTED: ${{ github.event.workflow_run.run_started_at }}
        run: |
          python - <<'PY'
          import json,os
          from datetime import datetime,timezone,timedelta
          feed=json.load(open("data.json",encoding="utf-8"))
          generated=datetime.fromisoformat(feed["generated_at"].replace("Z","+00:00"))
          now=datetime.now(timezone.utc)
          assert generated<=now and now-generated<timedelta(hours=24), "Flux BSD trop ancien pour le combiné"
          print("ACCUMULATOR_POST_GENERATION_VERIFIED",generated.isoformat())
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install render and photo network dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
          python -m pip install requests Pillow
      - name: Verify and load IDs of fixtures already published in daily video
        id: ledger_read
        run: python scripts/read_accumulator_video_ledger.py
      - name: Validate production scripts
        run: |
          python -m py_compile scripts/d1_publication_ledger.py
          python -m unittest discover -s tests -p test_d1_publication_ledger.py -v
          python -m py_compile scripts/read_accumulator_video_ledger.py scripts/send_accumulator_production.py scripts/post_accumulator_social.py scripts/send_short_production_telegram.py scripts/create_short_from_telegram_coupons.py
          node --check scripts/prepare_accumulator_today.mjs
      - name: Select remaining fixtures and calculate simulated 50000 FCFA stake
        id: selection
        shell: bash
        run: |
          set +e
          node scripts/prepare_accumulator_today.mjs
          CODE=$?
          set -e
          if [ "$CODE" = "3" ]; then
            echo "has_matches=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$CODE" != "0" ]; then exit "$CODE"; fi
          echo "has_matches=true" >> "$GITHUB_OUTPUT"
      - name: Verify calculated potential win and selections
        if: steps.selection.outputs.has_matches == 'true'
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const d=JSON.parse(fs.readFileSync(process.env.ACCUMULATOR_INPUT));
          assert.equal(d.status,'Accepté');
          assert.ok(d.legs.length>=4 && d.legs.length<=12);
          assert.equal(d.stake_is_simulated,true);
          const calculated=Math.round(50000*Number(d.combined_odds));
          assert.equal(d.potential_win.replaceAll(/\D/g,''),String(calculated));
          console.log('ACCUMULATOR_PRODUCTION_CALC_OK',d.legs.length,calculated);
          NODE
      - name: Render full HD ticket and exact two-match preview
        if: steps.selection.outputs.has_matches == 'true'
        run: |
          node scripts/render_accumulator_ticket.mjs --input "$ACCUMULATOR_INPUT" --output "$ACCUMULATOR_OUTPUT"
          python scripts/create_accumulator_preview.py
          python - <<'PY'
          import os
          from PIL import Image
          with Image.open(os.environ["ACCUMULATOR_OUTPUT"]) as full, Image.open(os.environ["ACCUMULATOR_PREVIEW"]) as preview:
              assert full.width==preview.width==1080
              assert full.height>preview.height
              assert full.height+full.width<=10000
              preview.convert("RGB").save(os.environ["ACCUMULATOR_SOCIAL_IMAGE"],"JPEG",quality=88,optimize=True)
              print("ACCUMULATOR_PRODUCTION_IMAGES_OK",preview.size,full.size)
          PY
      - name: Send Telegram production photo album once
        id: telegram_send
        if: steps.selection.outputs.has_matches == 'true' && (github.event_name == 'workflow_run' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'production'))
        run: python scripts/send_accumulator_production.py
      - name: Publish photo to Facebook Instagram Threads
        id: social_publish
        if: steps.selection.outputs.has_matches == 'true' && (github.event_name == 'workflow_run' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'production'))
        run: python scripts/post_accumulator_social.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accumulator-photos-${{ github.run_id }}
          path: |
            telegram_out/accumulator_reference.png
            telegram_out/accumulator_preview.png
            telegram_out/accumulator_preview.jpg
            telegram_out/accumulator_today.json
            telegram_out/accumulator_crop.json
            telegram_out/accumulator_data_report.json
            telegram_out/video_used_matches.json
            telegram_out/accumulator_social_results.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Record accumulator production probe
        if: ${{ always() }}
        env:
          PROBE_ID: ${{ github.run_id }}
          PROBE_SHA: ${{ github.sha }}
          PROBE_EVENT: ${{ github.event_name }}
          PROBE_SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          PROBE_LEDGER: ${{ steps.ledger_read.outcome }}
          PROBE_SELECTION: ${{ steps.selection.outcome }}
          PROBE_HAS_MATCHES: ${{ steps.selection.outputs.has_matches }}
          PROBE_TELEGRAM: ${{ steps.telegram_send.outcome }}
          PROBE_SOCIAL: ${{ steps.social_publish.outcome }}
        run: |
          python - <<'PY'
          import json, os, datetime
          from pathlib import Path
          count=None
          p=Path("telegram_out/accumulator_data_report.json")
          if p.exists():
              try:
                  r=json.loads(p.read_text(encoding="utf-8"))
                  count={"day":r.get("day"),"included":r.get("included")}
              except (ValueError,OSError): pass
          x={
              "run_id":os.getenv("PROBE_ID"),"trigger_sha":os.getenv("PROBE_SHA"),
              "checked_at":datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "event":os.getenv("PROBE_EVENT"),
              "source_conclusion":os.getenv("PROBE_SOURCE_CONCLUSION"),
              "ledger_read":os.getenv("PROBE_LEDGER"),
              "selection":os.getenv("PROBE_SELECTION"),
              "has_matches":os.getenv("PROBE_HAS_MATCHES"),
              "telegram":os.getenv("PROBE_TELEGRAM"),
              "social":os.getenv("PROBE_SOCIAL"),
              "ticket":count,
              "cloudflare_token_present":bool(os.getenv("CLOUDFLARE_API_TOKEN")),
          }
          path=Path("ops/probes/accumulator-"+x["run_id"]+".json")
          path.parent.mkdir(parents=True,exist_ok=True)
          path.write_text(json.dumps(x,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print("MRX_ACCUMULATOR_PROBE",json.dumps(x,ensure_ascii=False))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "ops/probes/accumulator-${PROBE_ID}.json"
          git commit -m "ops(probe): record accumulator production outcome [skip ci]" || exit 0
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep "$attempt"
          done
          exit 1
