name: Prepare authenticated Hybrid V3 checkpoint
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare-hybrid-v3-checkpoint.yml'
      - 'scripts/prepare_hybrid_v3_checkpoint.py'
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mrx-v3-checkpoint-prepare
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONPATH: site
      ML_V2_HISTORY_KEY_B64: ${{ secrets.ML_V2_HISTORY_KEY_B64 }}
      SPORTDATA_API_KEY_1: ${{ secrets.SPORTDATA_API_KEY_1 }}
      SPORTDATA_API_KEY_2: ${{ secrets.SPORTDATA_API_KEY_2 }}
      SPORTDATA_API_KEY_3: ${{ secrets.SPORTDATA_API_KEY_3 }}
      SPORTDATA_API_KEY_4: ${{ secrets.SPORTDATA_API_KEY_4 }}
      SPORTDATA_API_KEY_5: ${{ secrets.SPORTDATA_API_KEY_5 }}
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          path: site
          fetch-depth: 20
      - uses: actions/checkout@v4
        with:
          ref: research/single-ml-v2-20261024
          path: model
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install required HistGB V3 dependencies only
        run: python -m pip install numpy scipy scikit-learn requests cryptography
      - name: Verify optimized model API before running
        run: |
          PYTHONPATH="model/research:model:site/scripts" python - <<'PY'
          import inspect
          from single_ml_v2 import backtest
          from single_ml_v3_checkpoint import forecast_from_checkpoint, load_checkpoint
          assert "production_v3_only" in inspect.signature(backtest).parameters
          assert "checkpoint_path" in inspect.signature(backtest).parameters
          print("NATIVE_HYBRID_V3_CHECKPOINT_API_OK")
          PY
      - name: Train only native Hybrid V3 and seal checkpoint
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python site/scripts/prepare_hybrid_v3_checkpoint.py --site-root site --model-root model
          test -s site/research/score_v3_model_checkpoints/$(date -u -d yesterday +%F).enc
      - name: Commit only encrypted historical days and model checkpoint
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/score_v3_encrypted_daily/*.enc
          git add research/score_v3_model_checkpoints/*.enc
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: authenticated private V3 fitted state [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
