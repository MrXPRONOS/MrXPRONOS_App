name: Neon LIVE ESPN corner parser regression
on:
  push:
    branches: [migration/supabase-to-free-stack-20261022]
    paths:
      - "migration/free-stack/live/index.signals-safe.mjs"
      - "tests/neon-live-espn-corners.test.mjs"
      - ".github/workflows/neon-live-espn-corners-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tests/neon-live-espn-corners.test.mjs
