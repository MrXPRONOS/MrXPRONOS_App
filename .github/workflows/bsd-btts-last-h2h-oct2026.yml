name: BSD V2 BTTS - Last H2H Rule Acceptance Oct 2026
on:
  push:
    branches: [feature/btts-last-h2h-required-20261104]
    paths:
      - .github/workflows/bsd-btts-last-h2h-oct2026.yml
  pull_request:
    branches: [main]
    paths:
      - 'bsd/bsd_v2_btts_h2h.py'
      - 'bsd/bsd_v2_btts_backtest.py'
      - 'bsd/bsd_v2_core.py'
      - 'bsd/test_bsd_v2_btts_h2h.py'
permissions:
  contents: read
concurrency:
  group: btts-last-h2h-oct2026
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      PYTHONPATH: bsd
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install BSD dependencies
        run: python -m pip install requests cryptography pillow 'lightgbm>=4.4,<5' scikit-learn
      - name: Compile and test strict H2H and original BTTS rules
        run: |
          python -m compileall -q bsd
          python -m unittest discover -s bsd -p 'test_bsd_v2_btts_h2h.py' -v
          python -m unittest discover -s bsd -p 'test_bsd_v2_btts.py' -v
          python -m unittest discover -s bsd -p 'test_bsd_v2_btts_four.py' -v
      - name: Run all BSD regression tests
        run: python -m unittest discover -s bsd -p 'test_*.py' -v
      - name: Restore historical archive read-only
        env:
          BSD_HISTORY_KEY: ${{ secrets.BSD_HISTORY_KEY }}
        run: python bsd/bsd_archive.py restore
      - name: Strict retrospective Oct 2026 with last H2H filter
        run: |
          python bsd/bsd_v2_btts_backtest.py \
            --max-test 30000 --start-date 2026-10-01 --end-date 2026-10-31 \
            --output bsd/btts_oct2026_last_h2h_audit.json
      - name: Verify effect and display before-after audit
        run: |
          python - <<'PY'
          import json
          d=json.load(open('bsd/btts_oct2026_last_h2h_audit.json',encoding='utf8'))
          t=d['test']
          assert t['start_date']=='2026-10-01' and t['end_date']=='2026-10-31'
          assert t['last_h2h_strict_filter_enabled'] is True
          assert t['same_btts_eligibility_as_production'] is True
          assert t['pre_last_h2h_selection']['eligible']>=t['eligible']
          before=t['pre_last_h2h_selection']
          after=t['by_minimum_confidence']['50']
          assert after['n']==t['eligible']
          assert before['wins']>=0 and after['wins']>=0
          out={
              'period':'2026-10-01..2026-10-31',
              'finished':t['population_finished'],
              'before_last_h2h':{'n':before['eligible'],'wins':before['wins'],'hit_rate':before['hit_rate'],
                                  'by_threshold':before['thresholds']},
              'after_last_h2h':{'n':after['n'],'wins':after['wins'],'hit_rate':after['hit_rate'],
                                'by_threshold':t['by_minimum_confidence']},
              'rejections':t['skips'],
              'eligible_coverage_pct':round(100*t['eligible']/before['eligible'],2)
                  if before['eligible'] else None,
              'brier_after_last_h2h':{
                  'bsd_v2':t['specialized_calibrated']['BTTS_YES']['brier']
                      if t['eligible'] else None,
                  'poisson':t['baseline_calibrated']['BTTS_YES']['brier']
                      if t['eligible'] else None,
                  'lightgbm':t['four_model_shadow'].get('lightgbm',{}).get('brier'),
                  'bivariate':t['four_model_shadow'].get('bivariate',{}).get('brier'),
                  'zip':t['four_model_shadow'].get('zero_inflated',{}).get('brier'),
              },
              'limits':'Preprice classification, not placed/published bets; no historical odds ROI.'
          }
          print('BSD_BTTS_H2H_OCT2026_REPORT='+json.dumps(out,ensure_ascii=False))
          open('bsd/btts_oct2026_last_h2h_summary.json','w',encoding='utf8').write(
              json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Upload before-after results
        uses: actions/upload-artifact@v4
        with:
          name: btts-last-h2h-oct2026-report
          path: |
            bsd/btts_oct2026_last_h2h_audit.json
            bsd/btts_oct2026_last_h2h_summary.json
          retention-days: 14
          if-no-files-found: error
