name: BSD V2 - Audit arrondi des cotes indicatives
on:
  push:
    branches: [fix/bsd-v2-indicative-odds-floor-20261103]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install requests cryptography pillow
      - run: python -m compileall -q bsd
      - run: python -m unittest discover -s bsd -p 'test_*.py' -v
      - run: node --check assets/js/main.js
