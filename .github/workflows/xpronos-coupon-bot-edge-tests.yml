name: XPRONOS 4+ - Tests webhook
on:
  push:
    paths:
      - 'supabase/functions/xpronos-coupons-bot/**'
      - 'telegram-coupons-bot/sql/001_coupons_bot.sql'
      - '.github/workflows/xpronos-coupon-bot-edge-tests.yml'
  pull_request:
    paths:
      - 'supabase/functions/xpronos-coupons-bot/**'
      - 'telegram-coupons-bot/sql/001_coupons_bot.sql'
      - '.github/workflows/xpronos-coupon-bot-edge-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Tests cotes et structure des coupons
        run: deno test supabase/functions/xpronos-coupons-bot/coupon_logic_test.ts
