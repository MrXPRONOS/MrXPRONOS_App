name: Import conseils premium assets
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-conseils-assets.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install WebP tools
        run: sudo apt-get update -y && sudo apt-get install -y webp
      - name: Download and optimize Conseils assets
        run: |
          set -euxo pipefail
          mkdir -p assets/images/conseils-premium /tmp/conseils-assets
          curl -L --fail --retry 3 "https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:09ad97f3-aa34-4d56-97d9-d983c2462697" -o /tmp/conseils-assets/hero.png
          curl -L --fail --retry 3 "https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:5932bc11-ad1c-4886-96ec-e5711c183700" -o /tmp/conseils-assets/guide.png
          curl -L --fail --retry 3 "https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:8cda502b-e423-4601-9eb9-638c5c2ada8c" -o /tmp/conseils-assets/bankroll.png
          curl -L --fail --retry 3 "https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:09fcaad1-4041-48be-9094-3d7d463b00ca" -o /tmp/conseils-assets/value.png
          curl -L --fail --retry 3 "https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:cb2c2b97-05b8-463d-96b9-a33ee4589a9e" -o /tmp/conseils-assets/danger.png
          curl -L --fail --retry 3 "https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:803b0616-844f-4849-8fef-aab559bccae5" -o /tmp/conseils-assets/discipline.png
          curl -L --fail --retry 3 "https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:0a977ad4-b1da-44e0-9fc1-ac44f55ed1e2" -o /tmp/conseils-assets/analysis.png
          curl -L --fail --retry 3 "https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:d6c81e2a-558f-4160-b13a-9f1f17f8d616" -o /tmp/conseils-assets/academy.png
          cwebp -quiet -q 84 -resize 1920 0 /tmp/conseils-assets/hero.png -o assets/images/conseils-premium/hero-conseils.webp
          cwebp -quiet -q 86 -resize 512 512 /tmp/conseils-assets/guide.png -o assets/images/conseils-premium/icon-conseils-guide.webp
          cwebp -quiet -q 86 -resize 512 512 /tmp/conseils-assets/bankroll.png -o assets/images/conseils-premium/icon-conseils-bankroll.webp
          cwebp -quiet -q 86 -resize 512 512 /tmp/conseils-assets/value.png -o assets/images/conseils-premium/icon-conseils-value.webp
          cwebp -quiet -q 86 -resize 512 512 /tmp/conseils-assets/danger.png -o assets/images/conseils-premium/icon-conseils-danger.webp
          cwebp -quiet -q 86 -resize 512 512 /tmp/conseils-assets/discipline.png -o assets/images/conseils-premium/icon-conseils-discipline.webp
          cwebp -quiet -q 86 -resize 512 512 /tmp/conseils-assets/analysis.png -o assets/images/conseils-premium/icon-conseils-analysis.webp
          cwebp -quiet -q 86 -resize 512 512 /tmp/conseils-assets/academy.png -o assets/images/conseils-premium/icon-conseils-academy.webp
      - name: Commit Conseils assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/conseils-premium
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "assets(conseils): add generated premium visuals"
          git fetch origin main
          git rebase origin/main
          git push
