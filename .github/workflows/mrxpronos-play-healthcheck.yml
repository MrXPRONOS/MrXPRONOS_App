name: MRXPRONOS Play - Telegram public healthcheck
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/mrxpronos-play-healthcheck.yml'
      - 'mrxpronos-play/worker.js'
permissions:
  contents: read
jobs:
  check-telegram-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check bot token identity and backend health (no secrets)
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --max-time 20 \
            "https://mrxpronos-play.cinecanaux-xpronos.workers.dev/api/health" > /tmp/mrxp-health.json
          python3 - <<'PY'
          import json
          with open('/tmp/mrxp-health.json', encoding='utf-8') as f:
              data=json.load(f)
          safe={k:data.get(k) for k in ('ok','bot_connected','telegram_token_valid','bot_username','correct_bot','db_connected')}
          print('Health:',safe)
          if not all([safe['ok'],safe['bot_connected'],safe['telegram_token_valid'],safe['correct_bot'],safe['db_connected']]):
              raise SystemExit('ERROR: Telegram bot identity or Cloudflare backend incomplete')
          print('SUCCESS: Cloudflare Worker is bound to the expected Telegram bot.')
          PY

      - name: Check avatar authorization and Mini App markup
        run: |
          set -euo pipefail
          BASE="https://mrxpronos-play.cinecanaux-xpronos.workers.dev"
          CODE="$(curl --silent --show-error --max-time 20 -o /tmp/mrxp-guest-avatar.json -w '%{http_code}' "$BASE/api/avatar")"
          echo "Guest avatar endpoint HTTP: $CODE"
          test "$CODE" = "401"
          curl --fail --silent --show-error --max-time 20 "$BASE/" > /tmp/mrxp-index.html
          python3 - <<'PY'
          import json
          from pathlib import Path
          resp=json.loads(Path('/tmp/mrxp-guest-avatar.json').read_text())
          assert resp.get('code')=='INITDATA_ABSENTE',resp
          html=Path('/tmp/mrxp-index.html').read_text()
          assert 'loadTelegramAvatar' in html,'Client avatar integration missing'
          assert 'wheel-center img' in html,'Wheel center styling missing'
          assert 'translate(-50%,-50%)' in html,'Wheel not centred'
          assert 'TAPOTER POUR GAGNER' in html,'Tap instruction missing'
          assert 'side-link img{width:28px' in html,'Quick action icons not 28px'
          assert 'side-link img{width:26px' in html,'Small screen action icons not 26px'
          assert 'transform:translateY(-18px)' in html,'Quick actions not raised'
          print('SUCCESS: avatar endpoint protected, frontend avatar loading and wheel centering deployed')
          PY
