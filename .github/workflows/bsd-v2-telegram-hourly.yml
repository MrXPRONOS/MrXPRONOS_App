name: BSD V2 - Diffusion Telegram aux 15 minutes
run-name: "BSD V2 - Coupons Telegram (${{ inputs.trigger_source || github.event_name }})"

on:
  push:
    branches: [main]
    paths:
      - 'bsd/bsd_v2_telegram.py'
      - 'scripts/telegram_ledger_gateway.py'
      - '.github/workflows/bsd-v2-telegram-hourly.yml'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      trigger_source:
        description: "Origine : cron-job.org ou manuel"
        required: false
        default: "manual"
        type: string
      destination:
        description: "Destination d'un lancement manuel"
        required: true
        default: "test"
        type: choice
        options:
          - "test"
          - "production"

permissions:
  contents: write
  id-token: write

concurrency:
  group: bsd-v2-telegram-hourly
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Journaliser le déclenchement
        env:
          TRIGGER_SOURCE: ${{ inputs.trigger_source || github.event_name }}
        run: |
          echo "Déclenchement coupons : ${TRIGGER_SOURCE}"
          echo "Début UTC : $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
      - name: Read latest site predictions, without BSD API
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Telegram HTTP dependency only
        run: python -m pip install requests pillow
      - name: Router le canal Telegram
        id: route
        env:
          TRIGGER_SOURCE: ${{ inputs.trigger_source || github.event_name }}
          MANUAL_DESTINATION: ${{ inputs.destination || 'test' }}
          PROD_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_CHAT_ID: ${{ secrets.TELEGRAM_TEST_CHAT_ID || '@predict_mrxp' }}
        shell: bash
        run: |
          set -euo pipefail
          DEST="$MANUAL_DESTINATION"
          if [ "$TRIGGER_SOURCE" = "cron-job.org" ] || [ "$TRIGGER_SOURCE" = "push" ] || [ "$TRIGGER_SOURCE" = "schedule" ]; then
            DEST="production"
          fi
          if [ "$DEST" = "production" ]; then
            test -n "$PROD_CHAT_ID"
            echo "TELEGRAM_CHAT_ID=$PROD_CHAT_ID" >> "$GITHUB_ENV"
          else
            if [ -z "$TEST_CHAT_ID" ]; then
              echo "::error::TELEGRAM_TEST_CHAT_ID manquant. Le test ne peut pas retomber sur la production."
              exit 1
            fi
            echo "TELEGRAM_CHAT_ID=$TEST_CHAT_ID" >> "$GITHUB_ENV"
          fi
          echo "destination=$DEST" >> "$GITHUB_OUTPUT"
          echo "BSD_TELEGRAM_ROUTE destination=$DEST"

      - name: Vérifier le canal avant tout envoi BSD manuel de test
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.trigger_source != 'cron-job.org' && inputs.destination != 'production' }}
        env:
          TELEGRAM_TEST_CHAT_ID: ${{ secrets.TELEGRAM_TEST_CHAT_ID || '@predict_mrxp' }}
          TELEGRAM_TEST_GUARD_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python scripts/telegram_test_guard.py
      - name: D1 ledger tests before production delivery
        run: |
          python -m py_compile bsd/bsd_v2_telegram.py scripts/telegram_ledger_gateway.py
          python -m unittest discover -s tests -p test_telegram_ledger_gateway.py -v
      - name: Send single picks and combinations around one hour before kickoff
        id: coupon_send
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        shell: bash
        run: |
          set -o pipefail
          python bsd/bsd_v2_telegram.py --data data.json 2>&1 | tee telegram-production-probe.log

      # Bluesky shares the production cron cadence, but test Telegram runs never post.
      - name: Publish eligible BSD V2 cards to Bluesky (production only)
        if: ${{ steps.route.outputs.destination == 'production' }}
        continue-on-error: true
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${BLUESKY_HANDLE:-}" ] || [ -z "${BLUESKY_APP_PASSWORD:-}" ]; then
            echo "BLUESKY_DISABLED: compte ou mot de passe d'application non configuré"
            exit 0
          fi
          python -m pip install 'atproto>=0.0.60,<1'
          python bsd/bsd_v2_bluesky.py --data data.json --publish --max-posts 4

      - name: Record production coupon workflow probe
        if: ${{ always() }}
        env:
          PROBE_ID: ${{ github.run_id }}
          PROBE_ATTEMPT: ${{ github.run_attempt }}
          PROBE_SHA: ${{ github.sha }}
          PROBE_EVENT: ${{ github.event_name }}
          PROBE_COUPON: ${{ steps.coupon_send.outcome }}
          PROBE_DEST: ${{ steps.route.outputs.destination }}
        run: |
          python - <<'PY'
          import os, json, datetime
          from pathlib import Path
          log=Path("telegram-production-probe.log")
          raw=log.read_text(encoding="utf-8",errors="replace") if log.exists() else ""
          report=None
          for line in raw.splitlines():
              if line.startswith("BSD_V2_TELEGRAM:"):
                  try: report=json.loads(line.split(":",1)[1].strip())
                  except (ValueError,TypeError): pass
          data={
              "run_id":os.environ["PROBE_ID"],"attempt":os.environ["PROBE_ATTEMPT"],
              "event":os.environ["PROBE_EVENT"],"trigger_sha":os.environ["PROBE_SHA"],
              "checked_at":datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "destination":os.environ.get("PROBE_DEST"),
              "coupon_step":os.environ.get("PROBE_COUPON"),
              "report":report,
              "error_hints":[line[:150] for line in raw.splitlines()
                  if line.startswith(("TELEGRAM_BSD_ERROR:","BSD_COMBO_ERROR","TELEGRAM_BSD_RELEASE_ERROR:"))][:5],
          }
          p=Path("ops/probes/telegram-"+data["run_id"]+".json")
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print("MRX_TELEGRAM_PROBE",json.dumps(data,ensure_ascii=False))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "ops/probes/telegram-${PROBE_ID}.json"
          git commit -m "ops(probe): record Telegram production attempt [skip ci]" || exit 0
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep "$attempt"
          done
          echo "::error::Could not persist Telegram probe" >&2
          exit 1
