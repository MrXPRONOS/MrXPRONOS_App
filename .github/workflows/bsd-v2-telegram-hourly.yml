name: BSD V2 - Diffusion Telegram aux 15 minutes
run-name: "BSD V2 - Coupons Telegram (${{ inputs.trigger_source || github.event_name }})"

on:
  push:
    branches: [main]
    paths:
      - 'bsd/bsd_v2_telegram.py'
      - 'scripts/telegram_ledger_gateway.py'
      - '.github/workflows/bsd-v2-telegram-hourly.yml'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      trigger_source:
        description: "Origine : cron-job.org ou manuel"
        required: false
        default: "manual"
        type: string
      destination:
        description: "Destination d'un lancement manuel"
        required: true
        default: "test"
        type: choice
        options:
          - "test"
          - "production"

permissions:
  contents: read
  id-token: write

concurrency:
  group: bsd-v2-telegram-hourly
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Journaliser le déclenchement
        env:
          TRIGGER_SOURCE: ${{ inputs.trigger_source || github.event_name }}
        run: |
          echo "Déclenchement coupons : ${TRIGGER_SOURCE}"
          echo "Début UTC : $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
      - name: Read latest site predictions, without BSD API
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Telegram HTTP dependency only
        run: python -m pip install requests pillow
      - name: Router le canal Telegram
        id: route
        env:
          TRIGGER_SOURCE: ${{ inputs.trigger_source || github.event_name }}
          MANUAL_DESTINATION: ${{ inputs.destination || 'test' }}
          PROD_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_CHAT_ID: ${{ secrets.TELEGRAM_TEST_CHAT_ID || '@predict_mrxp' }}
        shell: bash
        run: |
          set -euo pipefail
          DEST="$MANUAL_DESTINATION"
          if [ "$TRIGGER_SOURCE" = "cron-job.org" ] || [ "$TRIGGER_SOURCE" = "push" ] || [ "$TRIGGER_SOURCE" = "schedule" ]; then
            DEST="production"
          fi
          if [ "$DEST" = "production" ]; then
            test -n "$PROD_CHAT_ID"
            echo "TELEGRAM_CHAT_ID=$PROD_CHAT_ID" >> "$GITHUB_ENV"
          else
            if [ -z "$TEST_CHAT_ID" ]; then
              echo "::error::TELEGRAM_TEST_CHAT_ID manquant. Le test ne peut pas retomber sur la production."
              exit 1
            fi
            echo "TELEGRAM_CHAT_ID=$TEST_CHAT_ID" >> "$GITHUB_ENV"
          fi
          echo "destination=$DEST" >> "$GITHUB_OUTPUT"
          echo "BSD_TELEGRAM_ROUTE destination=$DEST"

      - name: Vérifier le canal avant tout envoi BSD manuel de test
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.trigger_source != 'cron-job.org' && inputs.destination != 'production' }}
        env:
          TELEGRAM_TEST_CHAT_ID: ${{ secrets.TELEGRAM_TEST_CHAT_ID || '@predict_mrxp' }}
          TELEGRAM_TEST_GUARD_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python scripts/telegram_test_guard.py
      - name: D1 ledger tests before production delivery
        run: |
          python -m py_compile bsd/bsd_v2_telegram.py scripts/telegram_ledger_gateway.py
          python -m unittest discover -s tests -p test_telegram_ledger_gateway.py -v
      - name: Send single picks and combinations around one hour before kickoff
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python bsd/bsd_v2_telegram.py --data data.json

