name: Film Relay - Validation sans publication

on:
  push:
    branches: [main]
    paths:
      - 'telegram-film-relay/film_relay/**'
      - 'telegram-film-relay/scripts/merge_state.py'
      - 'telegram-film-relay/tests/**'
      - 'telegram-film-relay/scripts/channel_audit.py'
      - '.github/workflows/cinex-channel-audit.yml'
      - 'scripts/telegram_channel_monitor_v2.py'
      - 'scripts/merge_channel_monitor.py'
      - 'tests/test_telegram_channel_monitor*.py'
      - '.github/workflows/telegram-channel-monitor-daily.yml'
      - '.github/workflows/telegram-film-tests.yml'
  pull_request:
    paths:
      - 'telegram-film-relay/film_relay/**'
      - 'telegram-film-relay/tests/**'
      - 'telegram-film-relay/scripts/channel_audit.py'
      - '.github/workflows/cinex-channel-audit.yml'
      - 'scripts/telegram_channel_monitor_v2.py'
      - 'scripts/merge_channel_monitor.py'
      - 'tests/test_telegram_channel_monitor*.py'
      - '.github/workflows/telegram-channel-monitor-daily.yml'
      - '.github/workflows/telegram-film-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les dépendances
        run: python -m pip install -r telegram-film-relay/requirements.txt
      - name: Vérifier syntaxe Python
        working-directory: telegram-film-relay
        run: python -m compileall -q film_relay scripts tests
      - name: Exécuter tous les tests sans connexion Telegram
        working-directory: telegram-film-relay
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -v
      - name: Valider le moniteur JSON GitHub sans Telegram
        run: python -m unittest discover -s tests -p 'test_telegram_channel_monitor*.py' -v
      - name: Valider l'audit des canaux en simulation sans Telegram
        working-directory: telegram-film-relay
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -p 'test_channel_audit.py' -v
