name: 'CineX - Vidéothèque centrale : diagnostic et copies limitées'

on:
  # One-shot NON-DESTRUCTIVE diagnostic when the owner-confirmed channel goes live.
  push:
    branches: [main]
    paths:
      - 'telegram-film-relay/.cinex-unified-stock-diagnostic-once'
  workflow_dispatch:
    inputs:
      apply:
        description: "Copier réellement les vidéos déjà archivées vers le nouveau canal privé"
        type: boolean
        default: false
        required: false
      per_channel:
        description: "Maximum par catégorie pour le premier passage"
        type: choice
        options: ['1', '2', '5', '10']
        default: '2'
        required: false

permissions:
  contents: read

concurrency:
  group: mrx-telegram-personal-account
  cancel-in-progress: false
  queue: max

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: telegram-film-relay
    env:
      PYTHONPATH: .
      TG_API_ID: ${{ secrets.TG_API_ID }}
      TG_API_HASH: ${{ secrets.TG_API_HASH }}
      TG_STRING_SESSION: ${{ secrets.TG_SESSION_STRING || secrets.TG_STRING_SESSION || secrets.TG_STREAM_SESSION }}
      CINEX_UNIFIED_PRIVATE_CHANNEL: ${{ vars.CINEX_UNIFIED_PRIVATE_CHANNEL }}
      CINEX_UNIFIED_STOCK_APPROVED_SHA256: '57b1f0a97d7db124ab9f72f470f7d63b92960e06b876397795e5780f5c5cc2b8'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CINEX_RIGHTS_VERIFIED: ${{ vars.CINEX_RIGHTS_VERIFIED }}
      TG_PRIVATE_CHANNEL: ${{ vars.TG_PRIVATE_CHANNEL }}
      SERIES_PUBLIC_CHANNEL: ${{ vars.SERIES_PUBLIC_CHANNEL || '@seriesvf_cinex' }}
      SERIES_PRIVATE_CHANNEL: ${{ vars.SERIES_PRIVATE_CHANNEL }}
      DESIR_PUBLIC_CHANNEL: ${{ vars.DESIR_PUBLIC_CHANNEL || '@CineXDesirfr' }}
      DESIR_PRIVATE_CHANNEL: ${{ vars.DESIR_PRIVATE_CHANNEL }}
      COMEDIE_PUBLIC_CHANNEL: ${{ vars.COMEDIE_PUBLIC_CHANNEL }}
      COMEDIE_PRIVATE_CHANNEL: ${{ vars.COMEDIE_PRIVATE_CHANNEL }}
      ANIME_PUBLIC_CHANNEL: ${{ vars.ANIME_PUBLIC_CHANNEL || '@CineXAnimeFR' }}
      ANIME_PRIVATE_CHANNEL: ${{ vars.ANIME_PRIVATE_CHANNEL }}
      ACTION_PUBLIC_CHANNEL: ${{ vars.ACTION_PUBLIC_CHANNEL || '@filmsaction2026vf' }}
      ACTION_PRIVATE_CHANNEL: ${{ vars.ACTION_PRIVATE_CHANNEL }}
    steps:
      - uses: actions/checkout@v4
      - name: Respecter le délai Telegram
        env:
          TG_PERSONAL_COOLDOWN_UNTIL_UTC: ${{ vars.TG_PERSONAL_COOLDOWN_UNTIL_UTC }}
        run: python3 scripts/check_personal_cooldown.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les dépendances
        run: python -m pip install -r requirements.txt
      - name: Vérifier la configuration
        shell: bash
        run: |
          set -euo pipefail
          # The private ID can be read from the existing verified CineRadar D1
          # record, but only when its SHA-256 matches the owner's confirmation.
          python3 - <<'PY'
          from film_relay.unified_download import configured_private_id
          approved = configured_private_id()
          if approved is None:
              raise SystemExit("No owner-approved central private stock")
          print("Canal privé CinéRadar confirmé par le registre et empreinte SHA-256.")
          PY
          [[ -n "$TG_API_ID" && -n "$TG_API_HASH" && -n "$TG_STRING_SESSION" ]] || {
            echo "::error::Secrets de session Telegram manquants."
            exit 1
          }
      - name: Auditer sans suppression, puis copier seulement si demandé
        shell: bash
        env:
          RUN_APPLY: ${{ inputs.apply }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "$RUN_APPLY" == "true" ]]; then
            python -m film_relay.unified_library_backfill --apply --per-channel "${{ inputs.per_channel || '1' }}" --history 1000
          else
            python -m film_relay.unified_library_backfill --per-channel "${{ inputs.per_channel || '1' }}" --history 1000
          fi
