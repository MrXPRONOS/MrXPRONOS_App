name: Cine Radar — Public Channel Avatars
on:
  workflow_dispatch:
  schedule:
    - cron: '37 5 * * *'
  push:
    branches: [main]
    paths:
      - 'cinecanaux/.avatar-refresh-trigger'
      - 'cinecanaux/refresh_channel_avatars.py'
      - 'cinecanaux/refresh_private_avatars.py'
      - '.github/workflows/cine-radar-avatars.yml'
permissions:
  contents: write
concurrency:
  group: mrx-telegram-personal-account
  cancel-in-progress: false
  queue: max
jobs:
  avatars:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: telegram-film-relay/requirements.txt
      - name: Install dependencies
        run: pip install -r telegram-film-relay/requirements.txt
      - name: Retrieve public channel profile pictures only
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_STRING_SESSION: ${{ secrets.TG_SESSION_STRING || secrets.TG_STRING_SESSION || secrets.TG_STREAM_SESSION }}
        run: python cinecanaux/refresh_channel_avatars.py
      - name: Retrieve verified private channel profile pictures
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION_STRING || secrets.TG_STRING_SESSION || secrets.TG_STREAM_SESSION }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python cinecanaux/refresh_private_avatars.py
      - name: Commit actual public and private profile images and manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cinecanaux/assets/avatars cinecanaux/assets/avatar_index.json
          if git diff --cached --quiet; then
            echo "No avatar updates"
            exit 0
          fi
          git commit -m "assets(cineradar): refresh actual public Telegram avatars [skip ci]"
          git push origin HEAD:main
