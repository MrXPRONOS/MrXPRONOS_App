name: Telegram - MR XPRONOS F dossier + e-book (cinéma vérifié)
# Secure RPC JWT role compatibility patch verified on 2026-11-22

on:
  schedule:
    - cron: '17 13 * * *'
  push:
    branches: [main, 'fix/telegram-cinema-publishing-audit-20261122']
    paths:
      - '.github/workflows/telegram-folder-mrxpronos-f-daily.yml'
      - 'scripts/send_cinema_ebook_and_folder.py'
      - 'scripts/publish_ebook_campaign_test.py'
      - 'scripts/send_telegram_folder_promo_test.py'
      - 'scripts/telegram_test_guard.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-folder-mrxpronos-f-daily
  cancel-in-progress: false

jobs:
  combined-cinema:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/send_cinema_ebook_and_folder.py
            scripts/publish_ebook_campaign_test.py
            scripts/send_telegram_folder_promo_test.py
            scripts/telegram_test_guard.py
            assets/marketing/telegram-ebook-2026-11/affiche-promo-1938-fcfa.jpg
            assets/telegram/mrxpronos_f_folder_promo.jpg
            assets/telegram/mrxpronos_f_folder_promo.mp4
          sparse-checkout-cone-mode: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer Requests
        run: python -m pip install --disable-pip-version-check 'requests>=2.31,<3'
      - name: Vérifier syntaxe, médias, titres et boutons sans publication
        run: |
          python -m py_compile scripts/send_cinema_ebook_and_folder.py
          python scripts/send_cinema_ebook_and_folder.py --check
      - name: Diffuser les deux campagnes, uniquement dans les canaux cinéma vérifiés
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: python scripts/send_cinema_ebook_and_folder.py --send