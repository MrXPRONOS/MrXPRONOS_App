name: BSD V3 - BTTS NO parallel acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - 'bsd_v3/btts_no_model.py'
      - 'bsd_v3/btts_no_model_experiment.py'
      - 'bsd_v3/btts_no_parallel.py'
      - '.github/workflows/bsd-v3-btts-no-parallel.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  window:
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: select
            start: '2025-01-01'
            end: '2025-06-30'
          - key: validate
            start: '2025-07-01'
            end: '2025-12-31'
          - key: test_h1
            start: '2026-01-01'
            end: '2026-06-30'
          - key: test_h2
            start: '2026-07-01'
            end: '2026-10-31'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: bsd
      BSD_HISTORY_KEY: ${{ secrets.BSD_HISTORY_KEY }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install requests cryptography pillow
      - run: python bsd/bsd_archive.py restore
      - name: Evaluate window
        env:
          KEY: ${{ matrix.key }}
          START: ${{ matrix.start }}
          END: ${{ matrix.end }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          from bsd_archive import _read_json
          from bsd_v3.btts_no_parallel import evaluate_window
          history=_read_json(Path("bsd/all_matches_bsd.json"),None)
          report=evaluate_window(history,os.environ["START"],os.environ["END"])
          Path(f"{os.environ['KEY']}.json").write_text(json.dumps(report,indent=2),encoding="utf-8")
          print("BTTS_NO_WINDOW",os.environ["KEY"],json.dumps({
              "population":report["population"],
              "model":report["model"],
          }))
          PY
      - if: always()
        run: rm -f bsd/all_matches_bsd.json bsd/backfill_state.json
      - uses: actions/upload-artifact@v4
        with:
          name: btts-no-${{ matrix.key }}
          path: ${{ matrix.key }}.json
          retention-days: 30

  aggregate:
    needs: window
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: btts-no-*
          path: windows
          merge-multiple: true
      - name: Aggregate acceptance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from bsd_v3.btts_no_parallel import aggregate_windows
          load=lambda name: json.loads(Path("windows",name+".json").read_text())
          report=aggregate_windows(load("select"),load("validate"),
                                   [load("test_h1"),load("test_h2")])
          Path("btts_no_parallel_result.json").write_text(
              json.dumps(report,indent=2),encoding="utf-8")
          print("BTTS_NO_ACCEPTANCE",json.dumps(report))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: btts-no-acceptance-${{ github.run_id }}
          path: btts_no_parallel_result.json
          retention-days: 30
