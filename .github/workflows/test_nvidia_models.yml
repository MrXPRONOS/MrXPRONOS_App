name: NVIDIA - test all AI models

on:
  workflow_dispatch:
    inputs:
      category:
        description: "Catégorie de modèles"
        type: choice
        required: true
        default: all
        options:
          - all
          - chat
          - embedding
          - rerank
          - specialized
      repeats:
        description: "Mesures par modèle (1-3)"
        type: choice
        required: true
        default: "1"
        options:
          - "1"
          - "2"
          - "3"
      limit:
        description: "Nombre maximum (0 = tous les modèles)"
        required: true
        default: "0"
        type: string
      models:
        description: "IDs NVIDIA séparés par virgule (vide = découverte automatique)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: nvidia-model-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    name: Tester les modèles NVIDIA
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer les dépendances
        run: python -m pip install --disable-pip-version-check "requests>=2.31,<3"
      - name: Vérifier le secret
        shell: bash
        run: |
          if [ -z "$NVIDIA_API_KEY" ]; then
            echo "::error::Ajouter NVIDIA_API_KEY dans Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "::add-mask::$NVIDIA_API_KEY"
      - name: Tester tous les modèles sélectionnés
        env:
          TEST_CATEGORY: ${{ inputs.category }}
          TEST_REPEATS: ${{ inputs.repeats }}
          TEST_LIMIT: ${{ inputs.limit }}
          TEST_MODELS: ${{ inputs.models }}
        shell: bash
        run: |
          python scripts/test_nvidia_models.py \
            --category "$TEST_CATEGORY" \
            --repeats "$TEST_REPEATS" \
            --limit "$TEST_LIMIT" \
            --models "$TEST_MODELS" \
            --delay 2 \
            --timeout 35 \
            --out reports/nvidia-models
      - name: Publier les résultats téléchargeables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-modeles-nvidia-${{ github.run_id }}
          path: reports/nvidia-models/
          if-no-files-found: warn
          retention-days: 30
