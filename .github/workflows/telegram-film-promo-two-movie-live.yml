name: CinéX - Essai réel 2 films puis publicité

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mrx-telegram-film-state
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les dépendances
        run: pip install -r telegram-film-relay/requirements.txt
      - name: Vérifier 2 films et boutons sans publication
        working-directory: telegram-film-relay
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -q
      - name: Publier exactement deux films puis la publicité en trois canaux
        working-directory: telegram-film-relay
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_STRING_SESSION: ${{ secrets.TG_SESSION_STRING || secrets.TG_STRING_SESSION || secrets.TG_STREAM_SESSION }}
          TG_APPROVED_SOURCES_JSON: ${{ secrets.TG_APPROVED_SOURCES_JSON }}
          CINEX_BOT_TOKEN: ${{ secrets.FOOTBALL_NEWS_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          TG_PRIVATE_CHANNEL: ${{ vars.TG_PRIVATE_CHANNEL }}
          TG_PUBLIC_CHANNEL: ${{ vars.TG_PUBLIC_CHANNEL }}
          TG_MIRROR_CHANNEL: ${{ vars.TG_MIRROR_CHANNEL || '@Torrent9SeriesFilms' }}
          TG_PRIVATE_INVITE_LINK: ${{ secrets.CINEX_PRIVATE_INVITE_LINK }}
          TG_RIGHTS_ATTESTED: 'true'
          FILM_PUBLISH_ENABLED: 'true'
          FILM_MAX_POSTS_PER_RUN: '2'
          FILM_REQUIRE_PUBLICATION: 'true'
          FILM_RESCAN_HISTORY: 'false'
          CINEX_PROMOS_ENABLED: 'true'
          PYTHONPATH: .
        run: python -m film_relay.runner
      - name: Enregistrer les reçus et empêcher les doublons
        if: always()
        run: |
          set -e
          STATE_FILE="telegram-film-relay/state/state.json"
          if git diff --quiet -- "$STATE_FILE"; then
            echo "Aucun nouveau reçu."
            exit 0
          fi
          cp "$STATE_FILE" "$RUNNER_TEMP/cinex-checkpoint.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin main
            git reset --hard origin/main
            python telegram-film-relay/scripts/merge_state.py \
              "$RUNNER_TEMP/cinex-checkpoint.json" "$STATE_FILE"
            if git diff --quiet -- "$STATE_FILE"; then
              echo "Reçus déjà sauvegardés."
              exit 0
            fi
            git add "$STATE_FILE"
            git commit -m "state: two movies and rotating promo [skip ci]"
            if git push origin HEAD:main; then
              echo "Reçus films + annonces sauvegardés."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Sauvegarde impossible après huit tentatives"
          exit 1
