name: Admin Phase 1D RLS checks
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261018174840_six_legacy_rls_lockdown.sql'
      - 'tests/admin-phase1d-rls.test.cjs'
      - '.github/workflows/admin-phase1d-tests.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/admin-phase1d-rls.test.cjs
