name: Bluesky - Partager la derniere video
run-name: "Bluesky - derniere video Shorts Mr XPRONOS"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config/bluesky_video_share_trigger.txt"

permissions:
  contents: read
  actions: read

concurrency:
  group: bluesky-latest-short-single-publish
  cancel-in-progress: false

jobs:
  share:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout Mr XPRONOS
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Find last successfully generated video artifact
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          runs="$(gh api "repos/$repo/actions/workflows/shorts-coupons-production.yml/runs?status=success&per_page=30" --jq '.workflow_runs[].id')"
          found=0
          for run in $runs; do
            artifact="$(gh api "repos/$repo/actions/runs/$run/artifacts?per_page=50" \
              --jq '.artifacts[] | select(.expired == false) | select(.size_in_bytes > 1000000) | select(.name | startswith("shorts-coupons-production-")) | .name' | head -n 1)"
            if [ -n "$artifact" ]; then
              echo "run_id=$run" >> "$GITHUB_OUTPUT"
              echo "artifact_name=$artifact" >> "$GITHUB_OUTPUT"
              echo "SOURCE_SHORTS_RUN=$run"
              found=1
              break
            fi
          done
          if [ "$found" != 1 ]; then
            echo "::error::Aucune video Shorts de production disponible en archive."
            exit 1
          fi

      - name: Download exact MP4 and metadata
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.source.outputs.run_id }}
          name: ${{ steps.source.outputs.artifact_name }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: .

      - name: Check MP4 and manifest
        run: |
          set -euo pipefail
          test -s daily_pronos_coupon_short.mp4
          test -s telegram_out/production_short/manifest.json
          ls -lh daily_pronos_coupon_short.mp4
          python -m json.tool telegram_out/production_short/manifest.json > /dev/null

      - name: Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Bluesky SDK
        run: pip install 'atproto>=0.0.60,<1' requests

      - name: Validate publisher
        run: python -m py_compile scripts/share_latest_video_bluesky.py

      - name: Publish actual MP4 on Bluesky (at most once)
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
        run: |
          python scripts/share_latest_video_bluesky.py \
            --video daily_pronos_coupon_short.mp4 \
            --manifest telegram_out/production_short/manifest.json \
            --source-run-id "$SOURCE_RUN_ID"
