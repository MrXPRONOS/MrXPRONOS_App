name: "CinéX Anime — audit Telegram session utilisateur (lecture seule)"

on:
  push:
    branches: [main]
    paths:
      - 'telegram-film-relay/scripts/anime_user_session_audit.py'
      - 'telegram-film-relay/tests/test_anime_user_session_audit.py'
      - '.github/workflows/cinex-anime-user-session-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

# The same exclusive lock as ALL legacy Telegram user-session relay jobs.
# Never overlap source reading with a movie/Anime publishing cycle.
concurrency:
  group: mrx-telegram-personal-account
  cancel-in-progress: false
  queue: max

jobs:
  read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: .
      TG_API_ID: ${{ secrets.TG_API_ID }}
      TG_API_HASH: ${{ secrets.TG_API_HASH }}
      TG_STRING_SESSION: ${{ secrets.TG_SESSION_STRING || secrets.TG_STRING_SESSION || secrets.TG_STREAM_SESSION }}
      ANIME_SOURCE_CHANNEL: ${{ vars.ANIME_SOURCE_CHANNEL }}
      ANIME_PUBLIC_CHANNEL: ${{ vars.ANIME_PUBLIC_CHANNEL }}
      ANIME_PRIVATE_CHANNEL: ${{ vars.ANIME_PRIVATE_CHANNEL }}
      CINEX_UNIFIED_PRIVATE_CHANNEL: ${{ vars.CINEX_UNIFIED_PRIVATE_CHANNEL }}
      CINEX_UNIFIED_STOCK_APPROVED_SHA256: '57b1f0a97d7db124ab9f72f470f7d63b92960e06b876397795e5780f5c5cc2b8'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Respecter le délai de sécurité du compte personnel
        env:
          TG_PERSONAL_COOLDOWN_UNTIL_UTC: ${{ vars.TG_PERSONAL_COOLDOWN_UNTIL_UTC }}
        run: python3 "$GITHUB_WORKSPACE/telegram-film-relay/scripts/check_personal_cooldown.py"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les dépendances
        run: python -m pip install -r telegram-film-relay/requirements.txt
      - name: Tests sans réseau
        working-directory: telegram-film-relay
        run: python -m unittest discover -s tests -p 'test_anime_user_session_audit.py' -v
      - name: Audit des 10 sources et reçus vidéo réels — aucune publication
        working-directory: telegram-film-relay
        run: python scripts/anime_user_session_audit.py
      - name: Conserver uniquement le rapport agrégé anonymisé
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cinex-anime-user-session-readonly
          path: telegram-film-relay/state/anime_user_session_audit.json
          if-no-files-found: ignore
          retention-days: 7
