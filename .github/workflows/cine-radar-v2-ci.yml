name: Cine Radar - Minimal directory CI
on:
  push:
    branches: [main]
    paths:
      - 'cinecanaux/**'
      - '.github/workflows/cine-radar-v2-ci.yml'
  pull_request:
    paths:
      - 'cinecanaux/**'
      - '.github/workflows/cine-radar-v2-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax
        run: |
          node --check cinecanaux/worker.mjs
          node --check cinecanaux/channel-avatar.mjs
          node --check cinecanaux/poster-showcase.mjs
          node --check cinecanaux/radar-lean.mjs
          node --check cinecanaux/app-page.mjs
          node --check cinecanaux/channel-preview.mjs
          node --check cinecanaux/v2.mjs
          python -m py_compile cinecanaux/audit_owned_channel_quality.py cinecanaux/sync_owned_quality_to_d1.py
          node --check cinecanaux/maintenance-v2.mjs
          node --check cinecanaux/admin-v2.mjs
          node --check cinecanaux/admin-page.mjs
          node --check cinecanaux/channel-identity.mjs
          node --check cinecanaux/job-log.mjs
      - name: Verify poster and avatar refresh scripts
        run: python -m py_compile cinecanaux/refresh_private_avatars.py cinecanaux/refresh_poster_showcase.py
      - name: Run isolated Telegram and Mini App tests
        run: node --test cinecanaux/tests/radar-lean.test.mjs cinecanaux/tests/channel-preview.test.mjs cinecanaux/tests/radar-performance.test.mjs cinecanaux/tests/v2.test.mjs cinecanaux/tests/completion.test.mjs cinecanaux/tests/avatars.test.mjs cinecanaux/tests/owned-featured.test.mjs cinecanaux/tests/quality-ranking.test.mjs cinecanaux/tests/avatar-recovery-cache.test.mjs cinecanaux/tests/poster-avatar-recovery.test.mjs cinecanaux/tests/ui-runtime-regression.test.mjs

      - name: Staging Worker smoke (non-production)
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          URL="https://cinecanaux-v2-staging.cinecanaux-xpronos.workers.dev"
          curl --fail --silent --show-error --retry 2 --max-time 15 "$URL/health" -o /tmp/cineradar-health.json
          node -e "const x=require('/tmp/cineradar-health.json');if(x.service!=='cine-radar'||x.database!==true)process.exit(1);"
          curl --fail --silent --show-error --retry 2 --max-time 15 "$URL/api/search?q=film" -o /tmp/cineradar-search.json
          node -e "const x=require('/tmp/cineradar-search.json');if(!Array.isArray(x.channels)||x.channels.length<1)process.exit(1);"
          curl --fail --silent --show-error --retry 2 --max-time 15 "$URL/app" -o /tmp/cineradar-app.html
          grep -q "Ciné Radar" /tmp/cineradar-app.html
          status=$(curl --silent --show-error --max-time 15 -o /dev/null -w "%{http_code}" "$URL/api/admin/overview")
          test "$status" = "403"

      - name: Production V2 smoke (read-only)
        timeout-minutes: 3
        run: node cinecanaux/tests/live-smoke.mjs
      - name: Production administered channels smoke (read-only)
        timeout-minutes: 3
        run: node cinecanaux/tests/owned-live-smoke.mjs
      - name: Production cinema poster and avatar smoke (read-only)
        timeout-minutes: 3
        run: node --test cinecanaux/tests/poster-avatar-live.test.mjs
