name: Cine Radar - Minimal directory CI
on:
  push:
    branches: [main]
    paths:
      - 'cinecanaux/**'
      - '.github/workflows/cine-radar-v2-ci.yml'
  pull_request:
    paths:
      - 'cinecanaux/**'
      - '.github/workflows/cine-radar-v2-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax
        run: |
          node --check cinecanaux/worker.mjs
          node --check cinecanaux/trend-radar.mjs
          node --check cinecanaux/pinned-showcase.mjs
          node --check cinecanaux/partner-promotions.mjs
          node --check cinecanaux/owner-claim.mjs
          node --check cinecanaux/analytics.mjs
          node --check cinecanaux/admin-v2.mjs
          node --check cinecanaux/broadcast.mjs
          node --check cinecanaux/admin-page.mjs
          node --check cinecanaux/radar-owner-ops.mjs
          node --check cinecanaux/channel-avatar.mjs
          node --check cinecanaux/poster-showcase.mjs
          node --check cinecanaux/radar-lean.mjs
          node --check cinecanaux/app-page.mjs
          node --check cinecanaux/channel-preview.mjs
          node --check cinecanaux/v2.mjs
          python -m py_compile cinecanaux/audit_owned_channel_quality.py cinecanaux/sync_owned_quality_to_d1.py cinecanaux/backfill_official_posts.py
          node --check cinecanaux/maintenance-v2.mjs
          node --check cinecanaux/admin-v2.mjs
          node --check cinecanaux/admin-page.mjs
          node --check cinecanaux/channel-identity.mjs
          node --check cinecanaux/job-log.mjs
      - name: Verify poster and avatar refresh scripts
        run: python -m py_compile cinecanaux/refresh_private_avatars.py cinecanaux/refresh_poster_showcase.py
      - name: Run isolated Telegram and Mini App tests
        run: node --test cinecanaux/tests/broadcast.test.mjs cinecanaux/tests/radar-lean.test.mjs cinecanaux/tests/bot-miniapp-entry.test.mjs cinecanaux/tests/channel-preview.test.mjs cinecanaux/tests/radar-performance.test.mjs cinecanaux/tests/v2.test.mjs cinecanaux/tests/completion.test.mjs cinecanaux/tests/avatars.test.mjs cinecanaux/tests/owned-featured.test.mjs cinecanaux/tests/quality-ranking.test.mjs cinecanaux/tests/avatar-recovery-cache.test.mjs cinecanaux/tests/poster-avatar-recovery.test.mjs cinecanaux/tests/ui-runtime-regression.test.mjs cinecanaux/tests/webhook-recovery.test.mjs cinecanaux/tests/trend-radar.test.mjs cinecanaux/tests/pinned-showcase.test.mjs cinecanaux/tests/partner-promotions.test.mjs cinecanaux/tests/owner-analytics.test.mjs cinecanaux/tests/owner-inbox.test.mjs cinecanaux/tests/trend-fallback.test.mjs cinecanaux/tests/simkl-trends.test.mjs

      - name: Probe public Simkl trends feeds (non-blocking diagnostic)
        continue-on-error: true
        shell: bash
        run: |
          python - <<'PY'
          import json
          from urllib.request import Request,urlopen
          for category in ('movies','tv','anime'):
              url=f'https://data.simkl.in/discover/trending/{category}/week_100.json'
              try:
                  request=Request(url,headers={'User-Agent':'CineRadar/1.2','Accept':'application/json'})
                  with urlopen(request,timeout=12) as response:
                      payload=json.load(response)
                  items=payload if isinstance(payload,list) else payload.get(category,payload.get('shows',[]))
                  if not isinstance(items,list) or not items:
                      raise ValueError('empty_or_malformed_chart')
                  first=items[0]
                  print('SIMKL_FEED_OK',category,'count',len(items),'fields',sorted(first.keys())[:16])
                  print('SIMKL_FEED_SAMPLE',category,'id',str(first.get('ids',{}).get('simkl',''))[:20],
                        'url',str(first.get('url',''))[:120],'poster',str(first.get('poster',''))[:80])
              except Exception as e:
                  print('SIMKL_FEED_ERROR',category,type(e).__name__,str(e)[:100])
                  raise
          PY

      - name: Staging Worker smoke (non-production)
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          URL="https://cinecanaux-v2-staging.cinecanaux-xpronos.workers.dev"
          curl --fail --silent --show-error --retry 2 --max-time 15 "$URL/health" -o /tmp/cineradar-health.json
          node -e "const x=require('/tmp/cineradar-health.json');if(x.service!=='cine-radar'||x.database!==true)process.exit(1);"
          curl --fail --silent --show-error --retry 2 --max-time 15 "$URL/api/search?q=film" -o /tmp/cineradar-search.json
          node -e "const x=require('/tmp/cineradar-search.json');if(!Array.isArray(x.channels)||x.channels.length<1)process.exit(1);"
          curl --fail --silent --show-error --retry 2 --max-time 15 "$URL/app" -o /tmp/cineradar-app.html
          grep -q "Ciné Radar" /tmp/cineradar-app.html
          status=$(curl --silent --show-error --max-time 15 -o /dev/null -w "%{http_code}" "$URL/api/admin/overview")
          test "$status" = "403"

      - name: Production V2 smoke (read-only)
        timeout-minutes: 3
        run: node cinecanaux/tests/live-smoke.mjs
      - name: Production administered channels smoke (read-only)
        timeout-minutes: 3
        run: node cinecanaux/tests/owned-live-smoke.mjs
      - name: Production cinema poster and avatar smoke (read-only)
        timeout-minutes: 3
        run: node --test cinecanaux/tests/poster-avatar-live.test.mjs
      - name: Production Telegram pinned showcase smoke (read-only)
        timeout-minutes: 3
        run: node --test cinecanaux/tests/pinned-showcase-live.test.mjs
      - name: Production partner promotions and Telegram photos smoke (read-only)
        timeout-minutes: 3
        run: node --test cinecanaux/tests/partner-promotions-live.test.mjs
      - name: Owner-only analytics security smoke (read-only)
        timeout-minutes: 3
        run: node --test cinecanaux/tests/owner-analytics-live.test.mjs
