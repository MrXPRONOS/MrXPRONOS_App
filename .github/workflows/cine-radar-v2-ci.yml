name: Cine Radar - Minimal directory CI
on:
  push:
    branches: [main]
    paths:
      - 'cinecanaux/**'
      - '.github/workflows/cine-radar-v2-ci.yml'
  pull_request:
    paths:
      - 'cinecanaux/**'
      - '.github/workflows/cine-radar-v2-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax
        run: |
          node --check cinecanaux/worker.mjs
          node --check cinecanaux/radar-lean.mjs
          node --check cinecanaux/app-page.mjs
          node --check cinecanaux/channel-preview.mjs
      - name: Run isolated Telegram and Mini App tests
        run: node --test cinecanaux/tests/radar-lean.test.mjs cinecanaux/tests/channel-preview.test.mjs
