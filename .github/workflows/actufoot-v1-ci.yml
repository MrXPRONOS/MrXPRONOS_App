name: Actu Foot V1 - Routing validation (offline)
on:
  pull_request:
    paths:
      - 'scripts/actufoot_v1_router.py'
      - 'scripts/actufoot_v1_discover.py'
      - 'tests_football_channel/test_actufoot_v1_router.py'
      - 'tests_football_channel/test_actufoot_v1_discover.py'
      - 'config/actufoot_v1_channels.json'
      - '.github/workflows/actufoot-v1-ci.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/actufoot_v1_router.py'
      - 'scripts/actufoot_v1_discover.py'
      - 'tests_football_channel/test_actufoot_v1_router.py'
      - 'tests_football_channel/test_actufoot_v1_discover.py'
      - 'config/actufoot_v1_channels.json'
      - '.github/workflows/actufoot-v1-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: actufoot-v1-offline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install required dependencies
        run: python -m pip install requests==2.32.5 Pillow==11.3.0 telethon==1.45.0 'langdetect>=1.0.9,<2'
      - name: Compile router, registry, source publisher
        run: python -m py_compile scripts/actufoot_v1_router.py scripts/actufoot_v1_discover.py scripts/actu_foot_d1_news.py
      - name: Validate role mapping and all delivery scenarios
        run: |
          python -m unittest discover -s tests_football_channel -p 'test_actufoot_v1_router.py' -v
          python -m unittest discover -s tests_football_channel -p 'test_actufoot_v1_discover.py' -v
          python -m unittest discover -s tests_football_channel -p 'test_actu_foot_rss_format.py' -v
          python -m unittest discover -s tests_football_channel -p 'test_actu_foot_d1_news.py' -v
