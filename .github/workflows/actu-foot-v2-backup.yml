name: Actu Foot V2 - Encrypted backup verification
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 0'
permissions:
  contents: read
concurrency:
  group: actu-foot-v2-backup
  cancel-in-progress: false
jobs:
  verify-and-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ACTU_FOOT_V2_KEY_B64_V1: ${{ secrets.ACTU_FOOT_V2_KEY_B64_V1 }}
      ML_V2_HISTORY_KEY_B64: ${{ secrets.ML_V2_HISTORY_KEY_B64 }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'cryptography>=43,<47' 'requests>=2.31,<3'
      - name: Verify and stage ciphertext backups
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/actufoot-v2-backup
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import requests
          from scripts.actu_foot_v2_store import COLLECTIONS, decrypt, collection_path
          output=Path("/tmp/actufoot-v2-backup")
          manifest={"format":"actu-foot-v2-ciphertext-backup","collections":{}}
          session=requests.Session()
          for name in COLLECTIONS:
              path=Path(collection_path(name))
              if not path.is_file():
                  print("SKIP_MISSING_COLLECTION",name)
                  continue
              raw=path.read_bytes()
              data,header=decrypt(name,raw.decode("utf-8"))
              dest=output/path.name
              dest.write_bytes(raw)
              manifest["collections"][name]={"filename":dest.name,"sha256":hashlib.sha256(raw).hexdigest(),
                  "generation":header["generation"],"record_count":len(data)}
              print("VALIDATED_ENCRYPTED_COLLECTION",name,"generation",header["generation"])
          (output/"manifest.json").write_text(json.dumps(manifest,sort_keys=True),encoding="utf-8")
          print("ENCRYPTED_BACKUP_VALIDATION_COMPLETE",len(manifest["collections"]))
          PY
      - name: Upload ciphertext-only backup (independent GitHub artifact)
        uses: actions/upload-artifact@v4
        with:
          name: actufoot-v2-encrypted-backup-${{ github.run_id }}
          path: /tmp/actufoot-v2-backup/
          retention-days: 30
          if-no-files-found: error
