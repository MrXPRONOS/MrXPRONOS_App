name: Actu Foot V2 - Encrypted backup verification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/actu-foot-v2-backup.yml'
      - 'scripts/actu_foot_v2_operations.py'
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 0'
permissions:
  contents: read
  id-token: write
concurrency:
  group: actu-foot-v2-backup
  cancel-in-progress: false
jobs:
  verify-and-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ACTU_FOOT_V2_KEY_B64_V1: ${{ secrets.ACTU_FOOT_V2_KEY_B64_V1 }}
      ML_V2_HISTORY_KEY_B64: ${{ secrets.ML_V2_HISTORY_KEY_B64 }}
      ACTU_FOOT_V2_ALLOW_LEGACY_KEY: '1'
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_REF_NAME: main
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'cryptography>=43,<47' 'requests>=2.31,<3'
      - name: Verify and stage encrypted live repository collections
        run: |
          python -m scripts.actu_foot_v2_operations --operation backup
          python -m scripts.actu_foot_v2_operations --operation verify
      - name: Upload ciphertext-only backup (independent GitHub artifact)
        uses: actions/upload-artifact@v4
        with:
          name: actufoot-v2-encrypted-backup-${{ github.run_id }}
          path: /tmp/actufoot-v2-backup/
          retention-days: 30
          if-no-files-found: error
      - name: Publish encrypted snapshot with GitHub OIDC
        run: python -m scripts.actu_foot_v2_oidc_backup
