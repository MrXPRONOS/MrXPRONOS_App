name: Mr XPRONOS - Validation premium canal
# test réel textes gras + logos débat + date Flash droite v1
# test réel Flash safe-crop v1
# test réel après corrections dates/stat placeholders v3
# validation finale coordonnées/typographie/logos
# relance templates PNG premium intégrés
# relance finale avec avant-match logo-complet
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/football-premium-validation-once.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mrxpronos-premium-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
      FOOTBALL_NEWS_BOT_TOKEN: ${{ secrets.FOOTBALL_NEWS_BOT_TOKEN }}
      FOOTBALL_NEWS_CHAT_ID: ${{ secrets.TELEGRAM_TEST_CHAT_ID || '@predict_mrxp' }}
      FOOTBALL_RSS_FEED: https://www.footmercato.net/flux-rss
      FOOTBALL_BSD_REQUEST_BUDGET: '18'
      FOOTBALL_REQUIRE_COMMENTS: '0'
      FOOTBALL_REQUIRE_COMMENTS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dépendances
        run: python -m pip install requests Pillow
      - name: Tests complets
        run: python -m unittest discover -s tests_football_channel -p 'test_*.py' -v
      - name: Prévisualiser les cartes premium
        run: |
          python scripts/football_cards.py --demo --out-dir /tmp/premium
          python scripts/football_cards.py --programme-styles --out-dir /tmp/styles
      - name: Vérifier la destination Telegram réelle et les droits du bot
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          TELEGRAM_TEST_CHAT_ID: ${{ secrets.TELEGRAM_TEST_CHAT_ID || '@predict_mrxp' }}
          TELEGRAM_TEST_GUARD_BOT_TOKEN: ${{ secrets.FOOTBALL_NEWS_BOT_TOKEN }}
        run: python scripts/telegram_test_guard.py
      - name: Vérifier le canal Telegram de test
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          test -n "$FOOTBALL_NEWS_BOT_TOKEN"
          if [ -z "$FOOTBALL_NEWS_CHAT_ID" ]; then
            echo "::error::TELEGRAM_TEST_CHAT_ID manquant. Aucun test ne sera envoyé au canal de production."
            exit 1
          fi
          echo "TELEGRAM_TEST_ROUTE_OK"

      - name: Envoyer les six formats premium
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: python scripts/football_channel.py --live-test
