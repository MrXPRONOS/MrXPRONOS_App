name: Update football news

on:
  workflow_dispatch:
  schedule:
    - cron: '23 */3 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-footnews.yml'
      - 'fetch_foot_news.py'

permissions:
  contents: write
  actions: write

concurrency:
  group: update-footnews
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install news dependencies
        run: python -m pip install feedparser deep-translator requests Pillow

      - name: Fetch and translate football news
        env:
          FOOTBALL_RSS_FEED: https://madeinfoot.ouest-france.fr/flux/rss_news.php
          ENABLE_TRANSLATION: '0'
          TRANSLATION_RETRIES: '2'
          MAX_ARTICLES: '20'
          MAX_NEWS_AGE_HOURS: '96'
          EXTRA_FOOTBALL_RSS_FEEDS: 'https://www.france24.com/fr/tag/football/rss,https://www.footmercato.net/flux-rss'
        run: python fetch_foot_news.py

      - name: Generate new Flash Foot visuals immediately
        run: python scripts/content_studio.py --limit 0 --news-limit 20

      - name: Refresh editorial queue and report for the newest news
        run: |
          python scripts/editorial_queue.py --limit 100
          python scripts/editorial_metrics.py

      - name: Validate news visuals and French output
        run: python scripts/editorial_quality.py --strict

      - name: Validate French output
        run: |
          python - <<'PY'
          import json
          import fetch_foot_news

          with open("footnews.json", "r", encoding="utf-8") as f:
              items = json.load(f)

          if not isinstance(items, list) or not items:
              raise SystemExit("footnews.json est vide ou invalide")

          english = []
          for item in items:
              text = " ".join([str(item.get("title") or ""), str(item.get("summary") or "")])
              if fetch_foot_news.looks_english(text):
                  english.append(item.get("title") or "(sans titre)")

          if english:
              raise SystemExit("Actualités encore détectées en anglais: " + " | ".join(english[:5]))

          print(f"OK: {len(items)} actualités francophones")
          PY

      - name: Commit refreshed news without overwriting concurrent content
        env:
          FOOTBALL_RSS_FEED: https://madeinfoot.ouest-france.fr/flux/rss_news.php
          EXTRA_FOOTBALL_RSS_FEEDS: https://www.france24.com/fr/tag/football/rss,https://www.footmercato.net/flux-rss
          ENABLE_TRANSLATION: '0'
          MAX_ARTICLES: '20'
          MAX_NEWS_AGE_HOURS: '96'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python fetch_foot_news.py
            python scripts/content_studio.py --limit 0 --news-limit 20
            python scripts/editorial_queue.py --limit 100
            python scripts/editorial_metrics.py
            python scripts/editorial_quality.py --strict
            git add footnews.json assets/images/editorial/ assets/data/editorial_share_queue.json assets/data/editorial_metrics.json
            if git diff --cached --quiet; then
              echo "Aucune nouvelle actualité ou image."
              exit 0
            fi
            git commit -m "data(infos): refresh verified French football news and cards"
            if git push origin HEAD:main; then
              echo "NEWS_COMMITTED=true" >> "$GITHUB_ENV"
              echo "RSS publication committed successfully"
              exit 0
            fi
            echo "Concurrent update detected, retry $attempt/3"
          done
          echo "RSS commit failed without any forced push"
          exit 1

      - name: Deploy refreshed news on GitHub Pages
        if: env.NEWS_COMMITTED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
