name: Update football news

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-footnews.yml'
      - 'fetch_foot_news.py'
      - 'scripts/football_news_engine.py'

permissions:
  contents: write
  actions: write

concurrency:
  group: update-footnews
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install news dependencies
        run: python -m pip install feedparser requests Pillow

      - name: Fetch and translate football news
        env:
          FOOTBALL_RSS_FEED: https://madeinfoot.ouest-france.fr/flux/rss_news.php
          MAX_ARTICLES: '60'
          MAX_ARTICLES_PER_FEED: '16'
          MAX_NEWS_AGE_HOURS: '120'
        run: python fetch_foot_news.py

      - name: Validate enriched News Football output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          items=json.loads(Path("footnews.json").read_text(encoding="utf-8"))
          assert isinstance(items,list) and items, "footnews.json vide"
          real=sum(
              1 for item in items
              if item.get("image_origin")=="source"
              and str(item.get("image") or "").startswith("assets/images/footnews/")
              and Path(item["image"]).is_file()
          )
          complete=sum(1 for item in items if item.get("content") and item.get("site_url") and item.get("telegram_summary"))
          print("NEWS_VALID",len(items),"complete",complete,"real_images",real)
          assert complete==len(items), "Certaines actualités ne sont pas structurées"
          assert real>=max(1,len(items)//2), "Couverture images réelles insuffisante"
          PY

      - name: Commit refreshed news without overwriting concurrent content
        env:
          FOOTBALL_RSS_FEED: https://madeinfoot.ouest-france.fr/flux/rss_news.php
          MAX_ARTICLES: '60'
          MAX_NEWS_AGE_HOURS: '120'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python fetch_foot_news.py
            git add footnews.json
            if [ -d assets/images/footnews ]; then git add -A assets/images/footnews; fi
            if git diff --cached --quiet; then
              echo "Aucune nouvelle actualité ou image."
              exit 0
            fi
            git commit -m "data(infos): refresh sourced football news and real images"
            if git push origin HEAD:main; then
              echo "NEWS_COMMITTED=true" >> "$GITHUB_ENV"
              echo "RSS publication committed successfully"
              exit 0
            fi
            echo "Concurrent update detected, retry $attempt/3"
          done
          echo "RSS commit failed without any forced push"
          exit 1

      - name: Deploy refreshed news on GitHub Pages
        if: env.NEWS_COMMITTED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
