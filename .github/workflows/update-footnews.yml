name: Update football news

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-footnews.yml'
      - 'fetch_foot_news.py'
      - 'scripts/football_news_engine.py'

permissions:
  contents: read

concurrency:
  group: update-footnews
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install news dependencies
        run: python -m pip install feedparser requests Pillow 'psycopg[binary]>=3.2,<4'

      - name: Fetch and translate football news
        env:
          FOOTBALL_RSS_FEED: https://madeinfoot.ouest-france.fr/flux/rss_news.php
          MAX_ARTICLES: '60'
          MAX_ARTICLES_PER_FEED: '16'
          MAX_NEWS_AGE_HOURS: '120'
        run: |
          test -n "$NEON_DATABASE_URL" || { echo '::error::NEON_DATABASE_URL requis'; exit 1; }
          python fetch_foot_news.py

      - name: Validate enriched News Football output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          items=json.loads(Path("footnews.json").read_text(encoding="utf-8"))
          assert isinstance(items,list) and items, "footnews.json vide"
          real=sum(
              1 for item in items
              if item.get("image_origin")=="source"
              and str(item.get("image") or "").startswith("assets/images/footnews/")
              and Path(item["image"]).is_file()
          )
          complete=sum(1 for item in items if item.get("content") and item.get("site_url") and item.get("telegram_summary"))
          print("NEWS_VALID",len(items),"complete",complete,"real_images",real)
          assert complete==len(items), "Certaines actualités ne sont pas structurées"
          assert real>=max(1,len(items)//2), "Couverture images réelles insuffisante"
          PY

      - name: Confirm snapshot publication path
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows=json.loads(Path("footnews.json").read_text(encoding="utf-8"))
          assert rows, "Snapshot local vide"
          import os
          import psycopg
          from datetime import datetime,timezone,timedelta
          with psycopg.connect(os.environ["NEON_DATABASE_URL"],connect_timeout=12) as connection:
              with connection.cursor() as cursor:
                  cursor.execute("SELECT jsonb_array_length(payload),generated_at FROM public.actu_foot_news_snapshot WHERE id='latest'")
                  snapshot=cursor.fetchone()
          assert snapshot is not None, "Snapshot Actu Foot Neon absent"
          assert snapshot[0]>0, "Snapshot Neon vide"
          assert snapshot[1]>=datetime.now(timezone.utc)-timedelta(minutes=15), "Snapshot Neon non actualisé"
          print("NEWS_NEON_READY", snapshot[0])
          PY
