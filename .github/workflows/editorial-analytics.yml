name: Editorial - Mesures de performance anonymes

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: write

concurrency:
  group: editorial-performance-aggregation
  cancel-in-progress: true

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer le client HTTP gratuit
        run: python -m pip install requests
      - name: Valider les agrégations avec des événements fictifs
        run: python -m unittest discover -s tests -p 'test_editorial_attribution.py' -v
      - name: Calculer le rapport agrégé (sans identifiant utilisateur)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/editorial_attribution.py --lookback-days 30
      - name: Enregistrer uniquement les agrégats non personnels
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f assets/data/editorial_performance.json ]; then
            echo "Supabase analytics non configuré; aucun faux chiffre enregistré"
            exit 0
          fi
          cp assets/data/editorial_performance.json "$RUNNER_TEMP/editorial-performance.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP/editorial-performance.json" assets/data/editorial_performance.json
            git add assets/data/editorial_performance.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "data(editorial): update anonymized traffic aggregates"
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
