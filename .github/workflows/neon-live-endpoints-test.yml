name: Neon LIVE API read routes regression
on:
  push:
    branches: [main]
    paths: ['.github/workflows/neon-live-endpoints-test.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Test Neon LIVE GET routes and reject unported refresh
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error
          from urllib.parse import urljoin
          base='https://br-winter-truth-b9of9tss-live.compute.c-7.eu-central-1.aws.neon.tech/'
          def call(path,method='GET'):
              req=urllib.request.Request(urljoin(base,path),method=method,headers={'Origin':'https://mrxpronos.github.io'})
              try:
                  with urllib.request.urlopen(req,timeout=25) as r:return r.status,json.load(r),dict(r.headers)
              except urllib.error.HTTPError as e:
                  return e.code,json.loads(e.read().decode()),dict(e.headers)
          for path,key in [('/health','ok'),('/matches','matches'),('/opportunities','opportunities'),('/today','data'),('/predictions/history','history'),('/daily/today','predictions')]:
              status,body,headers=call(path)
              print(path,status, 'keys',list(body.keys()),'rows',len(body[key]) if isinstance(body.get(key),list) else None,flush=True)
              assert status==200,(path,status,body)
              assert key in body,(path,body)
              assert headers.get('access-control-allow-origin')=='https://mrxpronos.github.io'
          status,body,_=call('/predictions/by-id?id=bad')
          assert status==400 and body.get('error')=='invalid_id'
          status,body,_=call('/refresh','POST')
          assert status==503 and body.get('error')=='refresh_engine_not_migrated'
          print('Neon LIVE route compatibility PASS; refresh correctly disabled until fully ported')
          PY
