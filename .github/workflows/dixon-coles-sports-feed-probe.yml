name: MRX Research - sports feed probe
on:
  push:
    paths:
      - 'dixon-coles/scripts/probe_espn_research.py'
      - '.github/workflows/dixon-coles-sports-feed-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: dixon-coles
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python dixon-coles/scripts/probe_espn_research.py
