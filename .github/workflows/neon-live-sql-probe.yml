name: Neon LIVE PostgreSQL runtime smoke
on:
  push:
    branches: [main]
    paths: ['.github/workflows/neon-live-sql-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Probe isolated LIVE read-only PostgreSQL
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error
          url='https://br-winter-truth-b9of9tss-mrxlivetest.compute.c-7.eu-central-1.aws.neon.tech/'
          try:
              with urllib.request.urlopen(url,timeout=30) as r:
                  print("Status",r.status,"Response",r.read(450).decode())
                  assert r.status==200
          except urllib.error.HTTPError as e:
              print('HTTP',e.code,e.read(450).decode(errors='replace'))
              raise
          PY
