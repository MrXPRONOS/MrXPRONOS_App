name: MRXP Phase 1 - Production safety smoke
on:
  push:
    paths:
      - '.github/workflows/mrxp-phase1-production-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-public-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify public health, safe sharing and V49 canary interface
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,time,urllib.request
          base='https://mrxpronos-play.cinecanaux-xpronos.workers.dev'
          def get(path):
              request=urllib.request.Request(base+path,headers={'Cache-Control':'no-cache','User-Agent':'MRXP-phase1-safe-UI-smoke/1.0'})
              with urllib.request.urlopen(request,timeout=22) as r:
                  return r.status,r.read().decode('utf-8','replace')
          status,s=get('/api/health')
          assert status==200, f'health HTTP {status}'
          health=json.loads(s)
          keys=['ok','bot_connected','telegram_token_valid','correct_bot','db_connected']
          fields={k:health.get(k) for k in keys}
          print('Worker health:',fields)
          assert all(fields.values()),'Telegram or D1 connection degraded'
          seen=0
          for i in range(55):
              code,html=get('/?phase1smoke='+str(i)+'-'+str(time.time_ns()))
              assert code==200 and 'TAPOTER POUR GAGNER' in html
              if 'id="mrxp-phase1-mobile-safety"' in html:
                  seen+=1
                  for required in ['const MRXP_PUBLIC_BOT_LINK="https://t.me/MrXpronosPlayBot"',
                                   'encodeURIComponent(MRXP_PUBLIC_BOT_LINK)',
                                   'mrxp-mission-reward-check',
                                   '#screen-missions .mission .reward img',
                                   'mrxp-daily-mission']:
                      assert required in html,'missing V49 fix: '+required
                  assert 'const url=location.href' not in html,'Telegram session-sharing regression!'
                  assert 'c.drawImage(art,0,0,W,H)' not in html,'duplicated profile artwork regression!'
          print('V49 responses:',seen,'of 55')
          assert seen>0,'Canary did not receive new V49 code'
          PY
