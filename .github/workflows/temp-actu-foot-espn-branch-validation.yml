name: TEMP Actu Foot ESPN branch validation

on:
  push:
    branches:
      - fix/espn-resilience-20261013

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FOOTBALL_ESPN_REQUEST_BUDGET: '60'
      FOOTBALL_REQUIRE_COMMENTS: '0'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check requests Pillow feedparser imageio-ffmpeg
      - name: Compile Actu Foot Python
        run: |
          python -m py_compile             fetch_foot_news.py             scripts/football_match_lifecycle.py             scripts/football_channel.py             scripts/football_stats_engine.py             scripts/football_news_engine.py             scripts/football_community_engine.py             scripts/football_viral_engine.py
      - name: Check Infos Foot JavaScript
        run: node --check assets/js/main.js
      - name: Run Actu Foot unit tests
        run: python -m unittest discover -s tests_football_channel -p 'test_*.py' -v
      - name: Direct ESPN smoke test
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          import requests, sys
          sys.path.insert(0, "scripts")
          import football_match_lifecycle as lifecycle
          import fetch_foot_news as news

          session = requests.Session()
          today = datetime.now(timezone.utc).date()
          matches = lifecycle.fetch_espn_day(session, today, force=True)
          assert isinstance(matches, list)
          print("ESPN_SCOREBOARD_DIRECT_OK", today.isoformat(), len(matches))

          with_id = next((m for m in matches if str(m.get("id") or "").isdigit()), None)
          if with_id:
              summary = lifecycle.fetch_espn_summary(session, str(with_id["id"]), force=True)
              assert isinstance(summary, dict)
              enrichment = lifecycle.extract_match_enrichment(summary) if summary else {}
              print("ESPN_SUMMARY_DIRECT_OK", with_id["id"], {
                  "goals": len(enrichment.get("goals", [])),
                  "cards": len(enrichment.get("cards", [])),
                  "substitutions": len(enrichment.get("substitutions", [])),
                  "player_stats": len(enrichment.get("player_stats", [])),
              })

          index = news.fetch_espn_verification_index(session)
          assert isinstance(index, list) and index, "ESPN structured news index empty"
          print("ESPN_NEWS_DIRECT_OK", len(index), {
              "transfers": sum(1 for x in index if x.get("is_transfer")),
              "with_athletes": sum(1 for x in index if x.get("athletes")),
              "with_teams": sum(1 for x in index if x.get("teams")),
          })
          PY
      - name: Lifecycle dry run
        env:
          SUPABASE_URL: ''
          SUPABASE_SERVICE_ROLE_KEY: ''
        run: python scripts/football_channel.py --dry-run --lifecycle-only
