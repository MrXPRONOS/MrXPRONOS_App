name: Validation des prédictions — Supabase (sans Neon)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "cycle = refresh + validation, probe = lecture seule"
        type: choice
        options: [cycle, probe]
        default: cycle
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate_predictions.yml'
      - 'scripts/supabase_live_cycle.py'
  # The existing external cron-job.org dispatch remains the production 5-minute trigger.
permissions:
  contents: read
concurrency:
  group: mrx-live-supabase-cycle
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests and static backend safety
        run: |
          python -m unittest tests_football_channel.test_supabase_live_cycle -v
          python -m py_compile scripts/supabase_live_cycle.py
      - name: Verify deployed Supabase LIVE and settle predictions without Neon
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          SUPABASE_LIVE_URL: https://nhwafcpndlufzzxexikh.supabase.co/functions/v1/live
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && (inputs.mode || 'cycle') || 'probe' }}
        run: python -m scripts.supabase_live_cycle --mode "$MODE"
