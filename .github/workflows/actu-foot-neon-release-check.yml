name: Actu Foot · Supabase release check (Neon retiré)
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/football_channel.py'
      - 'scripts/football_match_lifecycle.py'
      - 'scripts/actu_foot_*.py'
      - 'fetch_foot_news.py'
      - 'assets/js/actu-foot-neon.js'
      - 'scripts/supabase_live_cycle.py'
      - 'assets/js/main.js'
      - '.github/workflows/actu-foot-neon-release-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    name: Actu Foot regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install requests Pillow feedparser imageio-ffmpeg "cryptography>=43,<47" "telethon>=1.36,<2"
      - name: Verify Python syntax
        run: python -m py_compile scripts/football_channel.py scripts/football_match_lifecycle.py scripts/actu_foot_observability.py scripts/actu_foot_source_cache.py scripts/actu_foot_provider_health.py scripts/actu_foot_health_report.py scripts/supabase_live_cycle.py fetch_foot_news.py
      - name: Regression tests
        run: python -m unittest discover -s tests_football_channel -p 'test_*.py' -v
      - run: |
          node --check assets/js/main.js
          node --check assets/js/actu-foot-neon.js
  database-read:
    needs: offline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify deployed Supabase LIVE functions without credentials
        run: python3 -m scripts.supabase_live_cycle --mode probe
