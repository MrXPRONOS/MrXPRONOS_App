name: Mr XPRONOS - verified LIVE market statistics

on:
  # Hourly at most: <= 72 API-Football requests / UTC day
  # (24 fixture-list requests + up to 48 coverage/statistics requests).
  # League/season coverage and empty statistics are now cached in Supabase.
  # Rejected provider calls are retried only after an explicit cooldown.
  schedule:
    - cron: '10 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/api_football_live_stats.py'
      - 'scripts/test_api_football_live_stats.py'
      - '.github/workflows/enrich-live-market-statistics.yml'

permissions:
  contents: read

concurrency:
  group: mrxpronos-verified-live-statistics
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline market-stat normalization and matching tests
        run: python -m unittest scripts.test_api_football_live_stats -v
      - name: Enrich LIVE from official market stats (BSD remains primary)
        # One explicit bootstrap push after credential setup; all other pushes
        # only run offline tests. Hourly schedule and manual dispatch are normal.
        if: ${{ github.event_name != 'push' || contains(github.event.head_commit.message, 'bootstrap(api-football)') }}
        run: |
          set -euo pipefail
          python scripts/api_football_live_stats.py
