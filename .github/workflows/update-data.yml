name: Mise à jour quotidienne (données + contenu)

on:
  schedule:
    - cron: '5 0 * * *'   # 00:05 UTC
  push:
    paths:
      - '*.py'
      - 'cache/all_matches.json'
      - 'requirements.txt'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate pronostics (data.json)
        env:
          SPORTDATA_API_KEY: ${{ secrets.SPORTDATA_API_KEY }}
          THESPORTSDB_API_KEY: ${{ secrets.THESPORTSDB_API_KEY }}
        run: python generate_data.py

      - name: Convert images to WebP
        run: python convert_images.py

      - name: Generate AI content (articles & tips + images)
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          PIXAZO_API_KEY: ${{ secrets.PIXAZO_API_KEY }}
        run: python content_generator.py

      - name: Generate testimonials
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: python generate_testimonials.py

      - name: Fetch football news
        env:
          FOOTBALL_RSS_FEED: ${{ secrets.FOOTBALL_RSS_FEED }}
        run: python fetch_foot_news.py

      - name: Generate sitemap
        run: python generate_sitemap.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'actions@github.com'
          
          git add -A
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          git commit -m "Mise à jour automatique $(date +'%Y-%m-%d') [skip ci]"
          
          git fetch origin main
          git rebase -X theirs origin/main
          
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify failure
        if: failure()
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          args: "Le workflow de mise à jour quotidienne a échoué sur {{ GITHUB_REPOSITORY }}"