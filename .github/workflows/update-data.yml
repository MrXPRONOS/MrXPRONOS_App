# .github/workflows/update-data.yml
name: Mise à jour quotidienne (données + contenu)

on:
  schedule:
    - cron: '5 0 * * *'
  push:
    paths:
      - '*.py'
      - 'cache/all_matches.json'
      - 'requirements.txt'
  workflow_dispatch:

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install requests mistralai feedparser deep-translator Pillow supabase
      - name: Mise à jour du cache
        env:
          SPORTDATA_API_KEY: ${{ secrets.SPORTDATA_API_KEY }}
        run: python update_scores.py
      - name: Génération des pronostics
        env:
          SPORTDATA_API_KEY: ${{ secrets.SPORTDATA_API_KEY }}
        run: python generate_data.py
      - name: Conversion images
        run: python convert_images.py
      - name: Génération du contenu IA
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          PIXAZO_API_KEY: ${{ secrets.PIXAZO_API_KEY }}
        run: python content_generator.py
      - name: Actualités football
        env:
          FOOTBALL_RSS_FEED: ${{ secrets.FOOTBALL_RSS_FEED }}
        run: python fetch_foot_news.py
      - name: Génération sitemap
        run: python generate_sitemap.py
      - name: Synchronisation Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python supabase_sync.py
      - name: Commit et push
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'actions@github.com'
          git add cache/all_matches.json data.json articles.json conseils.json footnews.json sitemap.xml assets/images/
          git diff --staged --quiet || (git commit -m "Mise à jour auto $(date +'%Y-%m-%d') [skip ci]" && git pull --rebase -X theirs origin main && git push)