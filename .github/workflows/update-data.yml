name: Mise à jour quotidienne (données + contenu)

on:
  schedule:
    - cron: '5 0 * * *'   # 00:05 UTC
  push:
    paths:
      - '*.py'
      - 'cache/all_matches.json'
      - 'requirements.txt'
  workflow_dispatch:

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install requests mistralai feedparser deep-translator Pillow

      - name: Mise à jour du cache (matchs d'hier)
        env:
          SPORTDATA_API_KEY: ${{ secrets.SPORTDATA_API_KEY }}
        run: python update_matches.py

      - name: Génération des pronostics (data.json)
        env:
          SPORTDATA_API_KEY: ${{ secrets.SPORTDATA_API_KEY }}
        run: python generate_data.py

      - name: Conversion des images en WebP
        run: python convert_images.py

      - name: Génération du contenu IA (articles et conseils + images)
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          PIXAZO_API_KEY: ${{ secrets.PIXAZO_API_KEY }}
        run: python content_generator.py

      - name: Récupération des actualités football
        env:
          FOOTBALL_RSS_FEED: ${{ secrets.FOOTBALL_RSS_FEED }}
        run: python fetch_foot_news.py

      - name: Génération du sitemap
        run: python generate_sitemap.py

      - name: Commit et push
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'actions@github.com'
          
          git add -A
          git commit -m "Mise à jour automatique $(date +'%Y-%m-%d') [skip ci]" || echo "No changes to commit"
          
          git pull --rebase --autostash origin main
          
          git push origin main