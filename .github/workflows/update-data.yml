name: Mise à jour quotidienne (données + contenu)

on:
  schedule:
    - cron: '5 0 * * *'   # 00:05 UTC
  push:
    paths:
      - '*.py'
      - 'cache/all_matches.json'
      - 'requirements.txt'
  workflow_dispatch:

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install requests mistralai python-slugify

      - name: Mise à jour du cache H2H (matchs d'hier)
        env:
          BSD_API_TOKEN: ${{ secrets.BSD_API_TOKEN }}
        run: python update_matches.py

      - name: Génération des pronostics (data.json) + récupération scores TheSportsDB
        env:
          BSD_API_TOKEN: ${{ secrets.BSD_API_TOKEN }}
        run: python generate_data.py

      - name: Génération du contenu IA (articles avec bannières TheSportsDB)
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: python content_generator.py

      - name: Récupération des actualités football (optionnel)
        env:
          FOOTBALL_RSS_FEED: ${{ secrets.FOOTBALL_RSS_FEED }}
        run: python fetch_foot_news.py || echo "Aucune actualité"

      - name: Génération du sitemap
        run: python generate_sitemap.py

      - name: Commit et push
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'actions@github.com'
          git add cache/all_matches.json cache/tsdb_cache.json data.json articles.json footnews.json sitemap.xml assets/images/
          git commit -m "Mise à jour automatique $(date +'%Y-%m-%d') [skip ci]" || echo "No changes"
          git pull --rebase --autostash -X theirs origin main
          git push origin main