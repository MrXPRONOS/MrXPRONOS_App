name: Mise à jour quotidienne (données + contenu)

on:
  schedule:
    - cron: '5 0 * * *'   # 00:05 UTC
  push:
    paths:
      - '*.py'
      - 'cache/all_matches.json'
      - 'requirements.txt'
  workflow_dispatch:

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install requests

      - name: Mise à jour du cache
        env:
          BSD_API_TOKEN: ${{ secrets.BSD_API_TOKEN }}
        run: python update_matches.py

      - name: Génération des pronostics
        env:
          BSD_API_TOKEN: ${{ secrets.BSD_API_TOKEN }}
        run: python generate_data.py

      - name: Génération du contenu IA
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: python content_generator.py

      - name: Génération du sitemap
        run: python generate_sitemap.py

      - name: Commit et push
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'actions@github.com'
          git add cache/all_matches.json data.json articles.json conseils.json sitemap.xml
          git commit -m "Mise à jour automatique $(date +'%Y-%m-%d') [skip ci]" || echo "No changes to commit"
          git pull --rebase origin main
          git push origin main