name: Mise à jour quotidienne des données et génération de contenu IA

on:
  schedule:
    # Exécution tous les jours à 00:05 UTC (minuit + 5 minutes)
    - cron: '5 0 * * *'
  workflow_dispatch:  # Permet un déclenchement manuel

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configuration de Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Mise à jour du cache des matchs (hier)
        env:
          BSD_API_TOKEN: ${{ secrets.BSD_API_TOKEN }}
        run: python update_matches.py

      - name: Génération des pronostics (data.json)
        env:
          BSD_API_TOKEN: ${{ secrets.BSD_API_TOKEN }}
        run: python generate_data.py

      - name: Génération du contenu IA (articles et conseils)
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: python content_generator.py

      - name: Génération du sitemap
        run: python generate_sitemap.py

      - name: Vérification des modifications
        id: git-check
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'actions@github.com'
          git add cache/all_matches.json data.json articles.json conseils.json sitemap.xml
          git diff --staged --quiet || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Commit et push si changements
        if: steps.git-check.outputs.changes == 'true'
        run: |
          git commit -m "Mise à jour automatique des données et du contenu $(date +'%Y-%m-%d')"
          git push