name: Mise à jour quotidienne (données + contenu)

on:
  schedule:
    - cron: '5 0 * * *'   # 00:05 UTC
  push:
    paths:
      - '*.py'
      - 'cache/all_matches.json'
      - 'requirements.txt'
  workflow_dispatch:

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0   # nécessaire pour les commits

      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate pronostics (data.json)
        env:
          SPORTDATA_API_KEY: ${{ secrets.SPORTDATA_API_KEY }}
        run: python generate_data.py

      - name: Convert images to WebP
        run: python convert_images.py

      - name: Generate AI content (articles & tips + images)
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          PIXAZO_API_KEY: ${{ secrets.PIXAZO_API_KEY }}
        run: python content_generator.py

      - name: Fetch football news
        env:
          FOOTBALL_RSS_FEED: ${{ secrets.FOOTBALL_RSS_FEED }}
        run: python fetch_foot_news.py

      - name: Generate sitemap
        run: python generate_sitemap.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'actions@github.com'
          
          # Ajouter tous les fichiers modifiés
          git add -A
          
          # Vérifier s'il y a des changements à commiter
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          git commit -m "Mise à jour automatique $(date +'%Y-%m-%d') [skip ci]"
          
          # Pull avec rebase pour éviter les conflits
          git pull --rebase --autostash origin main
          
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}