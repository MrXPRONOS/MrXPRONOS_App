name: Telegram - Bilan privé des canaux (06h Togo)
run-name: "Telegram - Bilan privé des canaux (${{ github.event_name }})"

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-channel-monitor-daily
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer les dépendances
        run: python -m pip install --disable-pip-version-check 'telethon>=1.36,<2' 'requests>=2.31,<3'
      - name: Compiler le script
        run: python -m py_compile scripts/telegram_channel_monitor.py
      - name: Rapport de croissance Telegram privé
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION_STRING }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PYTHONUNBUFFERED: '1'
        run: python scripts/telegram_channel_monitor.py
