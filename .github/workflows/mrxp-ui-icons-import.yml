name: MRXP - import verified information and crowned shield icons

on:
  push:
    branches: [feat/mrxp-info-rank-shield-icons-20261119]
    paths: ['.github/workflows/mrxp-ui-icons-import.yml']

permissions:
  contents: write

jobs:
  import-ui-icons:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Import exact 2 transparent PNG and WebP originals
        env:
          SOURCE_URL: https://at.adobe.com/4VS3Kkwna8XmMD3F
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 180 --silent --show-error "$SOURCE_URL" --output /tmp/mrxp-2-ui-icons.zip
          python3 - <<'PY'
          import pathlib,zipfile,hashlib,json,struct
          archive=pathlib.Path('/tmp/mrxp-2-ui-icons.zip')
          if not zipfile.is_zipfile(archive): raise SystemExit('Source is not a valid ZIP')
          target=pathlib.Path('mrxpronos-play')
          with zipfile.ZipFile(archive) as z:
              names=set(z.namelist())
              if 'assets-manifest-ui-actions.json' not in names: raise SystemExit('No asset manifest')
              manifest=json.loads(z.read('assets-manifest-ui-actions.json'))
              assert len(manifest['assets'])==2
              assert {v['number'] for v in manifest['assets']}=={59,60}
              for item in manifest['assets']:
                  for kind in ('png','webp'):
                      name=item[kind]
                      expected=(item['sha256_'+kind],item[kind+'_bytes'])
                      if name not in names: raise SystemExit('Missing '+name)
                      data=z.read(name)
                      if (hashlib.sha256(data).hexdigest(),len(data))!=expected: raise SystemExit('Integrity mismatch '+name)
                      if kind=='png':
                          if data[:8]!=bytes.fromhex('89504e470d0a1a0a') or struct.unpack('>II',data[16:24])!=(1254,1254) or data[25]!=6: raise SystemExit('Invalid alpha PNG '+name)
                      else:
                          if data[:4]!=b'RIFF' or data[8:12]!=b'WEBP': raise SystemExit('Invalid WebP '+name)
                      out=target/name
                      out.parent.mkdir(parents=True,exist_ok=True)
                      out.write_bytes(data)
                      print('VERIFIED',name,len(data),'SHA256',expected[0])
              (target/'assets-manifest-ui-actions.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Commit source assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mrxpronos-play/assets/08-ui-actions/ mrxpronos-play/assets-manifest-ui-actions.json
          git diff --cached --check
          git commit -m 'assets(play): import official information circle and crowned rank shield'
          git push origin HEAD:feat/mrxp-info-rank-shield-icons-20261119
