name: ML V2 - Verify encryption secret
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-key:
    name: Check secret format and AES-256-GCM
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ML_V2_HISTORY_KEY_B64: ${{ secrets.ML_V2_HISTORY_KEY_B64 }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install encryption library
        run: python -m pip install cryptography
      - name: Verify private key without printing it
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import os
          import secrets
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          encoded = os.environ.get("ML_V2_HISTORY_KEY_B64", "").strip()
          if not encoded:
              raise SystemExit("FAILED: Missing ML_V2_HISTORY_KEY_B64 repository Actions secret")
          try:
              key = base64.b64decode(encoded, validate=True)
          except Exception:
              raise SystemExit("FAILED: secret is not valid Base64")
          if len(key) != 32:
              raise SystemExit("FAILED: key must decode to exactly 32 bytes")
          nonce = secrets.token_bytes(12)
          payload = b"MrXPRONOS - private encryption test"
          associated_data = b"football-day:verification"
          encrypted = AESGCM(key).encrypt(nonce, payload, associated_data)
          recovered = AESGCM(key).decrypt(nonce, encrypted, associated_data)
          if recovered != payload:
              raise SystemExit("FAILED: encryption roundtrip unsuccessful")
          print("SUCCESS: encryption secret exists, key length is valid, AES-256-GCM roundtrip verified.")
          print("Secret value is never printed or uploaded. No football API calls were made.")
          PY
