name: Research Hybrid V3 2026 YTD genuine daily modal-score leaders
on:
  push:
    branches: [research/v3-2026-ytd-modal-score-leaders]
    paths:
      - '.github/workflows/research-v3-2026-ytd-modal-score-leaders.yml'
      - 'research/backtest_v3_2026_ytd_modal_score_leaders.py'
      - 'research/test_v3_2026_ytd_modal_score_leaders.py'
      - 'research/single_ml_v2.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: research-v3-2026-ytd-modal-score-leaders
  cancel-in-progress: false
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      ML_V2_HISTORY_KEY_B64: ${{ secrets.ML_V2_HISTORY_KEY_B64 }}
      SPORTDATA_API_KEY_1: ${{ secrets.SPORTDATA_API_KEY_1 }}
      SPORTDATA_API_KEY_2: ${{ secrets.SPORTDATA_API_KEY_2 }}
      SPORTDATA_API_KEY_3: ${{ secrets.SPORTDATA_API_KEY_3 }}
      SPORTDATA_API_KEY_4: ${{ secrets.SPORTDATA_API_KEY_4 }}
      SPORTDATA_API_KEY_5: ${{ secrets.SPORTDATA_API_KEY_5 }}
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: model/research:model:site/scripts
    steps:
      - name: Checkout authenticated archives, read-only main branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: site
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout isolated 2026 YTD model research
        uses: actions/checkout@v4
        with:
          ref: research/v3-2026-ytd-modal-score-leaders
          path: model
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native Hybrid V3 dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy scikit-learn cryptography requests
      - name: Compile and test strict retrospective method and dates
        run: |
          python -m py_compile model/research/single_ml_v2.py model/research/backtest_v3_2026_ytd_modal_score_leaders.py model/research/test_v3_2026_ytd_modal_score_leaders.py
          python -m unittest discover -s model/research -p 'test_v3_2026_ytd_modal_score_leaders.py' -v
          test -n "$ML_V2_HISTORY_KEY_B64"
      - name: "Run native walk-forward Hybrid V3 January 1 to November 3 2026"
        run: |
          mkdir -p /tmp/mrx-v3-2026-ytd
          python model/research/backtest_v3_2026_ytd_modal_score_leaders.py \
            --site-root site --model-root model \
            --output-dir /tmp/mrx-v3-2026-ytd
      - name: Verify 307 historical days and per-score/per-day uniqueness
        run: |
          python - <<'PY'
          import csv,json,datetime
          from pathlib import Path
          base=Path("/tmp/mrx-v3-2026-ytd")
          report=json.loads((base/"2026-ytd-score-leaders-summary.json").read_text())
          a=report["evaluation_start"];b=report["evaluation_end"]
          assert a=="2026-01-01" and b=="2026-11-03"
          assert report["days_with_completed_history"]==307
          assert report["score_categories_theoretical"]==121
          assert 5<=report["score_categories"]<121
          assert report["one_match_may_be_selected_for_multiple_scores"] is False
          assert report["verified_settled_football_matches_evaluated"]>75000
          assert len(report["by_month"])==11
          assert report["by_month"]["2026-10"]["days"]==31
          assert report["by_month"]["2026-11"]["days"]==3
          assert report["by_score"]["1:1"]["days_selected"]>0
          rows=list(csv.DictReader((base/"2026-ytd-score-leaders-daily.csv").open()))
          assert len(rows)==report["total_selections_across_independent_scores"]
          assert 307<=len(rows)<307*121
          assert len({(r["day"],r["score"]) for r in rows})==len(rows)
          assert len({(r["day"],r["match_id"]) for r in rows})==len(rows)
          assert all(r["score"]==r["modal_score"] for r in rows)
          assert all(r["history_latest_day"]<r["day"] and r["model_fit_latest_day"]<r["day"] for r in rows)
          assert sum(int(r["hit"]) for r in rows)==report["total_hits_across_independent_scores"]
          assert report["days_with_at_least_one_hit"]+report["days_without_hit"]==307
          assert sum(v["selections"] for v in report["by_month"].values())==len(rows)
          assert sum(v["hits"] for v in report["by_month"].values())==report["total_hits_across_independent_scores"]
          # Historical October independently audited from the corrected
          # October run. This catches change of ranking methodology.
          october=report["by_month"]["2026-10"]
          assert october["selections"]==279,october
          assert october["hits"]==42,october
          print("YTD_V3_2026_MODAL_BACKTEST_VERIFIED",len(rows),report["total_hits_across_independent_scores"],report["days_with_at_least_one_hit"])
          PY
      - name: Upload private study artifacts, no production publication
        uses: actions/upload-artifact@v4
        with:
          name: hybrid-v3-2026-ytd-daily-modal-leaders-${{ github.run_id }}
          path: |
            /tmp/mrx-v3-2026-ytd/2026-ytd-score-leaders-summary.json
            /tmp/mrx-v3-2026-ytd/2026-ytd-score-leaders-daily.csv
            /tmp/mrx-v3-2026-ytd/2026-ytd-score-leaders-ranking.csv
          retention-days: 30
          if-no-files-found: error
