name: Research ML V2 - Audit 2026 football through Oct 24
on:
  push:
    branches: [research/single-ml-v2-20261024]
    paths: ['.github/workflows/research-ml-v2-audit-2026.yml']
permissions:
  contents: write
concurrency:
  group: ml-v2-encrypted-history
  cancel-in-progress: false
jobs:
  audit-2026:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ML_V2_HISTORY_KEY_B64: ${{ secrets.ML_V2_HISTORY_KEY_B64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/single-ml-v2-20261024
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install crypto and provider-independent audit dependencies
        run: python -m pip install cryptography requests
      - name: Offline 2026 year-to-date union regression
        run: PYTHONPATH=.:research python -m unittest discover -s research -p 'test_single_ml_v2_2026_union.py' -v
      - name: Audit ten monthly 2026 AES-GCM archives, inspect only completed fixtures
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=.:research python research/single_ml_v2_2024_union.py \
            --year 2026 --through 2026-10-24 --export --output /tmp/mrx_v2_2026_ytd_research.json
          PYTHONPATH=.:research python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/mrx_v2_2026_ytd_research.json')
          games=json.loads(p.read_text(encoding='utf8'))
          assert len(games)>5000
          assert all(g['sportId']==1 and g['is_finished'] is True for g in games)
          assert all('2026-01-01'<=g['date']<='2026-10-24' for g in games)
          assert len({g['id'] for g in games})==len(games)
          assert len({(g['date'],g['home_team'],g['away_team']) for g in games})==len(games)
          print('2026_YTD_DEDUP_VERIFIED_MATCHES',len(games))
          p.unlink()
          print('EPHEMERAL_PLAINTEXT_REMOVED')
          PY
      - name: Save public aggregate-only 2026 coverage report
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=.:research python research/single_ml_v2_2024_union.py --year 2026 --through 2026-10-24 | python -c '
          import json,sys,pathlib
          result=sys.stdin.read().split("ML_V2_2024_INDEPENDENT_AUDIT ",1)
          if len(result)!=2:raise SystemExit("Missing 2026 audited aggregate")
          report=json.loads(result[1])
          assert report["year"]==2026
          assert report["months_verified"]==10
          assert report["cutoff_utc_day"]=="2026-10-24"
          assert report["sportscore_failed_days_remaining"]==0
          dest=pathlib.Path("research/2026_multisource_audit.json")
          dest.write_text(json.dumps(report,ensure_ascii=False,indent=2)+"\n",encoding="utf8")
          print("2026_AUDITED_UNIQUE_DAY_TEAM_IDENTITIES",report["distinct_safe_matches"])
          print("2026_DAYS_WITH_MATCHES",report["calendar_days_with_certified_fixture"])
          print("2026_CONFLICTS_EXCLUDED",report["conflicting_outcome_identities_quarantined"])
          '
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/2026_multisource_audit.json
          if ! git diff --cached --quiet; then
            git commit -m 'docs(research): audited 2026 football through Oct 24 aggregate report'
            git fetch origin research/single-ml-v2-20261024
            git rebase origin/research/single-ml-v2-20261024
            git push origin HEAD:research/single-ml-v2-20261024
          fi
      - name: Confirm research-only audit verified
        run: echo 'SUCCESS: 2026 year-to-date AES-GCM football history verified; no raw scores committed'
