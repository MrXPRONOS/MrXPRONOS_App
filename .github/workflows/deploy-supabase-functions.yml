name: Deploy Supabase Functions

on:
  push:
    branches: [ main ]
    paths:
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-supabase-functions.yml'
  workflow_dispatch:

concurrency:
  group: mrxpronos-supabase-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main  # Always deploy the latest published code, even from an older queued run

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: '2.84.2'

      - name: Link production project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase link --project-ref nhwafcpndlufzzxexikh

      - name: Dry-run pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase db push --linked --dry-run

      - name: Apply pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase db push --linked

      - name: Deploy live
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy live --project-ref nhwafcpndlufzzxexikh --no-verify-jwt

      - name: Deploy telegram-live
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy telegram-live --project-ref nhwafcpndlufzzxexikh --no-verify-jwt

      - name: Deploy daily-pronos
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy daily-pronos --project-ref nhwafcpndlufzzxexikh --no-verify-jwt

      - name: Deploy telegram-membership
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy telegram-membership --project-ref nhwafcpndlufzzxexikh --no-verify-jwt

      - name: Deploy daily favorite alerts (subscription proof + protected cron)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy daily-favorite-alerts --project-ref nhwafcpndlufzzxexikh --no-verify-jwt

      - name: Deploy publish (JWT required)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy publish --project-ref nhwafcpndlufzzxexikh

      - name: Deploy admin-push (admin JWT or protected cron)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy admin-push --project-ref nhwafcpndlufzzxexikh --no-verify-jwt

      - name: Deploy admin-list-subscribers (internal admin auth)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy admin-list-subscribers --project-ref nhwafcpndlufzzxexikh --no-verify-jwt

      - name: Deploy push-notifications (cron-only)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy push-notifications --project-ref nhwafcpndlufzzxexikh --no-verify-jwt

      - name: Deploy admin-media-publish (JWT required)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy admin-media-publish --project-ref nhwafcpndlufzzxexikh


      - name: Deploy read-only cron-job.org observer (admin JWT)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy admin-cron-read --project-ref nhwafcpndlufzzxexikh

      - name: Deploy admin content link checker (admin JWT)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy admin-link-check --project-ref nhwafcpndlufzzxexikh

      - name: Deploy signed incident watchdog (GitHub OIDC)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy admin-incident-watch --project-ref nhwafcpndlufzzxexikh --no-verify-jwt
