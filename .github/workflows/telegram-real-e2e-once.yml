name: Telegram - Tests réels E2E ponctuels

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/telegram-real-e2e-once.yml'
      - 'scripts/telegram_live_e2e.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/telegram-real-e2e-once.yml'

concurrency:
  group: telegram-real-e2e-single-run
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Valider sans accès aux secrets ni à Telegram
        run: |
          python -m py_compile scripts/telegram_live_e2e.py scripts/telegram_test_guard.py
          python - <<'PY'
          from pathlib import Path
          s=Path('scripts/telegram_live_e2e.py').read_text()
          for name in ('telegram-test-channel-smoke.yml',
                       'football-visual-live-test-once.yml',
                       'football-live-test-once.yml',
                       'football-premium-validation-once.yml',
                       'bsd-v2-telegram-hourly.yml',
                       'editorial-telegram.yml'):
              assert name in s, name
          assert '"destination": "test"' in s
          assert 'refs/heads/main' in s
          print('TELEGRAM_E2E_PLAN_SAFE_OK')
          PY
  real_tests:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      TELEGRAM_TEST_CHAT_ID: ${{ secrets.TELEGRAM_TEST_CHAT_ID || '@predict_mrxp' }}
      TELEGRAM_TEST_GUARD_BOT_TOKEN: ${{ secrets.FOOTBALL_NEWS_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer dépendance gratuite de vérification Telegram
        run: python -m pip install requests
      - name: Vérifier la destination et les droits du bot sans publier
        run: python scripts/telegram_test_guard.py
      - name: Déclencher et vérifier les 6 workflows dans le canal TEST seulement
        run: python -u scripts/telegram_live_e2e.py
