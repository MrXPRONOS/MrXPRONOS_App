name: Telegram - Test réel des 5 systèmes métier

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/telegram-real-e2e-once.yml'
      - 'scripts/telegram_live_e2e.py'
      - 'tests/test_telegram_test_routing.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/telegram-real-e2e-once.yml'
      - 'scripts/telegram_live_e2e.py'

concurrency:
  group: telegram-five-business-systems-test
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer les dépendances
        run: python -m pip install requests Pillow feedparser
      - name: Valider les cinq moteurs sans Telegram
        run: |
          python -m py_compile scripts/telegram_live_e2e.py scripts/telegram_test_guard.py
          python -m unittest discover -s tests_football_channel -p 'test_*.py' -v
          python -m unittest tests.test_telegram_test_routing -v

  real_tests:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
      FOOTBALL_NEWS_BOT_TOKEN: ${{ secrets.FOOTBALL_NEWS_BOT_TOKEN }}
      FOOTBALL_NEWS_CHAT_ID: ${{ secrets.TELEGRAM_TEST_CHAT_ID || '@predict_mrxp' }}
      TELEGRAM_TEST_CHAT_ID: ${{ secrets.TELEGRAM_TEST_CHAT_ID || '@predict_mrxp' }}
      TELEGRAM_TEST_GUARD_BOT_TOKEN: ${{ secrets.FOOTBALL_NEWS_BOT_TOKEN }}
      FOOTBALL_REQUIRE_COMMENTS: '0'
      FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer les dépendances
        run: python -m pip install requests Pillow feedparser
      - name: Tests locaux des cinq moteurs
        run: |
          python -m py_compile scripts/telegram_live_e2e.py scripts/telegram_test_guard.py
          python -m unittest discover -s tests_football_channel -p 'test_*.py' -v
          python -m unittest tests.test_telegram_test_routing -v
      - name: Actualiser les News Football pour S1, S4 et S5
        env:
          MAX_ARTICLES: '30'
          MAX_ARTICLES_PER_FEED: '8'
          MAX_NEWS_AGE_HOURS: '168'
        run: python fetch_foot_news.py
      - name: Vérifier strictement le canal Telegram de test
        run: python scripts/telegram_test_guard.py
      - name: Envoyer exactement une publication par système
        run: python -u scripts/telegram_live_e2e.py
