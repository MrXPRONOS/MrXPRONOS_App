name: BSD V2 - Validation analyses indicatives 1.40 a 2.00
on:
  push:
    branches: [feature/market-analyses-indicative-140-200-20261103]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bsd-v2-analyses140200-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Verify isolated analyses and historical calibrations
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: python -m pip install requests cryptography pillow
      - name: Test code, website and publication regressions
        run: |
          python -m compileall -q bsd
          python -m unittest discover -s bsd -p 'test_*.py' -v
          python -m unittest discover -s tests -p 'test_public_site_build.py' -v
          node --check assets/js/main.js
          node --test tests/pronos-category-selection.test.cjs
      - name: Restore private BSD archive for read-only simulation
        env:
          BSD_HISTORY_KEY: ${{ secrets.BSD_HISTORY_KEY }}
        run: python bsd/bsd_archive.py restore
      - name: Simulate 1.40-2.00 market analyses on public upcoming matches
        run: |
          python - <<'PY'
          import json,sys
          from pathlib import Path
          from datetime import datetime,timezone
          sys.path.insert(0,'bsd')
          from bsd_archive import MATCHES_FILE,_read_json
          from bsd_v2_core import V2History,fit_rho_2024
          from bsd_v2_btts import fit_btts_model
          from bsd_v2_over_under import fit_total_model
          from bsd_v2_double_chance import fit_model as fit_dc_model
          from bsd_v2_policies import fit_policy
          from bsd_v2_market_range_analyses import build_market_range_analyses
          hist=_read_json(MATCHES_FILE,[])
          assert hist
          index=V2History(hist)
          rho,_=fit_rho_2024(index)
          btts,_=fit_btts_model(index,rho=rho)
          total,_=fit_total_model(index,rho=rho)
          dc,_=fit_dc_model(index,rho=rho)
          cal,policy,_=fit_policy(index,rho=rho,btts_model=btts,total_model=total,dc_model=dc)
          doc=json.loads(Path('data.json').read_text())
          fixtures=[{**m,'id':m['source_event_id'],'status':'notstarted'}
                    for m in doc.get('matches',[])
                    if m.get('source_event_id') is not None]
          analyses,diagnostics=build_market_range_analyses(
              fixtures,index,now=datetime(2026,11,3,12,tzinfo=timezone.utc),
              rho=rho,calibration=cal,quality_policy=policy,
              btts_model=btts,total_model=total,dc_model=dc)
          assert analyses,"No actual range 1.40-2.00 analyses; do not merge empty feature"
          assert any(x['selection_key'].startswith('BTTS_') for x in analyses), "BTTS missing from test sample"
          assert all(x['analysis_only'] and x['do_not_send_to_telegram'] and
                    not x['recommendation_eligible'] and
                    x['odds_source']=='mrxpronos_model' and
                    1.40<=x['odds']<=2.0 for x in analyses)
          print('BSD_ANALYSES_140_200_HISTORICAL_DRYRUN',json.dumps({
            'total':len(analyses),'btts':sum(x['selection_key'].startswith('BTTS_') for x in analyses),
            'examples':[{k:x[k] for k in ('selection_key','odds','model_probability')}
                        for x in analyses[:5]],
            'diagnostics':diagnostics},ensure_ascii=False))
          Path('bsd/market_range_dryrun_summary.json').write_text(
            json.dumps({'total':len(analyses),
                        'btts':sum(x['selection_key'].startswith('BTTS_') for x in analyses),
                        'diagnostics':diagnostics},indent=2)+'\n')
          PY
      - name: Delete restored decrypted history
        if: always()
        run: rm -f bsd/all_matches_bsd.json bsd/backfill_state.json
      - name: Upload aggregate dry-run verification only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bsd-range-analyses-140-200-check-${{ github.run_id }}
          path: bsd/market_range_dryrun_summary.json
          retention-days: 21
