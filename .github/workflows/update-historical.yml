name: Mise à jour hebdomadaire de l'historique

on:
  schedule:
    - cron: '0 6 * * 0'   # tous les dimanches à 6h UTC
  workflow_dispatch:

jobs:
  update-historical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Installation des dépendances
        run: pip install requests
      - name: Mise à jour de l'historique
        run: python update_historical_cache.py
      - name: Commit et push
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'actions@github.com'
          git add historical_scores.json
          git commit -m "Mise à jour historique $(date +'%Y-%m-%d') [skip ci]" || echo "No changes"
          git pull --rebase -X theirs origin main
          git push origin main