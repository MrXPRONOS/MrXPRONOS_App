name: Actu Crypto - NEWS FIRST every 30 minutes

on:
  schedule:
    - cron: '0,30 * * * *'
  push:
    paths:
      - 'crypto/actu-crypto-photo-preview-final-20261117.flag'
  workflow_dispatch:
    inputs:
      confirm_real_production:
        type: boolean
        required: true
        default: false
        description: 'Authorize live posting to configured Actu Crypto channel?'

permissions:
  contents: write

# The same concurrency lock as the existing scheduler protects state updates
# across BOTH workflows and prevents duplicate simultaneous publications.
concurrency:
  group: actu-crypto-premium-production
  cancel-in-progress: false

jobs:
  crypto-world-news:
    if: github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.confirm_real_production == true)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      ACTU_CRYPTO_CHAT_ID: ${{ secrets.ACTU_CRYPTO_CHAT_ID || vars.ACTU_CRYPTO_CHAT_ID }}
      FOOTBALL_NEWS_BOT_TOKEN: ${{ secrets.FOOTBALL_NEWS_BOT_TOKEN }}
      TELEGRAM_ACTU_FOOT_BOT_TOKEN: ${{ secrets.TELEGRAM_ACTU_FOOT_BOT_TOKEN }}
      ACTU_FOOT_BOT_TOKEN: ${{ secrets.ACTU_FOOT_BOT_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install public RSS and image dependencies
        run: python -m pip install 'requests>=2.31,<3' 'Pillow>=10,<12' 'feedparser>=6.0,<7'
      - name: Run editorial and duplicate-detection regression tests
        run: |
          python -m compileall -q crypto
          python -m unittest crypto.test_news_digest_v1 crypto.test_news_media_v1 crypto.test_production_live_v1 -v
      - name: Read recent RSS news and publish only unseen qualified events
        run: python -m crypto.production_live_v1 --mode world
      - name: Save confirmed Telegram messages and event identities
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- crypto/production_state.json; then
            echo "CRYPTO_NEWS11_STATE_UNCHANGED"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crypto/production_state.json
          git commit -m "chore(crypto): persist worldwide news deduplication [skip ci]"
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
      - name: Archive confirmed news state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actu-crypto-news-world-dedupe-state
          path: crypto/production_state.json
          if-no-files-found: error
          retention-days: 21
