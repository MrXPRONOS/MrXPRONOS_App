name: Research ML V2 - Verify all historical years unchanged
on:
  push:
    branches: [research/single-ml-v2-20261024]
    paths: ['.github/workflows/research-ml-v2-verify-history-all-years.yml']
permissions:
  contents: read
jobs:
  verify-all-history:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ML_V2_HISTORY_KEY_B64: ${{ secrets.ML_V2_HISTORY_KEY_B64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/single-ml-v2-20261024
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install encryption research verification tools
        run: python -m pip install cryptography requests
      - name: Replay existing 2024-2026 source/identity checks
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=.:research python -m unittest discover -s research -p 'test_single_ml_v2_2024_union.py' -v
          PYTHONPATH=.:research python -m unittest discover -s research -p 'test_single_ml_v2_2025_union.py' -v
          PYTHONPATH=.:research python -m unittest discover -s research -p 'test_single_ml_v2_2026_union.py' -v
          PYTHONPATH=.:research python -m unittest discover -s research -p 'test_single_ml_v2_2024_repair.py' -v
          PYTHONPATH=.:research python -m unittest discover -s research -p 'test_single_ml_v2_2025_repair.py' -v
          PYTHONPATH=.:research python -m unittest discover -s research -p 'test_single_ml_v2_2026_repair.py' -v
      - name: Authenticate ciphertext and verify cumulative aggregate counts
        run: |
          set -euo pipefail
          PYTHONPATH=.:research python - <<'PY'
          import json
          from pathlib import Path
          from datetime import date
          from single_ml_v2_git import key_from_environment
          from single_ml_v2_2024_union import combine
          key=key_from_environment()
          expected={2024:91331,2025:87451,2026:76943}
          total=0
          for year,number in expected.items():
              through=date(2026,10,24) if year==2026 else None
              rows,report=combine(key,year=year,through=through)
              stored=json.loads(Path(f'research/{year}_multisource_audit.json').read_text())
              assert report==stored, f'{year} archived report is stale'
              assert report['distinct_safe_matches']==number, f'{year} drift detected'
              assert report['sportscore_failed_days_remaining']==0, f'{year} has unresolved dates'
              assert not report['remaining_provider_failed_dates']
              assert all(m['date'].startswith(str(year)+'-') for m in rows)
              assert len({m['id'] for m in rows})==len(rows)
              total+=number
              print('VERIFIED_HISTORICAL_YEAR',year,'MATCHES',number)
          assert total==255725
          print('ALL_THREE_YEARS_CERTIFIED_RESEARCH_IDENTITIES',total)
          print('NO_PLAINTEXT_FIXTURE_ARCHIVES_WRITTEN')
          PY
