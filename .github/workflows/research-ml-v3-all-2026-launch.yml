name: ML V3 - year 2026 all available months eight model exact-score Top5 Top10 Top20
# User requested all available 2026 months on 2026-11-02.
# Frozen archive ends 2026-10-24; October is explicitly partial, PRIMARY Jan-Sep only.
# One-shot research trigger: changes outside this workflow do not rerun.
on:
  push:
    branches: [research/single-ml-v2-20261024]
    paths: ['.github/workflows/research-ml-v3-all-2026-launch.yml']
permissions:
  contents: read
concurrency:
  group: research-ml-v3-topk-all-2026-one-shot
  cancel-in-progress: false
jobs:
  one-preregistered-month:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {label: jan2026, start: '2026-01-01', end: '2026-01-31'}
          - {label: feb2026, start: '2026-02-01', end: '2026-02-28'}
          - {label: mar2026, start: '2026-03-01', end: '2026-03-31'}
          - {label: apr2026, start: '2026-04-01', end: '2026-04-30'}
          - {label: may2026, start: '2026-05-01', end: '2026-05-31'}
          - {label: jun2026, start: '2026-06-01', end: '2026-06-30'}
          - {label: jul2026, start: '2026-07-01', end: '2026-07-31'}
          - {label: aug2026, start: '2026-08-01', end: '2026-08-31'}
          - {label: sep2026, start: '2026-09-01', end: '2026-09-30'}
          - {label: octpartial2026, start: '2026-10-01', end: '2026-10-24'}
    env:
      ML_V2_HISTORY_KEY_B64: ${{ secrets.ML_V2_HISTORY_KEY_B64 }}
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen ML comparators
        run: python -m pip install numpy scipy scikit-learn requests cryptography lightgbm==4.6.0 catboost==1.2.8
      - name: Check prospective comparator unit tests (synthetic)
        run: PYTHONPATH=.:research python -m unittest research.test_ml_v3_topk_full_2026 research.test_single_ml_v3 -v
      - name: Chronological research replay — explicitly authorized 2026-11-02
        run: |
          set -euo pipefail
          PYTHONPATH=.:research python research/single_ml_v2_multisource.py \
            --start "${{ matrix.start }}" --end "${{ matrix.end }}" \
            --max-eval 0 --experimental-v3 \
            --out "/tmp/mlv3-2026-${{ matrix.label }}" \
            > "/tmp/mlv3-2026-${{ matrix.label }}-training.log" 2>&1 || {
              tail -50 "/tmp/mlv3-2026-${{ matrix.label }}-training.log"
              exit 1
            }
          grep 'RETRAIN_V3\|PROGRESS' "/tmp/mlv3-2026-${{ matrix.label }}-training.log" | tail -8
      - name: Select daily 5/10/20 separately on exact common V2/V3 matches
        run: |
          PYTHONPATH=.:research python research/ml_v3_topk_full_2026.py month \
            --predictions "/tmp/mlv3-2026-${{ matrix.label }}/all_predictions.csv" \
            --start "${{ matrix.start }}" --end "${{ matrix.end }}" \
            --out "/tmp/mlv3-2026-${{ matrix.label }}/daily_8model_aggregate.json"
      - uses: actions/upload-artifact@v4
        with:
          name: mlv3-2026-topk-${{ matrix.label }}
          path: /tmp/mlv3-2026-${{ matrix.label }}/daily_8model_aggregate.json
          if-no-files-found: error
          retention-days: 30
  pooled-preregistered-comparison:
    needs: [one-preregistered-month]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy scipy scikit-learn
      - run: PYTHONPATH=.:research python -m unittest research.test_ml_v3_topk_full_2026 -v
      - uses: actions/download-artifact@v4
        with:
          pattern: mlv3-2026-topk-*
          path: /tmp/v3-periods
      - name: Compare all ten available 2026 periods, classify Jan-Sep primary and October partial
        run: |
          PYTHONPATH=.:research python research/ml_v3_topk_full_2026.py pool \
            --inputs /tmp/v3-periods/mlv3-2026-topk-*/daily_8model_aggregate.json \
            --out /tmp/mlv3-2026-topk-final.json --resamples 4000
      - uses: actions/upload-artifact@v4
        with:
          name: mlv3-2026-topk-full-year-available-results
          path: /tmp/mlv3-2026-topk-final.json
          if-no-files-found: error
          retention-days: 30
