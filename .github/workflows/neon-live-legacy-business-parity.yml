name: Neon LIVE strict historical business parity
on:
  push:
    branches: [migration/supabase-to-free-stack-20261022]
    paths:
      - supabase/functions/live/index.ts
      - supabase/functions/live/index.neon.ts
      - .github/workflows/neon-live-legacy-business-parity.yml
  workflow_dispatch:
permissions: { contents: read }
jobs:
  exact-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Verify complete business source is unchanged outside transport
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source=Path("supabase/functions/live/index.ts").read_text()
          adapted=Path("supabase/functions/live/index.neon.ts").read_text()
          assert adapted.startswith('import "./_neon_runtime.ts";\n')
          adapted=adapted.removeprefix('import "./_neon_runtime.ts";\n')
          marker='\n// Neon Node.js 24 Fetch entrypoint. Business functions above are preserved.\n'
          assert adapted.count(marker)==1
          adapted=adapted.split(marker,1)[0]
          for original,replacement in [
            ("serve, neonGetHandler","serve"),
            ("./_neon_serve.ts","https://deno.land/std@0.170.0/http/server.ts"),
            ("./_neon_db.ts","https://esm.sh/@supabase/supabase-js@2"),
            ("./_neon_banner.ts","../_shared/live_sponsor_banner.ts"),
            ('"@resvg/resvg-wasm"','"https://esm.sh/@resvg/resvg-wasm@2.6.2?target=deno"'),
            ('"satori"','"npm:satori@0.12.0"'),
            ('"satori-html"','"npm:satori-html@0.3.2"'),
            ('"opentype.js"','"npm:opentype.js@1.3.4"')
          ]:
            adapted=adapted.replace(original,replacement)
          # The only permitted deviations are acquisition/clock transport functions.
          # Restore their historical implementations before comparing all other bytes.
          for start,end in [
            ("async function reuseCachedStats(matches: any[]) {","function isBsdNumericEvent("),
            ("async function enrichLiveMatchesWithFreeStats(matches: any[]) {","async function cacheLiveMatches("),
          ]:
            begin_new=adapted.index(start)
            end_new=adapted.index(end,begin_new)
            begin_old=source.index(start)
            end_old=source.index(end,begin_old)
            acquisition=adapted[begin_new:end_new]
            assert "live_stats" in acquisition
            if "reuseCachedStats" in start:
              assert "observationAge <= 120000" in acquisition
              assert "sportscore_minute_source" in acquisition
              assert "sameKickoff" in acquisition
            else:
              assert "const prioritySlots" in acquisition
              assert "sportscore_minute_observed_at: nowIso()" in acquisition
            adapted=adapted[:begin_new]+source[begin_old:end_old]+adapted[end_new:]
          # Acquisition-only canonical deduplication: reconcile the same
          # canonical selection already used by the PostgreSQL snapshot.
          dedup_start="    // Acquisition-only deduplication: the DB snapshot already uses this"
          dedup_end="    // LIVE coverage telemetry: actual available complete market pairs,"
          assert adapted.count(dedup_start)==1
          begin=adapted.index(dedup_start)
          end=adapted.index(dedup_end,begin)
          segment=adapted[begin:end]
          assert "uniqueMergedStatsRows(allRawMatches.map(mergedRowFromMatch))" in segment
          assert "LIVE_CANONICAL_MATCH_DEDUP" in segment
          adapted=adapted[:begin]+adapted[end:]
          # Exactly four 5 -> 20 batch-limit adaptations are permitted. Prove
          # that every prediction, probability and quality rule is untouched.
          allowed_batch_changes=[
            ('// Refresh par petits lots pour rester sous la limite CPU Supabase.\n// Valeur choisie : 5 matchs par invocation enfant.',
             '// Refresh LIVE Neon : 20 matchs par lot (repli automatique en cas de surcharge CPU).'),
            ('Math.min(5, safeEnvInt("LIVE_REFRESH_BATCH_SIZE", 5))',
             'Math.min(20, safeEnvInt("LIVE_REFRESH_BATCH_SIZE", 20))'),
            ('Math.min(5, Math.floor(options.batchSize ?? LIVE_REFRESH_BATCH_SIZE))',
             'Math.min(20, Math.floor(options.batchSize ?? LIVE_REFRESH_BATCH_SIZE))'),
            ('let effectiveBatchSize = Math.max(1, Math.min(5, batchSize));',
             'let effectiveBatchSize = Math.max(1, Math.min(20, batchSize));'),
            ('// - si un lot de 5 reçoit encore un 546, on retente 2 puis 1;',
             '// - si un lot de 20 reçoit un 546, on réduit progressivement la taille jusqu’à 1;'),
            ('// Un lot interne : maximum 5 matchs.','// Un lot interne : maximum 20 matchs.'),
            ('const batchSize = Math.max(1, Math.min(5, requestedBatchSize));',
             'const batchSize = Math.max(1, Math.min(20, requestedBatchSize));'),
          ]
          for original,changed in allowed_batch_changes:
            assert adapted.count(changed)==1,("BATCH_CHANGE_NOT_FOUND_OR_DUPLICATE",changed)
            adapted=adapted.replace(changed,original)
          assert adapted==source, "LIVE BUSINESS SOURCE HAS CHANGED OUTSIDE ACQUISITION AND BATCH TRANSPORT — STOP DEPLOYMENT"
          print("LEGACY_BUSINESS_EXACT_PARITY_PASS",len(source),"characters; BATCH_SIZE_20_VERIFIED")
          print("LEGACY_BUSINESS_EXACT_PARITY_PASS",len(source),"characters")
          PY
