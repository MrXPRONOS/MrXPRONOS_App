name: Telegram Cine Radar - Tests de coordination sans reseau
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/telegram-discovery-inventory-ci.yml'
      - '.github/workflows/telegram-discovery-daily.yml'
      - '.github/workflows/cineradar-daily-promo.yml'
      - 'telegram-film-relay/scripts/discovery_inventory_daily.py'
      - 'telegram-film-relay/scripts/discovery_daily.py'
      - 'scripts/inventory_mrxpronos_shared_admin_channels.py'
      - 'scripts/cineradar_daily_promo.py'
      - 'telegram-film-relay/tests/test_discovery_inventory_coordinator.py'
      - 'tests/test_cineradar_daily_promo.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les dépendances des deux outils
        run: python -m pip install -r telegram-film-relay/requirements.txt
      - name: Compiler et tester la connexion partagée sans réseau
        env:
          PYTHONPATH: telegram-film-relay
        run: |
          python -m py_compile telegram-film-relay/scripts/discovery_daily.py telegram-film-relay/scripts/discovery_inventory_daily.py scripts/inventory_mrxpronos_shared_admin_channels.py scripts/cineradar_daily_promo.py
          python -m unittest discover -s telegram-film-relay/tests -p 'test_discovery_inventory_coordinator.py' -v
          python -m unittest discover -s telegram-film-relay/tests -p 'test_daily_discovery.py' -v
          python -m unittest discover -s tests -p 'test_cineradar_daily_promo.py' -v
