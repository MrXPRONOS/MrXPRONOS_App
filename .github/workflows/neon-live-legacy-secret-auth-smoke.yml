name: Neon legacy LIVE encrypted secrets and Telegram config smoke
on:
  push:
    branches: [migration/supabase-to-free-stack-20261022]
    paths: ['.github/workflows/neon-live-legacy-secret-auth-smoke.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  auth:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read-only check that encrypted secrets unlock legacy cron and Telegram configuration
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request
          assert os.environ.get("CRON_SECRET"),"Github cron secret missing"
          base="https://br-winter-truth-b9of9tss-livelegacytest.compute.c-7.eu-central-1.aws.neon.tech"
          req=urllib.request.Request(base+"/telegram/status",headers={"x-cron-secret":os.environ["CRON_SECRET"]})
          with urllib.request.urlopen(req,timeout=40) as res:
            body=json.load(res)
            assert res.status==200,(res.status,body.get("error"))
          assert body.get("telegram_configured") is True, "Telegram token not restored"
          assert body.get("target_chat_count")==2, "Both Telegram channels must be configured"
          print("NEON_LEGACY_SECURE_ENV_PASS",{"telegram_configured":True,"target_chat_count":2},flush=True)
          PY
