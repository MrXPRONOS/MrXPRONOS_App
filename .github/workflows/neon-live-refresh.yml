name: Supabase LIVE — ancienne relance manuelle reconvertie
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mrx-live-supabase-cycle
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Supabase refresh plus validation; no Neon calls
        env:
          GITHUB_REF: ${{ github.ref }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: python -m scripts.supabase_live_cycle --mode cycle
