name: Supabase LIVE - Rafraîchissement manuel de secours
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mrx-live-supabase-cycle
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Refresh and validate the already deployed Supabase function
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m scripts.supabase_live_cycle --mode cycle
