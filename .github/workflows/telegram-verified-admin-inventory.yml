name: Telegram - Verified shared admin inventory (encrypted)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/telegram-verified-admin-inventory-run-once.txt'

permissions:
  contents: read

# Same personal Telegram session lock as other monitoring/research workflows.
concurrency:
  group: mrx-telegram-personal-account
  cancel-in-progress: false

jobs:
  audit-and-encrypt:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      TG_API_ID: ${{ secrets.TG_API_ID }}
      TG_API_HASH: ${{ secrets.TG_API_HASH }}
      TG_SESSION_STRING: ${{ secrets.TG_SESSION_STRING || secrets.TG_STRING_SESSION || secrets.TG_STREAM_SESSION }}
      MRXPRONOS_CANAL_BOT_TOKEN: ${{ secrets.MRXPRONOS_CANAL_BOT_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      FOOTBALL_NEWS_BOT_TOKEN: ${{ secrets.FOOTBALL_NEWS_BOT_TOKEN }}
      EDITORIAL_TELEGRAM_BOT_TOKEN: ${{ secrets.EDITORIAL_TELEGRAM_BOT_TOKEN }}
      PARTNERSHIP_BOT_TOKEN: ${{ secrets.PARTNERSHIP_BOT_TOKEN }}
      CINEX_BOT_TOKEN: ${{ secrets.CINEX_BOT_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/audit_mrxpronos_canal_bot.py
            scripts/inventory_mrxpronos_shared_admin_channels.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install read-only Telegram API client
        run: python -m pip install --disable-pip-version-check 'requests>=2.31,<3' 'telethon>=1.38,<2'
      - name: Verify source syntax
        run: python -m py_compile scripts/audit_mrxpronos_canal_bot.py scripts/inventory_mrxpronos_shared_admin_channels.py
      - name: Verify both administrators and store encrypted metadata
        run: python scripts/inventory_mrxpronos_shared_admin_channels.py
