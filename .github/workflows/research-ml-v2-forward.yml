name: ML V2 - blind prekickoff football research
on:
  schedule:
    - cron: '20 0,12 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: ml-v2-encrypted-history
  cancel-in-progress: false
jobs:
  blind-forward:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.ML_V2_FORWARD_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 145
    env:
      GH_RESEARCH_READ_TOKEN: ${{ github.token }}
      ML_V2_HISTORY_KEY_B64: ${{ secrets.ML_V2_HISTORY_KEY_B64 }}
      SPORTDATA_API_KEY: ${{ secrets.SPORTDATA_API_KEY }}
      SPORTDATA_API_KEY_1: ${{ secrets.SPORTDATA_API_KEY_1 }}
      SPORTDATA_API_KEY_2: ${{ secrets.SPORTDATA_API_KEY_2 }}
      SPORTDATA_API_KEY_3: ${{ secrets.SPORTDATA_API_KEY_3 }}
      SPORTDATA_API_KEY_4: ${{ secrets.SPORTDATA_API_KEY_4 }}
      SPORTDATA_API_KEY_5: ${{ secrets.SPORTDATA_API_KEY_5 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/single-ml-v2-20261024
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install cryptography requests numpy scipy scikit-learn lightgbm==4.6.0 catboost==1.2.8
      - name: Require private encryption and API credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ML_V2_HISTORY_KEY_B64" || { echo 'Missing private ML_V2_HISTORY_KEY_B64'; exit 1; }
          if [[ -z "$SPORTDATA_API_KEY" && -z "$SPORTDATA_API_KEY_1" && -z "$SPORTDATA_API_KEY_2" && -z "$SPORTDATA_API_KEY_3" && -z "$SPORTDATA_API_KEY_4" && -z "$SPORTDATA_API_KEY_5" ]]; then
            echo 'No configured SportsAPI football key'
            exit 1
          fi
      - name: Create verified prekickoff encrypted forecasts
        shell: bash
        run: |
          set -euo pipefail
          yesterday="$(date -u -d yesterday +%F)"
          if PYTHONPATH=.:research python research/single_ml_v2_git.py export \
                --start 2024-01-01 --end "$yesterday" \
                --output /tmp/ml-v2-forward-history.json; then
            PYTHONPATH=.:research python research/single_ml_v2_prepare_xg.py \
                --source /tmp/ml-v2-forward-history.json --out /tmp/ml-v2-forward-with-xg.json
            PYTHONPATH=.:research python research/single_ml_v2_forward.py stage \
                --history /tmp/ml-v2-forward-with-xg.json --lookahead-hours 30
          else
            echo '::warning::Forward stage skipped: complete authenticated football history not available'
          fi
      - name: Commit immutable encrypted forecasts BEFORE settlement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [[ -d research/encrypted_football/forward/issued ]]; then
            git add research/encrypted_football/forward/issued/
          fi
          git diff --cached --name-only | grep -vE '^research/encrypted_football/forward/issued/[0-9]{4}/[0-9]{2}/[0-9]{2}/[a-f0-9]{64}\.enc$' && { echo 'Unsafe staged path'; exit 1; } || true
          if ! git diff --cached --quiet; then
            git commit -m 'research: lock encrypted prematch prediction snapshots'
            git push origin HEAD:research/single-ml-v2-20261024
          fi
      - name: Verify and settle older issued forecasts
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=.:research python research/single_ml_v2_forward.py settle --days 10
      - name: Commit encrypted settlements
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d research/encrypted_football/forward/settled ]]; then
            git add research/encrypted_football/forward/settled/
          fi
          git diff --cached --name-only | grep -vE '^research/encrypted_football/forward/settled/[a-f0-9]{2}/[a-f0-9]{64}\.enc$' && { echo 'Unsafe staged path'; exit 1; } || true
          if ! git diff --cached --quiet; then
            git commit -m 'research: lock independently verified encrypted football outcomes'
            git push origin HEAD:research/single-ml-v2-20261024
          fi
      - name: Generate independent future-only statistical report
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=.:research python research/single_ml_v2_forward.py report \
             --test-start 2026-10-25 --out /tmp/ml-v2-blind-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ml-v2-aggregate-blind-audit
          path: /tmp/ml-v2-blind-audit.json
          if-no-files-found: warn
          retention-days: 14
