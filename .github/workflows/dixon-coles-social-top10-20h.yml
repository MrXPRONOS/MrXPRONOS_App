name: Dixon-Coles - Social Top10 20h

on:
  schedule:
    - cron: '0 20 * * *'
  push:
    branches: [main]
    paths:
      - 'config/dixon-score-manual-run.txt'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        default: preview
        options: [preview, publish]
      publication_mode:
        type: choice
        description: 'flexible: publier 1 à 10 vrais matchs ; strict: bloquer si moins de 10'
        default: flexible
        options: [flexible, strict]
      publish_platforms:
        type: string
        description: 'Plateformes séparées par des virgules. TikTok nécessite le consentement ci-dessous.'
        default: facebook,youtube,instagram,threads,bluesky
      tiktok_consent:
        type: boolean
        description: "Autoriser explicitement CETTE publication TikTok (jamais pour la tâche automatique)"
        default: false
      tiktok_privacy:
        type: choice
        default: SELF_ONLY
        options: [SELF_ONLY, MUTUAL_FOLLOW_FRIENDS, FOLLOWER_OF_CREATOR, PUBLIC_TO_EVERYONE]
      source:
        type: choice
        default: espn
        options: [espn, auto, football-data, openfootball, openligadb]

permissions:
  contents: write

concurrency:
  group: dixon-coles-social-top10-20h
  cancel-in-progress: false

jobs:
  social:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      SOCIAL_MODE: ${{ github.event_name == 'schedule' && 'publish' || github.event_name == 'push' && 'site_only' || inputs.mode || 'preview' }}
      DCSCORE_SOURCE: ${{ inputs.source || 'espn' }}
      DCSCORE_PUBLICATION_MODE: ${{ github.event_name == 'schedule' && 'flexible' || inputs.publication_mode || 'flexible' }}
      POST_PLATFORMS: ${{ github.event_name == 'schedule' && 'facebook,youtube,instagram,threads,bluesky' || inputs.publish_platforms || 'facebook,youtube,instagram,threads,bluesky' }}
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
      TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
      TIKTOK_PER_VIDEO_CONSENT: ${{ github.event_name == 'workflow_dispatch' && inputs.tiktok_consent && 'true' || 'false' }}
      TIKTOK_DIRECT_POST_ENABLED: ${{ github.event_name == 'workflow_dispatch' && inputs.tiktok_consent && secrets.TIKTOK_DIRECT_POST_APPROVED == 'true' && 'true' || 'false' }}
      TIKTOK_PRIVACY_LEVEL: ${{ inputs.tiktok_privacy || 'SELF_ONLY' }}
      FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      META_APP_ID: ${{ secrets.META_APP_ID }}
      META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
      META_LONG_LIVED_USER_TOKEN: ${{ secrets.META_LONG_LIVED_USER_TOKEN }}
      META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
      META_PAGE_NAME: ${{ secrets.META_PAGE_NAME }}
      META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      THREADS_APP_SECRET: ${{ secrets.THREADS_APP_SECRET }}
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
      BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
      BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_PRIVACY_STATUS: public

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core fonts-liberation
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e 'dixon-coles[test,video]'
          python -m pip install -r requirements_social.txt
      - name: Run safety tests
        run: |
          python -m py_compile scripts/create_social_exact_score_video.py scripts/publish_social_exact_score_video.py
          python -m unittest discover -s tests -p test_social_exact_score_video.py -v
          python -m pytest -q dixon-coles/tests/test_video_grid.py dixon-coles/tests/test_daily_espn.py dixon-coles/tests/test_daily_popularity_v2.py dixon-coles/tests/test_daily_top10_v3.py
      - name: Generate up to 10 verified matches (publish partial 1-9 in flexible mode)
        id: render
        shell: bash
        run: |
          set +e
          python scripts/create_social_exact_score_video.py --day tomorrow --source "$DCSCORE_SOURCE" --publication-mode "$DCSCORE_PUBLICATION_MODE" --output-dir social_exact_scores_out
          CODE=$?
          set -e
          if [ "$CODE" -eq 3 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$CODE" -ne 0 ]; then exit "$CODE"; fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "Daily flexible: render only real, verified fixtures (1 to 10)."
      - name: Identify target
        id: target
        if: steps.render.outputs.ready == 'true'
        run: |
          TARGET="$(TZ=Africa/Lome date -d tomorrow +%F)"
          MANIFEST="social_exact_scores_out/$TARGET/social_manifest.json"
          test -s "$MANIFEST"
          python scripts/check_daily_flexible_manifest.py --manifest "$MANIFEST" --day "$TARGET" --mode "$DCSCORE_PUBLICATION_MODE" --output "$GITHUB_OUTPUT"
          VIDEO="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["video"])' "$MANIFEST")"
          COUNT="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["count"])' "$MANIFEST")"
          test -s "$VIDEO"
          echo "day=$TARGET" >> "$GITHUB_OUTPUT"
          echo "video=$VIDEO" >> "$GITHUB_OUTPUT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Confirmed social video: $COUNT real matches; $(($COUNT*2)) verified crests"
          ffprobe -v error -show_entries stream=width,height,codec_name -show_entries format=duration,size -of json "$VIDEO"
          {
            echo "### Mr XPRONOS — publication quotidienne"
            echo "- Date des matchs : $TARGET"
            echo "- Mode : $DCSCORE_PUBLICATION_MODE"
            echo "- Scores affichés : $COUNT / 10"
            echo "- Espaces inutilisés : sans carte ni score factice"
            echo "- Réseaux : $POST_PLATFORMS"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Validate preview and provider routing without public upload
        if: steps.render.outputs.ready == 'true'
        run: |
          TARGET="${{ steps.target.outputs.day }}"
          python scripts/publish_social_exact_score_video.py --dry-run \
            --manifest "social_exact_scores_out/$TARGET/social_manifest.json" \
            --predictions "social_exact_scores_out/model/$TARGET/predictions.json" \
            --storyboard "social_exact_scores_out/model/$TARGET/video_payload.json" \
            --video "${{ steps.target.outputs.video }}" \
            --platforms "$POST_PLATFORMS"
      - name: Publish verified Dixon-Coles video scores to public website
        if: steps.render.outputs.ready == 'true' && env.SOCIAL_MODE != 'preview'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TARGET="${{ steps.target.outputs.day }}"
          mkdir -p "_dixon_site_export"
          PUBLIC_FILE="_dixon_site_export/$TARGET.json"
          python scripts/export_dixon_scores_site.py \
            --manifest "social_exact_scores_out/$TARGET/social_manifest.json" \
            --predictions "social_exact_scores_out/model/$TARGET/predictions.json" \
            --storyboard "social_exact_scores_out/model/$TARGET/video_payload.json" \
            --video "${{ steps.target.outputs.video }}" \
            --out "$PUBLIC_FILE"
          DEST="/repos/${GITHUB_REPOSITORY}/contents/dixon-scores-daily/${TARGET}.json"
          EXISTING="$(gh api "${DEST}?ref=gh-pages" --jq '.sha' 2>/dev/null || true)"
          CONTENT="$(base64 -w0 "$PUBLIC_FILE")"
          if [ -n "$EXISTING" ]; then
            gh api -X PUT "$DEST" \
              -f branch=gh-pages \
              -f sha="$EXISTING" \
              -f message="data(scores): verified Dixon-Coles video for ${TARGET}" \
              -f content="$CONTENT" >/dev/null
          else
            gh api -X PUT "$DEST" \
              -f branch=gh-pages \
              -f message="data(scores): verified Dixon-Coles video for ${TARGET}" \
              -f content="$CONTENT" >/dev/null
          fi
          REMOTE="$(gh api "${DEST}?ref=gh-pages" --jq '.content' | tr -d '\n' | base64 -d)"
          if [ "$REMOTE" != "$(cat "$PUBLIC_FILE")" ]; then
            echo "::error::Verified Dixon-Coles score feed not published intact"
            exit 1
          fi
          echo "DIXON_COLES_VIDEO_SCORES_PAGES_CONFIRMED $TARGET"
          echo "- Site Scores exacts : ${TARGET} · ${{ steps.target.outputs.count }} sélections vérifiées" >> "$GITHUB_STEP_SUMMARY"
      - name: Notify opted-in users about new exact scores
        if: steps.render.outputs.ready == 'true' && env.SOCIAL_MODE != 'preview'
        continue-on-error: true
        shell: bash
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          TARGET="${{ steps.target.outputs.day }}"
          SCORE_FILE="_dixon_site_export/${TARGET}.json"
          test -s "$SCORE_FILE"
          python -c 'import json,sys; d=json.load(open(sys.argv[1])); print("Verified scores published:",d["date"],d["count"])' "$SCORE_FILE"
          python - "$SCORE_FILE" > _dixon_site_export/push-payload.json <<'PY'
          import json,sys
          obj=json.load(open(sys.argv[1],encoding="utf8"))
          print(json.dumps({"action":"publish","date":obj["date"],"video_sha256":obj["video_sha256"],"count":obj["count"]}))
          PY
          HTTP_CODE="$(curl --silent --show-error --fail-with-body --output _dixon_site_export/push-response.json --write-out '%{http_code}' \
            --retry 12 --retry-delay 10 --retry-max-time 180 --retry-all-errors \
            -X POST "https://nhwafcpndlufzzxexikh.supabase.co/functions/v1/dixon-score-alerts" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            --data-binary @_dixon_site_export/push-payload.json)" || {
            echo "::warning::Notification non confirmée après les nouvelles tentatives."
            test -f _dixon_site_export/push-response.json && cat _dixon_site_export/push-response.json || true
            exit 1
          }
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::warning::Notification scores exacts non confirmée (HTTP $HTTP_CODE)"
            cat _dixon_site_export/push-response.json
            exit 1
          fi
          cat _dixon_site_export/push-response.json

      - name: Refresh social tokens
        if: steps.render.outputs.ready == 'true' && env.SOCIAL_MODE == 'publish'
        continue-on-error: true
        run: python scripts/refresh_social_tokens.py --out social_exact_scores_out/refreshed_tokens.json --github-env "$GITHUB_ENV"
      - name: Publish only on social networks
        if: steps.render.outputs.ready == 'true' && env.SOCIAL_MODE == 'publish'
        run: |
          TARGET="${{ steps.target.outputs.day }}"
          python scripts/publish_social_exact_score_video.py \
            --manifest "social_exact_scores_out/$TARGET/social_manifest.json" \
            --predictions "social_exact_scores_out/model/$TARGET/predictions.json" \
            --storyboard "social_exact_scores_out/model/$TARGET/video_payload.json" \
            --video "${{ steps.target.outputs.video }}" \
            --platforms "$POST_PLATFORMS" \
            --report social_exact_scores_out/social_post_results.json
      - name: Verify each provider receipt
        if: always() && steps.render.outputs.ready == 'true' && env.SOCIAL_MODE == 'publish'
        run: |
          TARGET="${{ steps.target.outputs.day }}"
          python scripts/verify_social_publications.py \
            --report social_exact_scores_out/social_post_results.json \
            --expected "$POST_PLATFORMS" \
            --manifest "social_exact_scores_out/$TARGET/social_manifest.json"
      - name: Archive evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: social-top10-20h-${{ github.run_id }}
          path: |
            social_exact_scores_out/**/social_exact_scores_*.mp4
            social_exact_scores_out/**/cta_safe_zone.png
            social_exact_scores_out/**/social_manifest.json
            social_exact_scores_out/**/skipped.json
            social_exact_scores_out/model/**/predictions.json
            social_exact_scores_out/model/**/video_payload.json
            social_exact_scores_out/social_post_results.json
          if-no-files-found: warn
          retention-days: 14
