name: TEMP clean multi-source provider smoke
on:
  push:
    branches:
      - feat/multi-source-football-integration-20261013
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONUNBUFFERED: '1'
      FOOTBALL_MULTI_SOURCE: '1'
      SPORTSCORE_ALLOW_UNDOCUMENTED_ODDS: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests
      - name: Offline provider tests
        run: |
          python -m py_compile bsd/free_football_sources.py bsd/bsd_api.py bsd/bsd_h2h.py scripts/football_match_lifecycle.py scripts/football_channel.py
          python -m unittest discover -s bsd -p 'test_free_football_sources.py' -v
      - name: Real provider smoke
        run: |
          PYTHONPATH=bsd:scripts python - <<'PY'
          from datetime import datetime, timezone
          import requests
          from free_football_sources import (
              fetch_espn_day, fetch_sportscore_day, fetch_sportscore_live,
              fetch_sportscore_match, fetch_thesportsdb_day, fetch_openligadb_day,
              sportscore_detail_enrichment, extract_sportscore_odds,
          )
          day=datetime.now(timezone.utc).date()
          session=requests.Session()
          providers={
              "espn": fetch_espn_day(session,day,ttl=0),
              "sportscore": fetch_sportscore_day(session,day,ttl=0),
              "thesportsdb": fetch_thesportsdb_day(session,day,ttl=0),
              "openligadb": fetch_openligadb_day(session,day,ttl=0),
          }
          for name,snap in providers.items():
              print("PROVIDER",name,"rows",len(snap.rows),"error",snap.error)
          live=fetch_sportscore_live(session,ttl=0)
          print("SPORTSCORE_LIVE",len(live.rows),"error",live.error)
          if live.rows:
              print("SPORTSCORE_LIVE_SAMPLE", {
                  "home":live.rows[0].get("home_team"),
                  "away":live.rows[0].get("away_team"),
                  "minute":live.rows[0].get("minute"),
                  "score":(live.rows[0].get("home_score"),live.rows[0].get("away_score")),
                  "slug":live.rows[0].get("sportscore_slug"),
              })
          candidates=live.rows or providers["sportscore"].rows
          sample=next((x for x in candidates if x.get("sportscore_slug")),None)
          if sample:
              detail=fetch_sportscore_match(session,sample["sportscore_slug"],ttl=0)
              enrich=sportscore_detail_enrichment(detail)
              odds=extract_sportscore_odds(detail)
              print("SPORTSCORE_DETAIL",{
                  "slug":sample["sportscore_slug"],
                  "lineups":bool(enrich.get("lineups")),
                  "timeline":len(enrich.get("timeline") or []),
                  "stats":bool(enrich.get("stats")),
                  "odds_available":odds.get("available"),
                  "odds_contract_verified":odds.get("contract_verified"),
                  "odds_automation_allowed":odds.get("automation_allowed"),
              })
          assert providers["espn"].rows or providers["sportscore"].rows
          PY
