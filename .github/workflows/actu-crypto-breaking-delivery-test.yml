name: Actu Crypto - 08 Telegram delivery TEST ONLY

on:
  push:
    branches: [feature/actu-crypto-lot-06-10]
    paths:
      - 'crypto/send_breaking_08_delivery_test.py'
      - '.github/workflows/actu-crypto-breaking-delivery-test.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: actu-crypto-breaking-08-delivery-test
  cancel-in-progress: false

jobs:
  check-delivery:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[breaking-delivery-test]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FOOTBALL_NEWS_BOT_TOKEN: ${{ secrets.FOOTBALL_NEWS_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install HTTP and image dependencies
        run: python -m pip install 'requests>=2.31,<3' 'Pillow>=10,<12'
      - name: Send one diagnostic PHOTO plus caption to validated @predict_mrxp
        run: python -m crypto.send_breaking_08_delivery_test
      - name: Archive sent diagnostic image
        uses: actions/upload-artifact@v4
        with:
          name: crypto-publication-08-telegram-photo-delivery-test
          path: crypto/generated/test/breaking_08_delivery_test.png
          if-no-files-found: error
          retention-days: 14
