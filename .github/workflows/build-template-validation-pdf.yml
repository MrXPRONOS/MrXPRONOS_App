name: Build editable Actu Foot template validation PDF

on:
  push:
    branches:
      - template-validation-pdf-20261013
    paths:
      - '.github/workflows/build-template-validation-pdf.yml'
      - 'scripts/build_template_validation_pdf.py'
      - 'scripts/actu_foot_event_templates.py'
      - 'scripts/build_event_batch_5_assets.py'
      - 'scripts/build_event_batch_6_assets.py'
      - 'scripts/build_event_batch_7_assets.py'
      - 'scripts/build_event_batch_8_assets.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --quiet Pillow reportlab requests
      - name: Build editable PDF
        run: python scripts/build_template_validation_pdf.py
      - name: Verify PDF exists
        run: |
          test -s artifacts/MR_XPRONOS_Validation_Templates_Actu_Foot.pdf
          file artifacts/MR_XPRONOS_Validation_Templates_Actu_Foot.pdf
          ls -lh artifacts/MR_XPRONOS_Validation_Templates_Actu_Foot.pdf
      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: MR_XPRONOS_Validation_Templates_Actu_Foot
          path: artifacts/MR_XPRONOS_Validation_Templates_Actu_Foot.pdf
          if-no-files-found: error
          retention-days: 7
