name: Actu Foot V1.2 - debriefs et classements verifies

on:
  schedule:
    # Débriefs toutes les 30 minutes; classements consolidés à 22h Lomé.
    - cron: '13,43 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Débriefs et/ou classements'
        type: choice
        options: [all, debrief, standings]
        default: all
        required: true
      dry_run:
        description: 'Simulation sans Telegram ni D1'
        type: boolean
        default: true
        required: true
  push:
    branches: [main]
    paths:
      - '.github/workflows/actufoot-v12.yml'
      - 'scripts/actufoot_v12.py'
      - 'tests_football_channel/test_actufoot_v12.py'

permissions:
  contents: read

# Partage la sérialisation avec V1.1 : même D1, mêmes quotas Telegram.
concurrency:
  group: actufoot-v11-live-publisher
  cancel-in-progress: false

jobs:
  publish:
    name: V1.2 ESPN / D1 / Telegram
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      FOOTBALL_NEWS_BOT_TOKEN: ${{ secrets.FOOTBALL_NEWS_BOT_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      FOOTBALL_ESPN_REQUEST_BUDGET: '12'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            scripts
            bsd
            tests_football_channel
            config
            assets
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests Pillow 'cryptography>=43,<47' 'langdetect>=1.0.9,<2'
      - name: Verify source format and D1 safeguards offline
        run: |
          python -m py_compile scripts/actufoot_v12.py scripts/actufoot_v11_live.py
          python -m unittest tests_football_channel.test_actufoot_v12 tests_football_channel.test_actufoot_v11_live -q
          python -c "from scripts.actufoot_v11_live import config_channels; assert len(config_channels()) == 10"
      - name: Publish only source-verified V1.2 items
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          DRY: ${{ inputs.dry_run || false }}
          MODE: ${{ inputs.mode || 'all' }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = push ] || [ "$DRY" = true ]; then
            python scripts/actufoot_v12.py --mode "$MODE" --dry-run
          else
            test -n "$FOOTBALL_NEWS_BOT_TOKEN"
            test -n "$CLOUDFLARE_API_TOKEN"
            python scripts/actufoot_v12.py --mode "$MODE"
          fi
