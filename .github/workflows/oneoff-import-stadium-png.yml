name: One-off import original stadium PNG into GitHub

on:
  push:
    branches: ['feat/dcscore-stadium-neon-assets']
    paths: ['config/dcscore_stadium_png_import.trigger']

permissions:
  contents: write

jobs:
  import-image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dcscore-stadium-neon-assets
      - name: Fetch the unmodified original uploaded stadium PNG
        run: |
          set -euo pipefail
          curl -fLsS --retry 2 --max-time 90 \
            'https://at.adobe.com/rmUkJgrKPWw8W8R4' \
            -o dixon-coles/assets/social_neon/stadium.png
          python - <<'PY'
          from pathlib import Path
          p=Path('dixon-coles/assets/social_neon/stadium.png')
          with p.open('rb') as f:
              if f.read(8) != bytes([137,80,78,71,13,10,26,10]):
                  raise SystemExit('Original source URL did not yield an actual PNG')
          if p.stat().st_size < 100_000:
              raise SystemExit('Unexpectedly small original PNG')
          print('ORIGINAL_STADIUM_PNG_IMPORTED',p.stat().st_size)
          PY
      - name: Commit original PNG directly to same feature branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dixon-coles/assets/social_neon/stadium.png
          git commit -m "assets: preserve original user-supplied neon stadium PNG"
          git push origin HEAD:feat/dcscore-stadium-neon-assets
