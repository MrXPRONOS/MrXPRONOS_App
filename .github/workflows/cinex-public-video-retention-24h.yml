name: CineX - Videos publiques 24h (retention controlee)

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Supprimer les vidéos publiques de plus de 24 h (sinon simulation)'
        type: boolean
        required: false
        default: false
  schedule:
    - cron: '23 * * * *'
  push:
    branches: [main, 'fix/cinex-24h-posting-and-buttons-20261123']
    paths:
      - '.github/workflows/cinex-public-video-retention-24h.yml'
      - 'telegram-film-relay/film_relay/public_video_retention.py'
      - 'telegram-film-relay/film_relay/publication.py'
      - 'telegram-film-relay/film_relay/bot_http.py'
      - 'telegram-film-relay/tests/test_public_video_retention.py'
      - 'telegram-film-relay/tests/test_publication.py'
      - 'telegram-film-relay/tests/test_bot_http.py'
      - 'telegram-film-relay/film_relay/runner.py'
      - 'telegram-film-relay/film_relay/category_runner.py'
      - 'telegram-film-relay/film_relay/desir_runner.py'
      - 'telegram-film-relay/film_relay/series_catalog.py'
      - 'telegram-film-relay/film_relay/rescue_channels.py'
      - 'telegram-film-relay/tests/test_rescue_channels.py'
      - 'telegram-film-relay/tests/test_category_relays.py'
      - 'telegram-film-relay/tests/test_desir.py'
      - 'telegram-film-relay/tests/test_series_catalog.py'
      - 'telegram-film-relay/tests/test_unified_download.py'

permissions:
  contents: read

concurrency:
  # Push only tests; it must not queue behind long-running Telegram sessions.
  # Scheduled/manual jobs still share the personal account's single lock.
  group: ${{ github.event_name == 'push' && 'cinex-video-retention-offline-ci' || 'mrx-telegram-personal-account' }}
  cancel-in-progress: false
  queue: max

jobs:
  retention:
    name: Scanner les films et retirer les vidéos expirées sans toucher aux archives
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: telegram-film-relay
    env:
      PYTHONPATH: .
      TG_API_ID: ${{ secrets.TG_API_ID }}
      TG_API_HASH: ${{ secrets.TG_API_HASH }}
      TG_STRING_SESSION: ${{ secrets.TG_SESSION_STRING || secrets.TG_STRING_SESSION || secrets.TG_STREAM_SESSION }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TG_PRIVATE_CHANNEL: ${{ vars.TG_PRIVATE_CHANNEL }}
      SERIES_PUBLIC_CHANNEL: ${{ vars.SERIES_PUBLIC_CHANNEL || '@seriesvf_cinex' }}
      SERIES_PRIVATE_CHANNEL: ${{ vars.SERIES_PRIVATE_CHANNEL }}
      DESIR_PUBLIC_CHANNEL: ${{ vars.DESIR_PUBLIC_CHANNEL || '@CineXDesirfr' }}
      DESIR_PRIVATE_CHANNEL: ${{ vars.DESIR_PRIVATE_CHANNEL }}
      COMEDIE_PUBLIC_CHANNEL: ${{ vars.COMEDIE_PUBLIC_CHANNEL }}
      COMEDIE_PRIVATE_CHANNEL: ${{ vars.COMEDIE_PRIVATE_CHANNEL }}
      ANIME_PUBLIC_CHANNEL: ${{ vars.ANIME_PUBLIC_CHANNEL || '@CineXAnimeFR' }}
      ANIME_PRIVATE_CHANNEL: ${{ vars.ANIME_PRIVATE_CHANNEL }}
      ACTION_PUBLIC_CHANNEL: ${{ vars.ACTION_PUBLIC_CHANNEL || '@filmsaction2026vf' }}
      ACTION_PRIVATE_CHANNEL: ${{ vars.ACTION_PRIVATE_CHANNEL }}
      CINEX_ARCHIVE_ENABLED: ${{ vars.CINEX_ARCHIVE_ENABLED }}
      CINEX_ARCHIVE_DELETE_APPROVED: ${{ vars.CINEX_ARCHIVE_DELETE_APPROVED }}
      CINEX_RIGHTS_VERIFIED: ${{ vars.CINEX_RIGHTS_VERIFIED }}
      CINEX_PUBLIC_RETENTION_24H_ENABLED: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' && inputs.apply) && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - name: Respecter toute restriction Telegram en cours
        if: ${{ github.event_name != 'push' }}
        env:
          TG_PERSONAL_COOLDOWN_UNTIL_UTC: ${{ vars.TG_PERSONAL_COOLDOWN_UNTIL_UTC }}
        run: python3 "$GITHUB_WORKSPACE/telegram-film-relay/scripts/check_personal_cooldown.py"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: telegram-film-relay/requirements.txt
      - name: Dépendances
        run: python -m pip install -r requirements.txt
      - name: Contrôler syntaxe et opérations sans réseau ni suppression
        run: |
          python -m compileall -q film_relay
          python -m unittest discover -s tests -p 'test_public_video_retention.py' -v
          python -m unittest discover -s tests -p 'test_bot_http.py' -v
          python -m unittest discover -s tests -p 'test_publication.py' -v
          python -m unittest discover -s tests -p 'test_rescue_channels.py' -v
          python -m unittest discover -s tests -p 'test_category_relays.py' -v
          python -m unittest discover -s tests -p 'test_desir.py' -v
          python -m unittest discover -s tests -p 'test_series_catalog.py' -v
          python -m unittest discover -s tests -p 'test_unified_download.py' -v
      - name: Exécuter le nettoyage uniquement sur horaire ou action explicite
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "$CINEX_PUBLIC_RETENTION_24H_ENABLED" = 'true' ]; then
            python -m film_relay.public_video_retention --apply --max-deleted 100
          else
            python -m film_relay.public_video_retention --max-deleted 100
          fi
