name: Cinema Telegram - lot 3 (formats 11 a 15)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Destination Telegram'
        required: true
        default: test
        type: choice
        options: [test, production]
      format:
        description: 'Format cinéma'
        required: true
        default: all
        type: choice
        options: [all, duel, anecdote, boxoffice, bandeannonce, weekend]
      demo:
        description: 'Données fictives, sans aucune image ni vidéo inventée'
        type: boolean
        default: true
      dry_run:
        description: 'Aperçu seulement, aucun envoi Telegram'
        type: boolean
        default: true
  push:
    branches: [feat/cinema-telegram-batch3]
    paths:
      - 'scripts/cinema_batch3.py'
      - 'tests/test_cinema_batch3.py'
      - '.github/workflows/cinema-telegram-batch3.yml'
  schedule:
    - cron: '27 20 * * *'  # 20:27 UTC / Lomé, chaque jour

permissions:
  contents: write

concurrency:
  group: cinema-telegram-batch3-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install requests (open source)
        run: python -m pip install requests
      - name: Unit tests batch 3 - no network
        run: python -m unittest discover -s tests -p 'test_cinema_batch3.py' -v
      - name: Dry preview on pushes - no Telegram
        if: github.event_name == 'push'
        run: python scripts/cinema_batch3.py --mode test --format all --demo --dry-run
      - name: One-time real TMDB image test in @predict_mrxp only
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[cinema-live-test]') && github.ref == 'refs/heads/feat/cinema-telegram-batch3'
        env:
          CINEMA_TELEGRAM_BOT_TOKEN: ${{ secrets.CINEMA_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_SECONDARY: ${{ secrets.TELEGRAM_CHAT_ID_SECONDARY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python scripts/cinema_batch3.py --mode test --format all
      - name: Manual or protected production publication
        if: github.event_name != 'push'
        env:
          CINEMA_TELEGRAM_BOT_TOKEN: ${{ secrets.CINEMA_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_SECONDARY: ${{ secrets.TELEGRAM_CHAT_ID_SECONDARY }}
          CINEMA_PRODUCTION_CHAT_ID: ${{ secrets.CINEMA_PRODUCTION_CHAT_ID }}
          CINEMA_PRODUCTION_ENABLED: ${{ vars.CINEMA_PRODUCTION_ENABLED }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_FORMAT: ${{ inputs.format }}
          INPUT_DEMO: ${{ inputs.demo }}
          INPUT_DRY: ${{ inputs.dry_run }}
        shell: bash
        run: |
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            if [[ "$CINEMA_PRODUCTION_ENABLED" != "true" ]]; then
              echo 'Production not enabled: schedule skipped safely'
              exit 0
            fi
            case "$(date -u +%u)" in
              1) SELECTED=duel ;;
              2) SELECTED=anecdote ;;
              3) SELECTED=boxoffice ;;
              4) SELECTED=bandeannonce ;;
              5) SELECTED=weekend ;;
              6) SELECTED=weekend ;;
              7) SELECTED=duel ;;
              *) echo 'No matching day'; exit 0 ;;
            esac
            python scripts/cinema_batch3.py --mode production --format "$SELECTED"
          else
            ARGS=(--mode "$INPUT_MODE" --format "$INPUT_FORMAT")
            [[ "$INPUT_DEMO" == "true" ]] && ARGS+=(--demo)
            [[ "$INPUT_DRY" == "true" ]] && ARGS+=(--dry-run)
            python scripts/cinema_batch3.py "${ARGS[@]}"
          fi
      - name: Persist state even after partial Telegram success
        if: always() && (github.event_name != 'push' || contains(github.event.head_commit.message, '[cinema-live-test]'))
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [[ -f cinema/sent_test_batch3.json ]]; then git add cinema/sent_test_batch3.json; fi
          if [[ -f cinema/sent_production_batch3.json ]]; then git add cinema/sent_production_batch3.json; fi
          if git diff --staged --quiet; then exit 0; fi
          git commit -m 'cinema batch3: save Telegram publication history [skip ci]'
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"