name: Import mobile premium icons
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-mobile-premium-icons.yml'
permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download generated mobile icon pack
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 "https://at.adobe.com/DjZF8B9NJ6zOMEmt" -o /tmp/mobile-premium.zip
          rm -rf /tmp/mobile-premium-unpack
          mkdir -p /tmp/mobile-premium-unpack assets/images/mobile-premium
          unzip -q /tmp/mobile-premium.zip -d /tmp/mobile-premium-unpack
          cp /tmp/mobile-premium-unpack/mobile-premium/*.webp assets/images/mobile-premium/
          test "$(find assets/images/mobile-premium -maxdepth 1 -name '*.webp' | wc -l)" -eq 10
      - name: Commit generated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/mobile-premium
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "assets(mobile): add generated premium navigation icons"
          git fetch origin main
          git rebase origin/main
          git push
