name: BSD V3 - BTTS quality experiment Oct 2026

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/bsd-v3-btts-quality-oct2026.yml'
      - 'bsd_v3/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bsd-v3-btts-quality-oct2026
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      PYTHONPATH: bsd
      BSD_HISTORY_KEY: ${{ secrets.BSD_HISTORY_KEY }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install free dependencies
        run: python -m pip install requests cryptography pillow 'lightgbm>=4.4,<5' scikit-learn
      - name: BTTS implementation tests
        run: |
          python -m compileall -q bsd bsd_v3
          python -m unittest discover -s bsd -p 'test_bsd_v2_btts.py' -v
          python -m unittest discover -s bsd -p 'test_bsd_v2_btts_four.py' -v
          python -m unittest discover -s bsd -p 'test_bsd_v2_btts_h2h.py' -v
      - name: Restore encrypted private history
        run: python bsd/bsd_archive.py restore
      - name: Run strict BTTS specialist audit on October 2026
        run: |
          python bsd/bsd_v2_btts_backtest.py \
            --max-test 30000 \
            --start-date 2026-10-01 \
            --end-date 2026-10-31 \
            --output bsd_v3/artifacts/btts_specialist_oct2026.json
      - name: Summarize specialist effect
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("bsd_v3/artifacts")
          d=json.loads((p/"btts_specialist_oct2026.json").read_text())
          t=d["test"]
          out={
            "period":"2026-10-01..2026-10-31",
            "population_finished":t["population_finished"],
            "eligible":t["eligible"],
            "classification_accuracy":t["classification_accuracy"],
            "pre_h2h":t["pre_last_h2h_selection"],
            "thresholds":t["by_minimum_confidence"],
            "specialized_yes":t["specialized_calibrated"].get("BTTS_YES"),
            "baseline_yes":t["baseline_calibrated"].get("BTTS_YES"),
            "poisson_yes":t["poisson_dixon_coles_baseline"].get("BTTS_YES"),
            "four_models":t["four_model_shadow"],
            "zero_model":t["zero_model_shadow"],
            "skips":t["skips"],
            "ensemble_weights":t["four_ensemble_weights"],
          }
          (p/"btts_specialist_oct2026_summary.json").write_text(
              json.dumps(out,indent=2),encoding="utf-8")
          print("BSD_V3_BTTS_SPECIALIST_OCT2026",json.dumps(out))
          PY
      - name: Chronological BTTS side-scoring filter experiment
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from bsd_archive import _read_json
          from bsd_v3.btts_filter_experiment import experiment
          history=_read_json(Path("bsd/all_matches_bsd.json"),None)
          report=experiment(history)
          Path("bsd_v3/artifacts/btts_filter_experiment.json").write_text(
              json.dumps(report,indent=2),encoding="utf-8")
          print("BSD_V3_BTTS_FILTER_EXPERIMENT",json.dumps({
              "chosen":report["chosen_on_train"],
              "accepted":report["accepted_on_validation"],
              "active":report["active_policy"],
              "october_base":report["october_base"],
              "october_filtered":report["october_filtered"],
              "delta":report["october_quality_delta"],
              "coverage_pct":report["coverage_october_pct"],
          }))
          PY
      - name: Remove decrypted history
        if: always()
        run: rm -f bsd/all_matches_bsd.json bsd/backfill_state.json
      - name: Upload BTTS experiment reports
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bsd-v3-btts-oct2026-${{ github.run_id }}
          path: |
            bsd_v3/artifacts/btts_specialist_oct2026.json
            bsd_v3/artifacts/btts_specialist_oct2026_summary.json
            bsd_v3/artifacts/btts_filter_experiment.json
          retention-days: 30
          if-no-files-found: error
