name: BSD V3 - 2026 YTD policy backtest

on:
  pull_request:
    branches: [main]
    paths:
      - 'bsd_v3/ytd_backtest.py'
      - '.github/workflows/bsd-v3-2026-ytd-backtest.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bsd-v3-2026-ytd-backtest
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: bsd
      BSD_HISTORY_KEY: ${{ secrets.BSD_HISTORY_KEY }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install free dependencies
        run: python -m pip install requests cryptography pillow
      - name: Verify V3 offline tests
        run: |
          python -m compileall -q bsd bsd_v3
          python -m unittest discover -s bsd_v3 -p 'test_*.py' -v
      - name: Restore encrypted private BSD history
        run: python bsd/bsd_archive.py restore
      - name: Run exact 2026 YTD backtest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from bsd_archive import _read_json
          from bsd_v3.ytd_backtest import year_to_date_backtest
          history=_read_json(Path("bsd/all_matches_bsd.json"),None)
          report=year_to_date_backtest(history,year=2026,end_date="2026-11-07")
          Path("bsd_v3/artifacts").mkdir(parents=True,exist_ok=True)
          Path("bsd_v3/artifacts/ytd_2026_backtest.json").write_text(
              json.dumps(report,indent=2),encoding="utf-8")
          compact={
              "period":report["period"],
              "fixtures":report["fixtures_in_archive"],
              "counts":report["counts"],
              "primary":report["primary_picks"],
              "over25":report["over25_priority_shadow"],
              "primary_by_market":report["primary_by_market"],
              "by_month":report["by_month"],
          }
          print("BSD_V3_2026_YTD",json.dumps(compact))
          PY
      - name: Remove decrypted history
        if: always()
        run: rm -f bsd/all_matches_bsd.json bsd/backfill_state.json
      - name: Upload aggregate report only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bsd-v3-ytd-2026-${{ github.run_id }}
          path: bsd_v3/artifacts/ytd_2026_backtest.json
          retention-days: 90
          if-no-files-found: error
