name: Research 2026 Hybrid V3 no-1-1 full chronological backtest
on:
  push:
    branches: [research/hybrid-v3-no-11-20261103]
    paths:
      - '.github/workflows/research-hybrid-v3-no11-2026.yml'
      - 'research/single_ml_v2.py'
      - 'research/backtest_hybrid_v3_no11_2026.py'
      - 'research/test_hybrid_v3_no11_2026.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: research-hybrid-v3-no11-2026
  cancel-in-progress: false
jobs:
  compare-2026:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      ML_V2_HISTORY_KEY_B64: ${{ secrets.ML_V2_HISTORY_KEY_B64 }}
      SPORTDATA_API_KEY_1: ${{ secrets.SPORTDATA_API_KEY_1 }}
      SPORTDATA_API_KEY_2: ${{ secrets.SPORTDATA_API_KEY_2 }}
      SPORTDATA_API_KEY_3: ${{ secrets.SPORTDATA_API_KEY_3 }}
      SPORTDATA_API_KEY_4: ${{ secrets.SPORTDATA_API_KEY_4 }}
      SPORTDATA_API_KEY_5: ${{ secrets.SPORTDATA_API_KEY_5 }}
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: model/research:model:site/scripts
    steps:
      - name: Checkout archived daily history and read-only site utilities
        uses: actions/checkout@v4
        with:
          ref: main
          path: site
          persist-credentials: false
      - name: Checkout independent research experiment ONLY
        uses: actions/checkout@v4
        with:
          ref: research/hybrid-v3-no-11-20261103
          path: model
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native V3 prerequisites (no irrelevant learners)
        run: python -m pip install --disable-pip-version-check numpy scipy scikit-learn cryptography requests
      - name: Verify syntax and definitions before accessing any historical data
        run: |
          python -m py_compile model/research/single_ml_v2.py model/research/backtest_hybrid_v3_no11_2026.py model/research/test_hybrid_v3_no11_2026.py
          python -m unittest discover -s model/research -p 'test_hybrid_v3_no11_2026.py' -v
          test -n "$ML_V2_HISTORY_KEY_B64"
      - name: Run authentic 2026 Jan 1 to Nov 2 chronological V3 no-1-1 comparison
        run: |
          mkdir -p /tmp/mrx-v3-no11
          python model/research/backtest_hybrid_v3_no11_2026.py \
            --site-root site --model-root model \
            --end 2026-11-02 \
            --out /tmp/mrx-v3-no11/aggregate-2026-01-01-to-2026-11-02.json
      - name: Assert all three scenarios use identical 2026 match cohort
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/mrx-v3-no11/aggregate-2026-01-01-to-2026-11-02.json')
          d=json.loads(p.read_text(encoding='utf8'))
          a=d['baseline']; b=d['scenario_1_remove_entire_1_1_modal_matches']
          c=d['scenario_2_replace_modal_1_1_with_best_other_score']
          assert d['evaluation_start']=='2026-01-01'
          assert d['evaluation_end']=='2026-11-02'
          assert a['predictions']>1000
          assert b['predictions']+b['excluded']==a['predictions']
          assert c['predictions']==a['predictions']
          assert c['replaced']==b['excluded']
          assert d['diagnostics']['modal_1_1_predictions']==b['excluded']
          assert a['hits']>=0 and b['hits']>=0 and c['hits']>=0
          assert set(d['monthly'])==set(f'2026-{m:02d}' for m in range(1,12))
          print('NATIVE_V3_NO11_2026_COMPARISON_VERIFIED', a['predictions'], a['hits'], b['hits'], c['hits'])
          PY
      - name: Publish aggregated research result as private Actions artifact only
        uses: actions/upload-artifact@v4
        with:
          name: hybrid-v3-no11-2026-aggregates-${{ github.run_id }}
          path: /tmp/mrx-v3-no11/aggregate-2026-01-01-to-2026-11-02.json
          retention-days: 30
          if-no-files-found: error
