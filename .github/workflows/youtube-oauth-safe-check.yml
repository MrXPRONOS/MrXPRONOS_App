name: YouTube OAuth - Safe Credential Check

on:
  schedule:
    # 07:17 UTC = 07:17 in Togo; checks validity without uploading anything.
    - cron: '17 7 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config/youtube_oauth_safe_check_trigger.txt"

permissions:
  contents: read

jobs:
  verify-youtube:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install minimal OAuth dependencies
        run: python -m pip install google-auth requests

      - name: Refresh and check YouTube upload scope without publishing
        shell: bash
        run: |
          python - <<'PY'
          import os
          import sys
          import requests
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request

          names = ("YOUTUBE_CLIENT_ID", "YOUTUBE_CLIENT_SECRET", "YOUTUBE_REFRESH_TOKEN")
          if any(not os.environ.get(name, "").strip() for name in names):
              print("YOUTUBE_OAUTH_MISSING_SECRET")
              sys.exit(1)

          creds = Credentials(
              token=None,
              refresh_token=os.environ["YOUTUBE_REFRESH_TOKEN"],
              token_uri="https://oauth2.googleapis.com/token",
              client_id=os.environ["YOUTUBE_CLIENT_ID"],
              client_secret=os.environ["YOUTUBE_CLIENT_SECRET"],
              scopes=["https://www.googleapis.com/auth/youtube.upload"],
          )
          try:
              creds.refresh(Request())
          except Exception as exc:
              print("YOUTUBE_OAUTH_REFRESH_FAILED:", type(exc).__name__)
              sys.exit(1)

          if not creds.valid or not creds.token:
              print("YOUTUBE_OAUTH_INVALID_ACCESS_TOKEN")
              sys.exit(1)

          try:
              response = requests.get(
                  "https://oauth2.googleapis.com/tokeninfo",
                  params={"access_token": creds.token},
                  timeout=20,
              )
              response.raise_for_status()
              info = response.json()
              scopes = set(str(info.get("scope") or "").split())
              if "https://www.googleapis.com/auth/youtube.upload" not in scopes:
                  print("YOUTUBE_OAUTH_MISSING_UPLOAD_PERMISSION")
                  sys.exit(1)
              if info.get("aud") != os.environ["YOUTUBE_CLIENT_ID"]:
                  print("YOUTUBE_OAUTH_CLIENT_MISMATCH")
                  sys.exit(1)
          except requests.RequestException as exc:
              print("YOUTUBE_OAUTH_TOKENINFO_FAILED:", type(exc).__name__)
              sys.exit(1)

          print("YOUTUBE_OAUTH_OK: token refreshed and upload scope confirmed.")
          print("NO_VIDEO_UPLOADED")
          PY
