name: Formation - Contrôle de la réserve privée unique (sans publication)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/formation-shared-private-readiness.yml'
      - 'cinecanaux/formation-shared-readiness.mjs'
      - 'cinecanaux/formation-private-classifier.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: formation-shared-private-readiness
  cancel-in-progress: false
jobs:
  verify-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: '9c86118191b804d91b5f5b2c89114999'
      CINERADAR_D1_DATABASE_ID: 'fa8b5009-bc1a-4a6e-b143-7a487c7297a5'
      CINE_RADAR_BOT_TOKEN: ${{ secrets.CINE_RADAR_BOT_TOKEN || secrets.CINEX_RADAR_BOT_TOKEN }}
      FORMATION_BOT_TOKEN: ${{ secrets.FORMATION_BOT_TOKEN || secrets.FOOTBALL_NEWS_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
      FORMATION_STAGE_CHAT: ${{ secrets.FORMATION_STAGE_CHAT }}
      FORMATION_DESTINATIONS_JSON: ${{ secrets.FORMATION_DESTINATIONS_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tests hors ligne sans Telegram
        run: |
          node --check cinecanaux/formation-shared-readiness.mjs
          node --test cinecanaux/tests/formation-shared-readiness.test.mjs
          node --test cinecanaux/tests/formation-shared-inbox.test.mjs
      - name: Vérifier la réserve privée et ses cinq vraies destinations Telegram
        run: node cinecanaux/formation-shared-readiness.mjs
