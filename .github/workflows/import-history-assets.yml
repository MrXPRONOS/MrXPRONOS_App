name: Import history premium assets
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-history-assets.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install WebP tools
        run: sudo apt-get update -y && sudo apt-get install -y webp
      - name: Download and optimize generated assets
        run: |
          set -euxo pipefail
          mkdir -p assets/images/history-premium /tmp/history-assets
          curl -L --fail --retry 3 "https://at.adobe.com/le1B1CvftsCT1lx2" -o /tmp/history-assets/published.png
          curl -L --fail --retry 3 "https://at.adobe.com/NxUGiTa9cTzHCv5r" -o /tmp/history-assets/wins.png
          curl -L --fail --retry 3 "https://at.adobe.com/KZlfXeVCbA9Okhbm" -o /tmp/history-assets/rate.png
          curl -L --fail --retry 3 "https://at.adobe.com/PBHyhIrUbQFBly3O" -o /tmp/history-assets/stadium.png
          cwebp -quiet -q 82 -resize 512 512 /tmp/history-assets/published.png -o assets/images/history-premium/icon-history-published.webp
          cwebp -quiet -q 82 -resize 512 512 /tmp/history-assets/wins.png -o assets/images/history-premium/icon-history-wins.webp
          cwebp -quiet -q 82 -resize 512 512 /tmp/history-assets/rate.png -o assets/images/history-premium/icon-history-rate.webp
          cwebp -quiet -q 80 -resize 1600 0 /tmp/history-assets/stadium.png -o assets/images/history-premium/hero-history-stadium.webp
      - name: Commit assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/history-premium
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "assets(history): add generated premium history visuals"
          git push
