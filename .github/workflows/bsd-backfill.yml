name: BSD - Archive historique 2024-2026
run-name: "BSD - Archive historique 2024-2026 (${{ inputs.trigger_source || github.event_name }})"

on:
  # Planification GitHub provisoire jusqu'à validation des tâches cron-job.org.
  schedule:
    - cron: '35 1 * * *' # chaque jour a 01:35 UTC
  workflow_dispatch:
    inputs:
      trigger_source:
        description: "Origine cron-job.org ou manuel"
        required: false
        default: "manual"
        type: string
      budget:
        description: "Maximum d appels BSD pour ce lancement (1-500)"
        required: false
        default: "90"
      season_pages:
        description: "Pages max par saison (1-100)"
        required: false
        default: "10"

permissions:
  contents: write

concurrency:
  group: bsd-history-backfill
  cancel-in-progress: false

jobs:
  bsd-history:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Journaliser la source
        env:
          TRIGGER_SOURCE: ${{ inputs.trigger_source || github.event_name }}
        run: |
          echo "Déclenchement : ${TRIGGER_SOURCE}"
          echo "Début UTC : $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: python -m pip install requests cryptography pillow
      - name: Tests de regression BSD
        run: python -m unittest discover -s bsd -p 'test_*.py' -v
      - name: Restore encrypted JSON
        env:
          BSD_HISTORY_KEY: "${{ secrets.BSD_HISTORY_KEY }}"
        run: |
          if [ -z "$BSD_HISTORY_KEY" ]; then
            echo "::error::BSD_HISTORY_KEY manquant; ajouter la cle Fernet dans Actions Secrets"
            exit 1
          fi
          python bsd/bsd_archive.py restore
      - name: Backfill incremental
        env:
          BSD_API_KEY: "${{ secrets.BSD_API_KEY }}"
          BUDGET: "${{ github.event.inputs.budget }}"
          SEASON_PAGES: "${{ github.event.inputs.season_pages }}"
        run: |
          if [ -z "$BSD_API_KEY" ]; then
            echo "::error::BSD_API_KEY manquant"
            exit 1
          fi
          python bsd/bsd_backfill_2024_2026.py --budget "${BUDGET:-90}" --season-pages "${SEASON_PAGES:-10}"
      - name: Refresh last seven days of finished BSD matches
        env:
          BSD_API_KEY: "${{ secrets.BSD_API_KEY }}"
        run: python bsd/bsd_refresh_daily.py --days 7 --max-pages 5 --max-requests 45
      - name: Enforce historical match dates 2024-2026
        run: python bsd/bsd_archive_window.py
      - name: Audit historique BSD et H2H (hors ligne)
        run: python bsd/bsd_quality_audit.py --samples 12
      - name: Seal private archive
        env:
          BSD_HISTORY_KEY: "${{ secrets.BSD_HISTORY_KEY }}"
        run: python bsd/bsd_archive.py seal
      - name: Commit encrypted archive only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bsd/all_matches_bsd.enc.json
          if git diff --cached --quiet; then
            echo "No encrypted archive changes"
            exit 0
          fi
          git commit -m "data(bsd): refresh encrypted 2024-2026 historical JSON [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
