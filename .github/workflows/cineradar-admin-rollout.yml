        run: python telegram-film-relay/scripts/check_personal_cooldown.py
      - name: Install pinned Telegram and encrypted GitHub Vault dependencies
        run: python -m pip install 'telethon==1.45.0' 'cryptography>=43,<47' requests
      - name: Gradually grant channel admin privileges except add_admins and enable reactions
        run: |
          python -m scripts.cineradar_admin_rollout \
            --apply --max-changes 6 --max-channels 2 --pause 15
