name: CineRadar - reconcile all verified channel admins and enable emoji reactions

on:
  schedule:
    - cron: '31 * * * *'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Promote verified GitHub bots; enable heart/thumbs reactions, with no add-admins right'
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/cineradar-admin-rollout.yml'
  pull_request:
    paths:
      - '.github/workflows/cineradar-admin-rollout.yml'
      - 'scripts/cineradar_admin_rollout.py'
      - 'tests/test_cineradar_admin_rollout.py'

permissions:
  contents: write

concurrency:
  group: mrx-telegram-personal-account
  cancel-in-progress: false

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Telegram and GitHub vault dependencies
        run: python -m pip install 'telethon==1.45.0' 'cryptography>=43,<47' requests
      - name: Verify admin rights safeguards, channel exclusions, and anti-duplicate identities
        run: |
          python -m py_compile scripts/cineradar_admin_rollout.py
          python -m unittest discover -s tests -p 'test_cineradar_admin_rollout.py' -v

  reconcile:
    needs: offline-tests
    if: ${{ github.repository == 'MrXPRONOS/MrXPRONOS_App' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.apply)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      TG_API_ID: ${{ secrets.TG_API_ID }}
      TG_API_HASH: ${{ secrets.TG_API_HASH }}
      TG_STRING_SESSION: ${{ secrets.TG_SESSION_STRING || secrets.TG_STRING_SESSION || secrets.TG_STREAM_SESSION }}
      CINEX_RADAR_BOT_TOKEN: ${{ secrets.CINEX_RADAR_BOT_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      CINEX_PUBLISH_BOT_TOKEN: ${{ secrets.CINEX_PUBLISH_BOT_TOKEN }}
      CINEX_PUBLISH_BOT_USERNAME: ${{ vars.CINEX_PUBLISH_BOT_USERNAME }}
      CINEX_BOT_TOKEN: ${{ secrets.CINEX_BOT_TOKEN }}
      FOOTBALL_NEWS_BOT_TOKEN: ${{ secrets.FOOTBALL_NEWS_BOT_TOKEN }}
      SERIES_BOT_TOKEN: ${{ secrets.SERIES_BOT_TOKEN }}
      ANIME_BOT_TOKEN: ${{ secrets.ANIME_BOT_TOKEN }}
