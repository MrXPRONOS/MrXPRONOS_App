name: Install 30 bonus images

on:
  push:
    branches:
      - chatgpt/add-30-bonus-images
    paths:
      - .github/workflows/install_bonus_images.yml

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/add-30-bonus-images

      - name: Download prepared bonus assets
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            "https://at.adobe.com/zEZZkRtWtTCsCT2W" \
            -o /tmp/mrxpronos_30_bonus_images.zip
          unzip -o /tmp/mrxpronos_30_bonus_images.zip -d .

      - name: Connect each promotion to its image
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("bonus.json")
          data = json.loads(path.read_text(encoding="utf-8"))

          mapping = {
              ("1xBet", "Bonus premier dépôt"): "1xbet-bonus-premier-depot-100.webp",
              ("1xBet", "Hyper Bonus"): "1xbet-hyper-bonus-250.webp",
              ("1xBet", "Lucky Friday"): "1xbet-lucky-friday.webp",
              ("1xBet", "Crypto Freebet"): "1xbet-crypto-freebet.webp",
              ("1xBet", "Pari sans risque"): "1xbet-pari-sans-risque.webp",

              ("1win", "Bonus nouveaux joueurs"): "1win-bienvenue.webp",
              ("1win", "Bonus de recharge"): "1win-bonus-recharge.webp",
              ("1win", "Bonus jeux / casino"): "1win-bonus-casino.webp",
              ("1win", "Récompenses fidélité"): "1win-recompenses-fidelite.webp",
              ("1win", "Promotions événementielles"): "1win-promotions-evenementielles.webp",

              ("Betwinner", "Premier dépôt"): "betwinner-bienvenue.webp",
              ("Betwinner", "Sports Cashback"): "betwinner-sports-cashback.webp",
              ("Betwinner", "Bonus dépôt du jeudi"): "betwinner-bonus-jeudi.webp",
              ("Betwinner", "Série de paris perdants"): "betwinner-serie-perdants.webp",
              ("Betwinner", "Bonus TOTO"): "betwinner-bonus-toto.webp",

              ("Melbet", "Bonus premier dépôt sport"): "melbet-bonus-premier-depot-sport.webp",
              ("Melbet", "Pack de bienvenue casino"): "melbet-pack-bienvenue-casino.webp",
              ("Melbet", "Cashback hebdo dans l’app"): "melbet-cashback-app.webp",
              ("Melbet", "Cashback Rewards"): "melbet-cashback-rewards.webp",
              ("Melbet", "TOTO / points bonus"): "melbet-toto-points-bonus.webp",

              ("Linebet", "Premier dépôt sport"): "linebet-bonus-premier-depot-sport.webp",
              ("Linebet", "Pack bienvenue Casino + Games"): "linebet-pack-casino-games.webp",
              ("Linebet", "Bonus de dépôt récurrent"): "linebet-bonus-depot-recurrent.webp",
              ("Linebet", "Paris gratuits / offres sport"): "linebet-paris-gratuits-offres-sport.webp",
              ("Linebet", "Récompenses / promo codes"): "linebet-recompenses-promo-codes.webp",

              ("Betclic", "Offre de bienvenue"): "betclic-offre-bienvenue-100e.webp",
              ("Betclic", "Cotes boostées"): "betclic-cotes-boostees.webp",
              ("Betclic", "Freebets événementiels"): "betclic-freebets-evenementiels.webp",
              ("Betclic", "Challenges / missions"): "betclic-challenges-missions.webp",
              ("Betclic", "Parrainage"): "betclic-parrainage.webp",
          }

          seen = set()
          for item in data:
              key = (item.get("bookmaker"), item.get("title"))
              if key not in mapping:
                  raise SystemExit(f"Offre sans image associée: {key}")
              item["image"] = f"assets/images/bonus/{mapping[key]}"
              seen.add(key)

          missing = set(mapping) - seen
          if missing:
              raise SystemExit(f"Images sans offre associée: {sorted(missing)}")

          if len(data) != 30 or len(seen) != 30:
              raise SystemExit(f"Validation échouée: {len(data)} offres, {len(seen)} associations")

          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print("30 offres associées à 30 images.")
          PY

      - name: Validate assets
        run: |
          set -euo pipefail
          test "$(find assets/images/bonus -maxdepth 1 -type f -name '*.webp' | wc -l)" -eq 30
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("bonus.json").read_text(encoding="utf-8"))
          missing=[x["image"] for x in data if not Path(x["image"]).is_file()]
          assert len(data)==30, len(data)
          assert not missing, missing
          print("Validation OK: 30/30 images présentes.")
          PY

      - name: Commit generated integration
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/install_bonus_images.yml
          git add -A
          git commit -m "feat: add 30 promotion visuals to bonus page"
          git push origin HEAD:chatgpt/add-30-bonus-images
