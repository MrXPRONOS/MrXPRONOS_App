name: BangBet DOM recon
on:
  push:
    branches: [diagnostic/bookmaker-odds]
    paths:
      - "tools/odds_diagnostic/bangbet_dom_recon.py"
      - ".github/workflows/bangbet-dom-recon.yml"
  pull_request:
    branches: [main]
    paths:
      - "tools/odds_diagnostic/bangbet_dom_recon.py"
      - ".github/workflows/bangbet-dom-recon.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Inspect BangBet DOM
        run: python tools/odds_diagnostic/bangbet_dom_recon.py
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bangbet-dom-recon
          path: odds_diagnostic_results/bangbet_dom_recon.json
          if-no-files-found: warn
