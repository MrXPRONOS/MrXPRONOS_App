name: Dixon-Coles - backtest octobre 2026 Premier League

on:
  push:
    paths:
      - 'dixon-coles/scripts/backtest_october_2026.py'
      - 'dixon-coles/examples/pl_2026_10_results.csv'
      - '.github/workflows/dixon-coles-october-2026-backtest.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  october-2026:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dixon-coles
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            dixon-coles
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les dépendances du moteur
        run: python -m pip install -e '.[test]'
      - name: Exécuter un backtest rétrospectif d'octobre 2026
        run: |
          python scripts/backtest_october_2026.py \
            --db "${RUNNER_TEMP}/dc-october-2026.sqlite" \
            --csv examples/pl_2026_10_results.csv \
            --xi 0.0065 \
            --output results/backtest_october_2026.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dixon-coles-october-2026-report
          path: dixon-coles/results/backtest_october_2026.json
          if-no-files-found: warn
          retention-days: 90
