name: Cine Radar - Deploy production after green CI
# Deployment refresh for the verified Cine Radar public-source fallback (#435).
# Redeploy 2026-11-19: publish verified read-only trends endpoint and owner-curation integration (#446).
# A workflow-file change must NEVER deploy a Worker without a green CI run.
# cine-radar-v2-ci.yml explicitly tests changes to this file on main.
on:
  workflow_run:
    workflows: ['Cine Radar - Minimal directory CI']
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: cine-radar-worker-production
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact CI-tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Setup Node.js 22 for Wrangler 4
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy Worker with Wrangler 4 (supports wrangler.jsonc)
        shell: bash
        working-directory: cinecanaux
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '9c86118191b804d91b5f5b2c89114999'
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::Cloudflare token unavailable'; exit 1; }
          npx --yes wrangler@4 deploy --config wrangler.jsonc
      - name: Resolve existing Canal bot identity and configure reaction token
        shell: bash
        working-directory: cinecanaux
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '9c86118191b804d91b5f5b2c89114999'
          MRXPRONOS_CANAL_BOT_TOKEN: ${{ secrets.MRXPRONOS_CANAL_BOT_TOKEN }}
          PARTNERSHIP_BOT_TOKEN: ${{ secrets.PARTNERSHIP_BOT_TOKEN }}
          CINE_RADAR_BOT_TOKEN: ${{ secrets.CINE_RADAR_BOT_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          FOOTBALL_NEWS_BOT_TOKEN: ${{ secrets.FOOTBALL_NEWS_BOT_TOKEN }}
          EDITORIAL_TELEGRAM_BOT_TOKEN: ${{ secrets.EDITORIAL_TELEGRAM_BOT_TOKEN }}
          CINEX_BOT_TOKEN: ${{ secrets.CINEX_BOT_TOKEN }}
        run: |
          set -euo pipefail
          SECRET_FILE="$(mktemp)"
          chmod 600 "$SECRET_FILE"
          export SECRET_FILE
          trap 'rm -f "$SECRET_FILE"' EXIT
          python3 - <<'PY'
          import json
          import os
          from urllib.request import urlopen
          from urllib.error import URLError
          candidates = (
              "MRXPRONOS_CANAL_BOT_TOKEN",
              "PARTNERSHIP_BOT_TOKEN",
              "CINE_RADAR_BOT_TOKEN",
              "TELEGRAM_BOT_TOKEN",
              "FOOTBALL_NEWS_BOT_TOKEN",
              "EDITORIAL_TELEGRAM_BOT_TOKEN",
              "CINEX_BOT_TOKEN",
          )
          target = "mrxpronos_canal_bot"
          seen = set()
          for name in candidates:
              token = os.environ.get(name, "").strip()
              if not token or token in seen:
                  continue
              seen.add(token)
              try:
                  with urlopen("https://api.telegram.org/bot" + token + "/getMe", timeout=10) as response:
                      result = json.load(response)
              except (OSError, ValueError, URLError):
                  continue
              if result.get("ok") and str(result.get("result", {}).get("username", "")).casefold() == target:
                  with open(os.environ["SECRET_FILE"], "w", encoding="utf-8") as out:
                      out.write(token)
                  break
          PY
          if [ -s "$SECRET_FILE" ]; then
            cat "$SECRET_FILE" | npx --yes wrangler@4 secret put CANAL_BOT_TOKEN --config wrangler.jsonc > /dev/null
            echo 'Verified @mrxpronos_canal_bot token installed in Cloudflare.'
          else
            echo '::warning::No existing GitHub Telegram token matches @mrxpronos_canal_bot; dual reactions remain inactive.'
          fi
      - name: Verify production health without sending Telegram
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 3 --retry-delay 2 --fail --silent --show-error --max-time 15 \
            https://cinecanaux-bot.cinecanaux-xpronos.workers.dev/health \
            -o /tmp/cine-radar-prod-health.json
          python -c 'import json; x=json.load(open("/tmp/cine-radar-prod-health.json")); assert x.get("service")=="cine-radar" and x.get("database") is True'
      - name: Confirm deployed owner dashboard exists and remains private
        shell: bash
        run: |
          set -euo pipefail
          URL="https://cinecanaux-bot.cinecanaux-xpronos.workers.dev"
          curl --retry 2 --fail --silent --show-error --max-time 15 "$URL/admin" -o /tmp/cineradar-prod-admin.html
          grep -q 'id="ad-view-dashboard"' /tmp/cineradar-prod-admin.html
          grep -q 'id="ad-ops-panel"' /tmp/cineradar-prod-admin.html
          grep -q 'id="broadcast-schedule-at"' /tmp/cineradar-prod-admin.html
          status=$(curl --silent --show-error --max-time 15 -o /dev/null -w '%{http_code}' "$URL/api/admin/operations")
          test "$status" = "403"
          echo "Admin production controls present; private operations endpoint denies anonymous access"

