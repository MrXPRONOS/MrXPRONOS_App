name: MRXP V51 Phases 4-5 - Production canary smoke
on:
  push:
    paths:
      - .github/workflows/mrxp-phase45-production-smoke.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify public Worker, social sharing and share-card layout release
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,time,urllib.request
          base="https://mrxpronos-play.cinecanaux-xpronos.workers.dev"
          def get(path):
              req=urllib.request.Request(base+path,headers={'User-Agent':'MRXP-V51-Phase45-Public-Smoke/1.0','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=25) as r:return r.status,r.read(),r.headers.get('content-type','')
          st,body,ct=get('/api/health')
          assert st==200 and 'json' in ct,(st,ct)
          health=json.loads(body)
          fields={k:health.get(k) for k in ('ok','bot_connected','telegram_token_valid','correct_bot','db_connected')}
          print('Health:',fields)
          assert all(fields.values()),'Telegram or D1 degraded'
          st,avatar,ct=get('/share/avatar/3')
          assert st==200 and avatar[:4]==b'RIFF' and avatar[8:12]==b'WEBP',(st,ct)
          print('Signed-avatar public asset:',len(avatar),'bytes, valid WebP')
          seen=0
          for i in range(70):
              st,body,_=get('/?mrxp-v51='+str(i)+'-'+str(time.time_ns()))
              html=body.decode('utf-8','replace')
              assert st==200 and 'TAPOTER POUR GAGNER' in html,(st,i)
              if 'id="mrxp-phase4-5-ui"' in html:
                  seen+=1
                  for marker in ('function mrxpShareBadgeArt(level)',
                                 'const W=1080,H=vertical?1920:1080',
                                 'mrxpCanvasBlob(canvas)','mrxp-camera-icon',
                                 'id="mrxp-friends-copy"',
                                 't.me/MrXpronosPlayBot','mrxp-legends-teaser',
                                 'mrxp-weekly-track','mrxp-credit-rules',
                                 'authFetch("/api/share/profile","POST",{hide_name:hide})',
                                 'mrxp-phase1-mobile-safety','mrxp-mobile-phase2-3'):
                      assert marker in html, 'Missing V51 feature '+marker
                  assert 'TABLEAU DE BORD' not in html,'Fake Friends dashboard survived'
                  assert '<img class="mrxp-ui-pictogram mrxp-profile-card-button"' not in html
                  assert 'const url=location.href' not in html,'Session URL sharing regression'
          print('V51 page responses:',seen,'of 70')
          assert seen>0,'Canary never returned V51'
          PY
