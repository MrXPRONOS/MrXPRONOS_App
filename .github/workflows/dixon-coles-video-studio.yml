name: Dixon-Coles - studio grille unique 10 scores

on:
  push:
    paths:
      - 'dixon-coles/dcscore/video_grid.py'
      - 'dixon-coles/tests/test_video_grid.py'
      - 'dixon-coles/video_examples/demo_real_club_logos_top10.json'
      - 'dixon-coles/VIDEO_GRILLE_UNIQUE.md'
      - '.github/workflows/dixon-coles-video-studio.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: dixon-coles
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: dixon-coles
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer studio et FFmpeg
        run: |
          python -m pip install -e '.[test,video]'
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y ffmpeg)
          command -v ffprobe
      - name: Tester la grille et les garde-fous
        run: python -m pytest -q tests/test_video_grid.py tests/test_video_renderer.py
      - name: Exporter 10 affiches sur une seule scène avec écussons des clubs
        run: |
          python -m dcscore.video_grid \
            --payload video_examples/demo_real_club_logos_top10.json \
            --output results/studio_demo/preview_grille_10_scores.mp4 \
            --preview --fullhd > results_summary.json
          ffprobe -v error -show_entries format=duration \
            -of default=nw=1 results/studio_demo/preview_grille_10_scores.mp4
          cat results_summary.json
      - name: Archiver la vidéo et le rapport
        uses: actions/upload-artifact@v4
        with:
          name: dixon-coles-video-grille-unique-${{ github.run_id }}
          path: |
            dixon-coles/results/studio_demo/preview_grille_10_scores.mp4
            dixon-coles/results_summary.json
          if-no-files-found: error
          retention-days: 30
