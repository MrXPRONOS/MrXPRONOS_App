name: Dixon-Coles - video studio MP4 demo

on:
  push:
    paths:
      - 'dixon-coles/dcscore/video_render.py'
      - 'dixon-coles/tests/test_video_renderer.py'
      - 'dixon-coles/video_examples/demo_payload.json'
      - 'dixon-coles/VIDEO_AUTOMATION.md'
      - '.github/workflows/dixon-coles-video-studio.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dixon-coles
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: dixon-coles
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer le studio et ffmpeg
        run: |
          python -m pip install -e '.[test,video]'
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y ffmpeg)
          command -v ffprobe
      - name: Vérifier les garde-fous et le rendu d'un MP4
        run: python -m pytest -q tests/test_video_renderer.py
      - name: Générer une démo 3 matchs 100% fictifs
        run: |
          python -m dcscore.video_render \
            --payload video_examples/demo_payload.json \
            --output results/studio_demo/preview_fictif.mp4 \
            --preview --allow-partial-preview
          ffprobe -v error -show_entries format=duration \
            -of default=nw=1 results/studio_demo/preview_fictif.mp4
      - name: Exporter l'aperçu vidéo
        uses: actions/upload-artifact@v4
        with:
          name: dixon-coles-video-studio-demo-${{ github.run_id }}
          path: dixon-coles/results/studio_demo/preview_fictif.mp4
          retention-days: 30
