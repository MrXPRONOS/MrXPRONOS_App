name: CineX Séries — publier les affiches dans le principal et le secours
on:
  push:
    branches: [main]
    paths:
      - cinecanaux/.cinex-series-showcase-preview-once
      - cinecanaux/.cinex-series-showcase-publish-once
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publier les affiches (en conservant les téléchargements incomplets désactivés)'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: cinex-series-poster-showcase-publication
  cancel-in-progress: false
jobs:
  publish-showcase:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CINEX_SERIES_CHANNEL_IDS: ${{ vars.CINEX_SERIES_CHANNEL_IDS }}
      CINEX_SERIES_FOLDER_URL: ${{ vars.CINEX_SERIES_FOLDER_URL }}
      CINEX_SERIES_RESCUE_INVITE_URL: ${{ secrets.CINEX_SERIES_RESCUE_INVITE_URL }}
      CINEX_SERIES_RIGHTS_ATTESTED: ${{ vars.CINEX_SERIES_RIGHTS_ATTESTED || 'false' }}
      CINEX_SHOWCASE_PUBLISH: ${{ (github.event_name == 'push' && contains(github.event.head_commit.message, '[CINEX-PUBLISH]')) && 'true' || (github.event_name == 'workflow_dispatch' && inputs.publish && 'true' || 'false') }}
      CINEX_PUBLISH_BOT_TOKEN: ${{ secrets.FOOTBALL_NEWS_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
      CINEX_RADAR_BOT_TOKEN: ${{ secrets.CINEX_RADAR_BOT_TOKEN }}
      ALT_TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      ALT_DESIR_BOT_TOKEN: ${{ secrets.DESIR_BOT_TOKEN }}
      ALT_ACTION_BOT_TOKEN: ${{ secrets.ACTION_BOT_TOKEN }}
      ALT_ANIME_BOT_TOKEN: ${{ secrets.ANIME_BOT_TOKEN }}
      ALT_SERIES_BOT_TOKEN: ${{ secrets.SERIES_BOT_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: '9c86118191b804d91b5f5b2c89114999'
      CINERADAR_D1_DATABASE_ID: 'fa8b5009-bc1a-4a6e-b143-7a487c7297a5'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les dépendances Bot API uniquement
        run: python -m pip install requests==2.32.5
      - name: Tests et compilation sans Telegram
        run: |
          python -m py_compile cinecanaux/scripts/publish_series_showcase_bot.py
          python -m unittest discover -s cinecanaux/tests -p 'test_series_showcase_publish.py' -v
      - name: Pré-vérifier et, si activé, publier dans les deux canaux
        run: python cinecanaux/scripts/publish_series_showcase_bot.py
      - name: Rapport et reçus de publication
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cinex-series-showcase-report
          path: cinex-series-showcase-publish-report.json
          if-no-files-found: warn
          retention-days: 14
