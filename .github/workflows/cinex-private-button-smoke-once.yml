name: CineX - Test bouton stock prive (validation des droits)
on:
  push:
    branches: [main]
    paths:
      - 'telegram-film-relay/.cinex-private-button-smoke-once'
      - 'telegram-film-relay/.cinex-private-button-smoke-second-once'
  workflow_dispatch:
    inputs:
      execute:
        description: 'Effectuer un test réel et supprimer le message'
        required: false
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: cinex-private-button-smoke-once
  cancel-in-progress: false
jobs:
  test-private-button:
    if: ${{ github.repository == 'MrXPRONOS/MrXPRONOS_App' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'requests==2.32.5'
      - name: Tester les protections du test privé, sans connexion
        run: python -m unittest discover -s tests -p test_cinex_private_button_smoke.py -v
      - name: Exécuter UNE fois le test réel dans le stock privé D1
        if: ${{ github.event_name == 'push' || inputs.execute == true }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          CINEX_RADAR_BOT_TOKEN: ${{ secrets.CINEX_RADAR_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          CINEX_PRIVATE_BUTTON_TEST_ONCE: '1'
        run: python scripts/cinex_private_button_smoke.py --execute
      - name: Simulation manuelle sans envoi
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.execute != true }}
        run: python scripts/cinex_private_button_smoke.py
