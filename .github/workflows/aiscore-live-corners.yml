name: AiScore live corners delayed load
on:
  push:
    branches: [diagnostic/bookmaker-odds]
    paths:
      - "tools/odds_diagnostic/aiscore_live_probe.py"
      - "tools/odds_diagnostic/test_aiscore_live_probe.py"
      - ".github/workflows/aiscore-live-corners.yml"
  pull_request:
    branches: [main]
    paths:
      - "tools/odds_diagnostic/aiscore_live_probe.py"
      - "tools/odds_diagnostic/test_aiscore_live_probe.py"
      - ".github/workflows/aiscore-live-corners.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run extraction unit tests
        run: python -m unittest discover -s tools/odds_diagnostic -p 'test_aiscore_live_probe.py' -v
      - name: Probe live listing and wait for AiScore corners
        run: python tools/odds_diagnostic/aiscore_live_probe.py
      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aiscore-live-corners-report
          path: odds_diagnostic_results/aiscore_live_report.json
          if-no-files-found: warn
