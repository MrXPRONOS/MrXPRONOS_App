name: Mr XPRONOS Play - import 5 approved rank avatars

on:
  push:
    branches:
      - feat/mrxp-play-african-rank-avatars-1-to-5-20261119
    paths:
      - '.github/workflows/mrxp-rank-avatars-import.yml'

permissions:
  contents: write

jobs:
  import-ranks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download exact approved artwork and validate source hashes
        shell: bash
        env:
          SOURCE_URL: https://at.adobe.com/02J1jHCSCLzKY8HO
          ZIP_SHA256: 352a203ce21f8787087b59ba40f47e9c46f19ea88d7dfa6b95cca68ce850b52d
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 180 --silent --show-error "$SOURCE_URL" --output /tmp/mrxp-avatar-transfer.png
          python -m pip install --quiet Pillow
          python - <<'PY'
          import os, hashlib, io, json, zipfile
          from pathlib import Path
          from PIL import Image
          image=Image.open("/tmp/mrxp-avatar-transfer.png").convert("RGB")
          raw=image.tobytes()
          assert raw[:9]==b"MRXP-AVT2", "Avatar transfer magic mismatch"
          count=int.from_bytes(raw[9:17],"big")
          assert 1000<count<16000000
          archive=raw[17:17+count]
          assert hashlib.sha256(archive).hexdigest()==os.environ["ZIP_SHA256"],"Exact archive hash mismatch"
          with zipfile.ZipFile(io.BytesIO(archive)) as z:
              assert z.testzip() is None
              names=set(z.namelist())
              names_should={f"mrxpronos-play/assets/07-rank-avatars/rank-{i:02}-{slug}.{ext}" for i,slug in [(1,"recrue"),(2,"eclaireur"),(3,"combattant"),(4,"sentinelle"),(5,"chevalier")] for ext in ("png","webp")}
              names_should.add("mrxpronos-play/avatars-manifest.json")
              assert names==names_should, "Unexpected or missing avatar files"
              manifest=json.loads(z.read("mrxpronos-play/avatars-manifest.json"))
              assert manifest["avatar_count"]==5
              assert len(manifest["avatars"])==5
              for info in manifest["avatars"]:
                  for kind in ("png","webp"):
                      path=info[kind]
                      raw_data=z.read(path)
                      assert hashlib.sha256(raw_data).hexdigest()==info["sha256_"+kind]
                      if kind=="png":
                          avatar=Image.open(io.BytesIO(raw_data))
                          assert avatar.size==(1254,1254) and avatar.mode=="RGBA"
                          assert avatar.getchannel("A").getextrema()==(0,255)
                      else:
                          avatar=Image.open(io.BytesIO(raw_data))
                          assert avatar.size==(768,768) and "A" in avatar.getbands()
                  print(f"Validated {info['slug']}: original transparent PNG + optimized transparent WebP")
              for entry in names_should:
                  target=Path(entry)
                  target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_bytes(z.read(entry))
          print("Imported five ranks, ten files and manifest")
          PY
      - name: Commit approved originals and optimized images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mrxpronos-play/assets/07-rank-avatars mrxpronos-play/avatars-manifest.json
          git diff --cached --check
          git commit -m 'assets(play): add 5 verified African rank avatars in PNG and WebP'
          git push origin HEAD:feat/mrxp-play-african-rank-avatars-1-to-5-20261119
