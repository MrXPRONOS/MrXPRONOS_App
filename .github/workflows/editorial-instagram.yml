name: Editorial - Instagram cartes et conseils

on:
  workflow_dispatch:
    inputs:
      publish:
        type: boolean
        required: true
        default: false
        description: "Envoyer réellement une image sur Instagram (autorisation explicite)"
  schedule:
    - cron: '12 11 * * *'

permissions:
  contents: write

concurrency:
  group: editorial-social-delivery
  cancel-in-progress: false

jobs:
  instagram:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dépendances locales gratuites
        run: python -m pip install Pillow requests
      - name: Actualiser la file éditoriale
        run: python scripts/editorial_queue.py --limit 100
      - name: Vérifier les JPEG préparés par le studio
        run: |
          python scripts/editorial_instagram_assets.py --limit 8
          python scripts/editorial_instagram.py
      - name: Publication en option sur le compte Instagram professionnel
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_PUBLISH: ${{ inputs.publish || 'false' }}
          AUTO_ENABLED: ${{ vars.EDITORIAL_INSTAGRAM_ENABLED || 'false' }}
        shell: bash
        run: |
          if [ "$REQUESTED_PUBLISH" = 'true' ] || { [ "$EVENT_NAME" = 'schedule' ] && [ "$AUTO_ENABLED" = 'true' ]; }; then
            python scripts/editorial_instagram.py --publish
          else
            echo "Instagram automatique désactivé, aucun post effectué."
          fi
      - name: Conserver les reçus sur le dernier état de main
        shell: bash
        run: |
          set -euo pipefail
          cp assets/data/editorial_share_queue.json "$RUNNER_TEMP/instagram-receipts.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/editorial_merge_receipts.py --receipt "$RUNNER_TEMP/instagram-receipts.json"
            git add assets/data/editorial_share_queue.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "data(editorial): confirmer envoi Instagram"
            if git push origin HEAD:main; then exit 0; fi
          done
          echo "::error::Reçu Instagram impossible à enregistrer. Vérifier le compte avant toute relance."
          exit 1
