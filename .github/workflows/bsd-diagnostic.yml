name: BSD - Diagnostic (manuel)

on:
  workflow_dispatch:
    inputs:
      test_date:
        description: "Date UTC à tester (YYYY-MM-DD). Vide = aujourd hui"
        required: false
        default: ""
      max_pages:
        description: "Nombre maximal de pages (1 à 10)"
        required: false
        default: "2"

permissions:
  contents: read

jobs:
  bsd-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install client dependency
        run: python -m pip install requests
      - name: Run offline unit tests
        run: python -m unittest discover -s bsd -p 'test_*.py' -v
      - name: Probe BSD API (5 HTTP calls max, no publication)
        env:
          BSD_API_KEY: "${{ secrets.BSD_API_KEY }}"
          TEST_DATE: "${{ inputs.test_date }}"
          MAX_PAGES: "${{ inputs.max_pages }}"
        run: |
          if [ -z "$BSD_API_KEY" ]; then
            echo "::error::Ajouter BSD_API_KEY dans Actions secrets"
            exit 1
          fi
          DATE="${TEST_DATE:-$(date -u +%F)}"
          python bsd/bsd_diagnostic.py --date "$DATE" --max-pages "$MAX_PAGES" --max-requests 5
