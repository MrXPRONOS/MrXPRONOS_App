name: Actu Crypto - 03 TOP BAISSES V2 TEST ONLY

on:
  push:
    branches: [feature/actu-crypto-lot-01-05]
    paths:
      - 'crypto/free_coin_logos.py'
      - 'crypto/export_losers_v2.py'
      - 'crypto/test_losers_v2.py'
      - 'crypto/send_crypto_losers_v2_test.py'
      - 'scripts/render_crypto_losers_v2.mjs'
      - '.github/workflows/actu-crypto-losers-v2-test.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: actu-crypto-losers-v2-test
  cancel-in-progress: false

jobs:
  losers-v2-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FOOTBALL_NEWS_BOT_TOKEN: ${{ secrets.FOOTBALL_NEWS_BOT_TOKEN }}
      TELEGRAM_TEST_CHAT_ID: '@predict_mrxp'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install free libraries
        run: |
          python -m pip install 'requests>=2.31,<3' 'Pillow>=10,<12'
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Offline unit tests - five verified losers
        run: python -m unittest crypto.test_losers_v2 -v
      - name: Retrieve five real market losers and 48h charts
        run: python -m crypto.export_losers_v2
      - name: Render V2 losers (others unchanged)
        run: node scripts/render_crypto_losers_v2.mjs
      - name: Archive test poster
        uses: actions/upload-artifact@v4
        with:
          name: crypto-publication-03-losers-v2
          path: crypto/generated/test/losers_v2.png
          if-no-files-found: error
          retention-days: 14
      - name: Send ONLY to verified @predict_mrxp
        run: python -m crypto.send_crypto_losers_v2_test
