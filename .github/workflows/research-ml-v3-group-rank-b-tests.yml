name: Research ML V3 Group-Mass Rank B vs A - fast synthetic validation (fixed code)
on:
  push:
    branches: [research/single-ml-v2-20261024]
    paths: ['.github/workflows/research-ml-v3-group-rank-b-tests.yml']
permissions:
  contents: read
jobs:
  tests-group-probability-no-leakage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy scipy scikit-learn
      - name: Check native V3 group probability source and evaluation compile
        run: |
          python -m py_compile research/single_ml_v2.py research/single_ml_v2_multisource.py research/ml_v3_group_probability.py research/ml_v3_group_rank_b_2026.py research/test_ml_v3_group_rank_b_2026.py
      - name: Check paired rank, provenance, outcome leakage and strict 2026 calendar
        run: PYTHONPATH=.:research python -m unittest research.test_ml_v3_group_rank_b_2026 -v
      - name: Ensure no production modification, fixed exact group definitions
        run: |
          python - <<'PY'
          from pathlib import Path
          code=Path("research/single_ml_v2.py").read_text()
          assert 'if export_v3_group_mass and name == V3_HYBRID:' in code
          assert 'grid_group_mass(grid, pred_score)' in code
          assert 'hybrid_v3_group_mass.csv' in code
          assert 'export_v3_group_mass=False' in code
          print("RESEARCH_GROUP_RANK_B_SOURCE_ISOLATED",flush=True)
          PY
