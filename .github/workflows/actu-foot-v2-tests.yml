name: Actu Foot V2 - Security and foundation tests
on:
  pull_request:
    paths:
      - 'scripts/actu_foot_v2_store.py'
      - 'tests_football_channel/test_actu_foot_v2_store.py'
      - '.github/workflows/actu-foot-v2-tests.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/actu_foot_v2_store.py'
      - 'tests_football_channel/test_actu_foot_v2_store.py'
      - '.github/workflows/actu-foot-v2-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned-range dependencies
        run: python -m pip install 'cryptography>=43,<47' 'requests>=2.31,<3'
      - name: Compile and validate V1/V2
        run: |
          python -m py_compile scripts/actu_foot_v2_store.py scripts/actu_foot_github_vault.py
          python -m unittest tests_football_channel.test_actu_foot_v2_store tests_football_channel.test_github_vault -v
