name: Telegram Football Discovery (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mrx-telegram-personal-account
  cancel-in-progress: false

jobs:
  research:
    name: Read-only public football channels
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Telethon
        run: python -m pip install -r scripts/telegram_research/requirements.txt requests

      - name: Search public Telegram channels (read only)
        run: |
          python scripts/telegram_research/discover_foot_channels.py \
            --max-searches 6 \
            --max-channels 12 \
            --max-posts 20 \
            --pause 10 \
            --out telegram_research_out
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION_STRING }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Upload public research report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telegram-foot-discovery-report
          path: telegram_research_out/
          retention-days: 2
          if-no-files-found: warn
