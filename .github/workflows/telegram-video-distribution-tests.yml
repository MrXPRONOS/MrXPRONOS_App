name: Telegram Shorts multichannel - unit tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/distribute_short_telegram.py"
      - "scripts/send_short_production_telegram.py"
      - "scripts/test_telegram_video_distribution.py"
      - "config/telegram_video_distribution.json"
      - ".github/workflows/shorts-coupons-production.yml"
      - ".github/workflows/telegram-video-distribution-tests.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencies
        run: python -m pip install requests
      - name: Syntax + mocked delivery tests (no live Telegram posts)
        run: |
          python -m py_compile scripts/distribute_short_telegram.py scripts/send_short_production_telegram.py
          python -m unittest discover -s scripts -p 'test_telegram_video_distribution.py' -v
