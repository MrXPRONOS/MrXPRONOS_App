name: Telegram - Promo XPVIP commune
run-name: "Telegram - Promo XPVIP commune (${{ inputs.trigger_source || github.event_name }})"

on:
  # Planification GitHub provisoire jusqu'à validation des tâches cron-job.org.
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      trigger_source:
        description: "Origine cron-job.org ou manuel"
        required: false
        default: "manual"
        type: string
  push:
    branches:
      - main
    paths:
      - '.github/telegram-xpvip-common-send-now.txt'

permissions:
  contents: read

concurrency:
  group: telegram-daily-xpvip-promo
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Journaliser la source
        env:
          TRIGGER_SOURCE: ${{ inputs.trigger_source || github.event_name }}
        run: |
          echo "Déclenchement : ${TRIGGER_SOURCE}"
          echo "Début UTC : $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install requests pillow

      - name: Send daily partner promo to Telegram
        run: python scripts/send_daily_partner_promo.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_SECONDARY: ${{ secrets.TELEGRAM_CHAT_ID_SECONDARY }}
          PROMO_IMAGE: assets/images/xpvip-partners-daily.jpg
