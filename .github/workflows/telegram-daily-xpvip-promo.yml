name: Telegram - Promo XPVIP commune (manuel)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/telegram-xpvip-common-send-now.txt'

permissions:
  contents: read

concurrency:
  group: telegram-daily-xpvip-promo
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install requests pillow

      - name: Send daily partner promo to Telegram
        run: python scripts/send_daily_partner_promo.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_SECONDARY: ${{ secrets.TELEGRAM_CHAT_ID_SECONDARY }}
          PROMO_IMAGE: assets/images/xpvip-partners-daily.jpg
