name: Neon LIVE exact legacy engine build verification
on:
  push:
    branches: [migration/supabase-to-free-stack-20261022]
    paths:
      - 'supabase/functions/live/index.neon.ts'
      - 'supabase/functions/live/_neon_*.ts'
      - '.github/workflows/neon-live-exact-port.yml'
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: neon-live-bundle, cancel-in-progress: true}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Align checkout with latest migration branch
        run: git pull --ff-only origin migration/supabase-to-free-stack-20261022
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Install pinned runtime and build dependencies
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund \
            postgres@3.4.7 esbuild@0.25.12 \
            @resvg/resvg-wasm@2.6.2 satori@0.12.0 satori-html@0.3.2 opentype.js@1.3.4
      - name: Bundle exact historical LIVE business implementation
        run: |
          ./node_modules/.bin/esbuild supabase/functions/live/index.neon.ts \
            --bundle --platform=node --format=esm --target=node24 \
            --outfile=migration/free-stack/live/index.legacy.bundle.mjs
          node --check migration/free-stack/live/index.legacy.bundle.mjs
          node -e 'const f=require("fs");const s=f.readFileSync("migration/free-stack/live/index.legacy.bundle.mjs","utf8"); for(const x of ["LIVE_VALUE_MODEL_VERSION","predictTotalCorners","predictTotalShots","predictTotalFouls","buildLivePrediction","refreshLiveDataBatch","sendTelegramLiveCoupon","validate"]) if(!s.includes(x)) throw Error("MISSING: "+x); console.log("LEGACY_FUNCTIONS_RETAINED")'

      - name: Smoke test without accessing PostgreSQL or Telegram
        env:
          DATABASE_URL: postgres://smoke:smoke@127.0.0.1:5432/smoke
          SUPABASE_URL: https://placeholder.invalid
          SUPABASE_SERVICE_ROLE_KEY: dummy
          CRON_SECRET: dummy-cron-secret
          DEBUG_KEY: dummy-debug-secret
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import handler from './migration/free-stack/live/index.legacy.bundle.mjs';
          assert.equal(typeof handler.fetch,'function','Neon fetch handler available');
          assert.equal(globalThis.Deno.env.get('CRON_SECRET'), 'dummy-cron-secret');
          let r=await handler.fetch(new Request('https://localhost/live/unknown'));
          assert.equal(r.status,404,'Unknown route must be 404');
          r=await handler.fetch(new Request('https://localhost/live/refresh',{method:'POST'}));
          const body=await r.json();
          assert.ok(r.status>=400 && String(body.error).includes('Unauthorized'),'Cron endpoint rejects wrong secret');
          r=await handler.fetch(new Request('https://localhost/live/telegram/process-one',{method:'POST'}));
          assert.ok(r.status>=400,'Telegram delivery rejects wrong secret');
          console.log('LEGACY_LIVE_SMOKE_PASS');
          NODE
      - name: Display configured secret presence only (never values)
        env:
          BSD_API_TOKEN: ${{ secrets.BSD_API_TOKEN }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_SECONDARY: ${{ secrets.TELEGRAM_CHAT_ID_SECONDARY }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          NEON_DB_URL: ${{ secrets.NEON_DB_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEON_DELIVERY_HMAC_KEY: ${{ secrets.NEON_DELIVERY_HMAC_KEY }}
          NEON_API_TOKEN: ${{ secrets.NEON_API_TOKEN }}
          NEON_TOKEN: ${{ secrets.NEON_TOKEN }}
        run: |
          for k in BSD_API_TOKEN CRON_SECRET TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID TELEGRAM_CHAT_ID_SECONDARY NEON_API_KEY NEON_DATABASE_URL NEON_DB_URL DATABASE_URL NEON_DELIVERY_HMAC_KEY NEON_API_TOKEN NEON_TOKEN; do
            if [[ -n "${!k}" ]]; then echo "$k: present"; else echo "$k: missing"; fi
          done
      - name: Package Neon production candidate with original fonts
        run: |
          set -euo pipefail
          mkdir -p /tmp/mrx-neon-package/_fonts
          cp migration/free-stack/live/index.legacy.bundle.mjs /tmp/mrx-neon-package/index.mjs
          cp supabase/functions/live/_fonts/NotoSans-{Regular,Bold,ExtraBold}.ttf /tmp/mrx-neon-package/_fonts/
          (cd /tmp/mrx-neon-package && zip -q -r "$GITHUB_WORKSPACE/migration/free-stack/live/legacy-neon-candidate.zip" index.mjs _fonts)
          unzip -l migration/free-stack/live/legacy-neon-candidate.zip | tail -7
          base64 -w0 migration/free-stack/live/legacy-neon-candidate.zip > migration/free-stack/live/legacy-neon-candidate.zip.b64
          split -b 450000 -d -a 3 migration/free-stack/live/legacy-neon-candidate.zip.b64 migration/free-stack/live/legacy-neon-part-
      - name: Store compiled entrypoint on migration branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add migration/free-stack/live/index.legacy.bundle.mjs migration/free-stack/live/legacy-neon-candidate.zip migration/free-stack/live/legacy-neon-candidate.zip.b64 migration/free-stack/live/legacy-neon-part-*
          if ! git diff --cached --quiet; then
            git fetch origin migration/supabase-to-free-stack-20261022
            if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/migration/supabase-to-free-stack-20261022)" ]]; then
              echo "Branch advanced during compilation; skip stale bundle publication"
              exit 0
            fi
            git commit -m 'build(live): tested exact legacy bundle for Neon runtime'
            git push origin HEAD:refs/heads/migration/supabase-to-free-stack-20261022
          fi
      - name: Confirm no writes to production during build
        run: echo "BUILD_ONLY_NO_DEPLOY"
