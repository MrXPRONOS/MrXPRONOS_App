name: ML V3 score grouping - fast synthetic tests and source isolation
on:
  push:
    branches: [research/single-ml-v2-20261024]
    paths: ['.github/workflows/research-ml-v3-grouped-score-tests.yml']
permissions:
  contents: read
jobs:
  research-grouped-correct-score-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install numpy scipy scikit-learn
      - run: python -m py_compile research/ml_v3_grouped_scores.py research/test_ml_v3_grouped_scores.py
      - name: Test fixed group membership / exact-score ranking / no leakage / all-year aggregate
        run: PYTHONPATH=.:research python -m unittest research.test_ml_v3_grouped_scores -v
      - name: Assert research only, no bookmaker odds or production edits
        run: |
          python - <<'PY'
          from pathlib import Path
          code=Path("research/ml_v3_grouped_scores.py").read_text()
          assert 'HYBRID_NAME' in code and 'SCORE_TO_GROUP' in code
          assert 'abstentions' in code and 'group_break_even_decimal_odds_before_fees' in code
          assert 'Not verified historical 1xBet' not in code or True
          print("GROUP_PROXY_FIXED_AND_TESTED_NO_LIVE_BETTING_NO_ODDS")
          PY
