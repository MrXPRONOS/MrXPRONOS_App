name: Football Odds - Validation API reelles
run-name: "Cotes HTTP | ${{ inputs.provider || 'all' }}"

on:
  push:
    branches: ['feature/football-odds-five-source-failover']
    paths:
      - 'bsd/odds_provider_smoke.py'
      - '.github/workflows/football-odds-smoke.yml'
  workflow_dispatch:
    inputs:
      provider:
        description: "API a verifier (une requete par API)"
        required: true
        default: all
        type: choice
        options: [all, pinnwire, oddslink, moviodds]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PINNWIRE_API_KEY: ${{ secrets.PINNWIRE_API_KEY }}
      ODDSLINK_API_KEY: ${{ secrets.ODDSLINK_API_KEY }}
      ODDS_SMOKE_PROVIDER: ${{ inputs.provider || 'all' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencies
        run: python -m pip install --disable-pip-version-check requests
      - name: One live request per provider, no secret output
        run: python bsd/odds_provider_smoke.py
