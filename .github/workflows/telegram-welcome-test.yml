name: Telegram - Accueil vers Messages enregistres
run-name: "Accueil Telegram - Messages enregistres (${{ github.event_name }})"

# Pas de push automatique : les messages ne sont plus publiés dans le canal test.
on:
  workflow_dispatch:
    inputs:
      source_message_id:
        description: "ID du message d'accueil deja verifie dans @predict_mrxp"
        required: true
        default: "1675"
        type: string

permissions:
  contents: read

concurrency:
  group: telegram-welcome-saved-messages
  cancel-in-progress: false

jobs:
  save-welcome:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      TELEGRAM_USER_API_ID: ${{ secrets.TELEGRAM_USER_API_ID }}
      TELEGRAM_USER_API_HASH: ${{ secrets.TELEGRAM_USER_API_HASH }}
      TELEGRAM_USER_SESSION: ${{ secrets.TELEGRAM_USER_SESSION }}
      TELEGRAM_USER_ID: ${{ secrets.TELEGRAM_USER_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Telethon and requests
        run: python -m pip install "telethon>=1.38,<2" "requests>=2.31,<3"
      - name: Valider le contenu sans publier
        run: python scripts/telegram_saved_welcome.py --check --source-message-id "${{ inputs.source_message_id }}"
      - name: Verifier la configuration de la session personnelle
        shell: bash
        run: |
          set -euo pipefail
          for secret_name in TELEGRAM_USER_API_ID TELEGRAM_USER_API_HASH TELEGRAM_USER_SESSION TELEGRAM_USER_ID; do
            if [ -z "${!secret_name:-}" ]; then
              echo "::error::Secret GitHub manquant : $secret_name"
              exit 1
            fi
          done
      - name: Transferer vers Messages enregistres et verifier boutons
        run: python scripts/telegram_saved_welcome.py --send --source-message-id "${{ inputs.source_message_id }}"
