name: Telegram - Accueil vers Messages enregistres
run-name: "Accueil Telegram - Messages enregistres (${{ github.event_name }})"

# Test unique de migration vers la session Telegram CineX existante.
# Après validation, conserver uniquement workflow_dispatch.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/telegram-welcome-test.yml'
  workflow_dispatch:
    inputs:
      source_message_id:
        description: "ID du message d'accueil deja verifie dans @predict_mrxp"
        required: true
        default: "1675"
        type: string

permissions:
  contents: read

concurrency:
  group: mrx-telegram-personal-account
  cancel-in-progress: false

jobs:
  save-welcome:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      TG_API_ID: ${{ secrets.TG_API_ID }}
      TG_API_HASH: ${{ secrets.TG_API_HASH }}
      TG_STRING_SESSION: ${{ secrets.TG_SESSION_STRING || secrets.TG_STRING_SESSION || secrets.TG_STREAM_SESSION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Telethon and requests
        run: python -m pip install "telethon>=1.38,<2" "requests>=2.31,<3"
      - name: Valider le contenu sans publier
        run: python scripts/telegram_saved_welcome.py --check --source-message-id "${{ inputs.source_message_id || '1675' }}"
      - name: Verifier la configuration de la session personnelle
        shell: bash
        run: |
          set -euo pipefail
          for secret_name in TG_API_ID TG_API_HASH TG_STRING_SESSION; do
            if [ -z "${!secret_name:-}" ]; then
              echo "::error::Secret GitHub manquant : $secret_name"
              exit 1
            fi
          done
      - name: Transferer vers Messages enregistres et verifier boutons
        run: python scripts/telegram_saved_welcome.py --send --source-message-id "${{ inputs.source_message_id || '1675' }}"
