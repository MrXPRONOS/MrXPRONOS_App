name: Normalize 1xBet affiliate link project-wide

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/replace-1xbet-affiliate-link.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace-link:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and normalize every 1xBet affiliate URL
        shell: python
        run: |
          from pathlib import Path
          import html
          import re

          NEW = "https://reffpa.com/L?tag=d_2054511m_1573c_&site=2054511&ad=1573"
          ignored_dirs = {
              ".git", "node_modules", ".venv", "venv", "__pycache__",
              "dist", "build", ".next", "coverage"
          }

          # Match ONLY the Mr XPRONOS 1xBet campaign.
          # The expression stops at the numeric ad id, so it cannot swallow
          # Markdown syntax such as ](...) or JSON-escaped newlines.
          sep = r"(?:&|&amp;|\\&)"
          affiliate_re = re.compile(
              r"https?://(?:www\.)?(?:refpa\d*\.com|reffpa\.com)/L\?"
              r"tag=d_2054511m_[A-Za-z0-9_-]+"
              + sep + r"site=2054511"
              + sep + r"ad=\d+",
              re.IGNORECASE,
          )

          def canonical(url: str) -> str:
              return html.unescape(url).replace("\\&", "&")

          def replacement_for(original: str) -> str:
              if "&amp;" in original:
                  return NEW.replace("&", "&amp;")
              if "\\&" in original:
                  return NEW.replace("&", "\\&")
              return NEW

          changed_files = []
          detected = []
          replacement_count = 0

          for path in Path(".").rglob("*"):
              if not path.is_file() or any(part in ignored_dirs for part in path.parts):
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue

              matches = list(affiliate_re.finditer(text))
              if not matches:
                  continue

              detected.append((str(path), [canonical(m.group(0)) for m in matches]))

              def repl(match):
                  nonlocal replacement_count
                  original = match.group(0)
                  if canonical(original) == NEW:
                      return original
                  replacement_count += 1
                  return replacement_for(original)

              new_text = affiliate_re.sub(repl, text)
              if new_text != text:
                  path.write_text(new_text, encoding="utf-8")
                  changed_files.append(str(path))

          print("=== 1xBet affiliate URLs detected ===")
          for path, urls in detected:
              print(path)
              for url in sorted(set(urls)):
                  print("  -", url)

          print(f"Actual replacements: {replacement_count}")
          print("Changed files:")
          for path in changed_files:
              print(" -", path)

      - name: Verify no legacy 1xBet affiliate URL remains
        shell: python
        run: |
          from pathlib import Path
          import html
          import re

          NEW = "https://reffpa.com/L?tag=d_2054511m_1573c_&site=2054511&ad=1573"
          ignored_dirs = {
              ".git", "node_modules", ".venv", "venv", "__pycache__",
              "dist", "build", ".next", "coverage"
          }
          sep = r"(?:&|&amp;|\\&)"
          affiliate_re = re.compile(
              r"https?://(?:www\.)?(?:refpa\d*\.com|reffpa\.com)/L\?"
              r"tag=d_2054511m_[A-Za-z0-9_-]+"
              + sep + r"site=2054511"
              + sep + r"ad=\d+",
              re.IGNORECASE,
          )

          def canonical(url: str) -> str:
              return html.unescape(url).replace("\\&", "&")

          legacy = []
          current = []

          for path in Path(".").rglob("*"):
              if not path.is_file() or any(part in ignored_dirs for part in path.parts):
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue

              for match in affiliate_re.finditer(text):
                  url = canonical(match.group(0))
                  if url == NEW:
                      current.append(str(path))
                  else:
                      legacy.append((str(path), url))

          if legacy:
              for path, url in legacy:
                  print(f"LEGACY: {path}: {url}")
              raise SystemExit(f"{len(legacy)} legacy 1xBet affiliate URL(s) remain")

          print(f"Verification OK: {len(current)} current 1xBet affiliate reference(s), 0 legacy references.")

      - name: Commit replacement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No affiliate-link changes to commit."
            exit 0
          fi
          git commit -m "Normalize all 1xBet affiliate links"
          git push
