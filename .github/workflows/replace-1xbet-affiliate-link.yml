name: Normalize 1xBet affiliate link project-wide

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/replace-1xbet-affiliate-link.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace-link:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and normalize every 1xBet affiliate URL
        shell: python
        run: |
          from pathlib import Path
          import re
          import html

          NEW = "https://reffpa.com/L?tag=d_2054511m_1573c_&site=2054511&ad=1573"
          ignored_dirs = {
              ".git", "node_modules", ".venv", "venv", "__pycache__",
              "dist", "build", ".next", "coverage"
          }

          # Capture URLs in source files. We deliberately do not replace generic
          # 1xbet.com links unless they carry the Mr XPRONOS affiliate campaign.
          url_re = re.compile(r"""https?://[^\s'"<>\`)]+""", re.IGNORECASE)
          ref_host_re = re.compile(r"^https?://(?:www\\.)?(?:refpa\\d*\\.com|reffpa\\.com)/L\\?", re.IGNORECASE)

          def canonical(url: str) -> str:
              return html.unescape(url).replace("\\&", "&").rstrip(".,;")

          def is_1xbet_affiliate(url: str) -> bool:
              u = canonical(url)
              return (
                  ("tag=d_2054511m_" in u and "site=2054511" in u)
                  or ("site=2054511" in u and "ad=1573" in u and "reffpa.com/L?" in u)
              )

          def replacement_for(original: str) -> str:
              if "&amp;" in original:
                  return NEW.replace("&", "&amp;")
              if "\\&" in original:
                  return NEW.replace("&", "\\&")
              return NEW

          changed_files = []
          replacement_count = 0
          found_locations = []

          for path in Path(".").rglob("*"):
              if not path.is_file() or any(part in ignored_dirs for part in path.parts):
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue

              original_text = text
              seen_in_file = []

              def repl(match):
                  nonlocal_text = match.group(0)
                  if not is_1xbet_affiliate(nonlocal_text):
                      return nonlocal_text

                  seen_in_file.append(nonlocal_text)
                  # Already the requested destination (possibly HTML/Markdown escaped).
                  if canonical(nonlocal_text) == NEW:
                      return nonlocal_text

                  return replacement_for(nonlocal_text)

              text = url_re.sub(repl, text)

              if seen_in_file:
                  found_locations.append((str(path), sorted(set(seen_in_file))))

              if text != original_text:
                  # Count actual substitutions, not merely detections.
                  before = [
                      canonical(m.group(0))
                      for m in url_re.finditer(original_text)
                      if is_1xbet_affiliate(m.group(0))
                  ]
                  after = [
                      canonical(m.group(0))
                      for m in url_re.finditer(text)
                      if is_1xbet_affiliate(m.group(0))
                  ]
                  replacement_count += max(0, sum(1 for u in before if u != NEW))
                  path.write_text(text, encoding="utf-8")
                  changed_files.append(str(path))

          print("=== 1xBet affiliate URLs detected ===")
          for path, urls in found_locations:
              print(path)
              for url in urls:
                  print("  -", canonical(url))

          print(f"Actual replacements: {replacement_count}")
          print("Changed files:")
          for path in changed_files:
              print(" -", path)

      - name: Verify no legacy 1xBet affiliate URL remains
        shell: python
        run: |
          from pathlib import Path
          import re
          import html

          NEW = "https://reffpa.com/L?tag=d_2054511m_1573c_&site=2054511&ad=1573"
          ignored_dirs = {
              ".git", "node_modules", ".venv", "venv", "__pycache__",
              "dist", "build", ".next", "coverage"
          }
          url_re = re.compile(r"""https?://[^\s'"<>\`)]+""", re.IGNORECASE)
          ref_host_re = re.compile(r"^https?://(?:www\\.)?(?:refpa\\d*\\.com|reffpa\\.com)/L\\?", re.IGNORECASE)

          def canonical(url: str) -> str:
              return html.unescape(url).replace("\\&", "&").rstrip(".,;")

          def is_1xbet_affiliate(url: str) -> bool:
              u = canonical(url)
              return (
                  ("tag=d_2054511m_" in u and "site=2054511" in u)
                  or ("site=2054511" in u and "ad=1573" in u and "reffpa.com/L?" in u)
              )

          legacy = []
          current = []
          for path in Path(".").rglob("*"):
              if not path.is_file() or any(part in ignored_dirs for part in path.parts):
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue

              for m in url_re.finditer(text):
                  if not is_1xbet_affiliate(m.group(0)):
                      continue
                  u = canonical(m.group(0))
                  if u == NEW:
                      current.append(str(path))
                  else:
                      legacy.append((str(path), u))

          if legacy:
              for path, url in legacy:
                  print(f"LEGACY: {path}: {url}")
              raise SystemExit(f"{len(legacy)} legacy 1xBet affiliate URL(s) remain")

          print(f"Verification OK: {len(current)} current 1xBet affiliate reference(s), 0 legacy references.")

      - name: Commit replacement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No affiliate-link changes to commit."
            exit 0
          fi
          git commit -m "Normalize all 1xBet affiliate links"
          git push
