name: BSD V2 - Safe et Cotes 1,50+ Telegram
run-name: "Telegram - Safe et Cotes 1,50+ (${{ inputs.trigger_source || github.event_name }})"

on:
  push:
    branches: [main]
    paths:
      - 'bsd/bsd_v2_telegram_analyses.py'
      - 'bsd/bsd_v2_tier_visual.py'
      - '.github/workflows/bsd-v2-telegram-analyses.yml'
  schedule:
    - cron: '2,17,32,47 * * * *'
  workflow_dispatch:
    inputs:
      trigger_source:
        description: "Origine : cron-job.org ou manuel"
        required: false
        default: "manual"
        type: string
      destination:
        description: "Les lancements manuels vont au canal test par défaut"
        type: choice
        options: [test, production]
        default: test
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: bsd-v2-market-analysis-telegram
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: python -m pip install requests pillow
      - name: Validate strictly informational classification
        run: |
          python -m compileall -q bsd
          python -m unittest discover -s bsd -p 'test_bsd_v2_public_tiers.py' -v
          python -m unittest discover -s bsd -p 'test_bsd_v2_telegram_analyses.py' -v
      - name: Route Telegram safely
        env:
          TRIGGER_SOURCE: ${{ inputs.trigger_source || github.event_name }}
          TARGET_MANUAL: ${{ inputs.destination || 'test' }}
          PROD_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_CHAT: ${{ secrets.TELEGRAM_TEST_CHAT_ID || '@predict_mrxp' }}
          EXTRA_CHATS: ${{ secrets.TELEGRAM_ANALYSIS_CHAT_IDS }}
        run: |
          set -euo pipefail
          if [ "$TRIGGER_SOURCE" = "schedule" ] || [ "$TRIGGER_SOURCE" = "push" ] || [ "$TRIGGER_SOURCE" = "cron-job.org" ] || [ "$TARGET_MANUAL" = "production" ]; then
            test -n "$PROD_CHAT"
            echo "TELEGRAM_CHAT_ID=$PROD_CHAT" >> "$GITHUB_ENV"
            echo "TELEGRAM_ANALYSIS_CHAT_IDS=$EXTRA_CHATS" >> "$GITHUB_ENV"
            echo "ANALYSIS_TEST_MODE=false" >> "$GITHUB_ENV"
          else
            test -n "$TEST_CHAT"
            echo "TELEGRAM_CHAT_ID=$TEST_CHAT" >> "$GITHUB_ENV"
            echo "TELEGRAM_ANALYSIS_CHAT_IDS=" >> "$GITHUB_ENV"
            echo "ANALYSIS_TEST_MODE=true" >> "$GITHUB_ENV"
          fi
      - name: Guard test channel before manual smoke
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.trigger_source != 'cron-job.org' && inputs.destination != 'production' }}
        env:
          TELEGRAM_TEST_CHAT_ID: ${{ secrets.TELEGRAM_TEST_CHAT_ID || '@predict_mrxp' }}
          TELEGRAM_TEST_GUARD_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python scripts/telegram_test_guard.py
      - name: Deliver Safe and Cotes 1,50+ analyses with distinct ledger
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python bsd/bsd_v2_telegram_analyses.py --data data.json
