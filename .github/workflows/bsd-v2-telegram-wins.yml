name: BSD V2 - Validation des coupons Telegram
run-name: "BSD V2 - Validation Telegram (${{ inputs.trigger_source || github.event_name }})"

on:
  push:
    branches: [main]
    paths:
      - 'bsd/bsd_v2_verify_telegram.py'
      - '.github/workflows/bsd-v2-telegram-wins.yml'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      trigger_source:
        description: "Origine : cron-job.org ou manuel"
        required: false
        default: "manual"
        type: string

permissions:
  contents: read

concurrency:
  group: bsd-v2-telegram-wins
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Journaliser le déclenchement
        env:
          TRIGGER_SOURCE: ${{ inputs.trigger_source || github.event_name }}
        run: |
          echo "Déclenchement : ${TRIGGER_SOURCE}"
          echo "Début UTC : $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: python -m pip install requests pillow
      - name: Validate singles and 2-leg combos; post verified winners only
        env:
          BSD_API_KEY: '${{ secrets.BSD_API_KEY }}'
          TELEGRAM_BOT_TOKEN: '${{ secrets.TELEGRAM_BOT_TOKEN }}'
          CLOUDFLARE_API_TOKEN: '${{ secrets.CLOUDFLARE_API_TOKEN }}'
        run: |
          python -m py_compile bsd/bsd_v2_verify_telegram.py scripts/d1_publication_ledger.py
          python bsd/bsd_v2_verify_telegram.py --feed data.json
