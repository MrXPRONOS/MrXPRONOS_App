name: BSD V2 - Validation des coupons Telegram

on:
  schedule:
    - cron: '40 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bsd-v2-telegram-wins
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: python -m pip install requests pillow
      - name: Validate published picks; post winner cards only
        env:
          BSD_API_KEY: '${{ secrets.BSD_API_KEY }}'
          TELEGRAM_BOT_TOKEN: '${{ secrets.TELEGRAM_BOT_TOKEN }}'
          SUPABASE_URL: '${{ secrets.SUPABASE_URL }}'
          SUPABASE_SERVICE_ROLE_KEY: '${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}'
          SUPABASE_KEY: '${{ secrets.SUPABASE_KEY }}'
        run: python bsd/bsd_v2_verify_telegram.py --feed data.json
