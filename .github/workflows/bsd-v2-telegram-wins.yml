name: BSD V2 - Validation des coupons Telegram
run-name: "BSD V2 - Validation Telegram (${{ inputs.trigger_source || github.event_name }})"

on:
  # Filet de sécurité GitHub : vérifie régulièrement les coupons terminés.
  # cron-job.org peut continuer à déclencher le workflow entre-temps.
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      trigger_source:
        description: "Origine : cron-job.org ou manuel"
        required: false
        default: "manual"
        type: string

permissions:
  contents: read

concurrency:
  group: bsd-v2-telegram-wins
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Journaliser le déclenchement
        env:
          TRIGGER_SOURCE: ${{ inputs.trigger_source || github.event_name }}
        run: |
          echo "Déclenchement : ${TRIGGER_SOURCE}"
          echo "Début UTC : $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: python -m pip install requests pillow
      - name: Validate singles and 2-leg combos; post verified winners only
        env:
          BSD_API_KEY: '${{ secrets.BSD_API_KEY }}'
          TELEGRAM_BOT_TOKEN: '${{ secrets.TELEGRAM_BOT_TOKEN }}'
          SUPABASE_URL: '${{ secrets.SUPABASE_URL }}'
          SUPABASE_SERVICE_ROLE_KEY: '${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}'
          SUPABASE_KEY: '${{ secrets.SUPABASE_KEY }}'
        run: python bsd/bsd_v2_verify_telegram.py --feed data.json
