name: Exact scores - Phase 1 H2H validation
on:
  workflow_dispatch:
  push:
    branches: ['feature/exact-score-v1-20261019']
    paths:
      - 'bsd/exact_scores_h2h_v2.py'
      - 'bsd/exact_scores_phase1_backtest.py'
      - 'bsd/test_exact_scores.py'
      - '.github/workflows/exact-scores-phase1.yml'
permissions:
  contents: read
concurrency:
  group: exact-scores-phase1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  phase1:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install BSD dependencies
        run: python -m pip install requests cryptography
      - name: Regression tests
        run: python -m unittest bsd/test_exact_scores.py -v
      - name: Restore private BSD history
        env:
          BSD_HISTORY_KEY: '${{ secrets.BSD_HISTORY_KEY }}'
        run: python bsd/bsd_archive.py restore
      - name: Walk-forward full 2026 phase 1 variants
        run: python bsd/exact_scores_phase1_backtest.py
      - name: Validate coverage and immutable baseline
        run: |
          python - <<'PY'
          import json
          d=json.load(open("tmp/exact-scores/phase1-h2h-report.json"))
          assert d["finished_2026"] > 0
          assert d["model_eligible"] > 0
          assert "v2_standalone" in d["variants"]
          assert d["coverage"]["finished"] >= d["coverage"]["model_eligible"]
          print("PHASE1_RESULT",json.dumps({"coverage":d["coverage"],"variants":d["variants"],"halves":d["halves"]}))
          PY
      - name: Upload aggregate report only
        uses: actions/upload-artifact@v4
        with:
          name: exact-scores-phase1-${{ github.run_id }}
          path: tmp/exact-scores/phase1-h2h-report.json
          if-no-files-found: error
          retention-days: 90
      - name: Delete decrypted history and per-match audit
        if: always()
        run: rm -f bsd/all_matches_bsd.json bsd/backfill_state.json tmp/exact-scores/phase1-h2h-private-audit.json
