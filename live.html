<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
  <title>MrXPRONOS LIVE</title>

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    * { box-sizing: border-box; font-family: 'Inter', sans-serif; }
    body {
      margin: 0;
      color: #f3f4f6;
      background:
        radial-gradient(circle at top, rgba(212,175,55,.08), transparent 30%),
        linear-gradient(180deg, #090909 0%, #050505 100%);
    }
    .gold-gradient {
      background: linear-gradient(135deg, #D4AF37 0%, #f5e7a3 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .glass { background: rgba(18,18,18,.9); backdrop-filter: blur(12px); }
    .card-hover { transition: all .25s ease; }
    .card-hover:hover {
      transform: translateY(-2px);
      border-color: rgba(212,175,55,.45);
      box-shadow: 0 10px 30px rgba(212,175,55,.08);
    }
    .live-pulse { animation: pulse-live 1.8s infinite; }
    @keyframes pulse-live {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: .4; transform: scale(.9); }
    }
    .custom-scrollbar::-webkit-scrollbar { width: 8px; height: 8px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #0f0f0f; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #2e2e2e; border-radius: 999px; }
    .logo-ring {
      border: 1px solid rgba(255,255,255,.08);
      background: #0b0b0b;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.02);
    }
    .soft-border { border: 1px solid rgba(255,255,255,.06); }
    .mini-dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      display: inline-block;
    }
    .hero-card {
      background:
        radial-gradient(circle at top right, rgba(212,175,55,.08), transparent 30%),
        #101010;
    }
    .safe-wrap { word-break: break-word; overflow-wrap: anywhere; }

    /* =======================================================
       ✅ PRONOSTIC BOX (pop-out + heartbeat)
       ======================================================= */
    .pronostic-pop{
      position: relative;
      background: radial-gradient(circle at 30% 20%, rgba(212,175,55,.10), transparent 45%),
                  linear-gradient(180deg, #0c0c0c 0%, #080808 100%);
      border: 1px solid rgba(212,175,55,.26);
      border-radius: 18px;
      padding: 12px 14px;
      box-shadow:
        0 26px 70px rgba(0,0,0,.80),
        0 14px 30px rgba(0,0,0,.55),
        0 10px 26px rgba(212,175,55,.12),
        inset 0 1px 0 rgba(255,255,255,.06);
      transition: box-shadow .18s ease, border-color .18s ease;
      overflow: hidden;
    }
    .pronostic-pop::after{
      content:"";
      position:absolute;
      inset:-10px;
      background: radial-gradient(circle at 50% 35%, rgba(212,175,55,.22), transparent 60%);
      filter: blur(10px);
      opacity: .55;
      pointer-events:none;
      z-index: 0;
    }
    .pronostic-pop::before{
      content:"";
      position:absolute;
      inset:0;
      border-radius: 18px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.03);
      pointer-events:none;
      z-index: 0;
    }
    .pronostic-pop > *{ position: relative; z-index: 1; }
    .pronostic-pop:hover{
      border-color: rgba(212,175,55,.45);
      box-shadow:
        0 34px 85px rgba(0,0,0,.85),
        0 18px 38px rgba(0,0,0,.60),
        0 14px 30px rgba(212,175,55,.18),
        inset 0 1px 0 rgba(255,255,255,.08);
    }

    @keyframes mx-heartbeat {
      0%   { transform: translateY(0) scale(1); }
      12%  { transform: translateY(-2px) scale(1.02); }
      24%  { transform: translateY(0) scale(0.995); }
      36%  { transform: translateY(-1px) scale(1.012); }
      60%  { transform: translateY(0) scale(1); }
      100% { transform: translateY(0) scale(1); }
    }
    @keyframes mx-glowbeat {
      0%   { opacity: .40; transform: scale(1); }
      12%  { opacity: .70; transform: scale(1.06); }
      24%  { opacity: .45; transform: scale(1.01); }
      36%  { opacity: .62; transform: scale(1.04); }
      60%  { opacity: .40; transform: scale(1); }
      100% { opacity: .40; transform: scale(1); }
    }
    .pronostic-pop--heartbeat{
      animation: mx-heartbeat 1.7s infinite;
      transform-origin: center;
      will-change: transform;
    }
    .pronostic-pop--heartbeat::after{
      animation: mx-glowbeat 1.7s infinite;
      transform-origin: center;
      will-change: transform, opacity;
    }
    @media (prefers-reduced-motion: reduce){
      .pronostic-pop--heartbeat,
      .pronostic-pop--heartbeat::after{
        animation: none !important;
      }
    }

    /* =======================================================
       ✅ NOTIFICATIONS attractive (validated/reached)
       ======================================================= */
    @keyframes notifPulse {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-2px) scale(1.01); }
    }
    @keyframes notifShine {
      0% { transform: translateX(-120%) skewX(-12deg); opacity: 0; }
      15% { opacity: .55; }
      45% { opacity: .15; }
      100% { transform: translateX(220%) skewX(-12deg); opacity: 0; }
    }
    .notif-attractive{
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(212,175,55,.38) !important;
      background:
        radial-gradient(circle at 30% 15%, rgba(212,175,55,.18), transparent 55%),
        linear-gradient(180deg, rgba(20,20,20,.95), rgba(10,10,10,.95));
      box-shadow:
        0 22px 70px rgba(0,0,0,.80),
        0 12px 30px rgba(212,175,55,.10),
        inset 0 1px 0 rgba(255,255,255,.06);
      animation: notifPulse 1.8s infinite;
      will-change: transform;
    }
    .notif-attractive::before{
      content:"";
      position:absolute;
      top:0; left:0;
      width:45%;
      height:100%;
      background: linear-gradient(120deg, transparent, rgba(255,255,255,.10), transparent);
      filter: blur(0.3px);
      animation: notifShine 3.2s infinite;
      pointer-events: none;
    }
    .notif-success{
      border-color: rgba(34,197,94,.35) !important;
      box-shadow:
        0 22px 70px rgba(0,0,0,.80),
        0 12px 30px rgba(34,197,94,.12),
        inset 0 1px 0 rgba(255,255,255,.06);
    }
    .notif-failure{
      border-color: rgba(239,68,68,.35) !important;
      box-shadow:
        0 22px 70px rgba(0,0,0,.80),
        0 12px 30px rgba(239,68,68,.10),
        inset 0 1px 0 rgba(255,255,255,.06);
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel">
    // =======================================================
    // CONFIG
    // =======================================================
    const SUPABASE_URL = "https://nhwafcpndlufzzxexikh.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_lclkhPk4SxHqvapianW4SQ_xZjDYvPt";
    const EDGE_FUNCTION_URL = `${SUPABASE_URL}/functions/v1/live`;

    const supabase =
      SUPABASE_ANON_KEY && SUPABASE_ANON_KEY !== "YOUR_SUPABASE_ANON_KEY"
        ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
        : null;

    const { useState, useEffect, useCallback, useMemo } = React;

    // =======================================================
    // COOKIES (365 jours) + ID stable
    // =======================================================
    const COOKIE_DAYS = 365;

    function getCookie(name) {
      const m = document.cookie.match(
        new RegExp('(?:^|; )' + name.replace(/([.$?*|{}()[\]\\/+^])/g, '\\$1') + '=([^;]*)')
      );
      return m ? decodeURIComponent(m[1]) : null;
    }

    function setCookie(name, value, days = COOKIE_DAYS) {
      const expires = new Date(Date.now() + days * 864e5).toUTCString();
      const secure = location.protocol === 'https:' ? '; Secure' : '';
      document.cookie = `${name}=${encodeURIComponent(value)}; Expires=${expires}; Path=/; SameSite=Lax${secure}`;
    }

    function getUserId() {
      let userId = localStorage.getItem("mx_user_id") || getCookie("mx_user_id");
      if (!userId) {
        try { userId = "MX-" + crypto.randomUUID(); }
        catch { userId = "MX-" + Date.now().toString(36) + Math.random().toString(36).slice(2); }
      }
      localStorage.setItem("mx_user_id", userId);
      setCookie("mx_user_id", userId, COOKIE_DAYS);
      return userId;
    }

    // =======================================================
    // PARTAGE / JOUR
    // =======================================================
    function getTodayString() {
      return new Date().toDateString();
    }

    function getDailyShareCount() {
      const lastReset = localStorage.getItem("shareLastReset");
      const todayKey = getTodayString();
      if (lastReset !== todayKey) {
        localStorage.setItem("shareLastReset", todayKey);
        localStorage.setItem("shareCount", "0");
        return 0;
      }
      return parseInt(localStorage.getItem("shareCount") || "0", 10);
    }

    function incrementShareCount() {
      const current = getDailyShareCount();
      const next = current + 1;
      localStorage.setItem("shareCount", String(next));
      return next;
    }

    function openExternal(url) {
      window.open(url, "_blank", "noopener,noreferrer");
    }

    // Validation partage après ~5s
    let pendingShare = null;

    function startShareTracking(platform, onUnlocked) {
      pendingShare = {
        startedAt: Date.now(),
        finalized: false,
        platform,
        onUnlocked
      };
      setTimeout(() => finalizePendingShare(true), 5500);
    }

    async function recordShareEvent(platform) {
      if (!supabase) return;
      const userId = getUserId();
      const eventType = platform === "whatsapp" ? "share_whatsapp" : "share_telegram";
      try {
        await supabase.from("analytics").insert({
          event_type: eventType,
          user_id: userId,
          page: "live.html",
        });
      } catch (_) {}
      try { await supabase.rpc("increment_counter", { counter_name: "total_shares" }); } catch (_) {}
    }

    function finalizePendingShare(force = false) {
      if (!pendingShare || pendingShare.finalized) return;

      const elapsed = Date.now() - pendingShare.startedAt;
      if (!force && elapsed < 5000) return;

      pendingShare.finalized = true;
      const ctx = pendingShare;
      pendingShare = null;

      const newCount = incrementShareCount();
      recordShareEvent(ctx.platform);

      if (newCount >= 1) ctx.onUnlocked?.();
    }

    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) finalizePendingShare(false);
    });

    // =======================================================
    // UTILS
    // =======================================================
    function safeNumber(value, fallback = 0) {
      const n = Number(value);
      return Number.isFinite(n) ? n : fallback;
    }
    function formatPercent(value) {
      return `${Math.round(safeNumber(value, 0) * 100)}%`;
    }
    function formatDateTime(ts) {
      try { return new Date(ts).toLocaleString("fr-FR"); } catch { return "-"; }
    }
    function formatTime(ts) {
      try {
        return new Date(ts).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
      } catch { return "-"; }
    }
    function formatNumberFR(v) {
      if (v === null || v === undefined || v === "") return "";
      const n = Number(v);
      if (!Number.isFinite(n)) return String(v);
      return String(n).replace(".", ",");
    }

    function guessUnitFromPred(pred) {
      const s = `${pred?.badge || ""} ${pred?.title || ""}`.toLowerCase();
      if (s.includes("corner")) return "corners";
      if (s.includes("shot") || s.includes("tir")) return "tirs";
      if (s.includes("foul") || s.includes("faute")) return "fautes";
      return "";
    }

    // ✅ demandé :
    // - "Pronostic :" en OR uniquement
    // - "Total plus de ..." en BLANC
    // - "seuil" devient "pronostic"
    function formatPredTitleSimple(pred) {
      const unit = guessUnitFromPred(pred);
      const thrVal = pred?.pronostic ?? pred?.threshold;
      const thr = formatNumberFR(thrVal);
      const title = String(pred?.title || "").toLowerCase();

      const isOver = title.includes("over") || title.includes("plus de");
      const isUnder = title.includes("under") || title.includes("moins de");

      if (thr && (isOver || isUnder)) {
        const verb = isOver ? "plus de" : "moins de";
        return (
          <>
            <span className="text-[#D4AF37]">Pronostic :</span>
            <span>{`Total ${verb} ${thr}${unit ? " " + unit : ""}`}</span>
          </>
        );
      }

      if (pred?.title) {
        return (
          <>
            <span className="text-[#D4AF37]">Pronostic :</span>
            <span>{pred.title}</span>
          </>
        );
      }

      return <span className="text-[#D4AF37]">Pronostic :</span>;
    }

    // ✅ "projection" remplacée par "Au signal" (= actuel au moment du signal)
    function formatPredSubtitle(pred) {
      const auSignal = pred?.signal_value ?? pred?.projected ?? "-";
      const current = pred?.current ?? pred?.current_value ?? "-";
      return `Au signal: ${formatNumberFR(auSignal)} • Actuel: ${formatNumberFR(current)}`;
    }

    // ✅ meta historique => un "pred" compatible UI
    function metaFromHistoryType(type, threshold) {
      const t = safeNumber(threshold, 0);
      if (type === "total_corners") return { badge: "Corners", color: "yellow", title: `Over ${t} corners` };
      if (type === "total_shots") return { badge: "Tirs", color: "green", title: `Over ${t} tirs` };
      if (type === "total_fouls") return { badge: "Fautes", color: "orange", title: `Over ${t} fautes` };
      return { badge: "Signal", color: "gold", title: `Over ${t}` };
    }

    // =======================================================
    // LOGOS via Edge Function Proxy
    // =======================================================
    function getTeamLogo(match, side = "home") {
      const obj = side === "home" ? match?.home_team_obj : match?.away_team_obj;
      const directId = side === "home" ? match?.home_team_id : match?.away_team_id;
      const apiId = obj?.api_id || obj?.id || directId || match?.[`${side}_id`];
      if (!apiId) return null;
      return `${EDGE_FUNCTION_URL}/img/team/${apiId}`;
    }
    function getLeagueLogo(match) {
      const apiId = match?.league?.api_id || match?.league?.id || match?.league_id;
      if (!apiId) return null;
      return `${EDGE_FUNCTION_URL}/img/league/${apiId}`;
    }

    // =======================================================
    // SHARE GATE (LIVE) : 1 partage / jour
    // =======================================================
    const ShareAccessScreen = ({ onActivated }) => {
      const [count, setCount] = useState(() => getDailyShareCount());

      const shareMessage = useMemo(() => {
        return `Salut frère,

Avec ce site, on ne va plus perdre les coupons : il propose des coupons plutôt fiables, même pour les matchs en live.

Je viens de le découvrir et, pour l’instant, c’est totalement gratuit… autant en profiter maintenant.

Voici le lien : https://mrxpronos.github.io/MrXPRONOS_App/`;
      }, []);

      useEffect(() => {
        const t = setInterval(() => setCount(getDailyShareCount()), 900);
        return () => clearInterval(t);
      }, []);

      const doShare = (platform) => {
        const url = platform === "whatsapp"
          ? `https://wa.me/?text=${encodeURIComponent(shareMessage)}`
          : `https://t.me/share/url?url=${encodeURIComponent("https://mrxpronos.github.io/MrXPRONOS_App/")}&text=${encodeURIComponent(shareMessage)}`;

        openExternal(url);

        startShareTracking(platform, () => {
          setCount(getDailyShareCount());
          onActivated?.();
        });
      };

      return (
        <div className="min-h-screen flex items-center justify-center px-4 py-10">
          <div
            className="w-full max-w-md rounded-[28px] p-6 md:p-7 border border-[#D4AF37]/35 bg-black/50"
            style={{
              boxShadow: "0 0 0 1px rgba(212,175,55,.10), 0 25px 70px rgba(0,0,0,.7)",
              backdropFilter: "blur(10px)",
            }}
          >
            <div className="flex justify-center mb-5">
              <div className="w-16 h-16 rounded-2xl border border-[#D4AF37]/30 bg-[#0b0b0b] flex items-center justify-center">
                <i className="fas fa-bolt text-[#22C55E] text-2xl"></i>
              </div>
            </div>

            <h1 className="text-center text-3xl font-extrabold text-[#D4AF37] mb-2">
              Accès LIVE VIP
            </h1>

            <div className="text-center text-gray-300 text-sm mb-5">
              Partagez 1 fois par jour pour accéder au LIVE.
            </div>

            <div className="text-center text-gray-400 text-sm mb-5">
              Partages aujourd’hui : <b className="text-white">{count}/1</b>
            </div>

            <div className="flex gap-3 justify-center mb-5">
              <button
                className="px-6 py-3 rounded-full font-extrabold bg-emerald-600 hover:bg-emerald-500 text-white w-1/2"
                onClick={() => doShare("whatsapp")}
                type="button"
              >
                WhatsApp
              </button>
              <button
                className="px-6 py-3 rounded-full font-extrabold bg-sky-600 hover:bg-sky-500 text-white w-1/2"
                onClick={() => doShare("telegram")}
                type="button"
              >
                Telegram
              </button>
            </div>

            <button
              onClick={() => {
                if (getDailyShareCount() >= 1) onActivated?.();
                else alert("Partage requis (1 par jour).");
              }}
              className="mt-2 w-full py-4 rounded-full font-extrabold text-black"
              style={{ background: "linear-gradient(135deg, #D4AF37 0%, #f5e7a3 100%)" }}
              type="button"
            >
              Continuer
            </button>

            <button
              onClick={() => (window.location.href = "index.html")}
              className="mt-3 w-full py-3 rounded-full font-bold border border-white/10 text-gray-300 hover:bg-white/5"
              type="button"
            >
              Retour
            </button>
          </div>
        </div>
      );
    };

    const ShareGate = ({ children }) => {
      const [status, setStatus] = useState("checking");

      useEffect(() => {
        const c = getDailyShareCount();
        setStatus(c >= 1 ? "allowed" : "denied");
      }, []);

      if (status === "checking") {
        return (
          <div className="min-h-screen flex items-center justify-center px-4">
            <div className="text-center text-gray-400">
              <div className="w-12 h-12 border-4 border-[#D4AF37] border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
              Vérification accès...
            </div>
          </div>
        );
      }

      if (status === "denied") {
        return <ShareAccessScreen onActivated={() => setStatus("allowed")} />;
      }

      return children;
    };

    // =======================================================
    // UI COMPONENTS
    // =======================================================
    const Icon = ({ name, size = 18, className = "" }) => {
      const map = {
        bell: "fa-bell",
        x: "fa-times",
        target: "fa-bullseye",
        radio: "fa-broadcast-tower",
        history: "fa-history",
        star: "fa-star",
        arrowLeft: "fa-arrow-left",
        chartBar: "fa-chart-bar",
        clock: "fa-clock",
        activity: "fa-bolt",
        refresh: "fa-rotate-right",
        calendar: "fa-calendar-alt",
        bolt: "fa-bolt"
      };
      return <i className={`fas ${map[name] || "fa-circle"} ${className}`} style={{ fontSize: size }} />;
    };

    const Card = ({ children, className = "", onClick, hover = true }) => (
      <div
        onClick={onClick}
        className={`bg-[#121212] border border-[#232323] rounded-2xl p-4 md:p-5 ${hover ? "card-hover" : ""} ${onClick ? "cursor-pointer" : ""} ${className}`}
      >
        {children}
      </div>
    );

    const Badge = ({ children, color = "gray" }) => {
      const colors = {
        green: "bg-green-500/15 text-green-400 border-green-500/30",
        blue: "bg-blue-500/15 text-blue-400 border-blue-500/30",
        red: "bg-red-500/15 text-red-400 border-red-500/30",
        orange: "bg-orange-500/15 text-orange-400 border-orange-500/30",
        yellow: "bg-orange-500/15 text-yellow-300 border-yellow-500/30",
        gold: "bg-[#D4AF37]/15 text-[#D4AF37] border-[#D4AF37]/30",
        gray: "bg-gray-500/10 text-gray-300 border-gray-500/20"
      };
      return (
        <span className={`px-2 py-1 text-[10px] md:text-[11px] rounded-full border inline-flex items-center gap-1 font-medium ${colors[color] || colors.gray}`}>
          {children}
        </span>
      );
    };

    const ScoreBar = ({ value, label, color = "#D4AF37" }) => (
      <div>
        <div className="flex justify-between mb-1 text-[11px]">
          <span className="text-gray-400">{label}</span>
          <span className="font-bold" style={{ color }}>
            {Math.min(100, safeNumber(value, 0))}
          </span>
        </div>
        <div className="h-2 rounded-full bg-[#222] overflow-hidden">
          <div
            className="h-full rounded-full transition-all duration-500"
            style={{ width: `${Math.min(100, safeNumber(value, 0))}%`, background: color }}
          />
        </div>
      </div>
    );

    const FreshnessBadge = ({ seconds }) => {
      if (seconds == null) return <Badge color="gray">maj inconnue</Badge>;
      if (seconds <= 20) return <Badge color="green">maj {seconds}s</Badge>;
      if (seconds <= 45) return <Badge color="yellow">maj {seconds}s</Badge>;
      return <Badge color="red">maj {seconds}s</Badge>;
    };

    const HeatBadge = ({ level }) => {
      if (level === "explosive") return <Badge color="red">Explosif</Badge>;
      if (level === "hot") return <Badge color="orange">Chaud</Badge>;
      if (level === "warming") return <Badge color="yellow">Actif</Badge>;
      return <Badge color="gray">Calme</Badge>;
    };

    const PredictionBadge = ({ pred }) => {
      const colorMap = { green: "green", orange: "orange", yellow: "yellow" };
      return <Badge color={colorMap[pred?.color] || "gold"}>{pred?.badge || pred?.title || "Prédiction"}</Badge>;
    };

    const StatChip = ({ label, value, valueColor = "text-white", compact = false }) => (
      <div className={`bg-[#0b0b0b] border border-[#202020] rounded-xl text-center ${compact ? "px-2 py-2" : "px-3 py-3"}`}>
        <div className={`${compact ? "text-[10px]" : "text-[11px]"} text-gray-500`}>{label}</div>
        <div className={`${compact ? "text-lg" : "text-2xl"} font-extrabold mt-1 ${valueColor}`}>{value}</div>
      </div>
    );

    const LogoImg = ({ src, alt, size = 34, className = "" }) => {
      const [failed, setFailed] = useState(false);
      if (!src || failed) {
        return (
          <div

    const EmptyState = ({ title, subtitle }) => (
      <Card className="text-center py-12 bg-[#101010]">
        <div className="w-14 h-14 mx-auto mb-4 rounded-2xl bg-[#161616] border border-[#232323] flex items-center justify-center">
          <Icon name="chartBar" className="text-[#D4AF37]" />
        </div>
        <div className="text-lg font-semibold text-gray-300 mb-2">{title}</div>
        <div className="text-sm text-gray-500 safe-wrap">{subtitle}</div>
      </Card>
    );

    // =======================================================
    // NOTIFICATIONS (en cartes + click => detail prediction)
    // =======================================================
    const NotificationsPanel = ({ notifications, unreadCount, onClear, onOpenPrediction }) => (
      <div>
        <div className="flex items-center justify-between mb-4 gap-3 flex-wrap">
          <div className="text-lg font-bold flex items-center gap-2">
            <Icon name="bell" className="text-[#D4AF37]" />
            Notifications
            {unreadCount > 0 && <Badge color="red">{unreadCount} non lues</Badge>}
          </div>
          <button
            onClick={onClear}
            className="px-3 py-2 rounded-xl bg-[#151515] text-gray-300 border border-[#252525] hover:bg-[#1a1a1a] text-sm font-semibold"
            type="button"
          >
            Tout lire
          </button>
        </div>

        {notifications.length === 0 ? (
          <EmptyState
            title="Aucune notification"
            subtitle="Les notifications (validations, alertes…) apparaîtront ici."
          />
        ) : (
          <div className="grid gap-4 md:grid-cols-2">
            {notifications.map((n, i) => {
              const isPred = ["prediction_validated", "prediction_reached"].includes(n.type);
              const isSuccess = (n.message || "").includes("✅") || String(n.outcome || "").toLowerCase() === "success";
              const canOpen = !!n.related_prediction_id;

              const extraClass = isPred
                ? `notif-attractive ${isSuccess ? "notif-success" : "notif-failure"}`
                : "";

              return (
                <Card
                  key={n.id || i}
                  hover={!isPred} /* évite conflit hover transform avec animation */
                  onClick={() => canOpen && onOpenPrediction?.(n.related_prediction_id)}
                  className={`${!n.read ? "border-[#D4AF37]/35 bg-[#141414]" : ""} ${extraClass} ${canOpen ? "cursor-pointer" : ""}`}
                >
                  <div className="flex items-start justify-between gap-3">
                    <div className="min-w-0">
                      <div className="text-sm font-bold text-white safe-wrap">
                        {n.title || "Notification"}
                      </div>
                      <div className="text-xs text-gray-300 mt-2 whitespace-pre-line safe-wrap">
                        {n.message || ""}
                      </div>
                      <div className="text-[11px] text-gray-500 mt-3 flex items-center gap-2 flex-wrap">
                        <span>{formatDateTime(n.timestamp || n.created_at)}</span>
                        {canOpen && <Badge color="gold">Voir détails</Badge>}
                      </div>
                    </div>
                    {!n.read && <Badge color="gold">Nouveau</Badge>}
                  </div>
                </Card>
              );
            })}
          </div>
        )}
      </div>
    );

    // =======================================================
    // MOBILE BOTTOM TABS (mobile uniquement)
    // =======================================================
    const MobileBottomTabs = ({ selectedTab, setSelectedTab, unreadCount, upcomingCount, liveCount }) => {
      const items = [
        { key: "live", label: "Live", icon: "bolt", count: liveCount },
        { key: "upcoming", label: "À venir", icon: "calendar", count: upcomingCount },
        { key: "history", label: "Historique", icon: "history" },
        { key: "notifications", label: "Notifs", icon: "bell", count: unreadCount, danger: true },
      ];

      return (
        <nav className="fixed bottom-0 left-0 right-0 z-50 md:hidden glass border-t border-[#1e1e1e]">
          <div className="max-w-7xl mx-auto px-2 py-2" style={{ paddingBottom: "calc(0.5rem + env(safe-area-inset-bottom))" }}>
            <div className="grid grid-cols-4 gap-2">
              {items.map((it) => {
                const active = selectedTab === it.key;
                return (
                  <button
                    key={it.key}
                    onClick={() => setSelectedTab(it.key)}
                    className={`relative flex flex-col items-center justify-center gap-1 py-2 rounded-2xl transition-colors ${
                      active ? "bg-[#D4AF37] text-black" : "text-gray-300 hover:bg-white/5"
                    }`}
                    type="button"
                  >
                    <Icon
                      name={it.icon}
                      size={16}
                      className={active ? "" : "text-[#D4AF37]"}
                    />
                    <span className="text-[10px] font-extrabold">{it.label}</span>

                    {safeNumber(it.count, 0) > 0 && (
                      <span
                        className={`absolute top-1 right-2 min-w-[18px] h-[18px] px-1 rounded-full text-[10px] font-extrabold text-white ${
                          it.danger ? "bg-red-500" : "bg-[#D4AF37]"
                        }`}
                      >
                        {it.count}
                      </span>
                    )}
                  </button>
                );
              })}
            </div>
          </div>
        </nav>
      );
    };

    // =======================================================
    // APP
    // =======================================================
    const App = () => {
      const [userId] = useState(() => getUserId());

      const [liveMatches, setLiveMatches] = useState([]);
      const [opportunities, setOpportunities] = useState([]);
      const [scheduledMatches, setScheduledMatches] = useState([]);
      const [history, setHistory] = useState([]);
      const [notifications, setNotifications] = useState([]);

      const [stats, setStats] = useState({ matches_live: 0, predictions: 0, upcoming: 0 });

      const [loading, setLoading] = useState(true);
      const [refreshing, setRefreshing] = useState(false);
      const [error, setError] = useState(null);

      const [selectedTab, setSelectedTab] = useState("live"); // live | upcoming | history | notifications
      const [selectedMatch, setSelectedMatch] = useState(null);
      const [selectedPrediction, setSelectedPrediction] = useState(null);
      const [toast, setToast] = useState(null);

      useEffect(() => {
        setSelectedMatch(null);
        setSelectedPrediction(null);
      }, [selectedTab]);

      const apiFetch = useCallback(async (endpoint) => {
        const url = `${EDGE_FUNCTION_URL}${endpoint}`;
        const res = await fetch(url);
        if (!res.ok) {
          let message = `Erreur API ${res.status}`;
          try {
            const err = await res.json();
            if (err?.error) message = err.error;
          } catch (_) {}
          throw new Error(message);
        }
        return res;
      }, []);

      const fetchAll = useCallback(async (silent = false) => {
        if (!silent) setLoading(true);
        setRefreshing(true);
        try {
          const [matchesRes, oppRes, notifRes, historyRes, todayRes] = await Promise.all([
            apiFetch("/matches"),
            apiFetch("/opportunities"),
            apiFetch(`/notifications?user_id=${encodeURIComponent(userId)}`),
            apiFetch("/predictions/history"),
            apiFetch("/today")
          ]);

          const matchesData = await matchesRes.json();
          const oppData = await oppRes.json();
          const notifData = await notifRes.json();
          const historyData = await historyRes.json();
          const todayData = await todayRes.json();

          const matches = matchesData.matches || [];
          const opps = oppData.opportunities || [];
          const notifs = notifData.notifications || [];
          const hist = historyData.history || [];
          const scheduled = todayData?.data?.scheduled?.matches || [];

          setLiveMatches(matches);
          setOpportunities(opps);
          setNotifications(notifs);
          setHistory(hist);
          setScheduledMatches(scheduled);

          const predictionsCount = matches.reduce(
            (acc, m) => acc + ((m.predictions || []).length > 0 ? 1 : 0),
            0
          );

          setStats({
            matches_live: matches.length,
            predictions: predictionsCount,
            upcoming: scheduled.length
          });

          setError(null);
        } catch (e) {
          console.error(e);
          setError(e?.message || "Impossible de charger les données live.");
        } finally {
          setLoading(false);
          setRefreshing(false);
        }
      }, [apiFetch, userId]);

      useEffect(() => { fetchAll(false); }, [fetchAll]);

      useEffect(() => {
        const interval = setInterval(() => {
          fetchAll(true).catch(console.error);
        }, 20000);
        return () => clearInterval(interval);
      }, [fetchAll]);

      // realtime notifications (toast)
      useEffect(() => {
        if (!supabase) return;
        const channel = supabase
          .channel("notifications-channel")
          .on(
            "postgres_changes",
            { event: "INSERT", schema: "public", table: "notifications" },
            (payload) => {
              const notif = payload.new;
              if (notif.user_id === "all" || notif.user_id === userId) {
                const normalized = { ...notif, timestamp: new Date(notif.created_at).getTime() };
                setNotifications((prev) => [normalized, ...prev].slice(0, 50));
                setToast({ title: notif.title, message: notif.message });
                setTimeout(() => setToast(null), 6000);
              }
            }
          )
          .subscribe();

        return () => { supabase.removeChannel(channel); };
      }, [userId]);

      const unreadCount = notifications.filter((n) => !n.read).length;

      const bestOpportunity = useMemo(() => opportunities?.[0] || null, [opportunities]);

      const otherOpportunities = useMemo(() => {
        if (!bestOpportunity) return opportunities || [];
        const bestId = String(bestOpportunity.id);
        return (opportunities || []).filter((o) => String(o.id) !== bestId);
      }, [opportunities, bestOpportunity]);

      const liveMatchesWithoutOpportunities = useMemo(() => {
        const oppIds = new Set((opportunities || []).map((o) => String(o.id)));
        return (liveMatches || []).filter((m) => !oppIds.has(String(m.id)));
      }, [liveMatches, opportunities]);

      const clearNotifications = async () => {
        try {
          const ids = notifications.filter(n => !n.read).map(n => n.id);
          if (!ids.length) return;
          await fetch(`${EDGE_FUNCTION_URL}/notifications/mark-read`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ notification_ids: ids, user_id: userId })
          });
          setNotifications((prev) => prev.map((n) => ({ ...n, read: true })));
        } catch (e) {
          console.error(e);
        }
      };

      // ✅ ouvrir détail historique via ID (clic notif)
      const openPredictionById = useCallback(async (predictionId) => {
        if (!predictionId) return;

        const local = (history || []).find(h => String(h.id) === String(predictionId));
        if (local) {
          setSelectedPrediction(local);
          return;
        }

        // Si tu ajoutes la route /predictions/by-id côté Edge Function, ça marche même hors des 48h
        try {
          const res = await apiFetch(`/predictions/by-id?id=${encodeURIComponent(predictionId)}`);
          const data = await res.json();
          if (data?.prediction) setSelectedPrediction(data.prediction);
          else alert("Détail indisponible.");
        } catch (e) {
          console.error(e);
          alert("Impossible d’ouvrir le détail de cette prédiction.");
        }
      }, [history, apiFetch]);

      // ✅ Tabs sur PC
      const DesktopTabs = () => {
        const tabs = [
          { key: "live", label: "Live", count: stats.matches_live || liveMatches.length },
          { key: "upcoming", label: "À venir", count: stats.upcoming || scheduledMatches.length },
          { key: "history", label: "Historique" },
          { key: "notifications", label: "Notifications", count: unreadCount, danger: true },
        ];

        return (
          <div className="hidden md:flex gap-3 mb-6 flex-wrap">
            {tabs.map(t => (
              <button
                key={t.key}
                onClick={() => setSelectedTab(t.key)}
                className={`relative px-4 py-2 rounded-xl font-semibold transition-colors ${
                  selectedTab === t.key
                    ? "bg-[#D4AF37] text-black"
                    : "bg-[#151515] text-gray-300 border border-[#252525]"
                }`}
                type="button"
              >
                {t.label}
                {safeNumber(t.count, 0) > 0 && (
                  <span
                    className={`ml-2 inline-flex items-center justify-center min-w-[18px] h-[18px] px-1 rounded-full text-white text-[10px] font-bold align-middle ${
                      t.danger ? "bg-red-500" : "bg-[#D4AF37]"
                    }`}
                  >
                    {t.count}
                  </span>
                )}
              </button>
            ))}
          </div>
        );
      };

      if (error && !loading) {
        return (
          <div className="min-h-screen flex items-center justify-center px-4">
            <div className="text-center">
              <div className="text-red-500 text-xl mb-3">Erreur</div>
              <div className="text-gray-400 mb-4 safe-wrap">{error}</div>
              <button
                onClick={() => fetchAll(false)}
                className="px-4 py-2 bg-[#D4AF37] text-black rounded-lg font-bold"
                type="button"
              >
                Réessayer
              </button>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-[#0a0a0a]">
          <Header
            stats={stats}
            onBack={() => window.location.href = "index.html"}
            onRefresh={() => fetchAll(true)}
            refreshing={refreshing}
          />

          <main className="max-w-7xl mx-auto px-4 py-6 pb-28 md:pb-6">
            {!selectedMatch && !selectedPrediction && (
              <>
                <CompactHero
                  stats={stats}
                  topPredictionCount={opportunities.length || 0}
                  upcomingCount={scheduledMatches.length || 0}
                />

                <DesktopTabs />

                {loading ? (
                  <div className="py-20 text-center">
                    <div className="w-12 h-12 border-4 border-[#D4AF37] border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
                    <div className="text-gray-400">Chargement...</div>
                  </div>
                ) : (
                  <>
                    {/* ===========================
                        ONGLET LIVE
                       =========================== */}
                    {selectedTab === "live" && (
                      <>
                        {bestOpportunity && (
                          <div className="mb-8">
                            <div className="text-lg font-bold mb-4 flex items-center gap-2">
                              <Icon name="star" className="text-[#D4AF37]" />
                              Top opportunity
                            </div>
                            <OpportunityCard item={bestOpportunity} onOpen={setSelectedMatch} />
                          </div>
                        )}

                        <div className="mb-8">
                          <div className="text-lg font-bold mb-4 flex items-center gap-2">
                            <Icon name="target" className="text-[#D4AF37]" />
                            Pronostics live
                          </div>

                          {(otherOpportunities || []).length === 0 ? (
                            <EmptyState
                              title={bestOpportunity ? "Aucune autre opportunité" : "Aucun pronostic premium"}
                              subtitle={bestOpportunity
                                ? "L'opportunité principale est affichée en haut."
                                : "Le moteur live attend un contexte suffisamment fiable."
                              }
                            />
                          ) : (
                            <div className="grid gap-4 md:grid-cols-2">
                              {otherOpportunities.map((item) => (
                                <OpportunityCard
                                  key={item.id || `${item.home_team}-${item.away_team}-${item.current_minute}`}
                                  item={item}
                                  onOpen={setSelectedMatch}
                                />
                              ))}
                            </div>
                          )}
                        </div>

                        <div className="mb-8">
                          <div className="text-lg font-bold mb-4 flex items-center gap-2">
                            <Icon name="radio" className="text-red-500" />
                            Tous les matchs live
                          </div>

                          {(liveMatchesWithoutOpportunities || []).length === 0 ? (
                            <EmptyState
                              title="Aucun autre match live"
                              subtitle="Tous les matchs live ont déjà une opportunité affichée plus haut."
                            />
                          ) : (
                            <div className="grid gap-4 md:grid-cols-2">
                              {liveMatchesWithoutOpportunities.map((m) => (
                                <MatchCard key={m.id} match={m} onOpen={setSelectedMatch} />
                              ))}
                            </div>
                          )}
                        </div>
                      </>
                    )}

                    {/* ===========================
                        ONGLET À VENIR
                       =========================== */}
                    {selectedTab === "upcoming" && (
                      <div className="mb-8">
                        <div className="text-lg font-bold mb-4 flex items-center gap-2">
                          <Icon name="calendar" className="text-blue-400" />
                          Matchs à venir
                        </div>

                        {scheduledMatches.length === 0 ? (
                          <EmptyState
                            title="Aucun match à venir"
                            subtitle="Aucun match programmé sur la période actuelle."
                          />
                        ) : (
                          <div className="grid gap-4 md:grid-cols-2 lg:grid-cols-3">
                            {scheduledMatches.slice(0, 24).map((m) => (
                              <UpcomingMatchCard key={m.id} match={m} />
                            ))}
                          </div>
                        )}
                      </div>
                    )}

                    {/* ===========================
                        ONGLET HISTORIQUE (cards style MatchCard)
                       =========================== */}
                    {selectedTab === "history" && (
                      <div>
                        <div className="text-lg font-bold mb-4 flex items-center gap-2">
                          <Icon name="history" className="text-[#D4AF37]" />
                          Historique des pronostics
                        </div>

                        {history.length === 0 ? (
                          <EmptyState
                            title="Aucun historique"
                            subtitle="Les validations apparaîtront ici dès qu'un pronostic sera créé."
                          />
                        ) : (
                          <div className="grid gap-4 md:grid-cols-2">
                            {history.map((h, i) => (
                              <HistoryMatchCard key={h.id || i} h={h} onOpen={setSelectedPrediction} />
                            ))}
                          </div>
                        )}
                      </div>
                    )}

                    {/* ===========================
                        ONGLET NOTIFICATIONS (cards + click => detail)
                       =========================== */}
                    {selectedTab === "notifications" && (
                      <NotificationsPanel
                        notifications={notifications}
                        unreadCount={unreadCount}
                        onClear={clearNotifications}
                        onOpenPrediction={openPredictionById}
                      />
                    )}
                  </>
                )}
              </>
            )}

            {selectedMatch && (
              <MatchDetail
                match={selectedMatch}
                onClose={() => setSelectedMatch(null)}
              />
            )}

            {selectedPrediction && (
              <PredictionDetail
                item={selectedPrediction}
                onClose={() => setSelectedPrediction(null)}
              />
            )}
          </main>

          {/* ✅ bottom nav mobile */}
          <MobileBottomTabs
            selectedTab={selectedTab}
            setSelectedTab={setSelectedTab}
            unreadCount={unreadCount}
            upcomingCount={scheduledMatches.length}
            liveCount={stats.matches_live || liveMatches.length}
          />

          {toast && (
            <div className="fixed top-4 right-3 left-3 md:left-auto md:right-4 z-50 md:w-full md:max-w-sm bg-[#121212] border border-[#2b2b2b] border-l-4 border-[#D4AF37] rounded-2xl shadow-2xl p-4">
              <div className="flex items-start gap-3">
                <div className="w-9 h-9 rounded-xl bg-[#D4AF37]/12 border border-[#D4AF37]/25 flex items-center justify-center shrink-0">
                  <Icon name="bell" className="text-[#D4AF37]" />
                </div>
                <div className="flex-1 min-w-0">
                  <div className="font-bold text-sm">{toast.title}</div>
                  <div className="text-xs text-gray-300 mt-1 whitespace-pre-line safe-wrap">{toast.message}</div>
                </div>
                <button onClick={() => setToast(null)} className="text-gray-500 hover:text-white shrink-0" type="button">
                  <Icon name="x" />
                </button>
              </div>
            </div>
          )}
        </div>
      );
    };

    // =======================================================
    // RENDER (Share Gate)
    // =======================================================
    ReactDOM.createRoot(document.getElementById("root")).render(
      <ShareGate>
        <App />
      </ShareGate>
    );
  </script>
</body>
</html>
