<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
  <title>MrXPRONOS LIVE - VIP</title>

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <style>
    body { background:#0a0a0a; color:#e5e5e5; margin:0; font-family:Inter,sans-serif; }
    .gold-gradient {
      background: linear-gradient(135deg, #D4AF37 0%, #f5e7a3 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .card-hover { transition: all .25s ease; }
    .card-hover:hover { transform: translateY(-2px); border-color:#D4AF37; }
    .live-pulse { animation:pulse-live 2s infinite; }
    @keyframes pulse-live { 0%,100%{opacity:1} 50%{opacity:.4} }
    .vip-locked-overlay {
      position:fixed; inset:0; background:rgba(0,0,0,.95); z-index:9999;
      display:flex; align-items:center; justify-content:center; padding:20px;
    }
    .vip-locked-content {
      background:#121212; border:2px solid #D4AF37; border-radius:24px;
      padding:28px; max-width:420px; width:100%; text-align:center;
      box-shadow:0 0 30px rgba(212,175,55,.25);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const SUPABASE_URL = 'https://nhwafcpndlufzzxexikh.supabase.co';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
    const EDGE_FUNCTION_URL = `${SUPABASE_URL}/functions/v1/live`;
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const { useState, useEffect, useCallback, useMemo } = React;

    const Icon = ({ name, size = 18, className = "" }) => {
      const map = {
        bell: "fa-bell",
        x: "fa-times",
        target: "fa-bullseye",
        radio: "fa-broadcast-tower",
        history: "fa-history",
        clock: "fa-clock",
        star: "fa-star",
        arrowLeft: "fa-arrow-left",
        chart: "fa-chart-line",
        refresh: "fa-rotate-right"
      };
      return <i className={`fas ${map[name] || "fa-circle"} ${className}`} style={{ fontSize: size }} />;
    };

    const Card = ({ children, className = "", onClick }) => (
      <div
        onClick={onClick}
        className={`bg-[#121212] border border-[#2a2a2a] rounded-xl p-4 card-hover ${onClick ? "cursor-pointer" : ""} ${className}`}
      >
        {children}
      </div>
    );

    const Badge = ({ children, color = "gray" }) => {
      const colors = {
        green: "bg-green-500/20 text-green-400 border-green-500/40",
        blue: "bg-blue-500/20 text-blue-400 border-blue-500/40",
        red: "bg-red-500/20 text-red-400 border-red-500/40",
        orange: "bg-orange-500/20 text-orange-400 border-orange-500/40",
        yellow: "bg-yellow-500/20 text-yellow-400 border-yellow-500/40",
        gold: "bg-[#D4AF37]/20 text-[#D4AF37] border-[#D4AF37]/40",
        gray: "bg-gray-500/20 text-gray-300 border-gray-500/40"
      };
      return <span className={`px-2 py-1 text-xs rounded-full border ${colors[color] || colors.gray}`}>{children}</span>;
    };

    const ScoreBar = ({ value, label, color = "#D4AF37" }) => (
      <div>
        <div className="flex justify-between mb-1 text-xs">
          <span className="text-gray-400">{label}</span>
          <span className="font-bold" style={{ color }}>{value}</span>
        </div>
        <div className="h-2 rounded-full bg-[#2a2a2a] overflow-hidden">
          <div className="h-full rounded-full" style={{ width: `${Math.min(value,100)}%`, background: color }} />
        </div>
      </div>
    );

    const PredictionBadge = ({ pred }) => {
      const colorMap = {
        green: "green",
        orange: "orange",
        yellow: "yellow"
      };
      return <Badge color={colorMap[pred.color] || "gold"}>{pred.badge || pred.title}</Badge>;
    };

    const VipLockOverlay = ({ onSubmit }) => {
      const [code, setCode] = useState("");
      const [error, setError] = useState("");

      const submit = (e) => {
        e.preventDefault();
        if (!code.trim()) {
          setError("Veuillez entrer votre code VIP");
          return;
        }
        setError("");
        onSubmit(code.trim());
      };

      return (
        <div className="vip-locked-overlay">
          <div className="vip-locked-content">
            <h2 className="text-3xl font-bold gold-gradient mb-3">🔒 LIVE VIP</h2>
            <p className="text-sm text-gray-300 mb-5">
              Accès aux signaux live statistiques les plus simples :
              corners, fautes et tirs.
            </p>

            <div className="space-y-2 mb-5 text-left text-sm">
              <div className="bg-[#0a0a0a] p-3 rounded-xl border border-[#2a2a2a]">
                <div className="text-yellow-400 font-bold">📐 Over 11.5 corners — 84%</div>
                <div className="text-gray-400 text-xs">Actuel: 8 • Projection: 13 • Fiabilité: 75</div>
              </div>
              <div className="bg-[#0a0a0a] p-3 rounded-xl border border-[#2a2a2a]">
                <div className="text-green-400 font-bold">🎯 Over 29.5 tirs — 82%</div>
                <div className="text-gray-400 text-xs">Actuel: 20 • Projection: 31 • Fiabilité: 74</div>
              </div>
            </div>

            <form onSubmit={submit} className="space-y-3">
              <input
                value={code}
                onChange={(e) => setCode(e.target.value)}
                placeholder="Entrez votre code VIP"
                className="w-full px-4 py-3 rounded-full bg-[#0a0a0a] border border-[#D4AF37] text-white text-center outline-none"
              />
              {error && <div className="text-red-500 text-sm">{error}</div>}
              <button className="w-full py-3 rounded-full bg-[#D4AF37] text-black font-bold">Activer</button>
            </form>
          </div>
        </div>
      );
    };

    const Header = ({ stats, notifications, unreadCount, onClear, onBack, onRefresh, refreshing }) => {
      const [open, setOpen] = useState(false);

      return (
        <header className="sticky top-0 z-40 bg-[#0a0a0a]/95 backdrop-blur border-b border-[#2a2a2a]">
          <div className="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between gap-3">
            <div className="flex items-center gap-3">
              <button onClick={onBack} className="p-2 rounded-lg hover:bg-[#1a1a1a]">
                <Icon name="arrowLeft" />
              </button>
              <div>
                <div className="text-xl font-bold gold-gradient">MrXPRONOS LIVE</div>
                <div className="text-xs text-gray-400">
                  {stats.matches_live || 0} live • {stats.matches_scheduled || 0} à venir
                </div>
              </div>
            </div>

            <div className="flex items-center gap-2">
              <button onClick={onRefresh} className="p-2 rounded-lg hover:bg-[#1a1a1a]">
                <Icon name="refresh" className={refreshing ? "animate-spin text-[#D4AF37]" : ""} />
              </button>

              <div className="relative">
                <button onClick={() => setOpen(!open)} className="p-2 rounded-lg hover:bg-[#1a1a1a] relative">
                  <Icon name="bell" />
                  {unreadCount > 0 && (
                    <span className="absolute -top-1 -right-1 w-5 h-5 rounded-full bg-red-500 text-white text-xs flex items-center justify-center">
                      {unreadCount}
                    </span>
                  )}
                </button>

                {open && (
                  <div className="absolute right-0 mt-2 w-80 bg-[#121212] border border-[#2a2a2a] rounded-xl shadow-2xl z-50">
                    <div className="p-3 flex items-center justify-between border-b border-[#2a2a2a]">
                      <div className="font-bold text-sm">Notifications</div>
                      <button onClick={onClear} className="text-xs text-gray-400 hover:text-white">Tout lire</button>
                    </div>
                    <div className="max-h-96 overflow-y-auto">
                      {notifications.length === 0 ? (
                        <div className="p-4 text-sm text-gray-500 text-center">Aucune notification</div>
                      ) : notifications.map((n) => (
                        <div key={n.id} className={`p-3 border-b border-[#2a2a2a] ${!n.read ? "bg-[#1a1a1a]" : ""}`}>
                          <div className="text-sm font-semibold">{n.title}</div>
                          <div className="text-xs text-gray-400 mt-1">{n.message}</div>
                          <div className="text-[10px] text-gray-500 mt-1">
                            {new Date(n.created_at).toLocaleString("fr-FR")}
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            </div>
          </div>
        </header>
      );
    };

    const OpportunityCard = ({ item, onOpen }) => {
      const best = item.predictions?.[0];
      if (!best) return null;

      return (
        <Card onClick={() => onOpen(item)} className="border-[#D4AF37]/30">
          <div className="flex items-center justify-between mb-3 flex-wrap gap-2">
            <PredictionBadge pred={best} />
            <Badge color="gold">TOP {item.value_score || 0}</Badge>
          </div>

          <div className="flex items-center justify-between mb-3">
            <div className="font-bold text-white text-sm md:text-base">{item.home_team}</div>
            <div className="px-3 py-1 rounded-lg bg-[#0a0a0a] border border-[#D4AF37] text-[#D4AF37] font-bold text-sm">
              {item.home_score}-{item.away_score} • {item.current_minute}'
            </div>
            <div className="font-bold text-white text-sm md:text-base">{item.away_team}</div>
          </div>

          <div className="text-sm font-semibold text-white mb-1">{best.title}</div>
          <div className="text-sm text-[#D4AF37] mb-2">{best.message}</div>

          <div className="text-xs text-gray-300 mb-3">
            Actuel: <strong>{best.current ?? "-"}</strong> • Projection: <strong>{Math.round(best.projected ?? 0)}</strong> • Seuil: <strong>{best.threshold ?? "-"}</strong>
          </div>

          <div className="grid grid-cols-2 gap-3 mb-3">
            <ScoreBar value={Math.round((best.probability || 0) * 100)} label="Probabilité" color="#22C55E" />
            <ScoreBar value={best.reliability || 0} label="Fiabilité" color="#D4AF37" />
          </div>

          <div className="space-y-1">
            {(best.reasons || []).slice(0, 3).map((r, i) => (
              <div key={i} className="text-xs text-gray-300">• {r}</div>
            ))}
          </div>
        </Card>
      );
    };

    const LiveMatchCard = ({ match, onOpen }) => {
      const best = match.predictions?.[0] || null;
      const totalCorners = (match.live_stats?.home?.corner_kicks || 0) + (match.live_stats?.away?.corner_kicks || 0);
      const totalFouls = (match.live_stats?.home?.fouls || 0) + (match.live_stats?.away?.fouls || 0);
      const totalShots = (match.live_stats?.home?.total_shots || 0) + (match.live_stats?.away?.total_shots || 0);

      return (
        <Card onClick={() => onOpen(match)}>
          <div className="flex items-center justify-between mb-3">
            <div className="flex items-center gap-2">
              <span className="w-2 h-2 bg-red-500 rounded-full live-pulse"></span>
              <span className="text-red-500 text-xs font-bold">LIVE {match.current_minute || 0}'</span>
            </div>
            <Badge color="gray">{match.league?.name || "Match live"}</Badge>
          </div>

          <div className="flex justify-between items-center mb-3">
            <div className="flex-1 text-right pr-3">
              <div className="font-semibold text-sm">{match.home_team}</div>
            </div>
            <div className="px-3 py-2 rounded-lg bg-[#0a0a0a] border border-[#2a2a2a] font-bold text-sm">
              {match.home_score}-{match.away_score}
            </div>
            <div className="flex-1 pl-3">
              <div className="font-semibold text-sm">{match.away_team}</div>
            </div>
          </div>

          <div className="grid grid-cols-3 gap-2 mb-3 text-center">
            <div className="bg-[#0a0a0a] rounded-lg p-2 border border-[#2a2a2a]">
              <div className="text-xs text-gray-500">Corners</div>
              <div className="font-bold">{totalCorners}</div>
            </div>
            <div className="bg-[#0a0a0a] rounded-lg p-2 border border-[#2a2a2a]">
              <div className="text-xs text-gray-500">Fautes</div>
              <div className="font-bold">{totalFouls}</div>
            </div>
            <div className="bg-[#0a0a0a] rounded-lg p-2 border border-[#2a2a2a]">
              <div className="text-xs text-gray-500">Tirs</div>
              <div className="font-bold">{totalShots}</div>
            </div>
          </div>

          {best ? (
            <div className="pt-3 border-t border-[#2a2a2a]">
              <div className="flex items-center gap-2 mb-2 flex-wrap">
                <PredictionBadge pred={best} />
                <Badge color="green">{Math.round((best.probability || 0) * 100)}%</Badge>
              </div>

              <div className="text-sm text-white font-semibold">{best.title}</div>
              <div className="text-xs text-[#D4AF37] mt-1">{best.message}</div>
              <div className="text-xs text-gray-400 mt-2">
                Actuel: {best.current ?? "-"} • Projection: {Math.round(best.projected ?? 0)} • Seuil: {best.threshold ?? "-"}
              </div>
            </div>
          ) : (
            <div className="pt-3 border-t border-[#2a2a2a] text-xs text-gray-500">
              Aucun signal fiable pour le moment
            </div>
          )}
        </Card>
      );
    };

    const MatchDetail = ({ match, onClose }) => {
      const [tab, setTab] = useState("signals");
      if (!match) return null;

      const totalCorners = (match.live_stats?.home?.corner_kicks || 0) + (match.live_stats?.away?.corner_kicks || 0);
      const totalFouls = (match.live_stats?.home?.fouls || 0) + (match.live_stats?.away?.fouls || 0);
      const totalShots = (match.live_stats?.home?.total_shots || 0) + (match.live_stats?.away?.total_shots || 0);

      return (
        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-[#121212] border border-[#2a2a2a] rounded-2xl w-full max-w-4xl max-h-[92vh] overflow-hidden">
            <div className="p-5 border-b border-[#2a2a2a]">
              <div className="flex justify-between items-start">
                <div>
                  <div className="flex items-center gap-2 mb-2">
                    <span className="w-2 h-2 bg-red-500 rounded-full live-pulse"></span>
                    <span className="text-red-500 text-sm font-bold">LIVE {match.current_minute || 0}'</span>
                    <span className="text-gray-500">|</span>
                    <span className="text-gray-400 text-sm">{match.league?.name || ""}</span>
                  </div>
                  <div className="text-xl md:text-2xl font-bold">
                    {match.home_team} <span className="gold-gradient">vs</span> {match.away_team}
                  </div>
                </div>
                <button onClick={onClose} className="p-2 rounded-lg hover:bg-[#1a1a1a]">
                  <Icon name="x" />
                </button>
              </div>

              <div className="flex justify-center items-center gap-6 mt-5">
                <div className="text-4xl font-bold gold-gradient">{match.home_score}</div>
                <div className="text-gray-500">-</div>
                <div className="text-4xl font-bold gold-gradient">{match.away_score}</div>
              </div>
            </div>

            <div className="flex border-b border-[#2a2a2a]">
              {["signals", "stats"].map(t => (
                <button
                  key={t}
                  onClick={() => setTab(t)}
                  className={`flex-1 py-3 text-sm capitalize ${tab === t ? "text-[#D4AF37] border-b-2 border-[#D4AF37]" : "text-gray-400"}`}
                >
                  {t}
                </button>
              ))}
            </div>

            <div className="p-5 overflow-y-auto max-h-[60vh]">
              {tab === "signals" && (
                <div className="space-y-4">
                  {(match.predictions || []).length === 0 ? (
                    <div className="text-center text-gray-500 py-8">Aucun signal fiable actuellement</div>
                  ) : (
                    (match.predictions || []).map((p, i) => (
                      <div key={i} className="bg-[#0a0a0a] rounded-xl p-4 border border-[#2a2a2a]">
                        <div className="flex items-center justify-between mb-3 flex-wrap gap-2">
                          <div className="flex gap-2 items-center flex-wrap">
                            <PredictionBadge pred={p} />
                            <div className="font-bold">{p.title}</div>
                          </div>
                          <div className="flex gap-2">
                            <Badge color="green">{Math.round((p.probability || 0) * 100)}%</Badge>
                            <Badge color="gold">Fiabilité {p.reliability || 0}</Badge>
                          </div>
                        </div>

                        <div className="text-sm text-[#D4AF37] mb-2">{p.message}</div>

                        <div className="text-xs text-gray-300 mb-3">
                          Actuel: <strong>{p.current ?? "-"}</strong> • Projection: <strong>{Math.round(p.projected ?? 0)}</strong> • Seuil: <strong>{p.threshold ?? "-"}</strong>
                        </div>

                        <div className="grid grid-cols-2 gap-3 mb-3">
                          <ScoreBar value={Math.round((p.probability || 0) * 100)} label="Probabilité" color="#22C55E" />
                          <ScoreBar value={p.reliability || 0} label="Fiabilité" color="#D4AF37" />
                        </div>

                        <div className="space-y-1">
                          {(p.reasons || []).slice(0, 5).map((r, idx) => (
                            <div key={idx} className="text-sm text-gray-300">• {r}</div>
                          ))}
                        </div>
                      </div>
                    ))
                  )}
                </div>
              )}

              {tab === "stats" && (
                <div className="space-y-4">
                  <ScoreBar value={match.reliability_score || 0} label="Fiabilité" color="#3B82F6" />
                  <ScoreBar value={match.data_quality_score || 0} label="Qualité données" color="#8B5CF6" />
                  <ScoreBar value={match.value_score || 0} label="Value Score" color="#D4AF37" />

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <Card>
                      <div className="text-xs text-gray-400 mb-2">Stats clés</div>
                      <div className="text-sm">Corners: {totalCorners}</div>
                      <div className="text-sm">Fautes: {totalFouls}</div>
                      <div className="text-sm">Tirs: {totalShots}</div>
                    </Card>

                    <Card>
                      <div className="text-xs text-gray-400 mb-2">Momentum</div>
                      <div className="text-sm">{match.home_team}: {match.momentum_index?.home_ratio || 0}%</div>
                      <div className="text-sm">{match.away_team}: {match.momentum_index?.away_ratio || 0}%</div>
                      <div className="text-xs text-gray-500 mt-2">
                        Intensité: {match.momentum_index?.total || 0}
                      </div>
                    </Card>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                    <Card>
                      <div className="text-xs text-gray-500 mb-1">{match.home_team}</div>
                      <div className="text-sm">Corners: {match.live_stats?.home?.corner_kicks || 0}</div>
                      <div className="text-sm">Fautes: {match.live_stats?.home?.fouls || 0}</div>
                      <div className="text-sm">Tirs: {match.live_stats?.home?.total_shots || 0}</div>
                    </Card>

                    <Card>
                      <div className="text-xs text-gray-500 mb-1">Résumé</div>
                      <div className="text-sm">Minute: {match.current_minute || 0}'</div>
                      <div className="text-sm">Score: {match.home_score}-{match.away_score}</div>
                      <div className="text-sm">Ligue: {match.league?.name || "-"}</div>
                    </Card>

                    <Card>
                      <div className="text-xs text-gray-500 mb-1">{match.away_team}</div>
                      <div className="text-sm">Corners: {match.live_stats?.away?.corner_kicks || 0}</div>
                      <div className="text-sm">Fautes: {match.live_stats?.away?.fouls || 0}</div>
                      <div className="text-sm">Tirs: {match.live_stats?.away?.total_shots || 0}</div>
                    </Card>
                  </div>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    };

    const App = () => {
      const [userId] = useState(() => localStorage.getItem("mrx_user_id") || `user_${Date.now()}`);
      const [vipCode, setVipCode] = useState(() => localStorage.getItem("mx_vip_code") || "");
      const [isVip, setIsVip] = useState(true); // à adapter si tu remets /check-vip
      const [vipChecking, setVipChecking] = useState(false);

      const [liveMatches, setLiveMatches] = useState([]);
      const [opportunities, setOpportunities] = useState([]);
      const [scheduledMatches, setScheduledMatches] = useState([]);
      const [history, setHistory] = useState([]);
      const [notifications, setNotifications] = useState([]);
      const [stats, setStats] = useState({ matches_live: 0, matches_scheduled: 0 });
      const [loading, setLoading] = useState(true);
      const [refreshing, setRefreshing] = useState(false);
      const [error, setError] = useState(null);
      const [selectedTab, setSelectedTab] = useState("live");
      const [selectedMatch, setSelectedMatch] = useState(null);
      const [toast, setToast] = useState(null);

      useEffect(() => {
        localStorage.setItem("mrx_user_id", userId);
      }, [userId]);

      const apiFetch = useCallback(async (endpoint) => {
        const res = await fetch(`${EDGE_FUNCTION_URL}${endpoint}`);
        if (!res.ok) throw new Error(`Erreur API ${res.status}`);
        return res;
      }, []);

      const fetchAll = useCallback(async (silent = false) => {
        if (!silent) setLoading(true);
        setRefreshing(true);

        try {
          const [matchesRes, oppRes, todayRes, notifRes, historyRes] = await Promise.all([
            apiFetch("/matches"),
            apiFetch("/opportunities"),
            apiFetch("/today"),
            apiFetch(`/notifications?user_id=${encodeURIComponent(userId)}`),
            apiFetch("/predictions/history")
          ]);

          const matchesData = await matchesRes.json();
          const oppData = await oppRes.json();
          const todayData = await todayRes.json();
          const notifData = await notifRes.json();
          const historyData = await historyRes.json();

          setLiveMatches(matchesData.matches || []);
          setOpportunities(oppData.opportunities || []);
          setScheduledMatches(todayData?.data?.scheduled?.matches || []);
          setNotifications(notifData.notifications || []);
          setHistory(historyData.history || []);

          setStats({
            matches_live: (matchesData.matches || []).length,
            matches_scheduled: todayData?.data?.scheduled?.count || 0
          });

          setError(null);
        } catch (e) {
          console.error(e);
          setError("Impossible de charger les données live.");
        } finally {
          setLoading(false);
          setRefreshing(false);
        }
      }, [apiFetch, userId]);

      useEffect(() => {
        fetchAll(false);
      }, [fetchAll]);

      useEffect(() => {
        const interval = setInterval(() => {
          fetchAll(true);
        }, 20000);

        return () => clearInterval(interval);
      }, [fetchAll]);

      useEffect(() => {
        const channel = supabase
          .channel("notifications-channel")
          .on("postgres_changes", { event: "INSERT", schema: "public", table: "notifications" }, (payload) => {
            const notif = payload.new;
            if (notif.user_id === "all" || notif.user_id === userId) {
              setToast({ title: notif.title, message: notif.message });
              setTimeout(() => setToast(null), 5000);
              fetchAll(true).catch(console.error);
            }
          })
          .subscribe();

        return () => { supabase.removeChannel(channel); };
      }, [userId, fetchAll]);

      const unreadCount = notifications.filter(n => !n.read).length;
      const bestOpportunity = useMemo(() => opportunities?.[0] || null, [opportunities]);

      const clearNotifications = async () => {
        try {
          const ids = notifications.filter(n => !n.read).map(n => n.id);
          if (!ids.length) return;

          await fetch(`${EDGE_FUNCTION_URL}/notifications/mark-read`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ notification_ids: ids, user_id: userId })
          });

          setNotifications(prev => prev.map(n => ({ ...n, read: true })));
        } catch (e) {
          console.error(e);
        }
      };

      if (vipChecking) {
        return (
          <div className="min-h-screen flex items-center justify-center">
            <div className="text-center">
              <div className="w-12 h-12 border-4 border-[#D4AF37] border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
              <div className="text-gray-400">Vérification de l'accès...</div>
            </div>
          </div>
        );
      }

      if (!isVip) {
        return (
          <VipLockOverlay onSubmit={(code) => {
            localStorage.setItem("mx_vip_code", code);
            setVipCode(code);
            setIsVip(true);
          }} />
        );
      }

      if (error && !loading) {
        return (
          <div className="min-h-screen flex items-center justify-center">
            <div className="text-center">
              <div className="text-red-500 text-xl mb-3">Erreur</div>
              <div className="text-gray-400 mb-4">{error}</div>
              <button
                onClick={() => fetchAll(false)}
                className="px-4 py-2 bg-[#D4AF37] text-black rounded-lg font-bold"
              >
                Réessayer
              </button>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-[#0a0a0a]">
          <Header
            stats={stats}
            notifications={notifications}
            unreadCount={unreadCount}
            onClear={clearNotifications}
            onBack={() => window.location.href = "index.html"}
            onRefresh={() => fetchAll(true)}
            refreshing={refreshing}
          />

          <main className="max-w-7xl mx-auto px-4 py-6">
            {!selectedMatch && (
              <>
                <div className="flex gap-3 mb-6">
                  <button
                    onClick={() => setSelectedTab("live")}
                    className={`px-4 py-2 rounded-lg font-semibold ${selectedTab === "live" ? "bg-[#D4AF37] text-black" : "bg-[#1a1a1a] text-gray-300"}`}
                  >
                    Live
                  </button>
                  <button
                    onClick={() => setSelectedTab("history")}
                    className={`px-4 py-2 rounded-lg font-semibold ${selectedTab === "history" ? "bg-[#D4AF37] text-black" : "bg-[#1a1a1a] text-gray-300"}`}
                  >
                    Historique
                  </button>
                </div>

                {selectedTab === "live" && (
                  loading ? (
                    <div className="py-20 text-center">
                      <div className="w-12 h-12 border-4 border-[#D4AF37] border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
                      <div className="text-gray-400">Chargement des signaux live...</div>
                    </div>
                  ) : (
                    <>
                      <div className="grid grid-cols-3 gap-4 mb-8">
                        <Card className="text-center">
                          <div className="text-3xl font-bold text-red-500">{stats.matches_live || 0}</div>
                          <div className="text-xs text-gray-400">Matchs live</div>
                        </Card>
                        <Card className="text-center">
                          <div className="text-3xl font-bold text-[#D4AF37]">{opportunities.length || 0}</div>
                          <div className="text-xs text-gray-400">Signaux forts</div>
                        </Card>
                        <Card className="text-center">
                          <div className="text-3xl font-bold text-blue-400">{stats.matches_scheduled || 0}</div>
                          <div className="text-xs text-gray-400">Programmés</div>
                        </Card>
                      </div>

                      {bestOpportunity && (
                        <div className="mb-8">
                          <div className="text-lg font-bold mb-4 flex items-center gap-2">
                            <Icon name="star" className="text-[#D4AF37]" />
                            Top opportunité
                          </div>
                          <OpportunityCard item={bestOpportunity} onOpen={setSelectedMatch} />
                        </div>
                      )}

                      <div className="mb-8">
                        <div className="text-lg font-bold mb-4 flex items-center gap-2">
                          <Icon name="target" className="text-[#D4AF37]" />
                          Opportunités live
                        </div>

                        {opportunities.length === 0 ? (
                          <Card className="text-center text-gray-500 py-8">
                            Aucun signal premium pour le moment
                          </Card>
                        ) : (
                          <div className="grid gap-4 md:grid-cols-2">
                            {opportunities.map((item) => (
                              <OpportunityCard key={item.id} item={item} onOpen={setSelectedMatch} />
                            ))}
                          </div>
                        )}
                      </div>

                      <div className="mb-8">
                        <div className="text-lg font-bold mb-4 flex items-center gap-2">
                          <Icon name="radio" className="text-red-500" />
                          Tous les matchs live
                        </div>

                        {liveMatches.length === 0 ? (
                          <Card className="text-center text-gray-500 py-8">
                            Aucun match live pour le moment
                          </Card>
                        ) : (
                          <div className="grid gap-4 md:grid-cols-2">
                            {liveMatches.map((m) => (
                              <LiveMatchCard key={m.id} match={m} onOpen={setSelectedMatch} />
                            ))}
                          </div>
                        )}
                      </div>

                      <div className="mb-8">
                        <div className="text-lg font-bold mb-4 flex items-center gap-2">
                          <Icon name="clock" className="text-[#D4AF37]" />
                          Prochainement
                        </div>

                        {scheduledMatches.length === 0 ? (
                          <Card className="text-center text-gray-500 py-8">
                            Aucun match programmé
                          </Card>
                        ) : (
                          <div className="grid gap-3 md:grid-cols-3">
                            {scheduledMatches.slice(0, 6).map((m) => (
                              <Card key={m.id}>
                                <div className="text-xs text-gray-500 mb-2">{m.league?.name || ""}</div>
                                <div className="font-semibold text-sm">{m.home_team} vs {m.away_team}</div>
                                <div className="text-xs text-gray-400 mt-2">
                                  {m.event_date
                                    ? new Date(m.event_date).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })
                                    : "Heure inconnue"}
                                </div>
                              </Card>
                            ))}
                          </div>
                        )}
                      </div>
                    </>
                  )
                )}

                {selectedTab === "history" && (
                  <div>
                    <div className="text-lg font-bold mb-4 flex items-center gap-2">
                      <Icon name="history" className="text-[#D4AF37]" />
                      Historique des pronostics
                    </div>

                    {history.length === 0 ? (
                      <Card className="text-center text-gray-500 py-8">Aucun historique</Card>
                    ) : (
                      <div className="bg-[#121212] rounded-xl border border-[#2a2a2a] overflow-hidden">
                        <div className="overflow-x-auto">
                          <table className="w-full text-sm">
                            <thead className="bg-[#0a0a0a] border-b border-[#2a2a2a]">
                              <tr>
                                <th className="px-4 py-3 text-left">Match</th>
                                <th className="px-4 py-3 text-left">Type</th>
                                <th className="px-4 py-3 text-left">Seuil</th>
                                <th className="px-4 py-3 text-left">Actuel</th>
                                <th className="px-4 py-3 text-left">Projection</th>
                                <th className="px-4 py-3 text-left">Proba</th>
                                <th className="px-4 py-3 text-left">Résultat</th>
                                <th className="px-4 py-3 text-left">Heure</th>
                              </tr>
                            </thead>
                            <tbody>
                              {history.map((h, i) => (
                                <tr key={i} className="border-b border-[#2a2a2a]">
                                  <td className="px-4 py-3">{h.match}</td>
                                  <td className="px-4 py-3">{h.type}</td>
                                  <td className="px-4 py-3">{h.threshold ?? "-"}</td>
                                  <td className="px-4 py-3">{h.current ?? "-"}</td>
                                  <td className="px-4 py-3">{h.projected ? Math.round(h.projected) : "-"}</td>
                                  <td className="px-4 py-3">{Math.round((h.probability || 0) * 100)}%</td>
                                  <td className="px-4 py-3">
                                    {h.validated
                                      ? <span className={h.outcome === "success" ? "text-green-400" : "text-red-400"}>
                                          {h.outcome === "success" ? "✓ Réussi" : "✗ Échoué"}
                                        </span>
                                      : <span className="text-yellow-400">En attente</span>}
                                  </td>
                                  <td className="px-4 py-3">{new Date(h.timestamp).toLocaleTimeString()}</td>
                                </tr>
                              ))}
                            </tbody>
                          </table>
                        </div>
                      </div>
                    )}
                  </div>
                )}
              </>
            )}

            {selectedMatch && <MatchDetail match={selectedMatch} onClose={() => setSelectedMatch(null)} />}
          </main>

          {toast && (
            <div className="fixed top-4 right-4 z-50 w-full max-w-sm bg-[#121212] border-l-4 border-[#D4AF37] rounded-lg shadow-2xl p-4">
              <div className="flex items-start gap-3">
                <Icon name="bell" className="text-[#D4AF37]" />
                <div className="flex-1">
                  <div className="font-bold text-sm">{toast.title}</div>
                  <div className="text-xs text-gray-400 mt-1">{toast.message}</div>
                </div>
                <button onClick={() => setToast(null)} className="text-gray-500 hover:text-white">
                  <Icon name="x" />
                </button>
              </div>
            </div>
          )}
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
