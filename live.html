  <script>
    function showBootError(message) {
      const root = document.getElementById("root");
      if (!root) return;
      root.innerHTML = `
        <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#090909;color:#f3f4f6;font-family:Arial,sans-serif">
          <div style="max-width:620px;width:100%;padding:24px;border:1px solid rgba(239,68,68,.45);border-radius:20px;background:#121212;box-shadow:0 24px 70px rgba(0,0,0,.7)">
            <div style="font-size:22px;font-weight:800;color:#ef4444;margin-bottom:10px">Erreur de chargement LIVE</div>
            <div style="line-height:1.6;color:#d1d5db;word-break:break-word">${String(message || "Erreur inconnue").replace(/[&<>"\x27]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","\x27":"&#39;"}[ch]))}</div>
            <button onclick="location.reload()" style="margin-top:18px;padding:11px 18px;border:0;border-radius:999px;background:#D4AF37;color:#000;font-weight:800;cursor:pointer">Réessayer</button>
          </div>
        </div>`;
    }

    window.addEventListener("error", function (event) {
      const message = event && event.message ? event.message : "Une ressource ou un script n’a pas pu être chargé.";
      showBootError(message);
    });

    window.addEventListener("unhandledrejection", function (event) {
      const reason = event && event.reason;
      showBootError(reason && reason.message ? reason.message : String(reason || "Promesse rejetée"));
    });
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    * { box-sizing: border-box; font-family: 'Inter', sans-serif; }
    body {
      margin: 0;
      color: #f3f4f6;
      background:
        radial-gradient(circle at top, rgba(212,175,55,.08), transparent 30%),
        linear-gradient(180deg, #090909 0%, #050505 100%);
    }
    .gold-gradient {
      background: linear-gradient(135deg, #D4AF37 0%, #f5e7a3 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .glass { background: rgba(18,18,18,.9); backdrop-filter: blur(12px); }
    .card-hover { transition: all .25s ease; }
    .card-hover:hover {
      transform: translateY(-2px);
      border-color: rgba(212,175,55,.45);
      box-shadow: 0 10px 30px rgba(212,175,55,.08);
    }
    .live-pulse { animation: pulse-live 1.8s infinite; }
    @keyframes pulse-live {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: .4; transform: scale(.9); }
    }
    .custom-scrollbar::-webkit-scrollbar { width: 8px; height: 8px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #0f0f0f; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #2e2e2e; border-radius: 999px; }
    .logo-ring {
      border: 1px solid rgba(255,255,255,.08);
      background: #0b0b0b;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.02);
    }
    .soft-border { border: 1px solid rgba(255,255,255,.06); }
    .mini-dot { width: 7px; height: 7px; border-radius: 999px; display: inline-block; }
    .hero-card {
      background:
        radial-gradient(circle at top right, rgba(212,175,55,.08), transparent 30%),
        #101010;
    }
    .safe-wrap { word-break: break-word; overflow-wrap: anywhere; }

    /* =======================================================
       ✅ PRONOSTIC BOX (pop-out + heartbeat)
       ======================================================= */
    .pronostic-pop{
      position: relative;
      background: radial-gradient(circle at 30% 20%, rgba(212,175,55,.10), transparent 45%),
                  linear-gradient(180deg, #0c0c0c 0%, #080808 100%);
      border: 1px solid rgba(212,175,55,.26);
      border-radius: 18px;
      padding: 12px 14px;
      box-shadow:
        0 26px 70px rgba(0,0,0,.80),
        0 14px 30px rgba(0,0,0,.55),
        0 10px 26px rgba(212,175,55,.12),
        inset 0 1px 0 rgba(255,255,255,.06);
      transition: box-shadow .18s ease, border-color .18s ease;
      overflow: hidden;
    }
    .pronostic-pop::after{
      content:"";
      position:absolute;
      inset:-10px;
      background: radial-gradient(circle at 50% 35%, rgba(212,175,55,.22), transparent 60%);
      filter: blur(10px);
      opacity: .55;
      pointer-events:none;
      z-index: 0;
    }
    .pronostic-pop::before{
      content:"";
      position:absolute;
      inset:0;
      border-radius: 18px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.03);
      pointer-events:none;
      z-index: 0;
    }
    .pronostic-pop > *{ position: relative; z-index: 1; }
    .pronostic-pop:hover{
      border-color: rgba(212,175,55,.45);
      box-shadow:
        0 34px 85px rgba(0,0,0,.85),
        0 18px 38px rgba(0,0,0,.60),
        0 14px 30px rgba(212,175,55,.18),
        inset 0 1px 0 rgba(255,255,255,.08);
    }

    /* ✅ Border pronostic box success/failure (historique validé uniquement) */
    .pronostic-pop--success{
      border-color: rgba(34,197,94,.55) !important;
      box-shadow:
        0 26px 70px rgba(0,0,0,.80),
        0 14px 30px rgba(34,197,94,.14),
        0 10px 26px rgba(34,197,94,.10),
        inset 0 1px 0 rgba(255,255,255,.06);
    }
    .pronostic-pop--failure{
      border-color: rgba(239,68,68,.55) !important;
      box-shadow:
        0 26px 70px rgba(0,0,0,.80),
        0 14px 30px rgba(239,68,68,.14),
        0 10px 26px rgba(239,68,68,.10),
        inset 0 1px 0 rgba(255,255,255,.06);
    }

    @keyframes mx-heartbeat {
      0%   { transform: translateY(0) scale(1); }
      12%  { transform: translateY(-2px) scale(1.02); }
      24%  { transform: translateY(0) scale(0.995); }
      36%  { transform: translateY(-1px) scale(1.012); }
      60%  { transform: translateY(0) scale(1); }
      100% { transform: translateY(0) scale(1); }
    }
    @keyframes mx-glowbeat {
      0%   { opacity: .40; transform: scale(1); }
      12%  { opacity: .70; transform: scale(1.06); }
      24%  { opacity: .45; transform: scale(1.01); }
      36%  { opacity: .62; transform: scale(1.04); }
      60%  { opacity: .40; transform: scale(1); }
      100% { opacity: .40; transform: scale(1); }
    }
    .pronostic-pop--heartbeat{
      animation: mx-heartbeat 1.7s infinite;
      transform-origin: center;
      will-change: transform;
    }
    .pronostic-pop--heartbeat::after{
      animation: mx-glowbeat 1.7s infinite;
      transform-origin: center;
      will-change: transform, opacity;
    }
    @media (prefers-reduced-motion: reduce){
      .pronostic-pop--heartbeat,
      .pronostic-pop--heartbeat::after{
        animation: none !important;
      }
    }

    /* =======================================================
       ✅ NOTIFICATIONS attractive (validated/reached)
       ======================================================= */
    @keyframes notifPulse {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-2px) scale(1.01); }
    }
    @keyframes notifShine {
      0% { transform: translateX(-120%) skewX(-12deg); opacity: 0; }
      15% { opacity: .55; }
      45% { opacity: .15; }
      100% { transform: translateX(220%) skewX(-12deg); opacity: 0; }
    }
    .notif-attractive{
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(212,175,55,.38) !important;
      background:
        radial-gradient(circle at 30% 15%, rgba(212,175,55,.18), transparent 55%),
        linear-gradient(180deg, rgba(20,20,20,.95), rgba(10,10,10,.95));
      box-shadow:
        0 22px 70px rgba(0,0,0,.80),
        0 12px 30px rgba(212,175,55,.10),
        inset 0 1px 0 rgba(255,255,255,.06);
      animation: notifPulse 1.8s infinite;
      will-change: transform;
    }
    .notif-attractive::before{
      content:"";
      position:absolute;
      top:0; left:0;
      width:45%;
      height:100%;
      background: linear-gradient(120deg, transparent, rgba(255,255,255,.10), transparent);
      filter: blur(0.3px);
      animation: notifShine 3.2s infinite;
      pointer-events: none;
    }
    .notif-success{
      border-color: rgba(34,197,94,.45) !important;
      box-shadow:
        0 22px 70px rgba(0,0,0,.80),
        0 12px 30px rgba(34,197,94,.12),
        inset 0 1px 0 rgba(255,255,255,.06);
    }
    .notif-failure{
      border-color: rgba(239,68,68,.45) !important;
      box-shadow:
        0 22px 70px rgba(0,0,0,.80),
        0 12px 30px rgba(239,68,68,.10),
        inset 0 1px 0 rgba(255,255,255,.06);
    }

    /* =======================================================
       ✅ Contours succès/échec (Historique validé uniquement)
       ======================================================= */
    .mx-outline-success{
      border-color: rgba(34,197,94,.45) !important;
      box-shadow: 0 18px 55px rgba(34,197,94,.10), 0 22px 70px rgba(0,0,0,.75);
    }
    .mx-outline-failure{
      border-color: rgba(239,68,68,.45) !important;
      box-shadow: 0 18px 55px rgba(239,68,68,.10), 0 22px 70px rgba(0,0,0,.75);
    }

    /* =======================================================
       ✅ Label bas droite (VALIDÉ/ÉCHOUÉ) - très visible
       ======================================================= */
    .mx-status-stamp{
      position: absolute;
      right: 14px;
      bottom: 14px;
      padding: 10px 14px;
      border-radius: 16px;
      font-weight: 900;
      letter-spacing: .9px;
      font-size: 16px; /* plus grand */
      border: 1px solid rgba(255,255,255,.08);
      background: rgba(0,0,0,.40);
      backdrop-filter: blur(10px);
      text-transform: uppercase;
      text-shadow: 0 10px 25px rgba(0,0,0,.55);
    }
    .mx-status-stamp--success{
      color: #22C55E;
      border-color: rgba(34,197,94,.38);
      box-shadow: 0 12px 35px rgba(34,197,94,.14);
    }
    .mx-status-stamp--failure{
      color: #EF4444;
      border-color: rgba(239,68,68,.38);
      box-shadow: 0 12px 35px rgba(239,68,68,.14);
    }
  </style>
