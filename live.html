<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MrXPRONOS LIVE - Prédictions Football Temps Réel</title>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Recharts -->
    <script src="https://unpkg.com/recharts/umd/Recharts.js"></script>
    
    <!-- Supabase JS (remplace Socket.IO) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        
        * {
            font-family: 'Inter', sans-serif;
        }
        
        :root {
            --gold: #D4AF37;
            --gold-light: #f5e7a3;
            --dark: #0a0a0a;
            --card: #121212;
        }
        
        body {
            background-color: var(--dark);
            color: #e0e0e0;
            margin: 0;
            padding: 0;
        }
        
        .gold-gradient {
            background: linear-gradient(135deg, #D4AF37 0%, #f5e7a3 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .gold-border {
            border-color: #D4AF37;
        }
        
        .gold-bg {
            background-color: #D4AF37;
        }
        
        .card-hover {
            transition: all 0.3s ease;
        }
        
        .card-hover:hover {
            border-color: #D4AF37;
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(212, 175, 55, 0.15);
        }
        
        .live-pulse {
            animation: pulse-live 2s infinite;
        }
        
        @keyframes pulse-live {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        
        .momentum-bar {
            transition: width 0.5s ease;
        }
        
        .notification-slide {
            animation: slide-in 0.3s ease;
        }
        
        @keyframes slide-in {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        
        .scroll-hide::-webkit-scrollbar {
            display: none;
        }
        
        .scroll-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        .glass {
            background: rgba(18, 18, 18, 0.95);
            backdrop-filter: blur(10px);
        }

        /* Error boundary fallback */
        .error-fallback {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: var(--dark);
            color: white;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        // ============================================================
        // Configuration Supabase (variables à remplacer par vos vraies valeurs)
        // ============================================================
        const SUPABASE_URL = 'https://nhwafcpndlufzzxexikh.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'; // votre clé anon
        const EDGE_FUNCTION_URL = `${SUPABASE_URL}/functions/v1/live`;

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ============================================================
        // Error Boundary
        // ============================================================
        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null };
            }

            static getDerivedStateFromError(error) {
                return { hasError: true, error };
            }

            componentDidCatch(error, errorInfo) {
                console.error('Error caught by boundary:', error, errorInfo);
            }

            render() {
                if (this.state.hasError) {
                    return (
                        <div className="error-fallback">
                            <h1 className="text-2xl font-bold text-red-500 mb-4">Quelque chose s'est mal passé</h1>
                            <p className="text-gray-400 mb-4">{this.state.error?.toString()}</p>
                            <button 
                                onClick={() => window.location.reload()}
                                className="px-4 py-2 bg-[#D4AF37] text-black rounded-lg"
                            >
                                Recharger la page
                            </button>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        // ============================================================
        // Vérification des bibliothèques globales
        // ============================================================
        const { useState, useEffect, useCallback, useRef, useMemo } = React;
        const Recharts = window.Recharts;
        const { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, AreaChart, Area, BarChart, Bar, PieChart, Pie } = Recharts || {};
        const lucide = window.lucide;

        // ============================================================
        // COMPOSANTS UTILITAIRES
        // ============================================================
        
        const Icon = ({ name, size = 20, className = "" }) => {
            const iconRef = useRef(null);
            
            useEffect(() => {
                if (iconRef.current && window.lucide && window.lucide.icons && window.lucide.icons[name]) {
                    iconRef.current.innerHTML = '';
                    try {
                        const icon = window.lucide.createElement(window.lucide.icons[name]);
                        if (icon) {
                            icon.setAttribute('width', size);
                            icon.setAttribute('height', size);
                            iconRef.current.appendChild(icon);
                        }
                    } catch (e) {
                        console.warn(`Erreur création icône ${name}:`, e);
                    }
                }
            }, [name, size]);
            
            return <span ref={iconRef} className={className} />;
        };
        
        const GoldText = ({ children, className = "" }) => (
            <span className={`gold-gradient font-bold ${className}`}>{children}</span>
        );
        
        const Card = ({ children, className = "", onClick }) => (
            <div 
                onClick={onClick}
                className={`bg-[#121212] border border-[#2a2a2a] rounded-xl p-4 card-hover ${onClick ? 'cursor-pointer' : ''} ${className}`}
            >
                {children}
            </div>
        );
        
        const Badge = ({ children, color = "gold", className = "" }) => {
            const colors = {
                gold: "bg-[#D4AF37] text-black",
                green: "bg-green-500 text-black",
                red: "bg-red-500 text-white",
                blue: "bg-blue-500 text-white",
                orange: "bg-orange-500 text-black",
                gray: "bg-gray-600 text-white"
            };
            
            return (
                <span className={`px-3 py-1 rounded-full text-xs font-semibold ${colors[color] || colors.gold} ${className}`}>
                    {children}
                </span>
            );
        };
        
        const MomentumGauge = ({ value, max = 100, label, showValue = true }) => {
            const safeValue = value ?? 0;
            const percentage = Math.min((safeValue / max) * 100, 100);
            const color = percentage > 70 ? '#4CAF50' : percentage > 40 ? '#FFA500' : '#ff4444';
            
            return (
                <div className="w-full">
                    <div className="flex justify-between mb-1">
                        <span className="text-xs text-gray-400">{label}</span>
                        {showValue && <span className="text-xs font-bold" style={{ color }}>{safeValue.toFixed(1)}</span>}
                    </div>
                    <div className="h-2 bg-gray-700 rounded-full overflow-hidden">
                        <div 
                            className="h-full rounded-full transition-all duration-500"
                            style={{ width: `${percentage}%`, backgroundColor: color }}
                        />
                    </div>
                </div>
            );
        };
        
        // ============================================================
        // COMPOSANTS DE NOTIFICATION (version REST)
        // ============================================================
        
        const NotificationToast = ({ notification, onClose }) => {
            const icons = {
                match_starting: 'calendar',
                live_available: 'radio',
                high_confidence_prediction: 'target',
                goal: 'trophy',
                odds_drop: 'trending-down'
            };
            
            const colors = {
                match_starting: 'border-blue-500',
                live_available: 'border-red-500',
                high_confidence_prediction: 'border-[#D4AF37]',
                goal: 'border-green-500'
            };
            
            useEffect(() => {
                const timer = setTimeout(onClose, 5000);
                return () => clearTimeout(timer);
            }, [onClose]);
            
            return (
                <div className={`fixed top-4 right-4 z-50 max-w-sm w-full bg-[#1a1a1a] border-l-4 ${colors[notification.type] || 'border-gray-500'} rounded-lg shadow-2xl notification-slide p-4`}>
                    <div className="flex items-start gap-3">
                        <div className="mt-1">
                            <Icon name={icons[notification.type] || 'bell'} size={20} className="text-[#D4AF37]" />
                        </div>
                        <div className="flex-1">
                            <h4 className="font-bold text-white text-sm">{notification.title}</h4>
                            <p className="text-gray-400 text-xs mt-1">{notification.message}</p>
                            {notification.data?.odds && (
                                <span className="text-[#D4AF37] text-xs font-bold mt-2 block">
                                    Cote suggérée: {notification.data.odds}
                                </span>
                            )}
                        </div>
                        <button onClick={onClose} className="text-gray-500 hover:text-white">
                            <Icon name="x" size={16} />
                        </button>
                    </div>
                </div>
            );
        };
        
        // ============================================================
        // COMPOSANTS DE MATCH
        // ============================================================
        
        const LiveMatchCard = ({ match, onClick, isSelected }) => {
            const momentum = match?.momentum || {};
            const xg = { home: match?.xg_home || 0, away: match?.xg_away || 0 };
            const predictions = match?.predictions || [];
            const highConfidence = predictions.filter(p => p?.confidence === 'high');
            
            return (
                <Card 
                    onClick={() => onClick(match)}
                    className={`${isSelected ? 'border-[#D4AF37]' : ''}`}
                >
                    <div className="flex justify-between items-start mb-3">
                        <div className="flex items-center gap-2">
                            <span className="live-pulse w-2 h-2 bg-red-500 rounded-full" />
                            <span className="text-red-500 text-xs font-bold">LIVE {match?.minute || 0}'</span>
                            <span className="text-gray-500 text-xs">|</span>
                            <span className="text-gray-400 text-xs">{match?.league?.name || ''}</span>
                        </div>
                        {highConfidence.length > 0 && (
                            <Badge color="gold">{highConfidence.length} alerte{highConfidence.length > 1 ? 's' : ''}</Badge>
                        )}
                    </div>
                    
                    <div className="flex justify-between items-center mb-4">
                        <div className="flex-1 text-right pr-4">
                            <div className="font-bold text-white">{match?.home_team || ''}</div>
                            <div className="text-xs text-gray-400">xG: {(xg.home || 0).toFixed(2)}</div>
                        </div>
                        
                        <div className="px-4 py-2 bg-[#0a0a0a] rounded-lg border border-[#D4AF37]">
                            <span className="text-2xl font-bold gold-gradient">
                                {match?.home_score || 0} - {match?.away_score || 0}
                            </span>
                        </div>
                        
                        <div className="flex-1 pl-4">
                            <div className="font-bold text-white">{match?.away_team || ''}</div>
                            <div className="text-xs text-gray-400">xG: {(xg.away || 0).toFixed(2)}</div>
                        </div>
                    </div>
                    
                    <div className="space-y-2">
                        <MomentumGauge 
                            value={momentum.total || 0} 
                            max={100} 
                            label="Momentum Total" 
                        />
                    </div>
                    
                    {predictions.length > 0 && (
                        <div className="mt-3 pt-3 border-t border-[#2a2a2a]">
                            <div className="flex gap-2 flex-wrap">
                                {predictions.slice(0, 2).map((pred, idx) => (
                                    <span key={idx} className={`text-xs px-2 py-1 rounded ${
                                        pred?.confidence === 'high' ? 'bg-green-500/20 text-green-400' : 'bg-[#D4AF37]/20 text-[#D4AF37]'
                                    }`}>
                                        {pred?.prediction_type === 'goal_next_3min' && '⚡ But <3min'}
                                        {pred?.prediction_type === 'goal_next_5min' && '⚡ But <5min'}
                                        {pred?.prediction_type === 'corner_next_5min' && '⛳ Corner'}
                                        {pred?.prediction_type === 'match_winner_live' && '🏆 Favori'}
                                        {' '}{((pred?.probability || 0) * 100).toFixed(0)}%
                                    </span>
                                ))}
                                {predictions.length > 2 && (
                                    <span className="text-xs text-gray-500">+{predictions.length - 2}</span>
                                )}
                            </div>
                        </div>
                    )}
                </Card>
            );
        };
        
        const ScheduledMatchCard = ({ match }) => {
            const minutesUntil = match?.minutes_until_kickoff ?? 0;
            const hoursUntil = Math.floor(minutesUntil / 60);
            const mins = minutesUntil % 60;
            
            let timeText;
            if (minutesUntil < 0) {
                timeText = "En cours...";
            } else if (minutesUntil < 60) {
                timeText = `Dans ${minutesUntil} min`;
            } else {
                timeText = `Dans ${hoursUntil}h${mins.toString().padStart(2, '0')}`;
            }
            
            const isSoon = minutesUntil > 0 && minutesUntil <= 15;
            
            return (
                <Card className="opacity-80 hover:opacity-100">
                    <div className="flex justify-between items-start mb-2">
                        <Badge color={isSoon ? "orange" : "gray"}>{timeText}</Badge>
                        <span className="text-xs text-gray-500">{match?.league?.name || ''}</span>
                    </div>
                    
                    <div className="flex justify-between items-center">
                        <div className="flex-1 text-right pr-3">
                            <div className="font-semibold text-white text-sm">{match?.home_team || ''}</div>
                        </div>
                        
                        <div className="text-gray-500 text-xs">VS</div>
                        
                        <div className="flex-1 pl-3">
                            <div className="font-semibold text-white text-sm">{match?.away_team || ''}</div>
                        </div>
                    </div>
                    
                    <div className="mt-2 text-xs text-gray-500 text-center">
                        {match?.event_date ? new Date(match.event_date).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }) : ''}
                    </div>
                </Card>
            );
        };
        
        // ============================================================
        // COMPOSANT DÉTAIL MATCH (inchangé)
        // ============================================================
        
        const MatchDetail = ({ match, onClose }) => {
            const [activeTab, setActiveTab] = useState('overview');
            
            if (!match) return null;
            
            const momentum = match.momentum || {};
            const pressure = match.pressure || {};
            const xg = { home: match.xg_home || 0, away: match.xg_away || 0 };
            const stats = match.stats || { home: {}, away: {} };
            const predictions = match.predictions || [];
            const history = match.momentum_history || [];
            
            const chartData = history.map((m, i) => ({
                time: `T-${history.length - i}`,
                home: m?.home || 0,
                away: m?.away || 0,
                total: m?.total || 0
            }));
            
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
                    <div className="bg-[#121212] rounded-2xl w-full max-w-4xl max-h-[90vh] overflow-hidden border border-[#2a2a2a]">
                        {/* Header */}
                        <div className="p-6 border-b border-[#2a2a2a]">
                            <div className="flex justify-between items-start">
                                <div>
                                    <div className="flex items-center gap-2 mb-2">
                                        <span className="live-pulse w-2 h-2 bg-red-500 rounded-full" />
                                        <span className="text-red-500 text-sm font-bold">LIVE {match.minute || 0}'</span>
                                        <span className="text-gray-500">|</span>
                                        <span className="text-gray-400">{match.league?.name || ''}</span>
                                    </div>
                                    <h2 className="text-2xl font-bold">
                                        {match.home_team || ''} <GoldText>vs</GoldText> {match.away_team || ''}
                                    </h2>
                                </div>
                                <button onClick={onClose} className="p-2 hover:bg-[#2a2a2a] rounded-lg">
                                    <Icon name="x" size={24} />
                                </button>
                            </div>
                            
                            <div className="flex justify-center items-center gap-8 mt-6">
                                <div className="text-center">
                                    <div className="text-4xl font-bold gold-gradient">{match.home_score || 0}</div>
                                    <div className="text-xs text-gray-400 mt-1">xG: {(xg.home || 0).toFixed(2)}</div>
                                </div>
                                <div className="text-2xl text-gray-600">-</div>
                                <div className="text-center">
                                    <div className="text-4xl font-bold gold-gradient">{match.away_score || 0}</div>
                                    <div className="text-xs text-gray-400 mt-1">xG: {(xg.away || 0).toFixed(2)}</div>
                                </div>
                            </div>
                        </div>
                        
                        {/* Tabs */}
                        <div className="flex border-b border-[#2a2a2a]">
                            {['overview', 'stats', 'predictions', 'momentum'].map(tab => (
                                <button
                                    key={tab}
                                    onClick={() => setActiveTab(tab)}
                                    className={`flex-1 py-3 text-sm font-medium capitalize transition-colors ${
                                        activeTab === tab 
                                            ? 'text-[#D4AF37] border-b-2 border-[#D4AF37]' 
                                            : 'text-gray-400 hover:text-white'
                                    }`}
                                >
                                    {tab === 'overview' ? 'Vue d\'ensemble' : 
                                     tab === 'stats' ? 'Statistiques' :
                                     tab === 'predictions' ? 'Prédictions' : 'Momentum'}
                                </button>
                            ))}
                        </div>
                        
                        {/* Content */}
                        <div className="p-6 overflow-y-auto max-h-[60vh]">
                            {activeTab === 'overview' && (
                                <div className="space-y-6">
                                    <div className="grid grid-cols-2 gap-4">
                                        <div className="bg-[#0a0a0a] rounded-xl p-4">
                                            <h4 className="text-sm font-bold text-gray-400 mb-3">Momentum</h4>
                                            <div className="flex items-center justify-between mb-2">
                                                <span className="text-sm">{match.home_team || ''}</span>
                                                <div className="flex-1 mx-3 h-2 bg-gray-700 rounded-full overflow-hidden">
                                                    <div 
                                                        className="h-full bg-green-500 rounded-full"
                                                        style={{ width: `${momentum.home_ratio || 50}%` }}
                                                    />
                                                </div>
                                            </div>
                                            <div className="flex items-center justify-between">
                                                <span className="text-sm">{match.away_team || ''}</span>
                                                <div className="flex-1 mx-3 h-2 bg-gray-700 rounded-full overflow-hidden">
                                                    <div 
                                                        className="h-full bg-red-500 rounded-full"
                                                        style={{ width: `${momentum.away_ratio || 50}%` }}
                                                    />
                                                </div>
                                            </div>
                                        </div>
                                        
                                        <div className="bg-[#0a0a0a] rounded-xl p-4">
                                            <h4 className="text-sm font-bold text-gray-400 mb-3">Pression</h4>
                                            <div className="text-center">
                                                <div className="text-2xl font-bold text-[#D4AF37]">
                                                    {pressure.ratio?.toFixed(2) || '1.00'}
                                                </div>
                                                <div className="text-xs text-gray-500 mt-1">
                                                    Ratio domination
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    
                                    {predictions.length > 0 && (
                                        <div>
                                            <h4 className="text-sm font-bold text-gray-400 mb-3">Prédictions Actives</h4>
                                            <div className="space-y-2">
                                                {predictions.map((pred, idx) => (
                                                    <div key={idx} className={`p-3 rounded-lg border-l-4 ${
                                                        pred?.confidence === 'high' ? 'border-green-500 bg-green-500/10' : 'border-[#D4AF37] bg-[#D4AF37]/10'
                                                    }`}>
                                                        <div className="flex justify-between items-start">
                                                            <div>
                                                                <div className="font-semibold text-sm">{pred?.message || ''}</div>
                                                                <div className="text-xs text-gray-400 mt-1">
                                                                    Probabilité: {((pred?.probability || 0) * 100).toFixed(1)}%
                                                                </div>
                                                            </div>
                                                            {pred?.odds_suggestion && (
                                                                <Badge color="gold">Cote: {pred.odds_suggestion}</Badge>
                                                            )}
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            )}
                            
                            {activeTab === 'stats' && (
                                <div className="space-y-4">
                                    {['Possession', 'Tirs', 'Tirs cadrés', 'Corners', 'Fautes'].map(stat => {
                                        const keyMap = {
                                            'Possession': 'ball_possession',
                                            'Tirs': 'total_shots',
                                            'Tirs cadrés': 'shots_on_target',
                                            'Corners': 'corner_kicks',
                                            'Fautes': 'fouls'
                                        };
                                        const homeVal = stats.home?.[keyMap[stat]] ?? 0;
                                        const awayVal = stats.away?.[keyMap[stat]] ?? 0;
                                        const total = homeVal + awayVal || 1;
                                        
                                        return (
                                            <div key={stat} className="bg-[#0a0a0a] rounded-xl p-4">
                                                <div className="flex justify-between text-sm mb-2">
                                                    <span className="font-bold">{homeVal}</span>
                                                    <span className="text-gray-400">{stat}</span>
                                                    <span className="font-bold">{awayVal}</span>
                                                </div>
                                                <div className="flex h-2 bg-gray-700 rounded-full overflow-hidden">
                                                    <div 
                                                        className="bg-green-500"
                                                        style={{ width: `${(homeVal / total) * 100}%` }}
                                                    />
                                                    <div 
                                                        className="bg-red-500"
                                                        style={{ width: `${(awayVal / total) * 100}%` }}
                                                    />
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            )}
                            
                            {activeTab === 'predictions' && (
                                <div className="space-y-4">
                                    {predictions.length === 0 ? (
                                        <div className="text-center text-gray-500 py-8">
                                            Aucune prédiction active pour ce match
                                        </div>
                                    ) : (
                                        predictions.map((pred, idx) => (
                                            <div key={idx} className="bg-[#0a0a0a] rounded-xl p-4">
                                                <div className="flex items-center gap-3 mb-3">
                                                    <div className={`w-3 h-3 rounded-full ${
                                                        pred?.confidence === 'high' ? 'bg-green-500' : 'bg-[#D4AF37]'
                                                    }`} />
                                                    <span className="font-bold">{pred?.prediction_type || ''}</span>
                                                    <Badge color={pred?.confidence === 'high' ? 'green' : 'gold'}>
                                                        {pred?.confidence || ''}
                                                    </Badge>
                                                </div>
                                                <p className="text-gray-300 mb-3">{pred?.message || ''}</p>
                                                <div className="grid grid-cols-3 gap-4 text-sm">
                                                    <div className="bg-[#121212] rounded-lg p-2 text-center">
                                                        <div className="text-gray-500 text-xs">Probabilité</div>
                                                        <div className="font-bold text-[#D4AF37]">{((pred?.probability || 0) * 100).toFixed(1)}%</div>
                                                    </div>
                                                    <div className="bg-[#121212] rounded-lg p-2 text-center">
                                                        <div className="text-gray-500 text-xs">Cote suggérée</div>
                                                        <div className="font-bold">{pred?.odds_suggestion || '-'}</div>
                                                    </div>
                                                    <div className="bg-[#121212] rounded-lg p-2 text-center">
                                                        <div className="text-gray-500 text-xs">Expire</div>
                                                        <div className="font-bold">{pred?.expiry_minute || '-'}'</div>
                                                    </div>
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>
                            )}
                            
                            {activeTab === 'momentum' && (
                                <div>
                                    {window.Recharts ? (
                                        <div className="h-64 mb-6">
                                            <ResponsiveContainer width="100%" height="100%">
                                                <AreaChart data={chartData}>
                                                    <defs>
                                                        <linearGradient id="colorHome" x1="0" y1="0" x2="0" y2="1">
                                                            <stop offset="5%" stopColor="#4CAF50" stopOpacity={0.3}/>
                                                            <stop offset="95%" stopColor="#4CAF50" stopOpacity={0}/>
                                                        </linearGradient>
                                                        <linearGradient id="colorAway" x1="0" y1="0" x2="0" y2="1">
                                                            <stop offset="5%" stopColor="#f44336" stopOpacity={0.3}/>
                                                            <stop offset="95%" stopColor="#f44336" stopOpacity={0}/>
                                                        </linearGradient>
                                                    </defs>
                                                    <CartesianGrid strokeDasharray="3 3" stroke="#333" />
                                                    <XAxis dataKey="time" stroke="#666" />
                                                    <YAxis stroke="#666" />
                                                    <Tooltip 
                                                        contentStyle={{ backgroundColor: '#1a1a1a', border: '1px solid #333' }}
                                                    />
                                                    <Area type="monotone" dataKey="home" stroke="#4CAF50" fillOpacity={1} fill="url(#colorHome)" name="Home" />
                                                    <Area type="monotone" dataKey="away" stroke="#f44336" fillOpacity={1} fill="url(#colorAway)" name="Away" />
                                                </AreaChart>
                                            </ResponsiveContainer>
                                        </div>
                                    ) : (
                                        <div className="h-64 mb-6 flex items-center justify-center text-gray-500">
                                            Graphique non disponible (Recharts manquant)
                                        </div>
                                    )}
                                    
                                    <div className="grid grid-cols-3 gap-4">
                                        <div className="bg-[#0a0a0a] rounded-xl p-4 text-center">
                                            <div className="text-2xl font-bold text-[#D4AF37]">{momentum.total?.toFixed(1) || 0}</div>
                                            <div className="text-xs text-gray-500">Momentum Total</div>
                                        </div>
                                        <div className="bg-[#0a0a0a] rounded-xl p-4 text-center">
                                            <div className="text-2xl font-bold text-green-500">{momentum.trend?.toFixed(2) || 0}</div>
                                            <div className="text-xs text-gray-500">Trend</div>
                                        </div>
                                        <div className="bg-[#0a0a0a] rounded-xl p-4 text-center">
                                            <div className="text-2xl font-bold capitalize">{momentum.intensity || '-'}</div>
                                            <div className="text-xs text-gray-500">Intensité</div>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };
        
        // ============================================================
        // COMPOSANTS PRINCIPAUX
        // ============================================================
        
        const Header = ({ stats, notifications, notificationCount, onClearNotifications }) => {
            const [showNotifications, setShowNotifications] = useState(false);
            
            return (
                <header className="sticky top-0 z-40 bg-[#0a0a0a]/95 backdrop-blur border-b border-[#2a2a2a]">
                    <div className="max-w-7xl mx-auto px-4 py-4">
                        <div className="flex justify-between items-center">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 bg-[#D4AF37] rounded-xl flex items-center justify-center">
                                    <Icon name="activity" size={24} className="text-black" />
                                </div>
                                <div>
                                    <h1 className="text-xl font-bold gold-gradient">MrXPRONOS LIVE</h1>
                                    <div className="flex items-center gap-3 text-xs text-gray-400">
                                        <span className="flex items-center gap-1">
                                            <span className="w-2 h-2 bg-green-500 rounded-full live-pulse" />
                                            {stats?.matches_live || 0} live
                                        </span>
                                        <span>|</span>
                                        <span>{stats?.matches_scheduled || 0} à venir</span>
                                    </div>
                                </div>
                            </div>
                            
                            <div className="flex items-center gap-4">
                                <div className="relative">
                                    <button 
                                        onClick={() => setShowNotifications(!showNotifications)}
                                        className="p-2 hover:bg-[#2a2a2a] rounded-lg transition-colors"
                                    >
                                        <Icon name="bell" size={20} />
                                        {notificationCount > 0 && (
                                            <span className="absolute -top-1 -right-1 w-5 h-5 bg-red-500 rounded-full text-xs flex items-center justify-center font-bold">
                                                {notificationCount}
                                            </span>
                                        )}
                                    </button>
                                    {showNotifications && (
                                        <div className="absolute right-0 top-full mt-2 w-80 bg-[#1a1a1a] border border-[#2a2a2a] rounded-xl shadow-2xl z-50">
                                            <div className="p-3 border-b border-[#2a2a2a] flex justify-between items-center">
                                                <span className="font-bold text-sm">Notifications</span>
                                                <button onClick={onClearNotifications} className="text-xs text-gray-400 hover:text-white">
                                                    Tout effacer
                                                </button>
                                            </div>
                                            <div className="max-h-96 overflow-y-auto">
                                                {notifications.length === 0 ? (
                                                    <div className="p-4 text-center text-gray-500 text-sm">
                                                        Aucune notification
                                                    </div>
                                                ) : (
                                                    notifications.map((notif, idx) => (
                                                        <div key={idx} className={`p-3 border-b border-[#2a2a2a] hover:bg-[#252525] ${!notif.read ? 'bg-[#252525]/50' : ''}`}>
                                                            <div className="flex items-center gap-2 mb-1">
                                                                <span className={`w-2 h-2 rounded-full ${notif.priority === 'urgent' ? 'bg-red-500' : 'bg-[#D4AF37]'}`} />
                                                                <span className="text-xs font-semibold text-gray-300">{notif.title}</span>
                                                            </div>
                                                            <p className="text-xs text-gray-400">{notif.message}</p>
                                                            <span className="text-[10px] text-gray-600 mt-1 block">
                                                                {new Date(notif.timestamp * 1000).toLocaleTimeString()}
                                                            </span>
                                                        </div>
                                                    ))
                                                )}
                                            </div>
                                        </div>
                                    )}
                                </div>
                                <button className="p-2 hover:bg-[#2a2a2a] rounded-lg">
                                    <Icon name="settings" size={20} />
                                </button>
                            </div>
                        </div>
                    </div>
                </header>
            );
        };
        
        const TodayOverview = ({ data, onMatchClick }) => {
            if (!data) return null;
            
            return (
                <div className="mb-8">
                    <h2 className="text-lg font-bold mb-4 flex items-center gap-2">
                        <Icon name="calendar" size={20} className="text-[#D4AF37]" />
                        Aujourd'hui
                    </h2>
                    
                    <div className="grid grid-cols-3 gap-4">
                        <Card className="text-center" onClick={() => {}}>
                            <div className="text-3xl font-bold text-blue-400 mb-1">
                                {data.scheduled?.count || 0}
                            </div>
                            <div className="text-xs text-gray-400">Programmés</div>
                        </Card>
                        
                        <Card className="text-center border-red-500/30" onClick={() => {}}>
                            <div className="text-3xl font-bold text-red-500 mb-1 live-pulse">
                                {data.live?.count || 0}
                            </div>
                            <div className="text-xs text-gray-400">En direct</div>
                        </Card>
                        
                        <Card className="text-center" onClick={() => {}}>
                            <div className="text-3xl font-bold text-gray-400 mb-1">
                                {data.finished?.count || 0}
                            </div>
                            <div className="text-xs text-gray-400">Terminés</div>
                        </Card>
                    </div>
                </div>
            );
        };
        
        const LiveMatchesSection = ({ matches, selectedMatch, onSelectMatch }) => (
            <div className="mb-8">
                <h2 className="text-lg font-bold mb-4 flex items-center gap-2">
                    <Icon name="radio" size={20} className="text-red-500 live-pulse" />
                    Matchs en Direct
                </h2>
                
                {matches.length === 0 ? (
                    <div className="text-center py-12 text-gray-500">
                        <Icon name="radio" size={48} className="mx-auto mb-4 opacity-30" />
                        <p>Aucun match en direct pour le moment</p>
                        <p className="text-sm mt-2">Les matchs apparaîtront automatiquement</p>
                    </div>
                ) : (
                    <div className="grid gap-4 md:grid-cols-2">
                        {matches.map(match => (
                            <LiveMatchCard 
                                key={match.id}
                                match={match}
                                onClick={onSelectMatch}
                                isSelected={selectedMatch?.id === match.id}
                            />
                        ))}
                    </div>
                )}
            </div>
        );
        
        const ScheduledSection = ({ matches }) => (
            <div className="mb-8">
                <h2 className="text-lg font-bold mb-4 flex items-center gap-2">
                    <Icon name="clock" size={20} className="text-[#D4AF37]" />
                    Prochainement
                </h2>
                
                {matches.length === 0 ? (
                    <div className="text-center py-8 text-gray-500">
                        Aucun match programmé dans les prochaines 24h
                    </div>
                ) : (
                    <div className="grid gap-3 md:grid-cols-3">
                        {matches.slice(0, 6).map(match => (
                            <ScheduledMatchCard key={match.id} match={match} />
                        ))}
                    </div>
                )}
            </div>
        );
        
        const ActivePredictions = ({ predictions }) => (
            <div className="mb-8">
                <h2 className="text-lg font-bold mb-4 flex items-center gap-2">
                    <Icon name="target" size={20} className="text-[#D4AF37]" />
                    Alertes Actives
                </h2>
                
                {predictions.length === 0 ? (
                    <div className="text-center py-8 text-gray-500 bg-[#121212] rounded-xl border border-[#2a2a2a]">
                        Aucune prédiction haute confiance active
                    </div>
                ) : (
                    <div className="space-y-3">
                        {predictions.slice(0, 5).map((item, idx) => (
                            <div key={idx} className="bg-[#121212] border border-[#D4AF37]/30 rounded-xl p-4 flex justify-between items-center">
                                <div>
                                    <div className="font-bold text-sm">{item?.match?.teams || ''}</div>
                                    <div className="text-xs text-gray-400">{item?.match?.score || ''} • {item?.match?.minute || 0}'</div>
                                    <div className="text-sm text-[#D4AF37] mt-1">{item?.prediction?.message || ''}</div>
                                </div>
                                <div className="text-right">
                                    <div className="text-2xl font-bold text-green-500">
                                        {((item?.prediction?.probability || 0) * 100).toFixed(0)}%
                                    </div>
                                    <div className="text-xs text-gray-500">confiance</div>
                                </div>
                            </div>
                        ))}
                    </div>
                )}
            </div>
        );
        
        // ============================================================
        // APP PRINCIPALE (avec Supabase Realtime)
        // ============================================================
        
        const App = () => {
            const [userId] = useState(() => localStorage.getItem('mrx_user_id') || `user_${Date.now()}`);
            // Data states
            const [todayData, setTodayData] = useState(null);
            const [liveMatches, setLiveMatches] = useState([]);
            const [scheduledMatches, setScheduledMatches] = useState([]);
            const [activePredictions, setActivePredictions] = useState([]);
            const [stats, setStats] = useState({ matches_live: 0, matches_scheduled: 0, total_predictions: 0, success_rate: 0, avg_momentum: 0 });
            const [notifications, setNotifications] = useState([]);
            const [toast, setToast] = useState(null);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);
            const [selectedMatch, setSelectedMatch] = useState(null);
            
            // Sauvegarder userId
            useEffect(() => {
                localStorage.setItem('mrx_user_id', userId);
            }, [userId]);
            
            // Charger les notifications de l'utilisateur (si connecté)
            const loadNotifications = useCallback(async () => {
                try {
                    const res = await fetch(`${EDGE_FUNCTION_URL}/notifications?user_id=${userId}`);
                    if (res.ok) {
                        const data = await res.json();
                        setNotifications(data.notifications || []);
                    }
                } catch (e) {
                    console.error('Erreur chargement notifications:', e);
                }
            }, [userId]);
            
            // Charger les données initiales
            const fetchData = useCallback(async () => {
                try {
                    setError(null);
                    
                    // Appel à la fonction Edge /today
                    const res = await fetch(`${EDGE_FUNCTION_URL}/today`);
                    if (!res.ok) throw new Error('Erreur chargement données');
                    const data = await res.json();
                    
                    setTodayData(data.data);
                    setLiveMatches(data.data.live.matches || []);
                    setScheduledMatches(data.data.scheduled.matches || []);
                    
                    // Charger les prédictions actives
                    const predRes = await fetch(`${EDGE_FUNCTION_URL}/predictions/active`);
                    if (predRes.ok) {
                        const predData = await predRes.json();
                        setActivePredictions(predData.predictions || []);
                    }
                    
                    // Stats
                    setStats(prev => ({
                        ...prev,
                        matches_live: data.data.live.count,
                        matches_scheduled: data.data.scheduled.count
                    }));
                    
                    setLoading(false);
                } catch (err) {
                    console.error(err);
                    setError('Erreur de connexion au serveur.');
                    setLoading(false);
                }
            }, []);
            
            // Souscrire aux mises à jour en temps réel via Supabase Realtime
            useEffect(() => {
                // Channel pour les matchs live
                const channel = supabase
                    .channel('live-matches-changes')
                    .on('postgres_changes', 
                        { event: 'UPDATE', schema: 'public', table: 'live_matches' }, 
                        (payload) => {
                            setLiveMatches(prev => 
                                prev.map(m => m.id === payload.new.id ? payload.new : m)
                            );
                        }
                    )
                    .on('postgres_changes',
                        { event: 'INSERT', schema: 'public', table: 'live_matches' },
                        (payload) => {
                            setLiveMatches(prev => [...prev, payload.new]);
                        }
                    )
                    .on('postgres_changes',
                        { event: 'DELETE', schema: 'public', table: 'live_matches' },
                        (payload) => {
                            setLiveMatches(prev => prev.filter(m => m.id !== payload.old.id));
                        }
                    )
                    .subscribe();
                
                return () => {
                    supabase.removeChannel(channel);
                };
            }, []);
            
            useEffect(() => {
                fetchData();
                loadNotifications();
                const interval = setInterval(fetchData, 30000); // refresh toutes les 30s
                return () => clearInterval(interval);
            }, [fetchData, loadNotifications]);
            
            const handleMatchSelect = (match) => {
                setSelectedMatch(match);
            };
            
            const clearNotifications = () => {
                setNotifications([]);
            };
            
            const unreadCount = notifications.filter(n => !n.read).length;
            
            if (loading) {
                return (
                    <div className="min-h-screen flex items-center justify-center">
                        <div className="text-center">
                            <div className="w-16 h-16 border-4 border-[#D4AF37] border-t-transparent rounded-full animate-spin mx-auto mb-4" />
                            <p className="text-gray-400">Chargement...</p>
                        </div>
                    </div>
                );
            }
            
            if (error) {
                return (
                    <div className="min-h-screen flex items-center justify-center">
                        <div className="text-center">
                            <Icon name="alert-circle" size={48} className="mx-auto mb-4 text-red-500" />
                            <p className="text-gray-400 mb-4">{error}</p>
                            <button 
                                onClick={fetchData}
                                className="px-4 py-2 bg-[#D4AF37] text-black rounded-lg font-semibold"
                            >
                                Réessayer
                            </button>
                        </div>
                    </div>
                );
            }
            
            return (
                <div className="min-h-screen bg-[#0a0a0a]">
                    <Header 
                        stats={stats}
                        notifications={notifications}
                        notificationCount={unreadCount}
                        onClearNotifications={clearNotifications}
                    />
                    
                    <main className="max-w-7xl mx-auto px-4 py-6">
                        <TodayOverview 
                            data={todayData}
                            onMatchClick={handleMatchSelect}
                        />
                        
                        <div className="grid lg:grid-cols-3 gap-8">
                            <div className="lg:col-span-2">
                                <LiveMatchesSection 
                                    matches={liveMatches}
                                    selectedMatch={selectedMatch}
                                    onSelectMatch={handleMatchSelect}
                                />
                                
                                <ScheduledSection matches={scheduledMatches} />
                            </div>
                            
                            <div className="lg:col-span-1">
                                <ActivePredictions predictions={activePredictions} />
                                
                                {/* Mini stats */}
                                <div className="bg-[#121212] rounded-xl border border-[#2a2a2a] p-4 mt-6">
                                    <h3 className="font-bold mb-4 flex items-center gap-2">
                                        <Icon name="bar-chart-2" size={18} className="text-[#D4AF37]" />
                                        Performance
                                    </h3>
                                    <div className="space-y-3">
                                        <div className="flex justify-between text-sm">
                                            <span className="text-gray-400">Prédictions aujourd'hui</span>
                                            <span className="font-bold">{stats.total_predictions || 0}</span>
                                        </div>
                                        <div className="flex justify-between text-sm">
                                            <span className="text-gray-400">Taux de réussite</span>
                                            <span className="font-bold text-green-500">
                                                {((stats.success_rate || 0) * 100).toFixed(1)}%
                                            </span>
                                        </div>
                                        <div className="flex justify-between text-sm">
                                            <span className="text-gray-400">Momentum moyen</span>
                                            <span className="font-bold text-[#D4AF37]">
                                                {(stats.avg_momentum || 0).toFixed(1)}
                                            </span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </main>
                    
                    {selectedMatch && (
                        <MatchDetail 
                            match={selectedMatch}
                            onClose={() => setSelectedMatch(null)}
                        />
                    )}
                    
                    {toast && (
                        <NotificationToast 
                            notification={toast}
                            onClose={() => setToast(null)}
                        />
                    )}
                </div>
            );
        };
        
        // ============================================================
        // Rendu avec ErrorBoundary
        // ============================================================
        const rootElement = document.getElementById('root');
        if (rootElement) {
            const root = ReactDOM.createRoot(rootElement);
            root.render(
                <ErrorBoundary>
                    <App />
                </ErrorBoundary>
            );
        } else {
            console.error('Element root introuvable');
        }
    </script>
</body>
</html>
