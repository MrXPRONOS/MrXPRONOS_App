<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>MrXPRONOS LIVE - Prédictions Football Temps Réel</title>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        
        * {
            font-family: 'Inter', sans-serif;
        }
        
        :root {
            --gold: #D4AF37;
            --gold-light: #f5e7a3;
            --dark: #0a0a0a;
            --card: #121212;
        }
        
        body {
            background-color: var(--dark);
            color: #e0e0e0;
            margin: 0;
            padding: 0;
        }
        
        .gold-gradient {
            background: linear-gradient(135deg, #D4AF37 0%, #f5e7a3 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .gold-border {
            border-color: #D4AF37;
        }
        
        .gold-bg {
            background-color: #D4AF37;
        }
        
        .card-hover {
            transition: all 0.3s ease;
        }
        
        .card-hover:hover {
            border-color: #D4AF37;
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(212, 175, 55, 0.15);
        }
        
        .live-pulse {
            animation: pulse-live 2s infinite;
        }
        
        @keyframes pulse-live {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        
        .notification-slide {
            animation: slide-in 0.3s ease;
        }
        
        @keyframes slide-in {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        
        .error-fallback {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: var(--dark);
            color: white;
            text-align: center;
            padding: 20px;
        }

        /* Styles pour les prédictions */
        .prediction-badge {
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 16px;
            padding: 6px 12px;
            font-size: 0.75rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin: 2px;
        }
        
        .prediction-high {
            background: rgba(34, 197, 94, 0.2);
            border-color: #22C55E;
        }
        
        .back-button {
            background: #333;
            border: 1px solid var(--gold);
            border-radius: 30px;
            padding: 8px 16px;
            color: white;
            cursor: pointer;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .back-button:hover {
            background: #444;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        // ============================================================
        // Configuration Supabase
        // ============================================================
        const SUPABASE_URL = 'https://nhwafcpndlufzzxexikh.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5od2FmY3BuZGx1Znp6eGV4aWtoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Mzg4OTYwNTMsImV4cCI6MjA1NDQ3MjA1M30.8z2VQ_5vXl6kFqJvWq5mNv5w7J6pNk9Yt2wV5hL6Fz8';
        const EDGE_FUNCTION_URL = `${SUPABASE_URL}/functions/v1/live`;

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ============================================================
        // Error Boundary
        // ============================================================
        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null };
            }

            static getDerivedStateFromError(error) {
                return { hasError: true, error };
            }

            componentDidCatch(error, errorInfo) {
                console.error('Error caught by boundary:', error, errorInfo);
            }

            render() {
                if (this.state.hasError) {
                    return (
                        <div className="error-fallback">
                            <h1 className="text-2xl font-bold text-red-500 mb-4">Quelque chose s'est mal passé</h1>
                            <p className="text-gray-400 mb-4">{this.state.error?.toString()}</p>
                            <button 
                                onClick={() => window.location.reload()}
                                className="px-4 py-2 bg-[#D4AF37] text-black rounded-lg"
                            >
                                Recharger la page
                            </button>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        // ============================================================
        // Vérification des bibliothèques globales
        // ============================================================
        const { useState, useEffect, useCallback, useRef } = React;
        const lucide = window.lucide;

        // ============================================================
        // COMPOSANTS UTILITAIRES
        // ============================================================
        
        const Icon = ({ name, size = 20, className = "" }) => {
            const iconRef = useRef(null);
            
            useEffect(() => {
                if (iconRef.current && window.lucide && window.lucide.icons && window.lucide.icons[name]) {
                    iconRef.current.innerHTML = '';
                    try {
                        const icon = window.lucide.createElement(window.lucide.icons[name]);
                        if (icon) {
                            icon.setAttribute('width', size);
                            icon.setAttribute('height', size);
                            iconRef.current.appendChild(icon);
                        }
                    } catch (e) {
                        console.warn(`Erreur icône ${name}:`, e);
                    }
                }
            }, [name, size]);
            
            return <span ref={iconRef} className={className} />;
        };
        
        const Card = ({ children, className = "", onClick }) => (
            <div 
                onClick={onClick}
                className={`bg-[#121212] border border-[#2a2a2a] rounded-xl p-4 card-hover ${onClick ? 'cursor-pointer' : ''} ${className}`}
            >
                {children}
            </div>
        );
        
        const Badge = ({ children, color = "gold", className = "" }) => {
            const colors = {
                gold: "bg-[#D4AF37] text-black",
                green: "bg-green-500 text-black",
                red: "bg-red-500 text-white",
                blue: "bg-blue-500 text-white",
                orange: "bg-orange-500 text-black",
                gray: "bg-gray-600 text-white"
            };
            
            return (
                <span className={`px-3 py-1 rounded-full text-xs font-semibold ${colors[color] || colors.gold} ${className}`}>
                    {children}
                </span>
            );
        };
        
        // ============================================================
        // COMPOSANTS DE MATCH
        // ============================================================
        
        const LiveMatchCard = ({ match, onClick, isSelected }) => {
            const predictions = match?.predictions || [];
            
            return (
                <Card 
                    onClick={() => onClick(match)}
                    className={`${isSelected ? 'border-[#D4AF37]' : ''}`}
                >
                    <div className="flex justify-between items-start mb-3">
                        <div className="flex items-center gap-2">
                            <span className="live-pulse w-2 h-2 bg-red-500 rounded-full" />
                            <span className="text-red-500 text-xs font-bold">LIVE {match?.current_minute || 0}'</span>
                            <span className="text-gray-500 text-xs">|</span>
                            <span className="text-gray-400 text-xs">{match?.league?.name || ''}</span>
                        </div>
                        {predictions.length > 0 && (
                            <Badge color="gold">{predictions.length} prédiction{predictions.length > 1 ? 's' : ''}</Badge>
                        )}
                    </div>
                    
                    <div className="flex justify-between items-center mb-4">
                        <div className="flex-1 text-right pr-4">
                            <div className="font-bold text-white">{match?.home_team || ''}</div>
                        </div>
                        
                        <div className="px-4 py-2 bg-[#0a0a0a] rounded-lg border border-[#D4AF37]">
                            <span className="text-2xl font-bold gold-gradient">
                                {match?.home_score || 0} - {match?.away_score || 0}
                            </span>
                        </div>
                        
                        <div className="flex-1 pl-4">
                            <div className="font-bold text-white">{match?.away_team || ''}</div>
                        </div>
                    </div>
                    
                    {predictions.length > 0 && (
                        <div className="mt-3 pt-3 border-t border-[#2a2a2a]">
                            <div className="flex flex-col gap-2">
                                {predictions.map((pred, idx) => (
                                    <div key={idx} className="bg-[#1a1a1a] p-2 rounded-lg border border-[#D4AF37]/30">
                                        <div className="flex justify-between items-start">
                                            <div>
                                                <span className={`text-xs font-bold ${
                                                    pred.type === 'corners' ? 'text-blue-400' :
                                                    pred.type === 'shots' ? 'text-orange-400' :
                                                    pred.type === 'btts' ? 'text-green-400' : 'text-[#D4AF37]'
                                                }`}>
                                                    {pred.type === 'corners' && '⛳ Corners'}
                                                    {pred.type === 'shots' && '🎯 Tirs'}
                                                    {pred.type === 'btts' && '⚽ BTTS'}
                                                    {pred.type === 'winner' && '🏆 Favori'}
                                                </span>
                                                <p className="text-xs text-gray-300 mt-1">{pred.detail}</p>
                                            </div>
                                            <div className="text-right">
                                                <span className="text-sm font-bold text-green-400">
                                                    {(pred.probability * 100).toFixed(0)}%
                                                </span>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}
                </Card>
            );
        };
        
        const ScheduledMatchCard = ({ match }) => {
            const eventDate = new Date(match.event_date);
            const now = new Date();
            const diffMs = eventDate - now;
            const diffMin = Math.floor(diffMs / 60000);
            
            let timeText;
            if (diffMin < 0) {
                timeText = "En cours...";
            } else if (diffMin < 60) {
                timeText = `Dans ${diffMin} min`;
            } else {
                const hours = Math.floor(diffMin / 60);
                const mins = diffMin % 60;
                timeText = `Dans ${hours}h${mins.toString().padStart(2, '0')}`;
            }
            
            return (
                <Card>
                    <div className="flex justify-between items-start mb-2">
                        <Badge color="gray">{timeText}</Badge>
                        <span className="text-xs text-gray-500">{match?.league?.name || ''}</span>
                    </div>
                    
                    <div className="flex justify-between items-center">
                        <div className="flex-1 text-right pr-3">
                            <div className="font-semibold text-white text-sm">{match?.home_team || ''}</div>
                        </div>
                        <div className="text-gray-500 text-xs">VS</div>
                        <div className="flex-1 pl-3">
                            <div className="font-semibold text-white text-sm">{match?.away_team || ''}</div>
                        </div>
                    </div>
                    
                    <div className="mt-2 text-xs text-gray-500 text-center">
                        {eventDate.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })}
                    </div>
                </Card>
            );
        };
        
        // ============================================================
        // COMPOSANT DÉTAIL MATCH
        // ============================================================
        
        const MatchDetail = ({ match, onClose }) => {
            const predictions = match?.predictions || [];
            
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
                    <div className="bg-[#121212] rounded-2xl w-full max-w-4xl max-h-[90vh] overflow-hidden border border-[#2a2a2a]">
                        <div className="p-6 border-b border-[#2a2a2a]">
                            <div className="flex justify-between items-start">
                                <div>
                                    <div className="flex items-center gap-2 mb-2">
                                        <span className="live-pulse w-2 h-2 bg-red-500 rounded-full" />
                                        <span className="text-red-500 text-sm font-bold">LIVE {match.current_minute || 0}'</span>
                                        <span className="text-gray-500">|</span>
                                        <span className="text-gray-400">{match.league?.name || ''}</span>
                                    </div>
                                    <h2 className="text-2xl font-bold">
                                        {match.home_team} <span className="text-[#D4AF37]">vs</span> {match.away_team}
                                    </h2>
                                </div>
                                <button onClick={onClose} className="p-2 hover:bg-[#2a2a2a] rounded-lg">
                                    <Icon name="x" size={24} />
                                </button>
                            </div>
                            
                            <div className="flex justify-center items-center gap-8 mt-6">
                                <div className="text-center">
                                    <div className="text-4xl font-bold text-[#D4AF37]">{match.home_score || 0}</div>
                                </div>
                                <div className="text-2xl text-gray-600">-</div>
                                <div className="text-center">
                                    <div className="text-4xl font-bold text-[#D4AF37]">{match.away_score || 0}</div>
                                </div>
                            </div>
                        </div>
                        
                        <div className="p-6 overflow-y-auto max-h-[60vh]">
                            {predictions.length === 0 ? (
                                <div className="text-center text-gray-500 py-8">
                                    Aucune prédiction haute confiance pour ce match
                                </div>
                            ) : (
                                <div className="space-y-4">
                                    <h3 className="font-bold text-lg">🔮 Prédictions haute confiance</h3>
                                    {predictions.map((pred, idx) => (
                                        <div key={idx} className="bg-[#1a1a1a] rounded-xl p-4 border border-[#D4AF37]/30">
                                            <div className="flex items-center gap-3 mb-2">
                                                <span className="text-2xl">
                                                    {pred.type === 'corners' && '⛳'}
                                                    {pred.type === 'shots' && '🎯'}
                                                    {pred.type === 'btts' && '⚽'}
                                                    {pred.type === 'winner' && '🏆'}
                                                </span>
                                                <span className="font-bold text-[#D4AF37] capitalize">{pred.type}</span>
                                                <Badge color="green">{((pred.probability || 0) * 100).toFixed(0)}% confiance</Badge>
                                            </div>
                                            <p className="text-white mb-2">{pred.detail}</p>
                                            <p className="text-sm text-gray-400">{pred.message}</p>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                        
                        <div className="p-4 border-t border-[#2a2a2a] flex justify-end">
                            <button onClick={onClose} className="back-button">
                                <Icon name="arrow-left" size={16} /> Retour
                            </button>
                        </div>
                    </div>
                </div>
            );
        };
        
        // ============================================================
        // COMPOSANTS PRINCIPAUX
        // ============================================================
        
        const Header = ({ onBack }) => (
            <header className="sticky top-0 z-40 bg-[#0a0a0a]/95 backdrop-blur border-b border-[#2a2a2a]">
                <div className="max-w-7xl mx-auto px-4 py-4">
                    <div className="flex justify-between items-center">
                        <div className="flex items-center gap-3">
                            <button onClick={onBack} className="back-button">
                                <Icon name="arrow-left" size={16} /> Retour
                            </button>
                            <div className="w-10 h-10 bg-[#D4AF37] rounded-xl flex items-center justify-center ml-2">
                                <Icon name="activity" size={24} className="text-black" />
                            </div>
                            <div>
                                <h1 className="text-xl font-bold gold-gradient">MrXPRONOS LIVE</h1>
                            </div>
                        </div>
                    </div>
                </div>
            </header>
        );
        
        const TodayOverview = ({ data }) => {
            if (!data) return null;
            
            return (
                <div className="mb-8">
                    <h2 className="text-lg font-bold mb-4 flex items-center gap-2">
                        <Icon name="calendar" size={20} className="text-[#D4AF37]" />
                        Aujourd'hui
                    </h2>
                    
                    <div className="grid grid-cols-3 gap-4">
                        <Card className="text-center">
                            <div className="text-3xl font-bold text-blue-400 mb-1">
                                {data.scheduled?.count || 0}
                            </div>
                            <div className="text-xs text-gray-400">Programmés</div>
                        </Card>
                        
                        <Card className="text-center border-red-500/30">
                            <div className="text-3xl font-bold text-red-500 mb-1 live-pulse">
                                {data.live?.count || 0}
                            </div>
                            <div className="text-xs text-gray-400">En direct</div>
                        </Card>
                        
                        <Card className="text-center">
                            <div className="text-3xl font-bold text-gray-400 mb-1">
                                {data.finished?.count || 0}
                            </div>
                            <div className="text-xs text-gray-400">Terminés</div>
                        </Card>
                    </div>
                </div>
            );
        };
        
        const LiveMatchesSection = ({ matches, selectedMatch, onSelectMatch }) => (
            <div className="mb-8">
                <h2 className="text-lg font-bold mb-4 flex items-center gap-2">
                    <Icon name="radio" size={20} className="text-red-500 live-pulse" />
                    Matchs en Direct
                </h2>
                
                {matches.length === 0 ? (
                    <div className="text-center py-12 text-gray-500">
                        <Icon name="radio" size={48} className="mx-auto mb-4 opacity-30" />
                        <p>Aucun match en direct pour le moment</p>
                    </div>
                ) : (
                    <div className="grid gap-4 md:grid-cols-2">
                        {matches.map(match => (
                            <LiveMatchCard 
                                key={match.id}
                                match={match}
                                onClick={onSelectMatch}
                                isSelected={selectedMatch?.id === match.id}
                            />
                        ))}
                    </div>
                )}
            </div>
        );
        
        const ScheduledSection = ({ matches }) => (
            <div className="mb-8">
                <h2 className="text-lg font-bold mb-4 flex items-center gap-2">
                    <Icon name="clock" size={20} className="text-[#D4AF37]" />
                    Prochainement
                </h2>
                
                {matches.length === 0 ? (
                    <div className="text-center py-8 text-gray-500">
                        Aucun match programmé
                    </div>
                ) : (
                    <div className="grid gap-3 md:grid-cols-3">
                        {matches.slice(0, 6).map(match => (
                            <ScheduledMatchCard key={match.id} match={match} />
                        ))}
                    </div>
                )}
            </div>
        );
        
        const ActivePredictions = ({ predictions }) => (
            <div className="mb-8">
                <h2 className="text-lg font-bold mb-4 flex items-center gap-2">
                    <Icon name="target" size={20} className="text-[#D4AF37]" />
                    Alertes Actives
                </h2>
                
                {predictions.length === 0 ? (
                    <div className="text-center py-8 text-gray-500 bg-[#121212] rounded-xl border border-[#2a2a2a]">
                        Aucune alerte haute confiance
                    </div>
                ) : (
                    <div className="space-y-3">
                        {predictions.slice(0, 5).map((item, idx) => (
                            <div key={idx} className="bg-[#121212] border border-[#D4AF37]/30 rounded-xl p-4">
                                <div className="font-bold text-sm mb-1">{item.match.teams}</div>
                                <div className="text-sm text-[#D4AF37]">{item.prediction.detail}</div>
                                <div className="text-xs text-gray-400 mt-1">{item.prediction.message}</div>
                                <div className="mt-2">
                                    <Badge color="green">{(item.prediction.probability * 100).toFixed(0)}% confiance</Badge>
                                </div>
                            </div>
                        ))}
                    </div>
                )}
            </div>
        );
        
        // ============================================================
        // APP PRINCIPALE
        // ============================================================
        
        const App = () => {
            const [userId] = useState(() => localStorage.getItem('mrx_user_id') || `user_${Date.now()}`);
            const [liveMatches, setLiveMatches] = useState([]);
            const [scheduledMatches, setScheduledMatches] = useState([]);
            const [todayData, setTodayData] = useState(null);
            const [activePredictions, setActivePredictions] = useState([]);
            const [notifications, setNotifications] = useState([]);
            const [toast, setToast] = useState(null);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);
            const [selectedMatch, setSelectedMatch] = useState(null);
            
            // Souscrire aux notifications en temps réel
            useEffect(() => {
                const channel = supabase
                    .channel('user-notifications')
                    .on('postgres_changes', 
                        { event: 'INSERT', schema: 'public', table: 'user_notifications', filter: `user_id=eq.${userId}` },
                        (payload) => {
                            setNotifications(prev => [payload.new, ...prev]);
                            setToast(payload.new);
                        }
                    )
                    .subscribe();
                
                return () => supabase.removeChannel(channel);
            }, [userId]);
            
            // Charger les données
            const fetchLiveMatches = useCallback(async () => {
                try {
                    const res = await fetch(`${EDGE_FUNCTION_URL}/matches`);
                    if (res.ok) {
                        const data = await res.json();
                        setLiveMatches(data.matches || []);
                    }
                } catch (e) {
                    console.error('Erreur live matches:', e);
                }
            }, []);
            
            const fetchTodayData = useCallback(async () => {
                try {
                    const res = await fetch(`${EDGE_FUNCTION_URL}/today`);
                    if (res.ok) {
                        const data = await res.json();
                        setTodayData(data.data);
                        setScheduledMatches(data.data.scheduled.matches || []);
                    }
                } catch (e) {
                    console.error('Erreur today:', e);
                }
            }, []);
            
            const fetchPredictions = useCallback(async () => {
                try {
                    const res = await fetch(`${EDGE_FUNCTION_URL}/predictions/active`);
                    if (res.ok) {
                        const data = await res.json();
                        setActivePredictions(data.predictions || []);
                    }
                } catch (e) {
                    console.error('Erreur prédictions:', e);
                }
            }, []);
            
            useEffect(() => {
                const loadAll = async () => {
                    setLoading(true);
                    try {
                        await Promise.all([
                            fetchLiveMatches(),
                            fetchTodayData(),
                            fetchPredictions()
                        ]);
                    } catch (e) {
                        setError('Erreur de connexion au serveur.');
                    } finally {
                        setLoading(false);
                    }
                };
                
                loadAll();
                
                const intervalLive = setInterval(fetchLiveMatches, 30000);
                const intervalToday = setInterval(fetchTodayData, 60000);
                const intervalPred = setInterval(fetchPredictions, 30000);
                
                return () => {
                    clearInterval(intervalLive);
                    clearInterval(intervalToday);
                    clearInterval(intervalPred);
                };
            }, [fetchLiveMatches, fetchTodayData, fetchPredictions]);
            
            const handleBack = () => {
                if (selectedMatch) {
                    setSelectedMatch(null);
                } else {
                    window.location.href = '/';
                }
            };
            
            const clearNotifications = () => setNotifications([]);
            
            if (loading) {
                return (
                    <div className="min-h-screen flex items-center justify-center">
                        <div className="text-center">
                            <div className="w-16 h-16 border-4 border-[#D4AF37] border-t-transparent rounded-full animate-spin mx-auto mb-4" />
                            <p className="text-gray-400">Chargement...</p>
                        </div>
                    </div>
                );
            }
            
            if (error) {
                return (
                    <div className="min-h-screen flex items-center justify-center">
                        <div className="text-center">
                            <Icon name="alert-circle" size={48} className="mx-auto mb-4 text-red-500" />
                            <p className="text-gray-400 mb-4">{error}</p>
                            <button onClick={() => window.location.reload()} className="px-4 py-2 bg-[#D4AF37] text-black rounded-lg">
                                Réessayer
                            </button>
                        </div>
                    </div>
                );
            }
            
            return (
                <div className="min-h-screen bg-[#0a0a0a]">
                    <Header onBack={handleBack} />
                    
                    <main className="max-w-7xl mx-auto px-4 py-6">
                        <TodayOverview data={todayData} />
                        
                        <div className="grid lg:grid-cols-3 gap-8">
                            <div className="lg:col-span-2">
                                <LiveMatchesSection 
                                    matches={liveMatches}
                                    selectedMatch={selectedMatch}
                                    onSelectMatch={setSelectedMatch}
                                />
                                
                                <ScheduledSection matches={scheduledMatches} />
                            </div>
                            
                            <div className="lg:col-span-1">
                                <ActivePredictions predictions={activePredictions} />
                            </div>
                        </div>
                    </main>
                    
                    {selectedMatch && (
                        <MatchDetail 
                            match={selectedMatch}
                            onClose={() => setSelectedMatch(null)}
                        />
                    )}
                    
                    {toast && (
                        <div className="fixed top-4 right-4 z-50 max-w-sm w-full bg-[#1a1a1a] border-l-4 border-[#D4AF37] rounded-lg shadow-2xl notification-slide p-4">
                            <div className="flex items-start gap-3">
                                <Icon name="bell" size={20} className="text-[#D4AF37] mt-1" />
                                <div className="flex-1">
                                    <h4 className="font-bold text-white text-sm">{toast.title}</h4>
                                    <p className="text-gray-400 text-xs mt-1">{toast.message}</p>
                                </div>
                                <button onClick={() => setToast(null)} className="text-gray-500 hover:text-white">
                                    <Icon name="x" size={16} />
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };
        
        // ============================================================
        // Rendu
        // ============================================================
        const rootElement = document.getElementById('root');
        if (rootElement) {
            const root = ReactDOM.createRoot(rootElement);
            root.render(
                <ErrorBoundary>
                    <App />
                </ErrorBoundary>
            );
        }
    </script>
</body>
</html>
