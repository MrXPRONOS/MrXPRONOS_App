<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
  <title>MrXPRONOS LIVE - VIP</title>

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

    :root {
      --bg: #070707;
      --bg-soft: #0d0d0d;
      --card: #121212;
      --line: #242424;
      --line-2: #2d2d2d;
      --gold: #D4AF37;
      --gold-soft: #f5e7a3;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --green: #22c55e;
      --red: #ef4444;
      --blue: #3b82f6;
      --orange: #f59e0b;
      --purple: #8b5cf6;
    }

    * {
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      background:
        radial-gradient(circle at top, rgba(212,175,55,.08), transparent 30%),
        linear-gradient(180deg, #090909 0%, #050505 100%);
      color: var(--text);
      margin: 0;
    }

    .gold-gradient {
      background: linear-gradient(135deg, #D4AF37 0%, #f5e7a3 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .glass {
      background: rgba(18,18,18,.88);
      backdrop-filter: blur(12px);
    }

    .card-hover {
      transition: all .25s ease;
    }

    .card-hover:hover {
      transform: translateY(-2px);
      border-color: rgba(212,175,55,.45);
      box-shadow: 0 10px 30px rgba(212,175,55,.08);
    }

    .live-pulse {
      animation: pulse-live 1.8s infinite;
    }

    @keyframes pulse-live {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: .4; transform: scale(.9); }
    }

    .vip-locked-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.94);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .vip-locked-content {
      background: linear-gradient(180deg, #131313 0%, #0d0d0d 100%);
      border: 1px solid rgba(212,175,55,.35);
      border-radius: 28px;
      padding: 30px;
      max-width: 460px;
      width: 100%;
      text-align: center;
      box-shadow: 0 0 60px rgba(212,175,55,.12);
    }

    .custom-scrollbar::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    .custom-scrollbar::-webkit-scrollbar-track {
      background: #0f0f0f;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #2e2e2e;
      border-radius: 999px;
    }

    .hero-glow {
      position: relative;
      overflow: hidden;
    }

    .hero-glow::after {
      content: "";
      position: absolute;
      inset: auto -20% -70% -20%;
      height: 260px;
      background: radial-gradient(circle, rgba(212,175,55,.12), transparent 60%);
      pointer-events: none;
    }

    .logo-ring {
      border: 1px solid rgba(255,255,255,.08);
      background: #0b0b0b;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.02);
    }

    .soft-border {
      border: 1px solid rgba(255,255,255,.06);
    }

    .top-opportunity {
      background:
        linear-gradient(135deg, rgba(212,175,55,.12) 0%, rgba(18,18,18,1) 45%),
        #121212;
    }

    .mini-dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      display: inline-block;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const SUPABASE_URL = "https://nhwafcpndlufzzxexikh.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_lclkhPk4SxHqvapianW4SQ_xZjDYvPt";
    const EDGE_FUNCTION_URL = `${SUPABASE_URL}/functions/v1/live`;

    // nécessaire pour les logos BSD
    const BSD_IMAGE_TOKEN = "YOUR_BSD_API_TOKEN";
    const BSD_IMAGE_BASE = "https://sports.bzzoiro.com";

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const { useState, useEffect, useCallback, useMemo, useRef } = React;

    function safeNumber(value, fallback = 0) {
      const n = Number(value);
      return Number.isFinite(n) ? n : fallback;
    }

    function formatPercent(value) {
      return `${Math.round(safeNumber(value, 0) * 100)}%`;
    }

    function formatDateTime(ts) {
      try {
        return new Date(ts).toLocaleString("fr-FR");
      } catch {
        return "-";
      }
    }

    function formatTime(ts) {
      try {
        return new Date(ts).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
      } catch {
        return "-";
      }
    }

    function getTeamLogo(match, side = "home") {
      const obj = side === "home" ? match?.home_team_obj : match?.away_team_obj;
      const apiId = obj?.api_id;
      if (!apiId || !BSD_IMAGE_TOKEN || BSD_IMAGE_TOKEN === "YOUR_BSD_API_TOKEN") return null;
      return `${BSD_IMAGE_BASE}/img/team/${apiId}/?token=${BSD_IMAGE_TOKEN}`;
    }

    function getLeagueLogo(match) {
      const apiId = match?.league?.api_id;
      if (!apiId || !BSD_IMAGE_TOKEN || BSD_IMAGE_TOKEN === "YOUR_BSD_API_TOKEN") return null;
      return `${BSD_IMAGE_BASE}/img/league/${apiId}/?token=${BSD_IMAGE_TOKEN}`;
    }

    const Icon = ({ name, size = 18, className = "" }) => {
      const map = {
        bell: "fa-bell",
        x: "fa-times",
        target: "fa-bullseye",
        radio: "fa-broadcast-tower",
        history: "fa-history",
        shield: "fa-shield-alt",
        bolt: "fa-bolt",
        fire: "fa-fire",
        chart: "fa-chart-line",
        star: "fa-star",
        eye: "fa-eye",
        arrowLeft: "fa-arrow-left",
        filter: "fa-filter",
        chartBar: "fa-chart-bar",
        waves: "fa-wave-square",
        crown: "fa-crown",
        trophy: "fa-trophy",
        clock: "fa-clock"
      };

      return <i className={`fas ${map[name] || "fa-circle"} ${className}`} style={{ fontSize: size }} />;
    };

    const Card = ({ children, className = "", onClick }) => (
      <div
        onClick={onClick}
        className={`bg-[#121212] border border-[#232323] rounded-2xl p-4 md:p-5 card-hover ${onClick ? "cursor-pointer" : ""} ${className}`}
      >
        {children}
      </div>
    );

    const Badge = ({ children, color = "gray" }) => {
      const colors = {
        green: "bg-green-500/15 text-green-400 border-green-500/30",
        blue: "bg-blue-500/15 text-blue-400 border-blue-500/30",
        red: "bg-red-500/15 text-red-400 border-red-500/30",
        orange: "bg-orange-500/15 text-orange-400 border-orange-500/30",
        yellow: "bg-yellow-500/15 text-yellow-300 border-yellow-500/30",
        gold: "bg-[#D4AF37]/15 text-[#D4AF37] border-[#D4AF37]/30",
        gray: "bg-gray-500/10 text-gray-300 border-gray-500/20",
        purple: "bg-purple-500/15 text-purple-400 border-purple-500/30"
      };

      return (
        <span className={`px-2.5 py-1 text-[11px] rounded-full border inline-flex items-center gap-1 font-medium ${colors[color] || colors.gray}`}>
          {children}
        </span>
      );
    };

    const ScoreBar = ({ value, label, color = "#D4AF37" }) => (
      <div>
        <div className="flex justify-between mb-1 text-xs">
          <span className="text-gray-400">{label}</span>
          <span className="font-bold" style={{ color }}>{Math.min(100, safeNumber(value, 0))}</span>
        </div>
        <div className="h-2 rounded-full bg-[#222] overflow-hidden">
          <div
            className="h-full rounded-full transition-all duration-500"
            style={{ width: `${Math.min(100, safeNumber(value, 0))}%`, background: color }}
          />
        </div>
      </div>
    );

    const FreshnessBadge = ({ seconds }) => {
      if (seconds == null) return <Badge color="gray">maj inconnue</Badge>;
      if (seconds <= 20) return <Badge color="green">maj {seconds}s</Badge>;
      if (seconds <= 45) return <Badge color="yellow">maj {seconds}s</Badge>;
      return <Badge color="red">maj {seconds}s</Badge>;
    };

    const HeatBadge = ({ level }) => {
      if (level === "explosive") return <Badge color="red">🔥 Explosif</Badge>;
      if (level === "hot") return <Badge color="orange">🔥 Chaud</Badge>;
      if (level === "warming") return <Badge color="yellow">♨️ Actif</Badge>;
      return <Badge color="gray">❄️ Calme</Badge>;
    };

    const PredictionBadge = ({ pred }) => {
      const colorMap = {
        green: "green",
        blue: "blue",
        orange: "orange",
        red: "red",
        yellow: "yellow",
        purple: "purple"
      };

      return <Badge color={colorMap[pred?.color] || "gold"}>{pred?.badge || pred?.title || "Signal"}</Badge>;
    };

    const StatChip = ({ label, value }) => (
      <div className="bg-[#0b0b0b] border border-[#202020] rounded-xl px-3 py-3">
        <div className="text-[11px] text-gray-500">{label}</div>
        <div className="text-sm font-bold text-white mt-1">{value}</div>
      </div>
    );

    const LogoImg = ({ src, alt, size = 34, className = "" }) => {
      const [failed, setFailed] = useState(false);

      if (!src || failed) {
        return (
          <div
            className={`logo-ring rounded-full flex items-center justify-center text-gray-500 ${className}`}
            style={{ width: size, height: size }}
          >
            <i className="fas fa-shield-alt text-xs"></i>
          </div>
        );
      }

      return (
        <img
          src={src}
          alt={alt}
          onError={() => setFailed(true)}
          className={`logo-ring rounded-full object-contain p-1 ${className}`}
          style={{ width: size, height: size }}
        />
      );
    };

    const TeamRow = ({ name, logo, align = "left" }) => (
      <div className={`flex items-center gap-2 ${align === "right" ? "justify-end" : ""}`}>
        {align !== "right" && <LogoImg src={logo} alt={name} size={30} />}
        <span className="font-semibold text-white text-sm md:text-base">{name}</span>
        {align === "right" && <LogoImg src={logo} alt={name} size={30} />}
      </div>
    );

    const VipLockOverlay = ({ onSubmit }) => {
      const [code, setCode] = useState("");
      const [error, setError] = useState("");

      const submit = (e) => {
        e.preventDefault();
        if (!code.trim()) {
          setError("Veuillez entrer votre code VIP");
          return;
        }
        setError("");
        onSubmit(code.trim());
      };

      return (
        <div className="vip-locked-overlay">
          <div className="vip-locked-content">
            <div className="w-16 h-16 mx-auto rounded-2xl bg-[#D4AF37]/12 border border-[#D4AF37]/30 flex items-center justify-center mb-5">
              <Icon name="crown" size={28} className="text-[#D4AF37]" />
            </div>

            <h2 className="text-3xl font-bold gold-gradient mb-3">LIVE VIP</h2>
            <p className="text-sm text-gray-300 mb-5 leading-relaxed">
              Accès aux meilleurs signaux live football : plus simples, plus lisibles,
              et centrés sur les statistiques réelles du match.
            </p>

            <div className="space-y-2 mb-5 text-left text-sm">
              <div className="bg-[#0a0a0a] p-3 rounded-xl border border-[#252525]">
                <div className="text-yellow-400 font-bold">📐 Over 9.5 corners — 84%</div>
                <div className="text-gray-400 text-xs">Actuel 7 • Projection 11 • Fiabilité élevée</div>
              </div>
              <div className="bg-[#0a0a0a] p-3 rounded-xl border border-[#252525]">
                <div className="text-green-400 font-bold">🎯 Over 21.5 tirs — 82%</div>
                <div className="text-gray-400 text-xs">Rythme fort • volume déjà élevé</div>
              </div>
            </div>

            <form onSubmit={submit} className="space-y-3">
              <input
                value={code}
                onChange={(e) => setCode(e.target.value)}
                placeholder="Entrez votre code VIP"
                className="w-full px-4 py-3 rounded-full bg-[#0a0a0a] border border-[#D4AF37]/60 text-white text-center outline-none"
              />
              {error && <div className="text-red-500 text-sm">{error}</div>}
              <button className="w-full py-3 rounded-full bg-[#D4AF37] text-black font-bold hover:opacity-95">
                Activer l'accès
              </button>
            </form>
          </div>
        </div>
      );
    };

    const Header = ({ stats, notifications, unreadCount, onClear, onBack }) => {
      const [open, setOpen] = useState(false);

      return (
        <header className="sticky top-0 z-40 glass border-b border-[#1e1e1e]">
          <div className="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between gap-4">
            <div className="flex items-center gap-3 min-w-0">
              <button onClick={onBack} className="p-2 rounded-xl hover:bg-[#1a1a1a] soft-border">
                <Icon name="arrowLeft" />
              </button>

              <div className="w-11 h-11 rounded-2xl bg-[#D4AF37]/12 border border-[#D4AF37]/25 flex items-center justify-center shrink-0">
                <Icon name="bolt" size={20} className="text-[#D4AF37]" />
              </div>

              <div className="min-w-0">
                <div className="text-xl md:text-2xl font-extrabold gold-gradient truncate">MrXPRONOS LIVE</div>
                <div className="text-xs text-gray-400 flex items-center gap-2 flex-wrap">
                  <span className="inline-flex items-center gap-1">
                    <span className="mini-dot bg-red-500 live-pulse"></span>
                    {stats.matches_live || 0} matchs live
                  </span>
                  <span className="text-gray-600">•</span>
                  <span>{stats.signals || 0} signaux actifs</span>
                </div>
              </div>
            </div>

            <div className="relative shrink-0">
              <button
                onClick={() => setOpen(!open)}
                className="p-2 rounded-xl hover:bg-[#1a1a1a] relative soft-border"
              >
                <Icon name="bell" />
                {unreadCount > 0 && (
                  <span className="absolute -top-1 -right-1 min-w-[20px] h-5 px-1 rounded-full bg-red-500 text-white text-[10px] flex items-center justify-center font-bold">
                    {unreadCount}
                  </span>
                )}
              </button>

              {open && (
                <div className="absolute right-0 mt-2 w-80 bg-[#121212] border border-[#2a2a2a] rounded-2xl shadow-2xl z-50 overflow-hidden">
                  <div className="p-3 flex items-center justify-between border-b border-[#232323]">
                    <div className="font-bold text-sm">Notifications</div>
                    <button onClick={onClear} className="text-xs text-gray-400 hover:text-white">
                      Tout lire
                    </button>
                  </div>

                  <div className="max-h-96 overflow-y-auto custom-scrollbar">
                    {notifications.length === 0 ? (
                      <div className="p-4 text-sm text-gray-500 text-center">Aucune notification</div>
                    ) : notifications.map((n, i) => (
                      <div key={i} className={`p-3 border-b border-[#1f1f1f] ${!n.read ? "bg-[#171717]" : ""}`}>
                        <div className="text-sm font-semibold">{n.title}</div>
                        <div className="text-xs text-gray-400 mt-1">{n.message}</div>
                        <div className="text-[10px] text-gray-500 mt-1">{formatTime(n.timestamp || n.created_at)}</div>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>
          </div>
        </header>
      );
    };

    const HeroSection = ({ stats, topSignalCount }) => (
      <div className="mb-8">
        <div className="hero-glow rounded-3xl border border-[#232323] bg-[#101010] px-5 py-6 md:px-7 md:py-7">
          <div className="grid lg:grid-cols-2 gap-6 items-center">
            <div>
              <div className="inline-flex items-center gap-2 mb-3">
                <Badge color="gold"><Icon name="crown" size={12} /> VIP LIVE</Badge>
                <Badge color="red"><span className="mini-dot bg-red-500 live-pulse"></span> En direct</Badge>
              </div>

              <h1 className="text-2xl md:text-4xl font-extrabold leading-tight mb-3">
                Les meilleurs <span className="gold-gradient">signaux football live</span>,
                simples à lire et rapides à exploiter.
              </h1>

              <p className="text-sm md:text-base text-gray-400 max-w-2xl leading-relaxed">
                Détection en temps réel des matchs actifs, rythme statistique, projections
                sur corners, tirs et fautes, avec focus sur les opportunités les plus propres.
              </p>
            </div>

            <div className="grid grid-cols-2 gap-4">
              <Card className="text-center bg-[#0d0d0d]">
                <div className="text-3xl font-extrabold text-red-500">{stats.matches_live || 0}</div>
                <div className="text-xs text-gray-400 mt-1">Matchs live</div>
              </Card>

              <Card className="text-center bg-[#0d0d0d]">
                <div className="text-3xl font-extrabold text-[#D4AF37]">{topSignalCount || 0}</div>
                <div className="text-xs text-gray-400 mt-1">Top signaux</div>
              </Card>

              <Card className="text-center bg-[#0d0d0d]">
                <div className="text-3xl font-extrabold text-blue-400">{stats.signals || 0}</div>
                <div className="text-xs text-gray-400 mt-1">Matchs avec signal</div>
              </Card>

              <Card className="text-center bg-[#0d0d0d]">
                <div className="text-3xl font-extrabold text-green-400">24/7</div>
                <div className="text-xs text-gray-400 mt-1">Suivi continu</div>
              </Card>
            </div>
          </div>
        </div>
      </div>
    );

    const OpportunityCard = ({ item, onOpen }) => {
      const best = item?.predictions?.[0];
      if (!best) return null;

      const homeLogo = getTeamLogo(item, "home");
      const awayLogo = getTeamLogo(item, "away");
      const leagueLogo = getLeagueLogo(item);

      return (
        <Card onClick={() => onOpen(item)} className="border-[#D4AF37]/20 top-opportunity">
          <div className="flex items-center justify-between gap-3 mb-4 flex-wrap">
            <div className="flex items-center gap-2 flex-wrap">
              <HeatBadge level={item.heat_level} />
              <FreshnessBadge seconds={item.freshness_seconds} />
              <Badge color="gold">TOP {item.value_score || 0}</Badge>
            </div>

            <div className="flex items-center gap-2 text-xs text-gray-400">
              <LogoImg src={leagueLogo} alt={item?.league?.name} size={22} />
              <span>{item?.league?.name || "Ligue"}</span>
            </div>
          </div>

          <div className="grid grid-cols-[1fr_auto_1fr] items-center gap-3 mb-4">
            <TeamRow name={item.home_team} logo={homeLogo} align="right" />

            <div className="px-3 py-2 rounded-xl bg-[#0a0a0a] border border-[#D4AF37]/30 text-center min-w-[95px]">
              <div className="text-lg font-extrabold text-[#D4AF37]">{item.home_score}-{item.away_score}</div>
              <div className="text-[11px] text-gray-400">{item.current_minute}'</div>
            </div>

            <TeamRow name={item.away_team} logo={awayLogo} align="left" />
          </div>

          <div className="mb-3 flex items-center gap-2 flex-wrap">
            <PredictionBadge pred={best} />
            <Badge color="green">{formatPercent(best.probability)}</Badge>
            <Badge color="blue">Fiabilité {best.reliability || 0}</Badge>
          </div>

          <div className="text-base font-bold text-white mb-1">{best.title}</div>
          <div className="text-sm text-[#D4AF37] mb-2">{best.message}</div>

          <div className="text-xs text-gray-300 mb-4">
            Actuel: <strong>{best.current ?? "-"}</strong> • Projection: <strong>{best.projected ?? "-"}</strong> • Seuil: <strong>{best.threshold ?? "-"}</strong>
          </div>

          <div className="grid grid-cols-2 gap-3 mb-4">
            <ScoreBar value={Math.round((best.probability || 0) * 100)} label="Probabilité" color="#22C55E" />
            <ScoreBar value={best.reliability || 0} label="Fiabilité" color="#D4AF37" />
          </div>

          {(best.reasons || []).length > 0 && (
            <>
              <div className="text-xs text-gray-400 mb-2">Pourquoi ce signal ?</div>
              <div className="space-y-1">
                {(best.reasons || []).slice(0, 3).map((r, i) => (
                  <div key={i} className="text-xs text-gray-300">• {r}</div>
                ))}
              </div>
            </>
          )}
        </Card>
      );
    };

    const MatchCard = ({ match, onOpen }) => {
      const best = match?.predictions?.[0] || null;

      const totalCorners =
        safeNumber(match?.live_stats?.home?.corner_kicks, 0) +
        safeNumber(match?.live_stats?.away?.corner_kicks, 0);

      const totalFouls =
        safeNumber(match?.live_stats?.home?.fouls, 0) +
        safeNumber(match?.live_stats?.away?.fouls, 0);

      const totalShots =
        safeNumber(match?.live_stats?.home?.total_shots, 0) +
        safeNumber(match?.live_stats?.away?.total_shots, 0);

      const homeLogo = getTeamLogo(match, "home");
      const awayLogo = getTeamLogo(match, "away");
      const leagueLogo = getLeagueLogo(match);

      return (
        <Card onClick={() => onOpen(match)}>
          <div className="flex items-center justify-between mb-4 gap-3 flex-wrap">
            <div className="flex items-center gap-2">
              <span className="w-2 h-2 bg-red-500 rounded-full live-pulse"></span>
              <span className="text-red-500 text-xs font-bold">LIVE {match.current_minute || 0}'</span>
              <span className="text-gray-600">•</span>
              <div className="flex items-center gap-2 text-xs text-gray-400">
                <LogoImg src={leagueLogo} alt={match?.league?.name} size={20} />
                <span>{match?.league?.name || "Ligue"}</span>
              </div>
            </div>

            <div className="flex items-center gap-2 flex-wrap justify-end">
              <HeatBadge level={match.heat_level} />
              <FreshnessBadge seconds={match.freshness_seconds} />
            </div>
          </div>

          <div className="grid grid-cols-[1fr_auto_1fr] items-center gap-3 mb-4">
            <TeamRow name={match.home_team} logo={homeLogo} align="right" />

            <div className="px-3 py-2 rounded-xl bg-[#0a0a0a] border border-[#252525] font-bold text-center min-w-[90px]">
              <div className="text-lg">{match.home_score}-{match.away_score}</div>
            </div>

            <TeamRow name={match.away_team} logo={awayLogo} align="left" />
          </div>

          <div className="grid grid-cols-3 gap-2 mb-4">
            <StatChip label="Corners" value={totalCorners} />
            <StatChip label="Fautes" value={totalFouls} />
            <StatChip label="Tirs" value={totalShots} />
          </div>

          {best ? (
            <div className="pt-4 border-t border-[#222]">
              <div className="flex items-center gap-2 mb-2 flex-wrap">
                <PredictionBadge pred={best} />
                <Badge color="green">{formatPercent(best.probability)}</Badge>
                <Badge color="blue">Fiabilité {best.reliability || 0}</Badge>
              </div>

              <div className="text-sm text-white font-bold">{best.title}</div>
              <div className="text-xs text-[#D4AF37] mt-1">{best.message}</div>
              <div className="text-xs text-gray-400 mt-2">
                Actuel {best.current ?? "-"} • Projection {best.projected ?? "-"} • Seuil {best.threshold ?? "-"}
              </div>
            </div>
          ) : (
            <div className="pt-4 border-t border-[#222] text-xs text-gray-500">
              Aucun signal fiable actuellement
            </div>
          )}
        </Card>
      );
    };

    const MatchDetail = ({ match, onClose }) => {
      const [tab, setTab] = useState("signals");
      if (!match) return null;

      const totalCorners =
        safeNumber(match?.live_stats?.home?.corner_kicks, 0) +
        safeNumber(match?.live_stats?.away?.corner_kicks, 0);

      const totalFouls =
        safeNumber(match?.live_stats?.home?.fouls, 0) +
        safeNumber(match?.live_stats?.away?.fouls, 0);

      const totalShots =
        safeNumber(match?.live_stats?.home?.total_shots, 0) +
        safeNumber(match?.live_stats?.away?.total_shots, 0);

      const homeLogo = getTeamLogo(match, "home");
      const awayLogo = getTeamLogo(match, "away");
      const leagueLogo = getLeagueLogo(match);

      return (
        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-[#121212] border border-[#262626] rounded-3xl w-full max-w-5xl max-h-[92vh] overflow-hidden shadow-2xl">
            <div className="p-5 md:p-6 border-b border-[#232323]">
              <div className="flex justify-between items-start gap-4">
                <div>
                  <div className="flex items-center gap-2 mb-3 flex-wrap">
                    <span className="w-2 h-2 bg-red-500 rounded-full live-pulse"></span>
                    <span className="text-red-500 text-sm font-bold">LIVE {match.current_minute || 0}'</span>
                    <span className="text-gray-600">|</span>
                    <div className="flex items-center gap-2 text-gray-400 text-sm">
                      <LogoImg src={leagueLogo} alt={match?.league?.name} size={22} />
                      <span>{match.league?.name || ""}</span>
                    </div>
                    <FreshnessBadge seconds={match.freshness_seconds} />
                  </div>

                  <div className="grid grid-cols-[1fr_auto_1fr] items-center gap-4">
                    <TeamRow name={match.home_team} logo={homeLogo} align="right" />
                    <div className="text-3xl md:text-4xl font-extrabold gold-gradient whitespace-nowrap">
                      {match.home_score}-{match.away_score}
                    </div>
                    <TeamRow name={match.away_team} logo={awayLogo} align="left" />
                  </div>

                  <div className="text-gray-400 text-sm mt-3">
                    {match.match_phase || "-"} • {match.heat_level || "-"}
                  </div>
                </div>

                <button onClick={onClose} className="p-2 rounded-xl hover:bg-[#1a1a1a] soft-border">
                  <Icon name="x" />
                </button>
              </div>
            </div>

            <div className="flex border-b border-[#232323]">
              {["signals", "stats"].map((t) => (
                <button
                  key={t}
                  onClick={() => setTab(t)}
                  className={`flex-1 py-3 text-sm capitalize font-medium ${
                    tab === t ? "text-[#D4AF37] border-b-2 border-[#D4AF37]" : "text-gray-400"
                  }`}
                >
                  {t === "signals" ? "Signaux" : "Statistiques"}
                </button>
              ))}
            </div>

            <div className="p-5 overflow-y-auto max-h-[60vh] custom-scrollbar">
              {tab === "signals" && (
                <div className="space-y-4">
                  {(match.predictions || []).length === 0 ? (
                    <div className="text-center text-gray-500 py-8">Aucun signal fiable actuellement</div>
                  ) : (
                    (match.predictions || []).map((p, i) => (
                      <div key={i} className="bg-[#0a0a0a] rounded-2xl p-4 border border-[#222]">
                        <div className="flex items-center justify-between gap-3 mb-3 flex-wrap">
                          <div className="flex gap-2 items-center flex-wrap">
                            <PredictionBadge pred={p} />
                            <div className="font-bold">{p.title}</div>
                          </div>

                          <div className="flex items-center gap-2">
                            <Badge color="green">{formatPercent(p.probability)}</Badge>
                            <Badge color="blue">Fiabilité {p.reliability || 0}</Badge>
                          </div>
                        </div>

                        <div className="text-sm text-[#D4AF37] mb-2">{p.message}</div>

                        <div className="text-xs text-gray-300 mb-4">
                          Actuel: <strong>{p.current ?? "-"}</strong> • Projection: <strong>{p.projected ?? "-"}</strong> • Seuil: <strong>{p.threshold ?? "-"}</strong>
                        </div>

                        <div className="grid grid-cols-2 gap-3 mb-4">
                          <ScoreBar value={Math.round((p.probability || 0) * 100)} label="Probabilité" color="#22C55E" />
                          <ScoreBar value={p.reliability || 0} label="Fiabilité" color="#D4AF37" />
                        </div>

                        {(p.reasons || []).length > 0 && (
                          <>
                            <div className="text-xs text-gray-400 mb-2">Pourquoi ?</div>
                            <div className="space-y-1">
                              {(p.reasons || []).slice(0, 3).map((r, idx) => (
                                <div key={idx} className="text-sm text-gray-300">• {r}</div>
                              ))}
                            </div>
                          </>
                        )}
                      </div>
                    ))
                  )}
                </div>
              )}

              {tab === "stats" && (
                <div className="space-y-4">
                  <ScoreBar value={match.ai_score || 0} label="Score IA" color="#D4AF37" />
                  <ScoreBar value={match.reliability_score || 0} label="Fiabilité" color="#3B82F6" />
                  <ScoreBar value={match.data_quality_score || 0} label="Qualité données" color="#8B5CF6" />

                  <div className="grid md:grid-cols-2 gap-4 mt-4">
                    <Card className="bg-[#0d0d0d]">
                      <div className="text-xs text-gray-400 mb-2">Pression</div>
                      <div className="text-sm">{match.home_team}: {match.pressure_index?.home_ratio || 0}%</div>
                      <div className="text-sm">{match.away_team}: {match.pressure_index?.away_ratio || 0}%</div>
                      <div className="text-xs text-gray-500 mt-2">
                        Dominant: {match.pressure_index?.dominant_side || "-"}
                      </div>
                    </Card>

                    <Card className="bg-[#0d0d0d]">
                      <div className="text-xs text-gray-400 mb-2">Stats clés</div>
                      <div className="text-sm">Corners: {totalCorners}</div>
                      <div className="text-sm">Fautes: {totalFouls}</div>
                      <div className="text-sm">Tirs: {totalShots}</div>
                    </Card>
                  </div>

                  <div className="grid md:grid-cols-3 gap-3">
                    <StatChip label="Score IA" value={match.ai_score || 0} />
                    <StatChip label="Value Score" value={match.value_score || 0} />
                    <StatChip label="Minute" value={`${match.current_minute || 0}'`} />
                  </div>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    };

    const EmptyState = ({ title, subtitle }) => (
      <Card className="text-center py-12 bg-[#101010]">
        <div className="w-14 h-14 mx-auto mb-4 rounded-2xl bg-[#161616] border border-[#232323] flex items-center justify-center">
          <Icon name="waves" className="text-[#D4AF37]" />
        </div>
        <div className="text-lg font-semibold text-gray-300 mb-2">{title}</div>
        <div className="text-sm text-gray-500">{subtitle}</div>
      </Card>
    );

    const App = () => {
      const [userId] = useState(() => localStorage.getItem("mrx_user_id") || `user_${Date.now()}`);
      const [vipCode, setVipCode] = useState(() => localStorage.getItem("mx_vip_code") || "");
      const [isVip, setIsVip] = useState(false);
      const [vipChecking, setVipChecking] = useState(true);

      const [liveMatches, setLiveMatches] = useState([]);
      const [opportunities, setOpportunities] = useState([]);
      const [history, setHistory] = useState([]);
      const [notifications, setNotifications] = useState([]);
      const [stats, setStats] = useState({ matches_live: 0, signals: 0 });

      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const [selectedTab, setSelectedTab] = useState("live");
      const [selectedMatch, setSelectedMatch] = useState(null);
      const [toast, setToast] = useState(null);

      const prevNotifIds = useRef(new Set());

      useEffect(() => {
        localStorage.setItem("mrx_user_id", userId);
      }, [userId]);

      const checkVip = useCallback(async (code) => {
        if (!code) {
          setIsVip(false);
          setVipChecking(false);
          return;
        }

        try {
          const res = await fetch(`${EDGE_FUNCTION_URL}/check-vip?code=${encodeURIComponent(code)}`);
          const data = await res.json();
          setIsVip(data.valid === true);
        } catch (e) {
          console.error(e);
          setIsVip(false);
        } finally {
          setVipChecking(false);
        }
      }, []);

      useEffect(() => {
        checkVip(vipCode);
      }, [vipCode, checkVip]);

      const apiFetch = useCallback(async (endpoint, isPublic = false) => {
        const sep = endpoint.includes("?") ? "&" : "?";
        const url = !isPublic && vipCode
          ? `${EDGE_FUNCTION_URL}${endpoint}${sep}vip_code=${encodeURIComponent(vipCode)}`
          : `${EDGE_FUNCTION_URL}${endpoint}`;

        const res = await fetch(url);

        if (res.status === 403) {
          setIsVip(false);
          localStorage.removeItem("mx_vip_code");
          setVipCode("");
          throw new Error("Accès VIP requis");
        }

        if (!res.ok) {
          throw new Error(`Erreur API ${res.status}`);
        }

        return res;
      }, [vipCode]);

      const fetchNotifications = useCallback(async () => {
        const res = await apiFetch(`/notifications?user_id=${encodeURIComponent(userId)}`, true);
        const notifData = await res.json();
        const list = notifData.notifications || [];

        const previous = prevNotifIds.current;
        const newUnread = list.find(n => !previous.has(n.id) && !n.read);

        if (newUnread) {
          setToast({ title: newUnread.title, message: newUnread.message });
          setTimeout(() => setToast(null), 5000);
        }

        prevNotifIds.current = new Set(list.map(n => n.id));
        setNotifications(list);
      }, [apiFetch, userId]);

      const fetchAll = useCallback(async () => {
        const [matchesRes, oppRes, historyRes] = await Promise.all([
          apiFetch("/matches"),
          apiFetch("/opportunities"),
          apiFetch("/predictions/history", true)
        ]);

        const matchesData = await matchesRes.json();
        const oppData = await oppRes.json();
        const historyData = await historyRes.json();

        const matches = matchesData.matches || [];
        const opps = oppData.opportunities || [];
        const hist = historyData.history || [];

        setLiveMatches(matches);
        setOpportunities(opps);
        setHistory(hist);

        const signalsCount = matches.reduce((acc, m) => acc + ((m.predictions || []).length > 0 ? 1 : 0), 0);

        setStats({
          matches_live: matches.length,
          signals: signalsCount
        });

        await fetchNotifications();
      }, [apiFetch, fetchNotifications]);

      useEffect(() => {
        if (!isVip || vipChecking) return;

        setLoading(true);
        setError(null);

        fetchAll()
          .catch((e) => {
            console.error(e);
            setError("Impossible de charger les données live.");
          })
          .finally(() => setLoading(false));
      }, [isVip, vipChecking, fetchAll]);

      useEffect(() => {
        if (!isVip || vipChecking) return;

        const interval = setInterval(() => {
          fetchAll().catch(console.error);
        }, 20000);

        return () => clearInterval(interval);
      }, [isVip, vipChecking, fetchAll]);

      useEffect(() => {
        if (!SUPABASE_ANON_KEY || SUPABASE_ANON_KEY === "YOUR_SUPABASE_ANON_KEY") return;

        const channel = supabase
          .channel("notifications-channel")
          .on(
            "postgres_changes",
            { event: "INSERT", schema: "public", table: "notifications" },
            (payload) => {
              const notif = payload.new;
              if (notif.user_id === "all" || notif.user_id === userId) {
                const normalized = {
                  ...notif,
                  timestamp: new Date(notif.created_at).getTime()
                };
                setNotifications((prev) => [normalized, ...prev].slice(0, 50));
                setToast({ title: notif.title, message: notif.message });
                setTimeout(() => setToast(null), 5000);
              }
            }
          )
          .subscribe();

        return () => {
          supabase.removeChannel(channel);
        };
      }, [userId]);

      const unreadCount = notifications.filter((n) => !n.read).length;
      const bestOpportunity = useMemo(() => opportunities?.[0] || null, [opportunities]);

      const clearNotifications = async () => {
        try {
          const ids = notifications.filter(n => !n.read).map(n => n.id);
          if (!ids.length) return;

          await fetch(`${EDGE_FUNCTION_URL}/notifications/mark-read`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ notification_ids: ids })
          });

          setNotifications((prev) => prev.map((n) => ({ ...n, read: true })));
        } catch (e) {
          console.error(e);
        }
      };

      if (vipChecking) {
        return (
          <div className="min-h-screen flex items-center justify-center">
            <div className="text-center">
              <div className="w-12 h-12 border-4 border-[#D4AF37] border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
              <div className="text-gray-400">Vérification de l'accès...</div>
            </div>
          </div>
        );
      }

      if (!isVip) {
        return (
          <VipLockOverlay
            onSubmit={(code) => {
              localStorage.setItem("mx_vip_code", code);
              setVipCode(code);
            }}
          />
        );
      }

      if (error) {
        return (
          <div className="min-h-screen flex items-center justify-center px-4">
            <div className="text-center">
              <div className="text-red-500 text-xl mb-3">Erreur</div>
              <div className="text-gray-400 mb-4">{error}</div>
              <button
                onClick={() => window.location.reload()}
                className="px-4 py-2 bg-[#D4AF37] text-black rounded-lg font-bold"
              >
                Réessayer
              </button>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-[#0a0a0a]">
          <Header
            stats={stats}
            notifications={notifications}
            unreadCount={unreadCount}
            onClear={clearNotifications}
            onBack={() => window.location.href = "index.html"}
          />

          <main className="max-w-7xl mx-auto px-4 py-6">
            {!selectedMatch && (
              <>
                <HeroSection stats={stats} topSignalCount={opportunities.length || 0} />

                <div className="flex gap-3 mb-6">
                  <button
                    onClick={() => setSelectedTab("live")}
                    className={`px-4 py-2 rounded-xl font-semibold transition-colors ${
                      selectedTab === "live" ? "bg-[#D4AF37] text-black" : "bg-[#151515] text-gray-300 border border-[#252525]"
                    }`}
                  >
                    Live
                  </button>

                  <button
                    onClick={() => setSelectedTab("history")}
                    className={`px-4 py-2 rounded-xl font-semibold transition-colors ${
                      selectedTab === "history" ? "bg-[#D4AF37] text-black" : "bg-[#151515] text-gray-300 border border-[#252525]"
                    }`}
                  >
                    Historique
                  </button>
                </div>

                {selectedTab === "live" && (
                  loading ? (
                    <div className="py-20 text-center">
                      <div className="w-12 h-12 border-4 border-[#D4AF37] border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
                      <div className="text-gray-400">Chargement des signaux live...</div>
                    </div>
                  ) : (
                    <>
                      {bestOpportunity && (
                        <div className="mb-8">
                          <div className="text-lg font-bold mb-4 flex items-center gap-2">
                            <Icon name="star" className="text-[#D4AF37]" />
                            Top opportunité
                          </div>
                          <OpportunityCard item={bestOpportunity} onOpen={setSelectedMatch} />
                        </div>
                      )}

                      <div className="mb-8">
                        <div className="text-lg font-bold mb-4 flex items-center gap-2">
                          <Icon name="target" className="text-[#D4AF37]" />
                          Opportunités live
                        </div>

                        {opportunities.length === 0 ? (
                          <EmptyState
                            title="Aucune opportunité premium"
                            subtitle="Le moteur live attend un contexte suffisamment fiable."
                          />
                        ) : (
                          <div className="grid gap-4 md:grid-cols-2">
                            {opportunities.map((item) => (
                              <OpportunityCard key={item.id || `${item.home_team}-${item.away_team}-${item.current_minute}`} item={item} onOpen={setSelectedMatch} />
                            ))}
                          </div>
                        )}
                      </div>

                      <div className="mb-8">
                        <div className="text-lg font-bold mb-4 flex items-center gap-2">
                          <Icon name="radio" className="text-red-500" />
                          Tous les matchs live
                        </div>

                        {liveMatches.length === 0 ? (
                          <EmptyState
                            title="Aucun match live"
                            subtitle="Le cache live ne contient actuellement aucun match en cours."
                          />
                        ) : (
                          <div className="grid gap-4 md:grid-cols-2">
                            {liveMatches.map((m) => (
                              <MatchCard key={m.id} match={m} onOpen={setSelectedMatch} />
                            ))}
                          </div>
                        )}
                      </div>
                    </>
                  )
                )}

                {selectedTab === "history" && (
                  <div>
                    <div className="text-lg font-bold mb-4 flex items-center gap-2">
                      <Icon name="history" className="text-[#D4AF37]" />
                      Historique des pronostics
                    </div>

                    {history.length === 0 ? (
                      <EmptyState
                        title="Aucun historique"
                        subtitle="Les validations apparaîtront ici dès qu'un signal sera créé."
                      />
                    ) : (
                      <div className="bg-[#121212] rounded-2xl border border-[#232323] overflow-hidden">
                        <div className="overflow-x-auto custom-scrollbar">
                          <table className="w-full text-sm min-w-[900px]">
                            <thead className="bg-[#0b0b0b] border-b border-[#232323]">
                              <tr>
                                <th className="px-4 py-3 text-left">Match</th>
                                <th className="px-4 py-3 text-left">Type</th>
                                <th className="px-4 py-3 text-left">Proba</th>
                                <th className="px-4 py-3 text-left">Actuel</th>
                                <th className="px-4 py-3 text-left">Projection</th>
                                <th className="px-4 py-3 text-left">Résultat</th>
                                <th className="px-4 py-3 text-left">Heure</th>
                              </tr>
                            </thead>
                            <tbody>
                              {history.map((h, i) => (
                                <tr key={i} className="border-b border-[#1f1f1f] hover:bg-[#151515]">
                                  <td className="px-4 py-3">{h.match}</td>
                                  <td className="px-4 py-3">{h.type}</td>
                                  <td className="px-4 py-3">{formatPercent(h.probability)}</td>
                                  <td className="px-4 py-3">{h.current ?? "-"}</td>
                                  <td className="px-4 py-3">{h.projected ?? "-"}</td>
                                  <td className="px-4 py-3">
                                    {h.validated ? (
                                      <span className={h.outcome === "success" ? "text-green-400" : "text-red-400"}>
                                        {h.outcome === "success" ? "✓ Réussi" : "✗ Échoué"}
                                      </span>
                                    ) : (
                                      <span className="text-yellow-400">En attente</span>
                                    )}
                                  </td>
                                  <td className="px-4 py-3">{formatDateTime(h.timestamp)}</td>
                                </tr>
                              ))}
                            </tbody>
                          </table>
                        </div>
                      </div>
                    )}
                  </div>
                )}
              </>
            )}

            {selectedMatch && (
              <MatchDetail
                match={selectedMatch}
                onClose={() => setSelectedMatch(null)}
              />
            )}
          </main>

          {toast && (
            <div className="fixed top-4 right-4 z-50 w-full max-w-sm bg-[#121212] border border-[#2b2b2b] border-l-4 border-[#D4AF37] rounded-2xl shadow-2xl p-4">
              <div className="flex items-start gap-3">
                <div className="w-9 h-9 rounded-xl bg-[#D4AF37]/12 border border-[#D4AF37]/25 flex items-center justify-center shrink-0">
                  <Icon name="bell" className="text-[#D4AF37]" />
                </div>
                <div className="flex-1">
                  <div className="font-bold text-sm">{toast.title}</div>
                  <div className="text-xs text-gray-400 mt-1">{toast.message}</div>
                </div>
                <button onClick={() => setToast(null)} className="text-gray-500 hover:text-white">
                  <Icon name="x" />
                </button>
              </div>
            </div>
          )}
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
