    function showBootError(message) {
      const root = document.getElementById("root");
      if (!root) return;
      root.innerHTML = `
        <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#090909;color:#f3f4f6;font-family:Arial,sans-serif">
          <div style="max-width:620px;width:100%;padding:24px;border:1px solid rgba(239,68,68,.45);border-radius:20px;background:#121212;box-shadow:0 24px 70px rgba(0,0,0,.7)">
            <div style="font-size:22px;font-weight:800;color:#ef4444;margin-bottom:10px">Erreur de chargement LIVE</div>
            <div style="line-height:1.6;color:#d1d5db;word-break:break-word">${String(message || "Erreur inconnue")}</div>
            <button onclick="location.reload()" style="margin-top:18px;padding:11px 18px;border:0;border-radius:999px;background:#D4AF37;color:#000;font-weight:800;cursor:pointer">Réessayer</button>
          </div>
        </div>`;
    }

    window.addEventListener("error", function (event) {
      const message = event && event.message ? event.message : "Une ressource ou un script n’a pas pu être chargé.";
      showBootError(message);
    });

    window.addEventListener("unhandledrejection", function (event) {
      const reason = event && event.reason;
      showBootError(reason && reason.message ? reason.message : String(reason || "Promesse rejetée"));
    });
  </script>

    /* =======================================================
       ✅ PRONOSTIC BOX (pop-out + heartbeat)
       ======================================================= */
    .pronostic-pop{
      position: relative;
      background: radial-gradient(circle at 30% 20%, rgba(212,175,55,.10), transparent 45%),

  <script type="text/babel">
    // =======================================================
    // CONFIG
    // =======================================================
    const SUPABASE_URL = "https://nhwafcpndlufzzxexikh.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_lclkhPk4SxHqvapianW4SQ_xZjDYvPt";
    const EDGE_FUNCTION_URL = `${SUPABASE_URL}/functions/v1/live`;

    const supabaseClient =
      SUPABASE_ANON_KEY &&
      SUPABASE_ANON_KEY !== "YOUR_SUPABASE_ANON_KEY" &&
      window.supabase &&
      typeof window.supabase.createClient === "function"
        ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
        : null;

    const { useState, useEffect, useCallback, useMemo } = React;

    // =======================================================
    // COOKIES (365 jours) + ID stable
    // =======================================================
    const COOKIE_DAYS = 365;

    function getCookie(name) {
      const m = document.cookie.match(
        new RegExp('(?:^|; )' + name.replace(/([.$?*|{}()[\]\\/+^])/g, '\\$1') + '=([^;]*)')
      );
      return m ? decodeURIComponent(m[1]) : null;
    }

    function setCookie(name, value, days = COOKIE_DAYS) {
      const expires = new Date(Date.now() + days * 864e5).toUTCString();
      const secure = location.protocol === 'https:' ? '; Secure' : '';
      document.cookie = `${name}=${encodeURIComponent(value)}; Expires=${expires}; Path=/; SameSite=Lax${secure}`;
    }

    function getUserId() {
      let userId = localStorage.getItem("mx_user_id") || getCookie("mx_user_id");
      if (!userId) {
        try { userId = "MX-" + crypto.randomUUID(); }
        catch { userId = "MX-" + Date.now().toString(36) + Math.random().toString(36).slice(2); }
      }
      localStorage.setItem("mx_user_id", userId);
      setCookie("mx_user_id", userId, COOKIE_DAYS);
      return userId;
    }

    // =======================================================
    // UTILS
    // =======================================================
    function safeNumber(value, fallback = 0) {
      const n = Number(value);
      return Number.isFinite(n) ? n : fallback;
    }
    function formatPercent(value) {
      return `${Math.round(safeNumber(value, 0) * 100)}%`;
    }
    function formatDateTime(ts) {
      try { return new Date(ts).toLocaleString("fr-FR"); } catch { return "-"; }
    }
    function formatTime(ts) {
      try {
        return new Date(ts).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
      } catch { return "-"; }
    }
    function formatNumberFR(v) {
      if (v === null || v === undefined || v === "") return "";
      const n = Number(v);
      if (!Number.isFinite(n)) return String(v);
      return String(n).replace(".", ",");
    }

    function guessUnitFromPred(pred) {
      const s = `${pred?.badge || ""} ${pred?.title || ""}`.toLowerCase();
      if (s.includes("corner")) return "corners";
      if (s.includes("shot") || s.includes("tir")) return "tirs";
      if (s.includes("foul") || s.includes("faute")) return "fautes";
      return "";
    }

    // - "Pronostic :" en OR uniquement
    // - "Total plus de ..." en BLANC
    // - "seuil" devient "pronostic"
    function formatPredTitleSimple(pred) {
      const unit = guessUnitFromPred(pred);
      const thrVal = pred?.pronostic ?? pred?.threshold;
      const thr = formatNumberFR(thrVal);
      const title = String(pred?.title || "").toLowerCase();

      const isOver = title.includes("over") || title.includes("plus de");
      const isUnder = title.includes("under") || title.includes("moins de");

      if (thr && (isOver || isUnder)) {
        const verb = isOver ? "plus de" : "moins de";
        return (
          <>
            <span className="text-[#D4AF37]">Pronostic :</span>
            <span>{`Total ${verb} ${thr}${unit ? " " + unit : ""}`}</span>
          </>
        );
      }

      if (pred?.title) {
        return (
          <>
            <span className="text-[#D4AF37]">Pronostic :</span>
            <span>{pred.title}</span>
          </>
        );
      }

      return <span className="text-[#D4AF37]">Pronostic :</span>;
    }

    // "projection" remplacée par "Au signal"
    function formatPredSubtitle(pred) {
      const auSignal = pred?.signal_value ?? pred?.projected ?? "-";
      const current = pred?.current ?? pred?.current_value ?? "-";
      return `Au signal: ${formatNumberFR(auSignal)} • Actuel: ${formatNumberFR(current)}`;
    }

    // meta historique => un "pred" compatible UI
    function metaFromHistoryType(type, threshold) {
      const t = safeNumber(threshold, 0);
      if (type === "total_corners") return { badge: "Corners", color: "yellow", title: `Over ${t} corners` };
      if (type === "total_shots") return { badge: "Tirs", color: "green", title: `Over ${t} tirs` };
      if (type === "total_fouls") return { badge: "Fautes", color: "orange", title: `Over ${t} fautes` };
      return { badge: "Signal", color: "gold", title: `Over ${t}` };
    }

    // =======================================================
    // LOGOS via Edge Function Proxy
    // =======================================================
    function getTeamLogo(match, side = "home") {
      const obj = side === "home" ? match?.home_team_obj : match?.away_team_obj;
      const directId = side === "home" ? match?.home_team_id : match?.away_team_id;
      const apiId = obj?.api_id || obj?.id || directId || match?.[`${side}_id`];
      if (!apiId) return null;
      return `${EDGE_FUNCTION_URL}/img/team/${apiId}`;
    }
    function getLeagueLogo(match) {
      const apiId = match?.league?.api_id || match?.league?.id || match?.league_id;
      if (!apiId) return null;
      return `${EDGE_FUNCTION_URL}/img/league/${apiId}`;
    }

    // =======================================================
    // UI COMPONENTS
    // =======================================================
    const UiIcon = ({ name, size = 18, className = "" }) => {
      const common = {
        width: size,
        height: size,
        viewBox: "0 0 24 24",
        fill: "none",
        stroke: "currentColor",
        strokeWidth: 2,
        strokeLinecap: "round",
        strokeLinejoin: "round",
        className,
        "aria-hidden": "true"
      };
      if (name === "arrowLeft") return <svg {...common}><path d="M19 12H5" /><path d="m12 19-7-7 7-7" /></svg>;
      if (name === "x") return <svg {...common}><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg>;
      if (name === "refresh") return <svg {...common}><path d="M20 11a8 8 0 1 0 2 5" /><path d="M20 4v7h-7" /></svg>;
      if (name === "bell") return <svg {...common}><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9" /><path d="M10 21h4" /></svg>;
      return <svg {...common}><circle cx="12" cy="12" r="8" /></svg>;
    };

    const LIVE_ASSETS = {
      stopwatch: "assets/images/live-premium/icon-stopwatch.webp",
      ball: "assets/images/live-premium/icon-ball.webp",
      corner: "assets/images/live-premium/icon-corner.webp",
      cards: "assets/images/live-premium/icon-cards.webp",
      whistle: "assets/images/live-premium/icon-whistle.webp",
      target: "assets/images/live-premium/icon-target.webp",
      pie: "assets/images/live-premium/icon-pie.webp",
      bars: "assets/images/live-premium/icon-bars.webp",
    };

    const LiveAssetIcon = ({ name, size = 30, className = "" }) => (
      <img
        src={LIVE_ASSETS[name] || LIVE_ASSETS.bars}
        alt=""
        aria-hidden="true"
        className={className}
        style={{ width: size, height: size, objectFit: "contain" }}
      />
    );

    function assetForPrediction(pred) {
      const type = String(pred?.type || pred?.badge || pred?.title || "").toLowerCase();
      if (type.includes("corner")) return "corner";
      if (type.includes("shot") || type.includes("tir")) return "ball";
      if (type.includes("foul") || type.includes("faute")) return "whistle";
      if (type.includes("card") || type.includes("booking") || type.includes("carton")) return "cards";
      return "ball";
    }

    function marketToneForPrediction(pred) {
      const type = String(pred?.type || pred?.badge || pred?.title || "").toLowerCase();
      if (type.includes("corner")) return "corners";
      if (type.includes("shot") || type.includes("tir")) return "shots";
      if (type.includes("foul") || type.includes("faute")) return "fouls";
      if (type.includes("card") || type.includes("booking") || type.includes("carton")) return "cards";
      return "generic";
    }

    function currentValueForPrediction(match, pred) {
      const explicit = pred?.current ?? pred?.current_value;
      if (explicit !== null && explicit !== undefined && explicit !== "" && Number.isFinite(Number(explicit))) {
        return Number(explicit);
      }

      const type = String(pred?.type || pred?.badge || pred?.title || "").toLowerCase();
      if (type.includes("corner")) {
        return safeNumber(match?.live_stats?.home?.corner_kicks, 0) + safeNumber(match?.live_stats?.away?.corner_kicks, 0);
      }
      if (type.includes("shot") || type.includes("tir")) {
        return safeNumber(match?.live_stats?.home?.total_shots, 0) + safeNumber(match?.live_stats?.away?.total_shots, 0);
      }
      if (type.includes("foul") || type.includes("faute")) {
        return safeNumber(match?.live_stats?.home?.fouls, 0) + safeNumber(match?.live_stats?.away?.fouls, 0);
      }
      return 0;
    }

    function thresholdForPrediction(pred) {
      const raw = pred?.pronostic ?? pred?.threshold;
      return Number.isFinite(Number(raw)) ? Number(raw) : 0;
    }

    function confidenceForPrediction(pred) {
      const p = safeNumber(pred?.probability, 0);
      return Math.max(0, Math.min(100, Math.round(p <= 1 ? p * 100 : p)));
    }

    function reliabilityForPrediction(match, pred) {
      const raw = pred?.reliability ?? match?.reliability_score ?? match?.data_quality_score;
      if (raw === undefined || raw === null || raw === "") return null;
      const value = Number(raw);
      if (!Number.isFinite(value)) return null;
      const normalized = value <= 1 ? value * 100 : value;
      return Math.max(0, Math.min(100, Math.round(normalized)));
    }

    function marketProgress(match, pred) {
      const current = currentValueForPrediction(match, pred);
      const line = thresholdForPrediction(pred);
      if (line <= 0) return confidenceForPrediction(pred);
      return Math.max(0, Math.min(100, Math.round((current / line) * 100)));
    }

    const Card = ({ children, className = "", onClick, hover = true }) => (

    const App = () => {
      const [userId] = useState(() => getUserId());

      const [liveMatches, setLiveMatches] = useState([]);
      const [opportunities, setOpportunities] = useState([]);
      const [scheduledMatches, setScheduledMatches] = useState([]);
      const [history, setHistory] = useState([]);
      const [notifications, setNotifications] = useState([]);

      const [stats, setStats] = useState({ matches_live: 0, predictions: 0, upcoming: 0 });

      const [loading, setLoading] = useState(true);
      const [refreshing, setRefreshing] = useState(false);
      const [error, setError] = useState(null);
      const [refreshWarning, setRefreshWarning] = useState(null);
      const refreshBusy = React.useRef(false);
      const successfulLoad = React.useRef(false);

      const [selectedTab, setSelectedTab] = useState("live"); // live | upcoming | history | notifications
      const [liveMarketFilter, setLiveMarketFilter] = useState("all"); // all | corners | shots | fouls | best
      const [selectedMatch, setSelectedMatch] = useState(null);
      const [selectedPrediction, setSelectedPrediction] = useState(null);
      const [toast, setToast] = useState(null);

      useEffect(() => {
        setSelectedMatch(null);
        setSelectedPrediction(null);
      }, [selectedTab]);

      const apiFetch = useCallback(async (endpoint) => {
        const url = `${EDGE_FUNCTION_URL}${endpoint}`;
        const res = await fetch(url);
        if (!res.ok) {
          let message = `Erreur API ${res.status}`;
          try {
            const err = await res.json();
            if (err?.error) message = err.error;
          } catch (_) {}
          throw new Error(message);
        }
        return res;
      }, []);

      const fetchAll = useCallback(async (silent = false) => {
        if (refreshBusy.current) return;
        refreshBusy.current = true;
        if (!silent && !successfulLoad.current) setLoading(true);
        setRefreshing(true);
        try {
          // Une erreur dans les notifications ne doit pas supprimer les matchs LIVE.
          const results = await Promise.allSettled([
            apiFetch("/matches").then(r => r.json()),
            apiFetch("/opportunities").then(r => r.json()),
            apiFetch(`/notifications?user_id=${encodeURIComponent(userId)}`).then(r => r.json()),
            apiFetch("/predictions/history").then(r => r.json()),
            apiFetch("/today").then(r => r.json())
          ]);
          const ok = (index) => results[index].status === "fulfilled";
          const hadCoreData = ok(0) || ok(1) || ok(4);
          if (!hadCoreData && !successfulLoad.current) {
            throw new Error("Impossible de récupérer les matchs LIVE. Veuillez réessayer.");
          }
          if (ok(0)) {
            const matches = results[0].value?.matches || [];
            setLiveMatches(matches);
            setStats(prev => ({
              ...prev,
              matches_live: matches.length,
              predictions: matches.reduce((acc, m) => acc + (m.predictions || []).length, 0)
            }));
          }
          if (ok(1)) setOpportunities(results[1].value?.opportunities || []);
          if (ok(2)) setNotifications(results[2].value?.notifications || []);
          if (ok(3)) setHistory(results[3].value?.history || []);
          if (ok(4)) {
            const scheduled = results[4].value?.data?.scheduled?.matches || [];
            setScheduledMatches(scheduled);
            setStats(prev => ({ ...prev, upcoming: scheduled.length }));
          }
          const failures = results.filter(r => r.status === "rejected");
          if (failures.length) {
            console.warn("Certaines données LIVE sont momentanément indisponibles.", failures.map(r => r.reason));
            setRefreshWarning("Certaines données n'ont pas été actualisées.");
          } else {
            setRefreshWarning(null);
          }
          successfulLoad.current = successfulLoad.current || hadCoreData || ok(2) || ok(3);
          setError(null);
        } catch (e) {
          console.error(e);
          if (successfulLoad.current) {
            setRefreshWarning("Mise à jour momentanément indisponible. Dernières données conservées.");
          } else {
            setError(e?.message || "Impossible de charger les données LIVE.");
          }
        } finally {
          setLoading(false);
          setRefreshing(false);
          refreshBusy.current = false;
        }
      }, [apiFetch, userId]);

      useEffect(() => { fetchAll(false); }, [fetchAll]);

      useEffect(() => {
        const interval = setInterval(() => {
          if (document.visibilityState !== "hidden") fetchAll(true).catch(console.error);
        }, 20000);
        return () => clearInterval(interval);
      }, [fetchAll]);

      // realtime notifications (toast)
      useEffect(() => {
        if (!supabaseClient) return;
        const channel = supabaseClient
          .channel("notifications-channel")
          .on(
            "postgres_changes",
            { event: "INSERT", schema: "public", table: "notifications" },
            (payload) => {
              const notif = payload.new;
              if (notif.user_id === "all" || notif.user_id === userId) {
                const normalized = { ...notif, timestamp: new Date(notif.created_at).getTime() };
                setNotifications((prev) => [normalized, ...prev].slice(0, 50));
                setToast({ title: notif.title, message: notif.message });
                setTimeout(() => setToast(null), 6000);
              }
            }
          )
          .subscribe();

        return () => { supabaseClient.removeChannel(channel); };
      }, [userId]);

      const unreadCount = notifications.filter((n) => !n.read).length;

      const marketCategoryFor = useCallback((match) => {
        const pred = match?.predictions?.[0] || null;
        const text = String(pred?.type || pred?.badge || pred?.title || "").toLowerCase();
        if (text.includes("corner")) return "corners";
        if (text.includes("shot") || text.includes("tir")) return "shots";
        if (text.includes("foul") || text.includes("faute")) return "fouls";
        return "other";
      }, []);

      const isBestSignal = useCallback((match) => {
        const pred = match?.predictions?.[0] || null;
        const probability = safeNumber(pred?.probability, 0);
        const reliability = safeNumber(pred?.reliability, 0);
        const valueScore = safeNumber(match?.value_score, 0);
        return probability >= 0.7 || reliability >= 70 || valueScore >= 70;
      }, []);

      const filterLiveItem = useCallback((match) => {
        if (liveMarketFilter === "all") return true;
        if (liveMarketFilter === "best") return isBestSignal(match);
        return marketCategoryFor(match) === liveMarketFilter;
      }, [liveMarketFilter, marketCategoryFor, isBestSignal]);

      const filteredOpportunities = useMemo(
        () => (opportunities || []).filter(filterLiveItem),
        [opportunities, filterLiveItem]
      );

      const bestOpportunity = useMemo(
        () => filteredOpportunities?.[0] || null,
        [filteredOpportunities]
      );

      const otherOpportunities = useMemo(() => {
        if (!bestOpportunity) return filteredOpportunities || [];
        const bestId = String(bestOpportunity.id);
        return (filteredOpportunities || []).filter((o) => String(o.id) !== bestId);
      }, [filteredOpportunities, bestOpportunity]);

      const liveMatchesWithoutOpportunities = useMemo(() => {
        const allOppIds = new Set((opportunities || []).map((o) => String(o.id)));
        return (liveMatches || [])
          .filter((m) => !allOppIds.has(String(m.id)))
          .filter(filterLiveItem);
      }, [liveMatches, opportunities, filterLiveItem]);

      const marketCounts = useMemo(() => {
        const source = [...(opportunities || []), ...(liveMatches || []).filter((m) => !(opportunities || []).some((o) => String(o.id) === String(m.id)))];
        return {
          all: source.length,
          corners: source.filter((m) => marketCategoryFor(m) === "corners").length,
          shots: source.filter((m) => marketCategoryFor(m) === "shots").length,
          fouls: source.filter((m) => marketCategoryFor(m) === "fouls").length,
          best: source.filter(isBestSignal).length,
        };
      }, [opportunities, liveMatches, marketCategoryFor, isBestSignal]);

      const clearNotifications = async () => {
        try {
          const ids = notifications.filter(n => !n.read).map(n => n.id);
          if (!ids.length) return;
          await fetch(`${EDGE_FUNCTION_URL}/notifications/mark-read`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ notification_ids: ids, user_id: userId })
          });
          setNotifications((prev) => prev.map((n) => ({ ...n, read: true })));
        } catch (e) {
          console.error(e);
        }
      };

      // ✅ ouvrir détail historique via ID (clic notif)
      const openPredictionById = useCallback(async (predictionId) => {
        if (!predictionId) return;

        const local = (history || []).find(h => String(h.id) === String(predictionId));
        if (local) {
          setSelectedPrediction(local);
          return;
        }

        try {
          const res = await apiFetch(`/predictions/by-id?id=${encodeURIComponent(predictionId)}`);
          const data = await res.json();
          if (data?.prediction) setSelectedPrediction(data.prediction);
          else alert("Détail indisponible.");
        } catch (e) {
          console.error(e);
          alert("Impossible d’ouvrir le détail de cette prédiction.");
        }
      }, [history, apiFetch]);

      // ✅ Tabs sur PC
      const DesktopTabs = () => {
        const tabs = [
          { key: "live", label: "Live", count: stats.matches_live || liveMatches.length },
          { key: "upcoming", label: "À venir", count: stats.upcoming || scheduledMatches.length },
          { key: "history", label: "Historique" },
          { key: "notifications", label: "Notifications", count: unreadCount, danger: true },
        ];

        return (
          <div className="mx-live-tabs hidden md:grid">
            {tabs.map(t => {
              const active = selectedTab === t.key;
              return (
                <button
                  key={t.key}
                  onClick={() => setSelectedTab(t.key)}
                  className={`mx-live-tab ${active ? "is-active" : ""}`}
                  type="button"
                >
                  {t.label}
                  {safeNumber(t.count, 0) > 0 && <span className="mx-live-tab-count">{t.count}</span>}
                </button>
              );
            })}
          </div>
        );
      };

      if (error && !loading && !successfulLoad.current) {
        return (
          <div className="min-h-screen flex items-center justify-center px-4">
            <div className="text-center">
              <div className="text-red-500 text-xl mb-3">Erreur</div>
              <div className="text-gray-400 mb-4 safe-wrap">{error}</div>
              <button
                onClick={() => fetchAll(false)}
                className="px-4 py-2 bg-[#D4AF37] text-black rounded-lg font-bold"
                type="button"
              >
                Réessayer
              </button>
            </div>
          </div>
        );
      }

      return (
        <div className={`mx-live-shell min-h-screen mx-live-tab-${selectedTab}`}>
          <Header
            stats={stats}
            onBack={() => window.location.href = "index.html"}
            onRefresh={() => fetchAll(true)}
            refreshing={refreshing}
          />

          <main className="mx-live-main">
            {refreshing && !loading && <div className="mx-live-sync" role="status"><span className="mx-live-sync-dot" aria-hidden="true"></span> Synchronisation LIVE…</div>}
            {refreshWarning && !loading && !refreshing && <div className="mx-live-sync mx-live-sync--warning" role="status"><span className="mx-live-sync-dot" aria-hidden="true"></span> {refreshWarning}</div>}
            {!selectedMatch && !selectedPrediction && (
              <>
                <CompactHero
                  stats={stats}
                  bestSignalCount={marketCounts.best || 0}
                  upcomingCount={scheduledMatches.length || 0}
                />

                <DesktopTabs />

                {selectedTab === "live" && (
                  <LiveMarketFilters
                    value={liveMarketFilter}
                    onChange={setLiveMarketFilter}
                    counts={marketCounts}
                  />
                )}

                {loading ? (
                  <div dangerouslySetInnerHTML={{ __html: window.MXLoading.render(selectedTab === "history" ? "history" : selectedTab === "live" ? "live" : "matches", 3) }} />
                ) : (
                  <>
                    {/* ===========================
                        ONGLET LIVE
                       =========================== */}
                    {selectedTab === "live" && (
                      <>
                        <div className="mx-live-list mb-8">
                          {bestOpportunity && (
                            <OpportunityCard item={bestOpportunity} onOpen={setSelectedMatch} featured />
                          )}

                          {(otherOpportunities || []).map((item) => (
                            <OpportunityCard
                              key={item.id || `${item.home_team}-${item.away_team}-${item.current_minute}`}
                              item={item}
                              onOpen={setSelectedMatch}
                            />
                          ))}

                          {(liveMatchesWithoutOpportunities || []).map((m) => (
                            <MatchCard key={m.id} match={m} onOpen={setSelectedMatch} />
                          ))}

                          {!bestOpportunity && (otherOpportunities || []).length === 0 && (liveMatchesWithoutOpportunities || []).length === 0 && (
                            <EmptyState
                              title="Aucun match LIVE disponible"
                              subtitle="Le moteur attend des données suffisamment fiables avant d'afficher une opportunité."
                            />
                          )}
                        </div>

                        <section className="mx-live-how">
                          <div className="mx-live-how__heading">
                            <LiveAssetIcon name="target" size={40} />
                            <div>
                              <h2>Comment fonctionnent nos sélections LIVE ?</h2>
                              <p>Le moteur suit les statistiques du match et ne retient que les situations qui dépassent nos critères de fiabilité.</p>
                            </div>
                          </div>
                          <div className="mx-live-how__grid">
                            <article>
                              <LiveAssetIcon name="bars" size={38} />
                              <div><strong>Analyse en temps réel</strong><span>Suivi des corners, tirs, fautes et du rythme du match.</span></div>
                            </article>
                            <article>
                              <LiveAssetIcon name="target" size={38} />
                              <div><strong>Sélection des opportunités</strong><span>Seules les lignes qui gardent suffisamment de valeur sont proposées.</span></div>
                            </article>
                            <article>
                              <LiveAssetIcon name="stopwatch" size={38} />
                              <div><strong>Mise à jour continue</strong><span>Les données et signaux sont réévalués tout au long du match.</span></div>
                            </article>
                          </div>
                        </section>
                      </>
                    )}

                    {/* ===========================
                        ONGLET À VENIR
                       =========================== */}
                    {selectedTab === "upcoming" && (
                      <div className="mb-8">
                        <div className="mx-live-section-title">
                          <LiveAssetIcon name="ball" size={31} />
                          Matchs à venir
                        </div>

                        {scheduledMatches.length === 0 ? (
                          <EmptyState
                            title="Aucun match à venir"
                            subtitle="Aucun match programmé sur la période actuelle."
                          />
                        ) : (
                          <div className="grid gap-4 md:grid-cols-2 lg:grid-cols-3">
                            {scheduledMatches.slice(0, 24).map((m) => (
                              <UpcomingMatchCard key={m.id} match={m} />
                            ))}
                          </div>
                        )}
                      </div>
                    )}

                    {/* ===========================
                        ONGLET HISTORIQUE (cards style MatchCard)
                       =========================== */}
                    {selectedTab === "history" && (
                      <div>
                        <div className="mx-live-section-title">
                          <LiveAssetIcon name="pie" size={31} />
                          Historique des pronostics
                        </div>

                        {history.length === 0 ? (
                          <EmptyState
                            title="Aucun historique"
                            subtitle="Les validations apparaîtront ici dès qu'un pronostic sera créé."
                          />
                        ) : (
                          <div className="grid gap-4 md:grid-cols-2">
                            {history.map((h, i) => (
                              <HistoryMatchCard key={h.id || i} h={h} onOpen={setSelectedPrediction} />
                            ))}
                          </div>
                        )}
                      </div>
                    )}

                    {/* ===========================
                        ONGLET NOTIFICATIONS (cards + click => detail)
                       =========================== */}
                    {selectedTab === "notifications" && (
                      <NotificationsPanel
                        notifications={notifications}
                        unreadCount={unreadCount}
                        onClear={clearNotifications}
                        onOpenPrediction={openPredictionById}
                      />
                    )}
                  </>
                )}
              </>
            )}

            {selectedMatch && (
              <MatchDetail
                match={selectedMatch}
                onClose={() => setSelectedMatch(null)}
              />
            )}

            {selectedPrediction && (
              <PredictionDetail
                item={selectedPrediction}
                onClose={() => setSelectedPrediction(null)}
              />
            )}
          </main>

          <LiveFooter />

          <MobileBottomTabs
            selectedTab={selectedTab}
            setSelectedTab={setSelectedTab}
            unreadCount={unreadCount}
            upcomingCount={scheduledMatches.length}
            liveCount={stats.matches_live || liveMatches.length}
          />

          {toast && (
            <div className="fixed top-4 right-3 left-3 md:left-auto md:right-4 z-50 md:w-full md:max-w-sm bg-[#121212] border border-[#2b2b2b] border-l-4 border-[#D4AF37] rounded-2xl shadow-2xl p-4">
              <div className="flex items-start gap-3">
                <div className="w-9 h-9 rounded-xl bg-[#D4AF37]/12 border border-[#D4AF37]/25 flex items-center justify-center shrink-0">
                  <UiIcon name="bell" className="text-[#D4AF37]" />
                </div>
                <div className="flex-1 min-w-0">
                  <div className="font-bold text-sm">{toast.title}</div>
                  <div className="text-xs text-gray-300 mt-1 whitespace-pre-line safe-wrap">{toast.message}</div>
                </div>
                <button onClick={() => setToast(null)} className="text-gray-500 hover:text-white shrink-0" type="button">
                  <UiIcon name="x" />
                </button>
              </div>
            </div>
          )}
        </div>
      );
    };

    // =======================================================
    // RENDER (accès LIVE direct, sans partage)
    // =======================================================
    class LiveErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { error: null };
      }

      static getDerivedStateFromError(error) {
        return { error };
      }

      componentDidCatch(error, info) {
        console.error("Erreur React LIVE:", error, info);
      }

      render() {
        if (this.state.error) {
          return (
            <div className="min-h-screen flex items-center justify-center px-4 py-10 bg-[#090909]">
              <div className="w-full max-w-xl rounded-3xl border border-red-500/40 bg-[#121212] p-6 shadow-2xl">
                <div className="text-red-500 text-2xl font-extrabold mb-3">Erreur d’affichage LIVE</div>
                <div className="text-gray-300 safe-wrap mb-5">
                  {this.state.error?.message || "Une erreur React empêche l’affichage de la page."}
                </div>
                <button
                  type="button"
                  onClick={() => window.location.reload()}
                  className="px-5 py-3 rounded-full bg-[#D4AF37] text-black font-extrabold"
                >
                  Recharger la page
                </button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    try {
      if (!window.React) throw new Error("React n’est pas chargé.");
      if (!window.ReactDOM || typeof window.ReactDOM.createRoot !== "function") {
        throw new Error("ReactDOM n’est pas chargé correctement.");
      }

      const rootElement = document.getElementById("root");
      if (!rootElement) throw new Error("Élément #root introuvable.");

      ReactDOM.createRoot(rootElement).render(
        <LiveErrorBoundary>
          <App />
        </LiveErrorBoundary>
      );
    } catch (error) {
      console.error("Erreur de démarrage LIVE:", error);
      showBootError(error?.message || String(error));
    }
  </script>
</body>
</html>
